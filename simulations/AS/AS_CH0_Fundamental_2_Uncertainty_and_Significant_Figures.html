/* ══ BASE ══ */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  padding:6px 10px;display:flex;flex-direction:column;align-items:center;
  transition:background .3s,color .3s}
.container{max-width:1680px;width:100%;height:100%;display:flex;flex-direction:column;min-height:0}
button,select,input{font-family:inherit}

/* ══ HEADER (45 px — set by .brand) ══ */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px;flex:0 0 auto}
.top-bar h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge-top{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 8px;border-radius:12px;
  background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent)}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.theme-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:8px;
  cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;min-width:110px}
.brand{background:#F4C01E;border-radius:10px;padding:7px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center}
.brand img{height:31px;width:auto;display:block}
@media(max-width:640px){.brand{display:none}}

/* ══ MODE TABS + EXAMPLE PILLS ══ */
.modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:0 0 34px;margin-bottom:4px}
.mtab{border:1px solid var(--border);background:var(--card);color:var(--text-dim);border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;white-space:nowrap}
.mtab .n{font-family:'JetBrains Mono',monospace;font-size:11px;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;
  border:1px solid currentColor}
.mtab:hover{color:var(--text)}
.mtab.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.pillbar{position:relative;flex:0 0 32px;margin-bottom:4px}
.pillgrp{position:absolute;top:0;height:32px;display:flex;gap:4px;align-items:center;background:var(--card);border:1px solid var(--border);
  border-radius:18px;padding:3px}
.xpill{border:none;background:transparent;color:var(--text-dim);font-size:12px;padding:4px 11px;border-radius:14px;cursor:pointer;white-space:nowrap;height:24px}
.xpill:hover{color:var(--text)}
.xpill:focus-visible,.btn:focus-visible,.tg:focus-visible,.mtab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.xpill.active{background:var(--accent);color:var(--bg);font-weight:600}
.xpill.trap{color:var(--amber)}
.xpill.trap.active{background:var(--amber);color:var(--bg)}
.xpill i{font-style:italic;font-family:'KaTeX_Math','Times New Roman',serif;font-size:14px}

/* ══ TOOLBAR (2 rows) ══ */
.toolbar{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:4px 10px;margin-bottom:6px}
.trow{height:32px;display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap}
.tgroup{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.tgroup+.tgroup{padding-left:10px;border-left:1px solid var(--border)}
.tlabel{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.btn{border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;padding:0 10px;height:26px;border-radius:7px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent-glow);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn:disabled{opacity:.4;pointer-events:none}
.stack{display:inline-grid}.stack>span{grid-area:1/1;visibility:hidden;text-align:center}.stack>span.v{visibility:visible}
.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:2px}
.seg .sp{border:none;background:transparent;color:var(--text-dim);font-size:11.5px;padding:0 9px;height:22px;border-radius:11px;cursor:pointer;white-space:nowrap}
.seg .sp.active{background:var(--accent);color:var(--bg);font-weight:600}
.seg .sp.okc.active{background:var(--ok);color:var(--bg)}
.seg .sp.failc.active{background:var(--fail);color:#fff}
.tin{height:26px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:7px;padding:0 8px;
  font-family:'JetBrains Mono',monospace;font-size:12px;outline:none}
.tin:focus{border-color:var(--accent)}
.tin.bad{border-color:var(--red);color:var(--red)}
.tin.good{border-color:var(--ok)}
.tsel{height:26px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:7px;padding:0 4px;font-size:12px;outline:none;cursor:pointer}
.tval{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent)}
.tg{border:1px solid var(--border);background:var(--bg);color:var(--text-dim);font-size:12px;height:26px;padding:0 9px;border-radius:7px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px}
.tg.on{color:var(--accent);border-color:var(--accent);background:var(--accent-glow)}
.speed .sp{min-width:36px}
.spacer{flex:1 1 auto}
.score{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim)}

/* ══ STAGE: canvas 70 / panel 30 ══ */
.stage{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,3fr);gap:8px}
.cvwrap{position:relative;min-height:0;min-width:0;overflow:hidden}
.cvbox{position:absolute;left:0;top:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--cv-bg)}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:default}
#cv.zoomed{cursor:grab}
#cv.panning{cursor:grabbing}
.chip{position:absolute;font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;border-radius:8px;
  background:var(--card);border:1px solid var(--border);color:var(--text-dim);pointer-events:none;line-height:1.45}
.chip:empty{display:none}
#zoomChip{top:8px;right:8px;color:var(--accent);border-color:var(--accent)}
#hintChip{bottom:8px;right:8px;text-align:right;font-size:10.5px;opacity:.92}
/* draggable formula card */
.fcard{position:absolute;min-width:220px;max-width:62%;background:var(--card);border:1px solid var(--accent);border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.28);user-select:none;z-index:3}
.fcard .fh{display:flex;align-items:center;justify-content:center;gap:7px;padding:5px 10px;border-bottom:1px solid var(--border);cursor:grab;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.2px;color:var(--accent);font-weight:600}
.fcard .fh:active{cursor:grabbing}
/* keypad / scientific calculator card */
.kcard{position:fixed;min-width:0;width:262px;max-width:none;z-index:20;outline:none}
.kcard.calc{width:320px}
.kcard:focus-within,.kcard:focus{box-shadow:0 0 0 2px var(--accent-glow),0 8px 24px rgba(0,0,0,.35)}
.kcard .kb{padding:8px}
.kdisp{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:4px 8px;margin-bottom:6px;min-height:48px}
.kexpr{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-dim);min-height:18px;word-break:break-all;text-align:right}
.kres{font-family:'KaTeX_Main','Times New Roman',serif;font-size:20px;color:var(--text);text-align:right;min-height:26px;overflow-x:auto;overflow-y:hidden}
.kres.err{color:var(--red);font-family:'JetBrains Mono',monospace;font-size:13px}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.kgrid.c6{grid-template-columns:repeat(6,1fr)}
.kgrid button{height:28px;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:6px;cursor:pointer;
  font-family:'KaTeX_Main','Times New Roman',serif;font-size:15px;padding:0}
.kgrid button:hover{border-color:var(--accent);color:var(--accent)}
.kgrid button.fn{color:var(--accent);font-size:14px}
.kgrid button.ctl{color:var(--amber);font-family:'Inter',sans-serif;font-size:11px;font-weight:700}
.kgrid button.go{background:var(--accent);color:var(--bg);border-color:var(--accent);font-family:'Inter',sans-serif;font-size:12px;font-weight:700}
.kgrid button.unit{font-size:16px}
.kgrid button.sup{font-family:'Inter',sans-serif;font-size:14px;line-height:1;color:var(--accent)}
.kgrid button.sup i{font-style:normal;color:var(--text-muted);font-size:12px}
.kgrid button.sup sup{font-size:11px;font-weight:700}
.kgrid .s2{grid-column:span 2}
.kgrid .s6{grid-column:span 6}
.kgrid .s3{grid-column:span 3}
[hidden]{display:none!important}
.kexpr{cursor:text}
.ksend{display:flex;align-items:center;gap:6px;margin:6px 0 4px}
.ksend label{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;white-space:nowrap}
.ksend input{flex:1;min-width:0;height:30px;font-family:'JetBrains Mono',monospace;font-size:14px;text-align:right}
.kgrid button.pmk{font-family:'KaTeX_Main','Times New Roman',serif;font-size:18px;color:var(--accent)}
.kgrid button.nav{color:var(--text-dim);font-size:13px}
.kgrid button.sm{font-family:'KaTeX_Main','Times New Roman',serif;font-size:14px}
.kgrid button sup{font-size:.7em}
.sym.hl{background:var(--accent-glow);border-radius:7px;padding:2px 8px;margin:0 -8px}.sym.hl span{color:var(--accent);font-weight:700}.sym.hl .u{color:var(--accent)}
.scard{width:300px;position:fixed;max-width:none;z-index:19}
.scard .sb{padding:6px 11px 8px;font-size:11.5px;line-height:1.4;color:var(--text)}
.scard .sh{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--text-muted);margin:8px 0 2px}
.scard .sh:first-child{margin-top:0}
.scard .nm{font-size:14px;font-weight:700}
.scard .fr{display:inline-block;margin:2px 0;padding:1px 7px;border-radius:6px;background:var(--accent-glow);color:var(--accent);font-weight:700}
.btn.today{color:var(--amber);border-color:var(--amber)}
.kgrid button.frk{display:flex;align-items:center;justify-content:center}
.frl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.frl i{display:block;width:7px;height:7px;border:1.4px solid currentColor;border-radius:1.5px}
.frl b{display:block;width:13px;height:0;border-top:1.6px solid currentColor}
.kexpr .katex{font-size:1.15em}
.kexpr{overflow-x:auto;overflow-y:hidden;white-space:nowrap;min-height:30px;padding:2px 0;color:var(--katex-color)}
.qa{margin:6px 0;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card)}.qa summary{cursor:pointer;line-height:1.45}.qa[open] summary{color:var(--accent)}.qa div{margin-top:6px;color:var(--text-dim);line-height:1.5}
.knote{font-size:11px;color:var(--amber);text-align:right;min-height:14px}
.khelp{font-size:10px;color:var(--text-muted);margin-top:6px;line-height:1.35}
.grip{display:grid;grid-template-columns:repeat(3,3px);gap:2px}
.grip i{width:3px;height:3px;border-radius:50%;background:var(--accent);display:block}
.fcard .fb{padding:8px 12px;font-size:14px;color:var(--katex-color);line-height:1.9}
.fcard .fb .katex{font-size:1.08em}

/* ══ SIDE PANEL ══ */
.panel{min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border);flex:0 0 auto}
.ptab{border:none;background:transparent;color:var(--text-dim);font-size:11.5px;padding:8px 2px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.ptab:hover{color:var(--text)}
.ptab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.pbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 12px 14px;font-size:12.5px;line-height:1.5}
.ptools{display:flex;justify-content:flex-end;gap:6px;margin-bottom:4px}
.ptools button{border:1px solid var(--border);background:var(--bg);color:var(--text-dim);font-size:10.5px;padding:2px 8px;border-radius:6px;cursor:pointer}
.ptools button:hover{color:var(--accent);border-color:var(--accent)}
.sec{margin-bottom:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card2)}
.sec-h{width:100%;display:flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--text);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;padding:6px 9px;cursor:pointer;text-align:left}
.sec-h .chev{display:inline-block;transition:transform .15s;color:var(--text-muted);font-size:10px}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.sec-b{padding:4px 10px 9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:baseline}
.kv .k{color:var(--text-dim);font-size:11.5px}
.kv .v{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);text-align:right}
.kv .v.acc{color:var(--accent)}
.sym{display:grid;grid-template-columns:64px 1fr auto;gap:2px 8px;align-items:baseline;padding:2px 0;border-bottom:1px dashed var(--border)}
.sym:last-child{border-bottom:none}
.sym.wide .s{grid-column:1/-1}
.sym.wide>span:nth-child(2){grid-column:2}
.sym.wide>.u{grid-column:3}
.sym .s{font-family:'KaTeX_Math','Times New Roman',serif;font-style:italic;font-size:16px;color:var(--accent)}
.sym .s.up{font-style:normal;font-family:'KaTeX_Main','Times New Roman',serif}
.sym .u{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);text-align:right}
.tex{overflow-x:auto;overflow-y:hidden;padding:3px 0;color:var(--katex-color)}
.tex .katex{font-size:1.05em}
ol.steps{padding-left:20px}
ol.steps li{margin:3px 0}
.note{border-left:3px solid var(--amber);padding:4px 8px;background:var(--bg);border-radius:4px;margin:6px 0;font-size:12px}
.qtext{font-style:italic;color:var(--text);padding:6px 8px;border-radius:6px;background:var(--bg);border:1px dashed var(--border)}
.verdict-ok{color:var(--ok);font-weight:700}.verdict-bad{color:var(--fail);font-weight:700}
.muted{color:var(--text-muted)}
.mk{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:4px}

/* ══ BOTTOM BAR ══ */
.bottombar{flex:0 0 30px;margin-top:6px;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden}
.bottombar b{color:var(--text);font-weight:600}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--border);display:block}
.dots i.on{background:var(--accent)}
@media(max-width:1180px){.tlabel.opt{display:none}.xpill{padding:4px 8px}}
</style>
<style>
/* ══ this lab ══ */
.tgroup[data-ctx]{display:none}
.tgroup[data-ctx].show{display:flex}
.pm{font-family:'KaTeX_Main','Times New Roman',serif;font-size:16px;color:var(--text-dim)}
.unitlbl{font-family:'KaTeX_Main','Times New Roman',serif;font-size:14px;color:var(--text-dim);min-width:34px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--fail)}.fb-near{color:var(--amber)}
.eqbox{overflow-x:auto;overflow-y:hidden;padding:4px 2px;color:var(--katex-color)}
.eqbox .katex-display{margin:0;text-align:left}
.qp{line-height:1.5;margin:4px 0}
.qpart{border:1px solid var(--border);border-radius:8px;padding:6px 9px;margin:6px 0;background:var(--card)}
.qpart.cur{border-color:var(--accent)}
.qpart .ql{font-weight:700;color:var(--accent);margin-right:6px}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--accent);color:var(--accent);margin:2px 3px 2px 0}
.added{border-left:3px solid var(--amber);padding:4px 8px;margin:6px 0;font-size:11.5px;color:var(--text-dim);background:var(--bg);border-radius:4px}
table.dt{border-collapse:collapse;width:100%;font-family:'JetBrains Mono',monospace;font-size:11.5px}
table.dt td,table.dt th{border-bottom:1px dashed var(--border);padding:2px 4px;text-align:right}
table.dt th{color:var(--text-muted);font-weight:600}
table.dt tr.hl td{color:var(--accent);font-weight:700}
.sl{display:flex;align-items:center;gap:6px}
.sl .sl-t{cursor:pointer;user-select:none;font-family:'KaTeX_Math','Times New Roman',serif;font-style:italic;font-size:15px;color:var(--text);display:inline-flex;align-items:center}
.sl .sl-t:hover{color:var(--accent)}
.sl .tg2{display:inline-block;width:20px;height:11px;margin-left:5px;border-radius:6px;background:var(--border);position:relative;transition:background .15s}
.sl .tg2::after{content:'';position:absolute;top:1px;left:1px;width:9px;height:9px;border-radius:50%;background:#fff;transition:left .15s}
.sl.typed .tg2{background:var(--accent)}
.sl.typed .tg2::after{left:10px}
.sl .mid{width:110px;display:inline-flex;align-items:center}
.sl .mid input[type=range]{width:100%;accent-color:var(--accent)}
.sl .mid .tin{width:100%;text-align:right}
.sl .tval{min-width:56px}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════
   CORE — the mathematics of uncertainty (pure functions, no DOM)
   ═══════════════════════════════════════════════════════════════ */
const MATHS = {};

/* ── significant figures & decimal places of a written number ── */
function cleanNum(s){ return String(s).trim().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/^\+/,''); }
function sfOf(s){                                  // trailing zeros of an integer with no point are not counted (ambiguous → fewest)
  s = cleanNum(s).replace(/^-/,'');
  let m = s.split(/[eE]/)[0];
  if (m.includes('.')){ const d = m.replace('.','').replace(/^0+/,''); return Math.max(1, d.length); }
  const d = m.replace(/^0+/,'').replace(/0+$/,''); return Math.max(1, d.length);
}
function dpOf(s){ s = cleanNum(s).split(/[eE]/)[0]; const i = s.indexOf('.'); return i < 0 ? 0 : s.length - i - 1; }
const mag = x => x===0 ? 0 : Math.floor(Math.log10(Math.abs(x)) + 1e-12);
function roundTo(x, place){                        // place = power of ten of the last kept digit (−1 → 0.1)
  const f = Math.pow(10, -place), v = Math.round((Math.abs(x) * f) * (1 + 1e-12)) / f;
  return Math.sign(x) * v;
}
function fmtPlace(x, place){                      // text with exactly the digits down to 10^place
  const v = roundTo(x, place);
  if (place >= 0) return String(Math.round(v));
  return v.toFixed(-place);
}
const sfPlace = (x, n) => mag(x) - n + 1;          // place of the last digit when x is written to n s.f.
const fmtSF = (x, n) => { if (x===0) return '0'; let p = sfPlace(x, n); const r = roundTo(x, p); if (mag(r) > mag(x)) p = sfPlace(r, n); return fmtPlace(x, p); };
const fmtDP = (x, n) => fmtPlace(x, -n);

/* ── report a result: the lecture's rule, then the 1-s.f. mark-scheme check ──
   rule 'sf' (× ÷ powers): value to the least s.f. of the inputs; uncertainty to the same decimal place as the value.
   rule 'dp' (+ −): value to the least d.p. of the inputs; uncertainty to the same decimal place. */
function reportLecture(val, unc, rule, n){
  let place = rule==='dp' ? -n : sfPlace(val, n);
  const rv = roundTo(val, place); if (rule!=='dp' && mag(rv) > mag(val)) place = sfPlace(rv, n);
  let ru = roundTo(unc, place), widened = false;
  if (ru === 0){ widened = true; place = mag(unc); ru = roundTo(unc, place); }        // never quote ± 0: keep its first figure
  return {v: fmtPlace(val, place), u: fmtPlace(unc, place), place, widened};
}
function report1sf(val, unc){                      // uncertainty to 1 s.f., value to the same decimal place
  let place = mag(unc); const ru = roundTo(unc, place); if (mag(ru) > mag(unc)) place = mag(ru);
  return {v: fmtPlace(val, place), u: fmtPlace(unc, place), place};

/* scientific form for very big / small numbers: (1.3 ± 0.1) × 10⁴ */

  const dv = dpOf(vs) + e, k = Math.max(0, dv);

/* ── the three forms ── */
const relOf = (x, dx) => dx / Math.abs(x);
const pctOf = (x, dx) => 100 * dx / Math.abs(x);
const pct2 = p => Number(fmtSF(p, 2));            // the lecture writes every percentage to 2 s.f. (1.9 %, 4.2 %, 6.1 %)

/* ── combining (lecture method) ── */
function combine(op, A, B, pw=2){                 // pw: the power used by sq (x², x³) and sqrt (√x, ∛x)
  // A, B = {v, d, s (written string), ds}
  const pA = pct2(pctOf(A.v, A.d)), pB = B ? pct2(pctOf(B.v, B.d)) : 0;
  let val, unc, pct, rule, n, kind;

    case '+': val = A.v + B.v; unc = A.d + B.d; kind = 'abs'; rule = 'dp'; n = Math.min(dpOf(A.s), dpOf(B.s)); break;
    case '-': val = A.v - B.v; unc = A.d + B.d; kind = 'abs'; rule = 'dp'; n = Math.min(dpOf(A.s), dpOf(B.s)); break;
    case '*': val = A.v * B.v; pct = pct2(pA + pB); kind = 'pct'; rule = 'sf'; n = Math.min(sfOf(A.s), sfOf(B.s)); break;
    case '/': val = A.v / B.v; pct = pct2(pA + pB); kind = 'pct'; rule = 'sf'; n = Math.min(sfOf(A.s), sfOf(B.s)); break;

/* ── statistics ── */
function stats(xs){
  const N = xs.length, mean = xs.reduce((a,b)=>a+b,0)/N;
  const ss = xs.reduce((a,x)=>a+(x-mean)**2, 0), sd = N > 1 ? Math.sqrt(ss/(N-1)) : 0;
  const mx = Math.max(...xs), mn = Math.min(...xs);
  return {N, mean, ss, sd, se: sd/Math.sqrt(N), max: mx, min: mn, half: (mx-mn)/2};

/* ── straight-line graph: least squares + worst acceptable lines through the end error bars ── */
function fitLine(P){                               // P = [{x,y,dy}]

  const sxx = P.reduce((a,p)=>a+p.x*p.x,0), sxy = P.reduce((a,p)=>a+p.x*p.y,0);

  return {m, c, mMax, cMax, mMin, cMin, dm: (mMax - mMin)/2, dc: Math.abs(cMin - cMax)/2};

const lineFits = (P, m, c) => P.every(p => Math.abs(m*p.x + c - p.y) <= p.dy + 1e-9);

/* ── deterministic pseudo-random (so a re-opened file shows the same numbers) ── */

/* ═══════════════════════════════════════════════════════════════
   MODE 3 — the ten questions of Uncertainty.pdf (text verbatim) with worked solutions

   ═══════════════════════════════════════════════════════════════ */

/* ── checking a typed answer ──
   → {lvl:'ok'|'near'|'bad'|'empty', msg} */
function checkPart(P, input){
  const s = (input||'').trim();
  if (!s) return {lvl:'empty', msg:'Type an answer first.'};
  const A = P.ans;
  if (P.kind==='text'){
    const low = s.toLowerCase(), hit = A.keys.filter(g => g.some(k => low.includes(k)));
    if (hit.length===A.keys.length) return {lvl:'ok', msg:'Key idea present. Compare with the model answer.'};
    return {lvl:'near', msg:'Not quite — read the model answer under ! Steps.'};
  }
  if (P.kind==='num'){
    const v = parseNum(s);
    if (!isFinite(v)){ const pm = parsePM(s); if (pm) return {lvl:'near', msg:'Only a single number is asked for here.'}; return {lvl:'bad', msg:'That is not a number I can read.'}; }
    const inRange = A.min!=null ? (v >= A.min - 1e-12 && v <= A.max + 1e-12) : near(v, A.v, A.tol);
    if (inRange || (A.alts||[]).some(a => near(v, a, 1e-9))) return {lvl:'ok', msg:'Correct.'};
    const ref = A.min!=null ? (A.min + A.max)/2 : A.v;
    if (near(v, ref, 0.12)) return {lvl:'near', msg:'Close — check the working and rounding.'};
    if (near(v*1000, ref, 0.02) || near(v/1000, ref, 0.02) || near(v*100, ref, 0.02) || near(v/100, ref, 0.02)) return {lvl:'near', msg:'Right digits, wrong power of ten — check the units / prefixes.'};
    return {lvl:'bad', msg:'Not correct — try ! Steps.'};
  }
  // value ± uncertainty
  const p = parsePM(s);
  if (!p){ const v = parseNum(s); return {lvl: isFinite(v) ? 'near' : 'bad', msg: isFinite(v) ? 'Give the value AND its uncertainty: value ± uncertainty.' : 'Write it as value ± uncertainty (e.g. 2.7 ± 0.2).'}; }
  if (A.range){ const r = A.range;
    if (p.v >= r.vmin && p.v <= r.vmax && p.u >= r.umin - 1e-12 && p.u <= r.umax + 1e-12){
      return {lvl:'ok', msg:'Correct.'}; } }
  const exact = A.forms.find(f => near(p.v, f.v, 1e-9) && near(p.u, f.u, 1e-9));
  if (exact) return {lvl:'ok', msg: A.forms.length > 1 && exact!==A.forms[0] ? 'Correct (lecture rule: least s.f.). The 1-s.f. form is ' + P.show + '.' : 'Correct.'};
  const f0 = A.forms[0];
  if (near(p.v, f0.v, 0.03) && p.u > 0 && Math.abs(p.u - f0.u) <= f0.u*0.6) return {lvl:'near', msg:'Right numbers — now round: uncertainty to 1 s.f., value to the same decimal place.'};
  return {lvl:'bad', msg:'Not correct — try ! Steps.'};
}

/* ── rich maths text: letters italic, ^{..} superscript, _{..} subscript ── */
function parseRich(str, upright){
  const segs = []; let i = 0;
  const grab = () => {
    if (str[i]==='{'){ const j = str.indexOf('}', i); const g = str.slice(i+1, j); i = j+1; return g; }
    if (str[i]==='-'){ const g = str.slice(i, i+2); i += 2; return g; }
    return str[i++];
  };
  while (i < str.length){
    const ch = str[i];
    if (ch==='^' || ch==='_'){ i++; const g = grab(); segs.push({t:g.replace(/-/g,'−'), it:false, lvl: ch==='^'?1:-1}); continue; }
    if (ch==='«'){ const j = str.indexOf('»', i); [...str.slice(i+1, j)].forEach(c => segs.push(c===' ' ? {t:' ', sp:true} : {t:c, it:false, lvl:0})); i = j + 1; continue; }
    if (ch===' '){ segs.push({t:' ', sp:true}); i++; continue; }
    const it = !upright && /[A-Za-zα-ωΑ-ΩΔ]/.test(ch) && ch!=='Δ';
    segs.push({t: ch==='-' ? '−' : ch, it, lvl:0}); i++;
  }
  return segs;
}
function segFont(sg, fs, face){ const f = sg.lvl ? fs*0.68 : fs; return face ? face(f) : sg.it ? F_IT(f) : F_UP(f); }
function richW(segs, fs, face){ let w = 0; for (const sg of segs){ if (sg.sp){ w += face ? tw(' ', face(fs)) : fs*0.24; continue; } w += tw(sg.t, segFont(sg,fs,face)); } return w; }
function drawRich(segs, x, y, fs, col, align='left', face){
  const w = richW(segs, fs, face);
  if (align==='center') x -= w/2; else if (align==='right') x -= w;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const sg of segs){
    if (sg.sp){ x += face ? tw(' ', face(fs)) : fs*0.24; continue; }
    ctx.font = segFont(sg, fs, face); ctx.fillStyle = col;
    ctx.fillText(sg.t, x, y + (sg.lvl===1 ? -fs*0.42 : sg.lvl===-1 ? fs*0.2 : 0));
    x += ctx.measureText(sg.t).width;

}

const ERR = {R:148, cy:282, xs:[300, 900], sysOff:{x:52, y:-40}, sysSig:9, rndSig:46, pxPerMm:10, max:60};
function errNoise(seed){ const r = rng(seed), out = []; for (let i=0;i<ERR.max;i++) out.push({sx:gauss(r), sy:gauss(r), rx:gauss(r), ry:gauss(r)}); return out; }
function errShots(){
  const E = S.m1.err, off = E.cal ? {x:0, y:0} : ERR.sysOff;
  const n = E.n, sys = [], rnd = [];
  for (let i=0;i<n;i++){ const z = E.noise[i]; sys.push({x: off.x + ERR.sysSig*z.sx, y: off.y + ERR.sysSig*z.sy}); rnd.push({x: ERR.rndSig*z.rx, y: ERR.rndSig*z.ry}); }

const meanPt = P => P.length ? {x: P.reduce((a,p)=>a+p.x,0)/P.length, y: P.reduce((a,p)=>a+p.y,0)/P.length} : null;
function missTrace(P){ const out = []; let sx = 0, sy = 0; P.forEach((p,i) => { sx += p.x; sy += p.y; out.push(Math.hypot(sx/(i+1), sy/(i+1))/ERR.pxPerMm); }); return out; }
/* accuracy = how close the MEAN is to the true value (centre); precision = how close the readings are to EACH OTHER (spread) */
const AP = {acc:2.0, prec:3.0};                                  // demo thresholds in mm
function apStats(P){
  if (!P.length) return null;
  const m = meanPt(P), miss = Math.hypot(m.x, m.y)/ERR.pxPerMm;
  const spread = P.length > 1 ? Math.sqrt(P.reduce((a, p) => a + (p.x - m.x)**2 + (p.y - m.y)**2, 0)/(P.length - 1))/ERR.pxPerMm : null;
  return {m, miss, spread, acc: miss < AP.acc, prec: spread != null ? spread < AP.prec : null};
}

/* ═══════════════════════════════════════════════════════════════
   MODE 1.2 — writing the uncertainty of ONE instrument reading
   ═══════════════════════════════════════════════════════════════ */
const INST = {
  ruler:  {name:'Metre rule (mm scale)', unit:'mm', div:'1 mm', d:0.5, dp:1, analog:true,  make: r => ({v: 40 + Math.floor(r()*96)})},
  vernier:{name:'Vernier caliper', unit:'cm', div:'0.01 cm (vernier)', d:0.01, dp:2, analog:true, vernier:true, make: r => ({v: Math.round((1.2 + r()*3.6)*100)/100})},
  watch:  {name:'Analogue stopwatch', unit:'s', div:'0.2 s', d:0.1, dp:1, analog:true, make: r => ({v: Math.round((3 + r()*25)*5)/5})},
  balance:{name:'Digital balance', unit:'g', div:'last digit 0.01 g', d:0.01, dp:2, analog:false, make: r => ({v: Math.round((12 + r()*80)*100)/100})},
  volt:   {name:'Analogue voltmeter', unit:'V', div:'0.1 V', d:0.05, dp:2, analog:true, make: r => ({v: Math.round((0.6 + r()*4.2)*10)/10})}
};
function instReading(){ const I = S.m1.inst, def = INST[I.kind]; const r = rng(I.seed*7919 + I.kind.length*131); return def.make(r).v; }
const instAnswer = () => { const I = S.m1.inst, def = INST[I.kind], v = instReading(); return {v, vs: v.toFixed(def.dp), d: def.d, ds: String(def.d), unit: def.unit}; };
function checkInst(vs, ds){
  const A = instAnswer(), def = INST[S.m1.inst.kind];
  const v = parseNum(vs), d = parseNum(ds);
  if (!vs.trim() || !ds.trim()) return {lvl:'empty', msg:'Fill in both boxes: value ± uncertainty.'};
  if (!isFinite(v) || !isFinite(d)) return {lvl:'bad', msg:'Type numbers only — the unit is already shown.'};
  const tolV = def.analog && !def.vernier ? def.d + 1e-9 : 1e-9 + def.d*0.01;
  const vOK = Math.abs(v - A.v) <= tolV, dOK = Math.abs(d - A.d) < 1e-9;
  if (vOK && dOK){ if (dpOf(vs) !== dpOf(ds)) return {lvl:'near', msg:'Right reading and uncertainty — but write the value to the same decimal place as the uncertainty: ' + A.vs + ' ± ' + A.ds + ' ' + A.unit + '.'};
    return {lvl:'ok', msg:'Correct: ' + vs + ' ± ' + ds + ' ' + A.unit + '.'}; }
  if (vOK) return {lvl:'near', msg: def.analog ? (def.vernier ? 'Reading is right. A vernier is read to its least count, so Δ = ± 0.01 cm.' : 'Reading is right. Analogue scale → ± half the smallest division (' + def.div + ' → ± ' + A.ds + ' ' + A.unit + ').')
                                       : 'Reading is right. Digital display → ± 1 in the last digit (± ' + A.ds + ' ' + A.unit + ').'};
  if (dOK) return {lvl:'near', msg:'The uncertainty is right — read the scale again.'};
  return {lvl:'bad', msg:'Not yet — read the magnified scale, then use the rule in the card below.'};
}
function drawInst(){
  const I = S.m1.inst, def = INST[I.kind], A = instAnswer(), o = I, k = ease(stepOn(o, 1));
  card(24, 18, 768, 372, {r:14, fill: rgba(COL.card, .55)});
  text(def.name, 44, 44, F_UI(20, 800), COL.ink, 'left', 'middle');
  text(def.analog ? 'Analogue scale' : 'Digital display', 44 + tw(def.name, F_UI(20,800)) + 12, 44, F_UI(15, 600), def.analog ? COL.amber : COL.digital, 'left', 'middle');
  const reading = lerp(I.kind==='balance' ? 0 : A.v*0.15, A.v, k);
  ({ruler: drawRuler, vernier: drawVernier, watch: drawWatch, balance: drawBalance, volt: drawVolt})[I.kind](reading, k);
  // the rule card

function statData(){
  const T = S.m1.stat, r = rng(T.seed*104729 + (T.sub==='few' ? 3 : 7));
  if (T.sub==='few'){ const c = 15.2 + Math.round(r()*4)/10, xs = [];
    for (let i=0;i<4;i++) xs.push(Math.round((c + gauss(r)*0.17)*10)/10);
    if (Math.max(...xs) === Math.min(...xs)) xs[3] = Math.round((xs[3] + 0.2)*10)/10;
    return {xs, dp:1, unit:'s', what:'time for 10 oscillations', sym:'t', res:0.1}; }
  const c = 2.30 + Math.round(r()*30)/100, xs = [];
  for (let i=0;i<12;i++) xs.push(Math.round((c + gauss(r)*0.05)*100)/100);
  return {xs, dp:2, unit:'s', what:'time for a trolley to run down a ramp', sym:'t', res:0.01};
}
function statReport(){
  const D = statData(), st = stats(D.xs);

    const rep = report1sf(st.mean, half); return {D, st, unc: half, rep, method:'half the range'}; }
  return {D, st, unc: st.sd, rep: report1sf(st.mean, st.sd), method:'standard deviation'};
}

/* ═══ play loop ═══ */
let last = performance.now(), lastKey = '';
function frame(now){
  let dt = (now - last)/1000; last = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  const sdt = dt * S.speed; S.t += dt;
  const t = TL();
  if (t){
    const o = t.o, st = t.stage || STAGE_T;
    if (o.prog < o.step) o.prog = Math.min(o.step, o.prog + sdt/st); else if (o.prog > o.step) o.prog = o.step;
    if (S.playing && o.prog >= o.step){ o.dwell += sdt; if (o.dwell > DWELL){ o.dwell = 0; if (o.step < t.max) o.step++; else { S.playing = false; S.ended = true; } } }
  } else if (ctxKey()==='m0p0' && S.playing){                    // repeat the measurement: one reading every 0.22 s
    const E = S.m1.err; E.fireT += sdt;
    while (E.fireT > 0.22){ E.fireT -= 0.22; if (E.n < ERR.max) E.n++; if (E.n >= ERR.max){ S.playing = false; S.ended = true; break; } }
  }
  const key = uiKey();
  if (key !== lastKey){ lastKey = key; updateUI(); }
  draw();

}

function draw(){

  const s = VT.s * VT.dpr; ctx.setTransform(s,0,0,s,0,0);
  ctx.fillStyle = COL['cv-bg']; ctx.fillRect(0,0,W,H);
  const z = S.zoom; ctx.translate(z.cx*(1-z.k), z.cy*(1-z.k)); ctx.scale(z.k, z.k);
  try {
    ({m0p0:drawErr, m0p1:drawInst, m0p2:drawStats, m1p0:drawAB, m1p1:drawOps, m1p2:drawGraph, m1p3:drawReport, m2:drawM3})[ctxKey()]();
  } catch(err){ console.error(err); }
  ctx.setLineDash([]); ctx.globalAlpha = 1;

function toLogical(e){
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left)/VT.s, py = (e.clientY - r.top)/VT.s, z = S.zoom;
  return {x: (px - z.cx*(1-z.k))/z.k, y: (py - z.cy*(1-z.k))/z.k};
}

    if (CAL.err){ R.className = 'kres err'; R.textContent = CAL.err; }
    else if (CAL.shown && CAL.res!=null){ const f = calFmt(CAL.res); R.innerHTML = K('\\displaystyle ' + f.tex); N.textContent = f.note || ''; }
    else R.innerHTML = '';
  } else if (kpBuilt==='unit'){
    const v = kpTarget().value.trim(), p = parseUnits(v);
    $('kExpr').textContent = v || ' ';
    const r = $('kRes'); r.className = 'kres' + (p.err && v ? ' err' : '');
    r.innerHTML = !v ? '' : p.v ? (vzero(p.v) ? 'no unit' : vtxt(p.v)) : p.err==='named' ? 'use base units, not ' + p.tok : 'not a unit yet';
  }
}
function kpPress(k){
  if (kpBuilt==='calc') calKey(k);
  else {
    const t = kpTarget();
    if (k==='AC') t.value = '';
    else if (k==='DEL') t.value = t.value.replace(/\s+$/,'').replace(/(mol|kg|cd|none|[msAK]|⁻?[¹²³⁴⁵])$/,'').replace(/\s+$/,'') + (t.value.trim() ? ' ' : '');
    else if (k==='none') t.value = 'none';
    else if (/^[⁻²³⁴]/.test(k)) t.value = t.value.replace(/\s+$/,'') + k + ' ';
    else t.value = (t.value==='none' ? '' : t.value) + k;
    t.className = 'tin';
  }
  kpRefresh();
}
$('kcardB').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) kpPress(b.dataset.k); });
$('kcard').addEventListener('pointerdown', e => { if (e.target.id!=='kSend') $('kcard').focus({preventScroll:true}); });
/* click on the display → the nearest cursor slot */
$('kcardB').addEventListener('pointerdown', e => {
  const E = e.target.closest('#kExpr'); if (!E || kpBuilt!=='calc') return;
  let best = null, bd = 1e9;
  E.querySelectorAll('[id^="kp"]').forEach(m => { const r = m.getBoundingClientRect(), [sid, k] = m.id.slice(2).split('_').map(Number);
    const mid = r.top + r.height/2, dy = r.height ? Math.max(0, Math.abs(e.clientY - mid) - r.height/2) : Math.abs(e.clientY - r.top);
    const d = Math.abs(e.clientX - r.left) + 2.5*dy; if (d < bd){ bd = d; best = {s: SEQS.get(sid), i: k}; } });
  if (!best || !best.s) return;
  if (CAL.shown){ CAL.shown = false; CAL.err = null; CAL.eng = false; CAL.sd = false; }
  CAL.cur = best; kpRefresh.keepScroll = true; kpRefresh();
});
$('kcardB').addEventListener('input', e => { if (e.target.id==='kSend') SEND.pos = e.target.selectionStart; });
['keyup','click','select'].forEach(ev => $('kcardB').addEventListener(ev, e => { if (e.target.id==='kSend') SEND.pos = e.target.selectionStart; }));
$('kcard').addEventListener('keydown', e => {                       // physical keyboard while the card has focus
  if (kpBuilt!=='calc') return;
  if (e.target.id==='kSend'){ if (e.key==='Enter'){ e.preventDefault(); kpSend(); } e.stopPropagation(); return; }
  const map = {'Enter':'=','=':'=','Backspace':'DEL','Escape':'AC','Delete':'AC','ArrowLeft':'L','ArrowRight':'R','ArrowUp':'U','ArrowDown':'D',
               '+':'+','-':'−','*':'×','x':'×','/':'FRAC','^':'POW','(':'(',')':')','.':'.','e':'E10','E':'E10','p':'π'};
  let k = /^\d$/.test(e.key) ? e.key : map[e.key];
  if (!k) return;
  e.preventDefault(); e.stopPropagation(); kpPress(k);
});
document.querySelectorAll('.ansbox').forEach(el => { el.addEventListener('input', kpRefresh); el.addEventListener('focus', () => { S.kpTarget = el.id; }); });
document.querySelectorAll('.kp-tg').forEach(b => b.addEventListener('click', () => { S.keypad = !S.keypad; renderKeypad(); }));
function placeKeypad(){
  const c = $('kcard'); if (c.hidden) return;
  const w = c.offsetWidth, h = c.offsetHeight;
  let p = S.kpPos;
  if (!p){ const r = $('cvbox').getBoundingClientRect(); p = {x: r.left + 10, y: r.bottom - h - 10}; }   // default: bottom-left of the canvas
  c.style.left = clamp(p.x, 4, Math.max(4, innerWidth - w - 4)) + 'px';
  c.style.top  = clamp(p.y, 4, Math.max(4, innerHeight - h - 4)) + 'px';
}
(function(){
  const h = $('kcardH'); let drag = null;
  h.addEventListener('pointerdown', e => { const c = $('kcard'); drag = {x:e.clientX, y:e.clientY, l:c.offsetLeft, t:c.offsetTop}; h.setPointerCapture(e.pointerId); });
  h.addEventListener('pointermove', e => { if (!drag) return; const c = $('kcard');
    const l = clamp(drag.l + e.clientX - drag.x, 4, innerWidth - c.offsetWidth - 4), t = clamp(drag.t + e.clientY - drag.y, 4, innerHeight - c.offsetHeight - 4);
    c.style.left = l+'px'; c.style.top = t+'px'; S.kpPos = {x:l, y:t}; });
  h.addEventListener('pointerup', () => drag = null);
  h.addEventListener('dblclick', e => { S.kpPos = null; placeKeypad(); e.stopPropagation(); });
})();


/* ═══ boot ═══ */
readColors(); renderCtrls();
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('cvwrap'));
resize(); restartTL(); updateUI();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
if (document.fonts && document.fonts.load){
  Promise.all(['italic 20px KaTeX_Math','20px KaTeX_Main','600 14px Inter','14px JetBrains Mono'].map(f => document.fonts.load(f).catch(()=>null))).then(() => { draw(); });
}

</script>
