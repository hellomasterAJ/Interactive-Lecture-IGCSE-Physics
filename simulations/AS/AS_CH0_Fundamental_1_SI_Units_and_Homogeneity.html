/* ══ BASE ══ */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  padding:6px 10px;display:flex;flex-direction:column;align-items:center;
  transition:background .3s,color .3s}
.container{max-width:1680px;width:100%;height:100%;display:flex;flex-direction:column;min-height:0}
button,select,input{font-family:inherit}

/* ══ HEADER (45 px — set by .brand) ══ */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px;flex:0 0 auto}
.top-bar h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge-top{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 8px;border-radius:12px;
  background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent)}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.theme-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:8px;
  cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;min-width:110px}
.brand{background:#F4C01E;border-radius:10px;padding:7px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center}
.brand img{height:31px;width:auto;display:block}
@media(max-width:640px){.brand{display:none}}

/* ══ MODE TABS + EXAMPLE PILLS ══ */
.modebar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:0 0 34px;margin-bottom:4px}
.mtab{border:1px solid var(--border);background:var(--card);color:var(--text-dim);border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;white-space:nowrap}
.mtab .n{font-family:'JetBrains Mono',monospace;font-size:11px;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;
  border:1px solid currentColor}
.mtab:hover{color:var(--text)}
.mtab.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.pillbar{position:relative;flex:0 0 32px;margin-bottom:4px}
.pillgrp{position:absolute;top:0;height:32px;display:flex;gap:4px;align-items:center;background:var(--card);border:1px solid var(--border);
  border-radius:18px;padding:3px}
.xpill{border:none;background:transparent;color:var(--text-dim);font-size:12px;padding:4px 11px;border-radius:14px;cursor:pointer;white-space:nowrap;height:24px}
.xpill:hover{color:var(--text)}
.xpill:focus-visible,.btn:focus-visible,.tg:focus-visible,.mtab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.xpill.active{background:var(--accent);color:var(--bg);font-weight:600}
.xpill.trap{color:var(--amber)}
.xpill.trap.active{background:var(--amber);color:var(--bg)}
.xpill i{font-style:italic;font-family:'KaTeX_Math','Times New Roman',serif;font-size:14px}

/* ══ TOOLBAR (2 rows) ══ */
.toolbar{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:4px 10px;margin-bottom:6px}
.trow{height:32px;display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap}
.tgroup{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.tgroup+.tgroup{padding-left:10px;border-left:1px solid var(--border)}
.tlabel{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.btn{border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;padding:0 10px;height:26px;border-radius:7px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent-glow);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn:disabled{opacity:.4;pointer-events:none}
.stack{display:inline-grid}.stack>span{grid-area:1/1;visibility:hidden;text-align:center}.stack>span.v{visibility:visible}
.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:2px}
.seg .sp{border:none;background:transparent;color:var(--text-dim);font-size:11.5px;padding:0 9px;height:22px;border-radius:11px;cursor:pointer;white-space:nowrap}
.seg .sp.active{background:var(--accent);color:var(--bg);font-weight:600}
.seg .sp.okc.active{background:var(--ok);color:var(--bg)}
.seg .sp.failc.active{background:var(--fail);color:#fff}
.tin{height:26px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:7px;padding:0 8px;
  font-family:'JetBrains Mono',monospace;font-size:12px;outline:none}
.tin:focus{border-color:var(--accent)}
.tin.bad{border-color:var(--red);color:var(--red)}
.tin.good{border-color:var(--ok)}
.tsel{height:26px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:7px;padding:0 4px;font-size:12px;outline:none;cursor:pointer}
.tval{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent)}
.tg{border:1px solid var(--border);background:var(--bg);color:var(--text-dim);font-size:12px;height:26px;padding:0 9px;border-radius:7px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px}
.tg.on{color:var(--accent);border-color:var(--accent);background:var(--accent-glow)}
.speed .sp{min-width:36px}
.spacer{flex:1 1 auto}
.score{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim)}

/* ══ STAGE: canvas 70 / panel 30 ══ */
.stage{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,3fr);gap:8px}
.cvwrap{position:relative;min-height:0;min-width:0;overflow:hidden}
.cvbox{position:absolute;left:0;top:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--cv-bg)}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:default}
.chip{position:absolute;font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;border-radius:8px;
  background:var(--card);border:1px solid var(--border);color:var(--text-dim);pointer-events:none;line-height:1.45}
.chip:empty{display:none}
#zoomChip{top:8px;right:8px;color:var(--accent);border-color:var(--accent)}
#hintChip{bottom:8px;right:8px;text-align:right;font-size:10.5px;opacity:.92}
/* draggable formula card */
.fcard{position:absolute;min-width:220px;max-width:62%;background:var(--card);border:1px solid var(--accent);border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.28);user-select:none;z-index:3}
.fcard .fh{display:flex;align-items:center;justify-content:center;gap:7px;padding:5px 10px;border-bottom:1px solid var(--border);cursor:grab;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.2px;color:var(--accent);font-weight:600}
.fcard .fh:active{cursor:grabbing}
/* keypad / scientific calculator card */
.kcard{position:fixed;min-width:0;width:262px;max-width:none;z-index:20;outline:none}
.kcard.calc{width:320px}
.kcard:focus-within,.kcard:focus{box-shadow:0 0 0 2px var(--accent-glow),0 8px 24px rgba(0,0,0,.35)}
.kcard .kb{padding:8px}
.kdisp{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:4px 8px;margin-bottom:6px;min-height:48px}
.kexpr{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-dim);min-height:18px;word-break:break-all;text-align:right}
.kres{font-family:'KaTeX_Main','Times New Roman',serif;font-size:20px;color:var(--text);text-align:right;min-height:26px;overflow-x:auto;overflow-y:hidden}
.kres.err{color:var(--red);font-family:'JetBrains Mono',monospace;font-size:13px}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.kgrid.c6{grid-template-columns:repeat(6,1fr)}
.kgrid button{height:28px;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:6px;cursor:pointer;
  font-family:'KaTeX_Main','Times New Roman',serif;font-size:15px;padding:0}
.kgrid button:hover{border-color:var(--accent);color:var(--accent)}
.kgrid button.fn{color:var(--accent);font-size:14px}
.kgrid button.ctl{color:var(--amber);font-family:'Inter',sans-serif;font-size:11px;font-weight:700}
.kgrid button.go{background:var(--accent);color:var(--bg);border-color:var(--accent);font-family:'Inter',sans-serif;font-size:12px;font-weight:700}
.kgrid button.unit{font-size:16px}
.kgrid button.sup{font-family:'Inter',sans-serif;font-size:14px;line-height:1;color:var(--accent)}
.kgrid button.sup i{font-style:normal;color:var(--text-muted);font-size:12px}
.kgrid button.sup sup{font-size:11px;font-weight:700}
.kgrid .s2{grid-column:span 2}
.kgrid .s6{grid-column:span 6}
.kgrid button.nav{color:var(--text-dim);font-size:13px}
.kgrid button.sm{font-family:'KaTeX_Main','Times New Roman',serif;font-size:14px}
.kgrid button sup{font-size:.7em}
.sym.hl{background:var(--accent-glow);border-radius:7px;padding:2px 8px;margin:0 -8px}.sym.hl span{color:var(--accent);font-weight:700}.sym.hl .u{color:var(--accent)}
.scard{width:300px;position:fixed;max-width:none;z-index:19}
.scard .sb{padding:6px 11px 8px;font-size:11.5px;line-height:1.4;color:var(--text)}
.scard .sh{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--text-muted);margin:8px 0 2px}
.scard .sh:first-child{margin-top:0}
.scard .nm{font-size:14px;font-weight:700}
.scard .fr{display:inline-block;margin:2px 0;padding:1px 7px;border-radius:6px;background:var(--accent-glow);color:var(--accent);font-weight:700}
.btn.today{color:var(--amber);border-color:var(--amber)}
.kgrid button.frk{display:flex;align-items:center;justify-content:center}
.frl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.frl i{display:block;width:7px;height:7px;border:1.4px solid currentColor;border-radius:1.5px}
.frl b{display:block;width:13px;height:0;border-top:1.6px solid currentColor}
.kexpr .katex{font-size:1.15em}
.kexpr{overflow-x:auto;overflow-y:hidden;white-space:nowrap;min-height:30px;padding:2px 0;color:var(--katex-color)}
.qa{margin:6px 0;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card)}.qa summary{cursor:pointer;line-height:1.45}.qa[open] summary{color:var(--accent)}.qa div{margin-top:6px;color:var(--text-dim);line-height:1.5}
.knote{font-size:11px;color:var(--amber);text-align:right;min-height:14px}
.khelp{font-size:10px;color:var(--text-muted);margin-top:6px;line-height:1.35}
.grip{display:grid;grid-template-columns:repeat(3,3px);gap:2px}
.grip i{width:3px;height:3px;border-radius:50%;background:var(--accent);display:block}
.fcard .fb{padding:8px 12px;font-size:14px;color:var(--katex-color);line-height:1.9}
.fcard .fb .katex{font-size:1.08em}

/* ══ SIDE PANEL ══ */
.panel{min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border);flex:0 0 auto}
.ptab{border:none;background:transparent;color:var(--text-dim);font-size:11.5px;padding:8px 2px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.ptab:hover{color:var(--text)}
.ptab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.pbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 12px 14px;font-size:12.5px;line-height:1.5}
.ptools{display:flex;justify-content:flex-end;gap:6px;margin-bottom:4px}
.ptools button{border:1px solid var(--border);background:var(--bg);color:var(--text-dim);font-size:10.5px;padding:2px 8px;border-radius:6px;cursor:pointer}
.ptools button:hover{color:var(--accent);border-color:var(--accent)}
.sec{margin-bottom:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card2)}
.sec-h{width:100%;display:flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--text);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;padding:6px 9px;cursor:pointer;text-align:left}
.sec-h .chev{display:inline-block;transition:transform .15s;color:var(--text-muted);font-size:10px}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.sec-b{padding:4px 10px 9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:baseline}
.kv .k{color:var(--text-dim);font-size:11.5px}
.kv .v{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);text-align:right}
.kv .v.acc{color:var(--accent)}
.sym{display:grid;grid-template-columns:34px 1fr auto;gap:2px 8px;align-items:baseline;padding:2px 0;border-bottom:1px dashed var(--border)}
.sym:last-child{border-bottom:none}
.sym .s{font-family:'KaTeX_Math','Times New Roman',serif;font-style:italic;font-size:16px;color:var(--accent)}
.sym .s.up{font-style:normal;font-family:'KaTeX_Main','Times New Roman',serif}
.sym .u{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);text-align:right}
.tex{overflow-x:auto;overflow-y:hidden;padding:3px 0;color:var(--katex-color)}
.tex .katex{font-size:1.05em}
ol.steps{padding-left:20px}
ol.steps li{margin:3px 0}
.note{border-left:3px solid var(--amber);padding:4px 8px;background:var(--bg);border-radius:4px;margin:6px 0;font-size:12px}
.qtext{font-style:italic;color:var(--text);padding:6px 8px;border-radius:6px;background:var(--bg);border:1px dashed var(--border)}
.verdict-ok{color:var(--ok);font-weight:700}.verdict-bad{color:var(--fail);font-weight:700}
.muted{color:var(--text-muted)}
.mk{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:4px}

/* ══ BOTTOM BAR ══ */
.bottombar{flex:0 0 30px;margin-top:6px;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden}
.bottombar b{color:var(--text);font-weight:600}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--border);display:block}
.dots i.on{background:var(--accent)}
@media(max-width:1180px){.tlabel.opt{display:none}.xpill{padding:4px 8px}}
</style>
</head>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   CORE — unit algebra engine + content banks (pure, no DOM)
   ═══════════════════════════════════════════════════════════════ */
const BASES   = ['kg','m','s','A','K','mol','cd'];
const BASEVAR = ['--base-mass','--base-len','--base-time','--base-cur','--base-temp','--base-mol','--base-cd'];
const vec = (kg=0,m=0,s=0,A=0,K=0,mol=0,cd=0) => [kg,m,s,A,K,mol,cd];
const vadd   = (a,b) => a.map((x,i)=>x+b[i]);
const vscale = (a,k) => a.map(x=>x*k);
const veq    = (a,b) => a.every((x,i)=>x===b[i]);
const vzero  = a => a.every(x=>x===0);

/* base-unit vectors of every quantity used in the sim */
const U = {
  none:vec(), mass:vec(1), length:vec(0,1), time:vec(0,0,1), current:vec(0,0,0,1),
  temp:vec(0,0,0,0,1), amount:vec(0,0,0,0,0,1), lum:vec(0,0,0,0,0,0,1),
  area:vec(0,2), volume:vec(0,3), velocity:vec(0,1,-1), accel:vec(0,1,-2),
  force:vec(1,1,-2), energy:vec(1,2,-2), power:vec(1,2,-3), pressure:vec(1,-1,-2),
  density:vec(1,-3), frequency:vec(0,0,-1), charge:vec(0,0,1,1),
  pd:vec(1,2,-3,-1), resistance:vec(1,2,-3,-2), intensity:vec(1,0,-3),
  momentum:vec(1,1,-1), resistivity:vec(1,3,-3,-2), springk:vec(1,0,-2), efield:vec(1,1,-3,-1)
};
/* named derived S.I. units — the "answer stamp" */
const NAMED = [
  {sym:'N', name:'newton',  v:U.force},     {sym:'J', name:'joule',  v:U.energy},
  {sym:'W', name:'watt',    v:U.power},     {sym:'Pa',name:'pascal', v:U.pressure},
  {sym:'Hz',name:'hertz',   v:U.frequency}, {sym:'C', name:'coulomb',v:U.charge},
  {sym:'V', name:'volt',    v:U.pd},        {sym:'Ω', name:'ohm',    v:U.resistance}
];
const namedOf = v => NAMED.find(n=>veq(n.v,v)) || null;

/* plain-text unit string, CIE style: "kg m² s⁻²" (spaces, real superscripts) */
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const supStr = n => String(n).split('').map(c=>SUP[c]||c).join('');
function vtxt(v){
  if (vzero(v)) return 'no unit';
  return BASES.map((b,i)=> v[i]===0 ? null : b + (v[i]===1 ? '' : supStr(v[i]))).filter(Boolean).join(' ');
}
function vtex(v){
  if (vzero(v)) return '\\text{no unit}';
  return BASES.map((b,i)=> v[i]===0 ? null : '\\text{'+b+'}' + (v[i]===1 ? '' : '^{'+v[i]+'}')).filter(Boolean).join('\\,');
}

/* ── symbol library: what each letter means in an item ── */
const SYM = {
  F:{s:'F',name:'force',u:'force',unit:'N',from:'F = ma'},
  m:{s:'m',name:'mass',u:'mass',unit:'kg',base:true},
  a:{s:'a',name:'acceleration',u:'accel',unit:'m s⁻²',from:'Δv ÷ t'},
  Ek:{s:'E',name:'kinetic energy',u:'energy',unit:'J'},
  W:{s:'W',name:'work done (energy)',u:'energy',unit:'J',from:'W = Fs'},
  v:{s:'v',name:'speed / velocity',u:'velocity',unit:'m s⁻¹',from:'distance ÷ time'},
  u:{s:'u',name:'initial velocity',u:'velocity',unit:'m s⁻¹'},
  P:{s:'P',name:'power',u:'power',unit:'W',from:'P = W/t'},
  p:{s:'p',name:'pressure',u:'pressure',unit:'Pa',from:'p = F/A'},
  rho:{s:'ρ',name:'density',u:'density',unit:'kg m⁻³',from:'mass ÷ volume'},
  g:{s:'g',name:'acceleration of free fall',u:'accel',unit:'m s⁻²'},
  h:{s:'h',name:'height (depth)',u:'length',unit:'m',base:true},
  V:{s:'V',name:'potential difference',u:'pd',unit:'V',from:'V = P/I'},
  I:{s:'I',name:'current',u:'current',unit:'A',base:true},
  R:{s:'R',name:'resistance',u:'resistance',unit:'Ω'},
  t:{s:'t',name:'time',u:'time',unit:'s',base:true},
  T:{s:'T',name:'period',u:'time',unit:'s',base:true},
  s:{s:'s',name:'displacement',u:'length',unit:'m',base:true},
  sw:{s:'s',name:'distance moved (in direction of F)',u:'length',unit:'m',base:true},
  A:{s:'A',name:'area',u:'area',unit:'m²',from:'length × length'},
  f:{s:'f',name:'frequency',u:'frequency',unit:'Hz',from:'f = 1/T'},
  lam:{s:'λ',name:'wavelength',u:'length',unit:'m',base:true},
  r:{s:'r',name:'radius',u:'length',unit:'m',base:true},
  x:{s:'x',name:'separation of the wires',u:'length',unit:'m',base:true},
  l:{s:'l',name:'length of wire',u:'length',unit:'m',base:true},
  Vol:{s:'V',name:'volume',u:'volume',unit:'m³',from:'length³'},
  Q:{s:'Q',name:'charge',u:'charge',unit:'C',from:'Q = It'},
  D:{s:'D',name:'drag force',u:'force',unit:'N',from:'F = ma'},
  c:{s:'c',name:'speed of the sound wave',u:'velocity',unit:'m s⁻¹'},
  x0:{s:'x_0',name:'amplitude',u:'length',unit:'m',base:true},
  Ep:{s:'E_P',name:'potential energy stored',u:'energy',unit:'J',from:'W = Fs'},
  strain:{s:'σ',name:'strain (extension ÷ original length)',u:'none',unit:'—'},
  eps:{s:'ε',name:'strain (extension ÷ original length)',u:'none',unit:'—'},
  stress:{s:'σ',name:'stress (force ÷ area)',u:'pressure',unit:'Pa',from:'σ = F/A'},
  Ey:{s:'E',name:'Young modulus',u:'pressure',unit:'Pa'},
  Isnd:{s:'I',name:'intensity of the sound',u:'intensity',unit:'W m⁻²',from:'I = P/A'},
  Iw:{s:'I',name:'intensity',u:'intensity',unit:'W m⁻²'},
  Erv:{s:'E/V',name:'energy per unit volume',u:'pressure',unit:'J m⁻³'},
  E:{s:'E',name:'energy',u:'energy',unit:'J'},
  dv:{s:'Δv',name:'change in velocity',u:'velocity',unit:'m s⁻¹'},
  pm:{s:'p',name:'momentum',u:'momentum',unit:'N s',from:'p = mv'},
  Wt:{s:'W',name:'weight',u:'force',unit:'N',from:'W = mg'},
  rhoe:{s:'ρ',name:'resistivity',u:'resistivity',unit:'Ω m',from:'ρ = RA/l'},
  kspr:{s:'k',name:'spring constant',u:'springk',unit:'N m⁻¹',from:'k = F/x'},
  xe:{s:'x',name:'extension',u:'length',unit:'m',base:true},
  Ef:{s:'E',name:'electric field strength',u:'efield',unit:'N C⁻¹',from:'E = F/Q'},
  vw:{s:'v',name:'wave speed',u:'velocity',unit:'m s⁻¹'},
  Egp:{s:'E_P',name:'gravitational potential energy',u:'energy',unit:'J'},
  cl:{s:'c',name:'speed of light',u:'velocity',unit:'m s⁻¹'},
  lp:{s:'l',name:'length of the pendulum',u:'length',unit:'m',base:true},
  K:{s:'K',name:'constant (unknown unit)',u:null},
  C:{s:'C',name:'constant (unknown unit)',u:null}
};
const symVec = id => U[SYM[id].u];

/* expression = {coef, f:[[symId,pow],...]} → base-unit vector */
const exprVec = e => e.f.reduce((acc,[id,p]) => vadd(acc, vscale(symVec(id),p)), vec());

/* ═══ MODE 2 — derivations (formula pills + real exam questions) ═══ */
const DERIV = {
  Fma:{ title:'Force', lhs:'F', fml:'F = m a', tex:'F = ma', e:{coef:null,f:[['m',1],['a',1]]},
        q:'State the SI base units of force.', why:'Newton’s second law (mass constant): force = mass × acceleration.' },
  Wmg:{ title:'Weight', lhs:'Wt', fml:'W = m g', tex:'W = mg', e:{coef:null,f:[['m',1],['g',1]]},
        why:'Weight is a force: mass × acceleration of free fall.' },
  pmv:{ title:'Momentum', lhs:'pm', fml:'p = m v', tex:'p = mv', e:{coef:null,f:[['m',1],['v',1]]},
        why:'Momentum = mass × velocity.', alt:'= N s' },
  Ek: { title:'Kinetic energy', lhs:'Ek', fml:'E = ½ m v^2', tex:'E = \\tfrac12 mv^2', e:{coef:'½',f:[['m',1],['v',2]]},
        why:'½ is a pure number — it has no unit, so it drops out.' },
  Wfs:{ title:'Work done → energy', lhs:'W', fml:'W = F s', tex:'W = Fs', e:{coef:null,f:[['F',1],['sw',1]]},
        q:'Use the definition of work done to show that the SI base units of energy are kg m² s⁻².', why:'Work done = force × distance moved in the direction of the force.' },
  Ep: { title:'Gravitational potential energy', lhs:'Egp', fml:'E_P = m g h', tex:'E_\\text{P} = mgh', e:{coef:null,f:[['m',1],['g',1],['h',1]]},
        why:'Same base units as kinetic energy — energy is energy.' },
  PWt:{ title:'Power (from work)', lhs:'P', fml:'P = W / t', tex:'P = \\dfrac{W}{t}', e:{coef:null,f:[['W',1],['t',-1]]},
        q:'Use the definition of power to show that the SI base units of power are kg m² s⁻³.', why:'Power = work done ÷ time taken.' },
  PFv:{ title:'Power (from force)', lhs:'P', fml:'P = F v', tex:'P = Fv', e:{coef:null,f:[['F',1],['v',1]]},
        why:'Power = rate of doing work = force × velocity.' },
  pFA:{ title:'Pressure', lhs:'p', fml:'p = F / A', tex:'p = \\dfrac{F}{A}', e:{coef:null,f:[['F',1],['A',-1]]},
        q:'Show that the SI base units of pressure are kg m⁻¹ s⁻².', why:'Pressure = force ÷ area.' },
  prgh:{title:'Pressure in a fluid', lhs:'p', fml:'p = ρ g h', tex:'p = \\rho g h', e:{coef:null,f:[['rho',1],['g',1],['h',1]]},
        why:'Hydrostatic pressure at depth h.' },

/* exact decimal arithmetic for prefix shifts: value = D × 10^(−k), D an integer digit string */
function decParse(str){
  str = String(str).trim();
  const m = /^(\d*)(?:\.(\d*))?$/.exec(str);
  if (!m || (m[1]==='' && (m[2]===undefined||m[2]===''))) return null;
  const ip = m[1]||'', fp = m[2]||'';
  let D = (ip+fp).replace(/^0+(?=\d)/,''); if (D==='') D='0';
  return {D, k:fp.length};
}
function decStr(d, shift){           /* value × 10^shift as a plain decimal string */
  let D = d.D, k = d.k - shift;
  if (k <= 0) return (D + '0'.repeat(-k)).replace(/^0+(?=\d)/,'');
  if (D.length <= k) D = '0'.repeat(k - D.length + 1) + D;
  const ip = D.slice(0, D.length-k).replace(/^0+(?=\d)/,''), fp = D.slice(D.length-k);
  return ip + '.' + fp;
}
function decSci(d, shift){           /* {mant, exp} keeping the given significant figures */
  let D = d.D.replace(/^0+/,''); if (D==='') return {mant:'0', exp:0};
  const lead = d.D.length - d.D.replace(/^0+/,'').length;
  const exp = (d.D.length - lead - 1) - d.k + shift;
  return {mant: D[0] + (D.length>1 ? '.'+D.slice(1) : ''), exp};
}
/* student number parser: 47000 · 4.7e4 · 4.7x10^4 · 4.7×10⁴ · 4.7 * 10^-3 */
function parseNum(s){
  if (s==null) return NaN;
  s = String(s).trim().replace(/[⁻−–]/g,'-').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c)).replace(/\s+/g,'').replace(/,/g,'');
  if (s==='') return NaN;
  let m = /^([+-]?\d*\.?\d+(?:e[+-]?\d+)?)$/i.exec(s);
  if (m) return Number(m[1]);
  m = /^([+-]?\d*\.?\d+)?[x×*]?10\^?\(?([+-]?\d+)\)?$/i.exec(s);
  if (m) return (m[1]===undefined ? 1 : Number(m[1])) * Math.pow(10, Number(m[2]));
  return NaN;
}
/* student unit parser: "kg m s^-2", "kg m^2 s^-3 A^-1", "kgms-2", "kg m⁻¹ s⁻²", "kg/(m s^2)", "none" */
function parseUnits(s){
  if (s==null) return {err:'empty'};
  s = String(s).trim();
  if (s==='') return {err:'empty'};
  if (/^(no ?units?|none|dimensionless|unitless|1|-|—)$/i.test(s)) return {v:vec()};
  s = s.replace(/[⁻−–]/g,'-').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c)).replace(/[·*.×]/g,' ').replace(/[()]/g,' ');
  let v = vec(), sign = 1, i = 0, any = false;
  const named = ['Pa','Hz','N','J','W','C','V','Ω','ohm'];
  while (i < s.length){
    const ch = s[i];
    if (ch===' '){ i++; continue; }
    if (ch==='/'){ sign = -1; i++; continue; }
    let tok = null;
    for (const t of ['mol','kg','cd','m','s','A','K']) if (s.startsWith(t,i)){ tok=t; break; }
    if (!tok){
      for (const t of named) if (s.startsWith(t,i)) return {err:'named', tok:t};
      return {err:'bad', at:s.slice(i,i+4)};
    }
    i += tok.length;
    let m = /^\^?\s*\{?\s*([+-]?\d+)\s*\}?/.exec(s.slice(i)), p = 1;
    if (m){ p = Number(m[1]); i += m[0].length; }
    v[BASES.indexOf(tok)] += sign*p; any = true;
  }
  return any ? {v} : {err:'empty'};
}

 {key:'mass', name:'Mass', unit:'kilogram', sym:'kg', col:'base-mass', tag:'From seeds to the Planck constant', ms:[

 {key:'time', name:'Time', unit:'second', sym:'s', col:'base-time', tag:'From shadows to caesium atoms', ms:[

 {key:'elec', name:'Electricity', unit:'ampere', sym:'A', col:'base-cur', tag:'From rubbed amber to counting electrons', ms:[

function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }

  ctx.font = font; const words = s.split(' '); const lines = []; let cur = '';

  if (cur) lines.push(cur); return lines;
}

/* ── rich maths text: letters italic, ^{..} superscript, _{..} subscript (upright) ── */
function parseRich(str){
  const segs = []; let i = 0;
  const grab = () => {
    if (str[i]==='{'){ const j = str.indexOf('}', i); const g = str.slice(i+1, j); i = j+1; return g; }
    if (str[i]==='-'){ const g = str.slice(i, i+2); i += 2; return g; }
    return str[i++];
  };
  while (i < str.length){
    const ch = str[i];
    if (ch==='^' || ch==='_'){ i++; const g = grab(); segs.push({t:g.replace(/-/g,'−'), it:false, lvl: ch==='^'?1:-1}); continue; }
    if (ch===' '){ segs.push({t:' ', sp:true}); i++; continue; }
    const it = /[A-Za-zα-ωΑ-Ω]/.test(ch);
    segs.push({t: ch==='-' ? '−' : ch, it, lvl:0}); i++;
  }
  return segs;
}
function segFont(sg, fs){ const f = sg.lvl ? fs*0.68 : fs; return sg.it ? F_IT(f) : F_UP(f); }
function richW(segs, fs){ let w = 0; for (const sg of segs){ if (sg.sp){ w += fs*0.24; continue; } w += tw(sg.t, segFont(sg,fs)); } return w; }
function drawRich(segs, x, y, fs, col, align='left'){
  const w = richW(segs, fs);
  if (align==='center') x -= w/2; else if (align==='right') x -= w;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const sg of segs){
    if (sg.sp){ x += fs*0.24; continue; }
    ctx.font = segFont(sg, fs); ctx.fillStyle = sg.col || col;
    ctx.fillText(sg.t, x, y + (sg.lvl===1 ? -fs*0.42 : sg.lvl===-1 ? fs*0.2 : 0));
    x += ctx.measureText(sg.t).width;
  }
  return w;
}

/* ── working-line items ── */
function itemW(it, fs){

    case 'atom': return atomW(it.b, it.e, fs);

    case 'coef': return tw(it.s, F_UP(fs)) + fs*0.3;
    case 'br':   return tw(it.s, F_UP(fs*1.08)) + fs*0.06;

/* substitution line: (kg)(m s⁻²) — one bracket group per symbol, ÷ for negative powers */
function subItems(e, gcol){
  const items = [];
  if (e.coef){ items.push({k:'coef', s:e.coef}); }
  e.f.forEach(([id,p], j) => {
    if (j===0 && p<0){ items.push({k:'coef', s:'1'}); }
    if (j>0 || (j===0 && p<0) || (j===0 && e.coef)) items.push({k:'op', s: p<0 ? '÷' : '×'});
    const v = symVec(id), col = gcol;
    items.push({k:'br', s:'(', col, grp:j});
    if (vzero(v)) items.push({k:'none'});
    else v.forEach((x,b) => { if (x) items.push({k:'atom', b, e:x, grp:j}); });
    items.push({k:'br', s:')', col, grp:j});
    if (Math.abs(p)!==1) items.push({k:'pow', p:Math.abs(p), col});
  });
  return items;
}
/* expanded line: every atom with its final power, grouped by symbol */
function expItems(e){
  const items = [];
  e.f.forEach(([id,p], j) => {
    const v = symVec(id); let any = false;
    v.forEach((x,b) => { if (x){ if (items.length && !any) items.push({k:'gap', g:.42}); items.push({k:'atom', b, e:x*p, grp:j}); any = true; } });
  });
  if (!items.length) items.push({k:'txt', s:'1'});
  return items;
}
/* collected line: one atom per base unit, powers added; power 0 → struck (cancels) */
function colItems(e){
  const v = exprVec(e), present = new Set();
  e.f.forEach(([id]) => symVec(id).forEach((x,b) => { if (x) present.add(b); }));
  const items = [];
  BASES.forEach((_,b) => { if (present.has(b)) items.push({k:'atom', b, e: v[b]===0 ? 0 : v[b], struck: v[b]===0}); });
  if (!items.length) items.push({k:'txt', s:'1'});
  return items;
}
function resItems(v){
  if (vzero(v)) return [{k:'none'}];
  const items = []; v.forEach((x,b) => { if (x) items.push({k:'atom', b, e:x}); }); return items;
}

    ctx.restore();

      const t = ease(clamp(f3/0.8, 0, 1));

    if (S.labels && settle > 0) L3.forEach(it => { if (it.struck) text('cancels', xs+it.x+it.w/2, cfg.ys[2]+fs*0.95, F_UI(Math.max(10,fs*0.4),600), COL.fail, 'center'); });
    ctx.restore();

    const y = cfg.ys[3], w4 = layoutItems(L4, fs), rc = cfg.resCol || COL.accent;
    text('=', cfg.xEq, y, F_UP(fs), COL.ink);
    rrect(xs - fs*0.3, y - fs*1.05, w4 + fs*0.6, fs*1.62, 10);
    ctx.fillStyle = rgba(rc, .1); ctx.fill(); ctx.strokeStyle = rc; ctx.lineWidth = 2.2; ctx.stroke();

    if (cfg.named){

  return '#' + A.map((v,i) => Math.round(v + (B[i]-v)*k).toString(16).padStart(2,'0')).join(''); }
function plate(x, y, w, h, alpha){ rrect(x, y, w, h, 9); ctx.fillStyle = 'rgba(10,14,24,' + (alpha || .62) + ')'; ctx.fill(); }
const SC_INK = '#f4ecd8', SC_DIM = '#cdbf9f';                     // text colours that sit on the painted scenes
const sL = (s, x, y, fs, col, al, w) => text(s, x, y, F_UI(fs, w || 700), col || SC_INK, al || 'center', 'middle');
function fullBleed(fill){ ctx.fillStyle = fill; ctx.fillRect(-300, -190, 600, 380); }

/* LENGTH — the royal cubit rod at dusk by the pyramids */
ART.cubit = function(c,t){
  fullBleed(lgrad(0, -190, 0, 20, [[0,'#18223b'],[0.55,'#7a4a52'],[1,'#e09a5a']]));
  glowDo('#ffcf7a', 40, () => hCirc(150, 4, 26, '#ffd98a'));
  [[-210, 70, 54], [-120, 46, 38], [190, 60, 46]].forEach(([x, w, h]) => {
    ctx.beginPath(); ctx.moveTo(x - w, 20); ctx.lineTo(x, 20 - h); ctx.lineTo(x + w, 20); ctx.closePath(); ctx.fillStyle = '#6b4630'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x, 20 - h); ctx.lineTo(x + w, 20); ctx.lineTo(x + w*0.25, 20); ctx.closePath(); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill(); });
  ctx.fillStyle = lgrad(0, 20, 0, 190, [[0,'#c79358'],[1,'#7d5530']]); ctx.fillRect(-300, 20, 600, 170);
  for (let i=0;i<14;i++){ ctx.beginPath(); ctx.ellipse(-280 + i*45, 150 + (i%3)*10, 30, 3, 0, 0, Math.PI*2); ctx.fillStyle = 'rgba(255,230,180,.12)'; ctx.fill(); }
  // the rod: top face + front face, 7 palms × 4 digits
  const x0 = -236, x1 = 236, y = 64, h = 34, d = 16, pw = (x1 - x0)/7, dw = pw/4;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, y + h + 10, 250, 10, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + d, y - d); ctx.lineTo(x1 + d, y - d); ctx.lineTo(x1, y); ctx.closePath(); ctx.fillStyle = lgrad(0, y - d, 0, y, [[0,'#d9a560'],[1,'#b07a3c']]); ctx.fill();
  ctx.fillStyle = lgrad(0, y, 0, y + h, [[0,'#9c6630'],[1,'#5e3a18']]); ctx.fillRect(x0, y, x1 - x0, h);
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x1 + d, y - d); ctx.lineTo(x1 + d, y - d + h); ctx.lineTo(x1, y + h); ctx.closePath(); ctx.fillStyle = '#4a2c12'; ctx.fill();
  for (let k=0;k<=28;k++){ const x = x0 + k*dw, palm = k%4===0; hLine(x, y + h, x, y + h - (palm ? h*0.75 : h*0.35), palm ? '#2a170a' : 'rgba(42,23,10,.7)', palm ? 2 : 1.2); }
  const glyph = (gx, gy, k) => { ctx.strokeStyle = '#3a2210'; ctx.lineWidth = 1.6; ctx.beginPath();
    if (k===0){ ctx.ellipse(gx, gy - 3, 3, 4, 0, 0, Math.PI*2); ctx.moveTo(gx, gy + 1); ctx.lineTo(gx, gy + 7); ctx.moveTo(gx - 4, gy + 2); ctx.lineTo(gx + 4, gy + 2); }      // ankh
    else if (k===1){ for (let i=0;i<5;i++) ctx.lineTo(gx - 8 + i*4, gy + (i%2 ? -3 : 3)); }                                                        // water
    else { ctx.ellipse(gx, gy, 7, 3, 0, 0, Math.PI*2); ctx.moveTo(gx + 1.5, gy); ctx.arc(gx, gy, 1.5, 0, Math.PI*2); }                             // eye
    ctx.stroke(); };
  for (let i=0;i<7;i++){ const gx = x0 + d*0.5 + pw*(i + 0.5);
    glyph(gx - 14, y - d/2 - 1, i%3); glyph(gx + 12, y - d/2 - 1, (i+1)%3);
    for (let s=0; s<=i; s++) hLine(gx - 3*i + s*6, y + 6, gx - 3*i + s*6, y + 15, '#ffd98a', 2); }               // palm numbers in Egyptian strokes
  const sh = ((t*0.35) % 1.4) - 0.2;                                                                               // a glint slides along the rod
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y - d, x1 - x0 + d, h + d); ctx.clip();
  ctx.fillStyle = lgrad(x0 + sh*500 - 40, 0, x0 + sh*500 + 40, 0, [[0,'rgba(255,240,200,0)'],[.5,'rgba(255,240,200,.45)'],[1,'rgba(255,240,200,0)']]); ctx.fillRect(x0, y - d, x1 - x0 + d, h + d); ctx.restore();
  // labels on dark plates
  plate(-170, -150, 340, 54);
  sL('1 royal cubit ≈ 52 cm', 0, -132, 19, '#ffd98a', 'center', 800); sL('the length from elbow to fingertip', 0, -110, 13, SC_DIM);
  hArrow(-60, -22, x0, -22, '#ffd98a', 2.2, 9); hArrow(60, -22, x1, -22, '#ffd98a', 2.2, 9); hLine(x0, -30, x0, y - 6, 'rgba(255,217,138,.6)', 1.2, [4,4]); hLine(x1, -30, x1, y - 6, 'rgba(255,217,138,.6)', 1.2, [4,4]);
  sL('52 cm', 0, -22, 15, '#ffd98a', 'center', 800);
  plate(-200, 124, 400, 40);
  sL('7 palms  ×  4 digits  =  28 digits  ·  a palm ≈ 7.5 cm, a digit ≈ 1.9 cm', 0, 144, 13, SC_INK, 'center', 700);
};

/* MASS — an Egyptian balance: grains poured until the beam is level with the stone weight */
ART.balance = function(c,t){
  fullBleed(rgrad(0, -40, 40, 360, [[0,'#5b4330'],[1,'#22170f']]));
  ctx.fillStyle = 'rgba(255,220,160,.05)'; for (let i=0;i<6;i++) ctx.fillRect(-300, -190 + i*64, 600, 2);
  ctx.fillStyle = lgrad(0, 128, 0, 190, [[0,'#7a5232'],[1,'#3e2814']]); ctx.fillRect(-300, 128, 600, 70); hLine(-300, 128, 300, 128, 'rgba(255,220,170,.35)', 2);
  const cyc = (t % 9)/9, n = Math.min(36, Math.floor(cyc*48)), full = n/36, py = -96, L = 176;
  const ang = 0.13*(1 - full) + 0.02*Math.sin(t*3.2)*(1 - full*0.7);        // the lighter (grain) side rides high
  // stand
  ctx.fillStyle = lgrad(-50, 0, 50, 0, [[0,'#5f5a52'],[.5,'#9a948a'],[1,'#4c4842']]); rrect(-56, 112, 112, 18, 4); ctx.fill();
  ctx.fillStyle = lgrad(-9, 0, 9, 0, [[0,'#5a3418'],[.5,'#a26b3a'],[1,'#4a2a12']]); ctx.fillRect(-8, py, 16, 214);
  // beam
  ctx.save(); ctx.translate(0, py); ctx.rotate(ang);
  ctx.fillStyle = lgrad(0, -6, 0, 6, [[0,'#c58f52'],[1,'#6e4320']]); rrect(-L - 10, -5, 2*L + 20, 10, 5); ctx.fill();
  [-L - 10, L + 10].forEach(x => { ctx.beginPath(); ctx.ellipse(x, 0, 9, 6, 0, 0, Math.PI*2); ctx.fillStyle = '#d4a25e'; ctx.fill(); });
  ctx.restore(); hCirc(0, py, 7, '#e0b46a', '#5a3418', 2);
  // plumb line from the beam centre shows when it is level
  // the plumb line always hangs straight down; the beam's pointer lines up with it only when the beam is level
  hLine(0, py + 6, 0, py + 70, 'rgba(255,230,180,.7)', 1); ball(0, py + 74, 5, '#c08a4a');
  hLine(0, py, -Math.sin(ang)*58, py + Math.cos(ang)*58, Math.abs(ang) < 0.01 ? '#86efac' : '#ffd98a', 2.4);
  // pans on chains
  const pan = s => { const hx = s*L*Math.cos(ang), hy = py + s*L*Math.sin(ang), yb = hy + 104;
    [-36, 0, 36].forEach(dx => hLine(hx, hy, hx + dx, yb, 'rgba(230,200,150,.75)', 1.2));
    ctx.beginPath(); ctx.moveTo(hx - 46, yb); ctx.quadraticCurveTo(hx, yb + 26, hx + 46, yb); ctx.closePath();
    ctx.fillStyle = lgrad(hx - 46, 0, hx + 46, 0, [[0,'#8a4b22'],[.5,'#d58a4a'],[1,'#7a3e18']]); ctx.fill(); return {hx, yb}; };
  const Lp = pan(-1), Rp = pan(1);
  for (let i=0;i<n;i++){ const gx = Lp.hx - 32 + (i*17 % 64), gy = Lp.yb - 3 - Math.floor(i/8)*5 - Math.abs(gx - Lp.hx)*-0.02;
    ctx.save(); ctx.translate(gx, gy); ctx.rotate((i*1.7) % 3); ctx.beginPath(); ctx.ellipse(0, 0, 4.2, 2.2, 0, 0, Math.PI*2);
    ctx.fillStyle = rgrad(-1, -1, 0.5, 4.5, [[0,'#ffe7a8'],[1,'#c9952f']]); ctx.fill(); ctx.restore(); }
  if (n < 36) for (let k=0;k<3;k++){ const f = ((t*1.6) + k/3) % 1; ctx.save(); ctx.translate(Lp.hx - 10 + k*9, Lp.yb - 140 + f*130); ctx.rotate(f*6); ctx.beginPath(); ctx.ellipse(0, 0, 4, 2, 0, 0, Math.PI*2); ctx.fillStyle = '#e8bf5a'; ctx.fill(); ctx.restore(); }
  // the duck-shaped stone weight
  const dx = Rp.hx, dy = Rp.yb - 14;
  ctx.beginPath(); ctx.ellipse(dx, dy, 30, 14, 0, 0, Math.PI*2); ctx.fillStyle = rgrad(dx - 10, dy - 8, 2, 34, [[0,'#7a7f8a'],[1,'#22252b']]); ctx.fill();
  ctx.beginPath(); ctx.ellipse(dx + 24, dy - 14, 9, 8, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.moveTo(dx + 31, dy - 15); ctx.lineTo(dx + 40, dy - 12); ctx.lineTo(dx + 31, dy - 10); ctx.fill();
  hCirc(dx + 26, dy - 16, 1.5, '#ddd');
  plate(-268, -172, 176, 46); sL('grains of wheat', -180, -158, 14, SC_INK); sL('poured in until level', -180, -138, 12, SC_DIM, 'center', 600);
  plate(96, -172, 172, 46); sL('stone “duck” weight', 182, -158, 14, SC_INK); sL('a fixed standard', 182, -138, 12, SC_DIM, 'center', 600);
  const lvl = full > 0.98; plate(-130, 140, 260, 34); sL(lvl ? '✓ balanced: grains = the weight' : 'not balanced yet …', 0, 157, 14, lvl ? '#86efac' : SC_DIM, 'center', 800);
};

/* TIME — an Egyptian shadow clock under a moving sun */
ART.sundial = function(c,t){
  const s = (t*0.09) % 1, el = Math.sin(Math.PI*s), dusk = 1 - el;
  const top = mixHex('#2f6fb5', '#1b2240', dusk*0.8), hor = mixHex('#a9d8f5', '#f2955a', dusk);
  fullBleed(lgrad(0, -190, 0, 40, [[0, top], [1, hor]]));
  const sx = -250 + 500*s, sy = 30 - 180*el;
  glowDo('#ffd56b', 50, () => hCirc(sx, sy, 22, rgrad(sx, sy, 2, 24, [[0,'#fffbe0'],[1,'#ffc94a']])));
  ctx.fillStyle = 'rgba(120,70,40,.55)'; ctx.beginPath(); ctx.moveTo(150, 40); ctx.lineTo(196, 4); ctx.lineTo(242, 40); ctx.fill();
  ctx.fillStyle = lgrad(0, 40, 0, 190, [[0, mixHex('#d8a868', '#9a6a3a', dusk*0.6)], [1, '#6b4422']]); ctx.fillRect(-300, 40, 600, 150);
  // palm tree
  ctx.strokeStyle = '#4a2f18'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(250, 120); ctx.quadraticCurveTo(240, 40, 258, -20); ctx.stroke();
  for (let k=0;k<6;k++){ const a = -2.6 + k*0.55 + 0.05*Math.sin(t*1.5 + k); ctx.beginPath(); ctx.moveTo(258, -20); ctx.quadraticCurveTo(258 + 40*Math.cos(a), -40 + 30*Math.sin(a), 258 + 70*Math.cos(a), -20 + 50*Math.sin(a) + 20); ctx.strokeStyle = '#2f5a2a'; ctx.lineWidth = 4; ctx.stroke(); }
  // hour stones on an arc in front of the obelisk
  const ox = -40, oy = 110, rx = 210, ry = 52, ang = h => Math.PI + (h - 0.5)*Math.PI/12;
  const hourNow = Math.min(12, Math.floor(s*12) + 1);
  for (let h=1; h<=12; h++){ const a = ang(h), x = ox + rx*Math.cos(a), y = oy - ry*Math.sin(a) * -1 + 0;
    const on = h===hourNow; ctx.beginPath(); ctx.ellipse(x, y, 13, 6, 0, 0, Math.PI*2); ctx.fillStyle = on ? '#ffe08a' : '#b8936a'; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1; ctx.stroke();
    text(String(h), x, y - 12, F_UI(on ? 13 : 11, 800), on ? '#fff3c4' : 'rgba(255,240,210,.75)', 'center', 'middle'); }
  // shadow: points away from the sun, long at dawn and dusk
  const len = 70 + 150*(1 - el), dir = Math.atan2(oy - sy, ox - sx), sxp = ox + len*Math.cos(dir)*1.0, syp = oy + len*Math.sin(dir)*0.28;
  ctx.beginPath(); ctx.moveTo(ox - 9, oy); ctx.lineTo(ox + 9, oy); ctx.lineTo(sxp, syp); ctx.closePath(); ctx.fillStyle = 'rgba(30,18,8,.45)'; ctx.fill();
  // obelisk
  ctx.beginPath(); ctx.moveTo(ox - 12, oy); ctx.lineTo(ox - 7, oy - 170); ctx.lineTo(ox + 7, oy - 170); ctx.lineTo(ox + 12, oy); ctx.closePath();
  ctx.fillStyle = lgrad(ox - 12, 0, ox + 12, 0, [[0,'#e8c896'],[.6,'#c59a62'],[1,'#8e6438']]); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ox - 7, oy - 170); ctx.lineTo(ox, oy - 186); ctx.lineTo(ox + 7, oy - 170); ctx.closePath(); ctx.fillStyle = '#ffd56b'; ctx.fill();
  plate(84, -172, 184, 50); sL('hour ' + hourNow + ' of 12', 176, -156, 17, '#ffe08a', 'center', 800); sL('of daylight', 176, -136, 12, SC_DIM, 'center', 600);
  plate(-268, 140, 300, 34); sL('day and night: 12 hours each → 24', -118, 157, 13, SC_INK, 'center', 700);
};

/* ELECTRICITY — rubbing amber with wool: it becomes charged and lifts straw */
ART.amber = function(c,t){
  fullBleed(rgrad(-40, -40, 20, 380, [[0,'#3a2a1e'],[1,'#120c08']]));
  ctx.fillStyle = lgrad(0, 120, 0, 190, [[0,'#5a3a22'],[1,'#2a1a0e']]); ctx.fillRect(-300, 120, 600, 70); hLine(-300, 120, 300, 120, 'rgba(255,210,150,.3)', 2);
  const cyc = (t % 6)/6, rub = cyc < 0.45, charged = cyc > 0.4, ax = -40, ay = -30;
  // the amber nugget
  const P = [[-78,-14],[-50,-52],[6,-62],[58,-40],[80,-2],[56,38],[-6,50],[-62,34]];
  ctx.save(); ctx.translate(ax, ay);
  glowDo('#ffb347', charged ? 30 : 12, () => { ctx.beginPath(); P.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.closePath();
    ctx.fillStyle = rgrad(-14, -18, 4, 95, [[0,'#ffe2a0'],[.35,'#f5a83a'],[.8,'#c2661a'],[1,'#7a3a0e']]); ctx.fill(); });
  ctx.save(); ctx.beginPath(); P.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.closePath(); ctx.clip();
  ctx.globalAlpha = 0.55; ctx.fillStyle = '#3a1c06';                                                      // a tiny insect trapped in the resin
  ctx.beginPath(); ctx.ellipse(16, 10, 9, 4, 0.4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(6, 5, 3.5, 0, Math.PI*2); ctx.fill();
  for (let k=0;k<3;k++){ hLine(14 + k*4, 12, 10 + k*6, 22, '#3a1c06', 1); hLine(14 + k*4, 8, 12 + k*6, -2, '#3a1c06', 1); }
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(22, 2, 10, 4, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1; [[-30,20,3],[-40,-10,2],[30,-30,2.5],[50,10,1.8]].forEach(([x,y,r]) => hCirc(x, y, r, null, 'rgba(255,240,200,.6)', 1));
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(-26, -34, 22, 7, -0.4, 0, Math.PI*2); ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
  if (charged) for (let k=0;k<7;k++){ const a = k*0.9 + 0.3, r = 60 + 6*Math.sin(t*4 + k); const x = r*Math.cos(a)*1.05, y = r*Math.sin(a)*0.8;
    hCirc(x, y, 7, 'rgba(56,189,248,.25)', '#7dd3fc', 1.4); text('−', x, y + 0.5, F_UI(12,800), '#e0f2fe', 'center', 'middle'); }
  ctx.restore();
  // wool cloth rubbing
  if (rub){ const wx = 110 + 30*Math.sin(cyc*Math.PI*14), wy = -40;
    ctx.beginPath(); ctx.moveTo(wx - 40, wy - 40); for (let k=0;k<=10;k++){ const a = Math.PI*1.5 + k*Math.PI/5; ctx.quadraticCurveTo(wx + 52*Math.cos(a - 0.15), wy + 46*Math.sin(a - 0.15), wx + 46*Math.cos(a), wy + 42*Math.sin(a)); }
    ctx.fillStyle = rgrad(wx - 10, wy - 10, 4, 60, [[0,'#fbf3e1'],[1,'#cbb894']]); ctx.fill();
    ctx.strokeStyle = 'rgba(140,110,70,.35)'; ctx.lineWidth = 1; for (let k=0;k<8;k++){ ctx.beginPath(); ctx.arc(wx - 20 + (k%4)*14, wy - 14 + Math.floor(k/4)*22, 6, 0, Math.PI); ctx.stroke(); }
    plate(60, 30, 112, 26); sL('rub with wool', 116, 43, 13, SC_INK); }
  // straw bits and a feather jump to the charged amber
  for (let i=0;i<7;i++){ const bx = -190 + i*34, k = charged ? ease(clamp((cyc - 0.45)*3.2 - i*0.07, 0, 1)) : 0, x = lerp(bx, ax - 60 + i*18, k), y = lerp(116, ay + 48, k) - Math.sin(k*Math.PI)*30;
    ctx.save(); ctx.translate(x, y); ctx.rotate(i*0.7 - k*1.2);
    if (i===3){ ctx.beginPath(); ctx.moveTo(-12, 0); ctx.quadraticCurveTo(0, -7, 14, 0); ctx.quadraticCurveTo(0, 5, -12, 0); ctx.fillStyle = '#f1f5f9'; ctx.fill(); hLine(-14, 0, 14, 0, '#94a3b8', 1); }
    else hLine(-11, 0, 11, 0, '#e8c45a', 3.2);
    ctx.restore(); }
  plate(-268, -172, 236, 46); sL('amber = fossil tree resin', -150, -158, 14, '#ffd18a'); sL('Greek: ēlektron → “electricity”', -150, -138, 12, SC_DIM, 'center', 600);
  plate(-268, 140, 300, 34); sL(charged ? 'charged amber attracts straw and feathers' : 'rubbing moves charge onto the amber', -118, 157, 13, SC_INK, 'center', 700);
};

function polyPath(P){ ctx.beginPath(); P.forEach((p,i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); }
function cable(P, col, w){ polyPath(P); ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = (w || 3) + 2; ctx.stroke(); ctx.strokeStyle = col || '#c8793a'; ctx.lineWidth = w || 3; ctx.stroke(); ctx.lineJoin = 'miter'; }
function flowDots(P, t, n, speed, col){                              // charges gliding along a polyline
  const L = []; let tot = 0; for (let i=0;i<P.length-1;i++){ const l = Math.hypot(P[i+1][0]-P[i][0], P[i+1][1]-P[i][1]); L.push(l); tot += l; }
  for (let k=0;k<n;k++){ let d = ((k/n)*tot + t*speed) % tot, i = 0; if (d < 0) d += tot; while (i < L.length - 1 && d > L[i]){ d -= L[i]; i++; }
    const f = d/L[i]; glowDo(col, 8, () => hCirc(lerp(P[i][0], P[i+1][0], f), lerp(P[i][1], P[i+1][1], f), 2.6, col)); }
}
function paperTag(x, y, w, h, rot){ ctx.save(); ctx.translate(x + w/2, y + h/2); ctx.rotate(rot || 0);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(-w/2 + 3, -h/2 + 4, w, h);
  ctx.fillStyle = lgrad(0, -h/2, 0, h/2, [[0,'#f4ead0'],[1,'#ddcca4']]); ctx.fillRect(-w/2, -h/2, w, h);
  ctx.strokeStyle = 'rgba(110,80,40,.45)'; ctx.lineWidth = 1.2; ctx.strokeRect(-w/2, -h/2, w, h); ctx.restore(); }
function dialMeter(cx, cy, r, frac, lo, hi, unit, col){            // round moving-coil meter face
  hCirc(cx, cy, r + 6, lgrad(cx, cy - r, cx, cy + r, [[0,'#3b3024'],[1,'#17110b']]));

/* ═══════════════════════════════════════════════════════════════
   STATE — draw() and updateUI() are pure functions of S
   ═══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const BLD = () => S.mode===1 && S.pill[1]===0;               // the Unit Builder now lives in Deriving Units
const STAGE_T = 1.1, DWELL = 0.7;

const S = {
  mode:0, pill:[0,0,0,0], playing:false, ended:false, speed:1, t:0,
  labels:true, formula:false, grid:false, theme:'dark', ptab:'data', secClosed:{},
  zoom:{k:1, cx:W/2, cy:H/2}, hoverBase:-1, cardPos:[null,null,null,null],
  m1:freshM1(), m2:freshM2(), m3:freshM3(), m4:freshM4()
};
window.S = S;

/* the timeline (step target + animated progress) for whatever is on screen */
function TL(){
  if (S.mode===0){ if (S.pill[0]===1) return {o:S.m1.pref, max:2}; return null; }
  if (S.mode===1) return S.pill[1]===0 ? {o:S.m1.build, max:3} : {o:S.m2, max:4};
  if (S.mode===3){ if (S.pill[3]===0){ const H0 = HIST[S.m4.hist.prop]; return {o:S.m4.hist, max:H0.ms.length-1, dwell: H0.ms[S.m4.hist.step] && H0.ms[S.m4.hist.step].now ? 8 : 4.5}; }
    if (S.pill[3]===1) return {o:S.m4.nsi, max:3}; return null; }
  return {o:S.m3, max: S.pill[2]===1 ? 5 : 4};
}
function stepFwd(){ const t = TL(); if (!t) { if (S.mode===0) setFocus(S.m1.focus+1); else if (S.mode===3) sciFocus(S.m4.sci.focus+1); return; }
  if (t.o.step < t.max){ t.o.step++; t.o.prog = Math.min(t.o.prog, t.o.step); } else { t.o.prog = t.o.step; } updateUI(); }
function stepBack(){ const t = TL(); if (!t){ if (S.mode===0) setFocus(S.m1.focus-1); else if (S.mode===3) sciFocus(S.m4.sci.focus-1); return; }
  if (t.o.step > 0){ t.o.step--; t.o.prog = t.o.step; } updateUI(); }
function restartTL(animate){ const t = TL(); if (!t) return; t.o.step = animate ? t.max : 0; t.o.prog = 0; t.o.dwell = 0; }
function finishTL(){ const t = TL(); if (!t) return; t.o.step = t.max; t.o.prog = t.max; }

/* ═══ play loop ═══ */
let last = performance.now(), lastKey = '';
function frame(now){
  let dt = (now - last)/1000; last = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  const sdt = dt * S.speed;
  S.t += dt;
  const t = TL();
  if (t){
    const o = t.o;
    if (o.prog < o.step) o.prog = Math.min(o.step, o.prog + sdt/STAGE_T);
    else if (o.prog > o.step) o.prog = o.step;
    if (S.playing && o.prog >= o.step){
      o.dwell += sdt;
      if (o.dwell > (t.dwell || DWELL)){ o.dwell = 0; if (o.step < t.max) o.step++; else { S.playing = false; S.ended = true; } }
    }
  } else if (S.mode===0 && S.pill[0]===0 && S.playing){          // guided tour of the 7 base units
    S.m1.tourT += sdt;
    if (S.m1.tourT > 2.4){ S.m1.tourT = 0; S.m1.tourN++;
      if (S.m1.tourN >= 7){ S.playing = false; S.ended = true; } else S.m1.focus = (S.m1.focus+1) % 7; }
  } else if (S.mode===3 && S.pill[3]===2 && S.playing){            // guided tour of the scientists, in the current sort order
    const Z = S.m4.sci; Z.tourT += sdt;
    if (Z.tourT > 2.6){ Z.tourT = 0; Z.tourN++;
      if (Z.tourN >= SCI.length){ S.playing = false; S.ended = true; } else Z.focus = (Z.focus+1) % SCI.length; }
  }
  const key = uiKey();
  if (key !== lastKey){ lastKey = key; updateUI(); }
  draw();
  requestAnimationFrame(frame);
}
function uiKey(){ const t = TL(), Z = S.m4.sci; return [S.mode, S.pill.join(), S.playing, S.ended, t ? Math.floor(t.o.prog+0.02)+'/'+t.o.step : S.m1.focus+'/'+S.m1.hover, Z.focus+'/'+Z.hover+'/'+Z.sort].join('|'); }

    let b = `<ol class="steps"><li>LHS: ${K('['+hq.lhsFml.replace(/ /g,'')+'] = ' + vtex(I.L))}</li>${hq.terms.map((t,i) => '<li>Term ' + (i+1) + ': ' + K('[' + t.fml.replace(/ /g,'').replace('½','\\tfrac12 ').replace('ρ','\\rho ').replace('λ','\\lambda ').replace('π','\\pi ') + '] = ' + vtex(I.T[i])) + (I.bad[i] ? ' <span class="verdict-bad">✗ differs</span>' : ' ✓') + '</li>').join('')}
      <li>${I.hom ? '<span class="verdict-ok">Every term matches the LHS → homogeneous.</span>' : '<span class="verdict-bad">A term does not match the LHS → not homogeneous, so the equation must be wrong.</span>'}</li></ol>`;
    if (M.verified && M.verdict!=null) b += `<p>${((M.verdict===1)===I.hom) ? '<span class="verdict-ok">✓ Your verdict was right.</span>' : '<span class="verdict-bad">✗ Your verdict was wrong.</span>'}</p>`;
    return sec('a1','Verdict', b) + `<div class="score">Score: ${M.ok} / ${M.n}</div>`;
  }
  return sec('a1','Answer', '<p class="muted">Nothing to answer here — try 📏 Prefixes → Practice, Deriving Units or Homogeneity.</p>');
}

function cardTex(){
  if (S.mode===3) return m4CardTex();
  if (S.mode===0){
    if (S.pill[0]===0) return ['\\text{base: kg, m, s, A, K, mol, cd}', '\\text{N} = \\text{kg}\\,\\text{m}\\,\\text{s}^{-2}'];
    if (S.pill[0]===1){ const T = prefixTask(); return ['x\\,(\\text{prefix})\\,\\text{unit}^{D} = x\\times10^{Dn}\\,\\text{unit}^{D}', '\\text{shift} = ' + (T.D>1 ? T.D + '\\,' : '') + '(n_\\text{from}-n_\\text{to}) = ' + prefShift(T)]; }
  }
  if (BLD()){ const B = BUILD[S.m1.build.q]; return [B.fml.replace(/ /g,'').replace('/','\\div '), derivTexLines(B.sym, B.e, true)[0]]; }
  if (S.mode===1){ const D = curDeriv(); return [D.tex, derivTexLines(symTex(D.lhs), D.e, true)[0]]; }
  if (S.pill[2]===1){ const Q = CONST3[S.m3.cq]; return [Q.gtex, Q.rtex]; }
  const hq = HOMO[S.m3.hq]; return [hq.tex, '[\\text{LHS}] \\overset{?}{=} [\\text{each RHS term}]'];
}

let pan = null;
function hitBase(p){ for (let i=0;i<7;i++){ const r = baseCardRect(i); if (p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h) return i; } return -1; }
function hitPal(p){ for (let b=0;b<7;b++){ const r = palRect(b); if (p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h) return b; } return -1; }
function hitRung(p){ if (p.x < LAD.x-20 || p.x > LAD.x+260) return null; let best = null, bd = 9; PREFIX.forEach(q => { const d = Math.abs(ladY(q.n) - p.y); if (d < bd){ bd = d; best = q; } }); return best; }
cv.addEventListener('pointermove', e => {
  const p = toLogical(e);
  if (pan){ const dx = (e.clientX - pan.x)/VT.s, dy = (e.clientY - pan.y)/VT.s;
    S.zoom.cx = clamp(pan.cx - dx/(S.zoom.k-1), W/4, 3*W/4); S.zoom.cy = clamp(pan.cy - dy/(S.zoom.k-1), H/4, 3*H/4); return; }
  let cur = 'default';
  if (S.mode===0 && S.pill[0]===0){ const i = hitBase(p); if (i !== S.m1.hover){ S.m1.hover = i; } if (i>=0) cur = 'pointer'; }
  else if (BLD()){ S.hoverBase = hitPal(p); if (S.hoverBase>=0) cur = 'pointer'; }
  else if (S.mode===0 && S.pill[0]===1 && S.m1.pref.sub==='conv' && hitRung(p)) cur = 'pointer';
  else if (S.mode===3) cur = m4Hover(p);
  if (S.zoom.k > 1 && cur==='default') cur = 'grab';
  cv.style.cursor = cur;
});
cv.addEventListener('pointerleave', () => { S.m1.hover = -1; if (BLD()) S.hoverBase = -1; S.m4.hist.hover = -1; S.m4.sci.hover = -1; });
cv.addEventListener('pointerdown', e => {
  if (e.button===1){ e.preventDefault(); cancelSelection(); return; }
  if (e.button!==0) return;

  if (s==='Ω') return '\\Omega';

    const m = /^(.*?)(?:\^\{?(-?\d+)\}?)?$/.exec(tok), base = m[1], p = m[2];

  if (S.pill[3]===1){
    const T = nsiState(), hide = T.prac && !S.m4.nsi.prac.result;
    return sec('c1','Conversion', hide ? '<div class="muted">Hidden until you ✓ Check.</div>' : L(nsiWorkTex(T)))
      + sec('c2','Rule', L(T.c.temp ? ['T/\\text{K} = \\theta/^{\\circ}\\text{C} + 273.15', '\\theta/^{\\circ}\\text{C} = (\\theta/^{\\circ}\\text{F} - 32)\\times\\tfrac{5}{9}']
                                    : ['\\text{value in S.I.} = \\text{value} \\times \\dfrac{\\text{size of 1 old unit in S.I.}}{1\\text{ old unit}}']));
  }
  const s = curSci(), eq = SCI_EQ[s.s];
  return sec('c1','From a defining equation to base units', L(eq)) + sec('c2','Naming check', L(['\\text{symbol: }' + texU(s.s) + '\\qquad\\text{name: ' + s.u + '}']));
}
const M4INFO = [
  `<ol class="steps"><li>The first standards came from the <b>human body</b> (cubit, foot) or from <b>nature</b> (grains, water, the Earth): easy to find, but never quite the same twice.</li>
   <li>Next came <b>made objects</b>: a metal bar for the metre and a metal cylinder for the kilogram (both 1889). Precise — but a single object can be damaged or slowly change.</li>
   <li>Then <b>atoms and light</b>: every atom of an isotope is identical, so any lab can rebuild the standard (krypton metre 1960, caesium second 1967).</li>
   <li>Since <b>20 May 2019</b>, all seven base units are fixed by <b>exact values of constants of nature</b> — the same everywhere, for ever.</li></ol>
   <div class="note">Pattern to remember: body → nature → made object → atoms → fixed constant.</div>`,
  `<ol class="steps"><li>Find how big <b>one</b> of the old unit is in S.I. units, e.g. 1 ft = 0.3048 m.</li>
   <li>Write it as a fraction equal to 1: (0.3048 m) / (1 ft).</li>
   <li>Multiply the value by this fraction — the old unit is on the top and the bottom, so it <b>cancels</b>.</li>
   <li>Give the answer in S.I. units, to a sensible number of significant figures.</li>
   <li>Temperature is different: the scales have different zeros, so you <b>add</b> as well as multiply (T/K = θ/°C + 273.15).</li></ol>
   <div class="note">Some non-S.I. units are accepted for use with S.I. (litre, tonne, hour, electronvolt), but in A-level calculations always convert to S.I. first.</div>`,
  `<ol class="steps"><li>19 S.I. units are named after scientists — two of them are base units (A, K).</li>
   <li>The <b>symbol</b> starts with a capital letter: N, Pa, J, W, Wb, Hz.</li>
   <li>The <b>name</b> written in full is all lower case: newton, pascal, joule — even though Newton and Pascal are people.</li>
   <li>Names take a normal plural (5 newtons); symbols never do (5 N, not 5 Ns).</li>
   <li>Exception: <b>degree Celsius</b> keeps its capital C (°C). The kelvin has no degree sign: 300 K.</li>
   <li>Prefix + symbol: the prefix keeps its own case — kW (kilowatt), MHz, mA.</li></ol>`
];
const CONSTS = `<div class="kv">${[['Δν(Cs) = 9 192 631 770 Hz','second'],['c = 299 792 458 m s⁻¹','metre'],['h = 6.626 070 15 × 10⁻³⁴ J s','kilogram'],['e = 1.602 176 634 × 10⁻¹⁹ C','ampere'],
  ['k = 1.380 649 × 10⁻²³ J K⁻¹','kelvin'],['N<sub>A</sub> = 6.022 140 76 × 10²³ mol⁻¹','mole'],['K<sub>cd</sub> = 683 lm W⁻¹','candela']].map(([a,b]) => `<span class="k">${a}</span><span class="v">${b}</span>`).join('')}</div>`;
const MIXUPS = `<ol class="steps"><li><b>Mars Climate Orbiter (1999):</b> one team’s software gave thruster impulse in pound-force seconds, the other expected newton seconds. The probe flew too low into the Martian atmosphere and was lost.</li>
  <li><b>The “Gimli Glider” (1983):</b> an Air Canada airliner’s fuel was worked out in pounds instead of kilograms, so it carried only about half the fuel it needed. It ran out in flight and glided to a safe landing at Gimli, Canada.</li></ol>`;
function m4Info(){
  const p = S.pill[3];
  return sec('i1','How it works — step by step', M4INFO[p])
    + (p===0 ? sec('i2','The seven defining constants (2019)', CONSTS) : p===1 ? sec('i2','Why it matters — costly mix-ups', MIXUPS) : '');
}
function m4Ans(){
  const p = S.pill[3];
  if (p===0){ const {P} = curHist();
    return sec('a1','Check yourself — ' + P.name, HQA[P.key].map(([q,a],i) => `<details class="qa"><summary><b>Q${i+1}.</b> ${q}</summary><div>${a}</div></details>`).join('')); }
  if (p===1){
    const N = S.m4.nsi, T = nsiState();
    if (N.sub==='prac'){
      const P = N.prac; let b = `<div class="qtext">${T.q.q} Convert it into ${plainU(T.c.si)}.</div>`;
      if (P.result) b += `<p style="margin-top:6px">${P.result.ok ? '<span class="verdict-ok">✓ Correct</span>' : '<span class="verdict-bad">✗ Not quite</span>'} — you wrote <code>${P.result.txt}</code></p><ol class="steps">${nsiWorkTex(T).map(t => '<li>' + K(t) + '</li>').join('')}</ol>`;
      else b += '<p class="muted" style="margin-top:6px">Type your answer in the toolbar (3 s.f. is fine) and press ✓ Check — ⌨ Keypad opens the calculator.</p>';
      return sec('a1','Practice', b) + `<div class="score">Score: ${P.ok} / ${P.n}</div>`;
    }
    return sec('a1','Worked conversion', `<ol class="steps">${nsiWorkTex(T).map(t => '<li>' + K(t) + '</li>').join('')}</ol>`);
  }
  const SPOT = [['5 Newtons','5 newtons, or 5 N — the name is lower case'],['3 kw','3 kW — k (kilo) is lower case, W (watt) is a capital'],['20 °K','20 K — the kelvin has no degree sign'],
    ['50 hz','50 Hz — named after Hertz, so the symbol starts with a capital'],['2 Pas','2 Pa — symbols never take a plural “s”'],['100 °c','100 °C — Celsius keeps its capital C']];
  return sec('a1','Spot the mistake', SPOT.map(([w,r],i) => `<details class="qa"><summary><b>${i+1}.</b> <code>${w}</code></summary><div>${r}</div></details>`).join(''));
}
function m4CardTex(){
  if (S.pill[3]===0){ const {P, M} = curHist(); return [M.calc[0], HNOW[P.key]]; }
  if (S.pill[3]===1){ const T = nsiState();
    if (T.c.temp) return ['T/\\text{K} = \\theta/^{\\circ}\\text{C} + 273.15', '\\theta/^{\\circ}\\text{C} = (\\theta/^{\\circ}\\text{F} - 32)\\times\\tfrac{5}{9}'];
    return ['x\\,[\\text{old}] \\times \\dfrac{f\\,[\\text{S.I.}]}{1\\,[\\text{old}]}', '1\\,' + texU(T.u.s) + ' = ' + texNum(fmtR(T.u.f, 6)) + '\\,' + texU(T.c.si)]; }
  const s = curSci(); return [SCI_EQ[s.s][0], SCI_EQ[s.s][1]];
}

/* ═══ 📖 Unit story card (Non-S.I. units) — draggable, on/off ═══ */
S.story = true; S.storyPos = null;
const STORY_SYS = {imp:'var(--amber)', acc:'var(--ok)', oth:'var(--rhs)', si:'var(--accent)'};
function renderStory(){
  const c = $('scard'), show = S.mode===3 && S.pill[3]===1 && S.story;
  $('tgStory').classList.toggle('on', S.story);
  c.hidden = !show; if (!show) return;
  const T = nsiState(), u = T.u, si = SI_STORY[T.c.key];
  const html = `<div class="sh" style="color:${STORY_SYS[u.sys]}">THIS UNIT · ${NSI_SYS[u.sys].toUpperCase()}</div>
    <div class="nm">${u.n} (${plainU(u.s)})</div><div>${NSI_STORY[u.s] || ''}</div>
    <div class="sh">THE S.I. UNIT</div>
    <div class="nm">${si.en} (${si.s})</div><div>French: <span class="fr">${si.fr}</span> · English: <span class="fr">${si.en}</span></div><div>${si.txt}</div>
    <div class="sh">WHY “S.I.”?</div><div>${SI_ABOUT}</div>`;
  if ($('scardB').innerHTML !== html) $('scardB').innerHTML = html;
  placeStory();
}
function placeStory(){
  const c = $('scard'); if (c.hidden) return;                             // position:fixed — free over the whole window
  const cw = c.offsetWidth, ch = c.offsetHeight;
  let p = S.storyPos;
  if (!p){ const r = $('cvbox').getBoundingClientRect(); p = {x: r.right - cw - 10, y: r.bottom - ch - 10}; }   // default: bottom-right of the canvas
  c.style.left = clamp(p.x, 4, Math.max(4, innerWidth - cw - 4)) + 'px';
  c.style.top  = clamp(p.y, 4, Math.max(4, innerHeight - ch - 4)) + 'px';
}
(function(){
  const h = $('scardH'); let drag = null;
  h.addEventListener('pointerdown', e => { const c = $('scard'); drag = {x:e.clientX, y:e.clientY, l:c.offsetLeft, t:c.offsetTop}; h.setPointerCapture(e.pointerId); });
  h.addEventListener('pointermove', e => { if (!drag) return; const c = $('scard');
    const l = clamp(drag.l + e.clientX - drag.x, 4, innerWidth - c.offsetWidth - 4), t = clamp(drag.t + e.clientY - drag.y, 4, innerHeight - c.offsetHeight - 4);
    c.style.left = l+'px'; c.style.top = t+'px'; S.storyPos = {x:l, y:t}; });
  h.addEventListener('pointerup', () => drag = null);
  h.addEventListener('dblclick', e => { S.storyPos = null; placeStory(); e.stopPropagation(); });
})();
$('tgStory').onclick = () => { S.story = !S.story; updateUI(); };

/* ═══ boot ═══ */
readColors();
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('cvwrap'));
resize(); restartTL(true); updateUI();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
if (document.fonts && document.fonts.load){
  Promise.all(['italic 20px KaTeX_Math','20px KaTeX_Main','600 14px Inter'].map(f => document.fonts.load(f).catch(()=>null))).then(() => { draw(); });
}
