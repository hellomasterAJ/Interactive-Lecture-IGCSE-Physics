/* ══ BASE ══ */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  padding:6px 10px;display:flex;flex-direction:column;align-items:center;
  transition:background .25s,color .25s;font-size:13px}
.container{max-width:1620px;width:100%;height:100%;display:flex;flex-direction:column;min-height:0;gap:5px}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

/* ── top bar (45 px: the brand sets it) ── */
.top-bar{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;gap:8px}
.top-bar h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.badge-top{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;padding:2px 8px;border-radius:12px;
  background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent)}
.top-right{display:flex;gap:8px;align-items:center}
.theme-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;
  border-radius:8px;cursor:pointer;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;
  outline:none;min-width:110px}
.brand{background:#F4C01E;border-radius:10px;padding:7px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);
  display:flex;align-items:center}
.brand img{height:31px;width:auto;display:block}
@media(max-width:640px){.brand{display:none}}

/* ── the three modes ── */
.tabrow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:4px;flex:0 0 auto;height:42px;align-items:center}
.tab{height:32px;line-height:32px;padding:0 10px;border:none;border-radius:7px;
  background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;
  transition:all .18s;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--card2)}
.tab:focus-visible,.pill:focus-visible,.ctrl-btn:focus-visible,.ptab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tab.active{background:var(--accent);color:var(--bg)}

/* ── example pills: one row, the group sits under its own mode tab ── */
.pillrow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-items:center;flex:0 0 auto;height:32px;padding:0 5px}
#gSub{justify-self:center}
.pills{display:flex;gap:3px;background:var(--card);border:1px solid var(--border);border-radius:9px;
  padding:3px;height:30px;align-items:center}
.pill{padding:0 10px;height:22px;line-height:22px;border:none;border-radius:6px;background:transparent;
  color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .16s}
.pill:hover{color:var(--text)}
.pill.active{background:var(--accent);color:var(--bg)}
#gSub .pill{font-size:11.5px;padding:0 11px}
.tlabel{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
.spacer{flex:1 1 auto}
.hintchip{flex:1 1 0;min-width:0;font-size:10.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}

/* ── toolbar (2 rows, fixed height) ── */
.toolbar{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:7px 11px;flex:0 0 auto}
.trow{display:flex;gap:8px 12px;align-items:center;flex-wrap:nowrap;overflow:hidden;height:30px}
.tgroup{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.tgroup+.tgroup{border-left:1px solid var(--border);padding-left:12px}
.tgroup.nb{border-left:0;padding-left:0}
.ctrl-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:0 11px;
  height:28px;line-height:26px;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:600;
  transition:all .16s;white-space:nowrap}
.ctrl-btn:has(.ppl){display:inline-grid;justify-items:center;align-items:center}
.ppl{grid-area:1/1;visibility:hidden}
.ppl.on{visibility:visible}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.ctrl-btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.ctrl-btn.primary:hover{filter:brightness(1.08);color:var(--bg)}
.ctrl-btn.on{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.ctrl-btn.locked,.pills.locked{opacity:.38;pointer-events:none}

/* parameter controls: name | slider-or-typed-box | value+unit — the name toggles the input surface */
.sliders{display:flex;gap:12px;align-items:center;flex-wrap:nowrap;overflow:hidden;height:30px}
.sl{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
.sl .sl-t{font-size:10.5px;color:var(--text-dim);cursor:pointer;user-select:none;display:flex;align-items:center}
.sl .sl-t:hover{color:var(--accent)}
.sl .tg{display:inline-block;width:20px;height:11px;margin-left:5px;border-radius:6px;
  background:var(--border);position:relative;transition:background .15s}
.sl .tg::after{content:'';position:absolute;top:1px;left:1px;width:9px;height:9px;border-radius:50%;
  background:#fff;transition:left .15s}
.sl.typed .tg{background:var(--accent)}
.sl.typed .tg::after{left:10px}
.sl .mid{width:92px;display:inline-flex;align-items:center}
.sl input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;height:16px}
.sl .tin{width:100%;height:22px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;text-align:right;
  border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);padding:0 5px;outline:none}
.sl .tin:focus{border-color:var(--accent)}
.sl .tin.bad{border-color:var(--red);color:var(--red)}
.sl .val{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;color:var(--text);
  min-width:58px;text-align:right}
.sl.locked{opacity:.38;pointer-events:none}
.sliders.c1 .sl .mid{width:76px}
.sliders.c2 .sl .mid{width:62px}
.sliders.c2 .sl .val{min-width:50px}
.sliders.c3 .sl .mid{width:48px}
.sliders.c3 .sl .val{min-width:44px}


/* ── main split 70/30 ── */
.main{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,7fr) minmax(320px,3fr);
  grid-template-rows:minmax(0,1fr);gap:8px;min-height:0}
.cvwrap{position:relative;background:var(--graph-bg);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;min-height:0}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.cchip{position:absolute;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;padding:3px 8px;
  border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text-dim);pointer-events:none;
  white-space:nowrap}
.cchip:empty{display:none}
#chipEq{top:8px;right:10px;color:var(--katex-color);border-color:var(--accent);padding:6px 11px;line-height:1.7;
  pointer-events:auto;cursor:move;font-size:12px;user-select:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#chipEq > div:not(.eqh){margin:6px 0;line-height:1.6}
#chipEq .eqh{display:flex;align-items:center;justify-content:center;gap:6px;font-size:9px;color:var(--accent);letter-spacing:.6px;text-transform:uppercase;line-height:1;margin-bottom:2px}
#chipEq .grip{width:9px;height:9px;flex:0 0 auto;opacity:.8;
  background-image:radial-gradient(circle,var(--accent) 0.9px,transparent 1.2px);background-size:3px 3px}
#chipTime{left:10px;color:var(--amber);border-color:var(--amber)}
#chipZoom{left:10px;color:var(--accent);border-color:var(--accent)}
#chipState{right:10px;color:var(--green);border-color:var(--green)}
#chipHint{right:10px;line-height:1.5;text-align:right}
sub{font-size:.72em;vertical-align:-.28em}
sup{font-size:.72em;vertical-align:.4em}

/* ── side panel ── */
.panel{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);
  border-radius:12px;min-height:0;overflow:hidden}
.ptabs{display:flex;gap:3px;padding:5px;border-bottom:1px solid var(--border);flex:0 0 auto}
.ptab{flex:1 1 0;padding:5px 4px;border:none;border-radius:7px;background:transparent;color:var(--text-dim);
  font-size:11px;font-weight:600;cursor:pointer;transition:all .16s;white-space:nowrap}
.ptab:hover{color:var(--text);background:var(--card2)}
.ptab.active{background:var(--accent-glow);color:var(--accent)}
.pbody{position:relative;flex:1 1 auto;overflow-y:auto;padding:9px 11px;min-height:0}
.pbody::-webkit-scrollbar{width:8px}
.pbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sh{color:var(--text-muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;padding:8px 0 4px}
.sh:first-child{padding-top:2px}
.kv{display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px dashed var(--border);font-size:11.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-dim)}
.kv .v{margin-left:auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;color:var(--text);
  white-space:nowrap;text-align:right}
.kv .v.hi{color:var(--accent);font-weight:700}
.kv .v.t{font-family:inherit;white-space:normal;max-width:62%;font-size:11px}
.kv.energy .v{color:var(--energy);font-weight:600;white-space:normal;font-family:inherit;max-width:68%;font-size:11px}
.note{font-size:11.5px;line-height:1.62;color:var(--text-dim);margin:6px 0}
.note b{color:var(--text)}
.eqbox{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin:7px 0;
  overflow-x:auto;color:var(--katex-color);min-height:34px}
.eqbox .katex{font-size:1.04em}
.ct{font-size:10px;letter-spacing:.55px;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin:10px 0 1px}
.cn{font-size:11px;line-height:1.5;color:var(--text-muted);margin:3px 0 0}
.cn.ok{color:var(--green)}
.steps{margin:6px 0 6px 18px;padding:0}
.steps li{font-size:11.5px;line-height:1.6;color:var(--text-dim);margin-bottom:5px}
.steps li b{color:var(--text)}
.qcard{background:var(--card2);border:1px solid var(--accent);border-radius:9px;padding:9px 11px;margin:2px 0 8px}
.qcard .h{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700}
.qcard .q{font-size:12px;line-height:1.6;color:var(--text);margin-top:4px}
.mk{display:inline-block;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;padding:0 5px;border-radius:6px;
  border:1px solid var(--border);color:var(--text-muted);margin-left:4px}

/* ── bottom bar ── */
.bottom-bar{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;
  font-size:10.5px;color:var(--text-muted);padding:0 3px;height:18px}
.bottom-bar .mono{color:var(--text-dim)}
</style>
</head>

  <div class="tabrow" id="gTabs">
    <button class="tab active" data-md="1">1 · Wave Properties</button>
    <button class="tab" data-md="2">2 · Progressive</button>
    <button class="tab" data-md="3">3 · Stationary</button>

  <div class="pillrow" id="pillrow">
    <div class="pills" id="gSub"></div>
  </div>

  <div class="toolbar">
    <div class="trow" id="row1">
      <!-- Mode 1.2 oscilloscope -->
      <div class="tgroup nb" data-sub="1cro"><span class="tlabel">V/div</span>
        <div class="pills" id="gVdiv"></div></div>
      <div class="tgroup" data-sub="1cro"><span class="tlabel">time/div</span>
        <div class="pills" id="gTdiv"></div></div>
      <div class="tgroup" data-sub="1cro">
        <button class="ctrl-btn" id="tReveal" title="show the worked reading: construction lines, counted divisions and the answers">! Reveal</button>
        <button class="ctrl-btn" id="bNewSig" title="a new signal and new dial settings — always a whole number of divisions">🎲 New signal</button>
      </div>
      <!-- Mode 1.3 phase -->
      <div class="tgroup nb" data-sub="1ph"><div class="pills" id="gPhStep">
        <button class="pill active" data-v="circle" title="phase as an angle: one turn of the circle traces one whole wave">① Circle</button>
        <button class="pill" data-v="super" title="wave 1, wave 2 and the two added point by point">② Superposition</button></div></div>
      <div class="tgroup" data-sub="1ph" data-step="circle"><span class="tlabel">Start φ</span><div class="pills" id="gPhStart">
        <button class="pill active" data-v="0" title="start at the rest position, moving up">0°</button>
        <button class="pill" data-v="90" title="start at a crest">90°</button>
        <button class="pill" data-v="180" title="start at the rest position, moving down">180°</button>
        <button class="pill" data-v="270" title="start at a trough">270°</button></div></div>
      <div class="tgroup" data-sub="1ph" data-step="super"><div class="pills" id="gPhScn">
        <button class="pill active" data-v="same" title="both waves travel to the right, starting together">In phase</button>
        <button class="pill" data-v="phi" title="both travel to the right; wave 2 lags by φ">φ apart</button>
        <button class="pill" data-v="opp" title="wave 2 travels to the left">Opposite directions</button></div></div>
      <div class="tgroup" data-sub="1ph"><div class="sliders" id="gCtrl1"></div></div>
      <!-- Mode 2.1 -->
      <div class="tgroup nb" data-sub="2d1"><div class="pills" id="gType">
        <button class="pill active" data-v="T">Transverse</button>
        <button class="pill" data-v="L">Longitudinal</button></div></div>
      <!-- Mode 2.2 -->
      <div class="tgroup nb" data-sub="2rip"><span class="tlabel">Source</span><div class="pills" id="gSrc">
        <button class="pill active" data-v="point" title="a dipper touching the water at one point — circular wavefronts">◎ Point dipper</button>
        <button class="pill" data-v="plane" title="a straight bar dipping into the water — plane wavefronts">≡ Straight bar</button></div></div>
      <!-- Mode 3.1 -->
      <div class="tgroup nb" data-sub="3str"><span class="tlabel">Tune to</span><div class="pills" id="gHarm">
        <button class="pill" data-v="1" title="set the generator to the fundamental frequency f₁">1st harmonic</button>
        <button class="pill" data-v="2" title="set the generator to f₂ = 2f₁">2nd</button>
        <button class="pill" data-v="3" title="set the generator to f₃ = 3f₁">3rd</button>
        <button class="pill" data-v="4" title="set the generator to f₄ = 4f₁">4th</button></div></div>
      <div class="tgroup" data-sub="3str">
        <button class="ctrl-btn on" id="tComp" title="the two progressive waves (one each way) whose sum is the stationary wave">≋ Components</button>
        <button class="ctrl-btn" id="tSnap" title="graphs of the two waves and their sum at t = 0, T/4, T/2, 3T/4 and T">📊 Snapshots</button></div>
      <!-- Mode 3.2 -->
      <div class="tgroup nb" data-sub="3tube"><div class="pills" id="gTexp">
        <button class="pill active" data-v="speaker" title="a loudspeaker at a tube of fixed length — change the frequency">🔊 Speaker · vary f</button>
        <button class="pill" data-v="fork" title="a tuning fork of fixed frequency over a water-filled tube — change the water level">🍴 Fork · water level</button></div></div>
      <div class="tgroup" data-sub="3tube" data-exp="speaker"><div class="pills" id="gTube">
        <button class="pill active" data-v="oo" title="open at both ends — displacement antinode at each end">open–open</button>
        <button class="pill" data-v="oc" title="open at the left, closed at the right — node at the closed end">open–closed</button></div></div>
      <div class="tgroup" data-sub="3tube" data-exp="fork"><span class="tlabel">Fork</span><div class="pills" id="gFork"></div></div>
      <div class="tgroup" data-sub="3tube" data-exp="fork">
        <button class="ctrl-btn" id="bRecord" title="record the current air-column length (do it where the sound is loudest)">📌 Record L</button>
        <button class="ctrl-btn" id="bClearRec" title="clear the recorded readings">Clear</button>
        <button class="ctrl-btn" id="tRevealW" title="show the theoretical loudness curve and resonance lengths">! Reveal</button></div>
      <div class="tgroup" data-sub="3tube" data-exp="speaker"><span class="tlabel">Tune to</span><div class="pills" id="gTmode">
        <button class="pill" data-v="1">1st mode</button>
        <button class="pill" data-v="2">2nd</button>
        <button class="pill" data-v="3">3rd</button></div></div>
      <!-- Mode 3.3 -->
      <div class="tgroup nb" data-sub="3pl"><span class="tlabel">Mode (n,m)</span><div class="pills" id="gPlate"></div></div>
      <div class="tgroup" data-sub="3pl">
        <button class="ctrl-btn" id="tAnti" title="colour the antinodal (most strongly moving) regions">◉ Antinodes</button>
        <button class="ctrl-btn" id="bSprinkle" title="scatter fresh sand evenly over the plate">🧂 Re-sprinkle</button></div>
      <!-- energy (2.1, 2.2, 3.1) -->
      <div class="tgroup" data-sub="2d1 2rip 3str" id="gEnergy">
        <button class="ctrl-btn" id="tEnergy" title="energy tokens: do they travel along the wave or stay in place?">⚡ Energy</button></div>
      <span class="spacer"></span>
      <div class="tgroup nb">
        <button class="ctrl-btn" id="tGrid" title="grid lines on the graphs">▦ Grid</button>
        <button class="ctrl-btn on" id="tLabels" title="names and markers on the diagram">Labels</button>
        <button class="ctrl-btn" id="tFormula" title="the equations, as a card you can drag">Formula</button>
      </div>
    </div>

    <div class="trow" id="row2">
      <div class="tgroup nb" id="gShow"><span class="tlabel">Show</span>
        <button class="ctrl-btn on" id="tHints" title="how-to hints — bottom-right corner of the canvas">Hints</button>
        <button class="ctrl-btn on" id="tClock" title="time / slow-motion note — bottom-left corner of the canvas">Time</button>
        <button class="ctrl-btn on" id="tStatus" title="status, e.g. RESONANCE — top-right corner of the canvas">Status</button>
      </div>
      <div class="tgroup">
        <button class="ctrl-btn primary" id="bPlay" title="Space"><span class="ppl on" data-pp="pause">Pause</span><span class="ppl" data-pp="play">Play</span></button>
        <div class="pills" id="gSpeed">
          <button class="pill" data-v="0.5">0.5×</button>
          <button class="pill active" data-v="1">1×</button>
          <button class="pill" data-v="2">2×</button>
        </div>
      </div>
      <div class="tgroup">
        <div class="sliders" id="gCtrl"></div>
      </div>
      <span class="spacer"></span>
      <div class="tgroup nb">
        <button class="ctrl-btn" id="bReset" title="Reset — restores the defaults of the CURRENT mode only (other modes keep their settings)">Reset</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="cvwrap" id="cvwrap">
      <canvas id="cv"></canvas>

        <button class="ptab" data-p="ans">✍️ Answer</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </div>

var STR = { X0: 200, X1: 1000, y0: 250, amax: 70, Q: 18, NMAX: 8 };

function strModes() {

    var a = (1 / STR.Q) / Math.sqrt(re * re + im * im), dl = Math.atan2(im, re);
    out.push({ n: n, fn: fn, a: a, d: dl });

/* At resonance the string IS the pure standing wave of the dominant harmonic —
   exactly the sum of the two drawn progressive components. (v1.0.2 summed every
   mode's off-resonance response too: at f₂ the 3rd…8th harmonics added up to ~40 %
   of the amplitude with a different phase, so the string wiggled like bent wire

/* a ×6 lens on the mouth of the tube, where the end correction lives */
function fkMagnifier(cx, top, a, k, e, Le, yw, P, half) {
  var mx = 228, my = 176, mr = 62, Z = 6, ox = cx + half - 8, oy = top;    /* lens centre and what it looks at */
  line(cx - half - 2, top, mx + mr * 0.85, my - mr * 0.5, rgba(C.textDim, 0.5), 1, [3, 3]);
  CX.save(); CX.beginPath(); CX.arc(mx, my, mr, 0, TAU); CX.fillStyle = C.graphBg; CX.fill(); CX.clip();
  CX.translate(mx, my); CX.scale(Z, Z); CX.translate(-ox, -oy);
  CX.fillStyle = rgba(C.tube, 0.06); CX.fillRect(cx - half, top, 2 * half, 40);
  line(cx + half, top, cx + half, top + 40, C.tube, 3 / Z * 2);
  var ampPx = 16 * a;

    CX.beginPath();
    for (var i = 0; i <= 120; i++) { var d = Le - 0.05 + 0.05 * i / 120, x = cx + ampPx * Math.abs(Math.sin(k * d)); if (i) CX.lineTo(x, yw - d * P); else CX.moveTo(x, yw - d * P); }
    CX.strokeStyle = rgba(C.waveL, 0.9); CX.lineWidth = 1.5 / Z * 2; CX.setLineDash([5 / Z, 4 / Z]); CX.stroke(); CX.setLineDash([]);
  }
  var ya = yw - Le * P;
  if (a > 0.6) {
    CX.beginPath(); CX.moveTo(cx + 2, ya - 1.2); CX.lineTo(cx + 3.2, ya); CX.lineTo(cx + 2, ya + 1.2); CX.lineTo(cx + 0.8, ya); CX.closePath(); CX.fillStyle = C.antinode; CX.fill();
  }
  line(cx - 4, top, cx + half + 3, top, rgba(C.text, 0.6), 0.25, [1, 1]);
  line(cx + 6, ya, cx + half + 3, ya, rgba(C.antinode, 0.8), 0.25, [1, 1]);

    T('rim', mx - mr + 8, yRim - 8, { size: 11, wt: 700, color: C.textDim });
    if (a > 0.6) T('A', mx - 6, yAnt - 9, { size: 11.5, wt: 800, color: C.antinode, align: 'right' });
    T('end correction e ≈ 0.6r = ' + fx(e * 100, 1) + ' cm', mx, my + mr + 16, { size: 12, wt: 700, color: C.antinode, align: 'center' });
    T('the antinode is just ABOVE the open end', mx, my + mr + 33, { size: 11, color: C.textMuted, align: 'center' });

    var f = CRO_F[Math.floor(sigR() * CRO_F.length)], td = TDIVS[Math.floor(sigR() * TDIVS.length)], vd = VDIVS[Math.floor(sigR() * VDIVS.length)];
    var hd = 2 + 2 * Math.floor(sigR() * 4), V0 = hd * vd / 2, n = (1000 / f) / td; tries++;
  } while ((!isWhole(n) || n < 2 || n > 10 || V0 < 0.5 || V0 > 10 || !isWhole(V0 / 0.5) || (f === c.f && td === c.tdiv && vd === c.vdiv && V0 === c.V0)) && tries < 500);
  c.f = f; c.tdiv = td; c.vdiv = vd; c.V0 = V0; c.reveal = false;
  syncCtrlVals(); syncToolbar(); renderPanel();
}

function init() {
  CV = $('cv'); CX = CV.getContext('2d');

}
