 background:var(--bg);color:var(--text);transition:background .3s,color .3s}
.container{max-width:1680px;width:100%;height:100%;display:flex;flex-direction:column;min-height:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* ── header ── */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;
 flex-wrap:wrap;gap:8px;flex:0 0 auto}
.top-bar h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;
 font-family:'Roboto Slab','Inter',Georgia,serif}
.badge-top{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:9px;padding:2px 8px;border-radius:12px;
 background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent)}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.theme-select{background:var(--card);border:1px solid var(--border);color:var(--text);
 padding:4px 10px;border-radius:8px;cursor:pointer;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
 font-size:11px;outline:none;min-width:110px}
.brand{background:#F4C01E;border-radius:10px;padding:7px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);
 display:flex;align-items:center}
.brand img{height:31px;width:auto;display:block}
@media(max-width:640px){.brand{display:none}}
.mode-tabs{display:flex;gap:4px;background:var(--card);border-radius:8px;padding:3px;
 border:1px solid var(--border)}
.mode-tab{padding:5px 12px;border-radius:6px;border:none;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
 font-size:10px;cursor:pointer;transition:all .2s;background:transparent;color:var(--text-dim)}
.mode-tab:hover{color:var(--text)}
.mode-tab.active{background:var(--accent-glow);color:var(--accent)}
/* ── mode tab row + example pills (the pill row sits under its own tab) ── */
.gtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:0 0 auto;margin-bottom:5px}
.gtab{padding:7px 8px;border-radius:9px;border:1px solid var(--border);background:var(--card);
 color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;font-family:inherit}
.gtab:hover{color:var(--text);border-color:var(--accent)}
.gtab.on{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.locked{opacity:.35;pointer-events:none}
.gsubwrap{display:block;flex:0 0 auto;margin-bottom:5px;overflow:visible;height:25px}
.gsub{display:inline-flex;gap:5px;flex-wrap:nowrap;overflow:visible;justify-content:flex-start}
.pill{padding:4px 9px;border-radius:7px;border:1px solid var(--border);background:var(--card);
 color:var(--text-dim);font-size:10.5px;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.pill:hover{color:var(--text);border-color:var(--accent)}
.pill.on{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
/* ── toolbar, two fixed rows ── */
.tbar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:5px 8px;
 display:flex;align-items:center;gap:7px;flex:0 0 auto;margin-bottom:5px;height:36px;
 overflow:hidden}
.tbar+.tbar{margin-bottom:6px}
.tgroup{display:flex;align-items:center;gap:5px;padding-right:7px;border-right:1px solid var(--border);flex:0 0 auto}
.tgroup:last-child{border-right:none;padding-right:0}
.tgroup.dim{opacity:.35;pointer-events:none}
.tgl{font-size:8.5px;letter-spacing:.07em;color:var(--text-muted);font-weight:700;
 text-transform:uppercase;white-space:nowrap}
.btn{padding:4px 9px;border-radius:7px;border:1px solid var(--border);background:var(--card2);
 color:var(--text-dim);font-size:10.5px;cursor:pointer;white-space:nowrap;transition:all .15s;
 font-family:inherit}
.btn:hover{color:var(--text);border-color:var(--accent)}
.btn.on{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.btn.wide{display:inline-grid;text-align:center}
.btn.wide>span{grid-area:1/1;visibility:hidden}
.btn.wide>span.sh{visibility:visible}
.tsel{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:7px;
 font-size:10.5px;padding:3px 5px;font-family:inherit;cursor:pointer;outline:none}
.spacer{flex:1 1 auto}
/* slider ⇄ typed box: the slot width never changes */
.sl{display:flex;align-items:center;gap:5px;white-space:nowrap}
.sl-t{font-size:10px;color:var(--text-dim);cursor:pointer;user-select:none}
.sl-t:hover{color:var(--accent)}
.tg{display:inline-block;width:19px;height:11px;margin-left:4px;border-radius:6px;
 background:var(--border);position:relative;vertical-align:middle;transition:background .15s}
.tg::after{content:'';position:absolute;top:1px;left:1px;width:9px;height:9px;border-radius:50%;
 background:#fff;transition:left .15s}
.sl.typed .tg{background:var(--accent)}
.sl.typed .tg::after{left:9px}
.mid{width:92px;display:inline-flex;flex:0 0 92px}
.mid input[type=range]{width:92px;flex:0 0 92px;accent-color:var(--accent);height:14px;margin:0}
.mid input.tin{width:92px;flex:0 0 92px;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10px;
 text-align:right;border:1px solid var(--border);border-radius:5px;background:var(--bg);
 color:var(--text);padding:1px 4px;outline:none}
.mid input.tin.bad{border-color:var(--red);color:var(--red)}
.val{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:var(--accent);min-width:58px}
@media(max-width:1450px){.mid,.mid input[type=range],.mid input.tin{width:72px;flex-basis:72px}}
@media(max-width:1280px){.mid,.mid input[type=range],.mid input.tin{width:58px;flex-basis:58px}
 .val{min-width:52px}}
@media(max-width:1100px){.tgl{display:none}}
/* ── stage: canvas 70 / panel 30 ── */
.stage{display:grid;grid-template-columns:7fr 3fr;gap:8px;flex:1 1 auto;min-height:0}
.cvwrap{position:relative;background:var(--plate);border:1px solid var(--border);border-radius:12px;
 overflow:hidden;min-height:0}
#cv{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.chip{position:absolute;font-size:11px;line-height:1.45;padding:4px 9px;border-radius:8px;
 background:var(--chip-bg);border:1px solid var(--border);color:var(--text-dim);pointer-events:none;max-width:46%}
.chip:empty{display:none}
.chip b{color:var(--accent)}
#chipTL{left:10px;top:8px;font-weight:700;color:var(--text)}
#chipTR{right:10px;top:8px;color:var(--amber);font-weight:700;text-align:right}
#chipBL{left:10px;bottom:8px}
#chipBR{right:10px;bottom:8px;text-align:right}
#chipZ{left:50%;top:8px;transform:translateX(-50%);color:var(--gold)}
/* draggable FORMULA card, typeset with KaTeX, floating over the canvas */
.fcardF{position:absolute;z-index:5;background:var(--card);border:1px solid var(--accent);border-radius:10px;
 box-shadow:0 6px 20px rgba(0,0,0,.35);padding:6px 12px 9px;min-width:190px;max-width:380px}
.fcardF[hidden]{display:none}
.fcardF .fH{display:flex;align-items:center;justify-content:center;gap:7px;cursor:move;user-select:none;
 font-size:9.5px;letter-spacing:.1em;color:var(--text-muted);font-weight:700;padding-bottom:4px}
.grip{display:inline-grid;grid-template-columns:repeat(3,3px);grid-gap:2px}
.grip i{width:3px;height:3px;border-radius:50%;background:var(--text-muted);display:block}
.fcardF .fB{font-size:14px;color:var(--text)}
.fcardF .fB .katex-display{margin:8px 0;text-align:left}
.pan{background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;
 flex-direction:column;min-height:0;overflow:hidden}
.ptabs{display:flex;gap:3px;padding:6px 6px 0 6px;flex:0 0 auto}
.ptab{flex:1;padding:6px 2px;border-radius:8px 8px 0 0;border:1px solid var(--border);
 border-bottom:none;background:var(--card2);color:var(--text-dim);font-size:10.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.ptab.on{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.pfold{display:flex;gap:6px;padding:5px 8px 0 8px;flex:0 0 auto}
.pfold button{background:none;border:none;color:var(--text-muted);font-size:9.5px;cursor:pointer;font-family:inherit}
.pfold button:hover{color:var(--accent)}
#pbody{flex:1 1 auto;overflow-y:auto;padding:6px 10px 14px 10px;font-size:12px;min-height:0}
#pbody::-webkit-scrollbar{width:7px}
#pbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
#row1 sub,#row2 sub,.sl-t sub,.btn sub,#pbody sub{font-size:.70em;line-height:0;position:relative;top:.28em}
#pbody sup{font-size:.70em;line-height:0;position:relative;top:-.45em}
.fsec{margin-bottom:7px}
.fh{display:flex;align-items:center;gap:7px;width:100%;background:var(--card2);border:1px solid var(--border);
 border-radius:7px;padding:5px 8px;color:var(--accent);font-size:10px;font-weight:700;
 letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:inherit;text-align:left;
 transition:background .13s,border-color .13s}
.fh:hover{background:var(--card);border-color:var(--accent)}
.fh .cv{transition:transform .17s;font-size:13px;line-height:1;width:12px;text-align:center;flex:0 0 12px;opacity:.9}
.fsec.closed .fh .cv{transform:rotate(-90deg)}
.fsec.closed .fh{color:var(--text-dim)}
.fsec.closed .fbody{display:none}
.fbody{padding:6px 2px 2px 2px}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:11.5px}
.row .k{color:var(--text-dim)}
.row .v{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--text);text-align:right}
.row .v.hi{color:var(--accent)}
.note{font-size:11px;color:var(--text-dim);line-height:1.5;margin:3px 0}
.note b{color:var(--text)}
ol.steps{margin:2px 0 2px 16px;font-size:11.5px;color:var(--text-dim);line-height:1.55}
ol.steps li{margin-bottom:3px}
ol.steps b{color:var(--text)}
.eqbox{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;
 margin:5px 0;overflow-x:auto;font-size:13px}
.eqbox .katex-display{margin:0;text-align:left}
.symrow{display:flex;gap:8px;padding:3px 0;font-size:11.5px;align-items:baseline;flex-wrap:wrap}
.symrow .ks{min-width:46px;font-family:'KaTeX_Math','Times New Roman',serif;font-style:italic;
 color:var(--accent);font-size:13px}
.symrow .kd{color:var(--text-dim);flex:1 1 150px}
.symrow.long .kd{flex-basis:100%;padding-left:12px}
.psel{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:6px;
 font-size:11px;padding:2px 4px;font-family:inherit;max-width:100%}
table.dt{width:100%;border-collapse:collapse;font-size:10.5px;margin:4px 0}
table.dt td,table.dt th{border-bottom:1px solid var(--border);padding:3px 4px;text-align:right}
table.dt td:first-child,table.dt th:first-child{text-align:left}
table.dt th{color:var(--text-muted);font-weight:600}
table.dt tr.hl td{color:var(--accent);font-weight:700}
.ansrow{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.ansrow input.ab{flex:1 1 110px;min-width:90px;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:12px;
 padding:5px 7px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none}
.ansrow input.ab:focus{border-color:var(--accent)}
.ansrow .u{font-size:11px;color:var(--text-dim)}
.chipsel{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
.opt{display:block;width:100%;text-align:left;margin:3px 0;padding:6px 9px;border-radius:8px;
 border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:11.5px;
 cursor:pointer;font-family:inherit}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-glow)}
.opt.ok{border-color:var(--green);color:var(--green);background:transparent}
.opt.no{border-color:var(--red);color:var(--red);background:transparent}
.opt.pillopt{display:inline-block;width:auto;margin:3px 3px 3px 0;border-radius:16px;padding:5px 12px}
.tick{font-size:11px;margin:3px 0;color:var(--text-dim)}
.tick.done{color:var(--green)}
.tick.bad{color:var(--red)}
.qstem{font-size:12px;color:var(--text);line-height:1.5;margin:5px 0}
table.res{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
table.res td,table.res th{border:1px solid var(--border);padding:3px 5px;text-align:left}
table.res th{color:var(--text-muted);font-weight:600}
.stars{color:var(--gold);font-size:15px;letter-spacing:2px}
/* ── floating keypad card (natural-display scientific calculator) ── */
.fcard{position:fixed;z-index:60;background:var(--card);border:1px solid var(--accent);
 border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.fcard[hidden]{display:none}
.fcard .fhk{display:flex;align-items:center;justify-content:center;gap:7px;cursor:move;user-select:none;
 padding:6px 8px 2px;font-size:9.5px;letter-spacing:.1em;color:var(--text-muted);font-weight:700}
.kcard{width:320px;outline:none}
.kcard:focus-within,.kcard:focus{box-shadow:0 0 0 2px var(--accent-glow),0 8px 24px rgba(0,0,0,.35)}
.kcard .kb{padding:8px}
.kdisp{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:4px 8px;margin-bottom:6px;min-height:48px}
.kexpr{font-size:13px;color:var(--text);overflow-x:auto;overflow-y:hidden;white-space:nowrap;min-height:30px;padding:2px 0;text-align:right}
.kexpr .katex{font-size:1.15em}
.kres{font-family:'KaTeX_Main','Times New Roman',serif;font-size:20px;color:var(--text);text-align:right;min-height:26px;overflow-x:auto;overflow-y:hidden}
.kres.err{color:var(--red);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.knote{font-size:11px;color:var(--amber);text-align:right;min-height:14px}
.kgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.kgrid button{height:28px;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:6px;cursor:pointer;
 font-family:'KaTeX_Main','Times New Roman',serif;font-size:15px;padding:0}
.kgrid button:hover{border-color:var(--accent);color:var(--accent)}
.kgrid button.fn{color:var(--accent);font-size:14px}
.kgrid button.ctl{color:var(--amber);font-family:'Inter',sans-serif;font-size:11px;font-weight:700}
.kgrid button.go{background:var(--accent);color:var(--bg);border-color:var(--accent);font-family:'Inter',sans-serif;font-size:12px;font-weight:700}
.kgrid .s2{grid-column:span 2}
.kgrid .s6{grid-column:span 6}
.kgrid button.nav{color:var(--text-dim);font-size:13px}
.kgrid button.sm{font-size:14px}
.kgrid button sup{font-size:.7em}
.kgrid button.frk{display:flex;align-items:center;justify-content:center}
.frl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.frl i{display:block;width:7px;height:7px;border:1.4px solid currentColor;border-radius:1.5px}
.frl b{display:block;width:13px;height:0;border-top:1.6px solid currentColor}
.khelp{font-size:9.5px;color:var(--text-muted);margin-top:5px;line-height:1.35}
/* half-screen windows: the panel moves under the canvas so the canvas keeps its width */
@media(max-width:1100px){
 .stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
 .cvwrap{aspect-ratio:16/9;max-height:calc(100vh - 330px)}}
</style>
</head>

<script>

  if (v === 0) return '0';

  m = Number(m.toPrecision(sf)); if (Math.abs(m) >= 10) { m /= 10; e++; }

  m = Number(m.toPrecision(sf)); if (Math.abs(m) >= 10) { m /= 10; e++; }

/* ── state ─────────────────────────────────────────────────────────── */
var S = {
  md: 1, mode: 'sim', theme: 'dark', hoverK: null, mouseL: null, hovBig: null, hovLab: null,
  ex: { 1: 'planets', 2: 'day', 3: 'gravity' },
  play: true, speed: 1,
  days: 0,                 /* THE orbital-time variable, in days          */
  t: 0,                    /* real seconds (decoration only)             */
  zoom: 1, panX: 0, panY: 0, panning: false, px: 0, py: 0, moved: 0,
  show: { hints: true, labels: true, formula: false },
  v: {}, typed: {}, fold: {}, tab: 'data', cardPos: {}, fPos: null,
  sel: null,               /* the body picked in sub-mode 1             */
  lat: 13.8, city: 'bkk',
  prac: { i: 0, done: {}, shown: {}, pick: {} },
  quiz: { i: 0, first: [], tries: [], picked: [], done: false },
  keypad: false, kpPos: null

window.S = S;

/* ── theme colours, read once per theme change ─────────────────────── */
var C = {};
var CKEYS = 'bg card card2 border ink text text-dim text-muted accent accent-glow green red amber violet blue gold plate chip-bg space space2 cvtext cvdim cvmuted orbit orbithi label rocky gaseous ion dust terminator force vel cplate star belt grid sun sun-core sun-glow sun-red mercury venus earth-sea earth-land earth-ice earth-desert mars jupiter jupiter-band jupiter-spot saturn saturn-ring uranus neptune pluto ceres moon moon-mare moon-dark rock rock-lt h he heavy sky-day sky-day2 sky-dusk sky-dusk2 sky-night sky-night2 ground ground2 umbra penumbra blood'.split(' ');

  var cs = getComputedStyle(document.body);

}
function withA(col, a) {
  if (!col) return 'rgba(128,128,128,' + a + ')';
  if (col[0] === '#') {
    var h = col.slice(1);
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  if (col.indexOf('rgba') === 0) return col.replace(/[\d.]+\)$/, a + ')');

  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var n = parseInt(h, 16);

  var a = rgbOf(c1), b = rgbOf(c2);

}
function setTheme(name) {
  S.theme = name; document.body.className = 't-' + name; document.body.setAttribute('data-theme', name);
  readTheme(); GLOBE.key = ''; if (typeof draw === 'function') draw();
}
window.setTheme = setTheme;

/* ── view transform: letterbox, then the ×2 magnifier, then (tour only)
   a camera — toLogical inverts the whole chain, so every hit-test agrees
   with what is drawn                                                    */

var CAM = { on: false, x: W / 2, y: H / 2, k: 1 };

  var cw = CV.width / DPR, ch = CV.height / DPR;
  var s = Math.min(cw / W, ch / H);
  VT.s = s; VT.ox = (cw - W * s) / 2; VT.oy = Math.min((ch - H * s) / 2, 6);
  return VT;
}
function applyView() {
  CX.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX.translate(VT.ox, VT.oy); CX.scale(VT.s, VT.s);
  if (S.zoom > 1) { CX.translate(S.panX, S.panY); CX.scale(S.zoom, S.zoom); }
}

  var r = CV.getBoundingClientRect();
  var x = (cx - r.left - VT.ox) / VT.s, y = (cy - r.top - VT.oy) / VT.s;
  if (S.zoom > 1) { x = (x - S.panX) / S.zoom; y = (y - S.panY) / S.zoom; }
  return { x: x, y: y };
}
function clampPan() {
  S.panX = clamp(S.panX, W * (1 - S.zoom), 0);
  S.panY = clamp(S.panY, H * (1 - S.zoom), 0);
}
/* camera (tour): world point (CAM.x, CAM.y) drawn at the canvas centre ×k */
function camOn() { CX.save(); CX.translate(W / 2, H / 2); CX.scale(CAM.k, CAM.k); CX.translate(-CAM.x, -CAM.y); }
function camOff() { CX.restore(); }
function camToWorld(p) { return CAM.on ? { x: (p.x - W / 2) / CAM.k + CAM.x, y: (p.y - H / 2) / CAM.k + CAM.y } : p; }
var DPR = 1;

/* ── text & shape helpers (all sizes in logical px) ────────────────── */
var FONT_S = '"Inter","Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
var FONT_M = '"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace';
var FONT_T = '"Roboto Slab","Inter",Georgia,serif';

function bind() {

  $('row1').onclick = function (e) {
    var sc = cur();
    var bb = e.target.closest('[data-bk]');
    if (bb) { var cb = ctrlOf(bb.getAttribute('data-bk'), sc); if (cb && cb.act) cb.act(sc); refreshAll(); return; }

  };

  };

    if (b.id === 'btnReset') doReset();
  };
  $('mTabs').onclick = function (e) { var b = e.target.closest('.mode-tab'); if (b) setTopMode(b.getAttribute('data-mode')); };

  };

  });
  function sceneClick(p, e) {

  }

    if (sceneDrag) { var sc = cur(); if (sc.drag && sc.drag(sc, p)) { syncCtrls(true); draw(); } return; }

      S.mouseL = p;
      var hl = hk === null ? hoverLabelAt(p) : null;

    }
  });

    if (drag) { drag = null; try { CV.releasePointerCapture(e.pointerId); } catch (x) { } return; }

    if (S.panning) {
      S.panning = false; try { CV.releasePointerCapture(e.pointerId); } catch (x) { }

  });

    var p = toLogical(e.clientX, e.clientY);
    for (var i = 0; i < DCARDS.length; i++) {
      var c = DCARDS[i];

  });

function toggleZoom(p) {
