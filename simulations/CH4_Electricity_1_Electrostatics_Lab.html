/* ===== part_js_charging.js ===== */
/* ============================================================
   SECTION 1 — CHARGING (friction and induction)
   ============================================================ */

/* Single source of geometry: the drawing, the hit tests and the electron
   paths all read these, so moving the apparatus moves everything with it. */
const FR = {cx:600, cy:286, rodL:520, rodR:34, clothW:196, clothH:86, clothY:184,
            travelPerRub:140, ePerRub:3, eMax:24};
const IN = {cx:672, cy:262, r:92, standTop:354, standH:104,
            rodFar:52, rodNear:250, rodL:240, rodR:21, rodY:262,
            earthX:1046, earthY:508};

const MATCOL = {glass:'--glass', silk:'--silk', wool:'--wool'};
function matColour(key){
  if(key === 'glass')  return PAL.glass;
  if(key === 'silk')   return PAL.silk;
  if(key === 'wool' || key === 'fur') return PAL.wool;
  if(key === 'acetate') return '#cfe6f5';
  if(key === 'polyethylene') return '#9aa7b4';
  if(key === 'polystyrene')  return '#e8e8e0';
  if(key === 'ebonite') return '#2f3136';
  return PAL.metal;
}

/* ---------- friction ---------- */
let fricE = [];                       // electrons in flight during a rub
function doRub(){
  const o = rubOutcome(S.pair);
  if(S.rubs >= FR.eMax/FR.ePerRub) return;
  S.rubs++;
  const toRod = o.electronsTo === 'rod';
  /* spawn them only where the two objects actually overlap, or electrons
     heading for the cloth end up floating beside it */
  const span = toRod ? FR.rodL*0.62 : FR.clothW*0.70;
  for(let i = 0; i < FR.ePerRub; i++){
    const x = FR.cx + (Math.random()-0.5)*span;
    fricE.push({x0:x, y0:toRod ? FR.clothY + FR.clothH*0.42 : FR.cy - FR.rodR,
                x1:x + (Math.random()-0.5)*(toRod ? 40 : 18),
                y1:toRod ? FR.cy - FR.rodR*0.4 : FR.clothY + FR.clothH*0.2,
                t:-i*0.10});
  }
  beep(300 + S.rubs*22, 0.05, 'triangle', 0.035);
}
function stepCharging(dt){
  for(const e of fricE) e.t += dt*1.9;
  fricE = fricE.filter(e => e.t < 1.35);
  if(S.indPlay){
    S.indT += dt;
    if(S.indT > 1.7){
      S.indT = 0;
      const i = INDUCTION_STEPS.indexOf(S.indStep);
      if(i < INDUCTION_STEPS.length - 1){ S.indStep = INDUCTION_STEPS[i+1]; clickSnd(); }
      else S.indPlay = false;
    }
  }
}

function drawCharging(){
  if(S.method === 'friction') drawFriction(); else drawInduction();
}

function drawFriction(){
  const o = rubOutcome(S.pair);
  const nE = S.rubs*FR.ePerRub;
  const rodCol = matColour(o.rod), clothCol = matColour(o.cloth);

  benchLine(FR.cy + 150);

  /* ---- the rod: a cylinder, drawn from the material colour ---- */
  const x0 = FR.cx - FR.rodL/2, x1 = FR.cx + FR.rodL/2;
  const g = CX.createLinearGradient(0, FR.cy - FR.rodR, 0, FR.cy + FR.rodR);
  g.addColorStop(0, 'rgba(255,255,255,.30)');
  g.addColorStop(.30, rodCol); g.addColorStop(1, 'rgba(0,0,0,.30)');
  CX.fillStyle = rodCol; rr(x0, FR.cy - FR.rodR, FR.rodL, FR.rodR*2, FR.rodR); CX.fill();
  CX.fillStyle = g;      rr(x0, FR.cy - FR.rodR, FR.rodL, FR.rodR*2, FR.rodR); CX.fill();
  CX.strokeStyle = 'rgba(0,0,0,.35)'; CX.lineWidth = 1.4;
  rr(x0, FR.cy - FR.rodR, FR.rodL, FR.rodR*2, FR.rodR); CX.stroke();
  /* end cap so it reads as a rod rather than a bar */
  CX.fillStyle = 'rgba(255,255,255,.18)';
  CX.beginPath(); CX.ellipse(x1 - 5, FR.cy, 6, FR.rodR - 2, 0, 0, TAU); CX.fill();

  /* ---- the cloth, sitting on top of the rod ---- */
  const cx = S.rubbing ? S.rubX : FR.cx;
  const cw = FR.clothW, chh = FR.clothH;
  CX.save();
  CX.fillStyle = clothCol;
  CX.beginPath();
  CX.moveTo(cx - cw/2, FR.clothY + chh);
  for(let i = 0; i <= 6; i++){
    const u = i/6;
    CX.lineTo(cx - cw/2 + cw*u, FR.clothY + (i%2 ? 7 : 0) + Math.sin(u*4.2 + S.t*3*(S.rubbing?1:0))*3);
  }
  CX.lineTo(cx + cw/2, FR.clothY + chh);
  CX.quadraticCurveTo(cx, FR.clothY + chh + 14, cx - cw/2, FR.clothY + chh);
  CX.closePath(); CX.fill();
  CX.globalAlpha = .30; CX.strokeStyle = '#000'; CX.lineWidth = 1;
  for(let i = 1; i < 6; i++) line(cx - cw/2 + cw*i/6, FR.clothY + 6, cx - cw/2 + cw*i/6, FR.clothY + chh + 4);
  CX.restore();
  CX.strokeStyle = 'rgba(0,0,0,.35)'; CX.lineWidth = 1.3;
  CX.beginPath(); CX.moveTo(cx - cw/2, FR.clothY + chh);
  CX.lineTo(cx - cw/2, FR.clothY + 3); CX.lineTo(cx + cw/2, FR.clothY + 3);
  CX.lineTo(cx + cw/2, FR.clothY + chh); CX.stroke();

  /* ---- charge symbols, one per 3 electrons transferred ---- */
  if(S.show.particles && nE > 0){
    const nSym = Math.round(nE/FR.ePerRub);
    for(let i = 0; i < nSym; i++){
      const u = (i + 0.5)/nSym;
      chargeDot(x0 + 26 + (FR.rodL - 52)*u, FR.cy + 1, o.rodSign, 8.5, {glow:i === nSym-1});
      chargeDot(cx - cw*0.36 + cw*0.72*u, FR.clothY + chh*0.52, o.clothSign, 7.5);
    }
  }

  /* ---- electrons in flight ---- */
  if(S.show.particles) for(const e of fricE){
    if(e.t < 0) continue;
    const u = Math.min(1, e.t);
    const x = e.x0 + (e.x1 - e.x0)*u;
    const y = e.y0 + (e.y1 - e.y0)*u - Math.sin(Math.PI*u)*16;
    CX.globalAlpha = e.t > 1 ? Math.max(0, 1 - (e.t-1)/0.35) : 1;
    electron(x, y, 6);
    CX.globalAlpha = 1;
  }

  /* ---- labels ---- */
  if(S.show.labels){
    const sgnTxt = s => s > 0 ? 'POSITIVE  +' : 'NEGATIVE  −';
    txt(o.clothName + ' cloth', cx, FR.clothY - 30, {size:15, weight:700, col:PAL.text, plate:true});
    if(nE > 0) txt(sgnTxt(o.clothSign), cx, FR.clothY - 11,
                   {size:12, weight:700, col:o.clothSign > 0 ? PAL.pos : PAL.neg, plate:true});
    txt(o.rodName + ' rod', FR.cx, FR.cy + FR.rodR + 26, {size:15, weight:700, col:PAL.text});
    if(nE > 0) txt(sgnTxt(o.rodSign), FR.cx, FR.cy + FR.rodR + 46,
                   {size:12, weight:700, col:o.rodSign > 0 ? PAL.pos : PAL.neg});
  }

  /* ---- the transfer arrow: the whole teaching point ---- */
  if(nE > 0){
    const toRod = o.electronsTo === 'rod';
    const ax = x0 - 26, ya = FR.clothY + chh + 6, yb = FR.cy - FR.rodR - 6;
    arrow(ax, toRod ? ya : yb, ax, toRod ? yb : ya, {col:PAL.electron, lw:2.6, head:11});
    txt('electrons', ax - 10, (ya+yb)/2,
        {size:11.5, col:PAL.electron, weight:700, align:'right', plate:true});
  }

  /* ---- running total ---- */
  const bx = W/2, by = H - 74;
  CX.fillStyle = PAL.card; CX.globalAlpha = .85;
  rr(bx - 210, by - 26, 420, 52, 10); CX.fill(); CX.globalAlpha = 1;
  CX.strokeStyle = PAL.border; CX.lineWidth = 1;
  rr(bx - 210, by - 26, 420, 52, 10); CX.stroke();
  txt(nE + ' electron' + (nE === 1 ? '' : 's') + ' transferred', bx, by - 8,
      {size:13, weight:700, col:PAL.text});
  txt('Q = n e = ' + nE + ' × 1.6 × 10⁻¹⁹ C = ' + sciQ(nE), bx, by + 12,
      {size:12, weight:600, col:PAL.accent, mono:true});

  setChips(
    '🔬 Charging — friction',
    o.label + ' · ' + nE + ' e⁻',
    '<b>Rub the cloth</b> — drag it left and right along the rod, or press ✋ Rub once.<br>' +
    '<b>Watch the electrons</b> — they move one way only; protons never move.<br>' +
    '<b>Zoom</b> — double-click empty canvas for ×2, then drag to pan.',
    S.rubs >= FR.eMax/FR.ePerRub ? 'Rod fully charged for this demo — press ↺ Reset to start again' : '');
}

/* ---------- induction ---------- */
function drawInduction(){
  const st = inductionState(S.indStep, S.rodSign);
  const rodX = st.rodPresent ? IN.rodNear : IN.rodFar;
  const near = IN.cx - IN.r, far = IN.cx + IN.r;

  benchLine(IN.standTop + IN.standH + 9);

  /* ---- the earth link, drawn behind the sphere ---- */
  if(st.earthed){
    CX.strokeStyle = PAL.ground; CX.lineWidth = 3.4; CX.lineCap = 'round';
    CX.beginPath();
    CX.moveTo(far - 6, IN.cy);
    CX.quadraticCurveTo(IN.earthX, IN.cy - 30, IN.earthX, IN.earthY - 30);
    CX.stroke();
    earthSym(IN.earthX, IN.earthY - 24, 22);
    if(S.show.labels) txt('earthed', IN.earthX, IN.earthY + 16, {size:12, col:PAL.ground, weight:700});
    /* electrons moving along the wire, in the direction the model states */
    if(S.show.particles && st.flow !== 0){
      /* sample the SAME quadratic Bezier that was just stroked, so the
         electrons ride the wire instead of floating beside it */
      const p0 = {x:far - 6, y:IN.cy},
            p1 = {x:IN.earthX, y:IN.cy - 30},
            p2 = {x:IN.earthX, y:IN.earthY - 30};
      for(let i = 0; i < 5; i++){
        let u = (S.t*0.5 + i/5) % 1;
        if(st.flow > 0) u = 1 - u;               // a + rod pulls electrons UP
        const m = 1 - u;
        electron(m*m*p0.x + 2*m*u*p1.x + u*u*p2.x,
                 m*m*p0.y + 2*m*u*p1.y + u*u*p2.y, 5);
      }
    }
  }

  /* ---- insulating stand + sphere ---- */
  standSym(IN.cx, IN.standTop, IN.standH, 58);
  const sg = CX.createRadialGradient(IN.cx - IN.r*0.35, IN.cy - IN.r*0.4, IN.r*0.1,
                                     IN.cx, IN.cy, IN.r*1.15);
  sg.addColorStop(0, PAL.metalHi); sg.addColorStop(.55, PAL.metal); sg.addColorStop(1, '#2b3138');
  CX.fillStyle = sg; CX.beginPath(); CX.arc(IN.cx, IN.cy, IN.r, 0, TAU); CX.fill();
  CX.strokeStyle = 'rgba(0,0,0,.4)'; CX.lineWidth = 1.6;
  CX.beginPath(); CX.arc(IN.cx, IN.cy, IN.r, 0, TAU); CX.stroke();
  CX.fillStyle = 'rgba(255,255,255,.22)';
  CX.beginPath(); CX.ellipse(IN.cx - IN.r*0.34, IN.cy - IN.r*0.42, IN.r*0.24, IN.r*0.15, -0.6, 0, TAU); CX.fill();

  /* ---- charge on the sphere ---- */
  if(S.show.particles){
    const n = 6;
    if(st.spread && st.net !== 0){
      for(let i = 0; i < Math.abs(st.net); i++){
        const a = (i + 0.5)*TAU/Math.abs(st.net) - Math.PI/2;
        chargeDot(IN.cx + Math.cos(a)*IN.r*0.78, IN.cy + Math.sin(a)*IN.r*0.78, Math.sign(st.net), 9);
      }
    }else if(!st.spread){
      for(let i = 0; i < n; i++){
        const a = Math.PI + (i/(n-1) - 0.5)*1.50;           // face TOWARDS the rod
        chargeDot(IN.cx + Math.cos(a)*IN.r*0.76, IN.cy + Math.sin(a)*IN.r*0.76, Math.sign(st.near), 9);
      }
      if(st.far !== 0) for(let i = 0; i < n; i++){
        const a = (i/(n-1) - 0.5)*1.50;                     // face AWAY from the rod
        chargeDot(IN.cx + Math.cos(a)*IN.r*0.76, IN.cy + Math.sin(a)*IN.r*0.76, Math.sign(st.far), 9);
      }
    }else{
      /* genuinely neutral: show the + and − in equal numbers, mixed */
      for(let i = 0; i < 8; i++){
        const a = i*TAU/8 + 0.3;
        chargeDot(IN.cx + Math.cos(a)*IN.r*0.66, IN.cy + Math.sin(a)*IN.r*0.66, i%2 ? 1 : -1, 7);
      }
    }
  }

  /* ---- the charged rod ---- */
  const rx0 = rodX, rx1 = rodX + IN.rodL;
  CX.fillStyle = S.rodSign > 0 ? '#cfe6f5' : '#2f3136';
  rr(rx0, IN.rodY - IN.rodR, IN.rodL, IN.rodR*2, IN.rodR); CX.fill();
  CX.strokeStyle = 'rgba(0,0,0,.4)'; CX.lineWidth = 1.4;
  rr(rx0, IN.rodY - IN.rodR, IN.rodL, IN.rodR*2, IN.rodR); CX.stroke();
  if(S.show.particles) for(let i = 0; i < 5; i++)
    chargeDot(rx0 + 24 + (IN.rodL - 48)*i/4, IN.rodY, S.rodSign, 8);
  if(S.show.labels){
    txt('charged rod', (rx0+rx1)/2, IN.rodY - IN.rodR - 20, {size:14, weight:700, col:PAL.text});
    txt(S.rodSign > 0 ? 'POSITIVE' : 'NEGATIVE', (rx0+rx1)/2, IN.rodY + IN.rodR + 20,
        {size:12, weight:700, col:S.rodSign > 0 ? PAL.pos : PAL.neg});
    txt('metal sphere on an insulating stand', IN.cx, IN.standTop + IN.standH + 30,
        {size:12.5, weight:600, col:PAL.dim});
  }
  /* the gap is the point of induction: nothing ever touches */
  if(st.rodPresent){
    CX.strokeStyle = PAL.muted; CX.lineWidth = 1; CX.setLineDash([4, 4]);
    line(rx1 + 3, IN.rodY, near - 3, IN.rodY); CX.setLineDash([]);
    txt('no contact', (rx1 + near)/2, IN.rodY - 26,
        {size:11, col:PAL.muted, weight:600, plate:true});
  }

  /* ---- step ladder along the top ---- */
  const names = ['1 Neutral', '2 Approach', '3 Earth', '4 Un-earth', '5 Remove rod'];
  const bw = 176, gap = 8, total = names.length*bw + (names.length-1)*gap;
  let sx = (W - total)/2;
  for(let i = 0; i < names.length; i++){
    const on = i === st.i, done = i < st.i;
    CX.fillStyle = on ? PAL.accent : (done ? PAL.card : PAL.bg);
    CX.globalAlpha = on ? .22 : 1;
    rr(sx, 26, bw, 30, 8); CX.fill(); CX.globalAlpha = 1;
    CX.strokeStyle = on ? PAL.accent : PAL.border; CX.lineWidth = on ? 1.8 : 1;
    rr(sx, 26, bw, 30, 8); CX.stroke();
    txt(names[i], sx + bw/2, 41, {size:12, weight:on ? 700 : 600,
        col:on ? PAL.accent : (done ? PAL.dim : PAL.muted)});
    sx += bw + gap;
  }

  /* ---- net-charge readout ---- */
  const by = H - 96;
  CX.fillStyle = PAL.card; CX.globalAlpha = .85; rr(W/2 - 300, by - 24, 600, 74, 10); CX.fill();
  CX.globalAlpha = 1; CX.strokeStyle = PAL.border; CX.lineWidth = 1;
  rr(W/2 - 300, by - 24, 600, 74, 10); CX.stroke();
  const netTxt = st.net === 0 ? 'NET CHARGE ON SPHERE  =  0   (neutral)'
       : 'NET CHARGE ON SPHERE  =  ' + signStr(Math.sign(st.net)) + Math.abs(st.net) + ' e';
  txt(netTxt, W/2, by - 4, {size:14, weight:700, mono:true,
      col:st.net === 0 ? PAL.dim : (st.net > 0 ? PAL.pos : PAL.neg)});
  wrapText(st.text, W/2, by + 20, 560, 16, {size:12.5, weight:600, col:PAL.text});

  setChips(
    '🔬 Charging — induction',
    'Step ' + (st.i+1) + '/5 · net ' + (st.net === 0 ? '0' : signStr(Math.sign(st.net)) + Math.abs(st.net) + 'e'),
    '<b>Step through</b> with Next › and ‹ Back, or press ▶ Sequence to watch it run.<br>' +
    '<b>Flip the rod</b> between + and − — the sphere always ends up the opposite sign.<br>' +
    '<b>Zoom</b> — double-click empty canvas for ×2, then drag to pan.',
    S.indStep === 'unearth' ? 'Order matters: the EARTH is removed before the ROD' : '');
}

/* one small wrapper so a caption never runs off its plate */
function wrapText(s, cx, y, maxW, lh, opt){
  CX.font = (opt.weight || 600) + ' ' + (opt.size || 13) + "px 'Inter',sans-serif";
  const words = String(s).split(' ');
  const lines = []; let cur = '';
  for(const w of words){
    const t = cur ? cur + ' ' + w : w;
    if(CX.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; }
    else cur = t;
  }
  if(cur) lines.push(cur);
  const y0 = y - (lines.length - 1)*lh/2;
  lines.forEach((l, i) => txt(l, cx, y0 + i*lh, opt));
}

/* ===== part_js_fields.js ===== */
/* ============================================================
   SECTION 2 — ELECTRIC FIELDS
   ============================================================ */
/* FLOOR is the lowest the drawing may go.  Everything below it is caption
   space, so a banner can never be laid over a field line again. */
const FD_FLOOR = H - 106, FD_CAP = H - 46;
const FD = {cy:318, cx:600, box:{x0:26, y0:74, x1:W-26, y1:FD_FLOOR},
            qR:26, sphereR:72};

/* The pattern list.  'sphere' is on the 0625 syllabus (4.2.2, "around a
   charged conducting sphere") but was not in the uploaded spec. */
const PATTERNS = {
  'single+': {label:'Single + charge',        charges:[{x:600, y:318, q:3, rad:26}]},
  'single-': {label:'Single − charge',        charges:[{x:600, y:318, q:-3, rad:26}]},
  'sphere':  {label:'Charged conducting sphere', sphere:true,
              charges:[{x:600, y:318, q:4, rad:FD.sphereR}]},
  'dipole':  {label:'Two opposite charges',   charges:[{x:428, y:318, q:3, rad:26},
                                                       {x:772, y:318, q:-3, rad:26}]},
  'like':    {label:'Two like charges (+ +)', charges:[{x:428, y:318, q:3, rad:26},
                                                       {x:772, y:318, q:3, rad:26}]}
};

/* Field lines are expensive, so they are traced once per configuration and
   cached against a signature of everything they depend on. */
let LINE_CACHE = {sig:'', lines:[], fringe:[], plate:null};
function fieldSig(){
  if(S.fmode === 'plates') return 'P' + S.plateSep;
  if(S.fmode === 'pattern') return 'T' + S.pattern;
  return 'F' + Math.round(S.qA.x) + ',' + Math.round(S.qA.y) + ',' + S.qA.q + '|' +
             Math.round(S.qB.x) + ',' + Math.round(S.qB.y) + ',' + S.qB.q;
}
function activeCharges(){
  if(S.fmode === 'pattern') return PATTERNS[S.pattern].charges;
  return [Object.assign({rad:FD.qR}, S.qA), Object.assign({rad:FD.qR}, S.qB)];
}
function activePlate(){
  return plateGeom({cx:FD.cx, cy:FD.cy, sep:S.plateSep});
}
/* One field function for the whole section, so the lines, the test charge and
   the readouts can never disagree about what the field is. */
function sectionField(x, y){
  if(S.fmode === 'plates') return plateFieldAt(x, y, activePlate());
  const cfg = S.fmode === 'pattern' ? PATTERNS[S.pattern] : null;
  if(cfg && cfg.sphere)
    return fieldAtShielded(x, y, cfg.charges, [{x:cfg.charges[0].x, y:cfg.charges[0].y, r:FD.sphereR}]);
  return fieldAt(x, y, activeCharges());
}
function rebuildLines(){
  const sig = fieldSig();
  if(sig === LINE_CACHE.sig) return;
  LINE_CACHE.sig = sig;
  if(S.fmode === 'plates'){
    const p = activePlate();
    LINE_CACHE.plate = p;
    LINE_CACHE.lines = plateLines(p, FD.box, {n:15});
    /* the external arcs are deliberately NOT drawn — the bend in the
       outermost interior lines already shows the fringe field */
    LINE_CACHE.fringe = [];
  }else{
    LINE_CACHE.lines = fieldLines(activeCharges(), FD.box, {step:5, maxSteps:700});
    LINE_CACHE.fringe = [];
  }
}

function stepFields(dt){
  if(!S.test || dt === 0) return;
  /* a small positive test charge drifts along the field — the definition of
     what a field line means */
  const f = sectionField(S.test.x, S.test.y);
  if(f.mag < 1e-13){ return; }
  const v = 150*dt;
  S.test.x += v*f.ex/f.mag; S.test.y += v*f.ey/f.mag;
  S.testTrail.push({x:S.test.x, y:S.test.y});
  if(S.testTrail.length > 220) S.testTrail.shift();
  const b = FD.box;
  if(S.test.x < b.x0 || S.test.x > b.x1 || S.test.y < b.y0 || S.test.y > b.y1){ S.test = null; return; }
  for(const c of activeCharges())
    if(Math.hypot(S.test.x - c.x, S.test.y - c.y) < (c.rad || 20) + 4){ S.test = null; return; }
}

function drawFields(){
  rebuildLines();
  if(S.fmode === 'force')   drawForce();
  else if(S.fmode === 'pattern') drawPattern();
  else                      drawPlates();
}

/* ---------- shared: draw a traced set of lines with arrowheads ---------- */
function paintLines(lines, col, headEvery){
  CX.strokeStyle = col || PAL.line; CX.lineWidth = 1.9; CX.lineCap = 'round';
  for(const L of lines){
    const p = L.pts;
    if(p.length < 2) continue;
    CX.beginPath(); CX.moveTo(p[0].x, p[0].y);
    for(let i = 1; i < p.length; i++) CX.lineTo(p[i].x, p[i].y);
    CX.stroke();
  }
  /* arrowheads say which way a POSITIVE charge would be pushed */
  const every = headEvery || 62;
  const hc = (col || PAL.line).replace(/[\d.]+\)$/, '0.95)');
  for(const L of lines){
    const p = L.pts;
    /* A line traced BACKWARDS (into a negative charge) is stored from the
       charge outwards, so its arrowheads must point the other way along the
       polyline or the field of a − charge reads as pointing away from it. */
    const back = L.dir < 0;
    let acc = 0;
    for(let i = 1; i < p.length; i++){
      acc += Math.hypot(p[i].x-p[i-1].x, p[i].y-p[i-1].y);
      if(acc >= every && i > 3){
        acc = 0;
        if(back) headAt(p[i], p[i-1], hc, 7.5);
        else     headAt(p[i-1], p[i], hc, 7.5);
      }
    }
  }
}

/* ---------- force between two charges ---------- */
function drawForce(){
  const a = S.qA, b = S.qB;
  const d = Math.hypot(b.x-a.x, b.y-a.y);
  const F = forceBetween(a.q, b.q, d);

  if(S.fshow === 'lines') paintLines(LINE_CACHE.lines);

  /* separation line */
  CX.strokeStyle = PAL.muted; CX.lineWidth = 1.2; CX.setLineDash([6, 5]);
  line(a.x, a.y, b.x, b.y); CX.setLineDash([]);
  const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
  txt('r = ' + Math.round(d/10) + ' cm', mx, my - 16, {size:12.5, weight:700, col:PAL.dim, mono:true, plate:true});

  /* the force arrows: length grows with F but is compressed so a ×36 force
     still fits on the canvas */
  const L = Math.max(30, Math.min(190, 30 + 55*Math.sqrt(F.ratio)));
  const ux = (b.x-a.x)/(d||1), uy = (b.y-a.y)/(d||1);
  const s = F.attract ? +1 : -1;                 // +1 = pulled towards the other
  arrow(a.x + ux*FD.qR*s*1.05, a.y + uy*FD.qR*s*1.05,
        a.x + ux*(FD.qR*1.05 + L)*s, a.y + uy*(FD.qR*1.05 + L)*s,
        {col:PAL.amber, lw:4, head:15});
  arrow(b.x - ux*FD.qR*s*1.05, b.y - uy*FD.qR*s*1.05,
        b.x - ux*(FD.qR*1.05 + L)*s, b.y - uy*(FD.qR*1.05 + L)*s,
        {col:PAL.amber, lw:4, head:15});

  drawTestCharge();
  chargeDot(a.x, a.y, Math.sign(a.q), FD.qR, {glow:true});
  chargeDot(b.x, b.y, Math.sign(b.q), FD.qR, {glow:true});
  if(S.show.labels){
    txt('Q₁ = ' + signStr(Math.sign(a.q)) + Math.abs(a.q) + ' µC', a.x, a.y - FD.qR - 20,
        {size:13.5, weight:700, col:a.q > 0 ? PAL.pos : PAL.neg, plate:true});
    txt('Q₂ = ' + signStr(Math.sign(b.q)) + Math.abs(b.q) + ' µC', b.x, b.y - FD.qR - 20,
        {size:13.5, weight:700, col:b.q > 0 ? PAL.pos : PAL.neg, plate:true});
  }

  /* verdict banner, in the reserved caption band */
  const by = FD_CAP;
  CX.fillStyle = PAL.card; CX.globalAlpha = .88; rr(W/2 - 270, by - 26, 540, 52, 10); CX.fill();
  CX.globalAlpha = 1; CX.strokeStyle = F.attract ? PAL.blue : PAL.pos; CX.lineWidth = 1.6;
  rr(W/2 - 270, by - 26, 540, 52, 10); CX.stroke();
  txt(F.attract ? 'UNLIKE charges → they ATTRACT' : 'LIKE charges → they REPEL', W/2, by - 8,
      {size:15, weight:800, col:F.attract ? PAL.blue : PAL.pos});
  txt('F ∝ Q₁Q₂ / r²   →   force is ' + fmtRatio(F.ratio) + ' the reference force',
      W/2, by + 13, {size:12, weight:600, col:PAL.dim, mono:true});

  setChips('🌐 Fields — force between charges',
    (F.attract ? 'attract' : 'repel') + ' · ' + fmtRatio(F.ratio),
    '<b>Drag either charge</b> to change the separation and watch the arrows.<br>' +
    '<b>Change Q₁ and Q₂</b> in the Data panel — sign and size both matter.<br>' +
    '<b>Test charge</b> — switch the overlay, then click anywhere to release one.', '');
}
function fmtRatio(r){
  if(r >= 100) return '×' + Math.round(r);
  if(r >= 10)  return '×' + r.toFixed(0);
  if(r >= 1)   return '×' + r.toFixed(2);
  return '×' + r.toFixed(3);
}

/* ---------- field patterns ---------- */
function drawPattern(){
  const cfg = PATTERNS[S.pattern];
  paintLines(LINE_CACHE.lines);
  drawTestCharge();

  if(cfg.sphere){
    const c = cfg.charges[0];
    /* E = 0 inside a conductor — shown, not just stated */
    const g = CX.createRadialGradient(c.x - 24, c.y - 26, 8, c.x, c.y, FD.sphereR);
    g.addColorStop(0, PAL.metalHi); g.addColorStop(.6, PAL.metal); g.addColorStop(1, '#2b3138');
    CX.fillStyle = g; CX.beginPath(); CX.arc(c.x, c.y, FD.sphereR, 0, TAU); CX.fill();
    CX.strokeStyle = 'rgba(0,0,0,.45)'; CX.lineWidth = 1.8;
    CX.beginPath(); CX.arc(c.x, c.y, FD.sphereR, 0, TAU); CX.stroke();
    txt('E = 0', c.x, c.y - 8, {size:20, weight:800, col:PAL.text});
    txt('inside', c.x, c.y + 14, {size:12, weight:600, col:PAL.dim});
    if(S.show.particles) for(let i = 0; i < 12; i++){
      const a = i*TAU/12;
      chargeDot(c.x + Math.cos(a)*(FD.sphereR - 9), c.y + Math.sin(a)*(FD.sphereR - 9), 1, 7);
    }
    if(S.show.labels){
      txt('charge sits on the OUTSIDE surface', c.x, c.y + FD.sphereR + 30,
          {size:13, weight:700, col:PAL.accent, plate:true});
      txt('field lines leave at 90° to the surface', c.x, c.y + FD.sphereR + 53,
          {size:12, weight:600, col:PAL.dim, plate:true});
    }
  }else{
    for(const c of cfg.charges) chargeDot(c.x, c.y, Math.sign(c.q), FD.qR, {glow:true});
    if(S.show.labels) for(const c of cfg.charges)
      txt(signStr(Math.sign(c.q)) + Math.abs(c.q) + ' µC', c.x, c.y - FD.qR - 20,
          {size:13, weight:700, col:c.q > 0 ? PAL.pos : PAL.neg, plate:true});
  }

  /* the null point is worth naming when it exists */
  if(S.pattern === 'like'){
    const nx = (cfg.charges[0].x + cfg.charges[1].x)/2, ny = cfg.charges[0].y;
    CX.strokeStyle = PAL.green; CX.lineWidth = 2; CX.setLineDash([3, 4]);
    CX.beginPath(); CX.arc(nx, ny, 15, 0, TAU); CX.stroke(); CX.setLineDash([]);
    txt('E = 0', nx, ny + 34, {size:12.5, weight:700, col:PAL.green, plate:true});
    txt('neutral point', nx, ny + 52, {size:11, weight:600, col:PAL.dim, plate:true});
  }

  drawFieldKey();
  setChips('🌐 Fields — ' + cfg.label,
    lineCount(cfg.charges[0].q) + ' lines per charge',
    '<b>Arrowheads</b> show the way a small POSITIVE charge would be pushed.<br>' +
    '<b>Line spacing</b> is the field strength — the lines crowd where the field is strong.<br>' +
    '<b>Test charge</b> — switch the overlay, then click to release one and watch it follow a line.', '');
}

function drawFieldKey(){
  const x = 34, y = FD_FLOOR + 10, w = 268, h = 88;
  CX.fillStyle = PAL.card; CX.globalAlpha = .86; rr(x, y, w, h, 9); CX.fill();
  CX.globalAlpha = 1; CX.strokeStyle = PAL.border; CX.lineWidth = 1; rr(x, y, w, h, 9); CX.stroke();
  txt('FIELD LINE RULES', x + 12, y + 15, {size:10, weight:800, col:PAL.muted, align:'left'});
  const rules = ['start on +, end on −', 'never cross', 'closer lines = stronger field',
                 'meet a conductor at 90°'];
  rules.forEach((r, i) => txt('• ' + r, x + 12, y + 34 + i*15,
                              {size:11, weight:600, col:PAL.dim, align:'left'}));
}

/* ---------- parallel plates ---------- */
function drawPlates(){
  const p = activePlate();
  const yT = p.cy - p.sep/2, yB = p.cy + p.sep/2;
  const half = plateUniformHalf(p);

  /* the region the model can honestly call uniform */
  CX.fillStyle = PAL.accent; CX.globalAlpha = .07;
  CX.fillRect(p.cx - half, yT, half*2, p.sep); CX.globalAlpha = 1;

  paintLines(LINE_CACHE.lines, PAL.line, 44);
  drawTestCharge();

  /* the plates themselves */
  for(const [yy, sgn] of [[yT, +1], [yB, -1]]){
    CX.fillStyle = metalFill(p.cx - p.hw, yy - 7, p.hw*2, 14);
    rr(p.cx - p.hw, yy - 7, p.hw*2, 14, 4); CX.fill();
    CX.strokeStyle = 'rgba(0,0,0,.4)'; CX.lineWidth = 1.2;
    rr(p.cx - p.hw, yy - 7, p.hw*2, 14, 4); CX.stroke();
    if(S.show.particles) for(let i = 0; i < 11; i++)
      chargeDot(p.cx - p.hw + 26 + (p.hw*2 - 52)*i/10, yy + sgn*-16, sgn, 8);
  }

  /* battery, wired to the plates.  The + terminal goes to the + plate. */
  const bx = p.cx - p.hw - 118, by = p.cy;
  CX.strokeStyle = PAL.text; CX.lineWidth = 2.2; CX.lineCap = 'round';
  CX.beginPath();
  CX.moveTo(p.cx - p.hw, yT); CX.lineTo(bx, yT); CX.lineTo(bx, by - 26); CX.stroke();
  CX.beginPath();
  CX.moveTo(p.cx - p.hw, yB); CX.lineTo(bx, yB); CX.lineTo(bx, by + 26); CX.stroke();
  cellSym(bx, by, 32, false);
  txt(S.plateV.toFixed(1) + ' V', bx - 34, by, {size:14, weight:700, col:PAL.accent, mono:true, align:'right'});
  txt('+', bx + 16, by - 34, {size:15, weight:800, col:PAL.pos});
  txt('−', bx + 16, by + 34, {size:15, weight:800, col:PAL.neg});

  /* separation dimension */
  const dx = p.cx + p.hw + 46;
  CX.strokeStyle = PAL.dim; CX.lineWidth = 1.3;
  line(p.cx + p.hw, yT, dx + 12, yT); line(p.cx + p.hw, yB, dx + 12, yB);
  arrow(dx, yT + 2, dx, yB - 2, {col:PAL.dim, lw:1.4, head:8});
  arrow(dx, yB - 2, dx, yT + 2, {col:PAL.dim, lw:1.4, head:8});
  txt('d = ' + (p.sep/10).toFixed(1) + ' cm', dx, yB + 30,
      {size:13, weight:700, col:PAL.dim, mono:true, plate:true});

  if(S.show.labels){
    txt('+ plate', p.cx, yT - 34, {size:13.5, weight:700, col:PAL.pos});
    txt('− plate', p.cx, yB + 34, {size:13.5, weight:700, col:PAL.neg});
    txt('uniform field', p.cx, p.cy, {size:12, weight:700, col:PAL.accent, plate:true});
    txt('near the ends the lines bend outwards — the fringe field',
        p.cx, yT - 96, {size:12, weight:600, col:PAL.muted});
  }

  /* readout */
  const E = S.plateV/(p.sep/1000);              // V/m, with 10 px = 1 cm
  const yy = FD_CAP;
  txt('E = V / d = ' + S.plateV.toFixed(1) + ' V ÷ ' + (p.sep/1000).toFixed(3) + ' m = ' +
      Math.round(E) + ' V/m', W/2, yy, {size:13, weight:700, col:PAL.accent, mono:true});

  setChips('🌐 Fields — parallel plates',
    'uniform to |x| ≤ ' + Math.round(half/10) + ' cm of ' + Math.round(p.hw/10) + ' cm',
    '<b>The shaded band</b> is where the field really is uniform — measured from the model, not assumed.<br>' +
    '<b>Change d and V</b> in the Data panel; E = V/d.<br>' +
    '<b>Test charge</b> — switch the overlay, then click between the plates.', '');
}

}

/* ===== part_js_devices.js ===== */
/* ============================================================
   SECTION 3 — DEVICES
   ============================================================ */
/* 1.5× the original size — the apparatus is the thing being read, so it gets
   the space.  Ratios are unchanged; every value is the old one × 1.5. */
const ESK = 1.5;
const ES = {cx:600, capY:112, capW:225, capH:24, stemW:17,
            caseX:600, caseTop:157, caseW:375, caseH:369, leafTop:331, leafL:117,
            rodL:250, rodH:34,
            /* the rod is dragged, so it needs a travel range and a contact test */
            rodXmin:20, touchGap:3, d0:45, contactQ:3};
ES.discX  = ES.cx - ES.capW/2;              // left edge of the brass disc
ES.rodXmax = ES.discX - ES.rodL;            // rod tip exactly on the disc
ES.rodX0   = ES.rodXmax - 205;              // parked well clear of it
/* Laid out from the reference diagram: metal shell on insulating pillars over
   an earthed base, belt between two rollers, a comb at each end, and the
   discharge tube down the right-hand side. */
const VG = {cx:330, shellY:212, shellR:110,
            pillarTop:298, pillarBot:520, pillarX:96, pillarW:26,
            baseX:196, baseW:270, baseY:520, baseH:46,
            beltHalf:23, rollTop:244, rollBot:484, rollR:25,
            tubeX:392, tubeW:20, tubeTop:294, tubeBot:514,
            gndX:846, gndR:56, gndY:212};
VG.domeY = VG.shellY; VG.domeR = VG.shellR;      // names used by the spark code
/* Everything the Van de Graaff occupies, labels included, so the group can be
   centred on the canvas instead of drifting left as parts are added. */
function vgBBox(){
  return {l: VG_LABEL_L - 4, r: VG.gndX + VG.gndR + 62 + 26};
}
const VG_LABEL_L = 44;
const vgShiftX = () => W/2 - (vgBBox().l + vgBBox().r)/2;
const SP = {ax:430, ay:296, bx:770, by:296, r:58, stalk:126, standH:44};
const TC = {cx:600, baseY:566, secTop:262, secBot:520, secW:56,
            toroidY:236, toroidRx:112, toroidRy:34, priY:492, gapX:300, gapY:452};

/* Where the rod is, and how far its tip is from the brass disc.  Both the
   drawing and the physics read this, so they can never disagree about
   whether the rod is touching. */
function esGeom(){
  const x = Math.max(ES.rodXmin, Math.min(ES.rodXmax, S.esRodX));
  const tip = x + ES.rodL;
  const d = Math.max(0, ES.discX - tip);
  return {x, tip, d, touching: d <= ES.touchGap};
}
/* How strongly a rod at distance d separates the charge in the electroscope.
   Falls off like an inverse square but shifted by d0 so it stays finite at
   contact: 1 when touching, ~0.06 with the rod parked at the far end. */
/* Chosen so the exam picture falls OUT of the model instead of being drawn by
   hand: with a rod within ~10 cm the induced separation exceeds the charge the
   electroscope already carries, so the brass disc genuinely ends up with the
   sign OPPOSITE the rod — which is the statement a mark scheme wants — while
   a rod parked at the far end of the bench leaves the leaf completely shut. */
const ROD_INDUCE = 16;
const induceAt = d => Math.pow(ES.d0/(ES.d0 + d), 2);

/* The disc and the leaf are ONE conductor, so whatever the rod does it only
   MOVES charge between them — the two must always add up to the
   electroscope's own charge.  Everything on screen comes from here. */
function esCharges(){
  const g = esGeom();
  /* touching = one conductor at one potential, so nothing is separated */
  const k = g.touching ? 0 : S.esRod*ROD_INDUCE*induceAt(g.d);
  const half = S.esCharge/2;
  return {disc: half - k, leaf: half + k, k, gap:g.d, touching:g.touching};
}
const leafCharge = () => esCharges().leaf;
const LEAF_FULL = 3.2;

function stepDevices(dt){
  if(dt === 0) return;
  /* Contact is an EVENT, not a state: charge is shared the moment the rod
     first touches the disc, and the electroscope keeps it afterwards. */
  const g = esGeom();
  if(g.touching && !S.esWasTouching && !S.esEarthed){
    S.esCharge = S.esRod*ES.contactQ;
    S.esFlash = 0.5; clickSnd();
  }
  S.esWasTouching = g.touching;
  if(S.esFlash > 0) S.esFlash -= dt*2;
  /* leaf eases towards its target angle rather than snapping */
  const target = leafAngle(leafCharge(), LEAF_FULL);
  S.esLeaf += (target - S.esLeaf)*Math.min(1, dt*7);

  if(S.dev === 'vandegraaff'){
    if(S.vgOn){
      S.vgBelt += dt*1.5;
      /* tuned so the dome recharges in roughly a second — fast enough to
         hold attention, slow enough that a class can watch it build */
      S.vgQ = Math.min(4.2e-6, S.vgQ + dt*2.4e-7);
    }
    const V = domeVolts(S.vgQ, 0.15);
    if(canSpark(V, S.vgGap/10) && S.vgFlash <= 0){
      S.vgFlash = 0.42;
      S.vgSparkPts = sparkPath({x:VG.cx + VG.shellR - 4, y:VG.shellY},
                               {x:VG.gndX - VG.gndR + 4, y:VG.gndY}, S.t, 26);
      S.vgQ *= 0.12; crackle();
    }
    if(S.vgFlash > 0) S.vgFlash -= dt*2.4;
  }
  if(S.dev === 'sparks'){
    const armed = canSpark(S.spV, S.spGap);
    if(armed && S.spFlash <= 0){
      S.spFlash = 0.40;
      S.spPts = sparkPath({x:SP.ax + SP.r, y:SP.ay}, {x:SP.bx - SP.r, y:SP.by}, S.t, 16);
      crackle();
    }
    S.spArmed = armed;
    if(S.spFlash > 0) S.spFlash -= dt*2.2;
  }
  if(S.dev === 'tesla' && S.teslaOn){
    S.teslaT += dt;
    if(S.teslaT > 0.16){
      S.teslaT = 0;
      S.teslaArcs = [];
      const n = 2 + Math.floor(Math.random()*3);
      for(let i = 0; i < n; i++){
        const a = -0.35 + Math.random()*Math.PI*1.7;
        const len = 90 + Math.random()*130;
        S.teslaArcs.push(sparkPath(
          {x:TC.cx + Math.cos(a)*TC.toroidRx*0.95, y:TC.toroidY + Math.sin(a)*TC.toroidRy*0.9},
          {x:TC.cx + Math.cos(a)*(TC.toroidRx + len), y:TC.toroidY + Math.sin(a)*(TC.toroidRy + len*0.75)},
          S.t + i, 22));
      }
      if(Math.random() < 0.45) beep(2200 + Math.random()*900, 0.05, 'sawtooth', 0.03);
    }
  }
}

function drawDevices(){
  if(S.dev === 'electroscope')      drawElectroscope();
  else if(S.dev === 'vandegraaff')  drawVanDeGraaff();
  else if(S.dev === 'sparks')       drawSparks();
  else                              drawTesla();
}

/* ---------- gold leaf electroscope ---------- */
function drawElectroscope(){
  const g = esGeom(), Q = esCharges(), qLeaf = Q.leaf, ang = S.esLeaf;
  const capSign = Math.sign(Q.disc);

  benchLine(ES.caseTop + ES.caseH + 30);

  /* glass case, drawn first so the metal reads as being inside it */
  CX.fillStyle = 'rgba(136,204,255,0.07)';
  rr(ES.caseX - ES.caseW/2, ES.caseTop, ES.caseW, ES.caseH, 6); CX.fill();
  CX.strokeStyle = PAL.glass; CX.lineWidth = 3; CX.globalAlpha = .55;
  rr(ES.caseX - ES.caseW/2, ES.caseTop, ES.caseW, ES.caseH, 6); CX.stroke();
  CX.globalAlpha = 1;

  /* metal foil lining the inside of the glass, earthed through the base.
     It is what shields the leaf from stray outside fields. */
  const foilTop = ES.caseTop + ES.caseH*0.42, foilH = ES.caseH*0.58 - 4;
  CX.fillStyle = PAL.metal;
  for(const sgn of [-1, +1]){
    const fx = ES.caseX + sgn*(ES.caseW/2 - 5) - (sgn < 0 ? 0 : 14);
    CX.fillRect(fx, foilTop, 14, foilH);
    CX.fillStyle = PAL.metalHi; CX.fillRect(fx, foilTop, 3, foilH);
    CX.fillStyle = PAL.metal;
  }
  CX.fillStyle = PAL.metal;
  rr(ES.caseX - ES.caseW/2 - 18, ES.caseTop + ES.caseH, ES.caseW + 36, 24, 6); CX.fill();
  CX.strokeStyle = PAL.ground; CX.lineWidth = 2.6;
  line(ES.caseX + ES.caseW/2 + 18, ES.caseTop + ES.caseH + 12,
       ES.caseX + ES.caseW/2 + 111, ES.caseTop + ES.caseH + 12);
  earthSym(ES.caseX + ES.caseW/2 + 111, ES.caseTop + ES.caseH + 22, 22);

  /* insulating plug where the brass rod passes through the case */
  CX.fillStyle = PAL.insul;
  rr(ES.cx - 51, ES.caseTop - 12, 102, 33, 6); CX.fill();
  CX.fillStyle = 'rgba(255,255,255,.10)';
  rr(ES.cx - 51, ES.caseTop - 12, 102, 11, 6); CX.fill();

  /* brass disc, brass rod */
  CX.fillStyle = metalFill(ES.cx - ES.capW/2, ES.capY, ES.capW, ES.capH);
  rr(ES.cx - ES.capW/2, ES.capY, ES.capW, ES.capH, 4); CX.fill();
  CX.strokeStyle = 'rgba(0,0,0,.35)'; CX.lineWidth = 1.2;
  rr(ES.cx - ES.capW/2, ES.capY, ES.capW, ES.capH, 4); CX.stroke();
  CX.fillStyle = PAL.metal;
  CX.fillRect(ES.cx - ES.stemW/2, ES.capY + ES.capH, ES.stemW, ES.leafTop - ES.capY - ES.capH);
  CX.fillStyle = PAL.metalHi;
  CX.fillRect(ES.cx - ES.stemW/2, ES.capY + ES.capH, 3, ES.leafTop - ES.capY - ES.capH);

  /* ---- the gold leaf ----
     A single strip of gold foil folded over the bottom of the rod, so both
     halves hinge from exactly the same point.  Each half is drawn symmetric
     about that pivot and no wider than the rod at the top, which is what
     makes it look attached rather than stuck on beside the rod. */
  const hw0 = ES.stemW*0.46, hw1 = ES.stemW*0.80;
  for(const sgn of [-1, +1]){
    CX.save();
    CX.translate(ES.cx, ES.leafTop);
    CX.rotate(sgn*ang*Math.PI/180);
    const g = CX.createLinearGradient(-hw1, 0, hw1, ES.leafL);
    g.addColorStop(0, '#ffe89a'); g.addColorStop(.45, '#ffd15e'); g.addColorStop(1, '#c08a1e');
    CX.fillStyle = g;
    CX.beginPath();
    CX.moveTo(-hw0, 0); CX.lineTo(hw0, 0);
    CX.lineTo(hw1, ES.leafL - 5);
    CX.quadraticCurveTo(0, ES.leafL + 4, -hw1, ES.leafL - 5);
    CX.closePath(); CX.fill();
    CX.strokeStyle = 'rgba(90,60,0,.45)'; CX.lineWidth = 1; CX.stroke();
    /* the crease down the middle of the foil */
    CX.strokeStyle = 'rgba(255,255,255,.35)'; CX.lineWidth = 1;
    line(0, 3, 0, ES.leafL - 8);
    CX.restore();
  }
  /* the clamp that holds the foil onto the rod — this is the join the eye
     looks for, so it is drawn ON the pivot, over both leaves */
  CX.fillStyle = PAL.metalHi;
  rr(ES.cx - ES.stemW*0.75, ES.leafTop - 7, ES.stemW*1.5, 12, 3); CX.fill();
  CX.strokeStyle = 'rgba(0,0,0,.35)'; CX.lineWidth = 1;
  rr(ES.cx - ES.stemW*0.75, ES.leafTop - 7, ES.stemW*1.5, 12, 3); CX.stroke();

  /* Charge distribution.  The leaf's charge is drawn ON the leaf, rotated to
     the leaf's own position, because that is where it physically sits — and
     it is what makes the leaf lift.  The symbols themselves stay upright. */
  if(S.show.particles){
    const nCap = Math.min(7, Math.round(Math.abs(Q.disc)*1.6) + 2);
    if(Math.abs(Q.disc) > LEAF_MIN_Q) for(let i = 0; i < nCap; i++)
      chargeDot(ES.cx - ES.capW/2 + 33 + (ES.capW - 66)*i/(nCap-1 || 1),
                ES.capY + ES.capH/2, capSign, 10);
    if(Math.abs(qLeaf) > LEAF_MIN_Q) for(const sgn of [-1, +1]){
      const a = sgn*ang*Math.PI/180;
      for(const f of [0.40, 0.74]){
        const L = ES.leafL*f;
        chargeDot(ES.cx - L*Math.sin(a), ES.leafTop + L*Math.cos(a), Math.sign(qLeaf), 9);
      }
    }
  }

  /* ---- the charged rod: always on the bench, dragged by hand ---- */
  {
    const rx0 = g.x, rx1 = g.tip;
    /* a hand-hold at the far end, so it reads as something you pick up */
    const ry = ES.capY + ES.capH/2 - ES.rodH/2;   // centred on the disc's axis
    CX.fillStyle = PAL.insul;
    rr(rx0 - 30, ry + 3, 34, ES.rodH - 6, 7); CX.fill();
    CX.fillStyle = S.esRod > 0 ? '#cfe6f5' : '#2f3136';
    rr(rx0, ry, ES.rodL, ES.rodH, ES.rodH/2); CX.fill();
    CX.strokeStyle = g.touching ? PAL.amber : 'rgba(0,0,0,.4)';
    CX.lineWidth = g.touching ? 2.6 : 1.3;
    rr(rx0, ry, ES.rodL, ES.rodH, ES.rodH/2); CX.stroke();
    if(S.show.particles) for(let i = 0; i < 4; i++)
      chargeDot(rx0 + 34 + (ES.rodL - 68)*i/3, ES.capY + ES.capH/2, S.esRod, 10);
    /* the charge jumping across at the moment of contact */
    if(S.esFlash > 0){
      CX.globalAlpha = Math.min(1, S.esFlash*2);
      drawSpark(sparkPath({x:rx1 - 4, y:ES.capY + ES.capH/2}, {x:ES.discX + 6, y:ES.capY + ES.capH/2}, 7, 5), 1, 4);
      CX.globalAlpha = 1;
    }
    if(S.show.labels){
      txt(g.touching ? 'TOUCHING — charge shared by contact'
                     : 'drag me →   gap ' + (g.d/10).toFixed(1) + ' cm',
          (rx0 + rx1)/2, ES.capY - 34,
          {size:16, weight:700, col:g.touching ? PAL.amber : PAL.dim});
      txt(S.esRod > 0 ? 'POSITIVE rod' : 'NEGATIVE rod', (rx0 + rx1)/2, ES.capY + ES.capH/2 + 36,
          {size:14, weight:700, col:S.esRod > 0 ? PAL.pos : PAL.neg});
    }
    /* the gap being measured, so the cause of the divergence is explicit */
    if(!g.touching){
      CX.strokeStyle = PAL.muted; CX.lineWidth = 1; CX.setLineDash([4, 4]);
      line(rx1 + 2, ES.capY + ES.capH/2, ES.discX - 2, ES.capY + ES.capH/2); CX.setLineDash([]);
    }
  }
  /* earthing finger */
  if(S.esEarthed){
    CX.strokeStyle = PAL.ground; CX.lineWidth = 3.2; CX.lineCap = 'round';
    CX.beginPath();
    CX.moveTo(ES.cx + ES.capW/2 - 12, ES.capY + 6);
    CX.quadraticCurveTo(ES.cx + 330, ES.capY - 50, ES.cx + 352, ES.capY + 225);
    CX.stroke();
    earthSym(ES.cx + 352, ES.capY + 234, 27);
    txt('earthed by touch', ES.cx + 352, ES.capY + 292, {size:16, weight:700, col:PAL.ground});
  }

  if(S.show.labels) drawEsLabels();

  /* readout */
  const by = H - 42;
  CX.fillStyle = PAL.card; CX.globalAlpha = .88; rr(W/2 - 330, by - 28, 660, 56, 10); CX.fill();
  CX.globalAlpha = 1; CX.strokeStyle = PAL.border; CX.lineWidth = 1;
  rr(W/2 - 330, by - 28, 660, 56, 10); CX.stroke();
  txt('leaf divergence  ' + ang.toFixed(0) + '°', W/2, by - 8, {size:19, weight:800,
      col:ang > 1 ? PAL.accent : PAL.muted, mono:true});
  txt(esVerdict(), W/2, by + 15, {size:14, weight:600, col:PAL.dim});

  setChips('⚡ Devices — gold leaf electroscope',
    'net ' + (S.esCharge === 0 ? '0' : signStr(Math.sign(S.esCharge)) + Math.abs(S.esCharge)) +
    ' · gap ' + (g.touching ? '0' : (g.d/10).toFixed(1)) + ' cm · leaf ' + ang.toFixed(0) + '°',
    '<b>Drag the rod</b> towards the brass disc — the nearer it gets, the wider the leaf opens.<br>' +
    '<b>Push it all the way</b> and the charge is shared by contact; the leaf then stays up.<br>' +
    '<b>Earth wire</b> drains the charge away and the leaf falls.', '');
}
/* One leader line + caption, so every electroscope label is laid out the same
   way and none of them is hand-placed twice. */
const ES_LBL = 15;
function leader(tx, ty, px, py, label, align){
  /* Measure the caption and stop the line short of it.  Running the leader
     all the way to the text anchor draws it straight through the words. */
  CX.font = '600 ' + ES_LBL + "px 'Inter',sans-serif";
  const w = CX.measureText(label).width;
  const near = align === 'right' ? tx - w - 12 : tx + w + 12;
  CX.strokeStyle = PAL.muted; CX.lineWidth = 1.2; CX.lineCap = 'round';
  CX.beginPath();
  CX.moveTo(px, py); CX.lineTo(near, py);
  if(Math.abs(ty - py) > 1) CX.lineTo(near, ty);
  CX.stroke();
  CX.beginPath(); CX.arc(px, py, 2.6, 0, TAU); CX.fillStyle = PAL.muted; CX.fill();
  txt(label, tx, ty, {size:ES_LBL, weight:600, col:PAL.dim, align});
}

/* The parts named the way a 0625 paper names them. */
function drawEsLabels(){
  const R = ES.caseX + ES.caseW/2, L = ES.caseX - ES.caseW/2;
  const foilTop = ES.caseTop + ES.caseH*0.42;
  /* right-hand column */
  leader(R + 148, ES.capY + ES.capH/2, ES.cx + ES.capW/2 - 14, ES.capY + ES.capH/2,
         'Brass disc', 'right');
  leader(R + 148, ES.caseTop - 2, ES.cx + 44, ES.caseTop + 2, 'Insulating plug', 'right');
  leader(R + 148, ES.caseTop + 78, R - 4, ES.caseTop + 78, 'Glass case', 'right');
  leader(R + 148, ES.caseTop + 150, ES.cx + ES.stemW/2, ES.caseTop + 150, 'Brass rod', 'right');
  /* left-hand column */
  leader(L - 148, ES.leafTop + 70, ES.cx - ES.stemW*0.8, ES.leafTop + 70, 'Gold leaf', 'left');
  leader(L - 148, foilTop + 60, L + 12, foilTop + 60, 'Metal foil', 'left');
  txt('Earth', ES.caseX + ES.caseW/2 + 111, ES.caseTop + ES.caseH + 62,
      {size:15, weight:700, col:PAL.ground});
  txt('the foil and the case are earthed, which shields the leaf',
      ES.caseX, ES.caseTop + ES.caseH + 62, {size:13, weight:600, col:PAL.muted});
}

function esVerdict(){
  const Q = esCharges();
  if(S.esEarthed) return 'Earthed — the charge flows to the ground and the leaf falls.';
  if(Q.touching)
    return 'Contact: the charge is shared, so the electroscope keeps the SAME sign as the rod.';
  if(S.esCharge === 0)
    return Math.abs(Q.leaf) > LEAF_MIN_Q
      ? 'Induction: the nearer the rod, the more the charge separates — but the net charge is still ZERO.'
      : 'Uncharged, and the rod is too far away to matter. Drag the rod towards the brass disc.';
  const like = Math.sign(S.esCharge) === S.esRod;
  if(Math.abs(Q.k) < 0.35) return 'Charged electroscope: the leaf and the stem repel each other.';
  if(like) return 'The rod has the SAME sign as the electroscope, so bringing it nearer opens the leaf FURTHER.';
  return Math.sign(Q.leaf) === S.esRod
    ? 'Brought closer still, the unlike rod has OVER-corrected: the leaf collapsed and is opening again the other way.'
    : 'The rod has the OPPOSITE sign, so bringing it nearer makes the leaf FALL. That is the test for sign.';
}

/* ---------- Van de Graaff ---------- */
function drawVanDeGraaff(){
  const V = domeVolts(S.vgQ, 0.15), needV = breakdownVolts(S.vgGap/10);
  const inside = S.vgView === 'inside';
  const chargeFrac = Math.min(1, S.vgQ/4.2e-6);
  benchLine(VG.baseY + VG.baseH + 10);
  CX.save(); CX.translate(vgShiftX(), 0);       // centre the group

  /* ---- earthed metal base ---- */
  CX.fillStyle = '#1b1e22';
  rr(VG.baseX, VG.baseY, VG.baseW, VG.baseH, 5); CX.fill();
  CX.strokeStyle = PAL.text; CX.lineWidth = 3.4;
  rr(VG.baseX, VG.baseY, VG.baseW, VG.baseH, 5); CX.stroke();
  CX.strokeStyle = PAL.ground; CX.lineWidth = 2.6;
  line(VG.baseX + VG.baseW/2, VG.baseY + VG.baseH,
       VG.baseX + VG.baseW/2, VG.baseY + VG.baseH + 16);
  earthSym(VG.baseX + VG.baseW/2, VG.baseY + VG.baseH + 20, 18);

  /* ---- insulating pillars ---- */
  for(const sgn of [-1, +1]){
    const px = VG.cx + sgn*VG.pillarX - VG.pillarW/2;
    const pg = CX.createLinearGradient(px, 0, px + VG.pillarW, 0);
    pg.addColorStop(0, '#3b2f6e'); pg.addColorStop(.4, '#5a49a8'); pg.addColorStop(1, '#332a5e');
    CX.fillStyle = pg;
    CX.fillRect(px, VG.pillarTop, VG.pillarW, VG.pillarBot - VG.pillarTop);
  }

  /* ---- belt, rollers and combs (only visible in the cutaway) ---- */
  if(inside){
    /* belt */
    CX.strokeStyle = '#c9b48a'; CX.lineWidth = 5; CX.lineCap = 'butt';
    line(VG.cx - VG.beltHalf, VG.rollTop, VG.cx - VG.beltHalf, VG.rollBot);
    line(VG.cx + VG.beltHalf, VG.rollTop, VG.cx + VG.beltHalf, VG.rollBot);
    for(const [yy, r] of [[VG.rollTop, VG.rollR], [VG.rollBot, VG.rollR]]){
      CX.strokeStyle = '#c9b48a'; CX.lineWidth = 5;
      CX.beginPath(); CX.arc(VG.cx, yy, VG.beltHalf, 0, TAU); CX.stroke();
      CX.fillStyle = PAL.metal;
      CX.beginPath(); CX.arc(VG.cx, yy, r - 8, 0, TAU); CX.fill();
      CX.strokeStyle = PAL.green; CX.lineWidth = 3;
      CX.beginPath(); CX.arc(VG.cx, yy, r - 8, 0, TAU); CX.stroke();
      CX.strokeStyle = PAL.metalHi; CX.lineWidth = 2.6;
      const a = S.vgBelt*4;
      line(VG.cx + Math.cos(a)*(r-13), yy + Math.sin(a)*(r-13),
           VG.cx - Math.cos(a)*(r-13), yy - Math.sin(a)*(r-13));
    }
    /* which way the belt runs */
    if(S.show.labels){
      arrow(VG.cx - VG.beltHalf - 13, VG.rollBot - 40, VG.cx - VG.beltHalf - 13, VG.rollTop + 40,
            {col:PAL.dim, lw:1.6, head:8});
      arrow(VG.cx + VG.beltHalf + 13, VG.rollTop + 40, VG.cx + VG.beltHalf + 13, VG.rollBot - 40,
            {col:PAL.dim, lw:1.6, head:8});
    }
    /* charge riding up the belt */
    if(S.show.particles && S.vgOn) for(let i = 0; i < 9; i++){
      const u = ((S.vgBelt*0.55 + i/9) % 1);
      chargeDot(VG.cx - VG.beltHalf, VG.rollBot - (VG.rollBot - VG.rollTop)*u, +1, 6.5);
    }
    /* combs: teeth pointing at the belt */
    for(const [yy, sgn, nm] of [[VG.rollTop + 4, -1, 'collector'], [VG.rollBot - 4, -1, 'spray']]){
      CX.strokeStyle = PAL.green; CX.lineWidth = 2.6; CX.lineCap = 'round';
      const bx = VG.cx - VG.beltHalf - 8;
      line(bx - 34, yy, bx - 6, yy);
      for(let i = -2; i <= 2; i++) line(bx - 6, yy, bx - 20, yy + i*6);
    }
    /* the collector comb is wired to the shell; the spray comb to the H.T.B. */
    CX.strokeStyle = PAL.text; CX.lineWidth = 2.2;
    line(VG.cx - VG.beltHalf - 42, VG.rollTop + 4, VG.cx - VG.shellR + 16, VG.rollTop + 4);
    line(VG.cx - VG.beltHalf - 42, VG.rollBot - 4, VG.cx - 108, VG.rollBot - 4);
    line(VG.cx - 108, VG.rollBot - 4, VG.cx - 108, VG.baseY + 6);
    cellSym(VG.cx - 108, VG.baseY + 22, 26, false);
    txt('H.T.B.', VG.cx - 108, VG.baseY - 14,
        {size:12, weight:700, col:PAL.green, plate:true});
    CX.strokeStyle = PAL.ground; CX.lineWidth = 2.2;
    line(VG.cx - 108, VG.baseY + 38, VG.cx - 108, VG.baseY + VG.baseH - 6);

    /* discharge tube with its ion source and target */
    CX.fillStyle = 'rgba(180,210,235,0.14)';
    rr(VG.tubeX - VG.tubeW/2, VG.tubeTop, VG.tubeW, VG.tubeBot - VG.tubeTop, 5); CX.fill();
    CX.strokeStyle = PAL.glass; CX.lineWidth = 2; CX.globalAlpha = .8;
    rr(VG.tubeX - VG.tubeW/2, VG.tubeTop, VG.tubeW, VG.tubeBot - VG.tubeTop, 5); CX.stroke();
    CX.globalAlpha = 1;
    CX.fillStyle = PAL.metal;
    rr(VG.tubeX - 9, VG.tubeTop - 4, 18, 12, 3); CX.fill();
    rr(VG.tubeX - 9, VG.tubeBot - 8, 18, 12, 3); CX.fill();
    if(S.show.particles && S.vgOn) for(let i = 0; i < 4; i++){
      const u = ((S.vgBelt*0.9 + i/4) % 1);
      chargeDot(VG.tubeX, VG.tubeTop + (VG.tubeBot - VG.tubeTop)*u, +1, 5);
    }
  }

  /* ---- the metal shell ---- */
  if(inside){
    /* the shell drawn whole, with one notch at the bottom where the belt and
       the pillars pass through — a cutaway, not a broken ring */
    const notch = 0.085*Math.PI;
    CX.strokeStyle = PAL.metal; CX.lineWidth = 10; CX.lineCap = 'butt';
    CX.beginPath();
    CX.arc(VG.cx, VG.shellY, VG.shellR, Math.PI/2 + notch, Math.PI/2 - notch + TAU, false);
    CX.stroke();
  }else{
    const dg = CX.createRadialGradient(VG.cx - 42, VG.shellY - 44, 12, VG.cx, VG.shellY, VG.shellR*1.25);
    dg.addColorStop(0, PAL.metalHi); dg.addColorStop(.6, PAL.metal); dg.addColorStop(1, '#2b3138');
    CX.fillStyle = dg;
    CX.beginPath(); CX.arc(VG.cx, VG.shellY, VG.shellR, 0, TAU); CX.fill();
    CX.strokeStyle = 'rgba(0,0,0,.45)'; CX.lineWidth = 2;
    CX.beginPath(); CX.arc(VG.cx, VG.shellY, VG.shellR, 0, TAU); CX.stroke();
  }
  /* charge always sits on the OUTSIDE surface, in both views */
  if(S.show.particles){
    const n = S.vgQ > 0 ? Math.max(3, Math.round(chargeFrac*16)) : 0;
    for(let i = 0; i < n; i++){
      const a = -Math.PI/2 + (i - (n-1)/2)*(TAU*0.82/Math.max(n, 8));
      chargeDot(VG.cx + Math.cos(a)*(VG.shellR + 13), VG.shellY + Math.sin(a)*(VG.shellR + 13), +1, 8);
    }
  }
  if(S.vgHair){
    /* the classic demonstration: every hair takes the SAME charge as the
       shell, so they repel each other and stand out radially.  With the shell
       flat they simply hang — that contrast is the whole point.
       Scaled by POTENTIAL, not by the maximum charge: the shell sparks long
       before it reaches that, so the old scaling left the hair barely moving. */
    const f = Math.min(1, V/40000);
    const hr = 30, hy = VG.shellY - VG.shellR - hr + 8;
    CX.strokeStyle = '#b0793f'; CX.lineWidth = 2.6; CX.lineCap = 'round';
    for(let i = 0; i < 17; i++){
      const a = -Math.PI*0.97 + i*Math.PI*0.94/16;
      const L = 14 + f*36;
      const sx = VG.cx + Math.cos(a)*hr, sy = hy + Math.sin(a)*hr;
      const ex = VG.cx + Math.cos(a)*(hr + L);
      const ey = hy + Math.sin(a)*(hr + L) + (1 - f)*L*1.2;   // gravity wins when flat
      CX.beginPath(); CX.moveTo(sx, sy);
      CX.quadraticCurveTo(sx + (ex-sx)*0.45, sy + (ey-sy)*0.2 + (1-f)*9, ex, ey);
      CX.stroke();
    }
    const hg = CX.createRadialGradient(VG.cx - 10, hy - 10, 4, VG.cx, hy, hr);
    hg.addColorStop(0, '#f0c9a4'); hg.addColorStop(1, '#c99a72');
    CX.fillStyle = hg;
    CX.beginPath(); CX.arc(VG.cx, hy, hr, 0, TAU); CX.fill();
    CX.fillStyle = '#3a2a1c';
    CX.beginPath(); CX.arc(VG.cx - 10, hy + 1, 3, 0, TAU); CX.fill();
    CX.beginPath(); CX.arc(VG.cx + 10, hy + 1, 3, 0, TAU); CX.fill();
    CX.strokeStyle = '#3a2a1c'; CX.lineWidth = 2;
    CX.beginPath(); CX.arc(VG.cx, hy + 8, 9, 0.25*Math.PI, 0.75*Math.PI); CX.stroke();
    if(S.show.particles && f > 0.12) for(let i = 0; i < 5; i++){
      const a = -Math.PI*0.85 + i*Math.PI*0.7/4;
      chargeDot(VG.cx + Math.cos(a)*(hr + 12 + f*30), hy + Math.sin(a)*(hr + 12 + f*30), +1, 6.5);
    }
    /* the caption goes in the left label column — over the shell it collided
       with the mode chip and ran off the top of the canvas */
    if(S.show.labels)
      wrapText(f > 0.12
          ? 'every hair carries the SAME charge, so they repel and stand apart'
          : 'flat shell: the hairs just hang. Start the belt and watch them rise.',
        VG_LABEL_L + 92, VG.shellY - 84, 186, 17,
        {size:13, weight:700, col:f > 0.12 ? PAL.accent : PAL.dim});
  }



  /* ---- earthed sphere and the spark gap ---- */
  const eg = CX.createRadialGradient(VG.gndX - 20, VG.gndY - 22, 6, VG.gndX, VG.gndY, VG.gndR*1.2);
  eg.addColorStop(0, PAL.metalHi); eg.addColorStop(.6, PAL.metal); eg.addColorStop(1, '#2b3138');
  CX.fillStyle = eg;
  CX.beginPath(); CX.arc(VG.gndX, VG.gndY, VG.gndR, 0, TAU); CX.fill();
  CX.strokeStyle = 'rgba(0,0,0,.4)'; CX.lineWidth = 1.6;
  CX.beginPath(); CX.arc(VG.gndX, VG.gndY, VG.gndR, 0, TAU); CX.stroke();
  CX.fillStyle = PAL.metal;
  CX.fillRect(VG.gndX - 8, VG.gndY + VG.gndR, 16, VG.baseY + VG.baseH - VG.gndY - VG.gndR);
  CX.strokeStyle = PAL.ground; CX.lineWidth = 2.6;
  line(VG.gndX, VG.baseY + VG.baseH, VG.gndX + 62, VG.baseY + VG.baseH);
  earthSym(VG.gndX + 62, VG.baseY + VG.baseH + 8, 18);

  const gx0 = VG.cx + VG.shellR, gx1 = VG.gndX - VG.gndR;
  CX.strokeStyle = PAL.muted; CX.lineWidth = 1; CX.setLineDash([4, 4]);
  line(gx0, VG.shellY, gx1, VG.shellY); CX.setLineDash([]);
  txt('gap ' + S.vgGap.toFixed(0) + ' mm', (gx0+gx1)/2, VG.shellY - 24,
      {size:13, weight:700, col:PAL.dim, mono:true, plate:true});
  if(S.vgFlash > 0) drawSpark(S.vgSparkPts, Math.min(1, S.vgFlash/0.32), 7);

  /* ---- labels ---- */
  if(S.show.labels){
    const R = VG.cx + VG.shellR, VG_LBL_L = VG_LABEL_L;
    if(inside){
      leader(R + 236, VG.shellY - 108, VG.cx + 66, VG.shellY - VG.shellR + 22, 'Metal shell', 'right');
      leader(VG_LBL_L, VG.rollTop + 4, VG.cx - VG.beltHalf - 30, VG.rollTop + 4,
             'Collector comb', 'left');
      leader(VG_LBL_L, VG.rollBot - 4, VG.cx - VG.beltHalf - 30, VG.rollBot - 4,
             'Spray comb', 'left');
      leader(R + 236, VG.shellY + 96, VG.cx + VG.beltHalf, VG.shellY + 96, 'Insulating belt', 'right');
      leader(R + 236, VG.pillarBot - 40, VG.cx + VG.pillarX, VG.pillarBot - 40,
             'Insulating pillar', 'right');
      leader(R + 236, VG.tubeTop + 46, VG.tubeX, VG.tubeTop + 46, 'Discharge tube', 'right');
      txt('ion source', VG.tubeX + 16, VG.tubeTop + 26, {size:12, weight:600, col:PAL.muted, align:'left'});
      txt('target', VG.tubeX + 16, VG.tubeBot - 16, {size:12, weight:600, col:PAL.muted, align:'left'});
      leader(R + 236, VG.baseY + VG.baseH/2, VG.baseX + VG.baseW - 8, VG.baseY + VG.baseH/2,
             'Earthed base', 'right');
    }else{
      /* stand clear of the person's head when it is on the dome */
      txt('metal shell — charge sits on the OUTSIDE',
          VG.cx + (S.vgHair ? 236 : 0), VG.shellY - VG.shellR - (S.vgHair ? -34 : 34),
          {size:14, weight:700, col:PAL.accent, plate:S.vgHair});
      leader(VG_LBL_L, VG.pillarBot - 60, VG.cx - VG.pillarX, VG.pillarBot - 60,
             'Insulating pillar', 'left');
      leader(VG_LBL_L, VG.baseY + VG.baseH/2, VG.baseX + 8, VG.baseY + VG.baseH/2,
             'Earthed base', 'left');
    }
    txt('earthed sphere', VG.gndX, VG.gndY - VG.gndR - 22, {size:13, weight:700, col:PAL.dim});
  }

  CX.restore();                                 // back to canvas coordinates

  /* ---- readout, in the caption band below the apparatus ---- */
  const by = H - 34;
  CX.fillStyle = PAL.card; CX.globalAlpha = .88; rr(W/2 - 300, by - 28, 600, 56, 10); CX.fill();
  CX.globalAlpha = 1; CX.strokeStyle = PAL.border; CX.lineWidth = 1;
  rr(W/2 - 300, by - 28, 600, 56, 10); CX.stroke();
  txt('shell  ' + (V/1000).toFixed(0) + ' kV     needs ' + (needV/1000).toFixed(0) +
      ' kV to jump ' + S.vgGap.toFixed(0) + ' mm', W/2, by - 9,
      {size:14, weight:800, mono:true, col:V >= needV ? PAL.spark : PAL.text});
  txt('air breaks down at 3 kV per mm  ·  spark could reach ' +
      sparkLength_mm(V).toFixed(0) + ' mm', W/2, by + 13,
      {size:12, weight:600, col:PAL.dim});

  setChips('⚡ Devices — Van de Graaff generator' + (inside ? ' (cutaway)' : ''),
    (S.vgOn ? 'running' : 'stopped') + ' · ' + (V/1000).toFixed(0) + ' kV',
    '<b>Inside view</b> shows the belt, the two combs and the H.T. supply that drive it.<br>' +
    '<b>Charge collects on the OUTSIDE</b> of the shell, so the voltage keeps climbing.<br>' +
    '<b>Close the gap</b> in the Data panel to make it spark sooner.',
    V >= needV*0.85 && V < needV ? 'Almost at breakdown — a spark is about to jump' : '');
}

/* ---------- sparks and discharge ---------- */
function drawSparks(){
  const need = breakdownVolts(S.spGap);
  const ok = S.spV >= need;
  const spBench = SP.ay + SP.r + SP.stalk + SP.standH;
  benchLine(spBench);

  for(const [x, sgn] of [[SP.ax, +1], [SP.bx, -1]]){
    const g = CX.createRadialGradient(x - 18, SP.ay - 20, 6, x, SP.ay, SP.r*1.2);
    g.addColorStop(0, PAL.metalHi); g.addColorStop(.6, PAL.metal); g.addColorStop(1, '#2b3138');
    CX.fillStyle = g; CX.beginPath(); CX.arc(x, SP.ay, SP.r, 0, TAU); CX.fill();
    CX.strokeStyle = 'rgba(0,0,0,.4)'; CX.lineWidth = 1.6;
    CX.beginPath(); CX.arc(x, SP.ay, SP.r, 0, TAU); CX.stroke();
    CX.fillStyle = PAL.metal; CX.fillRect(x - 7, SP.ay + SP.r, 14, SP.stalk);
    standSym(x, SP.ay + SP.r + SP.stalk, SP.standH, 58);
    if(S.show.particles) for(let i = 0; i < 5; i++){
      const a = -Math.PI*0.75 + i*Math.PI*1.5/4;
      chargeDot(x + Math.cos(a)*SP.r*0.74, SP.ay + Math.sin(a)*SP.r*0.74, sgn, 8);
    }
  }
  /* gap */
  const gx0 = SP.ax + SP.r, gx1 = SP.bx - SP.r;
  CX.strokeStyle = PAL.muted; CX.lineWidth = 1; CX.setLineDash([4, 4]);
  line(gx0, SP.ay, gx1, SP.ay); CX.setLineDash([]);
  arrow(gx0 + 2, SP.ay - 42, gx1 - 2, SP.ay - 42, {col:PAL.dim, lw:1.4, head:8});
  arrow(gx1 - 2, SP.ay - 42, gx0 + 2, SP.ay - 42, {col:PAL.dim, lw:1.4, head:8});
  txt('d = ' + S.spGap.toFixed(1) + ' mm', (gx0+gx1)/2, SP.ay - 60,
      {size:13, weight:700, col:PAL.dim, mono:true});

  if(S.spFlash > 0){
    drawSpark(S.spPts, Math.min(1, S.spFlash/0.30), 6);
    /* the electrons that actually cross the gap */
    if(S.show.particles) for(let i = 0; i < 6; i++){
      const u = ((1 - S.spFlash/0.40) + i*0.09) % 1;
      const k = Math.floor(u*(S.spPts.length-1));
      electron(S.spPts[k].x, S.spPts[k].y, 5);
    }
    txt('light and heat', (gx0+gx1)/2, SP.ay + 54, {size:12.5, weight:700, col:PAL.spark});
  }

  if(S.show.labels){
    txt('+ charged sphere', SP.ax, SP.ay - SP.r - 24, {size:13, weight:700, col:PAL.pos});
    txt('− charged sphere', SP.bx, SP.ay - SP.r - 24, {size:13, weight:700, col:PAL.neg});
  }

  const by = H - 52;
  CX.fillStyle = PAL.card; CX.globalAlpha = .88; rr(W/2 - 300, by - 32, 600, 64, 10); CX.fill();
  CX.globalAlpha = 1; CX.strokeStyle = ok ? PAL.spark : PAL.border; CX.lineWidth = ok ? 1.8 : 1;
  rr(W/2 - 300, by - 32, 600, 64, 10); CX.stroke();
  txt('V = ' + (S.spV/1000).toFixed(1) + ' kV      needs 3 kV/mm × ' + S.spGap.toFixed(1) +
      ' mm = ' + (need/1000).toFixed(1) + ' kV', W/2, by - 12,
      {size:13.5, weight:800, mono:true, col:ok ? PAL.spark : PAL.text});
  txt(ok ? 'The air breaks down — electrons jump across and a spark forms'
         : 'Not enough p.d. — the air stays an insulator', W/2, by + 12,
      {size:12.5, weight:700, col:ok ? PAL.spark : PAL.dim});

  setChips('⚡ Devices — sparks and discharge',
    (S.spV/1000).toFixed(1) + ' kV / ' + (need/1000).toFixed(1) + ' kV needed',
    '<b>Raise the p.d.</b> or <b>close the gap</b> until the air breaks down.<br>' +
    '<b>Lightning is the same thing</b>, on a scale of kilometres and megavolts.<br>' +
    '<b>Earthing</b> stops the charge building up in the first place.', '');
}

/* ---------- Tesla coil (kept, but flagged as beyond 0625) ---------- */
function drawTesla(){
  benchLine(TC.baseY + 16);
  /* base */
  CX.fillStyle = PAL.insul; rr(TC.cx - 150, TC.baseY - 26, 300, 30, 6); CX.fill();

  /* secondary: many fine turns */
  CX.fillStyle = '#8a6134';
  CX.fillRect(TC.cx - TC.secW/2, TC.secTop, TC.secW, TC.secBot - TC.secTop);
  CX.strokeStyle = 'rgba(0,0,0,.35)'; CX.lineWidth = 1;
  for(let y = TC.secTop + 3; y < TC.secBot; y += 4.5){
    CX.beginPath(); CX.moveTo(TC.cx - TC.secW/2, y);
    CX.quadraticCurveTo(TC.cx, y + 2.6, TC.cx + TC.secW/2, y); CX.stroke();
  }
  /* primary: a few thick turns at the bottom */
  CX.strokeStyle = '#c98a3a'; CX.lineWidth = 7; CX.lineCap = 'round';
  for(let i = 0; i < 4; i++){
    const y = TC.priY + i*13, w = TC.secW/2 + 34 - i*3;
    CX.beginPath(); CX.ellipse(TC.cx, y, w, 8, 0, 0, Math.PI); CX.stroke();
  }
  /* toroid */
  const tg = CX.createLinearGradient(0, TC.toroidY - TC.toroidRy, 0, TC.toroidY + TC.toroidRy);
  tg.addColorStop(0, PAL.metalHi); tg.addColorStop(.5, PAL.metal); tg.addColorStop(1, '#2b3138');
  CX.fillStyle = tg;
  CX.beginPath(); CX.ellipse(TC.cx, TC.toroidY, TC.toroidRx, TC.toroidRy, 0, 0, TAU); CX.fill();
  CX.strokeStyle = 'rgba(0,0,0,.4)'; CX.lineWidth = 1.6;
  CX.beginPath(); CX.ellipse(TC.cx, TC.toroidY, TC.toroidRx, TC.toroidRy, 0, 0, TAU); CX.stroke();
  CX.fillStyle = 'rgba(0,0,0,.22)';
  CX.beginPath(); CX.ellipse(TC.cx, TC.toroidY, TC.toroidRx*0.42, TC.toroidRy*0.42, 0, 0, TAU); CX.fill();

  /* spark gap in the primary circuit */
  CX.strokeStyle = PAL.text; CX.lineWidth = 2.4;
  line(TC.gapX - 60, TC.gapY, TC.gapX - 12, TC.gapY);
  line(TC.gapX + 12, TC.gapY, TC.gapX + 60, TC.gapY);
  CX.fillStyle = PAL.metal;
  CX.beginPath(); CX.arc(TC.gapX - 12, TC.gapY, 8, 0, TAU); CX.fill();
  CX.beginPath(); CX.arc(TC.gapX + 12, TC.gapY, 8, 0, TAU); CX.fill();
  line(TC.gapX + 60, TC.gapY, TC.gapX + 60, TC.priY + 20);
  line(TC.gapX + 60, TC.priY + 20, TC.cx - TC.secW/2 - 34, TC.priY + 20);
  cellSym(TC.gapX - 60, TC.gapY + 52, 30, false);
  line(TC.gapX - 60, TC.gapY, TC.gapX - 60, TC.gapY + 32);
  line(TC.gapX - 60, TC.gapY + 72, TC.gapX - 60, TC.priY + 46);
  line(TC.gapX - 60, TC.priY + 46, TC.cx - TC.secW/2 - 34, TC.priY + 46);
  if(S.teslaOn && Math.sin(S.t*40) > 0)
    drawSpark(sparkPath({x:TC.gapX - 12, y:TC.gapY}, {x:TC.gapX + 12, y:TC.gapY}, 3, 5), .9, 3);

/* KaTeX is loaded from a CDN and may simply not be there.  Every equation
   therefore ships with a plain-text twin, and we only upgrade to typeset
   maths once the library has actually arrived. */
function mathLine(tex, plain){
  if(typeof katex !== 'undefined'){
    try{ return '<div class="mrow">' + katex.renderToString(tex, {throwOnError:false}) + '</div>'; }
    catch(e){}
  }
  return '<div class="mrow plain">' + plain + '</div>';
}

/* ---------- collapsible section headings ----------
   Applied to the finished panel markup rather than threaded through every
   builder, so all three panes get it from one place and nothing that writes
   panel HTML has to know about folding. */
let FOLD = {};
try{ FOLD = JSON.parse(localStorage.getItem('haus.es.fold') || '{}') || {}; }catch(e){ FOLD = {}; }
function foldSave(){ try{ localStorage.setItem('haus.es.fold', JSON.stringify(FOLD)); }catch(e){} }

function makeCollapsible(el){
  const kids = [...el.childNodes];
  const frag = document.createDocumentFragment();
  let body = null;
  for(const k of kids){
    const isTitle = k.nodeType === 1 && k.classList && k.classList.contains('ptitle');
    if(isTitle){
      const key = (k.textContent || '').trim().toUpperCase();
      const h = document.createElement('button');
      h.className = 'ptitle';
      h.type = 'button';
      h.innerHTML = k.innerHTML + '<span class="chev">▾</span>';
      /* MUST be a per-iteration const: the handler closes over the VARIABLE,
         so capturing the outer `let body` made every heading toggle the last
         section's body instead of its own. */
      const mine = document.createElement('div');
      mine.className = 'pbody';
      body = mine;
      const shut = FOLD[key] === 1;
      h.classList.toggle('closed', shut);
      mine.classList.toggle('closed', shut);
      h.setAttribute('aria-expanded', String(!shut));
      h.dataset.fold = key;
      h.onclick = () => {
        const nowShut = !mine.classList.contains('closed');
        mine.classList.toggle('closed', nowShut);
        h.classList.toggle('closed', nowShut);
        h.setAttribute('aria-expanded', String(!nowShut));
        FOLD[key] = nowShut ? 1 : 0; foldSave(); clickSnd();
      };
      frag.appendChild(h); frag.appendChild(mine);
    }else if(body){ body.appendChild(k); }
    else frag.appendChild(k);
  }
  el.innerHTML = '';
  el.appendChild(frag);
}

    h += '<ul class="rule-list">' +
      '<li>Rubbing transfers <b>electrons</b> from one material to the other.</li>' +
      '<li>The material that <b>gains</b> electrons becomes <b>negative</b>.</li>' +
      '<li>The material that <b>loses</b> electrons becomes <b>positive</b>.</li>' +
      '<li><b>Protons never move</b> — they are locked in the nucleus.</li>' +
      '<li>Both objects gain <b>equal and opposite</b> charge: none is created.</li></ul>';
    h += sectionTitle('📐', 'CHARGING BY INDUCTION');
    h += '<ul class="rule-list">' +
      '<li>No contact is needed.</li>' +
      '<li>The rod\'s field makes the free electrons in the conductor <b>move</b>, so the two ' +
          'faces end up oppositely charged — but the total is still zero.</li>' +
      '<li>Earthing lets electrons enter or leave, and now the total is <b>not</b> zero.</li>' +
      '<li>Remove the <b>earth first</b>, then the rod.</li>' +
      '<li>The conductor is left with the charge <b>opposite</b> to the rod.</li></ul>';
    h += '<div class="note">Induction is why a charged rod picks up small pieces of paper even ' +
         'though the paper is neutral: the near side of each piece is pulled, the far side ' +
         'pushed, and the near side wins because it is closer.</div>';
  }else if(S.sec === 'fields'){
    h += sectionTitle('📐', 'ELECTRIC FIELDS');
    h += '<ul class="rule-list">' +
      '<li>An electric field is a region where a charge <b>feels a force</b>.</li>' +
      '<li>The field direction at a point is the direction of the force on a <b>positive</b> charge there.</li>' +
      '<li>Field lines run <b>from + to −</b>.</li>' +
      '<li>Lines <b>never cross</b> — the force at a point has only one direction.</li>' +
      '<li><b>Closer lines mean a stronger field.</b></li>' +
      '<li>Lines meet a conductor at <b>90°</b>.</li></ul>';
    h += sectionTitle('📐', 'FORCE BETWEEN CHARGES');
    h += '<div class="working">' + mathLine('F \\propto \\dfrac{Q_1 Q_2}{r^2}', 'F ∝ Q₁ Q₂ / r²') + '</div>';
    h += '<ul class="rule-list">' +
      '<li>Bigger charges → <b>bigger force</b>.</li>' +
      '<li>Bigger separation → <b>much smaller force</b>: double r and the force falls to a <b>quarter</b>.</li>' +
      '<li>At IGCSE this is <b>qualitative only</b> — no value in newtons is required.</li></ul>';
    h += sectionTitle('📐', 'UNIFORM FIELDS');
    h += '<div class="working">' + mathLine('E = \\dfrac{V}{d}', 'E = V / d') + '</div>';
    h += '<ul class="rule-list">' +
      '<li>Between parallel plates the lines are <b>parallel and evenly spaced</b>.</li>' +
      '<li>The field is the <b>same everywhere</b> in that region.</li>' +
      '<li>At the ends the lines bulge out and weaken — the <b>fringe field</b>.</li></ul>';
    h += '<div class="note">A charged conducting sphere carries all its charge on the ' +
         '<b>outside</b>, has <b>zero field inside</b>, and outside behaves exactly like a ' +
         'point charge sitting at its centre.</div>';
  }else{
    h += sectionTitle('📐', 'ELECTROSCOPE');
    h += '<ul class="rule-list">' +
      '<li>Detects the <b>presence</b> of charge, and can test its <b>sign</b>.</li>' +
      '<li>The leaf lifts because it and the stem carry the <b>same</b> charge and repel.</li>' +
      '<li>Bigger charge → <b>bigger divergence</b>.</li>' +
      '<li>Bring a rod of the <b>same</b> sign near a charged electroscope and the leaf rises further; ' +
          'an <b>opposite</b> sign makes it fall. That is the test.</li></ul>';
    h += sectionTitle('📐', 'VAN DE GRAAFF');
    h += '<ul class="rule-list">' +
      '<li>The belt carries charge up to the dome mechanically.</li>' +
      '<li>Charge collects on the <b>outside</b> of the dome, so it can keep adding more.</li>' +
      '<li><b>Mechanical work → electrical potential energy.</b></li></ul>';
    h += sectionTitle('📐', 'SPARKS, LIGHTNING AND EARTHING');
    h += '<div class="working">' +
      mathLine('E_{break} \\approx 3\\times10^{6}\\ \\mathrm{V\\,m^{-1}} = 3\\ \\mathrm{kV\\,mm^{-1}}',
               'E_break ≈ 3 × 10⁶ V/m = 3 kV per mm') + '</div>';
    h += '<ul class="rule-list">' +
      '<li>Above that field, air stops insulating and <b>conducts</b>.</li>' +
      '<li><b>Electrons jump</b> the gap — that is the spark.</li>' +
      '<li>The spark gives out <b>light and heat</b>.</li>' +
      '<li><b>Lightning</b> is the same process on a huge scale.</li>' +
      '<li><b>Earthing</b> gives charge a path to the ground so it never builds up.</li></ul>';
    h += '<div class="note warn"><b>The Tesla coil is not on the 0625 syllabus.</b> It is ' +
         'included so students can see a large discharge; the examinable content is the air ' +
         'breakdown rule above.</div>';
  }
  el.innerHTML = h;
  makeCollapsible(el);
}

/* ---------- live patching (no rebuild while a slider is being dragged) ---------- */
function patchPanel(){
  const set = (id, v) => { const e = $(id); if(e) e.textContent = v; };
  if(S.sec === 'charging' && S.method === 'friction'){
    const nE = S.rubs*FR.ePerRub;
    set('kvRubs', S.rubs); set('kvNE', nE); set('kvQ', sciQ(nE));
  }
  if(S.sec === 'fields' && S.fmode === 'force'){
    const d = Math.hypot(S.qB.x - S.qA.x, S.qB.y - S.qA.y), F = forceBetween(S.qA.q, S.qB.q, d);
    set('cdD', (d/10).toFixed(1)); set('cdF', fmtRatio(F.ratio));
    const a = $('kvAtt');
    if(a){ a.textContent = F.attract ? 'ATTRACT' : 'REPEL';
           a.className = F.attract ? 'v-neg' : 'v-pos'; }
  }
  if(S.sec === 'fields' && S.fmode === 'plates'){
    const p = activePlate();
    set('cdE', Math.round(S.plateV/(p.sep/1000)));
    set('cdU', (plateUniformHalf(p)/10).toFixed(1));
  }
  if(S.sec === 'devices' && S.dev === 'electroscope'){
    const gm = esGeom();
    set('cdLeaf', S.esLeaf.toFixed(0));
    set('cdEsQ', S.esCharge === 0 ? '0' : signStr(Math.sign(S.esCharge)) + Math.abs(S.esCharge));
    const QQ = esCharges();
    set('kvEsGap', gm.touching ? 'TOUCHING' : (gm.d/10).toFixed(1) + ' cm');
    set('kvEsInd', Math.round(100*(gm.touching ? 1 : induceAt(gm.d))) + '%');
    const say = $('kvEsSay');
    if(say) say.innerHTML = '<b>' + esVerdict() + '</b>';
    const dq = $('kvEsDisc'), lq = $('kvEsLeaf');
    if(dq){ dq.textContent = QQ.disc.toFixed(1);
            dq.className = QQ.disc > 0 ? 'v-pos' : QQ.disc < 0 ? 'v-neg' : ''; }
    if(lq){ lq.textContent = QQ.leaf.toFixed(1);
            lq.className = QQ.leaf > 0 ? 'v-pos' : QQ.leaf < 0 ? 'v-neg' : ''; }
  }
  if(S.sec === 'devices' && S.dev === 'vandegraaff'){
    const V = domeVolts(S.vgQ, 0.15);
    set('cdVgV', (V/1000).toFixed(0));
    set('cdVgN', (breakdownVolts(S.vgGap/10)/1000).toFixed(0));
    set('kvVgQ', (S.vgQ*1e6).toFixed(2) + ' µC');
    set('kvVgL', sparkLength_mm(V).toFixed(0) + ' mm');
  }
  if(S.sec === 'devices' && S.dev === 'sparks'){
    const need = breakdownVolts(S.spGap);
    set('cdSpN', (need/1000).toFixed(1)); set('cdSpV', (S.spV/1000).toFixed(1));
    const k = $('kvSpOk');
    if(k){ k.textContent = S.spV >= need ? 'YES — spark' : 'no';
           k.className = S.spV >= need ? 'v-amber' : ''; }
  }
}

function stepSim(dt){

function bindPills(sel, attr, cb){
  document.querySelectorAll(sel).forEach(b => b.onclick = () => {
    b.parentElement.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    cb(b.dataset[attr], b);
    clickSnd();
  });
}

  document.querySelectorAll(sel).forEach(b => b.classList.toggle('active', b.dataset[attr] === String(val)));

  S.mode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === m));

     chrome and move the canvas */

}

const DEV_ACTIONS = {

  electroscope:[

    ['esEarth', () => 'Earth wire', () => {

    }]],

     () => { S.vgView = S.vgView === 'inside' ? 'outside' : 'inside'; }],

    ['vgHair', () => '\u{1F464} Person on dome', () => { S.vgHair = !S.vgHair; }],

                               {x:VG.gndX - VG.gndR + 4, y:VG.gndY}, S.t, 26);

function rebuildDevActions(){
  const box = $('grp-devact');

    acts.map(a => '<button class="tbtn" id="act-' + a[0] + '">' + a[1]() + '</button>').join('');

    const b = $('act-' + a[0]);
    b.onclick = () => { a[2](); clickSnd(); rebuildDevActions(); updatePanel(); draw(); };
  });

    $('act-vgRun').classList.toggle('on', S.vgOn);

}

/* Is this section driven by the merged Sequence control? */
const isSequenceMode = () => S.mode === 'sim' && S.sec === 'charging' && S.method === 'induction';

/* One control, two jobs.  Running = the sequence advances AND time flows;
   paused = both stop, so the frame you are pointing at holds still. */
function toggleSequence(){
  const running = S.indPlay && S.anim;
  if(running){ S.indPlay = false; S.anim = false; }
  else{ S.indPlay = true; S.anim = true; S.indStep = 'neutral'; S.indT = 0; }
  syncMediaBtn(); updatePanel(); draw();
}
function syncMediaBtn(){
  const b = $('animBtn');
  if(isSequenceMode()){
    const running = S.indPlay && S.anim;
    b.textContent = running ? '⏸ Pause' : '▶ Sequence';
    b.title = 'Run the five-step induction sequence. Pausing also freezes the frame.';
    b.classList.toggle('on', running);
  }else{
    b.textContent = S.anim ? '▶ Animation' : '⏸ Frozen';
    b.title = 'Freeze or resume every animation. Frozen keeps the picture, it does not blank it.';
    b.classList.toggle('on', S.anim);
  }
}
function stepInduction(d){
  const i = INDUCTION_STEPS.indexOf(S.indStep) + d;
  if(i < 0 || i >= INDUCTION_STEPS.length) return;
  /* stepping by hand leaves TIME running, so the earth-wire electrons keep
     moving while the teacher talks — only the auto-advance stops */
  S.indStep = INDUCTION_STEPS[i]; S.indPlay = false; S.anim = true;
  syncMediaBtn(); clickSnd(); updatePanel(); draw();
}

  on('dVgRun', () => { S.vgOn = !S.vgOn; });
  on('dVgHair', () => { S.vgHair = !S.vgHair; });

  bindSlider('spV',   {min:0, max:40, step:0.1, unit:'kV'}, v => { S.spV = v*1000; });
  rebuildDevActions();
}
function releaseTest(){
  const p = activePlate();
  S.test = S.fmode === 'plates' ? {x:FD.cx - 120, y:p.cy - p.sep/2 + 12}
         : S.fmode === 'pattern' ? {x:FD.cx + 190, y:FD.cy - 130}
         : {x:(S.qA.x + S.qB.x)/2, y:FD.cy - 150};
  S.testTrail = [];
}

/* ---------- canvas pointer: drag charges, zoom, pan, place test charge ---------- */
let drag = null, esDrag = null;
CV.addEventListener('pointerdown', e => {
  if(S.mode !== 'sim') return;
  try{ CV.setPointerCapture(e.pointerId); }catch(_){}
  const L = toLogical(e);
  if(S.zoom.k > 1){ S.zoom.panning = true; S.zoom.px = e.clientX; S.zoom.py = e.clientY; return; }
  if(S.sec === 'fields'){
    if(S.fshow === 'test' && e.button === 0){
      const hit = S.fmode === 'force' &&
        ([S.qA, S.qB].some(q => Math.hypot(L.x-q.x, L.y-q.y) < FD.qR + 6));
      if(!hit){ S.test = {x:L.x, y:L.y}; S.testTrail = []; draw(); return; }
    }
    if(S.fmode === 'force'){
      for(const q of [S.qA, S.qB])
        if(Math.hypot(L.x-q.x, L.y-q.y) < FD.qR + 8){ drag = q; return; }
    }
  }
  if(S.sec === 'devices' && S.dev === 'electroscope'){
    const gg = esGeom();
    if(L.x > gg.x - 34 && L.x < gg.tip + 6 &&
       Math.abs(L.y - (ES.capY + ES.capH/2)) < ES.rodH){
      esDrag = L.x - gg.x; return;
    }
  }
  if(S.sec === 'charging' && S.method === 'friction'){
    if(Math.abs(L.y - (FR.clothY + FR.clothH/2)) < 70 && Math.abs(L.x - FR.cx) < FR.rodL/2 + 90){
      S.rubbing = true; S.rubX = L.x; S.rubAcc = 0; return;
    }
  }
});
CV.addEventListener('pointermove', e => {
  if(S.zoom.panning){
    S.zoom.ox += (e.clientX - S.zoom.px)/VT.s;
    S.zoom.oy += (e.clientY - S.zoom.py)/VT.s;
    S.zoom.px = e.clientX; S.zoom.py = e.clientY;
    clampPan(); draw(); return;
  }
  const L = toLogical(e);
  if(drag){
    drag.x = Math.max(80, Math.min(W-80, L.x));
    drag.y = Math.max(120, Math.min(FD_FLOOR - 60, L.y));
    LINE_CACHE.sig = ''; patchPanel(); draw(); return;
  }
  if(esDrag !== null){
    S.esRodX = Math.max(ES.rodXmin, Math.min(ES.rodXmax, L.x - esDrag));
    patchPanel(); draw(); return;
  }
  if(S.rubbing){
    const dx = L.x - S.rubX;
    S.rubAcc = (S.rubAcc || 0) + Math.abs(dx);
    S.rubX = Math.max(FR.cx - FR.rodL/2, Math.min(FR.cx + FR.rodL/2, L.x));
    if(S.rubAcc >= FR.travelPerRub){ S.rubAcc = 0; doRub(); patchPanel(); }
    draw();
  }
});
function endPointer(){
  drag = null; esDrag = null; S.rubbing = false; S.zoom.panning = false;
  updatePanel(); draw();
}
CV.addEventListener('pointerup', endPointer);
CV.addEventListener('pointercancel', endPointer);
CV.addEventListener('dblclick', e => {
  if(S.mode !== 'sim') return;
  if(drag || S.rubbing) return;
  const L = toLogical(e);
  setZoom(S.zoom.k > 1 ? 1 : 2, L);
});
CV.addEventListener('contextmenu', e => { e.preventDefault(); resetSection(); });

/* keyboard: Space plays/pauses, arrows change section */
window.addEventListener('keydown', e => {
  const t = (e.target.tagName || '').toUpperCase();
  if(t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA' || t === 'BUTTON') return;
  if(e.code === 'Space'){ e.preventDefault(); $('animBtn').click(); }
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    const order = ['charging','fields','devices'];
    let i = order.indexOf(S.sec) + (e.key === 'ArrowRight' ? 1 : -1);
    i = (i + order.length) % order.length;
    setSection(order[i]);
  }
  if(e.key === 'Escape'){ S.test = null; S.testTrail = []; resetZoom(); }
});

/* ---------- start ---------- */
readPalette();
new ResizeObserver(() => resize()).observe(CV.parentElement);
window.addEventListener('resize', resize);
resize();
S.esRodX = ES.rodX0;
syncGroups();
rebuildDevActions();
syncMediaBtn();
updatePanel();
requestAnimationFrame(t => { last = t; tick(t); });
/* KaTeX is deferred; once it lands, re-render so the plain-text twins are
   replaced by typeset maths */
window.addEventListener('load', () => { if(typeof katex !== 'undefined') updatePanel(); });

</script>
</body>
