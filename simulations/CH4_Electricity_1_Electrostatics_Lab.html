<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electrostatics Lab — HAUS Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
/* ============ THEME TOKENS (6 themes) ============ */
:root {
  --bg:#0f172a; --card:#1e293b; --card2:#172033; --border:#334155;
  --text:#e2e8f0; --text-dim:#94a3b8; --text-muted:#64748b;
  --accent:#e3b341; --accent-glow:rgba(227,179,65,0.12);
  --grid:#1e293b; --canvas-bg:#0a0f1a;
  --green:#34d399; --rose:#fb7185; --violet:#a78bfa;
  --amber:#fbbf24; --blue:#38bdf8; --orange:#fb923c;
}
.theme-hausnight {
  --bg:#1a1c20; --card:#26282d; --card2:#1f2126; --border:#3a3c42;
  --text:#FFFFFF; --text-dim:#e0e2e8; --text-muted:#a8aab2;
  --accent:#F4C01E; --accent-glow:rgba(244,192,30,0.10);
  --grid:#2a2c32; --canvas-bg:#121418;
  --green:#A6B36A; --rose:#D68B57; --violet:#CBAA6A;
  --amber:#F4C01E; --blue:#5FB0C4; --orange:#D68B57;
}
.theme-neon {
  --bg:#0d0f1a; --card:#1a1c2e; --card2:#141628; --border:#2a2d4a;
  --text:#e0e0f0; --text-dim:#8888b8; --text-muted:#5a5a8a;
  --accent:#00ffc8; --accent-glow:rgba(0,255,200,0.1);
  --grid:#1a1c2e; --canvas-bg:#080a14;
  --green:#00ff88; --rose:#ff4499; --violet:#8844ff;
  --amber:#ffcc00; --blue:#4488ff; --orange:#ff6633;
}
.theme-light {
  --bg:#ffffff; --card:#f3f4f6; --card2:#e9ebef; --border:#d1d5db;
  --text:#111827; --text-dim:#4b5563; --text-muted:#9ca3af;
  --accent:#b45309; --accent-glow:rgba(180,83,9,0.10);
  --grid:#e5e7eb; --canvas-bg:#f9fafb;
  --green:#059669; --rose:#dc2626; --violet:#7c3aed;
  --amber:#d97706; --blue:#2563eb; --orange:#ea580c;
}
.theme-haus {
  --bg:#F4EEE0; --card:#FFFFFF; --card2:#F7F2E6; --border:#E4DAC4;
  --text:#1A1712; --text-dim:#5B5344; --text-muted:#948A74;
  --accent:#A9820F; --accent-glow:rgba(169,130,15,0.12);
  --grid:#EBE3D0; --canvas-bg:#FCFAF2;
  --green:#4E7A3F; --rose:#B5502E; --violet:#8A6D3B;
  --amber:#A9820F; --blue:#4A7AB8; --orange:#A87A4A;
}
.theme-clay {
  --bg:#d4c8be; --card:#e5d9d0; --card2:#dfd2c8; --border:#c2b5aa;
  --text:#2d2622; --text-dim:#6a5a4d; --text-muted:#928078;
  --accent:#a55a3a; --accent-glow:rgba(165,90,58,0.1);
  --grid:#ccbfb5; --canvas-bg:#eee6de;
  --green:#5a7a4a; --rose:#a03a3a; --violet:#6a4d7a;
  --amber:#b07a2a; --blue:#3a5a7a; --orange:#b05a2a;
}
/* ---- electrostatics colours ----
   These are PRINTED-REFERENCE facts, not decoration: red always means a
   positive charge and blue always means a negative one, in every theme, so
   a screenshot taken in HAUS Day reads the same as one taken in Neon. Only
   the two structural greys shift, because a metal that reads on black is
   invisible on cream. */
:root, .theme-hausnight, .theme-neon, .theme-light, .theme-haus, .theme-clay {
  --charge-pos:#ff4444; --charge-neg:#4488ff; --neutral:#888888;
  --field-line:rgba(255,200,50,0.55); --spark:#ffdd00; --electron:#4488ff;
  --ground:#44aa44; --glass:#88ccff; --silk:#ff88aa; --wool:#ccaa88;
}
:root, .theme-hausnight, .theme-neon { --metal:#7c8899; --metal-hi:#aab4c2; --insul:#5b4636; }
.theme-light, .theme-haus, .theme-clay { --metal:#5d6875; --metal-hi:#98a3b0; --insul:#7a5c42; }

/* ============ PAGE SHELL — every chrome height is fixed ============ */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;padding:8px 12px;height:100vh;overflow:hidden;
     display:flex;flex-direction:column;align-items:center;
     background:var(--bg);color:var(--text);transition:background .3s,color .3s}
.container{max-width:1560px;width:100%;height:100%;display:flex;flex-direction:column;min-height:0}

/* --- header zone: 45 px, set by .brand --- */
.top-bar{display:flex;justify-content:space-between;align-items:center;
         margin-bottom:6px;flex-wrap:wrap;gap:8px;flex:0 0 auto}
.top-bar h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge-top{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 8px;
           border-radius:12px;background:var(--accent-glow);color:var(--accent);
           border:1px solid var(--accent)}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode-tabs{display:flex;gap:4px;background:var(--card);border-radius:8px;
           padding:3px;border:1px solid var(--border)}
.mode-tab{padding:5px 12px;border-radius:6px;border:none;
          font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer;
          transition:all .2s;background:transparent;color:var(--text-dim)}
.mode-tab:hover{color:var(--text)}
.mode-tab.active{background:var(--accent-glow);color:var(--accent)}
.theme-select{background:var(--card);border:1px solid var(--border);color:var(--text);
              padding:4px 10px;border-radius:8px;cursor:pointer;
              font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;min-width:110px}
.brand{background:#F4C01E;border-radius:10px;padding:7px 8px;
       box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center}
.brand img{height:31px;width:auto;display:block}
@media(max-width:640px){.brand{display:none}}

/* --- section tabs: 3 equal buttons, 34 px.  Present in EVERY mode: outside
       Simulate they are dimmed and inert, never display:none, because
       removing the row would move the canvas. --- */
.sectabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
         flex:0 0 auto;margin-bottom:6px}
.sbtn{height:34px;border:1px solid var(--border);background:var(--card);color:var(--text-dim);
      border-radius:9px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;
      font-weight:600;transition:all .18s;display:flex;align-items:center;
      justify-content:center;gap:7px}
.sbtn:hover{color:var(--text)}
.sbtn.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.sectabs.locked{opacity:.35;pointer-events:none}

/* --- toolbar: two fixed rows --- */
.toolbar{display:flex;flex-direction:column;gap:8px;background:var(--card);
         border:1px solid var(--border);border-radius:11px;padding:8px 12px;
         flex:0 0 auto;margin-bottom:6px}
.trow{display:flex;align-items:center;gap:14px;min-height:28px;height:28px;overflow:hidden}
.slot{display:none;align-items:center;gap:14px;width:100%;overflow:hidden}
.slot.on{display:flex}
.tgroup{display:flex;align-items:center;gap:7px;flex:0 0 auto}
/* a group that does not apply to the current sub-mode is removed from the
   row rather than merely hidden, so the groups after it close up.  Safe
   here because the row height is fixed and nothing below it moves. */
.tgroup.hid{display:none}
.tlabel{font-size:10px;color:var(--text-muted);text-transform:uppercase;
        letter-spacing:.6px;font-weight:600;white-space:nowrap}
.rule{width:1px;height:20px;background:var(--border);flex:0 0 auto}
.pills{display:flex;background:var(--bg);border:1px solid var(--border);
       border-radius:20px;padding:2px}
.pill{border:none;background:transparent;color:var(--text-dim);font-size:11px;
      padding:4px 11px;border-radius:16px;cursor:pointer;white-space:nowrap;
      font-family:'Inter',sans-serif;font-weight:500}
.pill:hover{color:var(--text)}
.pill.active{background:var(--accent-glow);color:var(--accent)}
.tbtn{border:1px solid var(--border);background:var(--bg);color:var(--text-dim);
      font-size:11px;padding:4px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tbtn:hover{color:var(--text);border-color:var(--accent)}
.tbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-glow)}
.tsel{background:var(--bg);border:1px solid var(--border);color:var(--text);
      font-family:'JetBrains Mono',monospace;font-size:10.5px;
      padding:3px 6px;border-radius:8px;cursor:pointer;outline:none}
.spacer{margin-left:auto}

/* --- main split: canvas + side panel --- */
.main{flex:1 1 auto;min-height:0;display:flex;gap:8px}
.stage{flex:1 1 auto;min-width:0;position:relative;background:var(--canvas-bg);
       border:1px solid var(--border);border-radius:11px;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.chip{position:absolute;font-family:'JetBrains Mono',monospace;font-size:10px;
      padding:3px 9px;border-radius:8px;background:var(--card);
      border:1px solid var(--border);color:var(--text-dim);pointer-events:none;
      max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--accent)}
.chip.tl{top:8px;left:8px}
.chip.tr{top:8px;right:8px;color:var(--text)}
.chip.tc{top:8px;left:50%;transform:translateX(-50%);color:var(--amber);
         border-color:var(--amber);background:var(--card)}
.chip.tr2{top:34px;right:8px;color:var(--accent);border-color:var(--accent)}
.chip.br{bottom:8px;right:8px;max-width:min(64%,640px);white-space:normal;
         text-align:left;line-height:1.55;font-size:9.5px;color:var(--text-muted)}
.chip.br b{color:var(--accent)}

/* --- side panel --- */
.panel{flex:0 0 30%;min-width:290px;max-width:400px;display:flex;flex-direction:column;
       background:var(--card);border:1px solid var(--border);border-radius:11px;
       min-height:0;overflow:hidden}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:5px;
       border-bottom:1px solid var(--border);flex:0 0 auto}
.ptab{border:none;background:transparent;color:var(--text-dim);font-size:11px;
      padding:5px 0;border-radius:7px;cursor:pointer;font-weight:600}
.ptab:hover{color:var(--text)}
.ptab.active{background:var(--accent-glow);color:var(--accent)}
.panes{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px 14px}

.ptitle{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;
        letter-spacing:.9px;color:var(--text-muted);text-transform:uppercase;
        margin:12px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.ptitle:first-child{margin-top:0}
.ptitle span{font-size:12px}
/* Every section heading is a real <button>, so it gets keyboard focus and
   aria-expanded for free.  Folding only changes height inside .panes, which
   already scrolls — the canvas cannot move. */
button.ptitle{width:100%;background:none;border:none;
      border-bottom:1px solid var(--border);cursor:pointer;text-align:left;
      font-family:'Inter',sans-serif;color:var(--text-muted)}
button.ptitle:hover{color:var(--text-dim)}
button.ptitle .chev{margin-left:auto;font-size:10px;transition:transform .18s;
      color:var(--text-muted)}
button.ptitle.closed .chev{transform:rotate(-90deg)}
.pbody{overflow:hidden}
.pbody.closed{display:none}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:11.5px;color:var(--text-dim);padding:4px 0}
.kv b{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);
      font-weight:600;text-align:right}
.v-pos{color:var(--charge-pos)!important} .v-neg{color:var(--charge-neg)!important}
.v-amber{color:var(--amber)!important} .v-green{color:var(--green)!important}
.v-violet{color:var(--violet)!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.card{background:var(--bg);border:1px solid var(--border);border-radius:9px;
      padding:7px 8px;text-align:center}
.card .cl{font-size:10px;color:var(--text-muted);font-weight:700}
.card .cv{font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text)}
.card .cu{font-size:9px;color:var(--text-muted)}
.sl{margin:9px 0}
.sl label{display:flex;justify-content:space-between;align-items:center;font-size:11px;
          color:var(--text-dim);margin-bottom:4px;gap:8px}
.numwrap{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.numin{width:70px;background:var(--bg);border:1px solid var(--border);border-radius:7px;
       color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px;
       font-weight:600;text-align:right;padding:3px 6px;outline:none}
.numin:focus{border-color:var(--accent)}
.numu{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);
      min-width:12px;text-align:left}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.rowbtns{display:flex;gap:5px;margin:8px 0;flex-wrap:wrap}
.mini{border:1px solid var(--border);background:var(--bg);color:var(--text-dim);
      font-size:10.5px;padding:5px 10px;border-radius:7px;cursor:pointer}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.mini.on{color:var(--accent);border-color:var(--accent);background:var(--accent-glow)}
.mini:disabled{opacity:.4;cursor:default}
.note{font-size:10.5px;color:var(--text-muted);line-height:1.55;margin-top:9px;
      background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.note b{color:var(--text-dim)}
.note.warn{border-color:var(--amber);color:var(--text-dim)}
.note.warn b{color:var(--amber)}
.empty{font-size:11px;color:var(--text-muted);text-align:center;padding:16px 6px;font-style:italic}
.rule-list{font-size:11px;color:var(--text-dim);line-height:1.7;padding-left:16px;margin:4px 0}
.rule-list li{margin:2px 0}
.rule-list b{color:var(--text)}
.working{background:var(--bg);border:1px solid var(--border);border-radius:9px;
         padding:9px 11px;margin-top:4px}
.working .mrow{padding:3px 0;color:var(--text);font-size:12.5px;line-height:1.5}
.working .mrow + .mrow{border-top:1px solid var(--border)}
.working .mrow.plain{font-family:'JetBrains Mono',monospace;font-size:11.5px}
.working .katex{font-size:1.02em;color:var(--text)}
table.dt{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:10.5px}
table.dt th{color:var(--text-muted);font-weight:600;text-align:right;padding:4px 5px;
            border-bottom:1px solid var(--border);font-size:9.5px}
table.dt th:first-child{text-align:left}
table.dt td{padding:3px 5px;text-align:right;color:var(--text-dim);
            border-bottom:1px solid var(--border)}
table.dt td:first-child{text-align:left;color:var(--text)}
table.dt tr.hi td{background:var(--accent-glow);color:var(--accent)}
table.dt tr.pos td:first-child{color:var(--charge-pos)}
table.dt tr.neg td:first-child{color:var(--charge-neg)}
.swatch{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:middle;margin-right:5px}
.soon{background:var(--bg);border:1px dashed var(--border);border-radius:10px;
      padding:18px 14px;text-align:center;color:var(--text-muted);font-size:11.5px;line-height:1.7}
.soon b{color:var(--accent);display:block;font-size:13px;margin-bottom:6px}
</style>
</head>
<body>
<div class="container">

  <!-- ===== HEADER ZONE (45 px) ===== -->
  <div class="top-bar">
    <h1>⚡ <span>Electrostatics Lab</span> <span class="badge-top" id="badgeTop">v1.5.0</span></h1>
    <div class="top-right">

        <button class="mode-tab active" data-mode="sim">Simulate</button>
        <button class="mode-tab" data-mode="prac">Practice</button>
        <button class="mode-tab" data-mode="quiz">Quiz</button>
      </div>
      <select class="theme-select" id="themeSel">
        <option value="dark">🌙 Classic Dark</option>
        <option value="hausnight">⌂ HAUS Night</option>
        <option value="neon">🌃 Cyberpunk Neon</option>

  <!-- ===== SECTION TABS ===== -->
  <div class="sectabs" id="secTabs">
    <button class="sbtn active" data-sec="charging">🔬 Charging</button>
    <button class="sbtn" data-sec="fields">🌐 Fields</button>
    <button class="sbtn" data-sec="devices">⚡ Devices</button>
  </div>

  <!-- ===== TOOLBAR: two fixed rows ===== -->
  <div class="toolbar">
    <!-- row 1: context controls, one slot per section -->
    <div class="trow">
      <div class="slot on" id="slot-charging">
        <div class="tgroup"><span class="tlabel">Method</span>
          <div class="pills">
            <button class="pill active" data-method="friction">Friction</button>
            <button class="pill" data-method="induction">Induction</button>
          </div>
        </div>
        <div class="rule"></div>
        <div class="tgroup" id="grp-pair"><span class="tlabel">Materials</span>
          <select class="tsel" id="pairSel" title="Which rod is rubbed with which cloth."></select>
          <button class="tbtn" id="rubBtn" title="Rub the cloth along the rod once. Drag the cloth on the canvas to do it by hand.">✋ Rub once</button>
        </div>
        <div class="tgroup hid" id="grp-ind"><span class="tlabel">Rod</span>
          <div class="pills">
            <button class="pill" data-rodsign="1">+ charged</button>
            <button class="pill active" data-rodsign="-1">− charged</button>
          </div>
          <button class="tbtn" id="indPrev" title="Previous step">‹ Back</button>
          <button class="tbtn" id="indNext" title="Next step of the induction sequence">Next ›</button>
        </div>
      </div>

      <div class="slot" id="slot-fields">
        <div class="tgroup"><span class="tlabel">Study</span>
          <div class="pills">
            <button class="pill active" data-fmode="force">Force</button>
            <button class="pill" data-fmode="pattern">Field patterns</button>
            <button class="pill" data-fmode="plates">Parallel plates</button>
          </div>
        </div>
        <div class="rule"></div>
        <div class="tgroup" id="grp-pat"><span class="tlabel">Pattern</span>
          <select class="tsel" id="patSel" style="min-width:190px"></select>
        </div>
        <div class="tgroup" id="grp-fshow"><span class="tlabel">Overlay</span>
          <div class="pills">
            <button class="pill active" data-fshow="lines" title="Draw the electric field lines.">Field lines</button>
            <button class="pill" data-fshow="test" title="Drop a small positive test charge and watch which way the field pushes it.">Test charge</button>
          </div>
        </div>
      </div>

      <div class="slot" id="slot-devices">
        <div class="tgroup"><span class="tlabel">Device</span>
          <div class="pills">
            <button class="pill active" data-dev="electroscope">Electroscope</button>
            <button class="pill" data-dev="vandegraaff">Van de Graaff</button>
            <button class="pill" data-dev="sparks">Sparks &amp; Discharge</button>
            <button class="pill" data-dev="tesla">Tesla Coil</button>
          </div>
        </div>
        <div class="rule"></div>
        <div class="tgroup" id="grp-devact"></div>
      </div>
    </div>

    <!-- row 2: global controls, identical in every section -->
    <div class="trow">
      <div class="tgroup"><span class="tlabel">Show</span>
        <div class="pills">
          <button class="pill active" data-show="particles" title="Show the moving electrons and ions.">⚛ Particles</button>
          <button class="pill active" data-show="labels" title="Show the labels drawn on the apparatus.">🏷 Labels</button>
          <button class="pill active" data-show="hints" title="Show the instructions block in the corner of the canvas.">💬 Hints</button>
        </div>
      </div>
      <div class="rule"></div>
      <div class="tgroup"><span class="tlabel">Media</span>
        <button class="tbtn on" id="animBtn" title="Freeze or resume every animation. Frozen keeps the picture, it does not blank it.">▶ Animation</button>
        <button class="tbtn on" id="soundBtn" title="Master switch for every sound in the file.">🔊 Sound</button>
      </div>
      <div class="rule"></div>
      <div class="tgroup"><span class="tlabel">Speed</span>
        <div class="pills" id="speedPills">
          <button class="pill" data-speed="0.5">0.5×</button>
          <button class="pill active" data-speed="1">1×</button>
          <button class="pill" data-speed="2">2×</button>
        </div>
      </div>
      <div class="rule spacer"></div>
      <button class="tbtn" id="resetBtn" title="Resets only the section you are looking at — it does not switch tab.">↺ Reset</button>
    </div>
  </div>

  <!-- ===== MAIN: canvas + side panel ===== -->
  <div class="main">
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="chip tl" id="chipInfo"></div>
      <div class="chip tr" id="chipStatus"></div>
      <div class="chip tc" id="chipWarn" style="display:none"></div>
      <div class="chip tr2" id="chipZoom" style="display:none"></div>
      <div class="chip br" id="chipHint"></div>
    </div>

    <aside class="panel">
      <div class="ptabs">
        <button class="ptab active" id="ptab-data" data-ptab="data">📊 Data</button>
        <button class="ptab" id="ptab-info" data-ptab="info">📐 Info</button>
        <button class="ptab" id="ptab-answer" data-ptab="answer">✍️ Answer</button>
      </div>
      <div class="panes">

        <div id="pane-answer" style="display:none"></div>
      </div>
    </aside>
  </div>
</div>

<script>
/* ===== part_js_model.js ===== */
/* ============================================================
   ELECTROSTATICS MODEL — pure physics, no DOM.
   Everything the canvas draws is derived from these functions,
   so the picture can never disagree with the numbers.
   ============================================================ */

const E_CHARGE = 1.6e-19;          // coulomb, magnitude of the electron charge
const E_BREAK  = 3.0e6;            // V/m — dielectric strength of dry air
const K_E      = 8.99e9;           // N m² C⁻², used only for dome potentials

/* ---------- 1. TRIBOELECTRIC SERIES ----------
   Ordered most-positive first: the material HIGHER in this list gives up
   electrons and ends up POSITIVE; the lower one gains them and ends up
   NEGATIVE.  Fur and Acetate are not in the uploaded spec's list but are
   needed by three of its material pairs; they are placed where the UK
   school convention puts them — acetate is the standard "positive rod",
   polythene and ebonite the standard "negative rods". */
const TRIBO = [
  {key:'fur',       name:'Fur',          short:'Fur'},
  {key:'acetate',   name:'Acetate',      short:'Acetate'},
  {key:'glass',     name:'Glass',        short:'Glass'},
  {key:'nylon',     name:'Nylon',        short:'Nylon'},
  {key:'wool',      name:'Wool',         short:'Wool'},
  {key:'silk',      name:'Silk',         short:'Silk'},
  {key:'aluminium', name:'Aluminium',    short:'Alum.'},
  {key:'cotton',    name:'Cotton',       short:'Cotton'},
  {key:'paper',     name:'Paper',        short:'Paper'},
  {key:'polystyrene',name:'Polystyrene', short:'Polyst.'},
  {key:'polyethylene',name:'Polyethylene',short:'Polythene'},
  {key:'ebonite',   name:'Ebonite',      short:'Ebonite'},
  {key:'pvc',       name:'PVC',          short:'PVC'},
  {key:'teflon',    name:'Teflon',       short:'Teflon'}
];
const TRIBO_IDX = {};
TRIBO.forEach((m, i) => { TRIBO_IDX[m.key] = i; });

/* The five rod+cloth pairs the lab offers.  `rod` is the object held in the
   hand, `cloth` the material it is rubbed with. */
const PAIRS = {
  'glass+silk':        {rod:'glass',        cloth:'silk', label:'Glass + Silk'},
  'polyethylene+wool': {rod:'polyethylene', cloth:'wool', label:'Polythene + Wool'},
  'polystyrene+fur':   {rod:'polystyrene',  cloth:'fur',  label:'Polystyrene + Fur'},
  'acetate+wool':      {rod:'acetate',      cloth:'wool', label:'Acetate + Wool'},
  'ebonite+fur':       {rod:'ebonite',      cloth:'fur',  label:'Ebonite + Fur'}
};

/* Which way do the electrons go, and what charge does each object end with?
   Returns signs as +1 / −1 and the direction of electron transfer. */
function rubOutcome(pairKey){
  const p = PAIRS[pairKey];
  const ir = TRIBO_IDX[p.rod], ic = TRIBO_IDX[p.cloth];
  /* higher in the list (smaller index) = loses electrons = positive */
  const rodSign   = ir < ic ? +1 : -1;
  const clothSign = -rodSign;
  return {
    rod:p.rod, cloth:p.cloth, label:p.label,
    rodName:TRIBO[ir].name, clothName:TRIBO[ic].name,
    rodSign, clothSign,
    gap: Math.abs(ir - ic),
    /* electrons always travel TOWARDS the object that ends up negative */
    electronsTo: rodSign < 0 ? 'rod' : 'cloth'
  };
}

/* Charge is quantised: Q = n e.  Both directions, so the panel and the
   canvas always quote the same number. */
const chargeOf   = n => n * E_CHARGE;
const electronsOf = Q => Math.round(Math.abs(Q) / E_CHARGE);

/* ---------- 2. CHARGING BY INDUCTION ----------
   Five steps.  `net` is the conductor's total charge in units of the
   elementary charge count used on screen; `near`/`far` are the charge
   shown on each face.  `rodSign` is the sign of the charged rod. */
const INDUCTION_STEPS = ['neutral','approach','earth','unearth','removed'];

function inductionState(step, rodSign, n){
  n = (n === undefined) ? 6 : n;                 // electrons shown per face
  const i = INDUCTION_STEPS.indexOf(step);
  switch(step){
    case 'neutral':
      return {i, near:0, far:0, net:0, earthed:false, rodPresent:false,
              spread:true, flow:0,
              text:'The sphere is neutral — equal numbers of positive and negative charges, evenly spread.'};
    case 'approach':
      /* charges separate: the face nearest the rod attracts the OPPOSITE
         sign, the far face is left with the SAME sign as the rod.
         Total is still zero — nothing has entered or left. */
      return {i, near:-rodSign*n, far:+rodSign*n, net:0, earthed:false,
              rodPresent:true, spread:false, flow:0,
              text:'Charges separate. The near face is attracted to the rod; the far face is repelled. The sphere is still NEUTRAL overall.'};
    case 'earth':
      /* the far-face charge is neutralised through the earth link.
         A negative rod pushes electrons DOWN to earth (flow −1);
         a positive rod pulls electrons UP from earth (flow +1). */
      return {i, near:-rodSign*n, far:0, net:-rodSign*n, earthed:true,
              rodPresent:true, spread:false, flow:rodSign > 0 ? +1 : -1,
              text: rodSign > 0
                ? 'Earthed. Electrons flow UP from the ground to cancel the repelled positive charge.'
                : 'Earthed. The repelled electrons flow DOWN to the ground.'};
    case 'unearth':
      return {i, near:-rodSign*n, far:0, net:-rodSign*n, earthed:false,
              rodPresent:true, spread:false, flow:0,
              text:'Earth removed FIRST, while the rod is still there. The charge is now trapped on the sphere.'};
    case 'removed':
      return {i, near:-rodSign*n/2, far:-rodSign*n/2, net:-rodSign*n,
              earthed:false, rodPresent:false, spread:true, flow:0,
              text:'Rod removed. The charge spreads evenly — the sphere is left charged OPPOSITE to the rod.'};
  }
}

/* ---------- 3. ELECTRIC FIELD ----------
   Superposition of point charges.  `q` is in arbitrary units; only ratios
   and directions are ever shown, which is all IGCSE asks for. */
function fieldAt(x, y, charges){
  let ex = 0, ey = 0;
  for(let i = 0; i < charges.length; i++){
    const c = charges[i];
    const dx = x - c.x, dy = y - c.y;
    let r2 = dx*dx + dy*dy;
    if(r2 < 4) r2 = 4;                       // guard the singularity at r → 0
    const r = Math.sqrt(r2);
    const s = c.q / (r2 * r);                // q/r² along the unit vector
    ex += s*dx; ey += s*dy;
  }
  return {ex, ey, mag: Math.hypot(ex, ey)};
}

/* Field INSIDE a charged conductor is zero — the syllabus point that makes
   the charged-sphere pattern different from a bare point charge. */
function fieldAtShielded(x, y, charges, solids){
  if(solids){
    for(let i = 0; i < solids.length; i++){
      const s = solids[i];
      if(Math.hypot(x - s.x, y - s.y) < s.r) return {ex:0, ey:0, mag:0, inside:true};
    }
  }
  return fieldAt(x, y, charges);
}

/* ---------- 3b. PARALLEL PLATES ----------
   A plate is a real object extending OUT of the screen, so each element of
   it is a finite line SEGMENT of charge, not a point.  This matters: a row
   of point charges is a line charge (E ∝ 1/r) and gives a field between the
   plates that is 38% non-uniform — the exact opposite of the syllabus
   point.  The closed form for a segment of half-depth L is

        E_ρ  =  q · L / ( ρ · √(L² + ρ²) )

   which tends to the line-charge 1/ρ close up and to the point-charge
   2L/ρ² far away, so the same superposition machinery still applies. */
const PLATE_DEPTH = 500;                    // half-depth out of the screen, px
/* Default proportions matter physically, not just visually: the uniform
   region only extends to about one plate separation in from each edge, so
   a squat plate has almost no uniform region at all.  At hw 300 / sep 90
   (width ≈ 6.7 × the gap) the central HALF of the plate is uniform to
   within 3% and 1° of the normal — measured, not assumed. */
const PLATE_HW = 400, PLATE_SEP_DEF = 130, PLATE_N = 81;
function plateGeom(o){
  o = o || {};
  return {cx:o.cx || 0, cy:o.cy || 0,
          hw:o.hw || PLATE_HW, sep:o.sep || PLATE_SEP_DEF,
          n:o.n || PLATE_N, q:(o.q === undefined ? 1 : o.q),
          depth:o.depth || PLATE_DEPTH};
}
/* How far out from the centre the field may honestly be called uniform.
   MEASURED from the field itself rather than guessed with a rule of thumb,
   so the shaded "uniform field" band on the canvas can never claim more
   than the model actually delivers.  tol is the fractional departure from
   the centre magnitude that still counts as uniform. */
function plateUniformHalf(p, tol){
  tol = tol || 0.03;
  const c = plateFieldAt(p.cx, p.cy, p).mag;
  if(!(c > 0)) return 0;
  const yr = p.sep*0.34, step = Math.max(2, p.hw/60);
  let best = 0;
  for(let x = 0; x <= p.hw; x += step){
    let ok = true;
    for(let y = -yr; y <= yr + 1e-9; y += yr/2){
      const f = plateFieldAt(p.cx + x, p.cy + y, p);
      if(Math.abs(f.mag/c - 1) > tol) { ok = false; break; }
      if(Math.abs(Math.atan2(f.ey, f.ex)*180/Math.PI - 90) > 1.0) { ok = false; break; }
    }
    if(!ok) break;
    best = x;
  }
  return best;
}
function plateFieldAt(x, y, p){
  let ex = 0, ey = 0;
  const L = p.depth, yT = p.cy - p.sep/2, yB = p.cy + p.sep/2, qe = p.q/p.n;
  for(let i = 0; i < p.n; i++){
    const px = p.cx - p.hw + 2*p.hw*i/(p.n - 1);
    for(let s = 0; s < 2; s++){
      const py = s ? yB : yT, q = s ? -qe : +qe;
      const dx = x - px, dy = y - py;
      const rho = Math.max(Math.hypot(dx, dy), 1e-6);
      const m = q*L/(rho*Math.sqrt(L*L + rho*rho));
      ex += m*dx/rho; ey += m*dy/rho;
    }
  }
  return {ex, ey, mag: Math.hypot(ex, ey)};
}

/* Trace one field line from a seed point.  `F(x,y) -> {ex,ey,mag}` is any
   field function, so point charges and parallel plates share one tracer.
   dir = +1 follows the field (away from +), −1 runs against it (into a −).
   RK2 midpoint, so the line stays on the true field direction. */
function traceField(F, x0, y0, dir, box, opt){
  opt = opt || {};
  const step = opt.step || 5, maxSteps = opt.maxSteps || 900;
  const stops = opt.stops || [];
  const pts = [{x:x0, y:y0}];
  let x = x0, y = y0, ended = null;
  for(let i = 0; i < maxSteps; i++){
    const f1 = F(x, y);
    if(f1.mag < 1e-14){ ended = 'null'; break; }
    const hx = x + dir*step*0.5*f1.ex/f1.mag, hy = y + dir*step*0.5*f1.ey/f1.mag;
    const f2 = F(hx, hy);
    if(f2.mag < 1e-14){ ended = 'null'; break; }
    x += dir*step*f2.ex/f2.mag; y += dir*step*f2.ey/f2.mag;
    if(x < box.x0 || x > box.x1 || y < box.y0 || y > box.y1){
      /* land ON the boundary rather than a whole step past it, or a line can
         spill into a reserved band (a caption strip, say) by up to one step */
      pts.push({x:Math.max(box.x0, Math.min(box.x1, x)),
                y:Math.max(box.y0, Math.min(box.y1, y))});
      ended = 'edge'; break;
    }
    pts.push({x, y});
    for(let k = 0; k < stops.length; k++){
      const c = stops[k];
      if(Math.hypot(x - c.x, y - c.y) < (c.rad || 13)){
        ended = c.q > 0 ? 'pos' : 'neg'; break;
      }
    }
    if(ended) break;
  }
  return {pts, ended};
}

/* Lines per charge is proportional to |q| — that IS the "closer lines mean
   a stronger field" rule, so it must not be a free parameter. */
const LINES_PER_UNIT = 6;
const lineCount = q => Math.max(3, Math.round(LINES_PER_UNIT * Math.abs(q)));

/* Seed and trace every line for a configuration.  Lines are seeded on a
   small ring around each POSITIVE charge and run outwards; a net-negative
   configuration also seeds around each negative charge and runs inwards,
   so a lone − still shows its inward arrows. */
function fieldLines(charges, box, opt){
  opt = opt || {};
  const seedR = opt.seedR || 16;
  const F = (x, y) => fieldAt(x, y, charges);
  const out = [];
  const hasPos = charges.some(o => o.q > 0);
  for(const c of charges){
    const n = lineCount(c.q);
    const dir = c.q > 0 ? +1 : -1;
    const r = (c.rad || 0) + seedR;
    for(let i = 0; i < n; i++){
      const a = (i + 0.5) * 2*Math.PI/n + (opt.phase || 0);
      const t = traceField(F, c.x + r*Math.cos(a), c.y + r*Math.sin(a),
                           dir, box, Object.assign({stops:charges}, opt));
      if(t.pts.length <= 2) continue;
      /* A negative charge is ALSO seeded, traced backwards, so the field
         arriving at it from far away is drawn.  Without this the far side of
         the − in a dipole is blank, which looks like the field stops there.
         Lines that simply run back to the + are dropped — they are already
         drawn, from the + end. */
      if(c.q < 0 && hasPos && t.ended !== 'edge') continue;
      out.push(Object.assign({}, t, {from:c, dir}));
    }
  }
  return out;
}

/* Field lines between plates: seeded evenly along the + plate, so equal
   spacing on screen IS the statement that the field is uniform. */
function plateLines(p, box, opt){
  opt = opt || {};
  const n = opt.n || 11;
  const F = (x, y) => plateFieldAt(x, y, p);
  /* Seed a little way off the plate, not on its surface.  Right against a
     row of discrete elements the nearest one dominates and drags the line
     sideways — a pure discretisation artefact that shows up as a visible
     wiggle.  The ripple dies as exp(−2π·d/spacing), so one element spacing
     of clearance kills it. */
  const spacing = 2*p.hw/(p.n - 1);
  const off = opt.seedOff === undefined ? Math.max(4, spacing*1.1) : opt.seedOff;
  const yT = p.cy - p.sep/2, yB = p.cy + p.sep/2, out = [];
  for(let i = 0; i < n; i++){
    const x = p.cx - p.hw + 2*p.hw*i/(n - 1);
    const t = traceField(F, x, yT + off, +1, box,
                         Object.assign({step:3, maxSteps:400}, opt));
    /* A field line ENDS on the negative plate.  Without this the trace runs
       straight through the gap and off into the fringe field underneath,
       where it curves wildly — which then looks like the uniform field
       between the plates is bent. */
    /* The line stalls a pixel or two short of the plate: immediately below a
       negative element the field points back UP at it, so the integrator
       oscillates on the surface.  That IS the line terminating on the plate,
       so allow a small tolerance rather than demanding it cross y = yB. */
    const reach = yB - 3;
    let k = -1;
    for(let j = 1; j < t.pts.length; j++)
      if(t.pts[j].y >= reach){ k = j + 1; break; }
    if(k > 0){
      t.pts = t.pts.slice(0, k);
      t.pts.push({x:t.pts[k-1].x, y:yB});     // finish it cleanly on the metal
      t.ended = 'plate';
    }
    /* start it ON the + plate too, so the line touches both surfaces */
    t.pts.unshift({x, y:yT});
    if(t.pts.length > 2) out.push(Object.assign(t, {x0:x}));
  }
  return out;
}

/* The fringe field OUTSIDE the capacitor: lines that leave past the ends and
   loop round from the + plate to the − plate through open air.  Seeded from
   the top surface of the + plate near its ends. */
function plateFringeLines(p, box, opt){
  opt = opt || {};
  const F = (x, y) => plateFieldAt(x, y, p);
  const yT = p.cy - p.sep/2, out = [];
  /* Seeded close to the ends only.  Seeding further in produces enormous
     loops that sweep the whole canvas — correct physics, but it reads as
     decoration rather than as the fringe at the plate edge. */
  const seeds = opt.seeds || [1.01, 1.06, 1.13];
  const yB = p.cy + p.sep/2;
  for(const s of seeds) for(const sgn of [-1, +1]){
    const t = traceField(F, p.cx + sgn*s*p.hw, yT - Math.max(5, p.sep*0.10),
                         +1, box, Object.assign({step:4, maxSteps:500}, opt));
    /* it curls round the end and lands on the OUTSIDE of the − plate */
    let k = -1;
    for(let j = 4; j < t.pts.length; j++)
      if(t.pts[j].y >= yB + 10){ k = j + 1; break; }
    if(k > 0){ t.pts = t.pts.slice(0, k); t.ended = 'plate'; }
    if(t.pts.length > 3) out.push(t);
  }
  return out;
}

/* ---------- 4. FORCE BETWEEN TWO CHARGES ----------
   IGCSE is qualitative: F ∝ Q₁Q₂/r².  Everything is reported as a RATIO to
   a stated reference case, never in newtons, so no number on screen is
   beyond the syllabus. */
const F_REF_Q = 1, F_REF_R = 200;            // +1 and +1, 200 logical px apart
function forceBetween(q1, q2, r){
  const rr = Math.max(r, 24);                // charges cannot overlap
  const f  = Math.abs(q1*q2)/(rr*rr);
  const f0 = Math.abs(F_REF_Q*F_REF_Q)/(F_REF_R*F_REF_R);
  return {
    ratio: f/f0,
    attract: q1*q2 < 0,
    /* +1 means the two are pushed apart */
    sign: q1*q2 > 0 ? +1 : -1
  };
}

/* ---------- 5. SPARKS AND DISCHARGE ----------
   Air breaks down at 3 kV/mm, so a gap of d millimetres needs 3000·d volts.
   This is the same rule behind the spec's own practice answer of 9 kV
   across 3 mm. */
const breakdownVolts = gap_mm => E_BREAK * (gap_mm/1000);
const sparkLength_mm = V => Math.max(0, V) / (E_BREAK/1000);
const canSpark = (V, gap_mm) => V >= breakdownVolts(gap_mm);

/* A charged dome behaves as a sphere: V = kQ/R outside it. */
const domeVolts  = (Q, R_m) => K_E*Q/Math.max(R_m, 1e-3);
const domeCharge = (V, R_m) => V*Math.max(R_m, 1e-3)/K_E;

/* ---------- 6. ELECTROSCOPE ----------
   The leaf lifts because it carries the SAME sign as the stem and is
   repelled by it.  Deflection saturates — a real leaf cannot pass the
   stem, and it cannot exceed the horizontal. */
const LEAF_MAX_DEG = 42, LEAF_MIN_Q = 0.6;
/* `qMin` is the charge needed before the electrostatic repulsion can lift the
   leaf against its own weight.  Real gold leaf behaves this way, and without
   it a rod parked at the far side of the bench still held the leaf a few
   degrees open, which reads as a broken instrument. */
function leafAngle(charge, full, qMin){
  const lo = (qMin === undefined) ? LEAF_MIN_Q : qMin;
  const hi = full || 10;
  const f = (Math.abs(charge) - lo)/(hi - lo);
  if(!(f > 0)) return 0;
  return LEAF_MAX_DEG * Math.sqrt(Math.min(1, f));
}

/* ---------- 7. FORMATTING ---------- */
function sciQ(n){                            // n electrons -> "Q = 1.6 × 10⁻¹⁹ C"
  const Q = chargeOf(n);
  if(n === 0) return '0 C';
  const ex = Math.floor(Math.log10(Q));
  const m  = Q/Math.pow(10, ex);
  return m.toFixed(1) + ' × 10' + supNum(ex) + ' C';
}
function supNum(x){
  const S = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴',
             '5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  return String(x).split('').map(c => S[c] || c).join('');
}
const signStr = s => s > 0 ? '+' : s < 0 ? '−' : '0';


/* ===== part_js_app.js ===== */
/* ============================================================
   APP CORE — state, view transform, drawing primitives, panels
   ============================================================ */
const $ = id => document.getElementById(id);
const CV = $('cv'), CX = CV.getContext('2d');

/* One fixed logical space, letterboxed into whatever the window gives us,
   so every coordinate in the file means the same thing everywhere. */
const W = 1200, H = 675;
/* Screen-pixel band kept clear at the top of the canvas — about three lines
   of chip text — so the info / status / warning chips never sit on top of
   the apparatus.  It is in SCREEN px, not logical px, because the chips are
   DOM elements whose size does not scale with the drawing. */
const TOP_PAD = 62;

const S = {
  mode:'sim',                 // sim | prac | quiz
  sec:'charging',             // charging | fields | devices
  /* --- charging --- */
  method:'friction',
  pair:'glass+silk',
  rubs:0, rubT:0, rubbing:false, rubX:0,
  indStep:'neutral', rodSign:-1, indPlay:false, indT:0,
  /* --- fields --- */
  fmode:'force',
  pattern:'dipole',
  fshow:'lines',
  qA:{x:430, y:318, q:2}, qB:{x:770, y:318, q:-2},
  plateSep:PLATE_SEP_DEF, plateV:6,   // one source of truth, shared with Reset
  test:null, testTrail:[],
  /* --- devices --- */
  dev:'electroscope',
  esCharge:0, esRod:-1, esRodX:0, esWasTouching:false, esFlash:0,
  esEarthed:false, esLeaf:0,
  vgOn:false, vgQ:0, vgBelt:0, vgGap:60, vgFlash:0, vgSparkPts:null, vgHair:false,
  vgView:'outside',            // outside | inside (cutaway)
  spGap:4, spV:6000, spFlash:0, spPts:null, spArmed:false,
  teslaOn:false, teslaT:0, teslaArcs:[],
  /* --- global --- */
  show:{particles:true, labels:true, hints:true},
  anim:true, sound:true, speed:1,
  theme:'dark', panelTab:'data',
  zoom:{k:1, ox:0, oy:0, panning:false, px:0, py:0},
  t:0, warn:''
};

/* ---------- palette read from CSS so a theme change is just draw() ---------- */
let PAL = {};
function readPalette(){
  const cs = getComputedStyle(document.body);
  const g = n => cs.getPropertyValue(n).trim();
  PAL = {
    text:g('--text'), dim:g('--text-dim'), muted:g('--text-muted'),
    accent:g('--accent'), border:g('--border'), card:g('--card'),
    bg:g('--canvas-bg'), grid:g('--grid'),
    green:g('--green'), rose:g('--rose'), violet:g('--violet'),
    amber:g('--amber'), blue:g('--blue'), orange:g('--orange'),
    pos:g('--charge-pos'), neg:g('--charge-neg'), neutral:g('--neutral'),
    line:g('--field-line'), spark:g('--spark'), electron:g('--electron'),
    ground:g('--ground'), metal:g('--metal'), metalHi:g('--metal-hi'),
    insul:g('--insul'), glass:g('--glass'), silk:g('--silk'), wool:g('--wool')
  };
}
function setTheme(name){
  document.body.className = name === 'dark' ? '' : 'theme-' + name;
  S.theme = name; readPalette(); draw(); updatePanel();
}

/* ---------- view transform: letterbox, then magnifier ---------- */
const VT = {s:1, ox:0, oy:0};
function resize(){
  const r = CV.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  CV.width = Math.max(1, Math.round(r.width*dpr));
  CV.height = Math.max(1, Math.round(r.height*dpr));
  /* fit the drawing into what is left BELOW the chip band, then pin it there
     rather than centring it vertically */
  const s = Math.min(r.width/W, Math.max(40, r.height - TOP_PAD)/H);
  VT.s = s; VT.ox = (r.width - W*s)/2; VT.oy = TOP_PAD;
  VT.dpr = dpr; VT.cw = r.width; VT.ch = r.height;
  draw();
}
/* Screen -> logical, inverting the WHOLE chain, so a zoomed canvas can never
   desynchronise a click from what is drawn. */
function toLogical(e){
  const r = CV.getBoundingClientRect();
  const sx = (e.clientX - r.left - VT.ox)/VT.s;
  const sy = (e.clientY - r.top  - VT.oy)/VT.s;
  const z = S.zoom;
  return {x:(sx - z.ox)/z.k, y:(sy - z.oy)/z.k};
}
function applyView(){
  CX.setTransform(VT.dpr, 0, 0, VT.dpr, 0, 0);
  CX.clearRect(0, 0, VT.cw, VT.ch);
  CX.translate(VT.ox, VT.oy);
  CX.scale(VT.s, VT.s);
  CX.translate(S.zoom.ox, S.zoom.oy);
  CX.scale(S.zoom.k, S.zoom.k);
}
function clampPan(){
  const z = S.zoom;
  z.ox = Math.min(0, Math.max(W*(1 - z.k), z.ox));
  z.oy = Math.min(0, Math.max(H*(1 - z.k), z.oy));
}
function setZoom(k, L){
  const z = S.zoom;
  if(k <= 1){ z.k = 1; z.ox = 0; z.oy = 0; }
  else{
    const old = z.k;
    z.ox = z.ox + old*L.x - k*L.x;
    z.oy = z.oy + old*L.y - k*L.y;
    z.k = k; clampPan();
  }
  $('chipZoom').style.display = z.k > 1 ? 'block' : 'none';
  $('chipZoom').textContent = '🔍 ×' + z.k;
  draw();
}
const resetZoom = () => setZoom(1);

/* ---------- drawing primitives ---------- */
const TAU = Math.PI*2;
function line(x1, y1, x2, y2){ CX.beginPath(); CX.moveTo(x1, y1); CX.lineTo(x2, y2); CX.stroke(); }
function rr(x, y, w, h, r){
  CX.beginPath();
  CX.moveTo(x+r, y); CX.arcTo(x+w, y, x+w, y+h, r); CX.arcTo(x+w, y+h, x, y+h, r);
  CX.arcTo(x, y+h, x, y, r); CX.arcTo(x, y, x+w, y, r); CX.closePath();
}
function txt(s, x, y, opt){
  opt = opt || {};
  CX.font = (opt.weight || 600) + ' ' + (opt.size || 13) + 'px ' + (opt.mono ? "'JetBrains Mono',monospace" : "'Inter',sans-serif");
  CX.fillStyle = opt.col || PAL.text;
  CX.textAlign = opt.align || 'center';
  CX.textBaseline = opt.base || 'middle';
  if(opt.plate){                                   // translucent backing plate
    const w = CX.measureText(s).width + 10, h = (opt.size || 13) + 7;
    const px = opt.align === 'left' ? x-5 : opt.align === 'right' ? x-w+5 : x-w/2;
    CX.save(); CX.globalAlpha = .72; CX.fillStyle = PAL.card;
    rr(px, y-h/2, w, h, 5); CX.fill(); CX.restore();
    CX.fillStyle = opt.col || PAL.text;
  }
  CX.fillText(s, x, y);
}
/* metal with a highlight strip — used by every conductor in the file */
function metalFill(x, y, w, h, vert){
  const g = vert ? CX.createLinearGradient(x, y, x+w, y) : CX.createLinearGradient(x, y, x, y+h);
  g.addColorStop(0, PAL.metal); g.addColorStop(.35, PAL.metalHi);
  g.addColorStop(.55, PAL.metal); g.addColorStop(1, PAL.metal);
  return g;
}
function arrow(x1, y1, x2, y2, opt){
  opt = opt || {};
  const hd = opt.head || 10, lw = opt.lw || 2.4;
  CX.strokeStyle = opt.col || PAL.accent; CX.fillStyle = opt.col || PAL.accent;
  CX.lineWidth = lw; CX.lineCap = 'round';
  const a = Math.atan2(y2-y1, x2-x1), L = Math.hypot(x2-x1, y2-y1);
  if(L < 1) return;
  const bx = x2 - hd*0.9*Math.cos(a), by = y2 - hd*0.9*Math.sin(a);
  CX.beginPath(); CX.moveTo(x1, y1); CX.lineTo(bx, by); CX.stroke();
  CX.beginPath(); CX.moveTo(x2, y2);
  CX.lineTo(x2 - hd*Math.cos(a-0.38), y2 - hd*Math.sin(a-0.38));
  CX.lineTo(x2 - hd*Math.cos(a+0.38), y2 - hd*Math.sin(a+0.38));
  CX.closePath(); CX.fill();
}
/* one arrowhead sitting on a path, used along field lines */
function headAt(p, q, col, sz){
  const a = Math.atan2(q.y-p.y, q.x-p.x), s = sz || 7;
  CX.fillStyle = col; CX.beginPath();
  CX.moveTo(q.x, q.y);
  CX.lineTo(q.x - s*Math.cos(a-0.42), q.y - s*Math.sin(a-0.42));
  CX.lineTo(q.x - s*Math.cos(a+0.42), q.y - s*Math.sin(a+0.42));
  CX.closePath(); CX.fill();
}
/* a + or − charge glyph.  Red = positive, blue = negative, in every theme. */
function chargeDot(x, y, sign, r, opt){
  opt = opt || {};
  const col = sign > 0 ? PAL.pos : sign < 0 ? PAL.neg : PAL.neutral;
  if(opt.glow){
    const g = CX.createRadialGradient(x, y, r*0.4, x, y, r*2.6);
    g.addColorStop(0, col + '55'); g.addColorStop(1, col + '00');
    CX.fillStyle = g; CX.beginPath(); CX.arc(x, y, r*2.6, 0, TAU); CX.fill();
  }
  CX.fillStyle = col; CX.beginPath(); CX.arc(x, y, r, 0, TAU); CX.fill();
  CX.strokeStyle = 'rgba(0,0,0,.32)'; CX.lineWidth = Math.max(1, r*0.11);
  CX.beginPath(); CX.arc(x, y, r, 0, TAU); CX.stroke();
  CX.strokeStyle = '#fff'; CX.lineWidth = Math.max(1.6, r*0.20); CX.lineCap = 'round';
  const a = r*0.52;
  line(x-a, y, x+a, y);
  if(sign > 0) line(x, y-a, x, y+a);
}
/* a free electron: small, blue, always labelled with its minus sign */
function electron(x, y, r){
  r = r || 5.5;
  CX.fillStyle = PAL.electron; CX.beginPath(); CX.arc(x, y, r, 0, TAU); CX.fill();
  CX.strokeStyle = 'rgba(255,255,255,.85)'; CX.lineWidth = 1.4; CX.lineCap = 'round';
  line(x - r*0.5, y, x + r*0.5, y);
}
/* BS-style earth symbol: three shrinking bars */
function earthSym(x, y, s, col){
  CX.strokeStyle = col || PAL.ground; CX.lineWidth = 2.6; CX.lineCap = 'round';
  for(let i = 0; i < 3; i++){
    const w = s*(1 - i*0.3);
    line(x - w, y + i*s*0.34, x + w, y + i*s*0.34);
  }
}
/* battery / d.c. supply symbol, BS 3939 */
function cellSym(x, y, s, flip){
  CX.strokeStyle = PAL.text; CX.lineWidth = 2.4; CX.lineCap = 'butt';
  const f = flip ? -1 : 1;
  line(x - s*0.18*f, y - s*0.62, x - s*0.18*f, y + s*0.62);   // long = +
  line(x + s*0.18*f, y - s*0.30, x + s*0.18*f, y + s*0.30);   // short = −
}
/* a jagged spark path from a to b, seeded so it is stable within one flash */
function sparkPath(a, b, seed, amp){
  const n = 9, pts = [], dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx, dy) || 1;
  const nx = -dy/L, ny = dx/L;
  for(let i = 0; i <= n; i++){
    const u = i/n;
    const w = (i === 0 || i === n) ? 0 : Math.sin(seed*13.7 + i*2.399)*(amp || L*0.09)*Math.sin(Math.PI*u);
    pts.push({x:a.x + dx*u + nx*w, y:a.y + dy*u + ny*w});
  }
  return pts;
}
function drawSpark(pts, alpha, wide){
  if(!pts || pts.length < 2) return;
  CX.save();
  CX.globalAlpha = alpha;
  CX.lineJoin = 'round'; CX.lineCap = 'round';
  CX.strokeStyle = PAL.spark; CX.shadowColor = PAL.spark; CX.shadowBlur = 18;
  for(const lw of [(wide || 6), (wide || 6)*0.42]){
    CX.lineWidth = lw;
    CX.strokeStyle = lw > (wide || 6)*0.5 ? PAL.spark + '66' : '#ffffff';
    CX.beginPath(); CX.moveTo(pts[0].x, pts[0].y);
    for(let i = 1; i < pts.length; i++) CX.lineTo(pts[i].x, pts[i].y);
    CX.stroke();
  }
  CX.restore();
}
/* insulating stand — every charged conductor in the lab sits on one */
function standSym(x, yTop, h, w){
  w = w || 46;
  CX.fillStyle = PAL.insul;
  CX.beginPath();
  CX.moveTo(x - w*0.22, yTop); CX.lineTo(x + w*0.22, yTop);
  CX.lineTo(x + w*0.5, yTop + h); CX.lineTo(x - w*0.5, yTop + h);
  CX.closePath(); CX.fill();
  CX.fillStyle = PAL.border;
  rr(x - w*0.72, yTop + h, w*1.44, 9, 3); CX.fill();
}
function benchLine(y){
  CX.strokeStyle = PAL.border; CX.lineWidth = 2;
  line(60, y, W-60, y);
  CX.globalAlpha = .35;
  for(let x = 60; x < W-60; x += 13){ line(x, y, x-7, y+9); }
  CX.globalAlpha = 1;
}

/* ---------- sound: ONE gate, so the master switch silences everything ---------- */
let AC = null;
function beep(freq, dur, type, vol){
  if(!S.sound) return;                     // the single master gate
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol === undefined ? 0.05 : vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (dur || 0.08));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (dur || 0.08));
  }catch(e){}
}
const clickSnd = () => beep(880, 0.05, 'square', 0.03);
function crackle(){
  if(!S.sound) return;
  for(let i = 0; i < 5; i++)
    setTimeout(() => beep(1200 + Math.random()*2600, 0.045, 'sawtooth', 0.055), i*32);
}

/* ---------- chips ---------- */

/* ---------- animation loop ---------- */
let last = 0;
function tick(now){
  let dt = (now - last)/1000;
  last = now;
  /* clamp both ends: the first rAF timestamp can pre-date `last`, and a
     backgrounded tab returns a huge dt */
  if(!(dt > 0)) dt = 0;
  if(dt > 0.1) dt = 0.1;
  if(!S.anim) dt = 0;                       // freeze TIME, not the rendering
  dt *= S.speed;
  S.t += dt;
  stepSim(dt);
  draw();
  if(dt > 0) patchPanel();   // keep the panel numbers with the canvas
  requestAnimationFrame(tick);
}

/* ---------- panel plumbing ---------- */
const sectionTitle = (ic, t) => '<div class="ptitle"><span>' + ic + '</span>' + t + '</div>';
const cardHTML = (l, v, u, id) => '<div class="card"><div class="cl">' + l + '</div><div class="cv"' +

const kvHTML = (k, v, cls, id) => '<div class="kv"><span>' + k + '</span><b' +

    '<input type="range" id="' + id + '" min="' + R.min + '" max="' + R.max +
    '" step="' + R.step + '" value="' + val + '"></div>';
}
function bindSlider(id, R, apply){
  const s = $(id), b = $(id + 'Num');
  if(!s) return;
  const set = (v, from) => {
    v = Math.max(R.min, Math.min(R.max, +v));
    if(!isFinite(v)) return;
    if(from !== 'range') s.value = v;
    if(from !== 'num') b.value = +v.toFixed(2);
    apply(v);
    liveUpdate();
  };
  s.oninput = () => set(+s.value, 'range');
  b.oninput = () => { if(b.value !== '' && b.value !== '-') set(+b.value, 'num'); };
  b.onblur  = () => set(+b.value || R.min, 'blur');
}
