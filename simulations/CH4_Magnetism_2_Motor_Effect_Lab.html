    return PHYS.dedupeCurves(seeds.map(s => PHYS.traceField(fieldFn_pair, s.x, s.y,
      { step: 5, maxSteps: 460, closeDist: 8, bounds, solids })));
  }
  /* the action–reaction force pair, from the same forceDirOnCurrent() every
     other section uses (spec rule 15) */
  function pairForces() {
    const g = pairGeom();
    const b1at2 = PHYS.wireB(g.w2.x, g.w2.y, g.w1.x, g.w1.y, F.I1, F.dir1);
    const b2at1 = PHYS.wireB(g.w1.x, g.w1.y, g.w2.x, g.w2.y, F.I2, F.dir2);
    return {
      on1: PHYS.forceDirOnCurrent(F.dir1, b2at1.x, b2at1.y),
      on2: PHYS.forceDirOnCurrent(F.dir2, b1at2.x, b1at2.y)
    };
  }
  const forceStatus = () => sameDirection() ? 'The two wires attract' : 'The two wires repel';

  function drawPairBird(ctx) {
    const g = pairGeom();
    for (const c of pairCurves())
      paintLine(ctx, c.pts, { col: PAL.fieldLine, lw: 1.6, heads: c.closed ? 3 : 2, headSize: 6, alpha: .92 });

    wireGlyph(ctx, g.w1.x, g.w1.y, 16, F.dir1);
    wireGlyph(ctx, g.w2.x, g.w2.y, 16, F.dir2);

    const f = pairForces(), FL = 54, ay = g.y + 78;
    arrow(ctx, g.w1.x, ay, g.w1.x + f.on1.x * FL, ay + f.on1.y * FL, { col: PAL.force, lw: 3.4, head: 12 });
    arrow(ctx, g.w2.x, ay, g.w2.x + f.on2.x * FL, ay + f.on2.y * FL, { col: PAL.force, lw: 3.4, head: 12 });

    if (S.show.labels) {
      // each force named under its own arrow
      const FLab = PHYS.fmtF(PHYS.parallelWiresForcePerLength(F.I1, F.I2, F.gap)) + '/m';
      txt(ctx, 'force on wire 1', g.w1.x, ay + 28,
        { size: 10.5, col: PAL.force, weight: 700, plate: true });
      txt(ctx, FLab, g.w1.x, ay + 46,
        { size: 10, col: PAL.textDim, weight: 600, plate: true });
      txt(ctx, 'force on wire 2', g.w2.x, ay + 28,
        { size: 10.5, col: PAL.force, weight: 700, plate: true });
      txt(ctx, FLab, g.w2.x, ay + 46,
        { size: 10, col: PAL.textDim, weight: 600, plate: true });
      txt(ctx, 'I₁', g.w1.x, g.y - 34, { size: 12, col: PAL.current, weight: 800, plate: true });
      txt(ctx, 'I₂', g.w2.x, g.y - 34, { size: 12, col: PAL.current, weight: 800, plate: true });
      txt(ctx, forceStatus(), g.cx, 118,
        { col: sameDirection() ? PAL.force : PAL.rose, size: 14, weight: 800, plate: true });
      txt(ctx, 'the forces are a Newton’s-3rd-law PAIR — equal, opposite, one on each wire',
        g.cx, 142, { col: PAL.textDim, size: 10.5, weight: 600, plate: true });
    }
    drawFreeCompass(ctx);
    drawGraphInset(ctx);
  }

  function drawPairSide(ctx) {
    const g = pairGeom();
    const curves = pairCurves();
    const half = which => {
      for (const c of curves) {
        const seg = []; let run = [];
        for (const p of c.pts) {
          const isFar = p.y <= g.y;
          if ((which === 'far') === isFar) run.push(projectSide(p));
          else if (run.length) { seg.push(run); run = []; }
        }
        if (run.length) seg.push(run);
        for (const s of seg)
          paintLine(ctx, s, {
            col: PAL.fieldLine,
            lw: which === 'far' ? 1.4 : 1.9,
            alpha: which === 'far' ? 0.48 : 0.95,
            dash: which === 'far' ? [5, 4] : null,
            heads: s.length > 16 ? 1 : 0, headSize: 6
          });
      }
    };
    half('far');
    // the same conductor rod the single-wire view uses, so both studies read
    // as the same material
    drawConductorNetwork(ctx, [g.w1, g.w2].map(w => ({
      w: 13, pts: [{ x: w.x, y: WIRE_TOP }, { x: w.x, y: WIRE_BOT }]
    })));
    half('near');
    /* current-direction arrows only — no supply is drawn (spec 4.1.c), so
       the flow animation runs along each WIRE rather than round a circuit */
    for (const [w, dir, name] of [[g.w1, F.dir1, 'I₁'], [g.w2, F.dir2, 'I₂']]) {
      const ax = w.x;
      if (dir > 0) arrow(ctx, ax, WIRE_BOT - 40, ax, WIRE_TOP + 40, { col: PAL.current, lw: 3.4, head: 12 });
      else arrow(ctx, ax, WIRE_TOP + 40, ax, WIRE_BOT - 40, { col: PAL.current, lw: 3.4, head: 12 });
      if (S.show.flow) {
        const p = dir > 0
          ? [{ x: ax, y: WIRE_BOT }, { x: ax, y: WIRE_TOP }]
          : [{ x: ax, y: WIRE_TOP }, { x: ax, y: WIRE_BOT }];
        drawFlowAlong(ctx, p, F.flowPhase, { spacing: 56, size: 2.8 });
      }
      if (S.show.labels) {
        txt(ctx, name, ax, WIRE_TOP - 34,
          { col: PAL.current, size: 14, weight: 800, plate: true });
        txt(ctx, dir > 0 ? 'current UP' : 'current DOWN', ax, WIRE_TOP - 14,
          { col: PAL.current, size: 10.5, weight: 700, plate: true });
      }
    }
    const f = pairForces(), FL = 58;
    arrow(ctx, g.w1.x, g.y, g.w1.x + f.on1.x * FL, g.y + f.on1.y * FL, { col: PAL.force, lw: 3.6, head: 13 });
    arrow(ctx, g.w2.x, g.y, g.w2.x + f.on2.x * FL, g.y + f.on2.y * FL, { col: PAL.force, lw: 3.6, head: 13 });
    if (S.show.labels) {
      const FLab = PHYS.fmtF(PHYS.parallelWiresForcePerLength(F.I1, F.I2, F.gap)) + '/m';
      txt(ctx, 'F₁', g.w1.x + f.on1.x * FL * 0.5, g.y - 24,
        { col: PAL.force, size: 14, weight: 800, plate: true });
      txt(ctx, 'F₂', g.w2.x + f.on2.x * FL * 0.5, g.y - 24,
        { col: PAL.force, size: 14, weight: 800, plate: true });
      txt(ctx, 'F₁ = F₂ = ' + FLab + '  (equal and opposite)', g.cx, g.y + 96,
        { col: PAL.force, size: 11, weight: 700, plate: true });
    }

    // separation d, dimensioned
    const dy = WIRE_BOT + 34;
    line(ctx, g.w1.x, dy, g.w2.x, dy, { col: PAL.textDim, lw: 1 });
    line(ctx, g.w1.x, dy - 6, g.w1.x, dy + 6, { col: PAL.textDim, lw: 1 });
    line(ctx, g.w2.x, dy - 6, g.w2.x, dy + 6, { col: PAL.textDim, lw: 1 });
    txt(ctx, 'd = ' + fmtLen(F.gap), g.cx, dy + 18, { col: PAL.textDim, size: 11.5, weight: 600 });
    if (S.show.labels)
      txt(ctx, forceStatus(), g.cx, 118,
        { col: sameDirection() ? PAL.force : PAL.rose, size: 14, weight: 800, plate: true });
  }

  const fmtLen = px => (px * PHYS.M_PER_PX * 100).toFixed(1) + ' cm';

  /* F/L against d — the A-Level-friendly extension (spec 4.1.d) */
  const GRAPH_W = 320, GRAPH_H = 176;
  const graphBox = () => ({ x: F.graphPos.x - GRAPH_W / 2, y: F.graphPos.y - GRAPH_H / 2,
                            w: GRAPH_W, h: GRAPH_H });
  const graphHit = lp => {
    if (F.study !== 'pair' || F.view !== 'bird' || !S.show.hints) return false;
    const b = graphBox();
    return lp.x > b.x && lp.x < b.x + b.w && lp.y > b.y && lp.y < b.y + b.h;
  };
  function drawGraphInset(ctx) {
    /* Gated on the 💬 Hints toggle, and draggable, so it can be moved off
       whatever it happens to be covering rather than being a fixed obstacle. */
    if (!S.show.hints) return;
    const b = graphBox();
    const gx = b.x, gy = b.y, gw = GRAPH_W, gh = GRAPH_H;
    ctx.save();
    rr(ctx, gx, gy, gw, gh, 8);
    ctx.fillStyle = PAL.bg; ctx.fill();
    ctx.strokeStyle = PAL.border; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();

    const x0 = gx + 46, y0 = gy + gh - 32, x1 = gx + gw - 16, y1 = gy + 32;
    txt(ctx, 'F/L against d', gx + gw / 2, gy + 15, { col: PAL.text, size: 11, weight: 700 });
    txt(ctx, 'I₁ = ' + F.I1.toFixed(1) + ' A,  I₂ = ' + F.I2.toFixed(1) + ' A',
      gx + gw / 2, gy + 29, { col: PAL.textMuted, size: 9.5 });
    line(ctx, x0, y0, x1, y0, { col: PAL.textDim, lw: 1.2 });
    line(ctx, x0, y0, x0, y1, { col: PAL.textDim, lw: 1.2 });
    txt(ctx, 'd / cm', (x0 + x1) / 2, y0 + 17, { col: PAL.textMuted, size: 9.5 });
    ctx.save(); ctx.translate(gx + 14, (y0 + y1) / 2); ctx.rotate(-Math.PI / 2);
    txt(ctx, 'F/L', 0, 0, { col: PAL.textMuted, size: 9.5 }); ctx.restore();

    const dMin = 70, dMax = 380;
    const fAt = d => PHYS.parallelWiresForcePerLength(F.I1, F.I2, d);
    const fMax = fAt(dMin) || 1;
    const px = d => x0 + (d - dMin) / (dMax - dMin) * (x1 - x0);
    const py = f => y0 - Math.min(1, f / fMax) * (y0 - y1);

    /* "nice" ticks — 1/2/2.5/5/10 × 10^n steps, not the raw data span */
    const spanCm = (dMax - dMin) * PHYS.M_PER_PX * 100;
    const raw = spanCm / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].reduce((b, m) =>
      Math.abs(m * mag - raw) < Math.abs(b - raw) ? m * mag : b, mag);
    for (let v = Math.ceil(dMin * PHYS.M_PER_PX * 100 / step) * step;
         v <= dMax * PHYS.M_PER_PX * 100; v += step) {
      const X = px(v / (PHYS.M_PER_PX * 100));
      line(ctx, X, y0, X, y0 + 4, { col: PAL.textDim, lw: 1 });
      txt(ctx, String(Math.round(v)), X, y0 + 12, { col: PAL.textMuted, size: 8.5 });
    }

    ctx.save(); ctx.strokeStyle = PAL.blue; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) {
      const d = dMin + (dMax - dMin) * i / 60;
      const X = px(d), Y = py(fAt(d));
      i === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
    }
    ctx.stroke(); ctx.restore();

    const cx = px(Math.max(dMin, Math.min(dMax, F.gap))), cy = py(fAt(F.gap));
    ctx.save();
    ctx.strokeStyle = PAL.amber; ctx.globalAlpha = .4; ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, y0); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = PAL.amber;
    ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, TAU); ctx.fill();
    ctx.restore();
    txt(ctx, 'F ∝ 1/d', x1 - 8, y1 + 10, { col: PAL.blue, size: 10, align: 'right', weight: 700 });
    // drag affordance, matching the grip-rule card
    ctx.save(); ctx.fillStyle = PAL.textMuted; ctx.globalAlpha = .7;
    for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) {
      ctx.beginPath(); ctx.arc(gx + 12 + c * 5, gy + 11 + r * 5, 1.4, 0, TAU); ctx.fill();
    }
    ctx.restore();
    txt(ctx, 'drag', gx + gw - 18, gy + 14, { col: PAL.textMuted, size: 8.5 });
  }

  /* ======================= chips ======================= */
  function updateChips() {
    let info, status, warn = '', hint;
    if (F.study === 'wire') {
      info = '<b>Single Wire</b><br>Oersted: a current makes a field';
      status = F.switchOn ? 'Switch: CLOSED · I = <b>' + F.I.toFixed(1) + ' A</b>' : '<b>Switch: OPEN</b>';
      hint = F.view === 'side'
        ? 'Hover the pointer on the switch for 3 s to toggle it.<br>The rings are the field, seen edge-on.'
        : 'The same rings, seen face-on from above.<br>Drag the plotting compass — and the grip-rule card.';
      if (!F.switchOn) warn = '';
    } else {
      info = '<b>2 Parallel Wires</b><br>' + forceStatus();
      status = 'F/L = <b>' + PHYS.fmtF(PHYS.parallelWiresForcePerLength(F.I1, F.I2, F.gap)) + '/m</b>';
      hint = 'Reverse either wire to swap attract ⇄ repel.<br>Sliders are in the 📊 Data tab.';
    }
    setChips(info, status, warn, hint);
  }

  /* ======================= update ======================= */
  function update(dt, dtReal) {
    // the flow marks travel at a fixed visual rate, gated on the switch, the
    // Animation master and the ⚡ Current flow toggle
    if (F.switchOn && S.show.flow) F.flowPhase = (F.flowPhase + dt * 0.14) % 1;

    // the 3-second hover timer uses REAL time, so the speed pills cannot
    // make a "3 second" dwell mean something other than three seconds
    if (F.study === 'wire' && F.view === 'side')
      hoverSwitch.update(S.pointer.on && switchHit(S.pointer), dtReal || dt);
    else hoverSwitch.update(false, dtReal || dt);

    if (F.study === 'wire' && F.view === 'side') {
      sideCompassPositions().forEach((p, i) => {
        const c = { ang: F.sideAngs[i], w: F._sideW[i] };
        stepCompass(c, sideCompassAngle(p.a), F.switchOn, dt);
        F.sideAngs[i] = c.ang; F._sideW[i] = c.w;
      });
    }
    if (F.study === 'wire' && F.view === 'bird') {
      for (let i = 0; i < BIRD_N; i++) {
        const a = i * TAU / BIRD_N;
        const b = fieldFn_single(WIRE_X + Math.cos(a) * COMPASS_R, PLANE_Y + Math.sin(a) * COMPASS_R);
        const c = { ang: F.birdAngs[i], w: F._birdW[i] };
        stepCompass(c, Math.atan2(b.y, b.x), b.mag > 1e-30, dt);
        F.birdAngs[i] = c.ang; F._birdW[i] = c.w;
      }
    }
    const bf = F.study === 'wire' ? fieldFn_single(F.freeCompass.x, F.freeCompass.y)
                                  : fieldFn_pair(F.freeCompass.x, F.freeCompass.y);
    const cf = { ang: F.freeAng, w: F._freeW };
    stepCompass(cf, Math.atan2(bf.y, bf.x), bf.mag > 1e-30, dt);
    F.freeAng = cf.ang; F._freeW = cf.w;
  }

  /* ======================= pointer ======================= */
  /* the grip-rule card is draggable, exactly like the plotting compass —
     tested FIRST because it sits on top of everything else */
  const gripHit = lp => F.gripOn && F.study === 'wire' &&
    lp.x > F.gripPos.x - GRIP_W / 2 && lp.x < F.gripPos.x + GRIP_W / 2 &&
    lp.y > F.gripPos.y - 26 && lp.y < F.gripPos.y - 26 + GRIP_H;
  function pointerDown(lp) {
    if (graphHit(lp)) {
      F.dragging = 'graph';
      F._graphOff = { x: lp.x - F.graphPos.x, y: lp.y - F.graphPos.y };
      return true;
    }
    if (gripHit(lp)) {
      F.dragging = 'grip';
      F._gripOff = { x: lp.x - F.gripPos.x, y: lp.y - F.gripPos.y };
      return true;
    }
    if (S.show.compass && PHYS.hyp(lp.x - F.freeCompass.x, lp.y - F.freeCompass.y) < 28) {
      F.dragging = 'compass'; return true;
    }
    return false;
  }
  function pointerMove(lp) {
    if (F.dragging === 'graph') {
      F.graphPos.x = Math.max(GRAPH_W / 2 + 6, Math.min(W - GRAPH_W / 2 - 6, lp.x - F._graphOff.x));
      F.graphPos.y = Math.max(GRAPH_H / 2 + 6, Math.min(H - GRAPH_H / 2 - 6, lp.y - F._graphOff.y));
      return true;
    }
    if (F.dragging === 'grip') {
      F.gripPos.x = Math.max(GRIP_W / 2 + 6, Math.min(W - GRIP_W / 2 - 6, lp.x - F._gripOff.x));
      F.gripPos.y = Math.max(32, Math.min(H - GRIP_H + 20, lp.y - F._gripOff.y));
      return true;
    }
    if (F.dragging !== 'compass') return false;
    F.freeCompass.x = Math.max(26, Math.min(W - 26, lp.x));
    F.freeCompass.y = Math.max(26, Math.min(H - 26, lp.y));
    return true;
  }
  function pointerUp() { F.dragging = null; }

  /* ======================= panels ======================= */
  function paneData() {
    let h = sectionTitle('🎛️', 'CONTROLS');
    if (F.study === 'wire') {
      h += '<div class="note">The switch starts <b>CLOSED</b>, so the field is already on. ' +
        'Open it again — and close it — either with the <b>⏻ Switch</b> button, or by ' +
        '<b>hovering the pointer on the switch in the Side view for 3 seconds</b>. ' +
        'Watch every compass swing as it changes.</div>';
      h += sliderHTML('fI', 'Current I', F.I.toFixed(1), { min: 0.5, max: 10, step: 0.1, value: F.I, unit: ' A' });
    } else {
      h += sliderHTML('fI1', 'Current I₁', F.I1.toFixed(1), { min: 0.5, max: 10, step: 0.1, value: F.I1, unit: ' A' });
      h += sliderHTML('fI2', 'Current I₂', F.I2.toFixed(1), { min: 0.5, max: 10, step: 0.1, value: F.I2, unit: ' A' });
      h += sliderHTML('fGap', 'Separation d', fmtLen(F.gap).replace(' cm', ''),
        { min: 90, max: 380, step: 2, value: F.gap, unit: ' cm' });
      h += '<div class="rowbtns">' +
        '<button class="mini' + (F.dir1 > 0 ? '' : ' on') + '" id="btnD1">⇄ Wire 1: ' + (F.dir1 > 0 ? 'UP' : 'DOWN') + '</button>' +
        '<button class="mini' + (F.dir2 > 0 ? '' : ' on') + '" id="btnD2">⇄ Wire 2: ' + (F.dir2 > 0 ? 'UP' : 'DOWN') + '</button></div>';
    }
    h += sectionTitle('📊', 'READINGS');
    if (F.study === 'wire') {
      h += kvHTML('Switch', '—', '', 'kSw');
      h += kvHTML('Current', '—', 'v-cur', 'kCur');
      h += kvHTML('Current direction', '—', 'v-cur', 'kDir');
      h += kvHTML('Measured at', '—', '', 'kWhere');
      h += kvHTML('B there', '—', 'v-amber', 'kB');
      h += kvHTML('Field direction there', '—', '', 'kBear');
    } else {
      h += '<div class="grid2">' + cardHTML('I₁', F.I1.toFixed(1), 'A', 'kI1') +
        cardHTML('I₂', F.I2.toFixed(1), 'A', 'kI2') + '</div>';
      h += kvHTML('Separation d', '—', '', 'kGap');
      h += kvHTML('Force per metre F/L', '—', 'v-force', 'kFpl');
      h += kvHTML('Result', '—', '', 'kAct');
      h += sectionTitle('🧮', 'WORKING');
      h += '<div class="working">' +
        mathLine('\\dfrac{F}{L}=\\dfrac{\\mu_0 I_1 I_2}{2\\pi d}', 'F/L = μ₀ I₁ I₂ / (2π d)') +
        '<div id="wkPair" style="font-size:11.5px;color:var(--text-dim);margin-top:4px"></div>' +
        '<div style="font-size:11px;color:var(--text-muted);margin-top:6px">' +
        'μ₀ = 4π×10⁻⁷ T·m·A⁻¹ (given)</div></div>';
    }
    $('pane-data').innerHTML = h;
    if (F.study === 'wire') bindSlider('fI', v => F.I = v, ' A', v => v.toFixed(1));
    else {
      bindSlider('fI1', v => F.I1 = v, ' A', v => v.toFixed(1));
      bindSlider('fI2', v => F.I2 = v, ' A', v => v.toFixed(1));
      bindSlider('fGap', v => F.gap = v, ' cm', v => (v * PHYS.M_PER_PX * 100).toFixed(1));
      const b1 = $('btnD1'), b2 = $('btnD2');
      if (b1) b1.onclick = () => { F.dir1 *= -1; clickSnd(); paneData(); };
      if (b2) b2.onclick = () => { F.dir2 *= -1; clickSnd(); paneData(); };
    }
    patchData();
  }
  /* live values are PATCHED into existing spans, never re-rendered — a full
     rebuild would yank focus out of a slider mid-drag, and a readout built
     once at panel-open time goes stale and contradicts the canvas */
  function patchData() {
    const set = (id, v) => { const e = $(id); if (e) e.textContent = v; };
    if (F.study === 'wire') {
      set('kSw', F.switchOn ? 'Switch: CLOSED' : 'Switch: OPEN');
      set('kCur', F.switchOn ? F.I.toFixed(2) + ' A' : '0 A');
      set('kDir', !F.switchOn ? '—' : (F.revI > 0 ? 'UP the wire  (⊙ from above)' : 'DOWN the wire  (⊗ from above)'));
      /* Which compass the reading refers to depends on the view: the Side
         view has no free compass (see supportsCompass()), so it reports the
         ring the three fixed compasses sit on instead. A readout naming a
         compass that is not on screen is exactly the stale-readout bug. */
      const onRing = F.view === 'side';
      const rr2 = RING_RADII[5] || 190;
      const b = onRing ? fieldFn_single(WIRE_X + rr2, PLANE_Y)
                       : fieldFn_single(F.freeCompass.x, F.freeCompass.y);
      const has = b.mag > 1e-30;
      set('kWhere', onRing
        ? 'the ring of compasses (' + (rr2 * PHYS.M_PER_PX * 100).toFixed(1) + ' cm out)'
        : 'the plotting compass');
      set('kB', has ? PHYS.fmtB(b.mag) : '0 T');
      set('kBear', has ? ((Math.atan2(b.y, b.x) * 180 / Math.PI + 360) % 360).toFixed(0) + '°' : 'no field here');
    } else {
      set('kI1', F.I1.toFixed(1)); set('kI2', F.I2.toFixed(1));
      set('kGap', fmtLen(F.gap));
      const FL = PHYS.parallelWiresForcePerLength(F.I1, F.I2, F.gap);
      set('kFpl', PHYS.fmtF(FL) + '/m');
      const e = $('kAct');
      if (e) { e.textContent = forceStatus(); e.className = 'v ' + (sameDirection() ? 'v-force' : ''); }
      const wk = $('wkPair');
      if (wk) wk.textContent = 'F/L = (4π×10⁻⁷ × ' + F.I1.toFixed(1) + ' × ' + F.I2.toFixed(1) +
        ') / (2π × ' + (F.gap * PHYS.M_PER_PX).toFixed(3) + ' m) = ' + PHYS.fmtF(FL) + '/m';
    }
  }

  function paneInfo() {
    $('pane-info').innerHTML =
      '<div class="collapsible" id="f1"><button class="collapsible-hdr">Oersted’s discovery <span class="chev">▾</span></button>' +
      '<div class="pbody">In 1820 Hans Christian Oersted noticed a compass needle near a wire deflect ' +
      'the moment current flowed, and swing back when it stopped. A current-carrying wire ' +
      '<b>makes a magnetic field around it</b> — the first evidence that electricity and magnetism ' +
      'are one subject.</div></div>' +
      '<div class="collapsible" id="f2"><button class="collapsible-hdr">Field-line rules <span class="chev">▾</span></button>' +
      '<div class="pbody"><ul>' +
      '<li>Around a straight wire the lines are <b>complete circles</b> centred on the wire.</li>' +
      '<li>They are <b>closer together near the wire</b> — that is where the field is strongest (B ∝ 1/r).</li>' +
      '<li>They lie in the plane at <b>right angles</b> to the wire.</li>' +
      '<li>Field lines <b>never cross</b>.</li></ul></div></div>' +
      '<div class="collapsible" id="f3"><button class="collapsible-hdr">Right-hand grip rule <span class="chev">▾</span></button>' +
      '<div class="pbody">Grip the wire with your <b>RIGHT</b> hand, <b>thumb along the conventional ' +
      'current</b>. Your curled fingers then point the way the field goes. Your LEFT hand gives ' +
      'exactly the opposite answer, so naming the hand matters.</div></div>' +
      '<div class="collapsible" id="f4"><button class="collapsible-hdr">Two parallel wires <span class="chev">▾</span></button>' +
      '<div class="pbody">Each wire sits in the other’s field, so each feels a force.<ul>' +
      '<li>Currents in the <b>same</b> direction → the wires <b>attract</b>.</li>' +
      '<li>Currents in <b>opposite</b> directions → they <b>repel</b>.</li></ul>' +
      'The two forces are a <b>Newton’s-third-law pair</b>: equal, opposite, one on each wire — which ' +
      'is why two arrows are always drawn, never one. Their size is F/L = μ₀I₁I₂/2πd, so halving the ' +
      'separation doubles the force.</div></div>';
    makeCollapsible($('pane-info'));
  }
  function paneAnswer() {
    $('pane-answer').innerHTML =
      '<div class="placeholder"><div class="big">✍️</div>Practice &amp; Quiz arrive in v1.1</div>';
  }

  /* ======================= toolbar ======================= */
  function bindToolbar() {
    document.querySelectorAll('[data-act="fStudy"]').forEach(b => b.onclick = () => {
      F.study = b.dataset.val; clickSnd(); syncToolbar(); refreshPanels();
    });
    document.querySelectorAll('[data-act="fView"]').forEach(b => b.onclick = () => {
      // the panel's wording depends on the view, so rebuild it too
      F.view = b.dataset.val; clickSnd(); syncToolbar(); refreshPanels();
    });
    $('btnFRev').onclick = () => { F.revI *= -1; clickSnd(); };
    $('btnFSwitch').onclick = () => { F.switchOn = !F.switchOn; clunk(); syncToolbar(); };
    $('btnFGrip').onclick = () => { F.gripOn = !F.gripOn; clickSnd(); syncToolbar(); };
    $('btnPairRev1').onclick = () => { F.dir1 *= -1; clickSnd(); refreshPanels(); };
    $('btnPairRev2').onclick = () => { F.dir2 *= -1; clickSnd(); refreshPanels(); };
  }
  /* Every one-off toggle's LABEL and .active class is rewritten HERE, not only
     inside its own click handler — Reset changes the model without going
     through that handler, so a button would otherwise keep claiming a state
     the model has already left. */
  function syncToolbar() {
    document.querySelectorAll('[data-act="fStudy"]').forEach(b => b.classList.toggle('active', b.dataset.val === F.study));
    document.querySelectorAll('[data-act="fView"]').forEach(b => b.classList.toggle('active', b.dataset.val === F.view));
    const isWire = F.study === 'wire';
    $('grpFRev').classList.toggle('hid', !isWire);
    $('grpFSwitch').classList.toggle('hid', !isWire);
    $('grpFGrip').classList.toggle('hid', !isWire);
    $('grpPairRev').classList.toggle('hid', isWire);
    $('btnFSwitch').textContent = '⏻ Switch: ' + (F.switchOn ? 'CLOSED' : 'OPEN');
    $('btnFSwitch').classList.toggle('active', F.switchOn);
    $('btnFGrip').classList.toggle('active', F.gripOn);
    syncFlowLock(); syncCompassLock();
    $('btnPairRev1').classList.toggle('active', F.dir1 < 0);
    $('btnPairRev2').classList.toggle('active', F.dir2 < 0);
  }

  /* Flow is meaningful in both studies now: the single wire animates round
     its whole circuit, the pair animates along each wire (the pair
     deliberately draws no supply, spec 4.1.c, so there is no loop to follow). */
  const supportsFlow = () => true;

  /* WHICH VIEWS HAVE A COMPASS AT ALL.
     A flat compass face can only show a field that lies IN the plane of the
     screen. In the edge-on Side views the field is largely perpendicular to
     the screen, and a freely-placed compass there was reading fieldFn at its
     RAW canvas position — but in that view the position is a PROJECTED
     coordinate, not a real point in the field plane, so the needle angle it
     produced was simply wrong. The free compass is therefore gone from both
     Side views. The single wire's Side view keeps its three FIXED compasses,
     which sit on the drawn ellipse and take their angle from the correctly
     projected tangent; the pair's Side view has none at all, so the 🧭
     Compass toggle is locked there. */
  const supportsCompass = () => !(F.study === 'pair' && F.view === 'side');

  SEC.field = {
    S: F, reset, draw, update, pointerDown, pointerMove, pointerUp, supportsFlow, supportsCompass,
    paneData, patchData, paneInfo, paneAnswer, bindToolbar, syncToolbar,
    // test hooks (spec rule 12)
    fieldFn_single, fieldFn_pair, wireGeom, pairGeom, pairForces, forceStatus,
    singleCurves, pairCurves, projectSide, hoverSwitch, switchHit,
    circuitPath, termPlus, termMinus, gripHit, GRIP_W, GRIP_H, conductorRuns,
    sideCompassPositions, sideCompassAngle,
    graphHit, graphBox, GRAPH_W, GRAPH_H,
    RING_RADII, SQUASH, PLANE_Y, WIRE_X, WIRE_TOP, WIRE_BOT,
    circuit: { RAIL_L, RAIL_R, RAIL_Y, SW_X, CELL_X }
  };
})();
/* ============================================================================
   SECTION 2 — 🌀 Electromagnet
   A coil makes field lines like a bar magnet; the right-hand grip rule finds N.

   ---------------------------------------------------------------------------
   THE TWO VIEWS (spec 3.1 / 4.2) — both are SIDE views, there is no bird-eye
   ---------------------------------------------------------------------------
     Side view (winding) — the coil drawn as real loops of wire, with leads
                           running to a d.c. supply.
     Side view (cutaway) — the SAME coil cut through the sagittal plane: the
                           front half of every turn is removed, so the wire's
                           cross-section shows at the top and bottom of each
                           turn (⊙ and ⊗) and the current's path round the coil
                           can be read directly.
   Both views use ONE geometry function and ONE traced field, so they are the
   same object with the near half of the winding hidden or shown.

   WHICH END IS N is measured from the on-axis field, never tabulated, so
   reversing the current flips the labels, the glyphs and the grip-rule card
   together and they cannot disagree.
   ========================================================================== */
(function () {

  const E = {
    study: 'sol',          // loop | sol | pair
    view: 'wind',          // wind | cut
    revI: 1, I: 3, N: 8, core: false,
    gap: 340, pairRev2: false,
    grip: false, dragging: null,
    compass: { x: 1010, y: 300 }, cAng: 0, _cw: 0
  };

  /* ---------------- single source of geometry ---------------- */
  const CY = 330;
  function geom() {
    if (E.study === 'loop') return { cx: 580, cy: CY, len: 0, r: 96, turns: 1, spacing: 0 };
    if (E.study === 'sol') return { cx: 580, cy: CY, len: 300, r: 76, turns: E.N, spacing: 300 / (E.N - 1) };
    const half = E.gap / 2;
    return { cy: CY, len: 190, r: 54, turns: 6,
             a: { cx: 580 - half }, b: { cx: 580 + half } };
  }
  const coilCentres = () => {
    const g = geom();
    return E.study === 'pair' ? [g.a.cx, g.b.cx] : [g.cx];
  };

  /* the physical model: real wires, so the drawn field is a true
     superposition rather than a bar-magnet cartoon drawn by hand */
  function wiresFor() {
    const g = geom();
    if (E.study === 'pair') {
      return PHYS.solenoidWires(g.a.cx, g.cy, g.len, g.r, g.turns, E.I, E.revI)
        .concat(PHYS.solenoidWires(g.b.cx, g.cy, g.len, g.r, g.turns, E.I,
          E.pairRev2 ? -E.revI : E.revI));
    }
    return PHYS.solenoidWires(g.cx, g.cy, g.len, g.r, g.turns, E.I, E.revI);
  }
  const fieldFn = (x, y) => PHYS.wiresB(x, y, wiresFor());
  /* B emerges from a north pole, so a positive on-axis Bx means N is the
     right-hand end. Measured, never hardcoded. */
  function polesOf(cx) {
    const b = PHYS.wiresB(cx, CY, wiresFor());
    return b.x >= 0 ? { right: 'N', left: 'S' } : { right: 'S', left: 'N' };
  }

  function reset() {
    E.study = 'sol'; E.view = 'wind'; E.revI = 1; E.I = 3; E.N = 8;
    E.core = false; E.gap = 340; E.pairRev2 = false; E.grip = false;
    E.dragging = null; E.compass = { x: 1010, y: 300 }; E.cAng = 0; E._cw = 0;
    resetZoom();
  }
  reset();

  /* ======================= DRAW ======================= */
  function draw(ctx) {
    const g = geom();
    if (E.study === 'pair') drawPair(ctx, g); else drawSingle(ctx, g);
    if (E.grip && E.study !== 'pair') drawGripCard(ctx);
    drawCompass2(ctx);
    updateChips();
  }

  /* ---------- field lines, shared by both views ----------
     Seeded on the axis INSIDE the coil, at equal spacing. Seeding just
     outside the winding instead puts every seed where one turn's own field
     overwhelms everything else, so each line closes into a little circle
     round a single wire and the solenoid's uniform interior — the whole point
     of the section — comes out completely empty. Equal SPACING (not equal
     flux) because inside a solenoid the field really is nearly uniform, while
     the flux integral is dominated by the 1/r singularity at each wire. */
  let _fcache = { key: '', curves: null };

  function traceFieldLines(coils, r) {
    /* E.I is deliberately NOT in the key: every wire carries the same I, so
       changing it scales |B| everywhere and leaves the DIRECTION field — and
       therefore every traced line — identical. */
    const key = [E.study, E.revI, E.N, Math.round(E.gap), E.pairRev2 ? 1 : 0,
      coils.map(c => Math.round(c)).join(','), Math.round(r)].join('|');
    if (_fcache.key === key) return _fcache.curves;

    /* A trace may only ever stop OFF the canvas. The old box (±330 px of the
       coil, y 96…620) cut lines dead in mid-air, and a family of arcs each
       chopped at an invisible rectangle reads exactly as "the field lines are
       broken". Running to just past the canvas edge instead makes every line
       either close on itself or leave the picture. */
    const bounds = { x0: -80, y0: -80, x1: W + 80, y1: H + 80 };

    const seeds = [];
    const inner = Math.max(6, r * 0.5), NI = 5;
    for (const cx of coils)
      for (let i = 0; i < NI; i++)
        seeds.push({ x: cx, y: CY + (-1 + 2 * i / (NI - 1)) * inner });

    /* Outer seeds are measured from the coil SURFACE towards the canvas edge.
       At fixed multiples of r (2 r, 3 r, 4.2 r) the outer two landed at
       y = −89 and y = 26 for the 1-turn loop — outside the trace box, so they
       returned a single point and drew nothing, leaving the outer field bare. */
    const mid = coils.reduce((a, b) => a + b, 0) / coils.length;
    const avail = Math.min(CY, H - CY) - 26;
    for (const f of [0.26, 0.52, 0.82]) {
      const off = r + Math.max(0, avail - r) * f;
      seeds.push({ x: mid, y: CY - off });
      seeds.push({ x: mid, y: CY + off });
    }

    const curves = PHYS.dedupeCurves(seeds.map(s => PHYS.traceField(fieldFn, s.x, s.y,
      { step: 5, maxSteps: 1500, closeDist: 10, bounds })));
    _fcache = { key, curves };
    return curves;
  }

  function paintField(ctx, coils, r) {
    for (const c of traceFieldLines(coils, r))
      paintLine(ctx, c.pts, { col: PAL.fieldLine, lw: 1.6, heads: 3, headSize: 6, alpha: .9 });
  }

  /* ---------- the field, restored THROUGH the winding ----------
     The near half of each turn is opaque and is painted after the field, so
     every interior line was being chopped into short segments — one break per
     turn — and the uniform interior, which is the whole point of a solenoid,
     read as a row of dashes. Repainting the field faintly, clipped to the
     winding itself, puts the lines back together while keeping the wire
     visibly in front of them. */
  function paintFieldThroughWinding(ctx, coils, r, len) {
    if (E._noThrough) return;          // test hook: renders the pre-fix picture
    const rx = 24, pad = 16;
    ctx.save();
    ctx.beginPath();
    for (const cx of coils)
      ctx.rect(cx - len / 2 - rx, CY - r - pad, len + rx * 2, (r + pad) * 2);
    ctx.clip();
    for (const c of traceFieldLines(coils, r))
      paintLine(ctx, c.pts, { col: PAL.fieldLine, lw: 1.6, heads: 0, alpha: .5 });
    ctx.restore();
  }

  /* ---------- one coil (1 Turn or Solenoid) ---------- */
  function drawSingle(ctx, g) {
    if (E.study === 'sol' && E.core) drawCore(ctx, g);
    /* DEPTH ORDER, the same rule the single-wire side view uses: the FAR half
       of the winding first (lighter and translucent, so it reads as being
       behind), then the field lines OVER it, then the NEAR half at full
       strength on top. Drawing the whole winding in one pass made the wire
       sit in front of field lines that are physically behind it. */
    drawWinding(ctx, g.cx, g, 'far');
    paintField(ctx, [g.cx], g.r);
    drawWinding(ctx, g.cx, g, 'near');
    paintFieldThroughWinding(ctx, [g.cx], g.r, g.len);

    /* The poles sit ON the coil's own axis, level with the ends they name.
       Up at the top corner they read as labels for the corner of a box; on the
       axis they sit exactly where the field leaves and re-enters the coil. */
    const p = polesOf(g.cx);
    const half = Math.max(g.len / 2, g.r * 0.55);
    poleLabel(ctx, g.cx + half + 68, CY - 10, p.right);
    poleLabel(ctx, g.cx - half - 68, CY - 10, p.left);

    /* Leads to a d.c. supply belong to the SOLENOID study only. The 1-Turn
       study is about the loop itself, so nothing protrudes from it. */
    if (E.view === 'wind' && E.study === 'sol') drawSupply(ctx, g);

    if (S.show.labels) {
      /* The field now runs to the edge of the canvas, so the caption band is
         no longer a field-free strip. The captions carry their own plate and
         are drawn last, so a line may pass behind them but never through the
         text. */
      txt(ctx, E.study === 'loop'
        ? 'ONE turn — a weak field, but already the same SHAPE as a bar magnet'
        : E.N + ' turns — the field inside is strong and nearly uniform; outside it is a bar magnet',
        600, 44, { col: PAL.textDim, size: 12, weight: 600, plate: true });
      txt(ctx, E.view === 'cut'
        ? 'cut through the middle — the front half of every turn has been removed'
        : 'the coil as it really is wound',
        600, 64, { col: PAL.textMuted, size: 10.5, plate: true });
    }
  }

  /* ---------- the winding ----------
     Winding view: every turn drawn as a complete loop of wire.
     Cutaway view: only the BACK half of each turn, so the cross-section of
     the wire at the top and bottom of each turn is exposed and its current
     direction can be read as ⊙ / ⊗. */
  function drawWinding(ctx, cx, g, phase) {
    const n = Math.max(1, Math.round(g.turns));
    const half = g.len / 2;
    const rx = g.len === 0 ? 22 : Math.min(20, Math.max(9, g.spacing * 0.42));
    const cut = E.view === 'cut';
    const turnX = i => (n === 1 ? cx : cx - half + (i / (n - 1)) * g.len);

    /* ---------- FAR phase: the former, and the half of every turn that runs
       round the BACK. Lighter and translucent so it reads as being behind the
       field lines that are about to be drawn over it. ---------- */
    if (phase === 'far') {
      ctx.save();
      ctx.globalAlpha = cut ? .5 : .34;
      ctx.fillStyle = cut ? PAL.insul : '#2a1b10';
      rr(ctx, cx - half - rx, CY - g.r, g.len + rx * 2, g.r * 2, 8); ctx.fill();
      ctx.restore();
      if (cut) {
        ctx.save(); ctx.strokeStyle = PAL.border; ctx.lineWidth = 1;
        ctx.setLineDash([6, 4]);
        rr(ctx, cx - half - rx, CY - g.r, g.len + rx * 2, g.r * 2, 8); ctx.stroke();
        ctx.restore();
      }
      for (let i = 0; i < n; i++) {
        ctx.save();
        ctx.strokeStyle = PAL.wire;
        ctx.lineWidth = cut ? 5 : 6;
        ctx.globalAlpha = cut ? .32 : .34;      // lighter AND see-through
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.ellipse(turnX(i), CY, rx, g.r, 0, -Math.PI / 2, Math.PI / 2, true);
        ctx.stroke(); ctx.restore();
      }
      return;
    }

    /* ---------- NEAR phase: the half of every turn nearest the viewer, at
       full strength and on top of the field lines, plus the wire's
       cross-sections where it cuts this plane. ---------- */
    if (!cut) {
      for (let i = 0; i < n; i++) {
        ctx.save();
        ctx.strokeStyle = PAL.wire; ctx.lineWidth = 7; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.ellipse(turnX(i), CY, rx, g.r, 0, -Math.PI / 2, Math.PI / 2, false);
        ctx.stroke(); ctx.restore();
      }
    }
    for (let i = 0; i < n; i++) {
      const x = turnX(i);
      wireGlyph(ctx, x, CY - g.r, cut ? 12 : 10, E.revI);
      wireGlyph(ctx, x, CY + g.r, cut ? 12 : 10, -E.revI);
    }
    if (cut && S.show.labels && n > 1) {
      txt(ctx, E.revI > 0 ? 'top of every turn: current OUT of the page'
        : 'top of every turn: current INTO the page',
        cx, CY - g.r - 30, { col: PAL.current, size: 10, weight: 700, plate: true });
      txt(ctx, E.revI > 0 ? 'bottom: current INTO the page' : 'bottom: current OUT of the page',
        cx, CY + g.r + 32, { col: PAL.current, size: 10, weight: 700, plate: true });
    }
    // dimension the length — n = N/L needs L to mean something
    if (S.show.labels && g.len > 0 && E.study === 'sol') {
      const dy = CY + g.r + (E.view === 'cut' ? 56 : 48);
      line(ctx, cx - half, dy, cx + half, dy, { col: PAL.textDim, lw: 1 });
      line(ctx, cx - half, dy - 5, cx - half, dy + 5, { col: PAL.textDim, lw: 1 });
      line(ctx, cx + half, dy - 5, cx + half, dy + 5, { col: PAL.textDim, lw: 1 });
      txt(ctx, 'L = ' + (g.len * PHYS.M_PER_PX * 100).toFixed(1) + ' cm', cx, dy + 14,
        { col: PAL.textDim, size: 10.5 });
    }
  }

  function drawCore(ctx, g) {
    ctx.save();
    const gr = ctx.createLinearGradient(0, CY - g.r, 0, CY + g.r);
    gr.addColorStop(0, PAL.metalHi); gr.addColorStop(.5, PAL.iron); gr.addColorStop(1, PAL.steel);
    ctx.fillStyle = gr;
    rr(ctx, g.cx - g.len / 2 - 34, CY - g.r * .58, g.len + 68, g.r * 1.16, 5); ctx.fill();
    ctx.strokeStyle = PAL.steel; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
    txt(ctx, 'soft-iron core', g.cx, CY, { col: PAL.bg, size: 11.5, weight: 800 });
  }

  /* leads from the two ends of the winding down to a d.c. supply
     (reference image 3). Never drawn for the 2-solenoid study (spec 4.2.c). */
  function drawSupply(ctx, g) {
    /* the leads leave OUTSIDE the winding, so they clear the L dimension bar
       drawn at the winding's own half-length — otherwise the bar's end ticks
       land exactly on the leads and the two read as one shape */
    const half = Math.max(g.len / 2, 22) + 26;
    const xL = g.cx - half, xR = g.cx + half;
    const yBus = CY + g.r + 150;
    const TDX = 20, TR = 7.5;
    if (yBus > H - 24) return;

    /* Leads run right up to the terminal CENTRES; the terminal then fills its
       own disc in the background colour before stroking, so the wire meets the
       symbol with no gap — the same construction as Section 1's supply. */
    ctx.save();
    ctx.strokeStyle = PAL.wire; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(g.cx - Math.max(g.len / 2, 22), CY + g.r); ctx.lineTo(xL, CY + g.r); ctx.lineTo(xL, yBus); ctx.lineTo(g.cx - TDX, yBus);
    ctx.moveTo(g.cx + TDX, yBus); ctx.lineTo(xR, yBus); ctx.lineTo(xR, CY + g.r); ctx.lineTo(g.cx + Math.max(g.len / 2, 22), CY + g.r);
    ctx.stroke();
    ctx.restore();

    /* IGCSE d.c. supply: two terminal posts with an explicit + and −, not a
       cell's long/short plates. Polarity follows the current, so ⇄ Reverse
       current swaps the signs and the poles together. */
    const plusRight = E.revI > 0;
    for (const [tx, lab, col] of [
      [g.cx + TDX, plusRight ? '+' : '−', plusRight ? PAL.rose : PAL.blue],
      [g.cx - TDX, plusRight ? '−' : '+', plusRight ? PAL.blue : PAL.rose]]) {
      ctx.save();
      ctx.fillStyle = PAL.bg;
      ctx.beginPath(); ctx.arc(tx, yBus, TR, 0, TAU); ctx.fill();
      ctx.strokeStyle = PAL.text; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(tx, yBus, TR, 0, TAU); ctx.stroke();
      ctx.restore();
      txt(ctx, lab, tx, yBus - 22, { col, size: 17, weight: 800 });
    }
    txt(ctx, 'd.c. supply', g.cx, yBus + 26, { col: PAL.textMuted, size: 10.5 });
  }

  function poleLabel(ctx, x, y, pole) {
    const col = pole === 'N' ? PAL.poleN : PAL.poleS;
    txt(ctx, pole, x, y, { col, size: 26, weight: 800, plate: true });
    txt(ctx, pole === 'N' ? 'north pole' : 'south pole', x, y + 26,
      { col: PAL.textDim, size: 10, weight: 600, plate: true });
  }

  /* ---------- 2 solenoids ---------- */
  function drawPair(ctx, g) {
    const coilOf = c => ({ ...g, cx: c.cx, spacing: g.len / (g.turns - 1) });
    const withRev = (rev, fn) => { const sv = E.revI; if (rev) E.revI = -sv; fn(); E.revI = sv; };
    // same depth order as the single coil: far winding, field, near winding
    for (const [c, rev] of [[g.a, false], [g.b, E.pairRev2]])
      withRev(rev, () => drawWinding(ctx, c.cx, coilOf(c), 'far'));
    paintField(ctx, [g.a.cx, g.b.cx], g.r);
    for (const [c, rev] of [[g.a, false], [g.b, E.pairRev2]])
      withRev(rev, () => drawWinding(ctx, c.cx, coilOf(c), 'near'));
    paintFieldThroughWinding(ctx, [g.a.cx, g.b.cx], g.r, g.len);
    const pa = polesOf(g.a.cx), pb = polesOf(g.b.cx);
    /* Inner labels go INSIDE their coil ends: out in the gap they converge on
       each other as the separation closes, and land on the neutral-point
       marker, which lives at the centre of that same gap by definition. */
    poleLabel(ctx, g.a.cx - g.len / 2 - 46, CY - g.r - 30, pa.left);
    poleLabel(ctx, g.a.cx + g.len / 2 - 30, CY - g.r - 30, pa.right);
    poleLabel(ctx, g.b.cx - g.len / 2 + 30, CY - g.r - 30, pb.left);
    poleLabel(ctx, g.b.cx + g.len / 2 + 46, CY - g.r - 30, pb.right);

    const alike = pa.right === pb.left;
    if (alike) {
      const np = PHYS.findNeutralPointOnPath(fieldFn, t => ({ x: t, y: CY }),
        g.a.cx + g.len / 2 + 14, g.b.cx - g.len / 2 - 14, 500);
      if (np) {
        ctx.save();
        ctx.fillStyle = PAL.bg;
        ctx.beginPath(); ctx.arc(np.x, np.y, 16, 0, TAU); ctx.fill();
        ctx.strokeStyle = PAL.neutral; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(np.x - 10, np.y - 10); ctx.lineTo(np.x + 10, np.y + 10);
        ctx.moveTo(np.x + 10, np.y - 10); ctx.lineTo(np.x - 10, np.y + 10);
        ctx.stroke(); ctx.restore();
        txt(ctx, 'neutral point', np.x, np.y - 32,

      txt(ctx, 'F', g.a.cx - dir * 56, ay + 20, { col: PAL.force, size: 15, weight: 800, plate: true });

       the coil rather than being redrawn twice. */
    const s = polesOf(geom().cx).right === 'N' ? 1 : -1;
    const gy = y - 24, ex = x - s * 46;

    /* ONE turn, in exactly the orientation the winding has on the canvas — a
       tall narrow ellipse in the wire colour, with the wire's cross-sections
       ⊙ / ⊗ at top and bottom. Drawn as a wide horizontal ring it matched
       nothing the student could see in the picture beside it. */
    /* …and with the SAME depth cue as the winding on the canvas: the far half
       lighter and see-through, the near half at full strength. Drawn as one
       flat ring the card looked like a different object from the coil it is

    ctx.save();

    ctx.globalAlpha = .34; ctx.lineWidth = 4.5;

    arrow(ctx, ex + s * 28, gy, x + s * 76, gy, { col: PAL.fieldLine, lw: 3, head: 11 });

})();
/* ============================================================================
   SECTION 3 — 🖐 Force on Wire
   The wire's own field added to the uniform field between the poles gives the
   "catapult field": lines crowd on one side, cancel on the other, and the wire
   is flung from the crowded side toward the sparse one. F = BIL; the direction
   comes from Fleming's left-hand rule.
   ========================================================================== */
(function () {

  const G = {
    view: 'aerial',    // aerial | cross
    revI: 1,           // +1 = current OUT of the page in cross-section
    revB: 1,           // +1 = field N→S pointing RIGHT across the gap
    lhr: false,
    B: 120, I: 4, L: 6,          // mT, A, cm
    compass: { x: 1052, y: 556 }, cAng: 0, _cw: 0,
    lhrPos: { x: 1040, y: 300 }, flowPhase: 0, dragging: null
  };

  /* The wire's own field is drawn far larger than life. At true scale a few
     amps could not visibly bend a 120 mT field at all, so the picture would
     show nothing happening. The exaggeration is captioned on the canvas
     rather than hidden — the honesty is part of the teaching. */
  const VISUAL_SCALE = 5000;

  /* ---------------- single source of geometry ---------------- */
  function geom() { return { cx: 470, cy: 372, gapHalf: 150, poleW: 52, poleH: 258 }; }
  const Btesla = () => G.B / 1000;
  const Lmetres = () => G.L / 100;
  const force = () => PHYS.forceBIL(Btesla(), G.I, Lmetres());
  /* +revB means N on the left, so the uniform field points RIGHT (+x) */
  const uniformB = () => ({ x: Btesla() * G.revB, y: 0 });
  /* THE force direction — the same PHYS.forceDirOnCurrent() the parallel-wire
     study and the motor use. Deriving it a second time by hand is exactly how
     a sim ends up with a force arrow that disagrees with its own rotation. */
  const forceDir = () => { const u = uniformB(); return PHYS.forceDirOnCurrent(G.revI, u.x, u.y); };

  /* the combined field used for TRACING. The real uniform field exists only
     inside the gap, but an RK2 midpoint sample straddling that boundary
     produces zigzag artefacts, so the tracer sees a continuous field and the
     finished line is clipped to the picture instead. */
  function traceFieldFn(x, y) {
    const g = geom();
    const w = PHYS.wireB(x, y, g.cx, g.cy, G.I, G.revI);
    const u = uniformB();
    const bx = w.x * VISUAL_SCALE + u.x, by = w.y * VISUAL_SCALE + u.y;
    return { x: bx, y: by, mag: PHYS.hyp(bx, by) };
  }

  function reset() {
    G.view = 'aerial'; G.revI = 1; G.revB = 1; G.lhr = false;
    G.B = 120; G.I = 4; G.L = 6;
    G.compass = { x: 1052, y: 556 }; G.cAng = 0; G._cw = 0;
    G.lhrPos = { x: 1040, y: 300 }; G.flowPhase = 0; G.dragging = null;
    resetZoom();
  }
  reset();

  /* ======================= DRAW ======================= */
  function draw(ctx) {
    if (G.view === 'cross') drawCross(ctx); else drawAerial(ctx);
    if (G.lhr) drawLHR(ctx);
    updateChips();
  }

  /* ---------- flux across a VERTICAL segment ----------
     ∫|Bx| dy, i.e. the component that actually crosses the line. PHYS's
     general equalFluxSeeds integrates |B|, which on a line through the wire is
     dominated by the wire's own 1/r term and would pile every seed against the
     wire regardless of which side is the strong one. `ya` is the end NEAREST
     the wire, so the returned cumulative runs outwards from it. */
  function fluxAcrossVertical(x, ya, yb, M) {
    M = M || 320;
    const dy = (yb - ya) / M, dl = Math.abs(dy);
    const cum = [0];
    let tot = 0;
    for (let i = 1; i <= M; i++) {
      tot += Math.abs(traceFieldFn(x, ya + dy * i).x) * dl;
      cum.push(tot);
    }
    return { tot, cum, ya, dy, M };
  }
  function seedsByFlux(f, n) {
    const out = [];
    if (!(f.tot > 0) || n <= 0) return out;
    for (let k = 1; k <= n; k++) {
      const target = f.tot * (k - 0.5) / n;
      let i = 1;
      while (i < f.M && f.cum[i] < target) i++;
      out.push(f.ya + f.dy * i);
    }
    return out;
  }

  /* ---------- the catapult field family ----------
     Seeded on the vertical line THROUGH THE WIRE, by equal flux, and split
     between the two sides in proportion to the flux each side actually
     carries.

     Seeding down the left-hand POLE FACE (what this used to do) puts every
     seed where the wire's own field is negligible: the flux there is almost
     uniform, so equal-flux seeding lays down the SAME number of lines above
     the wire as below — the exact opposite of the catapult picture. Through
     the wire the two fields add on one side and cancel on the other, so the
     same honest rule now puts the lines where the field really is, and the
     counts come out of the physics rather than being decided by hand.

     Returned as data so the test suite can count lines per side instead of
     reading pixels. */
  const NTOT = 13;
  function crossFamily() {
    const g = geom();
    const fd = forceDir();
    /* the NEUTRAL POINT, found numerically from the SAME exaggerated field the
       lines are drawn from, so the marker can never sit somewhere the lines
       disagree with — it lands on the WEAKER side, opposite the force */
    const np = PHYS.findNeutralPointOnPath(traceFieldFn,
      t => ({ x: g.cx + fd.x * t, y: g.cy + fd.y * t }), 14, 112, 320);

    const yTop = g.cy - g.poleH / 2 + 10, yBot = g.cy + g.poleH / 2 - 10;
    const sSign = fd.y >= 0 ? 1 : -1;                      // canvas-y towards the WEAK side
    const npOff = np ? Math.abs(np.y - g.cy) : 30;
    const weak = fluxAcrossVertical(g.cx, g.cy + sSign * (npOff + 16), sSign > 0 ? yBot : yTop);
    const strong = fluxAcrossVertical(g.cx, g.cy - sSign * 26, sSign > 0 ? yTop : yBot);
    let nWeak = Math.round(NTOT * weak.tot / Math.max(1e-30, weak.tot + strong.tot));
    nWeak = Math.max(2, Math.min(NTOT - 5, nWeak));        // always visibly fewer
    const seeds = seedsByFlux(weak, nWeak).concat(seedsByFlux(strong, NTOT - nWeak))
      .map(y => ({ x: g.cx, y }));

    const bounds = { x0: g.cx - g.gapHalf - 2, y0: g.cy - g.poleH / 2 - 30,
                     x1: g.cx + g.gapHalf + 2, y1: g.cy + g.poleH / 2 + 30 };
    const solids = [{ contains: (x, y) => PHYS.hyp(x - g.cx, y - g.cy) < 10 }];
    const raw = seeds.map(s => PHYS.traceField(traceFieldFn, s.x, s.y,
      { step: 4, maxSteps: 460, closeDist: 7, bounds, solids }));
    /* a TIGHT dedupe cap: the default 26 px is wider than the deliberate
       crowding on the strong side, so it merged exactly the lines whose
       closeness is the point */
    return { fd, np, seeds, nWeak, nStrong: NTOT - nWeak, sSign,
             curves: PHYS.dedupeCurves(raw, 7) };
  }

  /* ======================= 4.3.b  CROSS-SECTION =======================
     Looking along the wire, between the pole faces (reference image 5). */
  function drawCross(ctx) {
    const g = geom();
    const nLeft = G.revB > 0;

    // the steel yoke: a U-channel carrying the two magnadur slabs
    const yx0 = g.cx - g.gapHalf - g.poleW - 30, yx1 = g.cx + g.gapHalf + g.poleW + 30;
    const yy0 = g.cy - g.poleH / 2 - 26, yy1 = g.cy + g.poleH / 2 + 34;
    ctx.save();
    ctx.strokeStyle = PAL.steel; ctx.lineWidth = 15; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(yx0, yy0); ctx.lineTo(yx0, yy1); ctx.lineTo(yx1, yy1); ctx.lineTo(yx1, yy0);
    ctx.stroke(); ctx.restore();
    txt(ctx, 'steel yoke', yx0 - 6, yy0 - 16, { col: PAL.textMuted, size: 10, align: 'left' });

    drawPoleSlab(ctx, g.cx - g.gapHalf - g.poleW / 2, g.cy, g.poleW, g.poleH, nLeft ? 'N' : 'S');
    drawPoleSlab(ctx, g.cx + g.gapHalf + g.poleW / 2, g.cy, g.poleW, g.poleH, nLeft ? 'S' : 'N');

    const fam = crossFamily();
    const fd = fam.fd, np = fam.np;
    for (const c of fam.curves)
      paintLine(ctx, c.pts, { col: PAL.fieldLine, lw: 1.7, heads: 2, headSize: 6, alpha: .95 });

    if (np && np.mag < Btesla() * 0.35) {
      ctx.save();
      ctx.strokeStyle = PAL.neutral; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(np.x - 10, np.y - 10); ctx.lineTo(np.x + 10, np.y + 10);
      ctx.moveTo(np.x + 10, np.y - 10); ctx.lineTo(np.x - 10, np.y + 10);
      ctx.stroke(); ctx.restore();
      txt(ctx, 'neutral point', np.x - 90, np.y, { col: PAL.neutral, size: 11, weight: 700, plate: true });
    }

    wireGlyph(ctx, g.cx, g.cy, 17, G.revI);
    const FL = 96;
    arrow(ctx, g.cx, g.cy, g.cx + fd.x * FL, g.cy + fd.y * FL, { col: PAL.force, lw: 4, head: 14 });

    if (S.show.labels) {
      // the carrying caption the spec asks for, verbatim
      txt(ctx, 'the wire is flung this way', g.cx + fd.x * 150, g.cy + fd.y * 150,
        { col: PAL.force, size: 13, weight: 800, plate: true });
      txt(ctx, 'lines cancel out — field is WEAKER', g.cx + fd.x * 190, g.cy + fd.y * 190,
        { col: PAL.textDim, size: 12, weight: 700, plate: true });
      txt(ctx, 'lines crowd together — field is STRONGER', g.cx - fd.x * 196, g.cy - fd.y * 196,
        { col: PAL.amber, size: 12, weight: 700, plate: true });
      txt(ctx, 'the wire’s own field is drawn ×' + VISUAL_SCALE.toLocaleString() +
        ' larger than life — to scale it could not bend these lines at all',
        600, 648, { col: PAL.textMuted, size: 10.5 });
    }
    drawCompass3(ctx);
  }

  function drawPoleSlab(ctx, x, cy, w, h, pole) {
    const col = pole === 'N' ? PAL.poleN : PAL.poleS;
    ctx.save();
    const gr = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    gr.addColorStop(0, col); gr.addColorStop(.58, col); gr.addColorStop(1, 'rgba(0,0,0,.34)');
    ctx.fillStyle = gr;
    rr(ctx, x - w / 2, cy - h / 2, w, h, 4); ctx.fill();
    ctx.restore();
    txt(ctx, pole, x, cy, { col: '#fff', size: 24, weight: 800 });
  }

  /* ======================= 4.3.a  AERIAL 3-D =======================
     The oblique "seen from a plane" view (reference image 4): all three of
     B, I and F appear at once, at genuine right angles. */
  const D3 = { x: 0.50, y: -0.34 };
  const p3 = (x, y, z) => ({ x: x + z * D3.x, y: y + z * D3.y });

  function drawAerial(ctx) {
    const cx = 430, cy = 360, depth = 150;
    /* blockH is 190, not 176, for a geometric reason worth writing down: the
       wire's far run is parallel to the block's top-face edges (both follow
       the depth axis), and at 176 it ran 1.8 px ABOVE that edge — close
       enough to look like it was resting on the magnet, and no length of
       wire could fix it. At 190 the top face covers the far run instead,
       so the wire reads as passing behind the pole, which is where it is. */
    const gapHalf = 132, blockW = 56, blockH = 190;
    const nLeft = G.revB > 0;

    // the dark pole gap floor, so the space between the blocks reads as solid
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    const f1 = p3(cx - gapHalf, cy - blockH / 2, 0), f2 = p3(cx + gapHalf, cy - blockH / 2, 0);
    const f3 = p3(cx + gapHalf, cy - blockH / 2, depth), f4 = p3(cx - gapHalf, cy - blockH / 2, depth);
    ctx.beginPath();
    ctx.moveTo(f1.x, f1.y); ctx.lineTo(f2.x, f2.y); ctx.lineTo(f3.x, f3.y); ctx.lineTo(f4.x, f4.y);
    ctx.closePath(); ctx.fill(); ctx.restore();

    /* the wire runs along the DEPTH axis through the gap — which is what makes
       the current perpendicular to B and lets the force be a third, genuinely
       perpendicular direction. Both ends are pushed far enough out that their
       leads come down CLEAR of the blocks: the old back lead dropped straight
       through the far pole. */
    const zA = -190, zB = depth + 150;
    const wa = p3(cx, cy, zA), wb = p3(cx, cy, zB);
    const xClip = cx + gapHalf + 6;      // 6 px INSIDE the far block's near edge

    /* The FAR run of the wire and the whole circuit go down BEFORE the blocks.
       In this oblique projection everything behind the gap lands on top of the
       far pole, so drawn afterwards the lead painted a stripe straight across
       the magnet. Drawn first, the block covers it and the wire simply reads
       as passing behind — which is where it is. */
    drawWireRun(ctx, wa, wb);
    drawWireFlow(ctx, wa, wb);
    drawAerialCircuit(ctx, wa, wb);

    drawBlock3D(ctx, cx - gapHalf - blockW / 2, cy, blockW, blockH, depth, nLeft ? 'N' : 'S');
    drawBlock3D(ctx, cx + gapHalf + blockW / 2, cy, blockW, blockH, depth, nLeft ? 'S' : 'N');

    // uniform field arrows across the gap, on several depth planes
    const dirX = G.revB > 0 ? 1 : -1;
    for (let i = 0; i <= 5; i++) {
      const z = depth * (i / 5) * 0.92 + 6;
      const a = p3(cx - gapHalf + 4, cy - 4, z), b = p3(cx + gapHalf - 4, cy - 4, z);
      if (dirX > 0) arrow(ctx, a.x, a.y, b.x, b.y, { col: PAL.fieldLine, lw: 1.8, head: 9, alpha: .95 });
      else arrow(ctx, b.x, b.y, a.x, a.y, { col: PAL.fieldLine, lw: 1.8, head: 9, alpha: .95 });
    }

    /* The wire is ONE stroke, drawn twice: once before the blocks (so the far
       pole covers its far run) and once again here, clipped to everything in
       front of the pole, so it also sits over the field arrows it is in front
       of. Drawing it as two SEPARATE runs meeting in mid-air left the join
       visible — each run's dark halo capped off across the other's copper, and
       the seam showed as a ring on the wire. Identical geometry cannot seam,
       and the clip edge is hidden 6 px inside the block. */
    ctx.save();
    ctx.beginPath(); ctx.rect(-60, -60, xClip + 60, H + 120); ctx.clip();
    drawWireRun(ctx, wa, wb);
    drawWireFlow(ctx, wa, wb);
    ctx.restore();

    // the force, at right angles to both — same physics function as everywhere
    const fd = forceDir(), FL = 96;
    arrow(ctx, cx, cy, cx + fd.x * FL, cy + fd.y * FL, { col: PAL.force, lw: 4.4, head: 14 });

    if (S.show.labels) {
      /* Clear of the blocks ALTOGETHER. cy − 124 was still inside them: the
         top faces are sheared upwards by depth × 0.34, so a pole reaches
         51 px higher on screen than its own top edge suggests. */
      const yCap = cy - blockH / 2 - depth * 0.34 - 52;
      txt(ctx, 'magnetic field, N → S', cx - 122, yCap,
        { col: PAL.fieldLine, size: 11.5, weight: 700, plate: true });
      txt(ctx, 'force F = ' + PHYS.fmtF(force()), cx + 132, yCap,
        { col: PAL.force, size: 12, weight: 800, plate: true });
      /* clear of the left-hand lead, which drops at wa.x: at cx − 156 the
         caption's plate ran straight through it */
      txt(ctx, G.revI > 0 ? 'current I (towards you)' : 'current I (away from you)',
        cx - 218, cy + 150, { col: PAL.current, size: 11.5, weight: 700, plate: true });
    }
  }

  function drawWireRun(ctx, a, b) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = PAL.coilwire; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.restore();
  }

  function drawBlock3D(ctx, x, cy, w, h, depth, pole) {
    const col = pole === 'N' ? PAL.poleN : PAL.poleS;
    const tl = p3(x - w / 2, cy - h / 2, 0), tr = p3(x + w / 2, cy - h / 2, 0);
    const br = p3(x + w / 2, cy - h / 2, depth), bl = p3(x - w / 2, cy - h / 2, depth);
    ctx.save();
    /* Every face gets an OPAQUE base first. The faces are painted with alpha
       (.58 on the top, a fading gradient on the other two) purely for shading,
       and translucent shading means a pole is not actually solid: the wire and
       its leads running behind one showed straight through the near edge. */
    const face = (pts, paint) => {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.globalAlpha = 1; ctx.fillStyle = PAL.bg; ctx.fill();
      paint(); ctx.fill();
    };
    // top face
    face([tl, tr, br, bl], () => { ctx.globalAlpha = .58; ctx.fillStyle = col; });
    // the receding side face
    const sa = p3(x + w / 2, cy - h / 2, 0), sb = p3(x + w / 2, cy - h / 2, depth);
    const sc = p3(x + w / 2, cy + h / 2, depth), sd = p3(x + w / 2, cy + h / 2, 0);
    face([sa, sb, sc, sd], () => {
      const sg = ctx.createLinearGradient(sa.x, sa.y, sb.x, sb.y);
      sg.addColorStop(0, col); sg.addColorStop(1, 'rgba(0,0,0,.55)');
      ctx.globalAlpha = 1; ctx.fillStyle = sg;
    });
    // front face
    ctx.globalAlpha = 1; ctx.fillStyle = PAL.bg;
    rr(ctx, x - w / 2, cy - h / 2, w, h, 3); ctx.fill();
    const fg = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    fg.addColorStop(0, 'rgba(0,0,0,.20)'); fg.addColorStop(.4, col); fg.addColorStop(1, col);
    ctx.fillStyle = fg;
    rr(ctx, x - w / 2, cy - h / 2, w, h, 3); ctx.fill();
    ctx.restore();
    txt(ctx, pole, x, cy, { col: '#fff', size: 24, weight: 800 });
  }

  /* the supply circuit, drawn below the apparatus (reference image 4) */
  function drawAerialCircuit(ctx, wa, wb) {
    const yBus = 616, xL = wa.x, xR = wb.x;
    const cellX = 420, vrX = 522, TDX = 20, TR = 7.5;
    ctx.save();
    ctx.strokeStyle = PAL.wire; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(xL, wa.y); ctx.lineTo(xL, yBus); ctx.lineTo(cellX - TDX, yBus);
    ctx.moveTo(cellX + TDX, yBus); ctx.lineTo(vrX - 34, yBus);
    ctx.moveTo(vrX + 34, yBus); ctx.lineTo(xR, yBus); ctx.lineTo(xR, wb.y);
    ctx.stroke();
    // variable resistor: a box with the diagonal arrow across it
    ctx.strokeStyle = PAL.metal; ctx.lineWidth = 2;
    rr(ctx, vrX - 34, yBus - 13, 68, 26, 3); ctx.stroke();
    ctx.restore();
    arrow(ctx, vrX - 30, yBus + 17, vrX + 30, yBus - 19, { col: PAL.metal, lw: 1.8, head: 7 });

    /* the SAME two-terminal IGCSE supply the solenoid uses — one symbol for
       one thing, everywhere in the lab.

       Which terminal is + follows from walking the loop, not from taste.
       revI = +1 means the current runs along the wire TOWARDS the viewer,
       i.e. from the far end wb to the near end wa. From wa it goes down the
       left lead, left along the bus, INTO the left terminal, out of the right
       terminal, through the variable resistor and back up to wb. Conventional
       current leaves the POSITIVE terminal — so with revI = +1 the + is the
       RIGHT-hand one. It was drawn on the left, i.e. exactly backwards. */
    const plusLeft = G.revI < 0;
    for (const [tx, lab, col] of [
      [cellX - TDX, plusLeft ? '+' : '−', plusLeft ? PAL.rose : PAL.blue],
      [cellX + TDX, plusLeft ? '−' : '+', plusLeft ? PAL.blue : PAL.rose]]) {
      ctx.save();
      ctx.fillStyle = PAL.bg;
      ctx.beginPath(); ctx.arc(tx, yBus, TR, 0, TAU); ctx.fill();
      ctx.strokeStyle = PAL.text; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(tx, yBus, TR, 0, TAU); ctx.stroke();
      ctx.restore();
      txt(ctx, lab, tx, yBus - 22, { col, size: 17, weight: 800 });
    }
    txt(ctx, 'd.c. supply', cellX, yBus + 26, { col: PAL.textMuted, size: 10 });
    txt(ctx, 'variable resistor', vrX, yBus + 30, { col: PAL.textMuted, size: 10 });
  }

  function drawCompass3(ctx) {
    if (!S.show.compass) return;
    const g = geom();
    const b = traceFieldFn(G.compass.x, G.compass.y);
    // outside the pole gap the modelled field is the wire's alone, which is
    // vanishingly small — report that honestly rather than pretending
    const inGap = Math.abs(G.compass.x - g.cx) < g.gapHalf &&
                  Math.abs(G.compass.y - g.cy) < g.poleH / 2;
    drawCompass(ctx, G.compass.x, G.compass.y, 21, { ang: G.cAng }, inGap && b.mag > 1e-9);
    txt(ctx, 'plotting compass', G.compass.x, G.compass.y + 38,
      { col: PAL.textDim, size: 10, weight: 600, plate: true });
  }

  /* ---------- Fleming's left-hand rule: THREE AXES ONLY ----------
     Spec rule 6: no drawn hand. An AI-drawn hand reads as wrong every time,
     and a wrong hand actively teaches the wrong rule. Three labelled arrows
     from one origin, oriented from the real field and current so the whole
     triad turns when the toolbar reverses either — now on a card the student
     can drag out of the way of whatever they are looking at.

     The finger mnemonics ("thu M b", "F irst finger", "se C ond finger") are
     gone: they only make sense with a hand in front of you, and printed under
     an arrow they read as part of the vector's name. */
  const LHR_W = 268, LHR_H = 244;
  function drawLHR(ctx) {
    const px = G.lhrPos.x, py = G.lhrPos.y;
    ctx.save();
    rr(ctx, px - LHR_W / 2, py - LHR_H / 2, LHR_W, LHR_H, 10);
    ctx.fillStyle = PAL.bg; ctx.globalAlpha = .95; ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
    txt(ctx, 'Fleming’s LEFT-hand rule', px, py - LHR_H / 2 + 18,
      { col: PAL.force, size: 12.5, weight: 800 });

    const ox = px, oy = py + 4, LEN = 52;
    const u = uniformB(), fd = forceDir();
    const bDir = PHYS.norm({ x: u.x, y: u.y });
    /* the current runs along the depth axis; in cross-section it is
       perpendicular to the screen, so it is drawn receding */
    const cN = PHYS.norm(G.revI > 0 ? { x: -D3.x, y: -D3.y } : { x: D3.x, y: D3.y });

    arrow(ctx, ox, oy, ox + bDir.x * LEN, oy + bDir.y * LEN, { col: PAL.fieldLine, lw: 3, head: 11 });
    arrow(ctx, ox, oy, ox + fd.x * LEN, oy + fd.y * LEN, { col: PAL.force, lw: 3, head: 11 });
    arrow(ctx, ox, oy, ox + cN.x * LEN, oy + cN.y * LEN, { col: PAL.current, lw: 3, head: 11 });
    ctx.save();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ox, oy, 4.5, 0, TAU); ctx.fill();
    ctx.restore();

    /* the offset is shortened for a VERTICAL axis. At a flat LEN + 34 the
       Force label, when the force points down, landed on the footer line —
       the one direction where the card has something else at that height. */
    const lab = (d, s2, col) => {
      const off = LEN + 34 - 9 * Math.abs(d.y);
      txt(ctx, s2, ox + d.x * off, oy + d.y * off,
        { col, size: 12.5, weight: 800, plate: true });
    };
    lab(bDir, 'Field (B)', PAL.fieldLine);
    lab(fd, 'Force (F)', PAL.force);
    lab(cN, 'Current (I)', PAL.current);

    txt(ctx, 'all three at right angles, on your LEFT hand', px, py + LHR_H / 2 - 12,
      { col: PAL.textDim, size: 10 });
  }

  /* ---------- conventional current along the wire ----------
     The dots fade as they recede: on a straight oblique line that is the only
     depth cue there is, so without it the near end and the far end of the same
     wire look identical. */
  function drawWireFlow(ctx, a, b) {
    if (!S.show.flow || !(G.I > 0)) return;
    const len = PHYS.hyp(b.x - a.x, b.y - a.y);
    const n = Math.max(2, Math.round(len / 30));
    const dir = G.revI > 0 ? -1 : 1;        // +revI = current towards the viewer
    ctx.save();
    for (let k = 0; k < n; k++) {
      let t = (k / n + dir * G.flowPhase) % 1;
      if (t < 0) t += 1;
      /* 0.55, not 0.7: the far end still has to be READABLE as current, it is
         only meant to look further away. A dark rim as well, because a grey
         dot alone on copper is only a small step in lightness. */
      ctx.globalAlpha = 1 - 0.55 * t;       // a is the NEAR end, b the far one
      const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
      ctx.beginPath(); ctx.arc(x, y, 4.6, 0, TAU);
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fill();
      ctx.shadowColor = PAL.current; ctx.shadowBlur = 5;
      ctx.beginPath(); ctx.arc(x, y, 3.6, 0, TAU);
      ctx.fillStyle = PAL.current; ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  /* ======================= chips ======================= */
  function updateChips() {
    const fd = forceDir();
    const word = Math.abs(fd.y) > Math.abs(fd.x)
      ? (fd.y < 0 ? 'UPWARDS' : 'DOWNWARDS')
      : (fd.x > 0 ? 'to the RIGHT' : 'to the LEFT');
    setChips(
      '<b>Force on a current-carrying wire</b><br>F = B I L',
      'F = <b>' + PHYS.fmtF(force()) + '</b>',
      G.I === 0 ? 'No current → no force' : '',
      G.view === 'aerial'
        ? 'All three arrows are at right angles.<br>Turn on ✋ Left-hand rule for the triad.'
        : 'The wire is pushed ' + word + '.<br>Reverse ⇄ current OR ⇄ field and it flips;<br>reverse BOTH and it stays the same.'
    );
  }
  function update(dt) {
    if (S.show.flow && G.I > 0) G.flowPhase = (G.flowPhase + dt * 0.16) % 1;
    const b = traceFieldFn(G.compass.x, G.compass.y);
    const c = { ang: G.cAng, w: G._cw };
    stepCompass(c, Math.atan2(b.y, b.x), b.mag > 1e-9, dt);
    G.cAng = c.ang; G._cw = c.w;
  }
  const lhrHit = lp => G.lhr &&
    Math.abs(lp.x - G.lhrPos.x) < LHR_W / 2 && Math.abs(lp.y - G.lhrPos.y) < LHR_H / 2;
  function pointerDown(lp) {
    if (lhrHit(lp)) {                       // the card sits on top, so test it first
      G.dragging = 'lhr';
      G._lhrOff = { x: lp.x - G.lhrPos.x, y: lp.y - G.lhrPos.y };
      return true;
    }
    if (S.show.compass && G.view === 'cross' &&
        PHYS.hyp(lp.x - G.compass.x, lp.y - G.compass.y) < 28) {
      G.dragging = 'compass'; return true;
    }
    return false;
  }
  function pointerMove(lp) {
    if (G.dragging === 'lhr') {
      G.lhrPos.x = Math.max(LHR_W / 2 + 6, Math.min(W - LHR_W / 2 - 6, lp.x - G._lhrOff.x));
      G.lhrPos.y = Math.max(LHR_H / 2 + 6, Math.min(H - LHR_H / 2 - 6, lp.y - G._lhrOff.y));
      return true;
    }
    if (G.dragging !== 'compass') return false;
    G.compass.x = Math.max(26, Math.min(W - 26, lp.x));
    G.compass.y = Math.max(26, Math.min(H - 26, lp.y));
    return true;
  }
  function pointerUp() { G.dragging = null; }

  /* the flow dots run ALONG the wire, so they exist only where the wire is
     drawn as a line — in cross-section it is seen end-on as ⊙/⊗ and there is
     nothing to animate, so the toolbar button is locked off there */
  const supportsFlow = () => G.view === 'aerial';

  /* ======================= panels ======================= */
  function paneData() {
    let h = sectionTitle('🎛️', 'CONTROLS');
    h += sliderHTML('wB', 'Field strength B', G.B.toFixed(0), { min: 0, max: 200, step: 5, value: G.B, unit: ' mT' });
    h += sliderHTML('wI', 'Current I', G.I.toFixed(1), { min: 0, max: 8, step: 0.1, value: G.I, unit: ' A' });
    h += sliderHTML('wL', 'Length in field L', G.L.toFixed(0), { min: 2, max: 12, step: 0.5, value: G.L, unit: ' cm' });
    h += '<div class="rowbtns">' +
      '<button class="mini" id="btnWI2">⇄ Reverse current</button>' +
      '<button class="mini" id="btnWB2">⇄ Reverse field</button></div>';
    h += sectionTitle('📊', 'READINGS');
    h += '<div class="grid2">' + cardHTML('B', G.B.toFixed(0), 'mT', 'kWB') +
      cardHTML('I', G.I.toFixed(1), 'A', 'kWI') + '</div>';
    h += kvHTML('Length in field, L', '—', '', 'kWL');
    h += kvHTML('Force F', '—', 'v-force', 'kWF');
    h += kvHTML('Field direction', '—', '', 'kWBd');
    h += kvHTML('Current direction', '—', 'v-cur', 'kWId');
    h += kvHTML('Wire is pushed', '—', 'v-force', 'kWFd');
    h += sectionTitle('🧮', 'WORKING');

})();
/* ============================================================================
   SECTION 4 — ⚙️ D.C. Motor

   theta and the commutator are BOTH defined in part3_model.js — see the long
   note above PHYS.motorTorque(). In brief:
     θ = angle of the coil PLANE from B, so torque = N B I A cos θ.
     θ = 0   → coil horizontal, sides side by side → MAXIMUM couple.
     θ = 90° → coil VERTICAL, sides stacked → the dead spot, where the coil
               stalls if the commutator is removed.
   The split ring's gap lies along θ + 90°, so it sweeps past the fixed
   brushes exactly at the dead spots, and the polarity reaching each coil side
   flips with sign(cos θ) — PHYS.commFactor(). That single expression drives
   the dynamics, the ⊙/⊗ glyphs and the enlarged inset alike, so the picture
   can never contradict the physics.
   ========================================================================== */
(function () {

  const M = {
    view: 'cross',            // aerial | cross
    running: false,
    commutatorOn: true,
    autoPause: false,
    theta: 0.62,
    omega: 0,
    dirI0: 1, dirB0: 1,
    I: 3, B: 120, turns: 1, area: 0.02,
    stepTarget: null,
    pausedAt: null,           // which half-turn boundary we last paused on
    showB: true,              // the field between the poles, in Aerial 3-D
    insetPos: { x: 1030, y: 400 }, dragging: null
  };

  const K_TORQUE = 640, DAMP = 1.9;
  const Btesla = () => M.B / 1000;

  function reset() {
    M.view = 'cross'; M.running = false; M.commutatorOn = true; M.autoPause = false;
    M.theta = 0.62; M.omega = 0; M.dirI0 = 1; M.dirB0 = 1;
    M.I = 3; M.B = 120; M.turns = 1;
    M.stepTarget = null; M.pausedAt = null;
    M.showB = true; M.insetPos = { x: 1030, y: 400 }; M.dragging = null;
    resetZoom();
  }
  reset();

  const torque = () => PHYS.motorTorque(M.theta, M.I, Btesla(), M.area, M.turns,
    M.commutatorOn, M.dirI0, M.dirB0);
  /* which absolute current direction (⊙ = +1 / ⊗ = −1) each coil side carries
     right now — ONE expression, shared by every view and the inset */
  const dirZfor = s => s * PHYS.commFactor(M.theta, M.commutatorOn) * M.dirI0;
  const sidePos = (cx, cy, r, s) => {
    const o = PHYS.coilSideOffset(M.theta, r, s);
    return { x: cx + o.x, y: cy + o.y };
  };
  const uniformB = () => ({ x: Btesla() * M.dirB0, y: 0 });
  const atDeadSpot = () => Math.abs(Math.cos(M.theta)) < 0.07;

  /* ======================= DRAW ======================= */
  function draw(ctx) {
    if (M.view === 'aerial') drawAerial(ctx); else drawCross(ctx);
    updateChips();
  }

  /* ======================= CROSS-SECTION (reference image 6) ============ */
  function drawCross(ctx) {
    const cx = 470, cy = 372, r = 128;
    const nLeft = M.dirB0 > 0;

    drawPoleSlab(ctx, cx - 250, cy, 50, 240, nLeft ? 'N' : 'S');
    drawPoleSlab(ctx, cx + 250, cy, 50, 240, nLeft ? 'S' : 'N');

    // the uniform field, straight across the gap
    const dirX = M.dirB0 > 0 ? 1 : -1;
    for (let i = -2; i <= 2; i++) {
      const y = cy + i * 56;
      const a = cx - 222, b = cx + 222;
      if (dirX > 0) arrow(ctx, a, y, b, y, { col: PAL.fieldLine, lw: 1.6, head: 9, alpha: .8 });
      else arrow(ctx, b, y, a, y, { col: PAL.fieldLine, lw: 1.6, head: 9, alpha: .8 });
    }

    // the coil, seen end-on: a dashed line through the axle
    const s1 = sidePos(cx, cy, r, +1), s2 = sidePos(cx, cy, r, -1);
    ctx.save();
    ctx.strokeStyle = PAL.coilwire; ctx.lineWidth = 3.5;
    ctx.setLineDash([9, 6]); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
    ctx.restore();

    // the axle
    ctx.save();
    ctx.fillStyle = PAL.metal;
    ctx.beginPath(); ctx.arc(cx, cy, 12, 0, TAU); ctx.fill();
    ctx.strokeStyle = PAL.metalHi; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    txt(ctx, 'axle', cx + 34, cy + 20, { col: PAL.textMuted, size: 10, align: 'left' });

    /* the COUPLE — each force from the same PHYS.forceDirOnCurrent() the
       other sections use, so the arrows and the rotation cannot disagree */
    const u = uniformB(), FL = 76;
    for (const s of [+1, -1]) {
      const p = sidePos(cx, cy, r, s);
      const dz = dirZfor(s);
      wireGlyph(ctx, p.x, p.y, 17, dz);
      if (M.I > 0 && M.B > 0) {
        const fd = PHYS.forceDirOnCurrent(dz, u.x, u.y);
        arrow(ctx, p.x, p.y, p.x + fd.x * FL, p.y + fd.y * FL, { col: PAL.force, lw: 3.6, head: 13 });
        txt(ctx, 'F', p.x + fd.x * (FL + 20), p.y + fd.y * (FL + 20),
          { col: PAL.force, size: 15, weight: 800 });
      }
    }

    if (S.show.labels) {
      txt(ctx, 'a COUPLE — one force up, one force down, both turning the coil the same way',
        600, 108, { col: PAL.force, size: 13, weight: 800 });
      txt(ctx, atDeadSpot()
        ? (M.commutatorOn ? 'at the DEAD SPOT — the commutator swaps over here and it carries on'
                          : 'at the DEAD SPOT — with no commutator the couple dies and it STALLS')
        : 'the two sides carry current in OPPOSITE directions (⊙ and ⊗), so their forces oppose',
        600, 130, { col: atDeadSpot() ? PAL.rose : PAL.textDim, size: 11, weight: 600 });
    }

  }

  function drawPoleSlab(ctx, x, cy, w, h, pole) {
    const col = pole === 'N' ? PAL.poleN : PAL.poleS;
    ctx.save();
    const gr = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    gr.addColorStop(0, col); gr.addColorStop(.6, col); gr.addColorStop(1, 'rgba(0,0,0,.32)');
    ctx.fillStyle = gr;
    rr(ctx, x - w / 2, cy - h / 2, w, h, 4); ctx.fill();
    ctx.restore();
    txt(ctx, pole, x, cy, { col: '#fff', size: 24, weight: 800 });
  }

  /* ======================= AERIAL 3-D ======================= */
  const D3 = { x: 0.46, y: -0.28 };
  const p3 = (x, y, z) => ({ x: x + z * D3.x, y: y + z * D3.y });

  const AER = { cx: 380, cy: 400, r: 96, depth: 118,
                POLE_OFF: 156, POLE_W: 42, POLE_H: 180, RING_R: 40 };
  /* The commutator sits further along the depth axis than the pole pieces, and
     that axis runs up-and-to-the-right — so COMM_Z must clear the far pole's
     outer edge AND the depth it is sheared by, plus the ring's own radius.
     Derived here rather than nudged by eye. */
  const COMM_Z = () => (AER.POLE_OFF + AER.POLE_W / 2 + AER.RING_R + 22) / D3.x + AER.depth;

  function drawAerial(ctx) {
    const { cx, cy, r, depth, POLE_OFF, POLE_W, POLE_H, RING_R } = AER;
    const cz = COMM_Z();
    const nLeft = M.dirB0 > 0;

    drawPole3D(ctx, cx - POLE_OFF, cy, POLE_W, POLE_H, depth, nLeft ? 'N' : 'S');
    drawPole3D(ctx, cx + POLE_OFF, cy, POLE_W, POLE_H, depth, nLeft ? 'S' : 'N');

    /* the uniform field across the gap, on several depth planes — the same
       device the Force-on-Wire aerial uses, so the two pictures read alike */
    if (M.showB && M.B > 0) {
      const dirX = M.dirB0 > 0 ? 1 : -1;
      const x0 = cx - POLE_OFF + POLE_W / 2 + 4, x1 = cx + POLE_OFF - POLE_W / 2 - 4;
      for (let i = 0; i <= 4; i++) {
        const z = depth * (i / 4) * 0.92 + 5;
        for (const dy of [-58, 58]) {
          const a = p3(x0, cy + dy, z), b = p3(x1, cy + dy, z);
          if (dirX > 0) arrow(ctx, a.x, a.y, b.x, b.y, { col: PAL.fieldLine, lw: 1.6, head: 8, alpha: .9 });
          else arrow(ctx, b.x, b.y, a.x, a.y, { col: PAL.fieldLine, lw: 1.6, head: 8, alpha: .9 });
        }
      }
      if (S.show.labels)
        txt(ctx, 'magnetic field, N → S', cx - 130, cy - POLE_H / 2 - depth * 0.28 - 60,
          { col: PAL.fieldLine, size: 11, weight: 700, plate: true });
    }

    // the axle, running along the depth axis out to the commutator
    const ax0 = p3(cx, cy, -44), ax1 = p3(cx, cy, cz + 52);
    ctx.save();
    ctx.strokeStyle = PAL.metal; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax0.x, ax0.y); ctx.lineTo(ax1.x, ax1.y); ctx.stroke();
    ctx.restore();

    // the coil as a real rectangle rotating about the axle
    const zA = 4, zB = depth;
    const corner = (s2, z) => {
      const o = PHYS.coilSideOffset(M.theta, r, s2);
      return p3(cx + o.x, cy + o.y, z);
    };
    /* filled, not just outlined. The coil's sides run along the depth axis, and
       once every turn the sides' own offset lines up with the direction that
       axis projects to — the outline then collapses onto itself and the coil
       vanishes. A faint fill keeps it reading as a PLANE at every angle. */
    ctx.save();
    const c1 = corner(1, zA), c2 = corner(1, zB), c3 = corner(-1, zB), c4 = corner(-1, zA);
    ctx.beginPath();
    ctx.moveTo(c1.x, c1.y); ctx.lineTo(c2.x, c2.y);
    ctx.lineTo(c3.x, c3.y); ctx.lineTo(c4.x, c4.y); ctx.closePath();
