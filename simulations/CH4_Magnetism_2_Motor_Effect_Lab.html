<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧲 Motor Effect Lab v3 — HAUS Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ===========================================================================
   THEMES — six exactly.
   The structural greys shift per theme so metal reads on dark AND on light.
   The PRINTED-REFERENCE colours below do NOT: a school magnet has a red north
   and a blue south, and a screenshot taken in HAUS Day must show the same
   poles as one taken in Neon. They are physical facts, not decoration.
   =========================================================================== */
:root{
  --bg:#0f1117; --card:#171a23; --canvas-bg:#0b0d13; --grid:#1c2030;
  --text:#e8eaf0; --text-dim:#9aa3b8; --text-muted:#6b7488;
  --border:#262b3a; --accent:#f4c01e; --accent-glow:rgba(244,192,30,.13);
  --green:#22c55e; --rose:#fb7185; --violet:#a78bfa; --amber:#fbbf24;
  --blue:#60a5fa; --orange:#fb923c;
  --metal:#8b93a7; --metal-hi:#c3cad9; --iron:#6f7789; --steel:#8e97ab;
  --insul:#2a2f3e; --coilwire:#c87f3a;
}
.theme-hausnight{
  --bg:#0a0e1a; --card:#111828; --canvas-bg:#070b14; --grid:#18203a;
  --text:#eef2ff; --text-dim:#94a3c8; --text-muted:#64748b;
  --border:#1e2a44; --accent:#f4c01e; --accent-glow:rgba(244,192,30,.15);
  --green:#34d399; --rose:#fb7185; --violet:#a78bfa; --amber:#fcd34d;
  --blue:#7dd3fc; --orange:#fdba74;
  --metal:#8892ab; --metal-hi:#c8d2e6; --iron:#6b7488; --steel:#8b95ac;
  --insul:#131c30; --coilwire:#d08a45;
}
.theme-neon{
  --bg:#08060f; --card:#130f22; --canvas-bg:#050308; --grid:#231a3d;
  --text:#f0e9ff; --text-dim:#b39ddb; --text-muted:#7e6a9e;
  --border:#2e2350; --accent:#00f0ff; --accent-glow:rgba(0,240,255,.15);
  --green:#39ff8b; --rose:#ff5fa2; --violet:#c084fc; --amber:#ffd166;
  --blue:#5eead4; --orange:#ff9e64;
  --metal:#9d8fc4; --metal-hi:#ddd2ff; --iron:#7b6ea8; --steel:#9083bb;
  --insul:#1a1230; --coilwire:#e08b4a;
}
.theme-light{
  --bg:#f4f6fb; --card:#ffffff; --canvas-bg:#fbfcfe; --grid:#e4e8f2;
  --text:#161b26; --text-dim:#525c72; --text-muted:#7b859c;
  --border:#d7dded; --accent:#b8860b; --accent-glow:rgba(184,134,11,.11);
  --green:#15803d; --rose:#be123c; --violet:#6d28d9; --amber:#b45309;
  --blue:#1d4ed8; --orange:#c2410c;
  --metal:#7b8398; --metal-hi:#eef1f7; --iron:#5d6577; --steel:#79839a;
  --insul:#dde3ef; --coilwire:#a9622a;
}
.theme-haus{
  --bg:#fdf8ec; --card:#fffdf7; --canvas-bg:#fffcf3; --grid:#efe4c9;
  --text:#231c0d; --text-dim:#6a5a38; --text-muted:#8d7c56;
  --border:#e6d7b4; --accent:#a06a06; --accent-glow:rgba(160,106,6,.12);
  --green:#166534; --rose:#a8123c; --violet:#5b21b6; --amber:#a16207;
  --blue:#1e40af; --orange:#b45309;
  --metal:#8a8069; --metal-hi:#f3ecda; --iron:#6b6350; --steel:#877d66;
  --insul:#eadfc4; --coilwire:#9c5a26;
}
.theme-clay{
  --bg:#211c1a; --card:#2b2422; --canvas-bg:#191413; --grid:#382e2b;
  --text:#f3e9e2; --text-dim:#bda99c; --text-muted:#8e7a6d;
  --border:#3d322e; --accent:#e8a33d; --accent-glow:rgba(232,163,61,.14);
  --green:#5fbf7d; --rose:#f08c8c; --violet:#b39ddb; --amber:#f0c070;
  --blue:#7fb3d5; --orange:#e59866;
  --metal:#9c8b7e; --metal-hi:#d8c9bc; --iron:#7d6e63; --steel:#9a8a7d;
  --insul:#332b28; --coilwire:#c87f3a;
}

/* ---- PRINTED-REFERENCE COLOURS — identical in all six themes ---- */
:root, .theme-hausnight, .theme-neon, .theme-light, .theme-haus, .theme-clay{
  --pole-n:#ff4444;                       /* north — red   */
  --pole-s:#4488ff;                       /* south — blue  */
  --wire:#c87f3a;                         /* copper */
  --compass:#b8c0d0;                      /* plotting-compass body */
}

/* ---- FIELD / FORCE / CURRENT / NEUTRAL POINT: per-theme ----
   These four deliberately do NOT follow the "identical across all themes"
   rule, and the reason is measured, not stylistic. They are one value each in
   the spec, so a single value has to survive BOTH a near-black and a
   near-white canvas. Neon green scores 14:1 on dark but 1.3:1 on white;
   dark charcoal is 9.7:1 on white but 1.6:1 on dark. No single value clears
   the 3:1 floor on both — the two requirements are at opposite ends of the
   lightness range.
   So each theme gets the SAME HUE (purple field, green force, grey current,
   cyan neutral point) at a lightness that actually reads on its own
   background. The teaching identity — "green means force" — is preserved
   everywhere, which is what the rule was protecting; an invisible colour
   protects nothing. Every value below is verified >= 3:1 in verify.js. */
:root, .theme-hausnight, .theme-neon, .theme-clay{
  --field-line:rgba(168,85,247,0.85);     /* purple  — magnetic field lines */
  --force:#39ff14;                        /* neon green — force / motion */
  --current:#9aa4ae;                      /* graphite — conventional current */
  --neutral-pt:#22d3ee;                   /* cyan — neutral points */
}
.theme-light, .theme-haus{
  --field-line:rgba(139,33,232,0.85);     /* purple, deepened for white */
  --force:#0f8f12;                        /* green, deepened for white */
  --current:#36393d;                      /* true dark charcoal */
  --neutral-pt:#0b7e8e;                   /* cyan, deepened for white */
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  padding:8px 12px; height:100vh; overflow:hidden;
  display:flex; flex-direction:column; align-items:center;
  background:var(--bg); color:var(--text);
  transition:background .3s,color .3s;
}
.container{ max-width:1720px; width:100%; height:100%; display:flex; flex-direction:column; min-height:0; }

/* ============================ HEADER — 45 px ============================
   The row height is NOT set: .brand is the tallest child (31px logo + 7px
   padding top and bottom = 45), so changing the logo changes the row
   correctly instead of silently breaking a hardcoded number.            */
.top-bar{ display:flex; justify-content:space-between; align-items:center;
          margin-bottom:6px; flex-wrap:wrap; gap:8px; flex:0 0 auto; }
.top-bar h1{ font-size:18px; font-weight:700; display:flex; align-items:center; gap:8px; }
.badge-top{ font-family:'JetBrains Mono',monospace; font-size:9px;
            padding:2px 8px; border-radius:12px;
            background:var(--accent-glow); color:var(--accent);
            border:1px solid var(--accent); }
.top-right{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.theme-select{ background:var(--card); border:1px solid var(--border); color:var(--text);
               padding:4px 10px; border-radius:8px; cursor:pointer;
               font-family:'JetBrains Mono',monospace; font-size:11px;
               outline:none; min-width:110px; }
.brand{ background:#F4C01E; border-radius:10px; padding:7px 8px;
        box-shadow:0 2px 6px rgba(0,0,0,.25); display:flex; align-items:center; }
.brand img{ height:31px; width:auto; display:block; }
@media(max-width:640px){ .brand{ display:none; } }

.mode-tabs{ display:flex; gap:4px; background:var(--card);
            border-radius:8px; padding:3px; border:1px solid var(--border); }
.mode-tab{ padding:5px 12px; border-radius:6px; border:none;
           font-family:'JetBrains Mono',monospace; font-size:10px;
           cursor:pointer; transition:all .2s; background:transparent; color:var(--text-dim); }
.mode-tab:hover{ color:var(--text); }
.mode-tab.active{ background:var(--accent-glow); color:var(--accent); }

/* ======================= SECTION TABS — 34 px =======================
   Locked & dimmed outside Simulate mode, NEVER hidden: display:none would
   shrink the chrome and move the canvas by exactly this row's height. */
.sectabs{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
          height:34px; flex:0 0 auto; margin-bottom:6px; }
.sectabs.locked{ opacity:.35; pointer-events:none; }
.sbtn{ display:flex; align-items:center; justify-content:center; gap:6px;
       background:var(--card); border:1px solid var(--border); color:var(--text-dim);
       border-radius:8px; cursor:pointer; font-size:12px; font-weight:600;
       font-family:'Inter',sans-serif; transition:all .18s; padding:0 6px;
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sbtn:hover{ color:var(--text); border-color:var(--accent); }
.sbtn.active{ background:var(--accent-glow); color:var(--accent);
              border-color:var(--accent); box-shadow:0 0 0 1px var(--accent-glow); }

/* ==================== TOOLBAR — two fixed 28 px rows ====================
   Both rows always exist at a fixed height, so nothing below ever moves.  */
.toolbar{ flex:0 0 auto; margin-bottom:6px; }
.trow{ display:flex; align-items:center; gap:6px; height:28px; margin-bottom:4px; }
.trow.locked{ opacity:.35; pointer-events:none; }
.slot{ display:none; align-items:center; gap:6px; }
.slot.on{ display:flex; }
.tgroup{ display:flex; align-items:center; gap:4px; }
.tgroup.hid{ visibility:hidden; }
.tlabel{ font-family:'JetBrains Mono',monospace; font-size:9px;
         color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;
         margin-right:2px; }
.sep{ width:1px; height:16px; background:var(--border); margin:0 4px; flex:0 0 auto; }
.pill{ background:var(--card); border:1px solid var(--border); color:var(--text-dim);
       border-radius:6px; padding:4px 9px; cursor:pointer;
       font-family:'JetBrains Mono',monospace; font-size:10px;
       transition:all .16s; white-space:nowrap; }
.pill:hover{ color:var(--text); border-color:var(--accent); }
.pill.active{ background:var(--accent-glow); color:var(--accent); border-color:var(--accent); }
.pill.locked{ opacity:.32; pointer-events:none; }
.pill.rbtn{ margin-left:auto; }

/* ======================= MAIN — canvas 70 / panel 30 ======================= */
.main{ flex:1 1 auto; display:flex; gap:8px; min-height:0; }
.cvwrap{ flex:1 1 auto; position:relative; min-width:0;
         background:var(--canvas-bg); border:1px solid var(--border);
         border-radius:10px; overflow:hidden; }
canvas{ display:block; width:100%; height:100%; }

/* corner chips — DOM, not canvas text, so they never scale with the drawing
   and the apparatus can never be painted underneath them (TOP_PAD reserves
   the band they live in). A chip with empty text is hidden entirely rather
   than left as an empty bordered box. */
.chip{ position:absolute; background:color-mix(in srgb, var(--card) 90%, transparent);
       border:1px solid var(--border); border-radius:8px;
       padding:6px 10px; font-size:11px; line-height:1.45;
       font-family:'JetBrains Mono',monospace; color:var(--text);
       max-width:46%; pointer-events:none; backdrop-filter:blur(3px); }
#chipInfo{ top:10px; left:10px; }
#chipStatus{ top:10px; right:10px; text-align:right; }
#chipWarn{ top:10px; left:50%; transform:translateX(-50%); color:var(--rose);
           border-color:var(--rose); text-align:center; }
#chipHint{ bottom:10px; right:10px; text-align:right; color:var(--text-dim);
           font-size:10.5px; max-width:56%; }
.chip.hid{ display:none; }

/* =========================== SIDE PANEL — 30 % =========================== */
.panel{ flex:0 0 30%; min-width:290px; max-width:400px;
        background:var(--card); border:1px solid var(--border);
        border-radius:10px; display:flex; flex-direction:column; min-height:0; }
.ptabs{ display:grid; grid-template-columns:repeat(3,1fr); gap:2px;
        padding:6px; border-bottom:1px solid var(--border); flex:0 0 auto; }
.ptab{ background:transparent; border:none; color:var(--text-dim);
       padding:6px 4px; border-radius:6px; cursor:pointer;
       font-size:11px; font-weight:600; font-family:'Inter',sans-serif; transition:all .16s; }
.ptab:hover{ color:var(--text); }
.ptab.active{ background:var(--accent-glow); color:var(--accent); }
.pane{ display:none; padding:10px 12px; overflow-y:auto; flex:1 1 auto; min-height:0; }
.pane.active{ display:block; }

.ptitle{ display:flex; align-items:center; gap:6px;
         font-family:'JetBrains Mono',monospace; font-size:9px;
         text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);
         margin:12px 0 7px; }
.ptitle:first-child{ margin-top:2px; }

.kv{ display:flex; justify-content:space-between; align-items:baseline; gap:8px;
     padding:5px 0; border-bottom:1px solid var(--border); font-size:12px; }
.kv:last-child{ border-bottom:none; }
.kv .k{ color:var(--text-dim); }
.kv .v{ font-family:'JetBrains Mono',monospace; font-weight:600; text-align:right; }
.v-cur{ color:var(--current); } .v-force{ color:var(--force); }
.v-amber{ color:var(--amber); }  .v-n{ color:var(--pole-n); } .v-s{ color:var(--pole-s); }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.card{ background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
.card .cl{ font-size:9px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
.card .cv{ font-size:17px; font-weight:700; font-family:'JetBrains Mono',monospace; }
.card .cu{ font-size:9px; color:var(--text-muted); }

.sliderRow{ margin:9px 0; }
.sliderRow .sl{ display:flex; justify-content:space-between; align-items:baseline;
                font-size:11.5px; margin-bottom:4px; }
.sliderRow .sv{ font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--accent); }
input[type=range]{ width:100%; height:4px; border-radius:2px; appearance:none;
                   background:var(--border); outline:none; cursor:pointer; }
input[type=range]::-webkit-slider-thumb{ appearance:none; width:13px; height:13px;
   border-radius:50%; background:var(--accent); cursor:pointer; border:none; }
input[type=range]::-moz-range-thumb{ width:13px; height:13px; border-radius:50%;
   background:var(--accent); cursor:pointer; border:none; }

.rowbtns{ display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
.mini{ background:var(--bg); border:1px solid var(--border); color:var(--text-dim);
       border-radius:6px; padding:5px 9px; cursor:pointer; font-size:11px;
       font-family:'Inter',sans-serif; transition:all .16s; }
.mini:hover{ color:var(--text); border-color:var(--accent); }
.mini.on{ background:var(--accent-glow); color:var(--accent); border-color:var(--accent); }

.note{ background:var(--bg); border:1px solid var(--border); border-left:3px solid var(--accent);
       border-radius:6px; padding:8px 10px; font-size:11.5px; color:var(--text-dim); line-height:1.5; }
.working{ background:var(--bg); border:1px solid var(--border); border-radius:8px;
          padding:10px 12px; font-size:13px; overflow-x:auto; }
.working .katex{ font-size:1.02em; }

.collapsible{ border:1px solid var(--border); border-radius:8px; margin-bottom:7px; overflow:hidden; }
.collapsible-hdr{ width:100%; text-align:left; background:var(--bg); border:none;
                  color:var(--text); padding:9px 11px; cursor:pointer;
                  font-size:12px; font-weight:600; font-family:'Inter',sans-serif;
                  display:flex; justify-content:space-between; align-items:center; gap:8px; }
.collapsible-hdr:hover{ color:var(--accent); }
.collapsible .chev{ transition:transform .2s; color:var(--text-muted); font-size:10px; }
.collapsible.collapsed .chev{ transform:rotate(-90deg); }
.collapsible .pbody{ padding:0 11px 10px; font-size:11.5px; color:var(--text-dim); line-height:1.6; }
.collapsible.collapsed .pbody{ display:none; }
.collapsible .pbody b{ color:var(--text); }
.collapsible .pbody ul{ margin:5px 0 0 16px; }
.collapsible .pbody li{ margin:3px 0; }

.placeholder{ text-align:center; color:var(--text-muted); padding:34px 14px;
              font-size:12px; line-height:1.7; }
.placeholder .big{ font-size:30px; margin-bottom:8px; }
</style>
</head>

<script>
/* ============================================================================
   part3_model.js — PURE PHYSICS MODEL for 🧲 Motor Effect Lab
   No DOM, no canvas, no globals beyond PHYS. Runs unchanged under plain Node,
   which is how every function below is verified before a single pixel is drawn.

   ---------------------------------------------------------------------------
   THE ONE SIGN CONVENTION (everything in this file and every drawing call site
   derives from this block; nothing anywhere is tabulated by hand)
   ---------------------------------------------------------------------------
   The canvas has y increasing DOWNWARD. The physics is right-handed. Mixing
   those two silently is the single most damaging bug class in a magnetism sim
   — a sign error looks correct in exactly half the test cases — so the
   conversion happens once, here, and is stated explicitly:

     WORLD frame (right-handed, maths convention):
        x̂ = canvas +x   (rightwards on screen)
        ŷ = canvas −y   (UPWARDS on screen — note the flip)
        ẑ = ŷ × ... i.e. OUT of the screen, toward the viewer
     so   canvas.y = −world.Y   and   world.Z = +1 means "out of the page" (⊙).

   DERIVATION 1 — which way B circles a wire.
     Real physics: for current I along +ẑ, B = (μ0 I/2πr) φ̂ with φ̂ = ẑ × r̂.
       • At the point due EAST of the wire, r̂ = x̂, so φ̂ = ẑ × x̂ = +ŷ
         → world +Y → canvas −y → B points UP-SCREEN.
       • At the point due NORTH on screen (canvas −y, i.e. world +Y),
         r̂ = ŷ, so φ̂ = ẑ × ŷ = −x̂ → B points WEST (left).
     EAST→up, NORTH→west is ANTICLOCKWISE as drawn on a y-down canvas.
     ⇒ For dirZ=+1 (⊙, out of page) the field circles ANTICLOCKWISE on screen.
     In canvas components that is the map (dx,dy) → (dy,−dx), which is exactly
     what wireB() below returns. (Check: east, (r,0) → (0,−r) = up. ✓)

   DERIVATION 2 — the force on a current, F = I L × B.
     Current I L along dirZ·ẑ. A canvas field (Bx,By) is world (Bx, −By, 0).
       F = I L dirZ [ ẑ × (Bx x̂ − By ŷ) ]
         = I L dirZ [ Bx(ẑ×x̂) − By(ẑ×ŷ) ]
         = I L dirZ [ Bx ŷ − By(−x̂) ]
         = I L dirZ ( By x̂ + Bx ŷ )                          … in WORLD
       → back to canvas (flip Y):  F_canvas ∝ ( dirZ·By , −dirZ·Bx ).
     ⇒ forceDirOnCurrent() below. Verified against Fleming's left-hand rule:
       uniform B rightwards (Bx>0, By=0) with current out of page (dirZ=+1)
       gives F = (0, −Bx) = UPWARDS on screen. Hold a real left hand up:
       first finger right, second finger toward you, thumb up. ✓

   ONE function, THREE call sites. forceDirOnCurrent() is used for the force
   between parallel wires, the catapult/Fleming force, and the motor's torque
   — so those three can never physically disagree with each other, whatever
   later edits do to the drawing code.
   ========================================================================== */
(function (root) {
  'use strict';

  const MU0 = 4 * Math.PI * 1e-7;      // T·m·A⁻¹, exactly as given to students
  const MU_R_IRON = 500;               // soft-iron core relative permeability
  const M_PER_PX = 1 / 380;            // canvas scale: 380 px ≈ 1 m

  const hyp = (x, y) => Math.hypot(x, y);
  function norm(v) {
    const m = hyp(v.x, v.y);
    return m > 1e-30 ? { x: v.x / m, y: v.y / m } : { x: 0, y: 0 };
  }

  /* ---------------- field of one straight wire ----------------
     (px,py) field point and (wx,wy) wire, both canvas px.
     dirZ = +1 for current OUT of the page (⊙), −1 for INTO it (⊗).
     Returns canvas-frame components + magnitude in tesla.            */
  function wireB(px, py, wx, wy, I, dirZ) {
    const dx = px - wx, dy = py - wy;
    const r = hyp(dx, dy);
    if (r < 1e-9) return { x: 0, y: 0, mag: 0 };
    const rm = r * M_PER_PX;
    const mag = MU0 * Math.abs(I) / (2 * Math.PI * rm);
    // the (dy,−dx) rotation derived in DERIVATION 1 above
    const s = dirZ * Math.sign(I || 1);
    return { x: mag * (dy / r) * s, y: mag * (-dx / r) * s, mag };
  }

  /* superposition over several wires: [{x,y,I,dir}] */
  function wiresB(px, py, wires) {
    let bx = 0, by = 0;
    for (const w of wires) {
      const b = wireB(px, py, w.x, w.y, w.I, w.dir);
      bx += b.x; by += b.y;
    }
    return { x: bx, y: by, mag: hyp(bx, by) };
  }

  /* ---------------- force on a current-carrying conductor ----------------
     Direction only (unit vector, canvas frame). See DERIVATION 2.      */
  function forceDirOnCurrent(dirZ, Bx, By) {
    return norm({ x: dirZ * By, y: -dirZ * Bx });
  }
  /* magnitude: the IGCSE formula, F = BIL (B in T, I in A, L in m) */
  function forceBIL(B, I, L) { return B * I * L; }

  /* force per unit length between two long parallel wires:
     F/L = μ0 I₁ I₂ / (2π d).  Sign is left to forceDirOnCurrent(); this is
     magnitude only. d in canvas px, converted here so every caller uses the
     same scale.                                                        */
  function parallelWiresForcePerLength(I1, I2, dPx) {
    const d = Math.max(1e-6, dPx * M_PER_PX);
    return MU0 * Math.abs(I1) * Math.abs(I2) / (2 * Math.PI * d);
  }

  /* ---------------- solenoid ---------------- */
  function turnsPerMetre(N, lengthPx) { return N / Math.max(1e-9, lengthPx * M_PER_PX); }
  /* B = μ0 n I inside a long solenoid; a soft-iron core multiplies by μr */
  function solenoidB(N, lengthPx, I, hasCore) {
    return MU0 * turnsPerMetre(N, lengthPx) * Math.abs(I) * (hasCore ? MU_R_IRON : 1);
  }
  /* A solenoid modelled honestly as its individual turns, so the field it
     produces is a real superposition rather than a bar-magnet cartoon: each
     turn contributes two wire cross-sections (top and bottom of the winding)
     carrying current in opposite senses. This is what makes the traced lines
     come out looking like a bar magnet WITHOUT anyone drawing a bar magnet. */
  function solenoidWires(cx, cy, lengthPx, radiusPx, N, I, dir) {
    const out = [];
    const n = Math.max(1, Math.round(N));
    for (let i = 0; i < n; i++) {
      // spread turns evenly; a single turn sits at the centre
      const t = n === 1 ? 0.5 : i / (n - 1);
      const x = cx - lengthPx / 2 + t * lengthPx;
      out.push({ x, y: cy - radiusPx, I, dir: dir });     // upper limb
      out.push({ x, y: cy + radiusPx, I, dir: -dir });    // lower limb (returns)
    }
    return out;
  }

  /* ---------------- numerical neutral-point finder ----------------
     Scans |B| along a parametrised path and polishes the best local minimum.
     NEVER hardcoded: a neutral point moves whenever a current or a spacing
     changes, and a hardcoded one is wrong the instant a slider moves.   */
  function findNeutralPointOnPath(fieldFn, pathFn, tMin, tMax, samples) {
    samples = samples || 400;
    let bestT = null, bestV = Infinity;
    for (let i = 0; i <= samples; i++) {
      const t = tMin + (tMax - tMin) * i / samples;
      const p = pathFn(t);
      const b = fieldFn(p.x, p.y);
      if (b.mag < bestV) { bestV = b.mag; bestT = t; }
    }
    if (bestT === null) return null;
    // golden-ish local polish around the best sample
    let lo = bestT - (tMax - tMin) / samples, hi = bestT + (tMax - tMin) / samples;
    for (let k = 0; k < 60; k++) {
      const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
      const p1 = pathFn(m1), p2 = pathFn(m2);
      if (fieldFn(p1.x, p1.y).mag < fieldFn(p2.x, p2.y).mag) hi = m2; else lo = m1;
    }
    const t = (lo + hi) / 2, p = pathFn(t);
    return { x: p.x, y: p.y, mag: fieldFn(p.x, p.y).mag, t };
  }

  /* ---------------- field-line tracing ----------------
     RK2 (midpoint) stepping — a plain Euler step visibly kinks on a curved
     field. Traces BOTH directions from the seed and joins them, because
     tracing only forwards leaves the other half of every open line undrawn
     (invisible on a lopsided source, glaring on a symmetric one).

     IMPORTANT subtlety: if the FORWARD trace alone already closes into a
     loop, the backward trace retraces that same loop, and concatenating the
     two draws the loop twice — roughly doubling its length. So closure is
     checked per-direction and an already-closed direction returns alone. */
  function traceField(fieldFn, sx, sy, opts) {
    opts = opts || {};
    const step = opts.step || 6;
    const maxSteps = opts.maxSteps || 300;
    const closeDist = opts.closeDist || 8;
    const bounds = opts.bounds || { x0: -1e6, y0: -1e6, x1: 1e6, y1: 1e6 };
    const solids = opts.solids || [];

    function march(sign) {
      const pts = [{ x: sx, y: sy }];
      let x = sx, y = sy, closed = false;
      for (let i = 0; i < maxSteps; i++) {
        const b1 = fieldFn(x, y);
        if (!(b1.mag > 1e-30)) break;
        const u1 = { x: b1.x / b1.mag * sign, y: b1.y / b1.mag * sign };
        // midpoint sample
        const mx = x + u1.x * step * 0.5, my = y + u1.y * step * 0.5;
        const b2 = fieldFn(mx, my);
        if (!(b2.mag > 1e-30)) break;
        const u2 = { x: b2.x / b2.mag * sign, y: b2.y / b2.mag * sign };
        x += u2.x * step; y += u2.y * step;
        if (x < bounds.x0 || x > bounds.x1 || y < bounds.y0 || y > bounds.y1) break;
        let hitSolid = false;
        for (const s of solids) if (s.contains(x, y)) { hitSolid = true; break; }
        if (hitSolid) break;
        pts.push({ x, y });
        // closure is detected EMPIRICALLY from the endpoint distance, never
        // pre-classified from a derived "neutral radius" — such a heuristic
        // goes to infinity at zero current and then declares every seed
        // closed, silently breaking every line on that frame.
        if (i > 8 && hyp(x - sx, y - sy) < closeDist) {
          /* Land the last point EXACTLY on the seed. Stopping merely "within
             closeDist" leaves a hole of up to that distance in the middle of
             an otherwise unbroken loop — and because the seed sits at the apex
             of the arc, that hole lands exactly where the eye goes. This is
             what read as "the field lines are broken". */
          pts.push({ x: sx, y: sy });
          closed = true; break;
        }
      }
      return { pts, closed };
    }

    const fwd = march(1);
    if (fwd.closed) return { pts: fwd.pts, closed: true };
    const bwd = march(-1);
    if (bwd.closed) return { pts: bwd.pts.slice().reverse(), closed: true };
    const pts = bwd.pts.slice().reverse().concat(fwd.pts.slice(1));
    return { pts, closed: false };
  }

  function polyLen(pts) {
    let L = 0;
    for (let i = 1; i < pts.length; i++) L += hyp(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    return L;
  }

  /* Deduplicate near-identical traced curves. The tolerance is LENGTH-SCALED,
     not flat: a flat tolerance tuned for long loops also merges two genuinely
     different short arcs running 15–20 px apart, silently deleting one side
     of a mirrored pair. */
  function dedupeCurves(curves, maxTol) {
    /* maxTol caps the length-scaled tolerance. The default suits families
       seeded far apart; a family seeded DELIBERATELY close together (to show
       lines crowding where the field is strong) needs a small cap, or the
       crowding is deduped away and the picture goes back to evenly spaced. */
    maxTol = maxTol == null ? 26 : maxTol;
    const kept = [];
    for (const c of curves) {
      if (!c || !c.pts || c.pts.length < 3) continue;
      const L = polyLen(c.pts);
      if (L < 12) continue;
      const tol = Math.max(Math.min(6, maxTol), Math.min(maxTol, 0.12 * L));
      let dup = false;
      for (const k of kept) {
        const a = c.pts[Math.floor(c.pts.length / 2)];
        const b = k.pts[Math.floor(k.pts.length / 2)];
        const e1 = c.pts[0], f1 = k.pts[0];
        if (hyp(a.x - b.x, a.y - b.y) < tol && hyp(e1.x - f1.x, e1.y - f1.y) < tol * 1.6) { dup = true; break; }
      }
      if (!dup) kept.push(c);
    }
    return kept;
  }

  /* Seed a field-line family by EQUAL FLUX, not equal spacing. Equal spacing
     draws the same number of lines through a strong region and a weak one,
     defeating the "lines closer together = stronger field" teaching point the
     diagram exists to make. Walk a probe line integrating ∫|B|·dl and drop a
     seed every 1/N of the total.                                        */
  function equalFluxSeeds(fieldFn, p0, p1, N) {
    const M = 400;
    const dx = (p1.x - p0.x) / M, dy = (p1.y - p0.y) / M;
    const dl = hyp(dx, dy);
    const cum = [0];
    let tot = 0;
    for (let i = 1; i <= M; i++) {
      const x = p0.x + dx * i, y = p0.y + dy * i;
      tot += fieldFn(x, y).mag * dl;
      cum.push(tot);
    }
    const seeds = [];
    if (!(tot > 0)) return seeds;
    for (let k = 1; k <= N; k++) {
      const target = tot * (k - 0.5) / N;
      let i = 1;
      while (i < M && cum[i] < target) i++;
      seeds.push({ x: p0.x + dx * i, y: p0.y + dy * i });
    }
    return seeds;
  }

  /* ---------------- D.C. motor ----------------
     theta = angle of the COIL PLANE away from the field direction, which is
     the convention the spec's own reading asks for: torque = B I A N cos θ.

       θ = 0    → the coil plane lies ALONG B. Seen end-on the coil is a
                  horizontal line, its two sides side by side. The two forces
                  (one up, one down) act at full lever arm → MAXIMUM couple.
       θ = 90°  → the coil plane is at right angles to B. Seen end-on the coil
                  is VERTICAL, its two sides stacked one above the other, so
                  the two forces act in line with each other and have no
                  turning effect → the DEAD SPOT. This is exactly the position
                  the spec describes the coil stalling in without a
                  commutator ("swings to the vertical and stalls").

     WITHOUT a commutator the couple is N B I A cos θ: it genuinely changes
     sign through the dead spot, so the coil swings up to vertical and stops.
     WITH a split-ring commutator the current in each side reverses every half
     turn, rectifying the couple to N B I A |cos θ| — one constant sign, so it
     never stalls.

     THE SPLIT RING follows from the same expression: the gap lies along
     θ + 90°, so it sweeps past the two fixed brushes exactly at θ = 90° and
     270° — the dead spots — and the polarity delivered to each coil side
     therefore flips with sign(cos θ). One expression drives the physics, the
     current glyphs and the enlarged inset alike.                          */
  function motorTorque(theta, I, B, area, turns, commutatorOn, dirI0, dirB0) {
    const c = Math.cos(theta);
    const magPart = commutatorOn ? Math.abs(c) : c;
    return turns * B * I * area * magPart * (dirI0 || 1) * (dirB0 || 1);
  }
  /* the commutator's rectifying factor — the ONE place this sign is decided */
  function commFactor(theta, commutatorOn) {
    return commutatorOn ? (Math.sign(Math.cos(theta)) || 1) : 1;
  }
  /* The two coil-side offsets from the axle, in canvas px. Shared by every
     view so the end-on and 3-D pictures are the same object. sidePos1 = ±1.
     Increasing theta rotates ANTICLOCKWISE on the y-down canvas, matching the
     sign of motorTorque (see the rotation note in the section module).    */
  function coilSideOffset(theta, r, sidePos1) {
    return { x: sidePos1 * r * Math.cos(theta), y: -sidePos1 * r * Math.sin(theta) };
  }

  /* ---------------- number formatting ----------------
     ONE formatter per quantity, so the canvas, the corner chips and the side
     panel can never print different units for the same number.          */
  function fmtB(T) {
    const a = Math.abs(T);
    if (a === 0) return '0 T';
    if (a >= 1) return T.toFixed(2) + ' T';
    if (a >= 1e-3) return (T * 1e3).toFixed(2) + ' mT';
    if (a >= 1e-6) return (T * 1e6).toFixed(2) + ' µT';
    return (T * 1e9).toFixed(2) + ' nT';
  }
  function fmtF(N) {
    const a = Math.abs(N);
    if (a === 0) return '0 N';
    if (a >= 1) return N.toFixed(2) + ' N';
    if (a >= 1e-3) return (N * 1e3).toFixed(2) + ' mN';
    if (a >= 1e-6) return (N * 1e6).toFixed(2) + ' µN';
    return (N * 1e9).toFixed(2) + ' nN';
  }
  function fmtNum(v, unit) { return v.toFixed(2) + (unit ? ' ' + unit : ''); }

  const PHYS = {
    MU0, MU_R_IRON, M_PER_PX,
    hyp, norm,
    wireB, wiresB,
    forceDirOnCurrent, forceBIL, parallelWiresForcePerLength,
    turnsPerMetre, solenoidB, solenoidWires,
    findNeutralPointOnPath, traceField, polyLen, dedupeCurves, equalFluxSeeds,
    motorTorque, commFactor, coilSideOffset,
    fmtB, fmtF, fmtNum
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = PHYS;
  root.PHYS = PHYS;
})(typeof globalThis !== 'undefined' ? globalThis : this);
/* ============================================================================
   part4_app.js — shared app infrastructure for Motor Effect Lab v3.
   Sections register themselves into SEC{}; this file never knows what is
   inside a section, it only calls the methods every section promises.
   ========================================================================== */
'use strict';

const $ = id => document.getElementById(id);
const W = 1200, H = 675;
/* Logical band kept clear at the top of the canvas — about three text lines —
   so the DOM corner chips never sit on the apparatus (spec 2.3). The scene is
   PINNED below it, never vertically centred. */
const TOP_PAD = 62;
const TAU = Math.PI * 2;

const SEC = {};

const S = {
  theme: '', mode: 'sim', sec: 'field',
  show: { compass: true, labels: true, hints: true, flow: true },
  anim: true, sound: true, speed: 1,
  t: 0, lastTs: 0,
  /* zoom has NO toolbar button in v3 — it is a canvas double-click only */
  zoom: { k: 1, ox: 0, oy: 0, panning: false, px: 0, py: 0 },
  pointer: { x: 0, y: 0, on: false }
};

/* ---------------- theme / palette ---------------- */
let PAL = {};
function readPalette() {
  const cs = getComputedStyle(document.body);
  const g = n => cs.getPropertyValue(n).trim();
  PAL = {
    bg: g('--canvas-bg'), grid: g('--grid'), text: g('--text'),
    textDim: g('--text-dim'), textMuted: g('--text-muted'),
    border: g('--border'), accent: g('--accent'), card: g('--card'),
    poleN: g('--pole-n'), poleS: g('--pole-s'), fieldLine: g('--field-line'),
    current: g('--current'), force: g('--force'), wire: g('--wire'),
    neutral: g('--neutral-pt'), compass: g('--compass'),
    metal: g('--metal'), metalHi: g('--metal-hi'), iron: g('--iron'),
    steel: g('--steel'), insul: g('--insul'), coilwire: g('--coilwire'),
    green: g('--green'), rose: g('--rose'), violet: g('--violet'),
    amber: g('--amber'), blue: g('--blue'), orange: g('--orange')
  };
}
function setTheme(cls) {
  document.body.className = cls || '';
  S.theme = cls || '';
  readPalette();
  try { localStorage.setItem('motorlab3-theme', cls || ''); } catch (e) {}
}

/* ---------------- view transform ---------------- */
const CV = () => $('cv');
const VT = { s: 1, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0 };
function resize() {
  const r = $('cvwrap').getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const c = CV();
  c.width = Math.max(1, Math.round(r.width * dpr));
  c.height = Math.max(1, Math.round(r.height * dpr));
  /* Fit into what is left BELOW the chip band, then PIN there — centring the
     (band + drawing) block leaves a strip of dead space above the apparatus
     whenever width is the limiting dimension, which it usually is. */
  const s = Math.min(r.width / W, Math.max(40, r.height - TOP_PAD) / H);
  VT.s = s; VT.ox = (r.width - W * s) / 2; VT.oy = TOP_PAD;
  VT.dpr = dpr; VT.cw = r.width; VT.ch = r.height;
  draw();
}
/* Screen → logical, inverting the WHOLE chain (letterbox, then magnifier), so
   a zoomed canvas can never desynchronise a click from what is drawn. */
function toLogical(clientX, clientY) {
  const r = CV().getBoundingClientRect();
  const sx = (clientX - r.left - VT.ox) / VT.s;
  const sy = (clientY - r.top - VT.oy) / VT.s;
  const z = S.zoom;
  return { x: (sx - z.ox) / z.k, y: (sy - z.oy) / z.k };
}
function clampPan() {
  const z = S.zoom;
  z.ox = Math.min(0, Math.max(W * (1 - z.k), z.ox));
  z.oy = Math.min(0, Math.max(H * (1 - z.k), z.oy));
}
function setZoom(k, L) {
  const z = S.zoom;
  if (k <= 1) { z.k = 1; z.ox = 0; z.oy = 0; }
  else {
    const old = z.k, Lx = L ? L.x : W / 2, Ly = L ? L.y : H / 2;
    z.ox = z.ox + old * Lx - k * Lx;
    z.oy = z.oy + old * Ly - k * Ly;
    z.k = k; clampPan();
  }
  draw();
}
const resetZoom = () => setZoom(1);

/* ---------------- drawing primitives ---------------- */
function line(ctx, x0, y0, x1, y1, o) {
  o = o || {}; ctx.save();
  ctx.strokeStyle = o.col || PAL.text;
  ctx.lineWidth = o.lw || 1.5;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.cap) ctx.lineCap = o.cap;
  ctx.globalAlpha = o.alpha != null ? o.alpha : 1;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.restore();
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
/* The plated caption style used throughout the reference images: a rounded
   dark plate behind bold coloured text, so a caption stays readable wherever
   a field line happens to run under it. */
function txt(ctx, s, x, y, o) {
  o = o || {}; ctx.save();
  ctx.font = (o.weight || 500) + ' ' + (o.size || 12) + 'px ' +
             (o.mono ? "'JetBrains Mono',monospace" : "'Inter',sans-serif");
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.globalAlpha = o.alpha != null ? o.alpha : 1;
  if (o.plate) {
    const m = ctx.measureText(s), pw = m.width + 14, ph = (o.size || 12) + 11;
    let px = x - pw / 2;
    if (ctx.textAlign === 'left') px = x - 7;
    if (ctx.textAlign === 'right') px = x - pw + 7;
    ctx.save();
    ctx.globalAlpha = 0.88; ctx.fillStyle = PAL.card;
    rr(ctx, px, y - ph / 2, pw, ph, 6); ctx.fill();
    ctx.globalAlpha = 0.55; ctx.strokeStyle = PAL.border; ctx.lineWidth = 1;
    rr(ctx, px, y - ph / 2, pw, ph, 6); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = o.col || PAL.text;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function headAt(ctx, x, y, ang, size, col) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = col || PAL.text;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(-size, size * 0.52); ctx.lineTo(-size, -size * 0.52);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function arrow(ctx, x0, y0, x1, y1, o) {
  o = o || {};
  const col = o.col || PAL.text, hs = o.head || 9;
  const ang = Math.atan2(y1 - y0, x1 - x0);
  if (Math.hypot(x1 - x0, y1 - y0) < 0.5) return;
  const bx = x1 - Math.cos(ang) * hs * 0.85, by = y1 - Math.sin(ang) * hs * 0.85;
  line(ctx, x0, y0, bx, by, { col, lw: o.lw || 2, alpha: o.alpha, cap: 'round' });
  ctx.save(); ctx.globalAlpha = o.alpha != null ? o.alpha : 1;
  headAt(ctx, x1, y1, ang, hs, col);
  ctx.restore();
}
/* Draw a traced polyline with N arrowheads spaced by ARC LENGTH — a field
   line traced at a fixed step has its points bunched where it curves, so
   index-spacing would put every head in the same corner. */
function paintLine(ctx, pts, o) {
  if (!pts || pts.length < 2) return;
  o = o || {};
  ctx.save();
  ctx.strokeStyle = o.col || PAL.fieldLine;
  ctx.lineWidth = o.lw || 1.6;
  ctx.globalAlpha = o.alpha != null ? o.alpha : 1;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.restore();

  const heads = o.heads || 0;
  if (heads <= 0) return;
  const seg = []; let total = 0;
  for (let i = 1; i < pts.length; i++) {
    total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    seg.push(total);
  }
  if (!(total > 0)) return;
  ctx.save(); ctx.globalAlpha = o.alpha != null ? o.alpha : 1;
  for (let k = 0; k < heads; k++) {
    const want = total * (k + 0.5) / heads;
    let i = 0;
    while (i < seg.length - 1 && seg[i] < want) i++;
    const a = pts[i], b = pts[i + 1] || pts[i];
    headAt(ctx, b.x, b.y, Math.atan2(b.y - a.y, b.x - a.x), o.headSize || 6, o.col || PAL.fieldLine);
  }
  ctx.restore();
}
/* The ⊙ / ⊗ conductor glyph, styled as in the reference images: a copper
   ring with a dark core, an orange dot for current OUT and an orange cross
   for current IN. dirZ = +1 means out of the page. */
function wireGlyph(ctx, x, y, r, dirZ, col) {
  ctx.save();
  ctx.fillStyle = PAL.bg;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = col || PAL.current; ctx.lineWidth = Math.max(2, r * 0.20);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  if (dirZ > 0) {
    ctx.fillStyle = PAL.current;
    ctx.beginPath(); ctx.arc(x, y, r * 0.30, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = PAL.current; ctx.lineWidth = Math.max(2, r * 0.20);
    const d = r * 0.58;
    ctx.beginPath();
    ctx.moveTo(x - d, y - d); ctx.lineTo(x + d, y + d);
    ctx.moveTo(x + d, y - d); ctx.lineTo(x - d, y + d);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- conductor rod ----------------
   A single THICK rod rather than two thin lines: shaded like a cylinder, with
   a dark outline and a specular highlight, so it reads as a solid metal
   object. That matters because the conductor and the conventional-current
   arrow were previously near-identical strokes in near-identical copper and
   orange, and could not be told apart. Now the wire is a dark chunky rod and
   the current is bright orange marks travelling ALONG it. */
function drawConductor(ctx, x0, y0, x1, y1, width) {
  const w = width || 13;
  const ang = Math.atan2(y1 - y0, x1 - x0);
  const nx = -Math.sin(ang), ny = Math.cos(ang);     // unit normal
  ctx.save();
  ctx.lineCap = 'round';
  // dark outline
  ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = w + 4;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  // cylindrical body: dark at the edges, copper along the middle
  const gr = ctx.createLinearGradient(x0 + nx * w / 2, y0 + ny * w / 2,
                                      x0 - nx * w / 2, y0 - ny * w / 2);
  gr.addColorStop(0, 'rgba(0,0,0,.55)');
  gr.addColorStop(0.42, PAL.wire);
  gr.addColorStop(0.62, PAL.wire);
  gr.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.strokeStyle = gr; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  /* Darken the whole rod. The conductor and the conventional-current marks
     are both warm colours by spec (--wire copper, --current orange, and both
     are FIXED printed-reference colours that must not be redefined), so the
     only honest way to separate them is tone: the metal is dark and matte,
     the current is bright and glowing. */
  ctx.strokeStyle = 'rgba(0,0,0,.34)'; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  // specular highlight, offset toward one edge
  ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = Math.max(1.5, w * 0.16);
  ctx.beginPath();
  ctx.moveTo(x0 + nx * w * 0.26, y0 + ny * w * 0.26);
  ctx.lineTo(x1 + nx * w * 0.26, y1 + ny * w * 0.26);
  ctx.stroke();
  ctx.restore();
}

/* Stroke a WHOLE polyline as one conductor. Drawing each leg as its own
   call leaves a visible step or gap at every corner, because each stroke has
   its own caps; one path with round joins cannot come apart. */
function drawConductorPath(ctx, pts, width) {
  if (!pts || pts.length < 2) return;
  const w = width || 11;
  const trace = () => {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  };
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = w + 4; trace(); ctx.stroke();
  ctx.strokeStyle = PAL.wire; ctx.lineWidth = w; trace(); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.34)'; ctx.lineWidth = w; trace(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = Math.max(1.4, w * 0.16);
  trace(); ctx.stroke();
  ctx.restore();
}

/* Draw a whole NETWORK of conductors in ordered passes: every dark outline
   first, then every copper core, then the darkening, then the highlights.
   Stroking each run start-to-finish instead lets a later run's dark outline
   be painted across an earlier run's copper core at a junction — which reads
   as a GAP in the wire even though the geometry meets perfectly. Passes make
   that impossible: no outline can ever sit on top of a core.
   runs = [{ pts:[{x,y}...], w:Number }, ...] */
function drawConductorNetwork(ctx, runs) {
  if (!runs || !runs.length) return;
  const widths = [...new Set(runs.map(r => r.w))];
  const traceGroup = w => {
    ctx.beginPath();
    for (const r of runs) {
      if (r.w !== w || !r.pts || r.pts.length < 2) continue;
      ctx.moveTo(r.pts[0].x, r.pts[0].y);
      for (let i = 1; i < r.pts.length; i++) ctx.lineTo(r.pts[i].x, r.pts[i].y);
    }
  };
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const pass of [
    { col: 'rgba(0,0,0,.65)', d: 4 },
    { col: PAL.wire, d: 0 },
    { col: 'rgba(0,0,0,.34)', d: 0 }
  ]) {
    for (const w of widths) {
      ctx.strokeStyle = pass.col; ctx.lineWidth = w + pass.d;
      traceGroup(w); ctx.stroke();
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.20)';
  for (const w of widths) {
    ctx.lineWidth = Math.max(1.4, w * 0.15);
    traceGroup(w); ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- conventional-current flow ----------------
   Bright marks travelling along an ordered path, + terminal → − terminal.
   The path is supplied by the caller as the real circuit polyline, so the
   animation cannot flow anywhere the current does not actually go. */
function drawFlowAlong(ctx, pts, phase, opts) {
  if (!pts || pts.length < 2) return;
  opts = opts || {};
  const seg = [], n = pts.length;
  let total = 0;
  for (let i = 1; i < n; i++) {
    total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    seg.push(total);
  }
  if (!(total > 0)) return;
  const spacing = opts.spacing || 62;
  const count = Math.max(2, Math.floor(total / spacing));
  const at = d => {
    const t = ((d % total) + total) % total;
    let i = 0;
    while (i < seg.length - 1 && seg[i] < t) i++;
    const prev = i === 0 ? 0 : seg[i - 1];
    const f = (t - prev) / Math.max(1e-6, seg[i] - prev);
    const a = pts[i], b = pts[i + 1] || pts[i];
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f,
             ang: Math.atan2(b.y - a.y, b.x - a.x) };
  };
  /* small round dots rather than arrowheads: the direction is already
     carried by the labelled current arrow and by the dots' motion, and round
     marks read as "charge moving along the wire" rather than as another set
     of vectors competing with the force and field arrows */
  const r = opts.size || 2.8;
  ctx.save();
  for (let k = 0; k < count; k++) {
    const p = at(total * k / count + phase * total);
    ctx.save();
    ctx.shadowColor = PAL.current; ctx.shadowBlur = 6;
    ctx.fillStyle = PAL.current;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ---------------- plotting compass ----------------
   Matches the reference images: a metal body with a lighter rim and tick
   marks round the dial, and a two-tone lens-shaped needle (red north, white
   south). Modelled as a real damped oscillator so it swings and settles
   rather than snapping, and greyed out when there is genuinely no field. */
function stepCompass(c, target, hasField, dt) {
  if (!hasField || !(dt > 0)) return;
  let err = target - c.ang;
  while (err > Math.PI) err -= TAU;
  while (err < -Math.PI) err += TAU;
  c.w = (c.w || 0) + err * 62 * dt;
  c.w *= Math.exp(-7.5 * dt);
  c.ang += c.w * dt;
}
function drawCompass(ctx, x, y, r, c, hasField) {
  ctx.save();
  // body
  const g = ctx.createRadialGradient(x - r * .32, y - r * .32, r * .12, x, y, r);
  g.addColorStop(0, PAL.metalHi); g.addColorStop(1, PAL.compass);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = PAL.metal; ctx.lineWidth = Math.max(1.2, r * 0.09);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  // dark dial face
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.arc(x, y, r * 0.80, 0, TAU); ctx.fill();
  // tick marks round the dial
  if (r >= 12) {
    ctx.strokeStyle = PAL.metalHi; ctx.lineWidth = 1;
    ctx.globalAlpha = .75;
    for (let i = 0; i < 8; i++) {
      const a = i * TAU / 8;
      const r0 = r * 0.80, r1 = r * (i % 2 === 0 ? 0.60 : 0.70);
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0);
      ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (!hasField) {
    ctx.globalAlpha = .5;
    ctx.strokeStyle = PAL.textMuted; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - r * .5, y); ctx.lineTo(x + r * .5, y);
    ctx.stroke();
    ctx.restore();
    return;
  }
  // lens-shaped two-tone needle
  ctx.translate(x, y); ctx.rotate(c.ang);
  const L = r * 0.74, w = r * 0.22;
  ctx.fillStyle = PAL.poleN;
  ctx.beginPath();
  ctx.moveTo(L, 0); ctx.quadraticCurveTo(0, -w, -L * 0.10, 0);
  ctx.quadraticCurveTo(0, w, L, 0); ctx.fill();
  ctx.fillStyle = '#f2f4f8';
  ctx.beginPath();
  ctx.moveTo(-L, 0); ctx.quadraticCurveTo(0, -w, -L * 0.10, 0);
  ctx.quadraticCurveTo(0, w, -L, 0); ctx.fill();
  ctx.fillStyle = PAL.metal;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.11, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ---------------- hover-to-toggle helper ----------------
   Spec 4.1.a: hovering the pointer over the switch for 3 s toggles it, and
   keeps toggling every 3 s while the pointer stays there; leaving resets the
   timer. Kept as ONE reusable object so the progress ring the switch draws
   and the timer that fires can never disagree about how far along it is. */
function makeHoverToggle(seconds, onFire) {
  return {
    t: 0, seconds, inside: false,
    /* call every frame with whether the pointer is currently over the target */
    update(isInside, dt) {
      if (!isInside) { this.inside = false; this.t = 0; return; }
      this.inside = true;
      this.t += dt;
      if (this.t >= this.seconds) { this.t = 0; onFire(); }
    },
    progress() { return this.inside ? Math.min(1, this.t / this.seconds) : 0; }
  };
}
/* the ring the switch shows while the pointer dwells on it */
function drawHoverRing(ctx, x, y, r, p) {
  if (p <= 0) return;
  ctx.save();
  ctx.strokeStyle = PAL.border; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * p); ctx.stroke();
  ctx.restore();
  txt(ctx, 'hold…', x, y + r + 12, { col: PAL.accent, size: 9.5, weight: 700 });
}

/* ---------------- sound: ONE master gate ---------------- */
let AC = null;
function tone(freq, dur, type, vol) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.05, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) { /* audio unavailable — never let this break the sim */ }
}
const clickSnd = () => tone(880, 0.05, 'square', 0.04);
function clunk() { tone(150, 0.09, 'square', 0.07); setTimeout(() => tone(90, 0.11, 'square', 0.06), 55); }
const thunk = () => tone(230, 0.13, 'triangle', 0.06);

/* ---------------- corner chips ---------------- */
function setChip(id, html) {
  const el = $(id);
  if (!el) return;
  el.innerHTML = html || '';
  el.classList.toggle('hid', !html);       // empty chip hidden, not an empty box
}
function setChips(info, status, warn, hint) {
  setChip('chipInfo', info); setChip('chipStatus', status);
  setChip('chipWarn', warn); setChip('chipHint', S.show.hints ? hint : '');
}

/* ---------------- side-panel builders ---------------- */
const sectionTitle = (icon, label) => '<div class="ptitle">' + icon + ' ' + label + '</div>';
const kvHTML = (k, v, cls, id) =>
  '<div class="kv"><span class="k">' + k + '</span><span class="v ' + (cls || '') + '"' +
  (id ? ' id="' + id + '"' : '') + '>' + v + '</span></div>';
const cardHTML = (label, val, unit, id) =>
  '<div class="card"><div class="cl">' + label + '</div><div class="cv"' +
  (id ? ' id="' + id + '"' : '') + '>' + val + '</div><div class="cu">' + (unit || '') + '</div></div>';
function sliderHTML(id, label, val, o) {
  return '<div class="sliderRow"><div class="sl"><span>' + label +
    '</span><span class="sv" id="' + id + 'Val">' + val + (o.unit || '') + '</span></div>' +
    '<input type="range" id="' + id + '" min="' + o.min + '" max="' + o.max +
    '" step="' + o.step + '" value="' + o.value + '"></div>';
}
function bindSlider(id, onInput, unit, fmt) {
  const el = $(id);
  if (!el) return;
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    const lab = $(id + 'Val');
    if (lab) lab.textContent = (fmt ? fmt(v) : v) + (unit || '');
    onInput(v);
  });
}
function makeCollapsible(root) {
  root.querySelectorAll('.collapsible-hdr').forEach(h => {
    h.setAttribute('aria-expanded', String(!h.parentElement.classList.contains('collapsed')));
    h.onclick = () => {
      const c = h.parentElement;
      c.classList.toggle('collapsed');
      h.setAttribute('aria-expanded', String(!c.classList.contains('collapsed')));
      persistCollapse();
    };
  });
  restoreCollapse(root);
}
function persistCollapse() {
  const st = {};
  document.querySelectorAll('.collapsible').forEach(c => { if (c.id) st[c.id] = c.classList.contains('collapsed'); });
  try { localStorage.setItem('motorlab3-collapse', JSON.stringify(st)); } catch (e) {}
}
function restoreCollapse(root) {
  let st = {};
  try { st = JSON.parse(localStorage.getItem('motorlab3-collapse') || '{}'); } catch (e) {}
  root.querySelectorAll('.collapsible').forEach(c => {
    if (c.id && st[c.id]) {
      c.classList.add('collapsed');
      const h = c.querySelector('.collapsible-hdr');
      if (h) h.setAttribute('aria-expanded', 'false');
    }
  });
}
/* KaTeX with a plain-text TWIN: if the CDN is unreachable the panel must
   still teach. The plain string renders immediately and is only replaced if
   KaTeX actually loaded. */
function mathLine(tex, plain) {
  const id = 'kx' + Math.random().toString(36).slice(2, 9);
  setTimeout(() => {
    const el = $(id);
    if (!el) return;
    if (window.katex) {
      try { window.katex.render(tex, el, { throwOnError: false, displayMode: false }); return; } catch (e) {}
    }
    el.textContent = plain;
  }, 0);
  return '<div id="' + id + '" style="margin:6px 0">' + plain + '</div>';
}

/* ---------------- draw / update dispatch ---------------- */
/* GUARD: draw() is reachable before boot() has run, because each section
   module calls its own reset() at parse time. Painting then would use an
   empty PAL and an unsized canvas, and a gradient handed `undefined` throws —
   at parse time that aborts the REST of the script and the whole app fails to
   load silently. One cheap check makes the file immune to that ordering. */
let BOOTED = false;
function draw() {
  if (!BOOTED || !PAL.bg) return;
  const ctx = CV().getContext('2d');
  ctx.setTransform(VT.dpr, 0, 0, VT.dpr, 0, 0);
  ctx.clearRect(0, 0, VT.cw, VT.ch);
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0, 0, VT.cw, VT.ch);
  ctx.translate(VT.ox, VT.oy);
  ctx.scale(VT.s, VT.s);
  ctx.save();
  /* Clip in the UN-zoomed space so the clip always covers the whole canvas;
     applying it after the magnifier would make the clip pan with the content
     and stop covering the view the moment it is panned. */
  ctx.beginPath();
  ctx.rect(-VT.ox / VT.s, -VT.oy / VT.s, VT.cw / VT.s, VT.ch / VT.s);
  ctx.clip();
  ctx.translate(S.zoom.ox, S.zoom.oy);
  ctx.scale(S.zoom.k, S.zoom.k);
  const mod = SEC[S.sec];
  if (mod && mod.draw) mod.draw(ctx);
  ctx.restore();
}
/* NOTE: tick() does NOT schedule its own frame — the single rAF loop lives in
   part9_boot.js so tick() and maybePatchPanel() share exactly one callback
   per frame rather than two competing ones. */
function tick(ts) {
  if (!S.lastTs) S.lastTs = ts;
  let dt = (ts - S.lastTs) / 1000;
  S.lastTs = ts;
  // clamp BOTH ends: a first rAF timestamp predating lastTs gives a negative
  // dt, which silently corrupts anything derived from an accumulated clock
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  if (S.anim) {
    const dtEff = dt * S.speed;
    S.t += dtEff;
    const mod = SEC[S.sec];
    if (mod && mod.update) mod.update(dtEff, dt);
  }
  draw();
}
/* ============================================================================
   SECTION 1 — 🧭 Magnetic Field & Force
   Oersted's discovery, then the force between two parallel wires.

   ---------------------------------------------------------------------------
   THE TWO VIEWS ARE ONE PROJECTION APART (spec 3.1 / 4.1.b / 4.1.d)
   ---------------------------------------------------------------------------
   The wire runs VERTICALLY, so its field lines are horizontal circles.
     Bird-eye view = looking straight down those circles: true circles.
     Side view     = the same horizontal plane seen edge-on: the SAME curves,
                     squashed vertically by SQUASH about the plane's y.
   The side view therefore does not re-derive anything — it maps the bird-eye
   curves through projectSide(). That is what makes "line count and spacing
   match 1:1" true by construction rather than by careful matching, and it is
   why a student switching views is looking at one object from two directions.
   ========================================================================== */
(function () {

  const F = {
    study: 'wire',              // wire | pair
    view: 'side',               // side | bird   — SIDE IS THE DEFAULT (spec 4.1)
    switchOn: true,             // starts CLOSED, by request — see reset()
    revI: 1, I: 3,
    I1: 3, I2: 3, dir1: 1, dir2: 1, gap: 170,
    freeCompass: { x: 962, y: 250 }, freeAng: 0, _freeW: 0,
    sideAngs: null, _sideW: null, birdAngs: null, _birdW: null,
    gripOn: false, gripPos: { x: 1046, y: 404 }, flowPhase: 0,
    graphPos: { x: 214, y: 540 },
    dragging: null
  };

  /* ---------------- single source of geometry ---------------- */
  const WIRE_X = 520, PLANE_Y = 300;         // shared by BOTH views
  const WIRE_TOP = 96, WIRE_BOT = 470;
  const SQUASH = 0.30;                        // edge-on foreshortening
  const COMPASS_R = 138, BIRD_N = 8;

  /* Ring radii grow geometrically (×1.45) — roughly equal FLUX per ring
     rather than equal spacing, so the circles crowd near the wire the way the
     real field does (B ∝ 1/r). ONE list, read by both views. */
  const RING_RADII = (() => {
    const out = [];
    for (let i = 1; i <= 6; i++) {
      const r = 30 * Math.pow(1.45, i - 1);
      if (r > 214) break;
      out.push(r);
    }
    return out;
  })();

  function wireGeom() { return { x: WIRE_X, y: PLANE_Y, top: WIRE_TOP, bot: WIRE_BOT }; }
  function pairGeom() {
    const cx = 560, y = PLANE_Y;
    return { cx, y, w1: { x: cx - F.gap / 2, y }, w2: { x: cx + F.gap / 2, y } };
  }
  /* bird-eye (x,y) → side view (x,y). The ONE projection both views share. */
  const projectSide = p => ({ x: p.x, y: PLANE_Y + (p.y - PLANE_Y) * SQUASH });

  function fieldFn_single(x, y) {
    if (!F.switchOn) return { x: 0, y: 0, mag: 0 };
    return PHYS.wireB(x, y, WIRE_X, PLANE_Y, F.I, F.revI);
  }
  const pairWires = () => {
    const g = pairGeom();
    return [
      { x: g.w1.x, y: g.w1.y, I: F.I1, dir: F.dir1 },
      { x: g.w2.x, y: g.w2.y, I: F.I2, dir: F.dir2 }
    ];
  };
  const fieldFn_pair = (x, y) => PHYS.wiresB(x, y, pairWires());
  const sameDirection = () => F.dir1 === F.dir2;

  /* the 3-second hover toggle on the switch (spec 4.1.a) */
  const hoverSwitch = makeHoverToggle(3, () => {
    F.switchOn = !F.switchOn;
    clunk();
    SEC.field.syncToolbar();
  });

  function reset() {
    /* The switch starts CLOSED so the field is on the moment the section
       opens. This deliberately overrides spec rule 4 ("switch default =
       OPEN") at the user's request: the field lines and the deflected
       compasses are the point of the picture, and starting dead meant every
       visit began with an empty diagram. The OPEN state is still one click
       (or one 3-second hover) away, so Oersted's experiment can still be run
       from the beginning. */
    F.study = 'wire'; F.view = 'side'; F.switchOn = true; F.revI = 1;
    F.I = 3; F.I1 = 3; F.I2 = 3; F.dir1 = 1; F.dir2 = 1; F.gap = 170;
    F.freeCompass = { x: 962, y: 250 }; F.freeAng = 0; F._freeW = 0;
    F.sideAngs = [0, 0, 0]; F._sideW = [0, 0, 0];
    F.birdAngs = new Array(BIRD_N).fill(0); F._birdW = new Array(BIRD_N).fill(0);
    F.gripOn = false; F.gripPos = { x: 1046, y: 404 }; F.flowPhase = 0;
    F.graphPos = { x: 214, y: 540 };
    F.dragging = null;
    hoverSwitch.t = 0; hoverSwitch.inside = false;
    resetZoom();
  }
  reset();

  /* ======================= DRAW ======================= */
  function draw(ctx) {
    if (F.study === 'wire') { F.view === 'side' ? drawWireSide(ctx) : drawWireBird(ctx); }
    else { F.view === 'side' ? drawPairSide(ctx) : drawPairBird(ctx); }
    updateChips();
  }

  /* ---------- the bird-eye field curves, traced once ---------- */
  function singleCurves() {
    if (!F.switchOn) return null;
    return RING_RADII.map(r => PHYS.traceField(
      (x, y) => PHYS.wireB(x, y, WIRE_X, PLANE_Y, F.I, F.revI),
      WIRE_X + r, PLANE_Y, { step: 5, maxSteps: 320, closeDist: 7 }).pts);
  }

  /* ======================= 4.1.a  straight wire, SIDE ======================= */
  function drawWireSide(ctx) {
    const g = wireGeom();
    const curves = singleCurves();
    const maxR = RING_RADII[RING_RADII.length - 1];

    /* Depth order: far halves of the rings, then ALL the metal, then the near
       halves. The leads are routed entirely outside the field region (proved
       numerically in the test suite), so drawing them in the same pass as the
       wire cannot hide any field line. */
    paintProjected(ctx, curves, 'far');
    drawConductorNetwork(ctx, conductorRuns(g));
    paintProjected(ctx, curves, 'near');
    drawSupplyAndSwitch(ctx, g);

    /* Compasses sit on the NEAR arc of one ring, where the field genuinely
       lies in the plane of the screen; at the left and right extremes of an
       edge-on circle the field points straight into or out of the screen and
       a flat compass face could only mislead.
       There is deliberately NO free/draggable compass in this view — see
       supportsCompass() for why. */
    if (S.show.compass) {
      const has = F.switchOn;
      sideCompassPositions().forEach((p, i) =>
        drawCompass(ctx, p.x, p.y, 15, { ang: has ? F.sideAngs[i] : 0 }, has));
    }

    // the current arrow, beside the wire and never on it
    if (F.switchOn) {
      const ax = g.x + 64;
      if (F.revI > 0) arrow(ctx, ax, 214, ax, 108, { col: PAL.current, lw: 4, head: 14 });
      else arrow(ctx, ax, 108, ax, 214, { col: PAL.current, lw: 4, head: 14 });
      txt(ctx, 'I', ax + 22, 150, { size: 18, col: PAL.current, weight: 800 });
      txt(ctx, 'current', ax + 22, 170, { size: 10.5, col: PAL.current, weight: 600 });
    }
    if (F.gripOn) drawGripCard(ctx);

    /* the conventional current itself, travelling the real circuit path */
    if (F.switchOn && S.show.flow)
      drawFlowAlong(ctx, circuitPath(), F.flowPhase, { spacing: 62, size: 2.8 });

    if (S.show.labels) {
      txt(ctx, 'B', g.x - maxR - 34, PLANE_Y - 34, { size: 18, col: PAL.fieldLine, weight: 800 });
      txt(ctx, 'the same ' + RING_RADII.length + ' circles as the end-on view, seen edge-on —',
        600, 616, { size: 12, col: PAL.textDim, weight: 600 });
      txt(ctx, 'they lie in the plane at RIGHT ANGLES to the wire',
        600, 634, { size: 12, col: PAL.textDim, weight: 600 });
    }
  }

  /* the three side-view compass positions, on the near arc of ring 4 */
  function sideCompassPositions() {
    const r = RING_RADII[5] || 190, ry = r * SQUASH;
    return [55, 90, 125].map(deg => {
      const a = deg * Math.PI / 180;
      return { x: WIRE_X + r * Math.cos(a), y: PLANE_Y + ry * Math.sin(a), a };
    });
  }
  /* The needle direction there: the projection of the real field.
     DERIVED, not guessed — this was 180° wrong before.
     In bird-eye the field circles ANTICLOCKWISE on screen for current out of
     the page, so the tangent at canvas angle a is (sin a, −cos a). Projecting
     into the side view scales only the y-component by SQUASH:
         (sin a, −cos a · SQUASH) · revI
     Check at a = 90° (the near point of the ellipse, current UP): that gives
     (+1, 0) — the field points RIGHT, which is what the right-hand grip rule
     says for a thumb pointing up. The old form had both components negated. */
  function sideCompassAngle(a) {
    const tx = Math.sin(a) * F.revI, ty = -Math.cos(a) * SQUASH * F.revI;
    return Math.atan2(ty, tx);
  }

  /* draw traced bird-eye curves through projectSide(), split by depth */
  function paintProjected(ctx, curves, half) {
    const maxR = RING_RADII[RING_RADII.length - 1];
    if (!curves) {
      // switch open: faint dashed guides so the geometry is still legible
      if (half !== 'near') return;
      for (const r of RING_RADII) {
        ctx.save();
        ctx.strokeStyle = PAL.border; ctx.globalAlpha = .38; ctx.setLineDash([3, 5]);
        ctx.beginPath(); ctx.ellipse(WIRE_X, PLANE_Y, r, r * SQUASH, 0, 0, TAU); ctx.stroke();
        ctx.restore();
      }
      return;
    }
    for (const pts of curves) {
      /* split each traced circle into the half BEHIND the wire (bird-eye y
         above the plane) and the half IN FRONT of it, so the wire passes
         through every ring instead of sitting on top of them all */
      const seg = [];
      let run = [];
      for (const p of pts) {
        const isFar = p.y <= PLANE_Y;
        if ((half === 'far') === isFar) run.push(projectSide(p));
        else if (run.length) { seg.push(run); run = []; }
      }
      if (run.length) seg.push(run);
      for (const s of seg) {
        paintLine(ctx, s, {
          col: PAL.fieldLine,
          lw: half === 'far' ? 1.5 : 2.0,
          alpha: half === 'far' ? 0.5 : 1,
          dash: half === 'far' ? [5, 4] : null,
          heads: s.length > 14 ? 1 : 0, headSize: 7
        });
      }
    }
  }

  /* ---------- the circuit (side view only) ----------
     Routed so that NOTHING crosses the field region. Constants are exported
     for the verification suite, which checks this numerically rather than by
     eye. */
  const RAIL_L = 168, RAIL_R = 872, RAIL_Y = 530;
  const SW_X = 336, CELL_X = 672, TERM_DX = 34;

  /* The d.c. supply is drawn as TWO TERMINALS, + and −, rather than a cell
     symbol: which terminal is positive is the whole reason the current runs
     the way it does, so it is the thing the student should be able to see and
     swap. ⇄ Reverse current swaps them, and the flow animation follows. */
  const plusOnRight = () => F.revI > 0;
  const termPlus  = () => ({ x: CELL_X + (plusOnRight() ? TERM_DX : -TERM_DX), y: RAIL_Y });
  const termMinus = () => ({ x: CELL_X + (plusOnRight() ? -TERM_DX : TERM_DX), y: RAIL_Y });

  /* The circuit as ONE ordered polyline, from the + terminal round the
     outside back to −. The flow animation walks this exact path, so the
     drawn current can never travel anywhere the real circuit does not. */
  function circuitPath() {
    const g = wireGeom();
    /* ONE fixed geometry: right terminal → up the right lead → along the
       bottom lead → UP the wire → out the top lead → down the left lead →
       through the switch → left terminal.
       Traversed FORWARDS the current runs up the wire (revI > 0) and enters
       from the right-hand terminal, so that terminal is +. Traversed
       BACKWARDS it runs down the wire and + is the left-hand terminal. That
       is exactly what termPlus()/termMinus() report, so the drawn polarity
       and the animated flow are the same fact expressed twice, not two
       facts that have to be kept in step. */
    const geom = [
      { x: CELL_X + TERM_DX, y: RAIL_Y },
      { x: RAIL_R, y: RAIL_Y },
      { x: RAIL_R, y: g.bot },
      { x: g.x, y: g.bot },
      { x: g.x, y: g.top },
      { x: RAIL_L, y: g.top },
      { x: RAIL_L, y: RAIL_Y },
      { x: SW_X, y: RAIL_Y },
      { x: CELL_X - TERM_DX, y: RAIL_Y }
    ];
    return F.revI > 0 ? geom : geom.slice().reverse();
  }

  /* every conductor in this view as ONE list, so drawConductorNetwork() can
     render them in passes and no junction can show a seam. The conductor is
     unbroken everywhere EXCEPT the two places a break is real: the switch,
     and the gap between the supply's terminals. */
  function conductorRuns(g) {
    const LEAD = 9, ROD = 15;
    return [
      { w: LEAD, pts: [{ x: g.x, y: g.top }, { x: RAIL_L, y: g.top },
                       { x: RAIL_L, y: RAIL_Y }, { x: SW_X - 26, y: RAIL_Y }] },
      { w: LEAD, pts: [{ x: SW_X + 26, y: RAIL_Y }, { x: CELL_X - TERM_DX, y: RAIL_Y }] },
      { w: LEAD, pts: [{ x: CELL_X + TERM_DX, y: RAIL_Y }, { x: RAIL_R, y: RAIL_Y },
                       { x: RAIL_R, y: g.bot }, { x: g.x, y: g.bot }] },
      { w: ROD,  pts: [{ x: g.x, y: g.top }, { x: g.x, y: g.bot }] }
    ];
  }

  function drawSupplyAndSwitch(ctx, g) {
    /* The d.c. supply drawn to the IGCSE standard: each lead ends in a small
       OPEN circle, with a gap between the two — that gap is the supply. The
       + and − signs are added on top of the standard symbol so the direction
       of the conventional current is readable straight off the diagram. */
    for (const [t, lab, col] of [[termPlus(), '+', PAL.rose], [termMinus(), '−', PAL.blue]]) {
      ctx.save();
      ctx.fillStyle = PAL.bg;
      ctx.beginPath(); ctx.arc(t.x, t.y, 7.5, 0, TAU); ctx.fill();
      ctx.strokeStyle = PAL.text; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(t.x, t.y, 7.5, 0, TAU); ctx.stroke();
      ctx.restore();
      txt(ctx, lab, t.x, t.y - 22, { col, size: 17, weight: 800 });
    }
    txt(ctx, 'd.c. supply', CELL_X, RAIL_Y + 26, { col: PAL.textMuted, size: 10 });

    // switch — a real hinged blade on the OUTER part of the circuit
    ctx.save();
    ctx.fillStyle = PAL.metal;
    ctx.beginPath(); ctx.arc(SW_X - 26, RAIL_Y, 4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(SW_X + 26, RAIL_Y, 4, 0, TAU); ctx.fill();
    ctx.strokeStyle = F.switchOn ? PAL.force : PAL.metal;
    ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(SW_X - 26, RAIL_Y);
    if (F.switchOn) ctx.lineTo(SW_X + 26, RAIL_Y);
    else ctx.lineTo(SW_X + 16, RAIL_Y - 30);
    ctx.stroke(); ctx.restore();
    drawHoverRing(ctx, SW_X, RAIL_Y, 34, hoverSwitch.progress());
    txt(ctx, F.switchOn ? 'Switch: CLOSED' : 'Switch: OPEN', SW_X, RAIL_Y + 44,
      { col: F.switchOn ? PAL.force : PAL.textMuted, size: 11, weight: 700 });
    if (S.show.hints && hoverSwitch.progress() === 0)
      txt(ctx, 'hover here for 3 s to toggle', SW_X, RAIL_Y + 60,
        { col: PAL.textMuted, size: 9.5 });
  }

  const switchHit = lp => PHYS.hyp(lp.x - SW_X, lp.y - RAIL_Y) < 40;

  /* ======================= 4.1.b  straight wire, BIRD-EYE =======================
     NO circuit is drawn here (spec 4.1.b): from directly above, a circuit
     would be unrealistic and would cover the very field lines this view
     exists to show. Only the switch STATE is reported, in the chip. */
  function drawWireBird(ctx) {
    const g = wireGeom();
    // the card the wire is pushed through, so the plane of the picture is real
    ctx.save(); ctx.globalAlpha = .22; ctx.fillStyle = PAL.card;
    rr(ctx, g.x - 268, PLANE_Y - 252, 536, 504, 12); ctx.fill(); ctx.restore();
    ctx.save(); ctx.strokeStyle = PAL.border; ctx.lineWidth = 1.3;
    rr(ctx, g.x - 268, PLANE_Y - 252, 536, 504, 12); ctx.stroke(); ctx.restore();
    if (S.show.labels)
      txt(ctx, 'card, seen face-on — the wire passes straight through it',
        g.x, PLANE_Y - 264, { size: 11, col: PAL.textMuted, weight: 600 });

    const curves = singleCurves();
    if (curves) {
      for (const pts of curves)
        paintLine(ctx, pts, { col: PAL.fieldLine, lw: 1.9, heads: 4, headSize: 7 });
    } else {
      for (const r of RING_RADII) {
        ctx.save(); ctx.strokeStyle = PAL.border; ctx.globalAlpha = .38;
        ctx.setLineDash([3, 5]);
        ctx.beginPath(); ctx.arc(g.x, PLANE_Y, r, 0, TAU); ctx.stroke(); ctx.restore();
      }
    }

    if (S.show.compass) {
      for (let i = 0; i < BIRD_N; i++) {
        const a = i * TAU / BIRD_N;
        const cx = g.x + Math.cos(a) * COMPASS_R, cy = PLANE_Y + Math.sin(a) * COMPASS_R;
        drawCompass(ctx, cx, cy, 17, { ang: F.birdAngs[i] }, F.switchOn);
      }
    }
    drawFreeCompass(ctx);
    wireGlyph(ctx, g.x, PLANE_Y, 16, F.revI);

    if (S.show.labels) {
      const lx = g.x - 214, ly = PLANE_Y + 236;
      line(ctx, lx + 34, ly - 12, g.x - 22, PLANE_Y + 20, { col: PAL.textMuted, lw: 1, dash: [3, 3] });
      txt(ctx, F.switchOn ? (F.revI > 0 ? 'current OUT of the page' : 'current INTO the page')
        : 'no current — switch is OPEN',
        lx, ly, { col: F.switchOn ? PAL.text : PAL.textMuted, size: 11.5, weight: 700, plate: true });
    }
    if (F.gripOn) drawGripCard(ctx);
  }

  function drawFreeCompass(ctx) {
    // bird-eye only — see supportsCompass() for the reason
    if (!S.show.compass || F.view !== 'bird') return;
    const b = F.study === 'wire' ? fieldFn_single(F.freeCompass.x, F.freeCompass.y)
                                 : fieldFn_pair(F.freeCompass.x, F.freeCompass.y);
    drawCompass(ctx, F.freeCompass.x, F.freeCompass.y, 21, { ang: F.freeAng }, b.mag > 1e-30);
    txt(ctx, 'plotting compass', F.freeCompass.x, F.freeCompass.y + 38,
      { col: PAL.textDim, size: 10, weight: 600, plate: true });
  }

  /* right-hand grip rule (spec rule 5) */
  const GRIP_W = 196, GRIP_H = 208;
  function drawGripCard(ctx) {
    const x = F.gripPos.x, y = F.gripPos.y, w = GRIP_W, h = GRIP_H;
    ctx.save();
    rr(ctx, x - w / 2, y - 26, w, h, 10);
    ctx.fillStyle = PAL.bg; ctx.globalAlpha = .95; ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = PAL.accent; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
    txt(ctx, 'RIGHT-hand grip rule', x, y - 8, { col: PAL.accent, size: 11.5, weight: 800 });
    // drag affordance, so the card visibly invites being moved
    ctx.save(); ctx.fillStyle = PAL.textMuted; ctx.globalAlpha = .7;
    for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) {
      ctx.beginPath();
      ctx.arc(x - w / 2 + 13 + c * 5, y - 14 + r * 5, 1.4, 0, TAU); ctx.fill();
    }
    ctx.restore();
    txt(ctx, 'drag', x + w / 2 - 20, y - 11, { col: PAL.textMuted, size: 8.5 });

    /* The picture matches the view it is explaining. Showing the end-on
       version beside an edge-on drawing forces the student to mentally rotate
       one of them, which is the exact confusion the two-view system exists to
       remove. Both variants derive their circulation from the SAME
       sideCompassAngle()/revI the apparatus uses, so the card can never
       disagree with the field lines next to it. */
    if (F.view === 'side') drawGripSide(ctx, x, y + 56);
    else drawGripEndOn(ctx, x, y + 56);

    if (F.view === 'side') {
      txt(ctx, 'thumb → along the current', x, y + 118, { size: 10, col: PAL.current, weight: 700 });
      txt(ctx, 'fingers curl round the wire', x, y + 132, { size: 10, col: PAL.fieldLine, weight: 700 });
      txt(ctx, 'the circles lie FLAT — you are', x, y + 152, { size: 9.5, col: PAL.textMuted });
      txt(ctx, 'seeing them edge-on here', x, y + 164, { size: 9.5, col: PAL.textMuted });
    } else {
      txt(ctx, 'grip with your RIGHT hand', x, y + 112, { size: 10, col: PAL.text, weight: 700 });
      txt(ctx, 'fingers curl the way the', x, y + 130, { size: 10, col: PAL.fieldLine, weight: 700 });
      txt(ctx, 'CONVENTIONAL current runs', x, y + 144, { size: 10, col: PAL.current, weight: 700 });
      txt(ctx, 'your LEFT hand gives the', x, y + 164, { size: 9.5, col: PAL.textMuted });
      txt(ctx, 'opposite way round', x, y + 176, { size: 9.5, col: PAL.textMuted });
    }
  }

  /* END-ON: the wire comes at you, the field circles round it on the page */
  function drawGripEndOn(ctx, x, gy) {
    ctx.save(); ctx.translate(x, gy);
    ctx.strokeStyle = PAL.fieldLine; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
    const a0 = -1.1, a1 = a0 + (F.revI > 0 ? -4.4 : 4.4);
    ctx.beginPath(); ctx.arc(0, 0, 34, a0, a1, F.revI > 0); ctx.stroke();
    headAt(ctx, 34 * Math.cos(a1), 34 * Math.sin(a1),
      a1 + (F.revI > 0 ? -Math.PI / 2 : Math.PI / 2), 9, PAL.fieldLine);
    ctx.restore();
    wireGlyph(ctx, x, gy, 12, F.revI);
  }

  /* SIDE: the wire runs up the page and the field circle is seen EDGE-ON,
     exactly as the apparatus beside it is drawn — vertical rod, thumb arrow
     along the current, one flattened ring with the far half dashed. */
  function drawGripSide(ctx, x, gy) {
    const rx = 40, ry = rx * SQUASH, rodH = 46;
    // far half of the ring, behind the rod
    ctx.save();
    ctx.strokeStyle = PAL.fieldLine; ctx.lineWidth = 2; ctx.globalAlpha = .5;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.ellipse(x, gy, rx, ry, 0, Math.PI, TAU); ctx.stroke();
    ctx.restore();
    // the wire itself
    drawConductor(ctx, x, gy - rodH, x, gy + rodH, 9);
    // near half, in front
    ctx.save();
    ctx.strokeStyle = PAL.fieldLine; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.ellipse(x, gy, rx, ry, 0, 0, Math.PI); ctx.stroke();
    ctx.restore();
    // the circulation arrow, from the SAME expression the apparatus uses
    const a = Math.PI / 2;                       // the near point of the ring
    headAt(ctx, x + rx * Math.cos(a), gy + ry * Math.sin(a), sideCompassAngle(a), 9, PAL.fieldLine);
    // thumb → the current
    if (F.revI > 0) arrow(ctx, x - 62, gy + 30, x - 62, gy - 34, { col: PAL.current, lw: 3, head: 10 });
    else arrow(ctx, x - 62, gy - 34, x - 62, gy + 30, { col: PAL.current, lw: 3, head: 10 });
    txt(ctx, 'I', x - 74, gy - 4, { col: PAL.current, size: 13, weight: 800 });
  }

  /* ======================= 4.1.c / 4.1.d  two parallel wires =======================
     NO supply wires are drawn in either view (spec 4.1.c) — the emphasis is
     the force, so only the current-direction arrows appear. */
  function pairCurves() {
    const g = pairGeom();
    const bounds = { x0: 40, y0: 40, x1: 1160, y1: 640 };
    const solids = [{ contains: (x, y) =>
      PHYS.hyp(x - g.w1.x, y - g.w1.y) < 11 || PHYS.hyp(x - g.w2.x, y - g.w2.y) < 11 }];
    const seeds = []
      .concat(PHYS.equalFluxSeeds(fieldFn_pair, { x: g.w1.x - 250, y: g.y }, { x: g.w1.x - 16, y: g.y }, 5))
      .concat(PHYS.equalFluxSeeds(fieldFn_pair, { x: g.w2.x + 16, y: g.y }, { x: g.w2.x + 250, y: g.y }, 5))
      .concat([{ x: g.cx, y: g.y - 28 }, { x: g.cx, y: g.y + 28 }]);
