      const dz = dirZfor(s2);
      const a = corner(s2, dz > 0 ? zB * 0.8 : zA + 12);
      const b = corner(s2, dz > 0 ? zA + 12 : zB * 0.8);
      arrow(ctx, a.x, a.y, b.x, b.y, { col: PAL.current, lw: 3.2, head: 11 });
      if (M.I > 0 && M.B > 0) {
        const mid = corner(s2, (zA + zB) / 2);
        const fd = PHYS.forceDirOnCurrent(dz, u.x, u.y);
        arrow(ctx, mid.x, mid.y, mid.x + fd.x * 56, mid.y + fd.y * 56,
          { col: PAL.force, lw: 3.2, head: 11 });
      }
    }
    drawCommutatorHardware(ctx, cx, cy, cz, RING_R);

    if (S.show.labels) {
      txt(ctx, 'the split ring turns WITH the coil; the brushes stay still', 560, 108,
        { col: PAL.textDim, size: 12, weight: 700 });
      txt(ctx, 'every half turn the halves swap brushes, so the current in each side reverses',
        560, 128, { col: PAL.textMuted, size: 10.5 });
    }
    drawCommutatorInset(ctx);
  }

  /* a pole piece as a real block in the oblique projection, with every face
     given an OPAQUE base first — shaded faces painted with alpha alone are not
     actually solid, and things behind them show through the near edge */
  function drawPole3D(ctx, x, cy, w, h, depth, pole) {
    const col = pole === 'N' ? PAL.poleN : PAL.poleS;
    const tl = p3(x - w / 2, cy - h / 2, 0), tr = p3(x + w / 2, cy - h / 2, 0);
    const br = p3(x + w / 2, cy - h / 2, depth), bl = p3(x - w / 2, cy - h / 2, depth);
    const sa = p3(x + w / 2, cy - h / 2, 0), sb = p3(x + w / 2, cy - h / 2, depth);
    const sc = p3(x + w / 2, cy + h / 2, depth), sd = p3(x + w / 2, cy + h / 2, 0);
    ctx.save();
    const face = (pts, paint) => {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.globalAlpha = 1; ctx.fillStyle = PAL.bg; ctx.fill();
      paint(); ctx.fill();
    };
    face([tl, tr, br, bl], () => { ctx.globalAlpha = .58; ctx.fillStyle = col; });
    face([sa, sb, sc, sd], () => {
      const sg = ctx.createLinearGradient(sa.x, sa.y, sb.x, sb.y);
      sg.addColorStop(0, col); sg.addColorStop(1, 'rgba(0,0,0,.55)');
      ctx.globalAlpha = 1; ctx.fillStyle = sg;
    });
    ctx.globalAlpha = 1; ctx.fillStyle = PAL.bg;
    rr(ctx, x - w / 2, cy - h / 2, w, h, 3); ctx.fill();
    const fg = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    fg.addColorStop(0, 'rgba(0,0,0,.20)'); fg.addColorStop(.4, col); fg.addColorStop(1, col);
    ctx.fillStyle = fg;
    rr(ctx, x - w / 2, cy - h / 2, w, h, 3); ctx.fill();
    ctx.restore();
    txt(ctx, pole, x, cy, { col: '#fff', size: 24, weight: 800 });
  }

  /* ---------- the split ring and its brushes, IN the projection ----------
     The old drawing squashed the ring vertically — ctx.scale(1, 0.55) — which
     is what a ring lying in the HORIZONTAL plane would look like. But the
     commutator turns on the AXLE, and the axle runs along the depth axis, so
     the ring lies in the screen plane and this oblique projection maps it to a
     true CIRCLE. Its solidity comes from its thickness ALONG the axle, so it
     is drawn as a short cylinder — far rim, extruded body, near rim — and the
     brushes as blocks pressing on that cylinder from either side. */
  function drawCommutatorHardware(ctx, cxw, cyw, z0, R) {
    const T = 40;                                   // thickness along the axle
    const near = p3(cxw, cyw, z0), far = p3(cxw, cyw, z0 + T);
    const g = 0.16, a0 = M.theta + Math.PI / 2;
    const halves = M.commutatorOn
      ? [[a0 + g, a0 + Math.PI - g, PAL.amber], [a0 + Math.PI + g, a0 + TAU - g, PAL.blue]]
      : [[0, TAU, PAL.metal]];

    ctx.save();
    ctx.lineCap = 'butt';
    // the extruded body: the same arc stepped along the axle, far end first
    for (let k = 8; k >= 0; k--) {
      const t = k / 8;
      const c = { x: near.x + (far.x - near.x) * t, y: near.y + (far.y - near.y) * t };
      ctx.globalAlpha = 0.42 + 0.5 * (1 - t);
      ctx.lineWidth = 11;
      for (const [s0, s1, col] of halves) {
        ctx.strokeStyle = col;
        ctx.beginPath(); ctx.arc(c.x, c.y, R, s0, s1); ctx.stroke();
      }
    }
    // the near rim, at full strength, with a bright inner edge
    ctx.globalAlpha = 1; ctx.lineWidth = 11;
    for (const [s0, s1, col] of halves) {
      ctx.strokeStyle = col;
      ctx.beginPath(); ctx.arc(near.x, near.y, R, s0, s1); ctx.stroke();
    }
    ctx.globalAlpha = .5; ctx.lineWidth = 1.6; ctx.strokeStyle = PAL.metalHi;
    for (const [s0, s1] of halves) {
      ctx.beginPath(); ctx.arc(near.x, near.y, R - 5.5, s0, s1); ctx.stroke();
    }
    ctx.restore();

    /* the brushes are FIXED in space: they touch the cylinder at its left and
       right extremes, half way along its thickness, and carry leads outwards */
    const mid = p3(cxw, cyw, z0 + T / 2);
    for (const sgn of [1, -1]) {
      const bx = mid.x + sgn * R;
      ctx.save();
      ctx.strokeStyle = PAL.steel; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx + sgn * 26, mid.y); ctx.lineTo(bx + sgn * 56, mid.y);
      ctx.stroke();
      ctx.fillStyle = PAL.iron;
      rr(ctx, sgn > 0 ? bx + 1 : bx - 27, mid.y - 9, 26, 18, 3); ctx.fill();
      ctx.strokeStyle = PAL.metalHi; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.restore();
    }
    txt(ctx, 'brushes (fixed)', mid.x, near.y + R + 26, { col: PAL.textMuted, size: 9.5 });
    txt(ctx, M.commutatorOn ? 'split ring' : 'slip ring', far.x, far.y - R - 14,
      { col: M.commutatorOn ? PAL.metalHi : PAL.textMuted, size: 10, weight: 700 });
  }

  /* ---------- the ENLARGED inset (reference image 1) ----------
     Which half-ring each brush touches right now, and the resulting current
     direction in each coil side. Every label gets its own laid-out row, so
     nothing is placed by eye beside a moving part — which is exactly how
     these captions end up overlapping. */
  const INSET = { R: 88, W: 246 };
  const insetRect = () => {
    const p = M.insetPos, R = INSET.R;
    return { x0: p.x - INSET.W / 2, y0: p.y - R - 52, w: INSET.W, h: R * 2 + 150 };
  };
  function drawCommutatorInset(ctx) {
    const cx = M.insetPos.x, cy = M.insetPos.y, R = INSET.R;
    const panW = INSET.W, panH = R * 2 + 150;
    ctx.save();
    rr(ctx, cx - panW / 2, cy - R - 52, panW, panH, 10);
    ctx.fillStyle = PAL.bg; ctx.globalAlpha = .96; ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = PAL.border; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
    txt(ctx, M.commutatorOn ? 'SPLIT RING — enlarged' : 'SLIP RINGS — enlarged',
      cx, cy - R - 34, { col: PAL.accent, size: 11, weight: 800 });

    const ringR = R * 0.68;
    if (M.commutatorOn) {
      const gap = 0.13, a0 = M.theta + Math.PI / 2;
      for (const [start, col] of [[a0 + gap, PAL.amber], [a0 + Math.PI + gap, PAL.blue]]) {
        ctx.save();
        ctx.strokeStyle = col; ctx.lineWidth = 13; ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.arc(cx, cy, ringR, start, start + Math.PI - 2 * gap); ctx.stroke();
        ctx.restore();
      }
    } else {
      ctx.save();
      ctx.strokeStyle = PAL.metal; ctx.lineWidth = 13;
      ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, TAU); ctx.stroke(); ctx.restore();
    }
    ctx.save(); ctx.fillStyle = PAL.metal;
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, TAU); ctx.fill(); ctx.restore();

    // the two fixed brushes, marked + and −
    const bx = ringR + 26;
    for (const [sgn, lab, col] of [[1, '+', PAL.rose], [-1, '−', PAL.blue]]) {
      const x = cx + sgn * bx;
      ctx.save();
      ctx.fillStyle = PAL.iron; rr(ctx, x - 10, cy - 9, 20, 18, 3); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.stroke(); ctx.restore();
      txt(ctx, lab, x, cy, { col, size: 12, weight: 800 });
    }

    /* Which brush touches which half-ring, from the SAME commFactor() the
       torque rectification uses — one expression, not two kept in step. */
    const rowY = cy + ringR + 30;
    if (M.commutatorOn) {
      const s = PHYS.commFactor(M.theta, true);
      const plus = s < 0 ? 'A' : 'B', minus = s < 0 ? 'B' : 'A';
      txt(ctx, '+ brush touches half-ring ' + plus, cx, rowY, { col: PAL.textDim, size: 10.5, weight: 600 });
      txt(ctx, '− brush touches half-ring ' + minus, cx, rowY + 17, { col: PAL.textDim, size: 10.5, weight: 600 });
      txt(ctx, 'they swap every half turn', cx, rowY + 37, { col: PAL.accent, size: 10.5, weight: 700 });
    } else {
      txt(ctx, 'each brush keeps the SAME ring', cx, rowY, { col: PAL.textDim, size: 10.5, weight: 600 });
      txt(ctx, 'so the current never reverses', cx, rowY + 17, { col: PAL.textDim, size: 10.5, weight: 600 });
      txt(ctx, '→ the coil stalls upright', cx, rowY + 37, { col: PAL.rose, size: 10.5, weight: 700 });
    }
    txt(ctx, 'side 1: ' + (dirZfor(1) > 0 ? '⊙ out' : '⊗ in') +
      '    side 2: ' + (dirZfor(-1) > 0 ? '⊙ out' : '⊗ in'),
      cx, rowY + 60, { col: PAL.current, size: 10.5, weight: 700 });
  }

  /* ======================= chips ======================= */
  function updateChips() {
    const revs = Math.abs(M.omega) / TAU;
    let warn = '';
    if (!M.commutatorOn && Math.abs(M.omega) < 0.25 && atDeadSpot())
      warn = 'STALLED — the coil has swung to the vertical and stopped';
    let hint;
    if (M.stepTarget !== null) hint = 'Stepping 45°…';
    else if (M.autoPause) hint = 'Auto-pause is ON: it stops at every half turn<br>so you can watch the brushes swap.';
    else hint = 'Try ↷ Step 45° to walk it round,<br>or turn ◗◖ Commutator OFF and watch it stall.';
    setChips(
      '<b>D.C. Motor</b><br>' + (M.commutatorOn
        ? 'split-ring commutator — spins continuously'
        : 'slip rings only — it will stall'),
      'speed ≈ <b>' + revs.toFixed(2) + ' rev/s</b>',
      warn, hint);
  }

  /* ======================= update ======================= */
  function update(dt) {
    // Step 45°: drive toward the target and stop dead on it
    if (M.stepTarget !== null) {
      const remain = M.stepTarget - M.theta;
      if (remain <= 0.002) {
        M.theta = M.stepTarget; M.stepTarget = null; M.omega = 0;
        clunk(); syncToolbar();
      } else M.theta += Math.min(remain, dt * 2.4);
      return;
    }
    if (!M.running) return;

    const before = PHYS.commFactor(M.theta, true);
    M.omega += (torque() * K_TORQUE - M.omega * DAMP) * dt;
    M.theta += M.omega * dt;
    const after = PHYS.commFactor(M.theta, true);

    if (M.commutatorOn && before !== after && Math.abs(M.omega) > 0.4) {
      clunk();
      /* Auto-pause: stop AT the half-turn boundary so the student can see the
         contact swap, then let them press Run again. */
      if (M.autoPause) { M.running = false; M.omega = 0; syncToolbar(); }
    }
    if (M.theta > TAU) M.theta -= TAU;
    if (M.theta < 0) M.theta += TAU;
  }

  const insetHit = lp => {
    const r = insetRect();
    return lp.x > r.x0 && lp.x < r.x0 + r.w && lp.y > r.y0 && lp.y < r.y0 + r.h;
  };
  function pointerDown(lp) {
    if (insetHit(lp)) {
      M.dragging = 'inset';
      M._off = { x: lp.x - M.insetPos.x, y: lp.y - M.insetPos.y };
      return true;
    }
    return false;
  }
  function pointerMove(lp) {
    if (M.dragging !== 'inset') return false;
    const r = insetRect(), R = INSET.R;
    M.insetPos.x = Math.max(INSET.W / 2 + 6, Math.min(W - INSET.W / 2 - 6, lp.x - M._off.x));
    M.insetPos.y = Math.max(R + 58, Math.min(H - (R + 98) - 6, lp.y - M._off.y));
    return true;
  }
  function pointerUp() { M.dragging = null; }

  /* ======================= panels ======================= */
  function paneData() {
    let h = sectionTitle('🎛️', 'CONTROLS');
    h += sliderHTML('mI', 'Current I', M.I.toFixed(1), { min: 0, max: 8, step: 0.1, value: M.I, unit: ' A' });
    h += sliderHTML('mB', 'Field B', M.B.toFixed(0), { min: 0, max: 200, step: 5, value: M.B, unit: ' mT' });
    h += sliderHTML('mT', 'Turns on the coil', M.turns, { min: 1, max: 20, step: 1, value: M.turns, unit: '' });
    h += '<div class="rowbtns">' +
      '<button class="mini" id="btnMI2">⇄ Reverse current</button>' +
      '<button class="mini" id="btnMB2">⇄ Reverse field</button></div>';
    h += sectionTitle('📊', 'READINGS');
    h += kvHTML('Speed', '—', 'v-force', 'kSpd');
    h += kvHTML('Commutator', '—', '', 'kComm');
    h += kvHTML('Coil angle θ', '—', '', 'kTh');
    h += kvHTML('Current in side 1', '—', 'v-cur', 'kS1');
    h += kvHTML('Current in side 2', '—', 'v-cur', 'kS2');
    h += kvHTML('Couple turns it', '—', '', 'kDir');
    h += kvHTML('Couple  B I A N cos θ', '—', '', 'kTq');
    h += sectionTitle('🧮', 'WORKING');
    h += '<div class="working">' +
      mathLine('\\tau = B\\,I\\,A\\,N\\cos\\theta', 'τ = B × I × A × N × cos θ') +
      '<div id="wkMotor" style="font-size:11.5px;color:var(--text-dim);margin-top:4px"></div>' +
      '<div style="font-size:11px;color:var(--text-muted);margin-top:6px">' +
      'θ is measured from the coil plane to the field, so θ = 90° is the dead spot.</div></div>';
    $('pane-data').innerHTML = h;
    bindSlider('mI', v => M.I = v, ' A', v => v.toFixed(1));
    bindSlider('mB', v => M.B = v, ' mT', v => v.toFixed(0));
    bindSlider('mT', v => M.turns = Math.round(v), '', v => Math.round(v));
    const a = $('btnMI2'); if (a) a.onclick = () => { M.dirI0 *= -1; clickSnd(); };
    const b = $('btnMB2'); if (b) b.onclick = () => { M.dirB0 *= -1; clickSnd(); };
    patchData();
  }
  function patchData() {
    const set = (id, v) => { const e = $(id); if (e) e.textContent = v; };
    set('kSpd', (Math.abs(M.omega) / TAU).toFixed(2) + ' rev/s');
    set('kComm', M.commutatorOn ? 'ON — split ring' : 'OFF — slip rings');
    set('kTh', (M.theta * 180 / Math.PI).toFixed(0) + '°' + (atDeadSpot() ? '  (dead spot)' : ''));
    set('kS1', dirZfor(1) > 0 ? '⊙ out of the page' : '⊗ into the page');
    set('kS2', dirZfor(-1) > 0 ? '⊙ out of the page' : '⊗ into the page');
    const tq = torque();
    set('kDir', Math.abs(tq) < 1e-9 ? 'nothing — dead spot' : (tq > 0 ? 'anticlockwise' : 'clockwise'));
    set('kTq', Math.abs(tq) < 1e-12 ? '0 N·m' : tq.toExponential(2) + ' N·m');
    const wk = $('wkMotor');
    if (wk) wk.textContent = 'τ = ' + Btesla().toFixed(3) + ' × ' + M.I.toFixed(1) + ' × ' +
      M.area + ' × ' + M.turns + ' × cos ' + (M.theta * 180 / Math.PI).toFixed(0) + '° = ' +
      (Math.abs(tq) < 1e-12 ? '0' : tq.toExponential(2)) + ' N·m';
  }

  function paneInfo() {
    $('pane-info').innerHTML =
      '<div class="collapsible" id="m1"><button class="collapsible-hdr">How the motor turns <span class="chev">▾</span></button>' +
      '<div class="pbody">The two sides of the coil carry current in <b>opposite</b> directions and sit ' +
      'in the same field — so by Fleming’s left-hand rule one is pushed <b>up</b> and the other ' +
      '<b>down</b>. Two equal forces in opposite directions, not in line, form a <b>couple</b>, and a ' +
      'couple makes the coil <b>rotate</b>.</div></div>' +
      '<div class="collapsible" id="m2"><button class="collapsible-hdr">Why a commutator is needed <span class="chev">▾</span></button>' +
      '<div class="pbody">After half a turn each side has swapped places, so if the current still ran ' +
      'the same way the couple would push the coil <b>backwards</b>. It would swing to the vertical and ' +
      '<b>stall</b>.<br><br>The <b>split-ring commutator</b> is a ring cut in two halves, mounted on the ' +
      'axle and turning with the coil, with two fixed <b>brushes</b> pressing on it. Every half turn, ' +
      'just as the coil passes the vertical, <b>the gap sweeps past the brushes and the halves swap ' +
      'over</b> — reversing the current in each side exactly in time, so the couple keeps pushing the ' +
      'same way round.<br><br>Turn the commutator off in the toolbar to watch it stall instead.</div></div>' +
      '<div class="collapsible" id="m3"><button class="collapsible-hdr">Making it turn faster <span class="chev">▾</span></button>' +
      '<div class="pbody"><ul><li>increase the <b>current</b></li>' +
      '<li>use a <b>stronger field</b></li>' +
      '<li>put <b>more turns</b> on the coil</li>' +
      '<li>use a coil of <b>larger area</b></li></ul>' +
      'To reverse the direction of rotation, reverse <b>either</b> the current <b>or</b> the field — ' +
      'reversing both changes nothing at all.</div></div>' +
      '<div class="collapsible" id="m4"><button class="collapsible-hdr">The dead spot <span class="chev">▾</span></button>' +
      '<div class="pbody">When the coil is <b>vertical</b> its plane is at right angles to the field, ' +
      'and the two forces act <b>in line</b> with each other — they no longer turn it, so the couple is ' +
      'momentarily <b>zero</b> (cos 90° = 0). A real motor coasts through on its own <b>momentum</b>, ' +
      'and the commutator uses exactly that instant to swap over. Real motors use several coils at ' +
      'different angles so there is never a dead spot at all.</div></div>';
    makeCollapsible($('pane-info'));
  }
  function paneAnswer() {
    $('pane-answer').innerHTML =
      '<div class="placeholder"><div class="big">✍️</div>Practice &amp; Quiz arrive in v1.1</div>';
  }

  /* ======================= toolbar ======================= */
  function bindToolbar() {
    document.querySelectorAll('[data-act="mView"]').forEach(b => b.onclick = () => {
      M.view = b.dataset.val; clickSnd(); syncToolbar();
    });
    $('btnMRun').onclick = () => {
      M.running = !M.running;
      M.stepTarget = null;
      // nudge off an exact dead spot, or it can never start
      if (M.running && atDeadSpot()) M.theta += 0.28;
      clickSnd(); syncToolbar();
    };
    $('btnMComm').onclick = () => {
      M.commutatorOn = !M.commutatorOn; clunk(); syncToolbar(); refreshPanels();
    };
    $('btnMStep').onclick = () => {
      // one click = exactly 45°
      M.running = false; M.omega = 0;
      M.stepTarget = M.theta + Math.PI / 4;
      clickSnd(); syncToolbar();
    };
    $('btnMAuto').onclick = () => { M.autoPause = !M.autoPause; clickSnd(); syncToolbar(); };
    $('btnMRevI').onclick = () => { M.dirI0 *= -1; clickSnd(); };
    $('btnMRevB').onclick = () => { M.dirB0 *= -1; clickSnd(); };
    $('btnMField').onclick = () => { M.showB = !M.showB; clickSnd(); syncToolbar(); };
  }
  function syncToolbar() {
    document.querySelectorAll('[data-act="mView"]').forEach(b => b.classList.toggle('active', b.dataset.val === M.view));
    $('btnMRun').textContent = M.running ? '⏸ Pause' : '▶ Run';
    $('btnMRun').classList.toggle('active', M.running);
    $('btnMComm').textContent = '◗◖ Commutator: ' + (M.commutatorOn ? 'ON' : 'OFF');
    $('btnMComm').classList.toggle('active', M.commutatorOn);
    $('btnMAuto').classList.toggle('active', M.autoPause);
    /* the field arrows exist only in the 3-D view — in cross-section the field
       is the whole picture and there is nothing to turn off */
    $('grpMField').classList.toggle('hid', M.view !== 'aerial');
    $('btnMField').classList.toggle('active', M.showB);
  }

  SEC.motor = {
    S: M, reset, draw, update, pointerDown, pointerMove, pointerUp,
    paneData, patchData, paneInfo, paneAnswer, bindToolbar, syncToolbar,
    supportsCompass: () => false,   // this section draws no compass
    torque, dirZfor, sidePos, atDeadSpot
  };
})();
/* ============================================================================
   part9_boot.js — dispatcher and boot.
   Everything routes through the SEC{} registry; there is no section-specific
   logic here, which is what keeps a new section from needing edits in five
   different places.
   ========================================================================== */
const SECTIONS = ['field', 'electro', 'wire', 'motor'];
let activePane = 'data';

function setSection(sec) {
  S.sec = sec;
  document.querySelectorAll('.sbtn').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  document.querySelectorAll('#row1 .slot').forEach(sl => sl.classList.toggle('on', sl.dataset.sec === sec));
  resetZoom();                     // never land zoomed into blank space
  SEC[sec].syncToolbar();
  syncFlowLock();
  syncCompassLock();
  refreshPanels();
  draw();
}

function setMode(mode) {
  S.mode = mode;
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  /* Outside Simulate the section tabs and row 1 are LOCKED AND DIMMED, never
     hidden: display:none would shrink the chrome and move the canvas by
     exactly those rows' heights, breaking "the canvas never moves". */
  const locked = mode !== 'sim';
  $('sectabs').classList.toggle('locked', locked);
  $('row1').classList.toggle('locked', locked);
  refreshPanels();
  draw();
}

/* ⚡ Current flow only means something where a supply drives a circuit. Each
   section declares that for itself via supportsFlow(); a section that does
   not expose it simply has no flow to show. The button is LOCKED (dimmed and
   inert), never hidden, so the toolbar keeps its width. */
function syncFlowLock() {
  const mod = SEC[S.sec];
  const ok = !!(mod && mod.supportsFlow && mod.supportsFlow());
  const b = $('btnFlow');
  if (b) b.classList.toggle('locked', !ok);
}

/* 🧭 Compass is locked where the current view has no compass to show. A
   section without supportsCompass() is assumed to have one, which is true of
   the Electromagnet and Force-on-Wire sections. */
function syncCompassLock() {
  const mod = SEC[S.sec];
  const ok = !mod || !mod.supportsCompass || mod.supportsCompass();
  const b = $('btnCompass');
  if (b) b.classList.toggle('locked', !ok);
}

function setSpeed(v) {
  S.speed = v;
  document.querySelectorAll('#row2 [data-speed]').forEach(b =>
    b.classList.toggle('active', parseFloat(b.dataset.speed) === v));
}

function refreshPanels() {
  const mod = SEC[S.sec];
  if (S.mode !== 'sim') {
    const ph = '<div class="placeholder"><div class="big">🚧</div>' +
      'Practice &amp; Quiz mode arrive in v1.1<br><br>' +
      'Switch back to <b>Simulate</b> to explore this section.</div>';
    $('pane-data').innerHTML = ph;
    $('pane-info').innerHTML = ph;
    $('pane-answer').innerHTML =
      '<div class="placeholder"><div class="big">✍️</div>Practice &amp; Quiz arrive in v1.1</div>';
    return;
  }
  if (activePane === 'data') mod.paneData();
  else if (activePane === 'info') mod.paneInfo();
  else mod.paneAnswer();
}

function bindGlobalToolbar() {
  document.querySelectorAll('.mode-tab').forEach(b =>
    b.onclick = () => { setMode(b.dataset.mode); clickSnd(); });
  document.querySelectorAll('.sbtn').forEach(b =>
    b.onclick = () => { if (S.mode !== 'sim') return; setSection(b.dataset.sec); clickSnd(); });
  $('themeSel').onchange = () => { setTheme($('themeSel').value); draw(); };

  $('btnCompass').onclick = () => { S.show.compass = !S.show.compass; $('btnCompass').classList.toggle('active', S.show.compass); clickSnd(); };
  $('btnLabels').onclick  = () => { S.show.labels  = !S.show.labels;  $('btnLabels').classList.toggle('active', S.show.labels);  clickSnd(); };
  $('btnHints').onclick   = () => { S.show.hints   = !S.show.hints;   $('btnHints').classList.toggle('active', S.show.hints);    clickSnd(); };
  $('btnFlow').onclick    = () => { S.show.flow    = !S.show.flow;    $('btnFlow').classList.toggle('active', S.show.flow);      clickSnd(); };
  /* Animation off freezes TIME (dt is simply not applied) rather than
     skipping the redraw — the scene stays fully rendered and resumes from the
     same instant instead of jumping. */
  $('btnAnim').onclick  = () => { S.anim = !S.anim; $('btnAnim').classList.toggle('active', S.anim); clickSnd(); };
  $('btnSound').onclick = () => { S.sound = !S.sound; $('btnSound').classList.toggle('active', S.sound); if (S.sound) clickSnd(); };

  document.querySelectorAll('#row2 [data-speed]').forEach(b => b.onclick = () => {
    setSpeed(parseFloat(b.dataset.speed)); clickSnd();
  });

  $('btnReset').onclick = () => {
    /* reset() only touches the section's own model state. The toolbar's
       active-button highlighting and button LABELS are separate DOM state
       reset() has no reason to know about, so syncToolbar() must be called
       explicitly — otherwise a button keeps claiming "Commutator: OFF" right
       after Reset put the model back on ON. The canvas would be right; only
       the toolbar would lie. */
    SEC[S.sec].reset();
    SEC[S.sec].syncToolbar();
    setZoom(1);
    clunk(); refreshPanels(); draw();
  };

  document.querySelectorAll('.ptab').forEach(t => t.onclick = () => {
    activePane = t.dataset.pane;
    document.querySelectorAll('.ptab').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    $('pane-' + activePane).classList.add('active');
    refreshPanels();
    clickSnd();
  });
}

function bindPointer() {
  const c = CV();
  let dragging = false;
  c.addEventListener('pointerdown', e => {
    if (S.mode !== 'sim') return;
    try { c.setPointerCapture(e.pointerId); } catch (err) {}
    /* While zoomed in a drag PANS and section drag-handlers are skipped, so
       panning never fights with dragging the plotting compass. */
    if (S.zoom.k > 1) {
      S.zoom.panning = true; S.zoom.px = e.clientX; S.zoom.py = e.clientY;
      return;
    }
    const mod = SEC[S.sec];
    if (mod.pointerDown && mod.pointerDown(toLogical(e.clientX, e.clientY))) dragging = true;
  });
  c.addEventListener('pointermove', e => {
    // recorded on EVERY move, not just while dragging: the 3-second hover
    // switch needs to know where the pointer is when nothing is held
    const p = toLogical(e.clientX, e.clientY);
    S.pointer.x = p.x; S.pointer.y = p.y; S.pointer.on = true;
    if (S.zoom.panning) {
      /* the screen drag is converted through the LETTERBOX scale only,
         because the pan offset lives outside the zoom scaling */
      S.zoom.ox += (e.clientX - S.zoom.px) / VT.s;
      S.zoom.oy += (e.clientY - S.zoom.py) / VT.s;
      S.zoom.px = e.clientX; S.zoom.py = e.clientY;
      clampPan(); draw(); return;
    }
    if (!dragging) return;
    const mod = SEC[S.sec];
    if (mod.pointerMove) mod.pointerMove(p);
  });
  const end = () => {
    dragging = false; S.zoom.panning = false;
    const mod = SEC[S.sec];
    if (mod.pointerUp) mod.pointerUp();
  };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
  c.addEventListener('pointerleave', () => { S.pointer.on = false; end(); });

  /* ZOOM: double-click only, no toolbar button (spec 2.6). First double-click
     magnifies ×2 about the clicked point, the second returns to ×1. */
  c.addEventListener('dblclick', e => {
    if (S.mode !== 'sim') return;
    setZoom(S.zoom.k > 1 ? 1 : 2, toLogical(e.clientX, e.clientY));
    clickSnd();
  });
  c.addEventListener('contextmenu', e => {
    if (S.zoom.k > 1) { e.preventDefault(); setZoom(1); clickSnd(); }
  });
}

/* Patch ONLY the live numeric spans in the Data tab, for whichever section is
   active. Never rebuild the panel here — that would yank focus out of a
   slider mid-drag. This is what stops a readout going stale: a compass that
   keeps swinging after the panel was drawn, or a switch reading that must
   flip the instant the hover timer fires, would otherwise only update the
   next time the whole panel happened to be rebuilt. */
let lastPatch = 0;
function maybePatchPanel(ts) {
  if (S.mode !== 'sim' || activePane !== 'data') return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (ts - lastPatch < 140) return;
  lastPatch = ts;
  const mod = SEC[S.sec];
  if (mod && mod.patchData) mod.patchData();
}

function boot() {
  let saved = '';
  try { saved = localStorage.getItem('motorlab3-theme') || ''; } catch (e) {}
  $('themeSel').value = saved;
  setTheme(saved);

  bindGlobalToolbar();
  bindPointer();
  SECTIONS.forEach(s => SEC[s].bindToolbar());

  BOOTED = true;                 // draw() is a no-op until here — see part4
  setSection('field');
  setMode('sim');
  setSpeed(1);

  window.addEventListener('resize', resize);
  resize();

  window.addEventListener('keydown', e => {
    const t = (e.target.tagName || '').toUpperCase();
    if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA' || t === 'BUTTON') return;
    if (e.code === 'Space') { e.preventDefault(); $('btnAnim').click(); }
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && S.mode === 'sim') {
      const i = SECTIONS.indexOf(S.sec);
      const n = (i + (e.key === 'ArrowRight' ? 1 : SECTIONS.length - 1)) % SECTIONS.length;
      setSection(SECTIONS[n]); clickSnd();
    }
    if (e.key === 'Escape' && S.zoom.k > 1) setZoom(1);
  });

  /* ONE requestAnimationFrame loop for the whole app: tick() and
     maybePatchPanel() share a single callback per frame, not two competing. */
  requestAnimationFrame(function loop(ts) {
    tick(ts);
    maybePatchPanel(ts);
    requestAnimationFrame(loop);
  });
}
window.addEventListener('DOMContentLoaded', boot);

/* ---------------- test hooks (spec rule 12) ----------------
   Exposed so the file can be driven and verified programmatically rather
   than only by clicking. */
window.S = S;
window.SEC = SEC;
window.PHYS = PHYS;

window.setSpeed = setSpeed;
window.setZoom = setZoom;
window.toLogical = toLogical;
window.refreshPanels = refreshPanels;
window.draw = draw;
window.VT = VT;
window.clampPan = clampPan;
/* one setter per section, so a test can put a section into any state without
   simulating a click path */
window.setSectionState = (sec, patch) => {
  Object.assign(SEC[sec].S, patch);
  SEC[sec].syncToolbar();
  refreshPanels();
  draw();
};

</script>
