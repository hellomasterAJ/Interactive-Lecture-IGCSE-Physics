/* ══ BASE ══ */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  padding:6px 10px;display:flex;flex-direction:column;align-items:center;
  transition:background .25s,color .25s;font-size:13px}
.container{max-width:1620px;width:100%;height:100%;display:flex;flex-direction:column;min-height:0;gap:5px}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

/* ── top bar (45px: the brand sets it) ── */
.top-bar{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;gap:8px}
.top-bar h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
.badge-top{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;padding:2px 8px;border-radius:12px;
  background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent)}
.top-right{display:flex;gap:8px;align-items:center}
.mode-tabs{display:flex;gap:4px;background:var(--card);border-radius:8px;padding:3px;border:1px solid var(--border)}
.mode-tab{padding:5px 12px;border-radius:6px;border:none;font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:10px;cursor:pointer;transition:all .18s;background:transparent;color:var(--text-dim)}
.mode-tab:hover{color:var(--text)}
.mode-tab.active{background:var(--accent-glow);color:var(--accent)}
.theme-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;
  border-radius:8px;cursor:pointer;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;
  outline:none;min-width:110px}
.brand{background:#F4C01E;border-radius:10px;padding:7px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);
  display:flex;align-items:center}
.brand img{height:31px;width:auto;display:block}
@media(max-width:640px){.brand{display:none}}

/* ── mode tabs (the three teaching methods) ── */
.tabrow{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:4px;flex:0 0 auto;height:42px;align-items:center;box-sizing:border-box}
.tab{flex:1 1 0;height:34px;line-height:34px;padding:0 10px;border:none;border-radius:7px;
  background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;
  transition:all .18s;white-space:nowrap;box-sizing:border-box}
.tab:hover{color:var(--text);background:var(--card2)}
.tab.active{background:var(--accent);color:var(--bg)}

/* ── example pills + angle convention ── */
.pillrow{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding:0 2px}
/* fixed heights: the example pills carry emoji whose glyph boxes differ between
   modes, and a taller glyph would otherwise push the whole canvas down a pixel */
.pillrow{min-height:32px;flex-wrap:wrap;row-gap:5px}
.brk{display:none;flex-basis:100%;height:0}
.pillrow.two .brk{display:block}
.pills{display:flex;gap:3px;background:var(--card);border:1px solid var(--border);border-radius:9px;
  padding:3px;height:32px;align-items:center;box-sizing:border-box}
.pill{padding:0 11px;height:24px;line-height:24px;border:none;border-radius:6px;background:transparent;
  color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:all .16s;box-sizing:border-box}
.pill:hover{color:var(--text)}
.pill.active{background:var(--accent);color:var(--bg);font-weight:600}
.pills.gold .pill.active{background:var(--amber);color:#1a1a1a}
.pills.locked,.tgroup.locked,.sliders.locked{opacity:.42;pointer-events:none}
.spacer{flex:1 1 auto}
.tlabel{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}

/* ── toolbar (3 rows) ── */
.toolbar{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:7px 11px;flex:0 0 auto}
.trow{display:flex;gap:8px 14px;align-items:center;flex-wrap:nowrap;overflow:hidden;
  height:30px;box-sizing:border-box}
.tgroup{display:flex;align-items:center;gap:6px}
.tgroup+.tgroup{border-left:1px solid var(--border);padding-left:12px}
.tgroup.nb,.spacer+.tgroup{border-left:0;padding-left:0}
.tgroup.slot-hidden,.ctrl-btn.slot-hidden{visibility:hidden}
.ctrl-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:0 12px;
  height:28px;line-height:26px;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:600;
  transition:all .16s;white-space:nowrap;box-sizing:border-box}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.ctrl-btn:disabled{opacity:.4;cursor:default;border-color:var(--border);color:var(--text-muted)}
.ctrl-btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.ctrl-btn.primary:hover{filter:brightness(1.08);color:var(--bg)}
.ctrl-btn.gold{border-color:var(--v-res);color:var(--v-res)}
.ctrl-btn.gold.active{background:var(--v-res);color:#1a1a1a}
.ctrl-btn.on{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.tin{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:7px;
  padding:4px 7px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;outline:none}
.tin:focus{border-color:var(--accent)}
.tin.w3{width:58px}.tin.w4{width:66px}
.hintchip{font-size:10px;color:var(--text-muted);white-space:nowrap}

/* ── main split 70/30 ── */
.main{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,7fr) minmax(320px,3fr);
  grid-template-rows:minmax(0,1fr);gap:8px;min-height:0}
.cvwrap{position:relative;background:var(--graph-bg);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;min-height:0}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.cchip{position:absolute;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;padding:3px 8px;
  border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text-dim);
  pointer-events:none}
.cchip.warn{color:var(--amber);border-color:var(--amber)}

#chipEq{bottom:8px;left:10px;color:var(--accent);border-color:var(--accent);padding:4px 10px}
#chipState{top:8px;right:10px}
#chipHint{bottom:8px;right:10px;line-height:1.5;text-align:right;max-width:60%}
sub{font-size:.72em;vertical-align:-.28em;letter-spacing:0;margin-left:-.12em}

/* ── side panel ── */
.panel{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);
  border-radius:12px;min-height:0;overflow:hidden}
.ptabs{display:flex;gap:3px;padding:5px;border-bottom:1px solid var(--border);flex:0 0 auto}
.ptab{flex:1 1 0;padding:5px 4px;border:none;border-radius:7px;background:transparent;color:var(--text-dim);
  font-size:11px;font-weight:600;cursor:pointer;transition:all .16s}
.ptab:hover{color:var(--text);background:var(--card2)}
.ptab.active{background:var(--accent-glow);color:var(--accent)}
.pbody{position:relative;flex:1 1 auto;overflow-y:auto;padding:9px 11px;min-height:0}
/* KaTeX hides a MathML copy with position:absolute; without a positioned
   ancestor it escapes this box and stretches the page instead of scrolling */
.pbody::-webkit-scrollbar{width:8px}
.pbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sec-h{width:100%;display:flex;align-items:center;gap:7px;background:transparent;border:none;cursor:pointer;
  color:var(--text-muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  padding:6px 0 4px}
.sec-h:hover{color:var(--text-dim)}
.sec-h .chev{transition:transform .18s;font-size:9px}
.sec-h.closed .chev{transform:rotate(-90deg)}
.sec-h .cnt{margin-left:auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;
  background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:1px 6px}
.sec-b{padding-bottom:6px}

/* readout badges */
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 6px}
.bdg{display:flex;align-items:baseline;gap:5px;background:var(--card2);border:1px solid var(--border);
  border-radius:8px;padding:4px 9px;font-size:10.5px;color:var(--text-dim)}
.bdg b{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--text)}
.bdg.res b{color:var(--v-res)}

/* per-vector rows */
.vrow{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px dashed var(--border);
  font-size:11.5px}
.vrow:last-child{border-bottom:none}
.vrow .sw{width:14px;height:14px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(127,127,127,.4)}
.vrow .nm{font-weight:700;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
.vrow .val{margin-left:auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;
  color:var(--text);white-space:nowrap}
.vrow .cmp{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;color:var(--text-muted)}
.vrow .del{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:12px;padding:0 2px}
.vrow .del:hover{color:var(--red)}
.empty{font-size:11.5px;color:var(--text-muted);padding:10px 0;line-height:1.6}

/* readings taken with the tools */
.rd{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 2px}
.rdbox{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;text-align:center}
.rdbox .v{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15px;font-weight:700;color:var(--v-tool)}
.rdbox .k{font-size:10px;color:var(--text-muted);margin-top:2px}

.note{font-size:11.5px;line-height:1.62;color:var(--text-dim);margin:6px 0}
.note b{color:var(--text)}
.eqbox{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin:7px 0;
  overflow-x:auto;color:var(--katex-color)}
.eqbox .katex{font-size:1.02em}
.calc{margin:0 0 9px}
.calc .ct{font-size:10px;letter-spacing:.55px;text-transform:uppercase;color:var(--text-muted);
  font-weight:700;margin:9px 0 1px}
.calc .eqbox{margin:2px 0 0;padding:7px 9px}
.calc .cn{font-size:11px;line-height:1.5;color:var(--text-muted);margin:3px 0 0}
.steps{margin:6px 0 6px 16px;padding:0}
.steps li{font-size:11.5px;line-height:1.6;color:var(--text-dim);margin-bottom:5px}
.steps li b{color:var(--text)}
.keyrow{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:11.5px;color:var(--text-dim)}
.keyrow b{color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px}
.sw2{width:26px;height:11px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(127,127,127,.35)}
.keyrow .u{margin-left:auto;font-size:10px;color:var(--text-muted);
  font-family:'JetBrains Mono',ui-monospace,monospace}
.kgrp{margin:8px 0 1px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);
  font-weight:700}
.kgrp:first-child{margin-top:2px}

/* practice / quiz */
.qbtn{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--border);
  border-radius:9px;padding:8px 10px;margin:4px 0;color:var(--text);font-size:12px;cursor:pointer;
  transition:all .16s}
.qbtn:hover{border-color:var(--accent)}
.qbtn.sel{border-color:var(--accent);background:var(--accent-glow)}
.qbtn.right{border-color:var(--green);background:rgba(52,211,153,.10)}
.qbtn.wrong{border-color:var(--red);background:rgba(248,113,113,.10)}
.qbtn .tag{display:inline-block;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;
  padding:1px 6px;border-radius:7px;background:var(--card);border:1px solid var(--border);
  color:var(--text-dim);margin-right:7px}
.ansin{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;
  padding:7px 9px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;outline:none;margin:4px 0}
.ansin:focus{border-color:var(--accent)}
.stars{font-size:16px;letter-spacing:2px;color:var(--v-res)}
table.rt{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px}
table.rt th,table.rt td{text-align:left;padding:4px 5px;border-bottom:1px solid var(--border);color:var(--text-dim)}
table.rt th{color:var(--text-muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.5px}
table.rt td.ok{color:var(--green)}table.rt td.no{color:var(--red)}
.ptask{background:var(--card2);border:1px solid var(--accent);border-radius:9px;padding:9px 11px;margin:2px 0 8px}
.ptask .h{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700}
.ptask .q{font-size:12.5px;line-height:1.6;color:var(--text);margin-top:4px}


/* ── energy lab additions ── */
.sliders{display:flex;gap:12px;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
  min-height:30px}
.sliders::-webkit-scrollbar{height:5px}
.sliders::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sl{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
.sl label{font-size:10px;color:var(--text-muted);text-transform:none;letter-spacing:.2px}
.sl input[type=range]{width:88px;accent-color:var(--accent);cursor:pointer;height:16px}
.sl .val{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;color:var(--text);
  min-width:52px;text-align:right}
.ebars{margin:6px 0}
.erow{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11.5px}
.erow .sw{width:13px;height:13px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(127,127,127,.4)}
.erow .nm{color:var(--text-dim)}
.erow .val{margin-left:auto;font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--text)}
.tag2{display:inline-block;font-size:9px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;
  padding:1px 6px;border-radius:7px;background:var(--card2);border:1px solid var(--border);
  color:var(--text-muted);margin-left:6px}
.tag2.adv{color:var(--v-res);border-color:var(--v-res)}

/* ── bottom bar ── */
.bottom-bar{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;
  font-size:10.5px;color:var(--text-muted);padding:0 3px;min-height:20px}
.bottom-bar .mono{color:var(--text-dim)}
</style>
</head>

    <div class="top-right">
      <div class="mode-tabs" id="gMode">
        <button class="mode-tab active" data-m="sim">Simulate</button>

<script>
/* ===================== ENERGY LAB v2 — core ==============================
   One idea runs through the whole lab: energy is money, the joule is the token,
   and every store is a bank account. This file holds the state, the canvas
   plumbing, and the Energy Bank — the picture every scene comes back to.   */

var CV, CX, W = 1200, H = 776;
var VT = { s: 1, ox: 0, oy: 0, dpr: 1, cw: W, ch: H };

/* ---------- the ten accounts, and the colour each one keeps everywhere --- */
var STORE = {
  ke: { n: 'Kinetic', d: '#fbbf24', l: '#b45309', about: 'anything moving' },
  gpe: { n: 'Gravitational', d: '#34d399', l: '#047857', about: 'anything lifted up' },
  elas: { n: 'Elastic', d: '#a78bfa', l: '#6d28d9', about: 'anything stretched or squashed' },
  therm: { n: 'Thermal', d: '#f87171', l: '#b91c1c', about: 'anything warm' },
  chem: { n: 'Chemical', d: '#38bdf8', l: '#0369a1', about: 'fuel, food, batteries' },
  rad: { n: 'Radiant', d: '#fde047', l: '#a16207', about: 'light on its way', transit: true },
  elec: { n: 'Electrical', d: '#d946ef', l: '#a21caf', about: 'charge on its way', transit: true },
  mag: { n: 'Magnetic', d: '#f472b6', l: '#be185d', about: 'magnets held apart' },
  snd: { n: 'Sound', d: '#fb923c', l: '#c2410c', about: 'sound on its way', transit: true },
  nuc: { n: 'Nuclear', d: '#94a3b8', l: '#475569', about: 'inside the nucleus' }
};
var STORE_ORDER = ['gpe', 'ke', 'elas', 'therm', 'chem', 'rad', 'elec', 'mag', 'snd', 'nuc'];

var C = {}, LIGHT = false;
function readTheme() {
  var cs = getComputedStyle(document.documentElement);
  ['bg', 'card', 'card2', 'border', 'text', 'text-dim', 'text-muted', 'accent',
    'accent-glow', 'graph-bg', 'grid', 'green', 'amber', 'red', 'blue', 'violet',
    'orange', 'rose', 'katex-color'].forEach(function (n) {
      C[n] = cs.getPropertyValue('--' + n).trim() || '#888';
    });
  LIGHT = lum(C['graph-bg']) > 0.5;
  C.guide = C['text-muted'];
}
function lum(hex) {
  hex = (hex || '#000').trim();
  if (hex[0] !== '#') return 0;
  if (hex.length === 4) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
  var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255,
    b = parseInt(hex.slice(5, 7), 16) / 255;
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
/* one colour per store, picked to stay readable on light and dark themes */
function scol(k) {
  var s = STORE[k];
  if (!s) return C['text-dim'];
  return LIGHT ? s.l : s.d;
}
function sname(k) { return STORE[k] ? STORE[k].n : k; }

/* ---------- state ------------------------------------------------------- */
var S = {
  md: 1,                       /* 1..4                                       */
  g4: '4S',                    /* which row of Mode 4 is showing             */
  ex: {},                      /* chosen example per group                   */
  mode: 'sim',                 /* sim | prac | quiz                          */
  ptab: 'data',
  note: 'uk',
  play: false, speed: 1, t: 0,
  bank: true, coins: true, nums: true, chain: true,
  v: {},                       /* every slider value                         */
  secOpen: { val: true, eq: true, key: false },
  task: null, quiz: null,
  cardPos: {},                 /* where the student dragged each card       */
  drag: null
};
window.S = S;

function $(id) { return document.getElementById(id); }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function cosd(d) { var c = Math.cos(d * Math.PI / 180); return Math.abs(c) < 1e-12 ? 0 : c; }
function sind(d) { var s = Math.sin(d * Math.PI / 180); return Math.abs(s) < 1e-12 ? 0 : s; }
function fmt(v, d) {
  if (!isFinite(v)) return '—';
  var s = (Math.abs(v) >= 1e7 || (Math.abs(v) !== 0 && Math.abs(v) < 1e-3))
    ? v.toExponential(2) : v.toFixed(d == null ? 2 : d);
  return s === '-0' || /^-0\.0*$/.test(s) ? s.slice(1) : s;
}
function fmtJ(j) {
  var a = Math.abs(j);
  if (a >= 1e9) return fmt(j / 1e9, 2) + ' GJ';
  if (a >= 1e6) return fmt(j / 1e6, 2) + ' MJ';
  if (a >= 1e3) return fmt(j / 1e3, 2) + ' kJ';
  return fmt(j, 1) + ' J';
}
function fmtW(w) {
  var a = Math.abs(w);
  if (a >= 1e6) return fmt(w / 1e6, 2) + ' MW';
  if (a >= 1e3) return fmt(w / 1e3, 2) + ' kW';
  return fmt(w, 1) + ' W';
}

/* ---------- UK / US wording --------------------------------------------- */
var NOTE = {
  uk: { s: 's', sName: 'distance moved', work: 'work done' },
  us: { s: 'd', sName: 'distance', work: 'work' }
};
function N() { return NOTE[S.note]; }
function sSym() { return N().s; }

/* ---------- canvas ------------------------------------------------------- */
function resize() {
  var r = CV.parentElement.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  CV.width = Math.round(r.width * dpr);
  CV.height = Math.round(r.height * dpr);
  var s = Math.min(r.width / W, r.height / H);
  VT = { s: s, dpr: dpr, cw: r.width, ch: r.height, ox: (r.width - W * s) / 2, oy: 0 };
}
function applyVT() {
  CX.setTransform(VT.dpr, 0, 0, VT.dpr, 0, 0);
  CX.clearRect(0, 0, VT.cw, VT.ch);
  CX.translate(VT.ox, VT.oy);
  CX.scale(VT.s, VT.s);
}

/* ---------- drawing vocabulary ------------------------------------------ */
function txt(str, x, y, size, col, align, weight, base) {
  CX.save();
  CX.font = (weight || 500) + ' ' + (size || 12) + "px Inter,system-ui,sans-serif";
  CX.fillStyle = col || C.text; CX.textAlign = align || 'left';
  CX.textBaseline = base || 'alphabetic';
  CX.fillText(str, x, y); CX.restore();
}
function mtxt(str, x, y, size, col, align, weight, base) {
  CX.save();
  CX.font = (weight || 500) + ' ' + (size || 12) + "px 'JetBrains Mono',ui-monospace,monospace";
  CX.fillStyle = col || C.text; CX.textAlign = align || 'left';
  CX.textBaseline = base || 'alphabetic';
  CX.fillText(str, x, y); CX.restore();
}
function textW(str, size, weight, mono) {
  CX.save();
  CX.font = (weight || 500) + ' ' + (size || 12) + 'px ' +
    (mono ? "'JetBrains Mono',ui-monospace,monospace" : 'Inter,system-ui,sans-serif');
  var w = CX.measureText(str).width; CX.restore();
  return w;
}
function wrap(str, x, y, maxW, size, col, lh, weight) {
  var words = String(str).split(' '), line = '', n = 0;
  lh = lh || size * 1.55;
  for (var i = 0; i < words.length; i++) {
    var t = line ? line + ' ' + words[i] : words[i];
    if (textW(t, size, weight || 500) > maxW && line) {
      txt(line, x, y + n * lh, size, col, 'left', weight || 500); n++; line = words[i];
    } else line = t;
  }
  if (line) { txt(line, x, y + n * lh, size, col, 'left', weight || 500); n++; }
  return n;
}
function withA(hex, a) {
  hex = (hex || '#888').trim();
  var m = /^rgba?\(([^)]+)\)$/.exec(hex);
  if (m) { var p = m[1].split(','); return 'rgba(' + (+p[0]) + ',' + (+p[1]) + ',' + (+p[2]) + ',' + a + ')'; }
  if (hex[0] !== '#') return hex;
  if (hex.length === 4) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
  return 'rgba(' + parseInt(hex.slice(1, 3), 16) + ',' + parseInt(hex.slice(3, 5), 16) + ',' +
    parseInt(hex.slice(5, 7), 16) + ',' + a + ')';
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  CX.beginPath();
  CX.moveTo(x + r, y);
  CX.arcTo(x + w, y, x + w, y + h, r);
  CX.arcTo(x + w, y + h, x, y + h, r);
  CX.arcTo(x, y + h, x, y, r);
  CX.arcTo(x, y, x + w, y, r);
  CX.closePath();
}
function plate(str, x, y, size, col, align, mono) {
  var w = textW(str, size, 700, !!mono) + 12;
  var px = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
  px = clamp(px, 6, W - w - 6);
  CX.save(); CX.fillStyle = withA(C.card, .92);
  rr(px, y - size - 3, w, size + 8, 5); CX.fill(); CX.restore();
  (mono ? mtxt : txt)(str, px + 6, y, size, col, 'left', 700);
}
function line(x1, y1, x2, y2, col, w, dash) {
  CX.save();
  CX.strokeStyle = col; CX.lineWidth = w || 1.5;
  if (dash) CX.setLineDash(dash);
  CX.beginPath(); CX.moveTo(x1, y1); CX.lineTo(x2, y2); CX.stroke();
  CX.restore();
}
function arrow(x1, y1, x2, y2, col, w, o) {
  o = o || {};
  var dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
  var head = o.head || Math.min(15, Math.max(8, (w || 3) * 3.2));
  var ux = dx / L, uy = dy / L, bx = x2 - ux * head, by = y2 - uy * head;
  CX.save();
  CX.strokeStyle = col; CX.lineWidth = w || 3; CX.lineCap = 'round';
  if (o.dash) CX.setLineDash(o.dash);
  CX.beginPath(); CX.moveTo(x1, y1); CX.lineTo(bx, by); CX.stroke();
  CX.setLineDash([]);
  CX.fillStyle = col;
  CX.beginPath(); CX.moveTo(x2, y2);
  CX.lineTo(bx - uy * head * .42, by + ux * head * .42);
  CX.lineTo(bx + uy * head * .42, by - ux * head * .42);
  CX.closePath(); CX.fill();
  CX.restore();
}
function dot(x, y, r, col, hollow) {
  CX.save();
  if (hollow) {
    CX.fillStyle = C['graph-bg']; CX.beginPath(); CX.arc(x, y, r, 0, 7); CX.fill();
    CX.strokeStyle = col; CX.lineWidth = 2; CX.beginPath(); CX.arc(x, y, r, 0, 7); CX.stroke();
  } else { CX.fillStyle = col; CX.beginPath(); CX.arc(x, y, r, 0, 7); CX.fill(); }
  CX.restore();
}
function card(x, y, w, h, title) {
  CX.save();
  CX.fillStyle = withA(C.card, .5);
  rr(x, y, w, h, 10); CX.fill();
  CX.strokeStyle = withA(C.border, .9); CX.lineWidth = 1;
  rr(x, y, w, h, 10); CX.stroke();
  CX.restore();
  if (title) txt(title, x + 13, y + 20, 11.5, C['text-muted'], 'left', 700);
}
/* ---------- draggable cards ----------------------------------------------
   A scene draws its explanation in ordinary absolute coordinates inside
   withCard(); the wrapper shifts the whole block by however far the student
   has dragged it, and records the rectangle so the pointer can find it.   */
var CARD_HITS = [];
function cardId(id) { return groupOf() + '/' + curKey() + '/' + id; }
function cardOff(id) { return S.cardPos[cardId(id)] || { x: 0, y: 0 }; }
function withCard(id, x, y, w, h, body) {
  var off = cardOff(id);
  CX.save();
  CX.translate(off.x, off.y);
  body();
  grip(x + w - 20, y + 13);
  CX.restore();
  CARD_HITS.push({ id: cardId(id), x: x + off.x, y: y + off.y, w: w, h: h });
}
/* the six dots that say "you can move me" */
function grip(x, y) {
  CX.save();
  CX.fillStyle = withA(C['text-muted'], S.drag ? .8 : .45);
  for (var r = 0; r < 3; r++) for (var c = 0; c < 2; c++) {
    CX.beginPath(); CX.arc(x + c * 5, y + r * 5, 1.5, 0, 7); CX.fill();
  }
  CX.restore();
}
/* which card is under this point, topmost first */
function cardAt(px, py) {
  for (var i = CARD_HITS.length - 1; i >= 0; i--) {
    var r = CARD_HITS[i];
    if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return r;
  }
  return null;
}

function sceneHeader(title, sub) {
  CX.save();
  CX.fillStyle = withA(C['graph-bg'], .95);
  CX.fillRect(0, 0, W, 66);
  CX.strokeStyle = withA(C.border, .6); CX.lineWidth = 1;
  CX.beginPath(); CX.moveTo(0, 66.5); CX.lineTo(W, 66.5); CX.stroke();
  CX.restore();
  txt(title, 32, 30, 18, C.text, 'left', 700);
  txt(sub, 32, 52, 12.5, C['text-dim'], 'left', 500);
  return 66;
}

/* ---------- one token, and a pile of them -------------------------------- */
function coin(x, y, r, col) {
  CX.save();
  CX.fillStyle = col;
  CX.beginPath(); CX.arc(x, y, r, 0, 7); CX.fill();
  CX.strokeStyle = withA('#000000', LIGHT ? .25 : .35); CX.lineWidth = 1;
  CX.beginPath(); CX.arc(x, y, r, 0, 7); CX.stroke();
  CX.fillStyle = withA('#ffffff', .45);
  CX.beginPath(); CX.arc(x - r * .3, y - r * .3, r * .34, 0, 7); CX.fill();
  CX.restore();
}

/* one line of text that shrinks until it fits the width it is given */
function fitTxt(str, x, y, maxW, size, col, align, weight) {
  var sz = size;
  while (sz > 8 && textW(str, sz, weight || 500) > maxW) sz -= 0.5;
  txt(str, x, y, sz, col, align || 'left', weight || 500);
  return sz;
}

/* ---------- a one-line chain in the stores' own colours -------------------
   parts: [{t:'chemical', k:'chem'}, {t:' → '}, {t:'thermal', k:'therm'}, …]
   It shrinks to fit maxW, so a caption can never run off its card.       */
function runLine(parts, x, y, maxW, size, align, weight) {
  var w = size, i, total;
  var measure = function (sz) {
    var t = 0;
    for (i = 0; i < parts.length; i++) t += textW(parts[i].t, sz, parts[i].k ? 700 : (weight || 500));
    return t;
  };
  while (w > 8 && measure(w) > maxW) w -= 0.5;
  total = measure(w);
  var cx = align === 'center' ? x - total / 2 : (align === 'right' ? x - total : x);
  for (i = 0; i < parts.length; i++) {
    var pt = parts[i];
    txt(pt.t, cx, y, w, pt.c || (pt.k ? scol(pt.k) : C['text-muted']), 'left',
      pt.k ? 700 : (weight || 500));
    cx += textW(pt.t, w, pt.k ? 700 : (weight || 500));
  }
  return w;
}

/* ---------- a pictogram person -------------------------------------------
   Built the way the standard "stick people" signs are: a solid round head,
   one chunky bar for the body, and thick round-capped limbs. Every limb is
   two bones of FIXED length with a real elbow or knee, so an arm can never
   stretch to reach something — it straightens and falls short instead.   */

/* two bones of length L1 then L2, from (ax,ay) towards (tx,ty).
   bend picks which way the joint folds. Returns where the hand really is. */
function limb(ax, ay, tx, ty, L1, L2, bend) {
  var dx = tx - ax, dy = ty - ay;
  var raw = Math.sqrt(dx * dx + dy * dy) || 1e-6;
  var ux = dx / raw, uy = dy / raw;
  /* never let it lock out perfectly straight: a real joint keeps a little
     bend, and a straight spike is exactly what looks broken               */
  var reach = (L1 + L2) * 0.985, fold = Math.abs(L1 - L2) + (L1 + L2) * 0.25;
  var d = raw > reach ? reach : (raw < fold ? fold : raw);
  var hx = ax + ux * d, hy = ay + uy * d;
  var a = (d * d + L1 * L1 - L2 * L2) / (2 * d);
  var hh = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
  var sgn = bend < 0 ? -1 : 1;
  var ex = ax + ux * a - uy * hh * sgn, ey = ay + uy * a + ux * hh * sgn;
  CX.beginPath(); CX.moveTo(ax, ay); CX.lineTo(ex, ey); CX.lineTo(hx, hy); CX.stroke();
  return { x: hx, y: hy, ex: ex, ey: ey, short: raw > reach };
}

function person(x, footY, o) {
  o = o || {};
  var h = o.h || 110, col = o.col || C['text-dim'], f = o.flip ? -1 : 1;
  var pose = o.pose || 'stand';

  /* the skeleton, as fractions of the figure's height ------------------- */
  var hipY = footY - h * 0.46;
  var shoY = footY - h * 0.72;
  var headY = footY - h * 0.875, hr = h * 0.115;
  var armL = h * 0.175;                            /* upper arm = forearm   */
  var legL = h * 0.237;                            /* thigh    = shin       */
  var handY = footY - h * 0.40;                    /* a hand hangs to the hip */
  var stride = o.stride == null ? 0.09 : o.stride;
  var shy = shoY + h * 0.05;
  var reach = o.reach || { x: x + h * 0.36 * f, y: shy };

  CX.save();
  CX.lineCap = 'round'; CX.lineJoin = 'round';
  CX.strokeStyle = col; CX.fillStyle = col;

  /* head */
  CX.beginPath(); CX.arc(x, headY, hr, 0, 7); CX.fill();

  /* body — one thick bar */
  CX.lineWidth = h * 0.19;
  CX.beginPath(); CX.moveTo(x, shoY + h * 0.02); CX.lineTo(x, hipY); CX.stroke();

  /* This is a side view, so one arm and one leg are on the far side of the
     body. Drawing them a shade lighter keeps them readable instead of
     vanishing into the torso.                                            */
  var far = withA(col, 0.55);

  /* legs: the feet are the targets, the knees fall where they must.
     Both knees fold the same way, or the figure comes out bow-legged.    */
  CX.lineWidth = h * 0.088;
  CX.strokeStyle = far;
  if (pose === 'run') limb(x - h * 0.03, hipY, x - h * 0.18 * f, footY - h * 0.02, legL, legL, -f);
  else limb(x - h * 0.03, hipY, x - h * stride * f, footY, legL, legL, -f);
  CX.strokeStyle = col;
  if (pose === 'run') limb(x + h * 0.03, hipY, x + h * 0.20 * f, footY - h * 0.10, legL, legL, -f);
  else limb(x + h * 0.03, hipY, x + h * stride * f, footY, legL, legL, -f);

  /* arms — the far one first, so the working arm sits on top */
  CX.lineWidth = h * 0.072;
  CX.strokeStyle = far;
  if (pose === 'lift' || pose === 'push') limb(x, shy, x - h * 0.13 * f, handY, armL, armL, -f);
  else if (pose === 'run') limb(x, shy, x - h * 0.13 * f, handY + h * 0.05, armL, armL, -f);
  else limb(x, shy, x - h * 0.13, handY, armL, armL, -1);
  CX.strokeStyle = col;
  if (pose === 'lift' || pose === 'push')
    limb(x, shy, reach.x, reach.y, armL, armL, reach.y < shy ? -f : f);
  else if (pose === 'run') limb(x, shy, x + h * 0.18 * f, shy - h * 0.02, armL, armL, f);
  else limb(x, shy, x + h * 0.13, handY, armL, armL, 1);
  CX.restore();
}

/* ---------- THE ENERGY BANK — the hero picture of v2 ---------------------
   items: [{k:'gpe', v: 120}, …]  ·  opt.total forces the locked total,
   opt.note is the one line under the row, opt.max fixes the token scale.   */
var BANK = { y: 571, h: 176 };
function energyBank(items, opt) {
  if (!S.bank) return;
  opt = opt || {};
  items = items.filter(function (e) { return e.v > 0 || e.keep; });
  if (!items.length) return;
  var x0 = 24, y0 = opt.y == null ? BANK.y : opt.y, wAll = W - 48, h = opt.h || BANK.h;
  var total = opt.total != null ? opt.total
    : items.reduce(function (a, b) { return a + Math.max(b.v, 0); }, 0);
  var coinJ = opt.coinJ || niceCoin(Math.max(total, 1));
  card(x0, y0, wAll, h, null);
  txt('THE ENERGY BANK', x0 + 16, y0 + 22, 11, C['text-muted'], 'left', 800);
  txt(opt.note || 'every account is a store · the tokens only ever move between them',
    x0 + 150, y0 + 22, 11.5, C['text-dim'], 'left', 500);

  /* the locked total sits on the right and never moves while the tokens do */
  var totW = 176, boxY = y0 + 34, boxH = h - 48;
  var n = items.length, gap = 12;
  var bw = clamp((wAll - totW - 46 - gap * (n - 1)) / n, 90, 250);
  var i, x = x0 + 16;
  for (i = 0; i < n; i++) {
    var e = items[i], col = scol(e.k);
    CX.save();
    CX.fillStyle = withA(col, .10);
    rr(x, boxY, bw, boxH, 8); CX.fill();
    CX.strokeStyle = withA(col, .8); CX.lineWidth = 1.4;
    rr(x, boxY, bw, boxH, 8); CX.stroke();
    CX.restore();
    txt(e.n || sname(e.k), x + 9, boxY + 18, 11, col, 'left', 700);
    if (STORE[e.k] && STORE[e.k].transit)
      txt('in transit', x + bw - 9, boxY + 18, 9, C['text-muted'], 'right', 600);
    /* the tokens themselves — one pile per account */
    if (S.coins) {
      var count = clamp(Math.round(e.v / coinJ), 0, 44), r = 6.5, perRow = Math.floor((bw - 18) / 15);
      for (var c = 0; c < count; c++) {
        var cx2 = x + 15 + (c % perRow) * 15;
        var cy2 = boxY + boxH - 16 - Math.floor(c / perRow) * 12;
        if (cy2 < boxY + 30) break;
        coin(cx2, cy2, r, col);
      }
      if (Math.round(e.v / coinJ) > 44)
        mtxt('+more', x + bw - 12, boxY + 34, 9, C['text-muted'], 'right', 700);
    } else {
      var bh = clamp(e.v / (opt.max || total || 1), 0, 1) * (boxH - 36);
      CX.save(); CX.fillStyle = withA(col, .75);
      rr(x + 12, boxY + boxH - 10 - bh, bw - 24, bh, 4); CX.fill(); CX.restore();
    }
    if (S.nums) mtxt(fmtJ(e.v), x + bw / 2, boxY + 34, 11.5, col, 'center', 700);
    x += bw + gap;
  }
  /* TOTAL — the point of the whole picture */
  var tx = x0 + wAll - totW - 14;
  CX.save();
  CX.fillStyle = withA(C.accent, .10);
  rr(tx, boxY, totW, boxH, 8); CX.fill();
  CX.strokeStyle = C.accent; CX.lineWidth = 1.8;
  rr(tx, boxY, totW, boxH, 8); CX.stroke();
  CX.restore();
  txt('🔒 TOTAL', tx + 12, boxY + 20, 11.5, C.accent, 'left', 800);
  mtxt(fmtJ(total), tx + totW / 2, boxY + boxH / 2 + 8, 19, C.accent, 'center', 700);
  /* the note under TOTAL must never spill out of its box */
  var tn = opt.totalNote || 'locked — it never changes';
  var tsz = 10;
  while (tsz > 7.5 && textW(tn, tsz, 500) > totW - 16) tsz -= 0.5;
  txt(tn, tx + totW / 2, boxY + boxH - 12, tsz, C['text-muted'], 'center', 500);
  if (S.coins) mtxt('1 token = ' + fmtJ(coinJ), x0 + wAll - totW - 26, y0 + 22, 10,
    C['text-muted'], 'right', 700);
}
/* the source account starts with a round purse, big enough that the transfer
   is a visible slice of it rather than one lonely token                     */
function purse(E, mult) {
  var t = Math.max(E, 1e-9) * (mult || 2.5);
  var p = Math.pow(10, Math.floor(Math.log(t) / Math.LN10));
  return Math.ceil(t / p * 2) / 2 * p;
}
/* a token worth a round number, so a pile is never absurd */
function niceCoin(total) {
  var want = total / 30, p = Math.pow(10, Math.floor(Math.log(want) / Math.LN10));
  var m = want / p;
  return (m > 5 ? 10 : m > 2 ? 5 : m > 1 ? 2 : 1) * p;
}

/* ---------- the transfer chain (store → store → store) ------------------ */
function chainDiagram(x, y, w, stages, opt) {
  if (!S.chain) return;
  opt = opt || {};
  var n = stages.length, bw = Math.min(160, (w - (n - 1) * 46) / n), i;
  var cx = x;
  for (i = 0; i < n; i++) {
    var st = stages[i], col = scol(st.k);
    CX.save();
    CX.fillStyle = withA(col, .16);
    rr(cx, y, bw, 54, 9); CX.fill();
    CX.strokeStyle = col; CX.lineWidth = 1.6;
    rr(cx, y, bw, 54, 9); CX.stroke();
    CX.restore();
    txt(sname(st.k), cx + bw / 2, y + 22, 12, col, 'center', 700);
    txt(st.n || '', cx + bw / 2, y + 40, 10, C['text-muted'], 'center', 500);
    if (STORE[st.k] && STORE[st.k].transit)
      txt('in transit', cx + bw / 2, y - 8, 9.5, C['text-muted'], 'center', 600);
    if (i < n - 1) {
      arrow(cx + bw + 8, y + 27, cx + bw + 38, y + 27, C['text-dim'], 2.4, { head: 10 });
      if (stages[i].waste) {
        arrow(cx + bw + 23, y + 40, cx + bw + 23, y + 74, scol('therm'), 2, { head: 9 });
        txt('waste', cx + bw + 30, y + 74, 9.5, scol('therm'), 'left', 600);
      }
    }
    cx += bw + 46;
  }
}

/* ---------- Sankey ------------------------------------------------------ */
/* ---------- a proper Sankey diagram --------------------------------------
   Drawn the way an exam paper draws one: one wide band comes in from the
   left, the useful stream carries straight on to an arrow head, and every
   wasted stream peels off and curves down to its own arrow head. Widths
   are strictly to scale, so "in = useful + wasted" is visible.
   The card SIZES ITSELF to the data — no empty space, no stretched runs —
   and it is draggable, so any scene can drop one in with one line.      */
function sankey(x, y, inV, flows, label, opt) {
  opt = opt || {};
  var live = flows.filter(function (f) { return f.v > 0; });
  if (!live.length) return;
  var outTot = live.reduce(function (a, b) { return a + b.v; }, 0) || 1;
  var total = Math.max(inV, outTot) || 1;

  /* ---- sizes, all derived from the data ------------------------------- */
  var band = opt.band || 112;                 /* the whole input, in pixels */
  var scale = band / total;
  var head = 15, padL = 20, padR = 20;
  var inW = opt.inW || 128, tail = opt.tail || 58;
  var titleH = opt.title === null ? 14 : 32;
  var dropH = opt.drop || 92;
  var sumOn = opt.sum !== false;

  var useful = live[0];
  var lblW = Math.max(textW(fmtJ(useful.v), 16, 800, true),
    textW('100%  ' + useful.n, 12.5, 600), 90) + 30;

  /* one column per wasted stream, wide enough for its arrow head */
  var cols = [], i, cx0;
  for (i = 1; i < live.length; i++)
    cols.push({ f: live[i], t: Math.max(live[i].v * scale, 7) });
  var colsW = 44;
  cols.forEach(function (c) {
    c.hf = clamp(c.t * 0.22, 8, 20); c.hl = clamp(c.t * 0.34, 14, 30);
    colsW += c.t + c.hf * 2 + 26;
  });

  var w = opt.w || (padL + inW + colsW + tail + lblW + padR);
  var h = opt.h || (titleH + 22 + band + dropH + 52 + (sumOn ? 26 : 0));

  withCard(opt.id || 'sankey', x, y, w, h, function () {
    if (opt.frame !== false) card(x, y, w, h, opt.title || 'Sankey diagram · widths to scale');

    var bx = x + padL, top = y + titleH;
    var inTop = top + 20, xSplit = bx + inW;
    var yFloor = inTop + band + dropH;

    /* place the wasted columns, then the useful arrow beyond them */
    var cx = xSplit + 44;
    cols.forEach(function (c) {
      c.xc = cx + c.t / 2; cx += c.t + c.hf * 2 + 26;
    });
    var xEnd = cx + tail;

    /* ---- the input band ------------------------------------------------ */
    var inCol = scol(opt.inK || 'chem');
    CX.save();
    CX.fillStyle = withA(inCol, .82);
    CX.fillRect(bx, inTop, inW, band);
    CX.strokeStyle = inCol; CX.lineWidth = 1.6;
    CX.strokeRect(bx, inTop, inW, band);
    CX.restore();
    txt(label || 'input', bx, inTop - 9, 12.5, C['text-dim'], 'left', 700);
    mtxt(fmtJ(inV), bx + inW / 2, inTop + band / 2 + 2, 15.5,
      LIGHT ? '#fff' : C['graph-bg'], 'center', 800);
    txt('100%', bx + inW / 2, inTop + band / 2 + 20, 12, withA(LIGHT ? '#fff' : C['graph-bg'], .8),
      'center', 700);

    /* ---- each outgoing stream ------------------------------------------ */
    var acc = inTop, ci = 0;
    live.forEach(function (f, k) {
      var t = Math.max(f.v * scale, 7), col = scol(f.k);
      var yTop = acc, yBot = acc + t, pc = Math.round(f.v / total * 100);
      CX.save();
      CX.fillStyle = withA(col, .82);
      CX.strokeStyle = col; CX.lineWidth = 1.6;
      CX.beginPath();

      if (k === 0) {
        var hl = clamp(t * 0.34, 14, 30), hf = clamp(t * 0.22, 8, 20);
        CX.moveTo(xSplit, yTop);
        CX.lineTo(xEnd - hl, yTop);
        CX.lineTo(xEnd - hl, yTop - hf);
        CX.lineTo(xEnd, (yTop + yBot) / 2);
        CX.lineTo(xEnd - hl, yBot + hf);
        CX.lineTo(xEnd - hl, yBot);
        CX.lineTo(xSplit, yBot);
        CX.closePath(); CX.fill(); CX.stroke();
        CX.restore();
        var my = (yTop + yBot) / 2;
        mtxt(fmtJ(f.v), xEnd + 22, my - 4, 16, col, 'left', 800);
        txt(pc + '%  ' + f.n, xEnd + 22, my + 16, 12.5, C['text-dim'], 'left', 600);
      } else {
        var c = cols[ci++], xc = c.xc, half = t / 2;
        var rIn = clamp(t * 0.12, 8, 18), rOut = rIn + t;
        CX.moveTo(xSplit, yTop);
        CX.lineTo(xc + half - rOut, yTop);
        CX.quadraticCurveTo(xc + half, yTop, xc + half, yTop + rOut);
        CX.lineTo(xc + half, yFloor - c.hl);
        CX.lineTo(xc + half + c.hf, yFloor - c.hl);
        CX.lineTo(xc, yFloor);
        CX.lineTo(xc - half - c.hf, yFloor - c.hl);
        CX.lineTo(xc - half, yFloor - c.hl);
        CX.lineTo(xc - half, yBot + rIn);
        CX.quadraticCurveTo(xc - half, yBot, xc - half - rIn, yBot);
        CX.lineTo(xSplit, yBot);
        CX.closePath(); CX.fill(); CX.stroke();
        CX.restore();
        mtxt(fmtJ(f.v), xc, yFloor + 22, 16, col, 'center', 800);
        txt(pc + '%  ' + f.n, xc, yFloor + 41, 12.5, C['text-dim'], 'center', 600);
      }
      acc += t;
    });

    /* ---- the balance, spelled out inside the picture -------------------- */
    if (sumOn) {
      var parts = [{ t: fmtJ(inV), k: opt.inK || 'chem' }, { t: '  =  ' }];
      live.forEach(function (f, k) {
        if (k) parts.push({ t: '  +  ' });
        parts.push({ t: fmtJ(f.v), k: f.k });
      });
      parts.push({ t: '     in = useful + wasted, always' });
      runLine(parts, bx, y + h - 16, w - padL - padR, 13.5, 'left', 700);
    }
  });
}

/* ---------- F–s graph, the area IS the work ----------------------------- */
function fsGraph(x, y, w, h, fn, sMax, sNow, opt) {
  opt = opt || {};
  var col = opt.col || C.accent, i, fMax = 0;
  for (i = 0; i <= 80; i++) fMax = Math.max(fMax, Math.abs(fn(sMax * i / 80)));
  fMax = fMax || 1;
  card(x - 46, y - 30, w + 66, h + 64,
    (opt.title || 'force–' + N().sName + ' graph  ·  the shaded area IS the ' + N().work) +
    '   ·   F (N) vs ' + sSym() + ' (m)');
  line(x, y + h, x + w, y + h, C['text-muted'], 1.2);
  line(x, y, x, y + h, C['text-muted'], 1.2);
  mtxt('0', x, y + h + 18, 10, C['text-muted'], 'center');
  mtxt(fmt(sMax, 1), x + w, y + h + 18, 10, C['text-muted'], 'right');
  mtxt(fmt(fMax, 1), x - 8, y + 6, 10, C['text-muted'], 'right');
  function PX(v) { return x + (v / sMax) * w; }
  function PY(v) { return y + h - (v / (fMax * 1.12)) * h; }
  if (sNow > 0) {
    CX.save();
    CX.fillStyle = withA(col, .25);
    CX.beginPath(); CX.moveTo(PX(0), PY(0));
    for (i = 0; i <= 60; i++) CX.lineTo(PX(sNow * i / 60), PY(fn(sNow * i / 60)));
    CX.lineTo(PX(sNow), PY(0)); CX.closePath(); CX.fill();
    CX.strokeStyle = withA(col, .55); CX.lineWidth = 1; CX.stroke();
    CX.restore();
  }
  CX.save();

}

/* ---------- small animated pictures the scenes share -------------------- */
function makeParticles(n, seed) {
  var s = seed || 7, out = [];
  function rnd() { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }
  for (var i = 0; i < n; i++) out.push({ x: rnd(), y: rnd(), ph: rnd() * 6.28 });

}
function jiggle(x, y, w, h, ps, amp, col) {

  for (var i = 0; i < ps.length; i++) {

    dot(x + p.x * w + Math.sin(S.t * 5 + p.ph) * amp,

/* a travelling wave — sound, and anything else "in transit" */
function wave(x, y, w, amp, col, k, sp) {
  CX.save();
  CX.strokeStyle = col; CX.lineWidth = 2.2; CX.beginPath();
  for (var i = 0; i <= 120; i++) {
    var px = x + (i / 120) * w;

function rays(cx, cy, r0, n, len, col, phase) {

    var t0 = (S.t * 40) % 40;

/* ---------- KaTeX ------------------------------------------------------- */
function K(tex, display) {
  tex = String(tex).replace(/(\d)e([+-]?)(\d+)/g, function (m, d, sg, ex) {
    return d + '\\times10^{' + (sg === '-' ? '-' : '') + ex + '}';
  });
  if (!window.katex) return '<code>' + tex.replace(/[<&]/g, '') + '</code>';
  try { return katex.renderToString(tex, { displayMode: !!display, throwOnError: false }); }
  catch (e) { return '<code>' + tex.replace(/[<&]/g, '') + '</code>'; }
}

function loopPoint(u) {
  /* walk the rounded rectangle the circuit is drawn on */
  var x = 150, y = 170, w = 460, h = 200, per = 2 * (w + h), d = u * per;
  if (d < w) return { x: x + d, y: y };
  d -= w; if (d < h) return { x: x + w, y: y + d };
  d -= h; if (d < w) return { x: x + w - d, y: y + h };
  d -= w; return { x: x, y: y + h - d };
}

/* ---------- ball-and-stick molecules (for the burning scene) --------------
   CPK colours, the ones every chemistry textbook uses: carbon dark grey,
   hydrogen white, oxygen red.                                           */
var ATOM = { C: '#64748b', H: '#e2e8f0', O: '#ef4444' };
function atomBall(x, y, r, el) {
  CX.save();
  CX.fillStyle = ATOM[el] || '#94a3b8';
  CX.beginPath(); CX.arc(x, y, r, 0, 7); CX.fill();
  CX.strokeStyle = withA('#000000', .35); CX.lineWidth = 1.1;
  CX.beginPath(); CX.arc(x, y, r, 0, 7); CX.stroke();
  CX.fillStyle = withA('#ffffff', .40);
  CX.beginPath(); CX.arc(x - r * .32, y - r * .34, r * .30, 0, 7); CX.fill();
  CX.restore();
  txt(el, x, y + r * .40, Math.max(r * 1.05, 8), el === 'O' ? '#fff' : '#0f172a',
    'center', 800);
}
function stick(x1, y1, x2, y2, dbl, a) {
  CX.save();
  CX.strokeStyle = withA(C['text-dim'], .9 * (a == null ? 1 : a)); CX.lineCap = 'round';
  if (dbl) {
    var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy) || 1;
    var ox = -dy / L * 3.4, oy = dx / L * 3.4;
    CX.lineWidth = 2.8;
    CX.beginPath(); CX.moveTo(x1 + ox, y1 + oy); CX.lineTo(x2 + ox, y2 + oy); CX.stroke();
    CX.beginPath(); CX.moveTo(x1 - ox, y1 - oy); CX.lineTo(x2 - ox, y2 - oy); CX.stroke();
  } else {
    CX.lineWidth = 4.6;
    CX.beginPath(); CX.moveTo(x1, y1); CX.lineTo(x2, y2); CX.stroke();
  }
  CX.restore();
}

scene('1', 'chem', {

  draw: function () {
    var f = V('fuel'), E = f * 46000;      /* petrol ≈ 46 MJ/kg */

    /* CH₄ + 2O₂ → CO₂ + 2H₂O, told honestly: the molecules meet, then every
       atom SLIDES to its new partner. Nothing explodes at random — the

    var cyc = prog(7), st, q, u, p;
    if (cyc < 0.34) { st = 'in'; q = cyc / 0.34; u = 0; p = 0; }
    else if (cyc < 0.62) { st = 'react'; q = (cyc - 0.34) / 0.28; u = q * q * (3 - 2 * q); p = u; }
    else { st = 'out'; q = (cyc - 0.62) / 0.38; u = 1; p = 1; }

    withCard('zoom', 110, 110, 420, 322, function () {
      card(110, 110, 420, 322, 'burning the fuel  ·  CH₄ + 2O₂ → CO₂ + 2H₂O');
      var cx = 320, cy = 238;
      var apart = st === 'in' ? (1 - q) * 62 : 0;      /* still coming in    */
      var split = st === 'out' ? q * 66 : 0;           /* products drifting  */

      /* ---- where every atom starts, and where it ends up --------------- */
      var Cx = cx - 84, dH = 31, HA = [-90, 15, 90, 165];
      var o1x = cx + 54 - 0, o1y = cy - 52, o2x = cx + 54, o2y = cy + 52;
      var A = [];                                      /* one entry per atom */
      A.push({ el: 'C', r: 13, ax: Cx, ay: cy, bx: cx + 26, by: cy });
      HA.forEach(function (ang, i) {
        A.push({ el: 'H', r: 8, ax: Cx + cosd(ang) * dH, ay: cy + sind(ang) * dH,
          bx: 0, by: 0, water: i < 2 ? 0 : 1, slot: i % 2 });
      });
      /* the four oxygens: the two nearest the carbon become CO₂ */
      A.push({ el: 'O', r: 11, ax: o1x - 16, ay: o1y - 3, bx: cx + 26, by: cy - 32 });   /* 5 */
      A.push({ el: 'O', r: 11, ax: o1x + 16, ay: o1y + 3, bx: cx + 96, by: cy - 56 });   /* 6 */
      A.push({ el: 'O', r: 11, ax: o2x - 16, ay: o2y + 2, bx: cx + 26, by: cy + 32 });   /* 7 */
      A.push({ el: 'O', r: 11, ax: o2x + 16, ay: o2y - 2, bx: cx + 96, by: cy + 56 });   /* 8 */

        a.x = (a.ax + inOff) + ((a.bx + outOff) - (a.ax + inOff)) * u;
        a.y = a.ay + (a.by - a.ay) * u;
      });

      /* ---- bonds: the old ones fade as they stretch, the new ones grow -- */
      var OLD = [[0, 1], [0, 2], [0, 3], [0, 4], [5, 6, 1], [7, 8, 1]];
      var NEW = [[0, 5, 1], [0, 7, 1], [6, 1], [6, 2], [8, 3], [8, 4]];
      OLD.forEach(function (b) {
        if (u < 1) stick(A[b[0]].x, A[b[0]].y, A[b[1]].x, A[b[1]].y, b[2], 1 - u);

      { t: '  +  ' }, { t: 'radiant', k: 'rad' }, { t: '   ·  CO₂ and H₂O carry the rest away' }],
        130, 410, 390, 11.5, 'left');
    });

    formulaCard(580, 130, 400, fmt(f, 0) + ' g of petrol ≈ ' + fmtJ(E),

    withCard('note', 580, 250, 400, 150, function () {

function fire(x, y, p) {

      withA(scol('therm'), .8));

  txt('furnace', x, y + 40, 11.5, C['text-muted'], 'center', 600);
}
function boiler(x, y, p) {
  CX.save();

  rr(x - 40, y, 80, 110, 8); CX.stroke();
  CX.fillStyle = withA(scol('therm'), .25); rr(x - 38, y + 40, 76, 68, 6); CX.fill();
  CX.restore();
  for (var i = 0; i < 5; i++) {

  }
  txt('boiler', x, y + 130, 11.5, C['text-muted'], 'center', 600);
}
function turbine(x, y, ang) {
  CX.save();
  CX.translate(x, y); CX.rotate(ang);
  for (var i = 0; i < 6; i++) {
    CX.rotate(6.283 / 6);
    CX.fillStyle = withA(scol('ke'), .8);
    rr(-6, -46, 12, 40, 4); CX.fill();
  }
  CX.restore();
  dot(x, y, 8, C['text-dim']);
  txt('turbine', x, y + 70, 11.5, C['text-muted'], 'center', 600);
}
function genr(x, y, p) {
  CX.save();
  CX.strokeStyle = scol('elec'); CX.lineWidth = 2.5;

}

    /* work out which bounce we are in */
    var tt = S.t, hh = h, tb = Math.sqrt(2 * h / g), acc = 0, n = 0;
    while (tt > acc + 2 * tb && n < 10) { acc += 2 * tb; hh *= keep; tb = Math.sqrt(2 * hh / g); n++; }
    var tl = tt - acc, y = Math.max(hh - 0.5 * g * Math.pow(tl - tb, 2), 0);
    var floorY = 430, top = 130, sc = (floorY - top) / h;
    ground(floorY + 4, 90, 560);
    var squash = y < 0.05 ? 6 : 0;
    CX.save();
    CX.fillStyle = scol('ke');
    CX.beginPath();
    CX.ellipse(300, floorY - y * sc - 18 + squash, 18 + squash, 18 - squash, 0, 0, 7);
    CX.fill(); CX.restore();
    /* the ghosts of earlier bounce heights */
    var gh = h;
    for (var i = 0; i <= n && i < 6; i++) {
      line(90, floorY - gh * sc, 560, floorY - gh * sc, withA(C['text-muted'], .35), 1, [4, 6]);
      mtxt(fmt(gh, 2) + ' m', 566, floorY - gh * sc + 4, 10, C['text-muted'], 'left');
      gh *= keep;
    }
    var En = E0 * Math.pow(keep, n);
    var gpeNow = m * g * y, keNow = Math.max(En - gpeNow, 0);
    txt('bounce ' + n + ' · it keeps ' + fmt(keep * 100, 0) + '% of its tokens each time',
      90, 110, 13, C['text-dim'], 'left', 600);
    chainDiagram(620, 150, 520, [
      { k: 'gpe', n: 'held up' }, { k: 'ke', n: 'falling' },
      { k: 'elas', n: 'squashed', waste: true }, { k: 'ke', n: 'bouncing back' }]);
    withCard('note', 620, 280, 520, 150, function () {
      card(620, 280, 520, 150, 'where the missing tokens went');
      mtxt('started with     ' + fmtJ(E0), 640, 316, 12.5, C.accent, 'left', 700);
      mtxt('still bouncing   ' + fmtJ(En), 640, 344, 12.5, scol('ke'), 'left', 700);
      mtxt('warmed + sound   ' + fmtJ(E0 - En), 640, 372, 12.5, scol('therm'), 'left', 700);
      txt('the ball, the floor and the air are all very slightly warmer',
        640, 402, 11.5, C['text-muted'], 'left', 500);
    });
    energyBank([{ k: 'gpe', v: gpeNow, keep: true }, { k: 'ke', v: keNow, keep: true },
    { k: 'therm', v: (E0 - En) * .85, keep: true }, { k: 'snd', v: (E0 - En) * .15, keep: true }],
      { total: E0, note: 'the total never changes — the tokens just stop being useful' });
  },
  data: function () {
    var m = V('m'), h = V('h'), keep = V('bounce') / 100;
    return [{ l: 'dropped with  mgh', v: fmtJ(m * 10 * h), k: 'gpe' },
    { l: 'kept each bounce', v: fmt(keep * 100, 0) + ' %' },
    { l: 'height after 3 bounces', v: fmt(h * Math.pow(keep, 3), 2) + ' m' },
    { l: 'landing speed', v: fmt(Math.sqrt(2 * 10 * h), 2) + ' m/s', k: 'ke' }];
  },
  eq: function () {
    var h = V('h'), keep = V('bounce') / 100;
    return [['each bounce keeps a fraction', 'h_3 = h_0 \\times ' + fmt(keep, 2) + '^3 = ' +
      fmt(h * Math.pow(keep, 3), 2) + '\\ \\text{m}',
      'The heights fall away in a fixed ratio.'],
    ['nothing is destroyed', 'E_{lost} = \\text{thermal} + \\text{sound}',

/* a shared writer for the Info tab: the mark-scheme answer, in order        */
function mark(oneLine, bullets) {
  return '<div class="ptask"><div class="h">describe the energy transformation</div>' +
    '<div class="q">' + oneLine + '</div></div>' +
    '<ol class="steps">' + bullets.map(function (b) { return '<li>' + b + '</li>'; }).join('') +
    '</ol><div class="note">Say <b>every</b> store in order, and finish with where the wasted ' +
    'energy went. That last sentence is usually worth a mark on its own.</div>';
}

function cardScene(key, o) {
  scene('4D', key, {

    data: function () { return o.rows; },
    eq: function () { return o.eq || [['the chain', o.tex, 'Read it left to right, store by store.']]; },
    info: function () { return mark(o.oneLine, o.bullets); }
  });
}

/* ===================== PRACTICAL problems and the QUIZ ====================
   Two kinds of practical: a friendly number to work out, and a "describe the
   energy transformation" answer marked the way an examiner marks it — one
   tick per store named, in order, finishing with where the waste went.    */

function seededRnd(seed) {
  var s = (seed >>> 0) || 1;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function pick(rnd, arr) { return arr[Math.floor(rnd() * arr.length) % arr.length]; }

/* a numeric problem */
function numQ(ask, ans, unit, work, hint) {
  return { type: 'num', ask: ask, ans: ans, unit: unit, work: work, hint: hint };
}
/* a describe-it problem: every key is one mark */
function descQ(ask, keys, bullets, oneLine) {
  return { type: 'desc', ask: ask, keys: keys, bullets: bullets, oneLine: oneLine };
}
function kw(name, words) { return { n: name, w: words }; }

/* ---------- the four banks of practical problems ------------------------ */
var PRAC = {
  /* MODE 1 — energy and its stores ------------------------------------- */
  1: function (rnd) {
    var kind = Math.floor(rnd() * 5), m, h, v, k, x, c, dT;
    if (kind === 0) {
      m = pick(rnd, [2, 3, 5, 10]); h = pick(rnd, [2, 3, 4, 5]);
      return numQ('A <b>' + m + ' kg</b> bag is lifted onto a shelf <b>' + h + ' m</b> up. ' +
        'Taking g = 10 N/kg, how many joules go into the gravitational store?',
        m * 10 * h, 'J',
        [['tokens into the gravitational account', 'E_p = mgh = ' + m + ' \\times 10 \\times ' + h +
          ' = ' + (m * 10 * h) + '\\ \\text{J}',
          'Every joule came out of the chemical store in your muscles — nothing was made.']],
        'E_p = mgh');
    }
    if (kind === 1) {
      m = pick(rnd, [2, 4, 6, 8]); v = pick(rnd, [3, 5, 10]);
      return numQ('A <b>' + m + ' kg</b> trolley rolls at <b>' + v + ' m/s</b>. ' +
        'How much energy is in its kinetic store?', .5 * m * v * v, 'J',
        [['tokens in the kinetic account', 'E_k = \\tfrac12 mv^2 = \\tfrac12 \\times ' + m +
          ' \\times ' + v + '^2 = ' + fmt(.5 * m * v * v, 1) + '\\ \\text{J}',
          'Double the speed and this goes up four times, because v is squared.']],
        'E_k = ½mv²');
    }
    if (kind === 2) {
      k = pick(rnd, [100, 200, 400]); x = pick(rnd, [0.1, 0.2, 0.4]);
      return numQ('A spring of stiffness <b>' + k + ' N/m</b> is pulled back <b>' + x + ' m</b>. ' +
        'How much is in its elastic store?', .5 * k * x * x, 'J',
        [['tokens in the elastic account', 'E_e = \\tfrac12 kx^2 = \\tfrac12 \\times ' + k +
          ' \\times ' + x + '^2 = ' + fmt(.5 * k * x * x, 2) + '\\ \\text{J}',
          'The ½ is there because the force grew from nothing up to kx.']],
        'E_e = ½kx²');
    }
    if (kind === 3) {
      m = pick(rnd, [0.5, 1, 2]); c = 4200; dT = pick(rnd, [10, 20, 50]);
      return numQ('How much energy warms <b>' + m + ' kg</b> of water ' +
        '(c = 4200 J/kg°C) by <b>' + dT + ' °C</b>?', m * c * dT, 'J',
        [['tokens into the thermal account', 'E = mc\\Delta\\theta = ' + m +
          ' \\times 4200 \\times ' + dT + ' = ' + fmt(m * c * dT, 0) + '\\ \\text{J}',
          'Water is expensive to heat — it takes 4200 J to warm just 1 kg by 1 °C.']],
        'E = mcΔθ');
    }
    return descQ('A <b>battery-powered torch</b> is switched on. Name the energy stores it uses, ' +
      'in order, and say where the wasted energy ends up.',
      [kw('chemical (the battery)', ['chemical']),
      kw('electrical (on its way through the wires)', ['electric']),
      kw('light / radiant (the useful output)', ['light', 'radiant']),
      kw('thermal (the wasted energy)', ['thermal', 'heat', 'hot', 'warm'])],
      ['The <b>chemical</b> store in the battery empties.',
        'Energy is carried <b>electrically</b> through the wires to the bulb.',
        'The useful output is <b>light</b> (the radiant store).',
        'The rest is wasted as <b>thermal</b> energy in the bulb and the wires.',
        'The total is unchanged — the tokens only moved.'],
      'Chemical → electrical → light + thermal.');
  },

  /* MODE 2 — work and power -------------------------------------------- */
  2: function (rnd) {
    var kind = Math.floor(rnd() * 5), F, s, m, h, Wj, t, v, mu;
    if (kind === 0) {
      F = pick(rnd, [10, 20, 50, 100]); s = pick(rnd, [2, 3, 5, 8]);
      return numQ('A steady force of <b>' + F + ' N</b> pushes a box <b>' + s +
        ' m</b> in the direction of the push. How much work is done?', F * s, 'J',
        [[N().work, 'W = F' + sSym() + ' = ' + F + ' \\times ' + s + ' = ' + (F * s) +
          '\\ \\text{J}', 'Work done in joules is simply the tokens you handed over.']],
        'W = F' + sSym());
    }
    if (kind === 1) {
      F = pick(rnd, [20, 40, 60]); s = pick(rnd, [4, 5, 10]);
      return numQ('A rope pulls a sledge with <b>' + F + ' N</b> at <b>60°</b> to the ground, ' +
        'moving it <b>' + s + ' m</b> forwards. How much work does the rope do? (cos 60° = 0.5)',
        F * s * 0.5, 'J',
        [['only the part along the motion counts', 'W = F' + sSym() + '\\cos\\theta = ' + F +
          ' \\times ' + s + ' \\times \\cos 60^\\circ = ' + fmt(F * s * .5, 0) + '\\ \\text{J}',
          'The upward part of the pull moves the sledge nowhere, so it does no work.']],
        'W = F' + sSym() + ' cos θ');
    }
    if (kind === 2) {
      m = pick(rnd, [3, 5, 8, 10]); h = pick(rnd, [2, 3, 4]);
      return numQ('A crane lifts a <b>' + m + ' kg</b> load <b>' + h + ' m</b> at a steady ' +
        'speed (g = 10 N/kg). How much work does it do against gravity?', m * 10 * h, 'J',
        [['lifting at a steady speed', 'W = mgh = ' + m + ' \\times 10 \\times ' + h + ' = ' +
          (m * 10 * h) + '\\ \\text{J}',
          'Steady speed means the kinetic store does not change — all of it goes upstairs.']],
        'W = mgh');
    }
    if (kind === 3) {
      Wj = pick(rnd, [600, 1200, 3000, 6000]); t = pick(rnd, [5, 10, 20, 30]);
      return numQ('A motor transfers <b>' + Wj + ' J</b> in <b>' + t + ' s</b>. ' +
        'What is its power?', Wj / t, 'W',
        [['power is tokens per second', 'P = \\dfrac{W}{t} = \\dfrac{' + Wj + '}{' + t + '} = ' +
          fmt(Wj / t, 0) + '\\ \\text{W}', '1 watt is 1 joule every second.']],
        'P = W / t');
    }
    F = pick(rnd, [30, 50, 80, 120]); v = pick(rnd, [2, 3, 4, 5]);
    return numQ('A van pushes through <b>' + F + ' N</b> of drag while cruising at <b>' + v +
      ' m/s</b>. What power is the engine delivering?', F * v, 'W',
      [['the same rate, written another way', 'P = Fv = ' + F + ' \\times ' + v + ' = ' + (F * v) +
        '\\ \\text{W}', 'In one second it travels v metres, so it does Fv joules of work.']],
      'P = Fv');
  },

  /* MODE 3 — conservation and efficiency -------------------------------- */
  3: function (rnd) {
    var kind = Math.floor(rnd() * 5), h, m, Ein, eff, u, w, P;
    if (kind === 0) {
      h = pick(rnd, [5, 20, 45, 80]);
      return numQ('A ball is dropped from <b>' + h + ' m</b> (g = 10 N/kg, no air resistance). ' +
        'How fast is it going when it lands?', Math.sqrt(2 * 10 * h), 'm/s',
        [['every gravitational token becomes a kinetic one', 'mgh = \\tfrac12 mv^2',
          'The mass appears on both sides, so it cancels — a heavy ball and a light one land ' +
          'together.'],
        ['so', 'v = \\sqrt{2gh} = \\sqrt{2 \\times 10 \\times ' + h + '} = ' +
          fmt(Math.sqrt(2 * 10 * h), 1) + '\\ \\text{m/s}', 'The bank total never changed.']],
        'mgh = ½mv²');
    }
    if (kind === 1) {
      Ein = pick(rnd, [200, 500, 1000, 2000]); eff = pick(rnd, [10, 25, 40, 80]);
      return numQ('A machine is <b>' + eff + '%</b> efficient and is given <b>' + Ein +
        ' J</b>. How much useful energy comes out?', Ein * eff / 100, 'J',
        [['efficiency is the useful fraction', 'E_{useful} = \\dfrac{' + eff + '}{100} \\times ' +
          Ein + ' = ' + fmt(Ein * eff / 100, 0) + '\\ \\text{J}',
          'The other ' + fmt(Ein * (1 - eff / 100), 0) + ' J is not destroyed — it is warming the ' +
          'surroundings.']],
        'useful = η × input');
    }
    if (kind === 2) {
      Ein = pick(rnd, [400, 800, 1500, 2500]); eff = pick(rnd, [20, 30, 60]);
      return numQ('A device takes in <b>' + Ein + ' J</b> and gives out <b>' +
        fmt(Ein * eff / 100, 0) + ' J</b> usefully. How much is wasted?',
        Ein * (1 - eff / 100), 'J',
        [['in = useful + wasted', 'E_{wasted} = ' + Ein + ' - ' + fmt(Ein * eff / 100, 0) + ' = ' +
          fmt(Ein * (1 - eff / 100), 0) + '\\ \\text{J}',
          'Nothing goes missing — the Sankey arrows must add back up to the one going in.']],
        'in = useful + wasted');
    }
    if (kind === 3) {
      u = pick(rnd, [30, 60, 120, 250]); w = pick(rnd, [70, 140, 380, 750]);
      return numQ('A lamp turns <b>' + u + ' J</b> into light and wastes <b>' + w +
        ' J</b> as heat. What is its efficiency, as a percentage?',
        u / (u + w) * 100, '%',
        [['useful ÷ total', '\\eta = \\dfrac{' + u + '}{' + u + ' + ' + w + '} \\times 100\\% = ' +
          fmt(u / (u + w) * 100, 1) + '\\%',
          'The total in is always useful plus wasted, so you never need a separate figure for it.']],
        'η = useful ÷ total × 100%');
    }
    m = pick(rnd, [1000, 1200, 1500]); P = pick(rnd, [10, 20, 30]);
    return numQ('A <b>' + m + ' kg</b> car travelling at <b>' + P + ' m/s</b> brakes to a stop. ' +
      'How much energy is dumped into the thermal store of the brakes?',
      .5 * m * P * P, 'J',
      [['all the kinetic tokens have to go somewhere', 'E_k = \\tfrac12 mv^2 = \\tfrac12 \\times ' +
        m + ' \\times ' + P + '^2 = ' + fmt(.5 * m * P * P, 0) + '\\ \\text{J}',
        'The brakes get hot by exactly that much — the energy was not destroyed by stopping.']],
      'E_k = ½mv²');
  },

  /* MODE 4 — transformations, mostly in words --------------------------- */
  4: function (rnd) {
    var kind = Math.floor(rnd() * 5), P, t, eff, m, h, b;
    if (kind === 0) {
      return descQ('A <b>coal-fired power station</b> sends electricity to your house. ' +
        'Describe the energy transformations, in order, and say where the waste goes.',
        [kw('chemical (the coal)', ['chemical', 'coal', 'fuel']),
        kw('thermal (burning heats the water)', ['thermal', 'heat']),
        kw('kinetic (the steam turns the turbine)', ['kinetic', 'movement', 'moving', 'turbine']),
        kw('electrical (the generator)', ['electric', 'generator']),
        kw('wasted thermal (the cooling towers)', ['wast', 'cooling', 'surroundings', 'lost'])],
        ['The <b>chemical</b> store in the coal is emptied by burning it.',
          'That raises the <b>thermal</b> store of the water, making steam.',
          'The steam gives the turbine a <b>kinetic</b> store.',
          'The generator transfers it <b>electrically</b> to the grid.',
          'About two thirds is wasted as <b>thermal</b> energy up the cooling towers.'],
        'Chemical → thermal → kinetic → electrical, with most wasted as heat.');
    }
    if (kind === 1) {
      return descQ('A <b>bouncing ball</b> is dropped and bounces lower each time. ' +
        'Explain the energy changes, and say why the bounces get smaller.',
        [kw('gravitational at the top', ['gravitat', 'potential', 'height']),
        kw('kinetic as it falls', ['kinetic', 'moving', 'speed']),
        kw('elastic while squashed', ['elastic', 'squash', 'compress', 'deform']),
        kw('thermal and sound lost each bounce', ['thermal', 'heat', 'sound'])],
        ['At the top it has a <b>gravitational</b> store.',
          'Falling, that becomes a <b>kinetic</b> store.',
          'On the floor it squashes: kinetic → <b>elastic</b> store.',
          'The elastic store pushes it back up, becoming kinetic then gravitational again.',
          'Each bounce loses a little to <b>thermal</b> energy and <b>sound</b>, so it never ' +
          'returns to the same height. Nothing is destroyed — it is just spread out.'],
        'Gravitational ⇄ kinetic ⇄ elastic, leaking a little to thermal and sound each bounce.');
    }
    if (kind === 2) {
      P = pick(rnd, [40, 60, 100]); t = pick(rnd, [10, 60, 100]);
      return numQ('A <b>' + P + ' W</b> filament lamp is only <b>5%</b> efficient. ' +
        'In <b>' + t + ' s</b>, how much energy does it waste as heat?',
        P * t * 0.95, 'J',
        [['energy in first', 'E = Pt = ' + P + ' \\times ' + t + ' = ' + fmt(P * t, 0) +
          '\\ \\text{J}', 'Power × time is always the energy transferred.'],
        ['then the wasted share', 'E_{wasted} = 0.95 \\times ' + fmt(P * t, 0) + ' = ' +
          fmt(P * t * .95, 0) + '\\ \\text{J}',
          'An LED of the same brightness would waste a small fraction of that.']],
        'E = Pt, then × (1 − η)');
    }
    if (kind === 3) {
      m = pick(rnd, [0.1, 0.2, 0.5]); h = pick(rnd, [1, 2, 4]); b = pick(rnd, [40, 60, 80]);
      return numQ('A <b>' + m + ' kg</b> ball dropped from <b>' + h + ' m</b> returns <b>' + b +
        '%</b> of its energy on the bounce (g = 10 N/kg). How high does it bounce, in metres?',
        h * b / 100, 'm',
        [['the energy it starts with', 'E_p = mgh = ' + m + ' \\times 10 \\times ' + h + ' = ' +
          fmt(m * 10 * h, 1) + '\\ \\text{J}', ''],
        ['the height that energy buys back', 'h_2 = \\dfrac{' + (b / 100) + ' \\times mgh}{mg} = ' +
          (b / 100) + ' \\times ' + h + ' = ' + fmt(h * b / 100, 2) + '\\ \\text{m}',
          'The mass cancels again, so the bounce fraction is all that matters.']],
        'h₂ = (bounce %) × h₁');
    }
    eff = pick(rnd, [15, 20, 25]);
    return numQ('A person eats a <b>2 000 000 J</b> meal and cycles at <b>' + eff +
      '%</b> efficiency. How much useful work can they do, in joules?',
      2e6 * eff / 100, 'J',
      [['useful share of the food', 'W = \\dfrac{' + eff + '}{100} \\times 2\\times10^{6} = ' +
        fmt(2e6 * eff / 100, 0) + '\\ \\text{J}',
        'The rest keeps you warm — which is exactly why you get hot when you exercise.']],
      'useful = η × input');
  }
};

/* ---------- making and marking a practical ------------------------------ */
function newTask(seed) {
  var t = PRAC[S.md](seededRnd(seed == null ? (Date.now() & 0xffff) : seed));
  S.task = { md: S.md, type: t.type, ask: t.ask, hint: t.hint || '',
    ans: t.ans, unit: t.unit, work: t.work,
    keys: t.keys, bullets: t.bullets, oneLine: t.oneLine,
    inp: '', done: false, ok: null, err: null, hit: null };
}
/* a number is right within 2%; a description is marked one tick per store */
function checkTask() {
  var t = S.task; if (!t) return;
  if (t.type === 'desc') {
    var said = (t.inp || '').toLowerCase();
    t.hit = t.keys.map(function (k) {
      return { n: k.n, ok: k.w.some(function (w) { return said.indexOf(w) >= 0; }) };
    });
    var got = t.hit.filter(function (h) { return h.ok; }).length;
    t.score = got; t.outOf = t.keys.length;
    t.ok = got >= t.keys.length - 1 && said.length > 20;
    t.done = true;
    return;
  }
  var a = parseFloat(t.inp);
  var err = isFinite(a) ? Math.abs(a - t.ans) / Math.max(Math.abs(t.ans), 1e-9) * 100 : Infinity;
  t.err = err; t.ok = err <= 2; t.done = true;
}

function newQuiz() {
  S.quiz = { md: S.md, i: 0, pick: -1, checked: false, score: 0, log: [], done: false };
}
function quizAnswer(k) { var q = S.quiz; if (q && !q.checked) q.pick = k; }
function quizCheck() {
  var q = S.quiz; if (!q || q.checked || q.pick < 0) return;
  var item = QUIZ[q.md][q.i], right = q.pick === item.ans;
  q.checked = true;
  if (right) q.score++;
  q.log.push({ n: q.i + 1, ok: right, pick: q.pick, ans: item.ans });
}
function quizNext() {
  var q = S.quiz; if (!q || !q.checked) return;
  if (q.i >= QUIZ[q.md].length - 1) { q.done = true; return; }
  q.i++; q.pick = -1; q.checked = false;
}
function stars(score, total) {
  var f = score / total;
  return f >= 0.9 ? 3 : (f >= 0.6 ? 2 : (f >= 0.3 ? 1 : 0));
}

/* ---------- pills -------------------------------------------------------- */
function pillHTML(g, activeKey) {
  return Object.keys(SCEN[g] || {}).map(function (k) {
    return '<button class="pill' + (activeKey === k ? ' active' : '') + '" data-g="' + g +
      '" data-ex="' + k + '">' + SCEN[g][k].label + '</button>';
  }).join('');
}
function bindPills(box) {
  [].forEach.call(box.children, function (b) {
    b.addEventListener('click', function () {
      var g = b.dataset.g;
      if (S.md === 4) S.g4 = g;
      S.ex[g] = b.dataset.ex;
      S.t = 0; EFF_WARN = '';
      buildPills(); resetVals(); refresh();
    });
  });
}
/* Mode 4 is the only one that needs two rows: six simulations on the first,
   nine explanation cards on the second. Everything else keeps one row.    */
function buildPills() {
  var A = $('gSub'), B = $('gEx');
  if (S.md === 4) {
    $('pillrow').classList.add('two');
    $('lblA').hidden = false; $('lblB').hidden = false;
    A.style.display = ''; B.style.display = '';
    A.innerHTML = pillHTML('4S', S.g4 === '4S' ? curKey() : null);
    B.innerHTML = pillHTML('4D', S.g4 === '4D' ? curKey() : null);
  } else {
    $('pillrow').classList.remove('two');
    $('lblA').hidden = true; $('lblB').hidden = true;
    A.style.display = '';
    A.innerHTML = pillHTML(String(S.md), curKey());
    B.innerHTML = ''; B.style.display = 'none';
  }
  bindPills(A); bindPills(B);
}

function selHTML(id, label, map, val) {

function renderCtrls() {
  var sc = cur(), box = $('gCtrl'), html = '';
  (sc.ctrl || []).forEach(function (key) {
    if (key === 'proc') { html += selHTML('cProc', 'what happens', PROC, S.proc); return; }
    if (key === 'device') { html += selHTML('cDevice', 'device', DEVICES, S.device); return; }
    if (key === 'curve') {
      var m = {}; Object.keys(CURVES).forEach(function (k) { m[k] = CURVES[k].lab; });
      html += selHTML('cCurve', 'shape', m, S.curve); return;
    }
    if (key === 'bulb') { html += selHTML('cBulb', 'bulb', BULBS, S.bulb); return; }
    if (key === 'nuke') { html += selHTML('cNuke', 'reaction', NUKES, S.nuke); return; }
    if (key === 'fric') {
      html += '<div class="sl"><button class="ctrl-btn' + (S.fric ? ' on' : '') +
        '" id="cFric" title="turn the resistive force on — air resistance for the ball and the ' +
        'pendulum, brake friction for the car — and watch tokens leak into the thermal account">' +
        '🔥 Dissipation ' + (S.fric ? 'ON' : 'OFF') + '</button></div>';
      return;
    }
    var c = CTL[key]; if (!c) return;
    html += '<div class="sl"><label>' + c.lab + '</label>' +
      '<input type="range" id="s_' + key + '" min="' + c.min + '" max="' + c.max +
      '" step="' + c.step + '" value="' + V(key) + '">' +
      '<span class="val" id="v_' + key + '">' + ctlText(key) + '</span></div>';
  });
  if (!html) html = '<span class="hintchip">no settings here — this card is the answer, ' +
    'written out in full</span>';
  box.innerHTML = html;
  bindCtrls(sc);
}
function ctlText(key) {
  var c = CTL[key];
  return fmt(V(key), c.step < 1 ? 2 : 0) + (c.u ? ' ' + c.u : '');
}
function bindCtrls(sc) {
  (sc.ctrl || []).forEach(function (key) {
    var el = $('s_' + key); if (!el) return;
    el.addEventListener('input', function () {
      var val = parseFloat(this.value);
      if (key === 'eff' && val > 100) {
        /* the friendly refusal — nothing can be more than 100% efficient */
        EFF_WARN = 'more than 100% efficient would mean getting more tokens out than you put in — ' +
          'no free money! Held at 100%.';
        val = 100; this.value = 100;
      } else if (key === 'eff') EFF_WARN = '';
      S.v[key] = val;
      $('v_' + key).textContent = ctlText(key);
      renderPanel(); draw();
    });
  });
  var e;
  if ((e = $('cProc'))) e.addEventListener('change', function () {
    S.proc = this.value; S.t = 0; renderPanel(); draw();
  });
  if ((e = $('cDevice'))) e.addEventListener('change', function () {
    S.device = this.value;
    var typ = { lamp: 5, led: 90, motor: 85, plant: 35, person: 20 }[S.device];
    if (typ) S.v.eff = typ;
    EFF_WARN = ''; renderCtrls(); renderPanel(); draw();
  });
  if ((e = $('cCurve'))) e.addEventListener('change', function () {
    S.curve = this.value; renderPanel(); draw();
  });
  if ((e = $('cBulb'))) e.addEventListener('change', function () {
    S.bulb = this.value; renderPanel(); draw();
  });
  if ((e = $('cNuke'))) e.addEventListener('change', function () {
    S.nuke = this.value; S.t = 0; renderPanel(); draw();
  });
  if ((e = $('cFric'))) e.addEventListener('click', function () {
    S.fric = !S.fric; S.t = 0; renderCtrls(); renderPanel(); draw();
  });
}

var LASTSIG = '';

    if (S.mode === 'quiz') html = quizPanel();
    else {
      if (S.mode === 'prac') html += taskPanel();

      var e = eqs();

      html += secHead('key', 'The ten stores', STORE_ORDER.length) + secBody('key', colourKey());
    }

/* while the animation runs, only rebuild the panel when a number changes */
function patchLive() {
  if (S.ptab !== 'data' || S.mode === 'quiz') return;
  var sig = JSON.stringify(rows());
  if (sig === LASTSIG) return;
  LASTSIG = sig;
  renderPanel();
}
function bindPanel() {
  [].forEach.call($('pbody').querySelectorAll('.sec-h'), function (b) {

  if ((el = $('bQNext'))) el.addEventListener('click', function () { quizNext(); renderPanel(); draw(); });
  if ((el = $('bQAgain'))) el.addEventListener('click', function () { newQuiz(); renderPanel(); draw(); });
  if ((el = $('bNewTask'))) el.addEventListener('click', function () {

/* ---------- the quiz board (the canvas has no diagram to show) ---------- */
function drawQuizBoard() {
  var q = S.quiz || { i: 0, score: 0 };
  sceneHeader('Quiz — ' + MODE_LABEL[S.md],
    'Five questions. The diagram is put away on purpose — this is you, not the picture.');
  mtxt('score  ' + q.score + ' / 5', W / 2, 240, 22, C.text, 'center', 700);
  for (var i = 0; i < 5; i++) {
    var x = W / 2 - 190 + i * 95, done = q.log && q.log[i];
    var col = done ? (done.ok ? C.green : C.red) : (i === q.i ? C.accent : C['text-muted']);
    CX.save();
