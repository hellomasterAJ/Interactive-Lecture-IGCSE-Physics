    CX.beginPath(); CX.arc(x, 340, 30, 0, 7); CX.stroke(); CX.restore();
    mtxt(String(i + 1), x, 347, 18, col, 'center', 700);
    txt('Q' + (i + 1), x, 392, 10, C['text-muted'], 'center', 600);
  }
  txt('Read the question in the 📊 Data panel and pick an answer.', W / 2, 460, 13,
    C['text-dim'], 'center', 500);
}

/* ---------- one frame ---------------------------------------------------- */
function draw() {
  applyVT();
  CARD_HITS = [];
  if (S.mode === 'quiz') { drawQuizBoard(); updateChips(); return; }
  var sc = cur();
  sceneHeader(sc.title, sc.sub);
  sc.draw();
  updateChips();
}
function refresh() {
  renderCtrls(); updateChrome(); renderPanel(); draw();
}

/* ---------- the animation loop ------------------------------------------ */
var LAST = 0;
function loop(ts) {
  var dt = Math.min((ts - LAST) / 1000, 0.05);
  LAST = ts;
  if (S.play && S.mode !== 'quiz' && !isCard()) {
    /* deliberately slow: a beginner has to be able to watch a token move */
    S.t += dt * S.speed * 0.5;
    draw();
    patchLive();
  }
  requestAnimationFrame(loop);
}

/* ---------- wiring ------------------------------------------------------- */
function bindToolbar() {
  [].forEach.call($('gTabs').children, function (b) {
    b.addEventListener('click', function () {
      S.md = +b.dataset.md; S.t = 0; S.play = false; EFF_WARN = '';
      if (S.md === 4) S.g4 = '4S';
      if (S.mode === 'prac') newTask(1000 + S.md);
      if (S.mode === 'quiz') newQuiz();
      buildPills(); resetVals(); refresh();
    });
  });
  [].forEach.call($('gMode').children, function (b) {
    b.addEventListener('click', function () {
      S.mode = b.dataset.m;
      if (S.mode === 'prac') { newTask(1000 + S.md); S.ptab = 'data'; }
      if (S.mode === 'quiz') { newQuiz(); S.ptab = 'data'; S.play = false; }
      refresh();
    });
  });
  /* switching notation must never throw the student's settings away */
  [].forEach.call($('gNote').children, function (b) {
    b.addEventListener('click', function () { S.note = b.dataset.n; refresh(); });
  });
  [].forEach.call($('gSpeed').children, function (b) {
    b.addEventListener('click', function () { S.speed = +b.dataset.s; updateChrome(); });
  });
  [].forEach.call($('gPTabs').children, function (b) {
    b.addEventListener('click', function () { S.ptab = b.dataset.p; updateChrome(); renderPanel(); });
  });
  $('bPlay').addEventListener('click', function () { S.play = !S.play; updateChrome(); });
  $('bReset').addEventListener('click', function () {
    /* a beginner pressing Reset means "put everything back", not just this slider */
    S.play = false; S.t = 0; EFF_WARN = '';
    S.v = {}; S.proc = 'drop'; S.fric = false; S.device = 'lamp';
    S.curve = 'constant'; S.bulb = 'filament'; S.nuke = 'fission'; S.cardPos = {};
    resetVals(); refresh();
  });
  $('tBank').addEventListener('click', function () { S.bank = !S.bank; updateChrome(); draw(); });
  $('tCoins').addEventListener('click', function () { S.coins = !S.coins; updateChrome(); draw(); });
  $('tNums').addEventListener('click', function () { S.nums = !S.nums; updateChrome(); draw(); });
  $('tChain').addEventListener('click', function () { S.chain = !S.chain; updateChrome(); draw(); });
  $('theme').addEventListener('change', function () {
    document.documentElement.setAttribute('data-theme', this.value);
    readTheme(); renderPanel(); draw();
  });
  /* ---- dragging the explanation cards around the canvas ---------------- */
  var cvXY = function (ev) {
    var r = CV.getBoundingClientRect();
    return { x: (ev.clientX - r.left - VT.ox) / VT.s, y: (ev.clientY - r.top - VT.oy) / VT.s };
  };
  CV.addEventListener('pointerdown', function (ev) {
    var p = cvXY(ev), hit = cardAt(p.x, p.y);
    if (!hit) return;
    var off = S.cardPos[hit.id] || { x: 0, y: 0 };
    S.drag = { id: hit.id, gx: p.x - off.x, gy: p.y - off.y,
      w: hit.w, h: hit.h, bx: hit.x - off.x, by: hit.y - off.y };
    try { CV.setPointerCapture(ev.pointerId); } catch (e) { /* no live pointer */ }
    CV.style.cursor = 'grabbing';
    ev.preventDefault();
    draw();
  });
  CV.addEventListener('pointermove', function (ev) {
    var p = cvXY(ev);
    if (!S.drag) {
      CV.style.cursor = cardAt(p.x, p.y) ? 'grab' : 'crosshair';
      return;
    }
    var d = S.drag;
    /* the card may go anywhere on the canvas, but never off it */
    var nx = clamp(p.x - d.gx, 6 - d.bx, W - 6 - d.w - d.bx);
    var ny = clamp(p.y - d.gy, 72 - d.by, H - 6 - d.h - d.by);
    S.cardPos[d.id] = { x: nx, y: ny };
    draw();
  });
  var endDrag = function () {
    if (!S.drag) return;
    S.drag = null; CV.style.cursor = 'grab'; draw();
  };
  CV.addEventListener('pointerup', endDrag);
  CV.addEventListener('pointercancel', endDrag);
  /* double-click puts a card back where it started */
  CV.addEventListener('dblclick', function (ev) {
    var p = cvXY(ev), hit = cardAt(p.x, p.y);
    if (!hit) return;
    delete S.cardPos[hit.id];
    draw();
  });

  window.addEventListener('resize', function () { resize(); draw(); });
  window.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === ' ') { e.preventDefault(); if (!$('bPlay').disabled) $('bPlay').click(); }
  });
}

function init() {
  CV = $('cv'); CX = CV.getContext('2d');
  readTheme();
  resize();
  buildPills();
  Object.keys(SCEN).forEach(function (g) {
    Object.keys(SCEN[g]).forEach(function (k) { if (SCEN[g][k].init) SCEN[g][k].init(); });
  });
  resetVals();
  bindToolbar();
  refresh();
  requestAnimationFrame(function (t) { LAST = t; loop(t); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
