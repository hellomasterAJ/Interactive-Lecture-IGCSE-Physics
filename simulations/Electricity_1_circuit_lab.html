const sectionTitle = (ic,t) => '<div class="ptitle"><span>'+ic+'</span>'+t+'</div>';
const card  = (l,v,s,id) => '<div class="card"><div class="cl">'+l+'</div><div class="cv"'+
  (id?' id="'+id+'"':'')+'>'+v+'</div><div class="cu">'+s+'</div></div>';
const meter = (l,v,s) => '<div class="meter"><div class="ml">'+l+'</div><div class="mv">'+v+'</div><div class="ms">'+s+'</div></div>';
/* A slider paired with a box you can type into.  The two always agree:
   typing a value inside the slider's range moves the handle, and a value
   beyond it widens the slider's range so the handle stays usable. */
const RANGE = {
  V: {min:0,   max:240,     step:0.1, base:24,  unit:'V'},   // e.m.f.
  R: {min:0.1, max:1000000, step:0.1, base:200, unit:'Ω'}    // resistance
};
function niceCeil(v){
  if(!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1,2,5,10]) if(v <= m*e) return m*e;
  return 10*e;
}
const sliderMax = (v, R) => Math.max(R.base, niceCeil(v));
const trimNum = v => String(+(+v).toFixed(4));

function numSlider(id, label, val, R){
  return '<div class="sl"><label><span>'+label+'</span>' +
    '<span class="numwrap">' +
      '<input class="numin" type="number" id="'+id+'Num" value="'+trimNum(val)+'" ' +
        'step="'+R.step+'" min="'+R.min+'" max="'+R.max+'" ' +
        'title="Type any value from '+R.min+' to '+R.max+' '+R.unit+'">' +
      '<span class="numu">'+R.unit+'</span></span></label>' +
    '<input type="range" id="'+id+'" min="'+R.min+'" max="'+sliderMax(val,R)+
      '" step="'+R.step+'" value="'+val+'"></div>';
}

/* Re-solve and refresh WITHOUT rebuilding the panel — otherwise the very
   input the user is dragging or typing into gets replaced mid-gesture. */
function liveUpdate(){
  if(S.mode === 'rlab'){                 // R-Lab has its own model, no netlist
    updateSummary(); drawGraph(); draw();
    return;
  }
  S.res = solveCircuit(S.comps, S.wires);
  buildFlowColors(S.res);
  patchLiveValues(); updateSummary(); draw();
}
function bindNumSlider(id, R, apply){
  const rng = $(id), num = $(id+'Num');
  if(!rng || !num) return;
  const commit = (v, fromBox) => {
    if(!isFinite(v)) return;
    v = Math.min(R.max, Math.max(R.min, v));
    v = +(Math.round(v/R.step)*R.step).toFixed(4);
    apply(v);
    const sm = sliderMax(v, R);
    if(+rng.max !== sm) rng.max = String(sm);
    rng.value = String(v);
    if(!fromBox) num.value = trimNum(v);
    liveUpdate();
  };
  rng.oninput  = e => commit(+e.target.value, false);
  num.oninput  = e => {                       // live only while it is a legal value
    const v = parseFloat(e.target.value);
    if(isFinite(v) && v >= R.min && v <= R.max) commit(v, true);
  };
  num.onchange = e => {                       // on blur / Enter: clamp and tidy up
    const v = parseFloat(e.target.value);
    commit(isFinite(v) ? v : +rng.value, true);
    num.value = trimNum(rng.value);
  };
  num.onkeydown = e => { if(e.key === 'Enter') num.blur(); };
}

/* patch just the live numbers in the open panel */
function patchLiveValues(){
  const set = (id, t) => { const e = $(id); if(e) e.textContent = t; };
  const r = S.res;
  const i = S.sel;
  if(i >= 0 && S.comps[i] && r && r.ok){
    const rr = idealise(S.comps[i], r.comp[i]);
    set('cvV', fmt(Math.abs(rr.V),'V'));  set('cvI', fmt(Math.abs(rr.I),'A'));
    set('cvR', fmtR(Math.abs(rr.R)));     set('cvP', fmt(Math.abs(rr.P),'W'));
    set('cvF', fmt(Math.abs(rr.V),'V') + ' = ' + fmt(Math.abs(rr.I),'A') +
               ' × ' + fmtR(Math.abs(rr.R)));
  }
  if(r && r.ok){
    const srcs = S.comps.map((c,k)=>({c,k})).filter(o=>CATALOG[o.c.t].kind==='src');
    if(srcs.length){
      const emf = srcs.reduce((a,o)=>a+Math.abs(o.c.V),0);
      const It  = Math.abs(r.comp[srcs[0].k].I);
      const Rt  = It > 1e-9 ? emf/It : Infinity;
      set('wcE', fmt(emf,'V')); set('wcI', fmt(It,'A'));
      set('wcR', fmtR(Rt));     set('wcP', fmt(emf*It,'W'));
      const wk = $('wcWork');
      if(wk){ const html = workingHTML();
        wk.outerHTML = html || '<div class="working" id="wcWork"></div>'; }
    }
  }
}

/* ---------- summary line ---------- */
function updateSummary(){
  const el = $('summary');
  if(S.mode === 'rlab'){
    const dev = RLAB[S.rlab.dev];
    const o = dev.solve(S.rlab.V, S.rlab.p);
    el.innerHTML = '📝 <b>'+dev.label+'</b> at '+fmt(S.rlab.V,'V')+
      ' → I = '+fmt(o.I,'A')+', V = '+fmt(o.Vd,'V')+', R = '+fmtR(Math.abs(o.R))+
      ' · '+(dev.ohmic ? 'straight-line (ohmic) I–V graph' : 'curved (non-ohmic) I–V graph')+
      ' · '+S.rlab.rows.length+' point(s) recorded';
    return;
  }
  if(S.mode === 'test' && S.sel < 0){ el.innerHTML = '📝 <b>'+PRESETS[S.preset].name+'</b> — '+S.note; return; }
  if(S.tool === 'group' && S.mode === 'build' && hasGroup()){
    el.innerHTML = '📝 <b>'+S.selSet.length+'</b> component(s) and <b>'+S.selWireSet.length+
      '</b> wire(s) selected — drag inside the dashed box to move them, Del to delete, R to rotate each.';
    return;
  }
  const r = S.res;
  if(!S.comps.length){ el.innerHTML = '📝 Empty canvas — pick a component from the palette and click on the grid to place it.'; return; }
  if(!r || !r.ok){ el.innerHTML = '📝 Circuit not solvable yet.'; return; }
  if(r.shorted){ el.innerHTML = '📝 ⚠ <b>Short circuit</b> — the source is connected through a path with almost no resistance ('+fmt(r.maxI,'A')+'). Add a resistor or a lamp.'; return; }
  const srcs = S.comps.filter(c=>CATALOG[c.t].kind==='src');
  const loads = S.comps.map((c,i)=>({c,i})).filter(o=>CATALOG[o.c.t].kind==='res');
  const emf = srcs.reduce((a,c)=>a+Math.abs(c.V),0);
  let t = '📝 ';
  if(!srcs.length) t += 'No source yet — nothing will flow. ';
  else t += 'Source '+fmt(emf,'V')+' driving '+loads.length+' component(s). ';
  if(loads.length){
    const It = srcs.length ? Math.abs(r.comp[S.comps.indexOf(srcs[0])].I) : 0;
    t += 'Current from the source = <b>'+fmt(It,'A')+'</b>. ';
    t += loads.slice(0,4).map(o=>o.c.name+': '+fmt(Math.abs(r.comp[o.i].V),'V')+
         ' / '+fmt(Math.abs(r.comp[o.i].I),'A')).join(' · ');
  }
  el.innerHTML = t;
}

function recordPoint(){
  const dev = RLAB[S.rlab.dev];
  const o = dev.solve(S.rlab.V, S.rlab.p);
  S.rlab.rows.push({V:o.Vd, I:o.I, R:o.R, p:S.rlab.p});
  updatePanel(); updateSummary();
}
/* Auto-Points fills the table along whichever axis the chosen graph uses:
   the supply for I–V and R–V, the device's own quantity for R–θ and R–E. */
function autoSweep(){
  const dev = RLAB[S.rlab.dev];
  const byV = GKIND[rlabGraph()].sweep === 'V';
  S.rlab.rows = [];
  const n = 11;
  for(let i=0;i<n;i++){
    const f = i/(n-1);
    if(byV){
      const V = dev.vmin + (dev.vmax-dev.vmin)*f;
      const o = dev.solve(V, S.rlab.p);
      S.rlab.rows.push({V:o.Vd, I:o.I, R:o.R, p:S.rlab.p});
    }else{
      const p = dev.pmin + (dev.pmax-dev.pmin)*f;
      const o = dev.solve(S.rlab.V, p);
      S.rlab.rows.push({V:o.Vd, I:o.I, R:o.R, p});
    }
  }
  updatePanel(); updateSummary();
}

/* Same treatment a saved slot gets: keep the circuit's distance from the top
   of the grid, then clamp it inside whatever grid this window has. */
function fromData(k){
  const d = PRESET_DATA[k];
  return {comps:clone(d.comps), wires:clone(d.wires), rowTop:d.rowTop, baked:true};
}
function loadPreset(k){
  const P = PRESETS[k], p = P.build();
  S.comps = p.comps; S.wires = p.wires;
  if(p.baked){ const dy = S.rowTop - (p.rowTop != null ? p.rowTop : 0); if(dy) shiftRows(dy); }
  else anchorToTop();
  keepInsideGrid();
  S.sel = -1; S.selWire = -1; clearGroup(); S.undo = [];
  S.note = PRESETS[k].note;
  $('chipMode').textContent = 'Circuit Tester — ' + PRESETS[k].name;
  recompute();
}

/* ============================================================
   SAVE / LOAD — 20 named slots, kept in the browser's local storage
   for this file.  If storage is blocked (some file:// setups), the
   slots still work for the session and the user is told so.
   ============================================================ */
const SLOT_KEY = 'hausCircuitLab.slots.v1';
const NSLOTS   = 20;
let   MEMSLOTS = null;              // session fallback, only used if storage fails

function slotsRead(){
  if(MEMSLOTS) return MEMSLOTS;
  try{
    const a = JSON.parse(localStorage.getItem(SLOT_KEY));
    if(Array.isArray(a)){ const b = new Array(NSLOTS).fill(null);
      a.slice(0,NSLOTS).forEach((v,i)=>b[i]=v); return b; }
  }catch(_){}
  return new Array(NSLOTS).fill(null);
}
function slotsWrite(a){
  try{ localStorage.setItem(SLOT_KEY, JSON.stringify(a)); MEMSLOTS = null; return true; }
  catch(_){ MEMSLOTS = a; return false; }
}
const clone = o => JSON.parse(JSON.stringify(o));
const slotStamp = ts => { const d = new Date(ts);
  return d.toLocaleDateString(undefined,{day:'2-digit',month:'short'}) + ' ' +
         d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); };

function saveSlot(i, name){
  const a = slotsRead();
  a[i] = {name, ts:Date.now(), rowTop:S.rowTop,
          comps:clone(S.comps), wires:clone(S.wires)};
  const ok = slotsWrite(a);
  refreshSlotList(i);
  flash('Saved to slot ' + (i+1) + ' — “' + name + '” (' + S.comps.length + ' parts, ' +
        S.wires.length + ' wires)' +
        (ok ? '' : ' · ⚠ this browser blocks local storage, so it will be lost when you close the file — use ⭳ Export'));
  return ok;
}
function loadSlot(i){
  const rec = slotsRead()[i];
  if(!rec){ flash('Slot ' + (i+1) + ' is empty.'); return false; }
  snapshot();
  S.comps = clone(rec.comps); S.wires = clone(rec.wires);
  /* saved on a different window shape?  keep the same distance from the
     top of the grid, then clamp so nothing lands outside it */
  const dy = S.rowTop - (rec.rowTop != null ? rec.rowTop : 0);
  if(dy) shiftRows(dy);
  keepInsideGrid();
  S.sel = -1; S.selWire = -1; clearGroup(); setZoom(1);
  recompute();
  flash('Loaded slot ' + (i+1) + ' — “' + rec.name + '” · ' + S.comps.length +
        ' parts, ' + S.wires.length + ' wires · Ctrl+Z undoes this');
  return true;
}
function deleteSlot(i){
  const a = slotsRead();
  if(!a[i]){ flash('Slot ' + (i+1) + ' is already empty.'); return; }
  const nm = a[i].name; a[i] = null; slotsWrite(a);
  refreshSlotList(i);
  flash('Cleared slot ' + (i+1) + ' — “' + nm + '”');
}
function loadHome(){
  snapshot(); S.saveBuild = null;
  defaultCircuit(); setZoom(1); recompute();
  flash('Back to the starting circuit.');
}
function exportSlots(){
  const blob = new Blob([JSON.stringify({app:'HAUS Circuit Lab', v:1,
                          saved:new Date().toISOString(), slots:slotsRead()}, null, 1)],
                        {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'circuit-lab-slots.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  flash('Exported all 20 slots to circuit-lab-slots.json');
}
function importSlots(text){
  let d; try{ d = JSON.parse(text); }catch(_){ flash('⚠ That file is not a Circuit Lab slot file.'); return; }
  const src = Array.isArray(d) ? d : d.slots;
  if(!Array.isArray(src)){ flash('⚠ That file is not a Circuit Lab slot file.'); return; }
  const a = slotsRead(); let n = 0;
  src.slice(0,NSLOTS).forEach((v,i)=>{ if(v && v.comps && v.wires){ a[i] = v; n++; } });
  slotsWrite(a); refreshSlotList();
  flash('Imported ' + n + ' slot(s).');
}
function refreshSlotList(keep){
  const sel = $('slotSel'); if(!sel) return;
  const a = slotsRead(), cur = keep != null ? keep : (+sel.value || 0);
  sel.innerHTML = a.map((v,i) =>
    '<option value="'+i+'">' + String(i+1).padStart(2,'0') + ' · ' +
    (v ? (v.name + '  (' + slotStamp(v.ts) + ')') : '— empty —') + '</option>').join('');
  sel.value = String(Math.max(0, Math.min(NSLOTS-1, cur)));
}
function flash(msg){ $('summary').innerHTML = '💾 ' + msg; }

/* ============================================================
   DEFAULT CIRCUIT for Builder
   ============================================================ */
function defaultCircuit(){
  /* Top rail: switch · battery · ammeter.  Bottom rail: the lamp, centred
     under the battery, with the voltmeter connected across it below. */
  S.comps = [
    C('battery',13,2,'h',{name:'B1',V:6}),
    C('switch',6,2,'h',{name:'SW1',closed:true}),
    C('ammeter',20,2,'h',{name:'A1'}),
    C('lamp',13,9,'h',{name:'L1',R:12}),
    C('voltmeter',13,12,'h',{name:'V1'})
  ];
  S.wires = [
    w(2,2,6,2), w(8,2,13,2), w(15,2,20,2), w(22,2,26,2),   // top rail
    w(2,2,2,9), w(26,2,26,9),                              // side rails
    w(2,9,13,9), w(15,9,26,9),                             // bottom rail
    w(13,9,13,12), w(15,9,15,12)                           // voltmeter across L1
  ];
  anchorToTop();
  S.sel = -1; S.selWire = -1; clearGroup(); S.undo = [];
}

/* ============================================================
   GROUP SELECTION  (Group tool only — every entry point is guarded
   by S.tool === 'group', so no other tool's behaviour changes)
   ============================================================ */
function clearGroup(){ S.selSet = []; S.selWireSet = []; S.marquee = null; S.groupDrag = null; S.swHover = null; }
const hasGroup = () => S.selSet.length > 0 || S.selWireSet.length > 0;

/* bounding box of the selection, in logical px */
function groupBBox(){
  const xs = [], ys = [];
  S.selSet.forEach(i => { const g = compGeom(S.comps[i]); xs.push(g.x1, g.x2); ys.push(g.y1, g.y2); });
  S.selWireSet.forEach(i => { const w = S.wires[i];
    xs.push(gx(w.c1), gx(w.c2)); ys.push(gy(w.r1), gy(w.r2)); });
  if(!xs.length) return null;
  return {x0:Math.min(...xs), y0:Math.min(...ys), x1:Math.max(...xs), y1:Math.max(...ys)};
}

/* marquee -> selection.  A component counts as inside when its whole body is
   inside; a wire when BOTH its ends are, so a half-covered wire is never moved
   away from the node it is attached to. */
function applyMarquee(m){
  const x0 = Math.min(m.x0,m.x1), x1 = Math.max(m.x0,m.x1);
  const y0 = Math.min(m.y0,m.y1), y1 = Math.max(m.y0,m.y1);
  const inside = (x,y) => x >= x0 && x <= x1 && y >= y0 && y <= y1;
  S.selSet = S.comps.map((c,i)=>i).filter(i => {
    const g = compGeom(S.comps[i]); return inside(g.x1,g.y1) && inside(g.x2,g.y2); });
  S.selWireSet = S.wires.map((w,i)=>i).filter(i => {
    const w = S.wires[i];
    return inside(gx(w.c1),gy(w.r1)) && inside(gx(w.c2),gy(w.r2)); });
}

/* can the whole selection sit at this offset? */
function groupFits(dc, dr, orig){
  for(const o of orig.comps){
    const cp = S.comps[o.i];
    if(!fits(o.c + dc, o.r + dr, cp.o)) return false;
  }
  for(const o of orig.wires){
    for(const [c,r] of [[o.c1+dc,o.r1+dr],[o.c2+dc,o.r2+dr]])
      if(c < 0 || c > COLS || r < S.rowTop || r > S.rowBot) return false;
  }
  return true;
}
function moveGroup(dc, dr, orig){
  orig.comps.forEach(o => { S.comps[o.i].c = o.c + dc; S.comps[o.i].r = o.r + dr; });
  orig.wires.forEach(o => { const w = S.wires[o.i];
    w.c1 = o.c1 + dc; w.r1 = o.r1 + dr; w.c2 = o.c2 + dc; w.r2 = o.r2 + dr; });
}
function deleteGroup(){
  if(!hasGroup()) return;
  snapshot();
  [...S.selSet].sort((a,b)=>b-a).forEach(i => S.comps.splice(i,1));
  [...S.selWireSet].sort((a,b)=>b-a).forEach(i => S.wires.splice(i,1));
  S.sel = -1; S.selWire = -1; clearGroup(); recompute();
}
function rotateGroup(){
  if(!S.selSet.length) return;
  snapshot();
  S.selSet.forEach(i => {
    const cp = S.comps[i], o = cp.o === 'h' ? 'v' : 'h';
    if(fits(cp.c, cp.r, o)) cp.o = o;
  });
  recompute();
}
function selectAllGroup(){
  S.selSet = S.comps.map((_,i)=>i);
  S.selWireSet = S.wires.map((_,i)=>i);
  S.sel = -1; S.selWire = -1; updatePanel(); updateSummary(); draw();
}

/* ============================================================
   INTERACTION
   ============================================================ */
const editable = () => S.mode === 'build';

function hitComp(p){
  for(let i=S.comps.length-1;i>=0;i--){
    const g = compGeom(S.comps[i]);
    const hw = g.h ? 44 : 20, hh = g.h ? 20 : 44;
    if(Math.abs(p.x-g.mx) <= hw && Math.abs(p.y-g.my) <= hh) return i;
  }
  return -1;
}
/* every component whose body contains the pointer, not just the topmost —
   this is what lets the hover bar report "3 parts stacked here" */
function hitCompAll(p){
  const out = [];
  for(let i = S.comps.length-1; i >= 0; i--){
    const g = compGeom(S.comps[i]);
    const hw = g.h ? 44 : 20, hh = g.h ? 20 : 44;
    if(Math.abs(p.x-g.mx) <= hw && Math.abs(p.y-g.my) <= hh) out.push(i);
  }
  return out;
}

/* ---- hold-to-toggle a switch ----
   Resting the pointer on a switch arms a 3 s countdown; when it reaches zero
   the switch flips, and it keeps flipping every 3 s for as long as the pointer
   stays there.  Only ever armed when exactly ONE component is under the
   pointer and no drag / marquee / placement is in progress, so it can never
   fire by accident while the user is doing something else. */
const SW_HOLD = 3;                                   // seconds
function armSwitchHover(p, now){
  const allowed = (S.mode === 'test') || (S.mode === 'build' && S.tool === 'select');
  let idx = -1;
  if(allowed && !S.drag && !S.groupDrag && !S.marquee && !S.place){
    const all = hitCompAll(p);
    if(all.length === 1 && S.comps[all[0]].t === 'switch') idx = all[0];
  }
  if(idx < 0){ S.swHover = null; return; }
  if(!S.swHover || S.swHover.i !== idx) S.swHover = {i:idx, start:now};
}

/* one-line description of whatever sits under the pointer */
function hoverInfo(p){
  const res = S.res;
  const parts = hitCompAll(p);
  if(parts.length > 1){
    const names = parts.map(i => S.comps[i].name);
    return '⧉ <b>' + parts.length + ' parts stacked here</b> — ' +
           names.slice(0,6).join(', ') + (names.length > 6 ? ', …' : '') +
           ' · drag them apart or use ▦ Group';
  }
  if(parts.length === 1){
    const i = parts[0], cp = S.comps[i], d = CATALOG[cp.t];
    let t = '<b>' + d.label + ' ' + cp.name + '</b>';
    if(d.kind === 'src')                      t += ' — ℰ = ' + fmt(cp.V,'V');
    else if(d.kind === 'sw'){
      t += ' — ' + (cp.closed === false ? 'open' : 'closed');
      if(S.swHover && S.swHover.i === i){
        const left = Math.max(0, SW_HOLD - (performance.now() - S.swHover.start)/1000);
        t += ' · keep hovering to flip it in <b>' + Math.ceil(left) + ' s</b>';
      } else t += ' · hover ' + SW_HOLD + ' s to flip it';
    }
    else if(d.kind === 'meterA')              t += ' — ammeter, in series';
    else if(d.kind === 'meterV')              t += ' — voltmeter, in parallel';
    else if(cp.R != null)                     t += ' — R = ' + fmtR(cp.R);
    const rr = res && res.ok ? idealise(cp, res.comp[i]) : null;
    if(rr && !res.shorted)
      t += '  ·  ' + fmt(Math.abs(rr.V),'V') + ' · ' + fmt(Math.abs(rr.I),'A') +
           ' · ' + fmt(Math.abs(rr.P),'W');
    return t;
  }
  const wi = hitWire(p);
  if(wi >= 0){
    let I = null, best = 1e9;
    if(res && res.ok) Object.values(res.wire).forEach(seg => {
      if(seg.wire !== wi) return;
      const d = Math.hypot((gx(seg.p.c)+gx(seg.q.c))/2 - p.x,
                           (gy(seg.p.r)+gy(seg.q.r))/2 - p.y);
      if(d < best){ best = d; I = seg.I; }
    });
    return '<b>Wire</b>' + (I != null ? ' — carrying ' + fmt(Math.abs(I),'A') : ' — no current');
  }
  const n = nearestNode(p);
  if(n && n.d < 14) return 'empty grid node <b>(' + n.c + ', ' + n.r + ')</b>';
  return '';
}

function hitWire(p){
  for(let i=S.wires.length-1;i>=0;i--){
    const w = S.wires[i];
    const x1=gx(w.c1),y1=gy(w.r1),x2=gx(w.c2),y2=gy(w.r2);
    const L2 = (x2-x1)**2 + (y2-y1)**2; if(!L2) continue;
    let t = ((p.x-x1)*(x2-x1) + (p.y-y1)*(y2-y1))/L2;
    t = Math.max(0, Math.min(1, t));
    if(Math.hypot(p.x - (x1+t*(x2-x1)), p.y - (y1+t*(y2-y1))) < 9) return i;
  }
  return -1;
}
function fits(c,r,o){
  return o==='h' ? (c>=0 && c+SPAN<=COLS && r>=S.rowTop && r<=S.rowBot)
                 : (c>=0 && c<=COLS && r>=S.rowTop && r+SPAN<=S.rowBot);
}

CV.addEventListener('pointermove', e=>{
  if(S.mode === 'rlab') return;
  if(S.panDrag){
    const d = S.panDrag;
    S.tx = d.tx + (e.clientX - d.px);
    S.ty = d.ty + (e.clientY - d.py);
    if(Math.abs(e.clientX - d.px) + Math.abs(e.clientY - d.py) > 3) d.moved = true;
    applyView(CV.getBoundingClientRect()); draw();
    return;
  }
  const p = toLogical(e);
  if(S.marquee){ S.marquee.x1 = p.x; S.marquee.y1 = p.y; draw(); return; }
  if(S.groupDrag){
    const g = S.groupDrag;
    const dc = Math.round((p.x - g.sx)/CELL), dr = Math.round((p.y - g.sy)/CELL);
    if((dc || dr) && groupFits(dc, dr, g.orig)){ g.moved = true; moveGroup(dc, dr, g.orig); recompute(); }
    return;
  }
  armSwitchHover(p, performance.now());
  const info = hoverInfo(p);
  const hv = $('chipHover');
  hv.innerHTML = info; hv.style.display = info ? 'block' : 'none';
  const n = nearestNode(p);
  S.hoverNode = (n && n.d < 26) ? n : (S.place || S.tool==='wire' ? n : null);
  if(S.drag){
    const nn = nearestNode(p);
    if(nn && fits(nn.c, nn.r, S.comps[S.drag.i].o)){
      S.comps[S.drag.i].c = nn.c; S.comps[S.drag.i].r = nn.r;
      recompute(); return;
    }
  }
  draw();
});
CV.addEventListener('pointerleave', ()=>{
  S.hoverNode = null; S.swHover = null;
  $('chipHover').style.display = 'none';
  draw(); });

/* Middle button anywhere on the canvas = "never mind": drop the selection,
   the group, a half-drawn wire and any queued part.  Same effect as clicking
   the active tool again, but reachable without moving the pointer away. */
function cancelSelection(){
  const had = S.sel >= 0 || S.selWire >= 0 || hasGroup() || S.wireFrom || S.place;
  S.sel = -1; S.selWire = -1; S.wireFrom = null; S.place = null;
  clearGroup(); syncPalette(); updatePanel(); updateSummary(); draw();
  return had;
}
CV.addEventListener('auxclick', e => { if(e.button === 1) e.preventDefault(); });
CV.addEventListener('mousedown', e => { if(e.button === 1) e.preventDefault(); });

CV.addEventListener('pointerdown', e=>{
  if(e.button === 1){ e.preventDefault(); cancelSelection(); return; }
  if(S.mode === 'rlab') return;
  try { CV.setPointerCapture(e.pointerId); } catch(_){}   // can throw if the pointer already went away
  const p = toLogical(e);
  const n = nearestNode(p);

  if(S.tool === 'group' && editable()){
    const bb = hasGroup() ? groupBBox() : null;
    if(bb && p.x >= bb.x0-14 && p.x <= bb.x1+14 && p.y >= bb.y0-14 && p.y <= bb.y1+14){
      snapshot();                                   // grab the selection and drag it
      S.groupDrag = {sx:p.x, sy:p.y, moved:false, orig:{
        comps: S.selSet.map(i => ({i, c:S.comps[i].c, r:S.comps[i].r})),
        wires: S.selWireSet.map(i => ({i, ...S.wires[i]}))}};
      return;
    }
    clearGroup();
    S.marquee = {x0:p.x, y0:p.y, x1:p.x, y1:p.y};
    updatePanel(); draw();
    return;
  }
  if(S.place && editable()){
    if(n && fits(n.c, n.r, S.ghostO)){
      snapshot();
      S.comps.push(makeComp(S.place, n.c, n.r, S.ghostO));
      S.sel = S.comps.length-1; S.panelTab = 'comp';
      recompute();
    }
    return;
  }
  if(S.tool === 'wire' && editable()){
    if(!n) return;
    if(!S.wireFrom){ S.wireFrom = {c:n.c, r:n.r}; }
    else{
      const path = elbow(S.wireFrom, n);
      if(!(path.length===2 && path[0].c===path[1].c && path[0].r===path[1].r)){
        snapshot();
        for(let i=0;i<path.length-1;i++)
          S.wires.push(w(path[i].c, path[i].r, path[i+1].c, path[i+1].r));
      }
      S.wireFrom = {c:n.c, r:n.r};       // chain
      recompute();
    }
    draw(); return;
  }
  if(S.tool === 'delete' && editable()){
    const ci = hitComp(p);
    if(ci >= 0){ snapshot(); S.comps.splice(ci,1); S.sel=-1; recompute(); return; }
    const wi = hitWire(p);
    if(wi >= 0){ snapshot(); S.wires.splice(wi,1); S.selWire=-1; recompute(); }
    return;
  }
  // while zoomed, press-and-hold on empty canvas pans the view
  if(S.zoom > 1 && (S.mode === 'test' || S.tool === 'select') &&
     hitComp(p) < 0 && hitWire(p) < 0){
    S.panDrag = {px:e.clientX, py:e.clientY, tx:S.tx, ty:S.ty, moved:false};
    CV.style.cursor = 'grabbing';
    return;
  }
  // select tool
  const ci = hitComp(p);
  if(ci >= 0){
    S.sel = ci; S.selWire = -1; S.panelTab = 'comp';
    if(editable()){ snapshot(); S.drag = {i:ci}; }
    updatePanel(); draw(); return;
  }
  const wi = hitWire(p);
  S.selWire = wi; S.sel = -1;
  updatePanel(); draw();
});
CV.addEventListener('pointerup', ()=>{
  if(S.panDrag){
    const moved = S.panDrag.moved;
    S.panDrag = null;
    applyView(CV.getBoundingClientRect());
    if(!moved){ S.sel = -1; S.selWire = -1; updatePanel(); }   // plain click = deselect
    draw();
    return;
  }
  S.drag = null;
  if(S.marquee){
    const m = S.marquee; S.marquee = null;
    if(Math.abs(m.x1-m.x0) > 6 || Math.abs(m.y1-m.y0) > 6) applyMarquee(m);
    updatePanel(); updateSummary(); draw();
  }
  if(S.groupDrag){ if(!S.groupDrag.moved) S.undo.pop(); S.groupDrag = null; }
});
CV.addEventListener('pointercancel', ()=>{
  S.marquee = null; S.groupDrag = null; S.panDrag = null;
  applyView(CV.getBoundingClientRect()); draw(); });
/* Double-click toggles 2× zoom about the clicked point.  It is deliberately
   inert while ANY other selection/edit gesture is live or something is already
   selected, so it can never fire in the middle of another action. */
function zoomAllowed(){
  return S.mode !== 'rlab' && !S.drag && !S.groupDrag && !S.marquee &&
         !S.panDrag && !S.place && !S.wireFrom && !hasGroup() &&
         S.sel < 0 && S.selWire < 0;
}
CV.addEventListener('dblclick', e=>{
  if(!zoomAllowed()) return;
  const r = CV.getBoundingClientRect();
  const anchor = toLogical(e);                     // measured BEFORE the change
  setZoom(S.zoom === 1 ? 2 : 1, anchor,
          {x:e.clientX - r.left, y:e.clientY - r.top});
});

CV.addEventListener('contextmenu', e=>{ e.preventDefault(); S.wireFrom = null; draw(); });

window.addEventListener('keydown', e=>{
  if(e.target.tagName === 'INPUT') return;
  if((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A') && S.tool === 'group' && editable()){
    e.preventDefault(); selectAllGroup(); return;
  }
  if(e.key === 'r' || e.key === 'R'){
    if(S.tool === 'group' && hasGroup()){ rotateGroup(); return; }
    if(S.place){ S.ghostO = S.ghostO === 'h' ? 'v' : 'h'; draw(); }
    else if(S.sel >= 0 && editable()){
      snapshot(); const cp = S.comps[S.sel];
      const o = cp.o === 'h' ? 'v' : 'h';
      if(fits(cp.c, cp.r, o)){ cp.o = o; recompute(); }
    }
  }
  if(e.key === 'Escape'){ S.place = null; S.wireFrom = null; clearGroup(); setTool('select'); syncPalette(); draw(); }
  if((e.key === 'Delete' || e.key === 'Backspace') && editable()){
    if(hasGroup()){ deleteGroup(); return; }
    if(S.sel >= 0){ snapshot(); S.comps.splice(S.sel,1); S.sel=-1; recompute(); }
    else if(S.selWire >= 0){ snapshot(); S.wires.splice(S.selWire,1); S.selWire=-1; recompute(); }
  }
  if((e.ctrlKey||e.metaKey) && e.key === 'z'){ e.preventDefault(); undo(); }
});

/* ============================================================
   UI WIRING
   ============================================================ */
function setTool(t){
  S.tool = t; S.place = null; S.wireFrom = null;
  clearGroup();
  if(t === 'group'){ S.sel = -1; S.selWire = -1; }
  updatePanel();
  document.querySelectorAll('[data-tool]').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === t));
  syncPalette(); draw();
}
function syncPalette(){
  document.querySelectorAll('[data-place]').forEach(b =>
    b.classList.toggle('active', b.dataset.place === S.place));
}
function setMode(m){
  const prev = S.mode;
  if(prev === 'build' && m !== 'build')
    S.saveBuild = JSON.stringify({c:S.comps, w:S.wires});
  S.mode = m;
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === m));
  ['build','test','rlab'].forEach(k =>
    $('slot-'+k).style.display = (k===m) ? 'flex' : 'none');
  S.place = null; S.wireFrom = null; S.sel = -1; S.selWire = -1; clearGroup();
  if(m === 'build'){
    if(S.saveBuild){ const st = JSON.parse(S.saveBuild); S.comps = st.c; S.wires = st.w; }
    else if(!S.comps.length) defaultCircuit();
    setTool('select');
  }
  if(m === 'test'){ loadPreset(S.preset); }
  if(m === 'rlab'){ S.panelTab = (S.panelTab === 'comp') ? 'graph' : S.panelTab; }
  $('palette').classList.toggle('locked', m !== 'build');
  $('chipMode').textContent = {build:'Free-form Builder', test:'Circuit Tester — '+PRESETS[S.preset].name,
                               rlab:'Resistance Lab'}[m];
  $('chipHint2').innerHTML = {
    build:['<b>Click any component</b> to read its V, I, R and P in the panel.',
           'Pick a part below, then click the grid to place a new one.',
           '<b>Wire tool</b> — click node → node (right-click to stop).',
           '<b>Group tool</b> — drag a box, then drag inside it to move.',
           '<b>Switches</b> — rest the pointer on one for 3 s to flip it.',
           '<b>Zoom</b> — double-click empty canvas for 2×, then drag to pan.',
           '<b>Shortcuts</b> — R rotates · Del removes · Ctrl+Z undoes · middle-click clears the selection'
          ].join('<br>'),
    test :['<b>Click any component</b> to read its V, I, R and P in the panel.',
           'Rest the pointer on a switch for 3 s to open or close it.',
           '<b>Zoom</b> — double-click empty canvas for 2×, then drag to pan.',
           'Editing is locked in this mode.',
           '<b>Shortcuts</b> — middle-click clears the selection'].join('<br>'),
    rlab :['<b>Sweep the supply</b>, then press ● Point to add one reading.',
           '<b>⟲ Auto-Points</b> fills the table right across the axis in one go.',
           'Pick the graph you want in the <b>Graph</b> panel — one is drawn at a time.'].join('<br>')}[m];
  $('chipGrid').style.display = (m === 'rlab') ? 'none' : 'block';
  $('chipHover').style.display = 'none';
  setZoom(1);
  recompute();
}
function setTheme(name){
  document.body.className = (name === 'dark') ? '' : 'theme-' + name;
  S.theme = name; readPalette(); draw(); if(S.panelTab==='graph') drawGraph();
}

function buildPalette(){
  const order = ['cell','battery','supply','resistor','varres','lamp','heater','fuse',
                 'motor','thermistor','ldr','diode','ammeter','voltmeter','switch'];
  $('palette').innerHTML = order.map(t =>
    '<button class="pbtn" data-place="'+t+'" title="'+CATALOG[t].label+'">' +
    '<canvas width="76" height="40" data-icon="'+t+'"></canvas>' +
    '<span>'+CATALOG[t].label+'</span></button>').join('');
  document.querySelectorAll('[data-place]').forEach(b => b.onclick = ()=>{
    S.place = (S.place === b.dataset.place) ? null : b.dataset.place;
    S.tool = 'select';
    document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active', x.dataset.tool==='select'));
    syncPalette(); draw();
  });
  drawPaletteIcons();
}
function drawPaletteIcons(){
  readPalette();
  const real = CX;                                  // swap the module context
  document.querySelectorAll('canvas[data-icon]').forEach(cv=>{
    const g = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio||1);
    cv.width = 76*dpr; cv.height = 40*dpr;
    cv.style.width='76px'; cv.style.height='40px';
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,76,40);
    CX = g;
    CX.save(); CX.translate(38,21); CX.scale(0.74,0.74);
    CX.strokeStyle = PAL.text; CX.fillStyle = PAL.text;
    CX.lineWidth = 2.6; CX.lineCap='round'; CX.lineJoin='round';
    (SYMBOL[symbolFor(cv.dataset.icon)]||SYMBOL.res)(
      {stroke:PAL.text, glow:0, closed:true, labels:false, rot:0});
    CX.restore();
  });
  CX = real;
}

/* ---------- animation ---------- */
let last = performance.now();
function tick(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  let need = false;
  if(S.anim && flowOn()){ S.t += dt; need = true; }
  /* the countdown runs on wall-clock time, so it works even with the
     animation paused or the flow dots switched off */
  if(S.swHover){
    const cp = S.comps[S.swHover.i];
    if(!cp || cp.t !== 'switch') S.swHover = null;
    else {
      if(now - S.swHover.start >= SW_HOLD*1000){
        snapshot();
        cp.closed = (cp.closed === false);
        S.swHover.start = now;
        recompute();
      }
      need = true;
    }
  }
  if(need) draw();
  requestAnimationFrame(tick);
}

/* ============================================================
   BOOT — bind every control, then start
   ============================================================ */
function bindPills(sel, attr, cb){
  document.querySelectorAll(sel).forEach(b => b.onclick = () => {
    b.parentElement.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    cb(b.dataset[attr], b);
  });
}

/* mode bar */
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));

/* builder tools */
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('rotBtn').onclick = () => {
  if(S.place){ S.ghostO = S.ghostO === 'h' ? 'v' : 'h'; draw(); return; }
  if(S.sel >= 0 && editable()){
    snapshot(); const cp = S.comps[S.sel];
    const o = cp.o === 'h' ? 'v' : 'h';
    if(fits(cp.c, cp.r, o)){ cp.o = o; recompute(); }
  }
};
$('undoBtn').onclick = undo;
$('clearBtn').onclick = () => { snapshot(); S.comps = []; S.wires = []; S.sel = -1; S.selWire = -1; recompute(); };

/* save / load slots */
refreshSlotList(0);
const slotIdx = () => +$('slotSel').value || 0;
$('slotSave').onclick = () => {
  const i = slotIdx(), cur = slotsRead()[i];
  if(cur && !confirm('Slot ' + (i+1) + ' already holds “' + cur.name + '”.\nOverwrite it?')) return;
  let name = prompt('Name for slot ' + (i+1) + ':', cur ? cur.name : ('Circuit ' + (i+1)));
  if(name === null) return;                                   // cancelled
  name = (name.trim() || ('Circuit ' + (i+1))).slice(0, 30);
  saveSlot(i, name);
};
$('slotLoad').onclick = () => loadSlot(slotIdx());
$('slotDel').onclick  = () => {
  const i = slotIdx(), cur = slotsRead()[i];
  if(cur && !confirm('Clear slot ' + (i+1) + ' — “' + cur.name + '”?')) return;
  deleteSlot(i);
};
$('slotHome').onclick = loadHome;
$('slotExp').onclick  = exportSlots;
$('slotImp').onclick  = () => $('slotFile').click();
$('slotFile').onchange = e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => importSlots(String(rd.result));
  rd.readAsText(f);
  e.target.value = '';
};

/* tester presets */
bindPills('[data-preset]', 'preset', k => { S.preset = k; loadPreset(k); });

/* R-lab */
bindPills('[data-dev]', 'dev', k => {
  const d = RLAB[k];
  S.rlab.dev = k; S.rlab.p = d.pdef; S.rlab.V = d.vdef; S.rlab.rows = [];
  if((d.graphs || ['iv']).indexOf(S.rlab.graph) < 0) S.rlab.graph = (d.graphs || ['iv'])[0];
  S.panelTab = 'graph';                      // the sliders live in the Graph panel
  recompute();                               // -> updatePanel -> renderRlabControls
});
$('recBtn2').onclick = recordPoint;
$('autoBtn2').onclick = autoSweep;
$('clrBtn2').onclick = () => { S.rlab.rows = []; recompute(); };

/* show toggles */
document.querySelectorAll('[data-show]').forEach(b => b.onclick = () => {
  const k = b.dataset.show;
  S.show[k] = !S.show[k];
  b.classList.toggle('active', S.show[k]);
  draw();
});

/* flow: off / conventional current / electron flow */
bindPills('[data-flow]', 'flow', v => { S.flow = v; draw(); });

/* animation */
$('playBtn').onclick = () => {
  S.anim = !S.anim;
  $('playBtn').textContent = S.anim ? '⏸ Pause' : '▶ Play';
  draw();
};
bindPills('[data-speed]', 'speed', v => { S.speed = +v; });

/* reset — current mode only */
$('resetBtn').onclick = () => {
  if(S.mode === 'build'){ snapshot(); S.saveBuild = null; defaultCircuit(); }
  else if(S.mode === 'test'){ loadPreset(S.preset); }
  else {
    const d = RLAB[S.rlab.dev];
    S.rlab.p = d.pdef; S.rlab.V = d.vdef; S.rlab.rows = []; S.rlab.graph = 'iv';
  }
  S.show = {grid:true, labels:true, values:true};
  document.querySelectorAll('[data-show]').forEach(b => b.classList.add('active'));
  S.flow = 'current';
  document.querySelectorAll('[data-flow]').forEach(b =>
    b.classList.toggle('active', b.dataset.flow === 'current'));
  S.speed = 1;
  document.querySelectorAll('[data-speed]').forEach(b =>
    b.classList.toggle('active', b.dataset.speed === '1'));
  S.anim = true; $('playBtn').textContent = '⏸ Pause';
  setZoom(1);
  recompute();
};

/* panel tabs */
document.querySelectorAll('[data-ptab]').forEach(b => b.onclick = () => {
  S.panelTab = b.dataset.ptab; updatePanel();
});

/* theme */
$('themeSel').onchange = e => { setTheme(e.target.value); drawPaletteIcons(); };

/* start */
buildPalette();
resize();                    // builds VX.base, so setMode/setZoom have a view
defaultCircuit();
setMode('build');
new ResizeObserver(() => resize()).observe(CV.parentElement);
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(t => { last = t; tick(t); });
/* KaTeX is deferred; once it lands, redraw the panel so the working box
   switches from its plain-text twin to typeset maths */
window.addEventListener('load', () => { if(typeof katex !== 'undefined') updatePanel(); });

</script>
</body>
</html>
