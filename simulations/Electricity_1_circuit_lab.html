<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circuit Lab — HAUS Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
/* ============ THEME TOKENS (6 themes) ============ */
:root {
  --bg:#0f172a; --card:#1e293b; --border:#334155;
  --text:#e2e8f0; --text-dim:#94a3b8; --text-muted:#64748b;
  --accent:#e3b341; --accent-glow:rgba(227,179,65,0.12);
  --grid:#1e293b; --graph-bg:#0a0f1a;
  --green:#34d399; --rose:#fb7185; --violet:#a78bfa;
  --amber:#fbbf24; --blue:#38bdf8; --orange:#fb923c;
  --wire:#cbd5e1; --flow:#38bdf8;
}
.theme-hausnight {
  --bg:#1a1c20; --card:#26282d; --border:#3a3c42;
  --text:#FFFFFF; --text-dim:#e0e2e8; --text-muted:#a8aab2;
  --accent:#F4C01E; --accent-glow:rgba(244,192,30,0.10);
  --grid:#2a2c32; --graph-bg:#121418;
  --green:#A6B36A; --rose:#D68B57; --violet:#CBAA6A;
  --amber:#F4C01E; --blue:#5FB0C4; --orange:#D68B57;
  --wire:#e0e2e8; --flow:#5FB0C4;
}
.theme-neon {
  --bg:#0d0f1a; --card:#1a1c2e; --border:#2a2d4a;
  --text:#e0e0f0; --text-dim:#8888b8; --text-muted:#5a5a8a;
  --accent:#00ffc8; --accent-glow:rgba(0,255,200,0.1);
  --grid:#1a1c2e; --graph-bg:#080a14;
  --green:#00ff88; --rose:#ff4499; --violet:#8844ff;
  --amber:#ffcc00; --blue:#4488ff; --orange:#ff6633;
  --wire:#b9b9e0; --flow:#00ffc8;
}
.theme-light {
  --bg:#ffffff; --card:#f3f4f6; --border:#d1d5db;
  --text:#111827; --text-dim:#4b5563; --text-muted:#9ca3af;
  --accent:#2563eb; --accent-glow:rgba(37,99,235,0.1);
  --grid:#e5e7eb; --graph-bg:#f9fafb;
  --green:#059669; --rose:#dc2626; --violet:#7c3aed;
  --amber:#d97706; --blue:#2563eb; --orange:#ea580c;
  --wire:#1f2937; --flow:#2563eb;
}
.theme-haus {
  --bg:#F4EEE0; --card:#FFFFFF; --border:#E4DAC4;
  --text:#1A1712; --text-dim:#5B5344; --text-muted:#948A74;
  --accent:#A9820F; --accent-glow:rgba(169,130,15,0.12);
  --grid:#EBE3D0; --graph-bg:#FCFAF2;
  --green:#4E7A3F; --rose:#B5502E; --violet:#8A6D3B;
  --amber:#A9820F; --blue:#4A7AB8; --orange:#A87A4A;
  --wire:#2A2620; --flow:#4A7AB8;
}
.theme-clay {
  --bg:#d4c8be; --card:#e5d9d0; --border:#c2b5aa;
  --text:#2d2622; --text-dim:#6a5a4d; --text-muted:#928078;
  --accent:#a55a3a; --accent-glow:rgba(165,90,58,0.1);
  --grid:#ccbfb5; --graph-bg:#eee6de;
  --green:#5a7a4a; --rose:#a03a3a; --violet:#6a4d7a;
  --amber:#b07a2a; --blue:#3a5a7a; --orange:#b05a2a;
  --wire:#2d2622; --flow:#3a5a7a;
}

/* ============ PAGE SHELL — every chrome height is fixed ============ */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;padding:8px 12px;height:100vh;overflow:hidden;
     display:flex;flex-direction:column;align-items:center;
     background:var(--bg);color:var(--text);transition:background .3s,color .3s}
.container{max-width:1560px;width:100%;height:100%;display:flex;flex-direction:column;min-height:0}

/* --- header zone: 45 px, set by .brand --- */
.top-bar{display:flex;justify-content:space-between;align-items:center;
         margin-bottom:6px;flex-wrap:wrap;gap:8px;flex:0 0 auto}
.top-bar h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge-top{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 8px;
           border-radius:12px;background:var(--accent-glow);color:var(--accent);
           border:1px solid var(--accent)}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.theme-select{background:var(--card);border:1px solid var(--border);color:var(--text);
              padding:4px 10px;border-radius:8px;cursor:pointer;
              font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;min-width:110px}
.brand{background:#F4C01E;border-radius:10px;padding:7px 8px;
       box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center}
.brand img{height:31px;width:auto;display:block}
@media(max-width:640px){.brand{display:none}}

/* --- mode bar: 3 equal buttons, 34 px --- */
.modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
         flex:0 0 auto;margin-bottom:6px}
.mbtn{height:34px;border:1px solid var(--border);background:var(--card);color:var(--text-dim);
      border-radius:9px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;
      font-weight:600;transition:all .18s;display:flex;align-items:center;
      justify-content:center;gap:7px}
.mbtn:hover{color:var(--text)}
.mbtn.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}

/* --- toolbar: two fixed rows = 82 px --- */
.toolbar{display:flex;flex-direction:column;gap:8px;background:var(--card);
         border:1px solid var(--border);border-radius:11px;padding:8px 12px;
         flex:0 0 auto;margin-bottom:6px}
.trow{display:flex;align-items:center;gap:14px;min-height:28px;height:28px;overflow:hidden}
.slot{display:none;align-items:center;gap:14px;width:100%;overflow:hidden}
.tgroup{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.tlabel{font-size:10px;color:var(--text-muted);text-transform:uppercase;
        letter-spacing:.6px;font-weight:600;white-space:nowrap}
.rule{width:1px;height:20px;background:var(--border);flex:0 0 auto}
.pills{display:flex;background:var(--bg);border:1px solid var(--border);
       border-radius:20px;padding:2px}
.pill{border:none;background:transparent;color:var(--text-dim);font-size:11px;
      padding:4px 11px;border-radius:16px;cursor:pointer;white-space:nowrap;
      font-family:'Inter',sans-serif;font-weight:500}
.pill:hover{color:var(--text)}
.pill.active{background:var(--accent-glow);color:var(--accent)}
.tbtn{border:1px solid var(--border);background:var(--bg);color:var(--text-dim);
      font-size:11px;padding:4px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tbtn:hover{color:var(--text);border-color:var(--accent)}
.slot-sel{background:var(--bg);border:1px solid var(--border);color:var(--text);
          font-family:'JetBrains Mono',monospace;font-size:10.5px;
          padding:3px 6px;border-radius:8px;cursor:pointer;outline:none;
          width:196px;max-width:196px}
.tbtn.ico{padding:4px 7px}
.tslider{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.tslider input[type=range]{width:130px;accent-color:var(--accent)}
.tval{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);
      min-width:56px;text-align:right}
.hint{font-size:10px;color:var(--text-muted);white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis}

/* --- palette strip: fixed 62 px, present in every mode --- */
.palette{display:flex;gap:5px;background:var(--card);border:1px solid var(--border);
         border-radius:11px;padding:5px 7px;flex:0 0 auto;margin-bottom:6px;
         overflow-x:auto;overflow-y:hidden;height:62px}
.palette.locked{opacity:.42;pointer-events:none}
.pbtn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:0;
      background:transparent;border:1px solid transparent;border-radius:8px;
      cursor:pointer;padding:1px 2px 2px}
.pbtn:hover{border-color:var(--border);background:var(--bg)}
.pbtn.active{border-color:var(--accent);background:var(--accent-glow)}
.pbtn span{font-size:9px;color:var(--text-dim);font-weight:500;letter-spacing:.2px}
.pbtn.active span{color:var(--accent)}
.pbtn canvas{display:block}

/* --- main split: canvas 1fr + panel 360 --- */
.main{flex:1 1 auto;min-height:0;display:flex;gap:8px}
.stage{flex:1 1 auto;min-width:0;position:relative;background:var(--graph-bg);
       border:1px solid var(--border);border-radius:11px;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
.chip{position:absolute;font-family:'JetBrains Mono',monospace;font-size:10px;
      padding:3px 9px;border-radius:8px;background:var(--card);
      border:1px solid var(--border);color:var(--text-dim);pointer-events:none}
.chip.tl{top:8px;left:8px} .chip.tr{top:8px;right:8px}
.chip.tr2{top:34px;right:8px;color:var(--accent);border-color:var(--accent)}
/* live hover inspector, centred on the same line as the mode chip */
.chip.tc{top:8px;left:50%;transform:translateX(-50%);max-width:min(58%,720px);
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
         color:var(--text);border-color:var(--accent)}
.chip.tc b{color:var(--accent)}
.chipstack{position:absolute;bottom:8px;left:8px;display:flex;flex-direction:column;
           align-items:flex-start;gap:4px;max-width:calc(100% - 16px);pointer-events:none}
.chipstack .chip{position:static;max-width:100%}
.chip2{font-size:9.5px;color:var(--text-muted);white-space:normal;text-align:left;line-height:1.5}
.chip2 b{color:var(--accent)}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:middle}
.chip b{color:var(--accent)}

.panel{flex:0 0 360px;display:flex;flex-direction:column;background:var(--card);
       border:1px solid var(--border);border-radius:11px;min-height:0;overflow:hidden}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:5px;
       border-bottom:1px solid var(--border);flex:0 0 auto}
.ptab{border:none;background:transparent;color:var(--text-dim);font-size:11px;
      padding:5px 0;border-radius:7px;cursor:pointer;font-weight:600}
.ptab:hover{color:var(--text)}
.ptab.active{background:var(--accent-glow);color:var(--accent)}
.panes{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px 14px}

/* --- panel content --- */
.ptitle{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;
        letter-spacing:.9px;color:var(--text-muted);text-transform:uppercase;
        margin:10px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.ptitle:first-child{margin-top:0}
.ptitle span{font-size:12px}
.cname{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:8px}
.cname span{font-size:11px;font-weight:500;color:var(--text-dim)}
.kv{display:flex;justify-content:space-between;align-items:center;
    font-size:11.5px;color:var(--text-dim);padding:4px 0}
.kv b{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);font-weight:600}
.v-blue{color:var(--blue)!important} .v-violet{color:var(--violet)!important}
.v-amber{color:var(--amber)!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 9px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:9px;
      padding:7px 8px;text-align:center}
.card .cl{font-size:10px;color:var(--text-muted);font-weight:700}
.card .cv{font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text)}
.card .cu{font-size:9px;color:var(--text-muted)}
.meter{background:var(--bg);border:1px solid var(--border);border-radius:9px;
       padding:7px 4px;text-align:center}
.meter .ml{font-size:13px;font-weight:800;color:var(--accent);
           font-family:'JetBrains Mono',monospace}
.meter .mv{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;
           color:var(--blue);margin:2px 0}
.meter .ms{font-size:9px;color:var(--text-muted)}
.sl{margin:8px 0}
.sl label{display:flex;justify-content:space-between;align-items:center;font-size:11px;
          color:var(--text-dim);margin-bottom:4px;gap:8px}
.sl label b{font-family:'JetBrains Mono',monospace;color:var(--accent)}
.numwrap{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.numin{width:78px;background:var(--bg);border:1px solid var(--border);border-radius:7px;
       color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px;
       font-weight:600;text-align:right;padding:3px 6px;outline:none}
.numin:focus{border-color:var(--accent)}
.numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{opacity:.45}
.numu{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);
      min-width:12px;text-align:left}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.formula{background:var(--bg);border:1px solid var(--border);border-radius:9px;
         padding:8px 10px;margin-top:8px}
.formula .f1{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--blue)}
.formula .f2{font-family:'JetBrains Mono',monospace;font-size:11.5px;
             color:var(--text);margin-top:3px}
.ptitle.sub{margin-top:12px}
.working{background:var(--bg);border:1px solid var(--border);border-radius:9px;
         padding:9px 11px;margin-top:4px}
.working .mrow{padding:3px 0;color:var(--text);font-size:12.5px;line-height:1.5}
.working .mrow + .mrow{border-top:1px solid var(--border)}
.working .mrow.plain{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text)}
.working .katex{font-size:1.02em;color:var(--text)}
.fromslot{color:var(--accent)}
.note{font-size:10.5px;color:var(--text-muted);line-height:1.5;margin-top:9px;
      background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 9px}
.note b{color:var(--text-dim)}
.empty{font-size:11px;color:var(--text-muted);text-align:center;padding:14px 6px;font-style:italic}
.mini{border:1px solid var(--border);background:var(--bg);color:var(--text-dim);
      font-size:10.5px;padding:4px 9px;border-radius:7px;cursor:pointer}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.rowbtns{display:flex;gap:5px;margin-bottom:8px}
table.dt{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:10.5px}
table.dt th{color:var(--text-muted);font-weight:600;text-align:right;padding:4px 5px;
            border-bottom:1px solid var(--border);font-size:9.5px}
table.dt th:first-child{text-align:left}
table.dt td{padding:3px 5px;text-align:right;color:var(--text-dim);
            border-bottom:1px solid var(--border)}
table.dt td:first-child{text-align:left;color:var(--text)}
table.dt tr.sel td{background:var(--accent-glow);color:var(--accent)}
table.dt tr[data-i]{cursor:pointer}
.gwrap{background:var(--graph-bg);border:1px solid var(--border);border-radius:9px;
       padding:1px;overflow:hidden}
/* which graph to draw — only ONE plot is ever on screen, so the panel stays readable */
.gpick{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}
.gpick button{border:1px solid var(--border);background:var(--bg);color:var(--text-dim);
      font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;white-space:nowrap;
      padding:4px 11px;border-radius:14px;cursor:pointer}
.gpick button:hover{color:var(--text);border-color:var(--accent)}
.gpick button.on{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}

/* --- summary bar: fixed 34 px --- */
.summary{flex:0 0 auto;margin-top:6px;height:34px;display:flex;align-items:center;
         background:var(--card);border:1px solid var(--border);border-radius:9px;
         padding:0 12px;font-size:11.5px;color:var(--text-dim);
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary b{color:var(--accent);font-family:'JetBrains Mono',monospace}
</style>
</head>

  <!-- ===== HEADER ZONE ===== -->

  <!-- ===== TOOLBAR: two fixed rows ===== -->
  <div class="toolbar">
    <div class="trow">
      <!-- ---- Builder ---- -->
      <div class="slot" id="slot-build">
        <div class="tgroup"><span class="tlabel">Tool</span>
          <div class="pills">
            <button class="pill active" data-tool="select">▣ Select</button>
            <button class="pill" data-tool="group" title="Drag a box to select several parts at once, then move, rotate or delete them together.">▦ Group</button>
            <button class="pill" data-tool="wire">🔗 Wire</button>
            <button class="pill" data-tool="delete">✂ Delete</button>
          </div>
        </div>
        <div class="rule"></div>
        <div class="tgroup"><span class="tlabel">Slots</span>
          <select class="slot-sel" id="slotSel"
            title="20 save slots, stored in this browser for this file."></select>
          <button class="tbtn" id="slotSave" title="Save the circuit now on the canvas into the chosen slot.">💾 Save</button>
          <button class="tbtn" id="slotLoad" title="Replace the canvas with the circuit in the chosen slot. Ctrl+Z undoes it.">📂 Load</button>
          <button class="tbtn ico" id="slotDel"  title="Empty the chosen slot.">🗑</button>
          <button class="tbtn" id="slotHome" title="Go back to the circuit the file opens with.">🏠 Start</button>
          <button class="tbtn ico" id="slotExp" title="Download all 20 slots as a .json file you can keep or move to another computer.">⭳</button>
          <button class="tbtn ico" id="slotImp" title="Load slots back from a .json file.">⭱</button>
          <input type="file" id="slotFile" accept="application/json,.json" style="display:none">
        </div>
        <div class="rule"></div>
        <div class="tgroup">
          <button class="tbtn" id="rotBtn">⟳ Rotate</button>
          <button class="tbtn" id="undoBtn">↺ Undo</button>
          <button class="tbtn" id="clearBtn">🗑 Clear all</button>
        </div>
      </div>

      <div class="slot" id="slot-test">

            <button class="pill" data-preset="series2">Series 2</button>

            <button class="pill" data-preset="parallel2">Parallel 2</button>
            <button class="pill" data-preset="mixed1">Mixed 1</button>
            <button class="pill" data-preset="mixed2">Mixed 2</button>

        </div>

    <div class="stage">
      <canvas id="cv"></canvas>

      <div class="chip tc" id="chipHover" style="display:none"></div>
      <div class="chip tr" id="chipGrid">1 square = <b>1 unit</b></div>

      <div class="ptabs">
        <button class="ptab active" id="ptab-comp"   data-ptab="comp">🔧 Part</button>
        <button class="ptab"        id="ptab-meters" data-ptab="meters">⚡ Meters</button>
        <button class="ptab"        id="ptab-graph"  data-ptab="graph">📊 Graph</button>
        <button class="ptab"        id="ptab-data"   data-ptab="data">📋 Data</button>

        <div id="pane-comp"></div>

          <div id="rlabCtl" style="display:none"></div>
          <div class="ptitle"><span>📊</span><span id="graphTitle">I–V GRAPH</span></div>
          <div class="gpick" id="graphPick" style="display:none"></div>
          <div class="gwrap"><canvas id="gcv"></canvas></div>

<script>
/* ============================================================
   CIRCUIT LAB — core engine
   grid schematic -> nets (union-find) -> MNA -> per-component V,I,P
   Wires are IDEAL (zero resistance): they are merged into nets, so
   the matrix never mixes 1e-3 ohm with 1e7 ohm.  Wire currents for
   the flow animation are recovered afterwards by a small Laplacian
   solve inside each net.
   ============================================================ */

/* ---------- grid geometry (single source of truth) ---------- */
const GW = 1200, GH = 640;       // logical canvas
const CELL = 40;                 // 1 grid square = 40 px  = 1 "unit"
const COLS = 28, ROWS = 14;      // grid nodes available to the user
const OX = 40, OY = 40;          // grid origin inside the logical canvas
const SPAN = 2;                  // every component spans 2 grid cells
const gx = c => OX + c * CELL;
const gy = r => OY + r * CELL;

/* ---------- component catalogue ---------- */
const CATALOG = {
  cell:      {label:'Cell',        kind:'src',   V:1.5,  prefix:'E',   pol:1, rint:0},
  battery:   {label:'Battery',     kind:'src',   V:6.0,  prefix:'B',   pol:1, rint:0},
  supply:    {label:'DC Supply',   kind:'src',   V:12.0, prefix:'S',   pol:1, rint:0},
  resistor:  {label:'Resistor',    kind:'res',   R:10,   prefix:'R'},
  varres:    {label:'Variable R',  kind:'res',   R:20,   prefix:'VR'},
  lamp:      {label:'Lamp',        kind:'res',   R:12,   prefix:'L'},
  heater:    {label:'Heater',      kind:'res',   R:24,   prefix:'H'},
  fuse:      {label:'Fuse',        kind:'res',   R:0.5,  prefix:'F'},
  motor:     {label:'Motor',       kind:'res',   R:8,    prefix:'M'},
  thermistor:{label:'Thermistor',  kind:'res',   R:15,   prefix:'TH'},
  ldr:       {label:'LDR',         kind:'res',   R:30,   prefix:'LDR'},
  diode:     {label:'Diode',       kind:'diode', R:0.5,  prefix:'D',   pol:1},
  ammeter:   {label:'Ammeter',     kind:'meterA',        prefix:'A',   pol:1},
  voltmeter: {label:'Voltmeter',   kind:'meterV',        prefix:'V',   pol:1},
  switch:    {label:'Switch',      kind:'sw',            prefix:'SW',  closed:true}
};
const R_SWON  = 1e-4;     // closed switch / ideal-ish conductor
const R_VOLT  = 1e7;      // voltmeter internal resistance (10 MΩ)
const R_OPEN  = 1e12;     // open switch, reverse-biased diode
const GMIN    = 1e-11;    // leak to ground; keeps floating nets solvable
const I_SHORT = 50;       // above this the circuit is called a short

/* ---------- Gauss elimination, partial pivoting ---------- */
function solveLinear(A, b){
  const n = b.length;
  const M = A.map((row,i)=>row.concat([b[i]]));
  for(let k=0;k<n;k++){
    let p=k, best=Math.abs(M[k][k]);
    for(let i=k+1;i<n;i++){ const v=Math.abs(M[i][k]); if(v>best){best=v;p=i;} }
    if(best < 1e-20) return null;
    if(p!==k){ const t=M[p]; M[p]=M[k]; M[k]=t; }
    const piv = M[k][k];
    for(let i=k+1;i<n;i++){
      const f = M[i][k]/piv; if(f===0) continue;
      for(let j=k;j<=n;j++) M[i][j] -= f*M[k][j];
    }
  }
  const x = new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){
    let s = M[i][n];
    for(let j=i+1;j<n;j++) s -= M[i][j]*x[j];
    x[i] = s/M[i][i];
  }
  return x;
}

/* ---------- component terminals ----------
   terms[0] is the "+" / first terminal.  cp.flip swaps them, which is
   what reverses a cell, a diode or a meter.                          */
function termsOf(cp){
  const a = {c:cp.c, r:cp.r};
  const b = cp.o === 'h' ? {c:cp.c+SPAN, r:cp.r} : {c:cp.c, r:cp.r+SPAN};
  return cp.flip ? [b, a] : [a, b];
}
const key = p => p.c + ',' + p.r;

/* ---------- point on wire (inclusive) ---------- */
function onWire(p, w){
  if(w.c1 === w.c2) return p.c === w.c1 && p.r >= Math.min(w.r1,w.r2) && p.r <= Math.max(w.r1,w.r2);
  if(w.r1 === w.r2) return p.r === w.r1 && p.c >= Math.min(w.c1,w.c2) && p.c <= Math.max(w.c1,w.c2);
  return false;
}

/* ============================================================
   buildNets — union-find over anchor points.
   Anchors = wire endpoints + component terminals.  Every anchor
   lying on a wire joins that wire's net.  Two wires that merely
   CROSS (neither has an endpoint there) stay unconnected — the
   BS 3939 "no dot = no join" convention.
   ============================================================ */
function buildNets(comps, wires){
  const anchors = [], seen = new Set();
  const add = p => { const k = key(p); if(!seen.has(k)){ seen.add(k); anchors.push({c:p.c,r:p.r}); } };
  wires.forEach(w => { add({c:w.c1,r:w.r1}); add({c:w.c2,r:w.r2}); });
  comps.forEach(cp => termsOf(cp).forEach(add));

  const idx = new Map();
  anchors.forEach((p,i)=>idx.set(key(p), i));
  const par = anchors.map((_,i)=>i);
  const find = x => { while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };
  const uni  = (x,y) => { x=find(x); y=find(y); if(x!==y) par[x]=y; };

  // segments of each wire, split at every anchor sitting on it
  const segs = [];
  wires.forEach((w, wi) => {
    const on = anchors.filter(p => onWire(p, w));
    const along = p => (w.c1===w.c2) ? p.r : p.c;
    on.sort((p,q)=>along(p)-along(q));
    for(let i=0;i<on.length;i++) uni(idx.get(key(on[i])), idx.get(key(on[0])));
    for(let i=0;i<on.length-1;i++)
      segs.push({wire:wi, p:on[i], q:on[i+1], a:idx.get(key(on[i])), b:idx.get(key(on[i+1]))});
  });

  const netOfAnchor = anchors.map((_,i)=>find(i));
  const roots = [...new Set(netOfAnchor)];
  const netId = new Map(roots.map((rt,i)=>[rt,i]));
  const net = p => { const i = idx.get(key(p)); return i===undefined ? -1 : netId.get(find(i)); };
  // how many things touch each anchor point (for junction dots)
  const degree = new Map();
  const bump = p => degree.set(key(p), (degree.get(key(p))||0)+1);
  segs.forEach(s => { bump(s.p); bump(s.q); });
  comps.forEach(cp => termsOf(cp).forEach(bump));

  return {anchors, idx, segs, net, nNets: roots.length, degree,
          netOfAnchorIdx: i => netId.get(find(i))};
}

/* ---------- branch list from components ---------- */
function branchesOf(comps, nets){
  return comps.map((cp, ci) => {
    const [t0, t1] = termsOf(cp);
    const a = nets.net(t0), b = nets.net(t1);
    const def = CATALOG[cp.t];
    const val = (k, d) => (cp[k] != null ? cp[k] : (def[k] != null ? def[k] : d));
    switch(def.kind){
      // NOTE: internal resistance is `rint`, never `r` — `r` is the grid row.
      case 'src':    return {type:'V', a, b, E:val('V',0), rs:val('rint',0), ci, kind:'src'};
      case 'meterA': return {type:'V', a, b, E:0, rs:0, ci, kind:'meterA'};
      case 'meterV': return {type:'R', a, b, R:R_VOLT, ci, kind:'meterV'};
      case 'sw':     return (cp.closed === false)
                       ? {type:'R', a, b, R:R_OPEN, ci, kind:'sw', open:true}
                       : {type:'R', a, b, R:R_SWON, ci, kind:'sw'};
      case 'diode':  return {type:'R', a, b, R:R_SWON, ci, kind:'diode', diode:true, rf:val('R',0.5)};
      default:       return {type:'R', a, b, R:Math.max(1e-6, val('R',10)), ci, kind:'res'};
    }
  });
}

/* ---------- one MNA solve ---------- */
function mnaSolve(nNets, branches, ground){
  const n = nNets;
  const vs = branches.filter(b => b.type === 'V');
  const N = n + vs.length;
  const A = Array.from({length:N}, () => new Array(N).fill(0));
  const z = new Array(N).fill(0);

  for(const b of branches){
    if(b.type !== 'R' || b.a === b.b) continue;
    const g = 1/b.R;
    A[b.a][b.a] += g; A[b.b][b.b] += g;
    A[b.a][b.b] -= g; A[b.b][b.a] -= g;
  }
  for(let i=0;i<n;i++) A[i][i] += GMIN;

  vs.forEach((b, k) => {
    const row = n + k;
    A[b.a][row] += 1; A[b.b][row] -= 1;     // I leaves net a, enters net b
    A[row][b.a] += 1; A[row][b.b] -= 1;
    A[row][row] -= (b.rs || 0);             // Va - Vb - I*rs = E
    z[row] = b.E;
  });

  for(let j=0;j<N;j++) A[ground][j] = 0;
  A[ground][ground] = 1; z[ground] = 0;

  const x = solveLinear(A, z);
  return x ? {v:x.slice(0,n), i:x.slice(n), vs} : null;
}

/* ---------- wire currents inside one net (Laplacian, unit conductance) ---------- */
function wireCurrents(nets, comps, compRes){
  const out = {};
  if(!nets.segs.length) return out;
  // group anchors by net
  const byNet = new Map();
  nets.anchors.forEach((p,i)=>{
    const nid = nets.netOfAnchorIdx(i);
    if(!byNet.has(nid)) byNet.set(nid, []);
    byNet.get(nid).push(i);
  });
  // current injected into each anchor by the components touching it
  const inject = new Map();
  comps.forEach((cp, ci) => {
    const res = compRes[ci]; if(!res) return;
    const [t0,t1] = termsOf(cp);
    const i0 = nets.idx.get(key(t0)), i1 = nets.idx.get(key(t1));
    // res.I is defined as flowing INTO terminal0 and OUT of terminal1
    inject.set(i0, (inject.get(i0)||0) - res.I);
    inject.set(i1, (inject.get(i1)||0) + res.I);
  });
  for(const [nid, members] of byNet){
    const segs = nets.segs.filter(s => nets.netOfAnchorIdx(s.a) === nid);
    if(!segs.length) continue;
    const local = new Map(members.map((g,i)=>[g,i]));
    const n = members.length;
    const A = Array.from({length:n}, () => new Array(n).fill(0));
    const z = new Array(n).fill(0);
    for(const s of segs){
      const a = local.get(s.a), b = local.get(s.b);
      if(a===undefined||b===undefined||a===b) continue;
      A[a][a] += 1; A[b][b] += 1; A[a][b] -= 1; A[b][a] -= 1;
    }
    members.forEach((g,i)=>{ z[i] = inject.get(g) || 0; });
    for(let j=0;j<n;j++) A[0][j] = 0;
    A[0][0] = 1; z[0] = 0;
    for(let i=0;i<n;i++) A[i][i] += 1e-9;
    const phi = solveLinear(A, z);
    if(!phi) continue;
    for(const s of segs){
      const a = local.get(s.a), b = local.get(s.b);
      if(a===undefined||b===undefined) continue;
      out[s.wire + ':' + key(s.p) + ':' + key(s.q)] = {I: phi[a]-phi[b], p:s.p, q:s.q, wire:s.wire};
    }
  }
  return out;
}

/* ---------- full solve ---------- */
function solveCircuit(comps, wires){
  const nets = buildNets(comps, wires);
  if(nets.nNets === 0) return {ok:false, reason:'empty', nets, comp:[], wire:{}};
  const br = branchesOf(comps, nets);

  let ground = 0;
  const s0 = br.find(b => b.type === 'V' && Math.abs(b.E) > 1e-9);
  if(s0) ground = s0.b;

  const diodes = br.filter(b => b.diode);
  diodes.forEach(b => { b.R = b.rf; });          // assume forward first
  let sol = null, lastState = null;
  for(let it=0; it<30; it++){
    sol = mnaSolve(nets.nNets, br, ground);
    if(!sol) return {ok:false, reason:'singular', nets, comp:[], wire:{}};
    if(!diodes.length) break;
    let changed = false;
    const state = [];
    for(const b of diodes){
      const vd = sol.v[b.a] - sol.v[b.b];
      const on = (b.R > 1) ? (vd > 0.05) : (vd > -1e-9);
      state.push(on);
      const nR = on ? b.rf : R_OPEN;
      if(nR !== b.R){ b.R = nR; changed = true; }
    }
    const sig = state.join(',');
    if(!changed || sig === lastState) break;     // settled (or oscillating)
    lastState = sig;
  }

  const compRes = br.map(b => {
    const V = sol.v[b.a] - sol.v[b.b];
    let I;
    if(b.type === 'V') I = sol.i[sol.vs.indexOf(b)];
    else I = V / b.R;
    return {V, I, P: V*I,
            R: (b.type === 'V') ? (Math.abs(I) > 1e-12 ? V/I : 0) : b.R,
            open: !!b.open, kind: b.kind};
  });
  const wire = wireCurrents(nets, comps, compRes);
  const maxI = Math.max(0, ...compRes.map(r => Math.abs(r.I)));
  return {ok:true, nets, v:sol.v, comp:compRes, wire, ground,
          shorted: maxI > I_SHORT, maxI};
}

/* ============================================================
   R-LAB device models   supply --[A]-- DUT,  voltmeter across DUT
   ============================================================ */
const RLAB = {
  resistor: {
    label:'Fixed resistor', pname:'R', pfull:'Resistance R', unit:'Ω', pmin:1, pmax:100, pstep:1, pdef:20,
    vmin:0, vmax:12, vdef:6, ohmic:true, graphs:['iv','rv'],
    solve:(V, p) => ({I: V/p, Vd: V, R: p})
  },
  lamp: {
    label:'Filament lamp', pname:'R₀', pfull:'Cold resistance R₀', unit:'Ω', pmin:1, pmax:20, pstep:0.5, pdef:4,
    vmin:0, vmax:12, vdef:6, ohmic:false, graphs:['iv','rv'],
    solve:(V, R0) => {                       // R = R0 (1 + α·k·P)
      const alpha = 0.0045, k = 260;
      let R = R0;
      for(let i=0;i<600;i++){
        const P = V*V/R;
        const Rn = R0*(1 + alpha*k*P);
        const d = Rn - R;
        R += 0.25*d;
        if(Math.abs(d) < 1e-12) break;
      }
      return {I: V/R, Vd: V, R};
    }
  },
  diode: {
    label:'Diode (Si)', pname:'Rₚ', pfull:'Protective resistor Rₚ', unit:'Ω', pmin:10, pmax:200, pstep:10, pdef:50,
    vmin:-3, vmax:3, vdef:1.5, ohmic:false, graphs:['iv','rv'],
    /* reverse-biased, R = V/I runs into the gigaohms; anything above this is
       simply off the top of an R-V plot, so those points are not drawn */
    rcap: 5000,
    solve:(V, Rp) => {                       // Shockley + series protection R
      const Is = 1e-9, n = 1.8, Vt = 0.025852;
      const f = vd => Is*(Math.exp(Math.min(vd/(n*Vt), 60)) - 1) - (V - vd)/Rp;
      let lo = -100, hi = Math.max(1, V + 1);
      if(f(lo)*f(hi) > 0) return {I:0, Vd:0, R:Infinity};
      for(let i=0;i<300;i++){
        const mid = 0.5*(lo+hi);
        if(f(lo)*f(mid) <= 0) hi = mid; else lo = mid;
      }
      const vd = 0.5*(lo+hi), I = (V - vd)/Rp;
      return {I, Vd: vd, R: Math.abs(I) > 1e-15 ? vd/I : Infinity};
    }
  },
  thermistor: {
    label:'Thermistor (NTC)', pname:'θ', pfull:'Temperature θ', unit:'°C', pmin:0, pmax:100, pstep:5, pdef:25,
    vmin:0, vmax:12, vdef:6, ohmic:true, graphs:['iv','rt'],
    solve:(V, degC) => {                     // R = R0 exp(B(1/T − 1/T0))
      const R0 = 1000, B = 3200, T0 = 298.15, T = degC + 273.15;
      const R = R0*Math.exp(B*(1/T - 1/T0));
      return {I: V/R, Vd: V, R};
    }
  },
  ldr: {
    /* Light-dependent resistor.  At a FIXED illumination it obeys Ohm's law,
       so its I-V line is straight; what the syllabus cares about is how R
       collapses as the light gets brighter, hence the R-E graph. */
    /* 2-250 lx: dim room to bright desk lamp.  Wider than this and the curve
       spends nearly all its width on the flat bright-end tail. */
    label:'LDR', pname:'E', pfull:'Light intensity E', unit:'lx', pmin:2, pmax:250, pstep:1, pdef:100,
    vmin:0, vmax:12, vdef:6, ohmic:true, graphs:['iv','re'],
    solve:(V, E) => {                        // R = R₀ (E/E₀)^(−γ)
      const R0 = 1000, E0 = 100, gamma = 0.8;
      const R = R0*Math.pow(Math.max(E, 0.05)/E0, -gamma);
      return {I: V/R, Vd: V, R};
    }
  }
};


/* ============================================================
   SYMBOLS — BS 3939 / IEC 60617 (UK IGCSE), drawn procedurally.
   Every symbol lives in a local frame: leads run along the x-axis
   from -HALF to +HALF, y = 0.  HALF = CELL (so total span = 2 cells).
   ============================================================ */
const $ = id => document.getElementById(id);
let CX = null;                      // set by the app once the canvas exists
const HALF = CELL;                  // 40 px each side  -> 80 px span

function css(v){ return getComputedStyle(document.body).getPropertyValue(v).trim(); }

/* pull the whole palette once per frame so themes just work */
let PAL = {};
function readPalette(){
  PAL = {
    bg:css('--bg'), card:css('--card'), border:css('--border'),
    text:css('--text'), dim:css('--text-dim'), muted:css('--text-muted'),
    accent:css('--accent'), glow:css('--accent-glow'), grid:css('--grid'),
    graphbg:css('--graph-bg'), green:css('--green'), rose:css('--rose'),
    violet:css('--violet'), amber:css('--amber'), blue:css('--blue'), orange:css('--orange'),
    wire:css('--wire'), flow:css('--flow')
  };
}

function line(x1,y1,x2,y2){ CX.beginPath(); CX.moveTo(x1,y1); CX.lineTo(x2,y2); CX.stroke(); }
function circle(x,y,r,fill){ CX.beginPath(); CX.arc(x,y,r,0,7); if(fill) CX.fill(); else CX.stroke(); }

/* ---- a glyph that stays upright even when the symbol is rotated ---- */
function glyph(ch, x, y, o, font){
  CX.save(); CX.translate(x, y); CX.rotate(-(o.rot||0));
  CX.font = font; CX.textAlign = 'center'; CX.textBaseline = 'middle';
  CX.fillText(ch, 0, 0); CX.restore(); CX.textBaseline = 'alphabetic';
}

/* ---- one cell pair: long thin (+) then short thick (−) ---- */
function cellPair(x){
  CX.lineWidth = 2.2; line(x-4, -15, x-4, 15);      // long thin  = positive
  CX.lineWidth = 5.5; line(x+4,  -8, x+4,  8);      // short thick = negative
  CX.lineWidth = 2.2;
}

/* ---- the symbol table ---- */
const SYMBOL = {
  cell(o){
    line(-HALF,0,-8,0); line(8,0,HALF,0);
    cellPair(0);
    if(o.labels){ CX.fillStyle = PAL.dim;
      glyph('+', -13, -19, o, '600 11px Inter'); glyph('−', 14, -19, o, '600 11px Inter'); }
  },
  battery(o){
    line(-HALF,0,-20,0); line(20,0,HALF,0);
    cellPair(-12); cellPair(12);
    CX.lineWidth=1.4; CX.setLineDash([3,3]); line(-4,0,4,0); CX.setLineDash([]);
    CX.lineWidth=2.2;
    if(o.labels){ CX.fillStyle=PAL.dim;
      glyph('+',-25,-19,o,'600 11px Inter'); glyph('−',26,-19,o,'600 11px Inter'); }
  },
  supply(o){
    line(-HALF,0,-14,0); line(14,0,HALF,0);
    CX.fillStyle = PAL.bg;
    circle(-12,0,4.5,true); circle(-12,0,4.5,false);
    circle( 12,0,4.5,true); circle( 12,0,4.5,false);
    CX.fillStyle = PAL.text;
    glyph('+', -12, -14, o, '700 12px Inter'); glyph('−', 12, -14, o, '700 12px Inter');
  },
  res(){
    line(-HALF,0,-16,0); line(16,0,HALF,0);
    CX.fillStyle = PAL.bg;
    CX.beginPath(); CX.rect(-16,-8,32,16); CX.fill(); CX.stroke();
  },
  varres(){
    SYMBOL.res();
    CX.lineWidth = 2.2;
    line(-17, 15, 17, -15);                       // diagonal arrow through the box
    CX.beginPath(); CX.moveTo(17,-15); CX.lineTo(10,-11.5); CX.lineTo(13,-7.5);
    CX.closePath(); CX.fillStyle = PAL.text; CX.fill();
  },
  thermistor(){
    SYMBOL.res();
    CX.lineWidth = 2.2;
    CX.beginPath(); CX.moveTo(-19,14); CX.lineTo(-12,14); CX.lineTo(17,-14); CX.stroke();
  },
  ldr(){
    SYMBOL.res();
    CX.lineWidth = 1.8;
    for(const dx of [-9, 2]){
      CX.beginPath(); CX.moveTo(dx-11, -26); CX.lineTo(dx-1, -13); CX.stroke();
      CX.beginPath(); CX.moveTo(dx-1,-13); CX.lineTo(dx-6.5,-14.5); CX.lineTo(dx-4.5,-19.5);
      CX.closePath(); CX.fillStyle = PAL.text; CX.fill();
    }
    CX.lineWidth = 2.2;
  },
  heater(){
    line(-HALF,0,-18,0); line(18,0,HALF,0);
    CX.fillStyle = PAL.bg;
    CX.beginPath(); CX.rect(-18,-9,36,18); CX.fill(); CX.stroke();
    CX.lineWidth = 1.8;
    for(const x of [-9,0,9]) line(x,-9,x,9);
    CX.lineWidth = 2.2;
  },
  fuse(){
    line(-HALF,0,-18,0); line(18,0,HALF,0);
    CX.fillStyle = PAL.bg;
    CX.beginPath(); CX.rect(-18,-7,36,14); CX.fill(); CX.stroke();
    CX.lineWidth = 1.8; line(-18,0,18,0); CX.lineWidth = 2.2;
  },
  lamp(o){
    line(-HALF,0,-13,0); line(13,0,HALF,0);
    if(o.glow > 0.02){                            // filament glow ∝ power
      const g = CX.createRadialGradient(0,0,2,0,0,34);
      const a = Math.min(0.85, 0.18 + o.glow*0.8);
      g.addColorStop(0, 'rgba(255,225,120,'+a+')');
      g.addColorStop(1, 'rgba(255,200,60,0)');
      CX.fillStyle = g; CX.beginPath(); CX.arc(0,0,34,0,7); CX.fill();
    }
    CX.fillStyle = o.glow > 0.02 ? 'rgba(255,232,150,'+Math.min(1,0.25+o.glow)+')' : PAL.bg;
    circle(0,0,13,true); CX.strokeStyle = o.stroke; circle(0,0,13,false);
    const d = 13/Math.SQRT2;
    line(-d,-d,d,d); line(-d,d,d,-d);             // UK lamp = circle with X
  },
  motor(o){ SYMBOL._letter('M', o); },
  ammeter(o){ SYMBOL._letter('A', o); },
  voltmeter(o){ SYMBOL._letter('V', o); },
  _letter(ch, o){
    line(-HALF,0,-13,0); line(13,0,HALF,0);
    CX.fillStyle = PAL.bg; circle(0,0,13,true); circle(0,0,13,false);
    CX.fillStyle = o.stroke; CX.font = '700 15px Inter';
    CX.textAlign='center'; CX.textBaseline='middle';
    CX.save(); CX.translate(0,0); CX.rotate(-o.rot); CX.fillText(ch,0,1); CX.restore();
    CX.textBaseline='alphabetic';
  },
  switch(o){
    line(-HALF,0,-13,0); line(13,0,HALF,0);
    CX.fillStyle = PAL.bg;
    circle(-13,0,3.5,true); circle(-13,0,3.5,false);
    circle( 13,0,3.5,true); circle( 13,0,3.5,false);
    if(o.closed) line(-13,0,13,0);
    else         line(-12,-2,11,-14);
  },
  diode(o){
    line(-HALF,0,-9,0); line(9,0,HALF,0);
    CX.fillStyle = o.stroke;
    CX.beginPath(); CX.moveTo(-9,-10); CX.lineTo(-9,10); CX.lineTo(9,0);
    CX.closePath(); CX.fill();
    CX.lineWidth = 3; line(9,-11,9,11); CX.lineWidth = 2.2;
  }
};

/* ---- draw one symbol at a pixel position ---- */
function drawSymAt(type, x, y, rot, opts){
  const o = Object.assign({stroke:PAL.text, glow:0, closed:true, labels:true, rot:rot}, opts||{});
  CX.save();
  CX.translate(x, y); CX.rotate(rot);
  CX.strokeStyle = o.stroke; CX.fillStyle = o.stroke;
  CX.lineWidth = 2.2; CX.lineCap = 'round'; CX.lineJoin = 'round';
  (SYMBOL[type] || SYMBOL.res)(o);
  CX.restore();
}

/* ---- where a component sits, in logical pixels ---- */
function compGeom(cp){
  const h = cp.o === 'h';
  const x1 = gx(cp.c), y1 = gy(cp.r);
  const x2 = h ? gx(cp.c+SPAN) : x1;
  const y2 = h ? y1 : gy(cp.r+SPAN);
  return {x1,y1,x2,y2, mx:(x1+x2)/2, my:(y1+y2)/2, rot: h ? 0 : Math.PI/2, h};
}

/* ---- number formatting: one function used everywhere ---- */
function fmt(v, unit){
  if(v === undefined || v === null || !isFinite(v)) return '—';
  const a = Math.abs(v);
  let s, u = unit || '';
  if(a === 0)            s = '0';
  else if(a >= 1e6)      { s = (v/1e6).toPrecision(3); u = 'M'+u; }
  else if(a >= 1e3)      { s = (v/1e3).toPrecision(3); u = 'k'+u; }
  else if(a >= 1)        s = v.toPrecision(3);
  else if(a >= 1e-3)     { s = (v*1e3).toPrecision(3); u = 'm'+u; }
  else if(a >= 1e-6)     { s = (v*1e6).toPrecision(3); u = 'µ'+u; }
  else                   return '≈0 ' + u;
  s = String(parseFloat(s));
  return s + (u ? ' ' + u : '');
}
const fmtR = v => (!isFinite(v) ? '∞ Ω' : fmt(v,'Ω'));

/* ============================================================
   APP — state, rendering, interaction, panel
   ============================================================ */
const CV = $('cv');
CX = CV.getContext('2d');            // CX is declared (let) in the symbol module
const GCV = $('gcv'); const GX = GCV.getContext('2d');

const S = {
  mode:'build',                 // build | test | rlab
  tool:'select',                // select | wire | delete
  place:null,                   // component type queued for placing
  ghostO:'h',
  comps:[], wires:[],
  sel:-1, selWire:-1,
  selSet:[], selWireSet:[],     // group selection (Group tool only)
  marquee:null, groupDrag:null,
  wireFrom:null, hoverNode:null, hoverComp:-1,
  drag:null,
  undo:[],
  show:{grid:true, labels:true, values:true},
  flow:'current',               // 'off' | 'current' (conventional, + → −) | 'electrons'
  flowCols:null,                // distinct current magnitude -> palette index
  swHover:null,                 // {i, start} — switch armed by hovering
  zoom:1, tx:0, ty:0,           // view: screen = logical*VX.s + VX.ox
  panDrag:null,
  anim:true, speed:1, t:0,
  res:null,
  panelTab:'comp',
  rowTop:0, rowBot:ROWS,        // grid extent; grows past 0..ROWS when the window is tall
  preset:'series1',
  rlab:{dev:'resistor', p:RLAB.resistor.pdef, V:6, rows:[], sweeping:false, graph:'iv'},
  theme:'dark'
};

/* ---------- canvas transform (letterboxed logical space) ---------- */
let VX = {s:1, ox:0, oy:0};
function resize(){
  const r = CV.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  CV.width = Math.max(1, Math.round(r.width*dpr));
  CV.height= Math.max(1, Math.round(r.height*dpr));
  CV.style.width = r.width+'px'; CV.style.height = r.height+'px';
  /* The logical space stays centred (so nothing already drawn ever moves),
     but the GRID is allowed to grow past row 0 and past row ROWS into whatever
     vertical slack the window leaves.  On a wide window there is no slack and
     nothing changes; on a tall window the dead letterbox bands above and below
     become usable squares instead of wasted canvas. */
  const s = Math.min(r.width/GW, r.height/GH);
  const visH = r.height / s;                   // logical height actually visible
  const slack = Math.max(0, (visH - GH)/2);    // spare logical px on each side
  const extra = Math.max(0, Math.floor((slack - 10)/CELL));
  /* the grid extent is derived from the UNZOOMED fit, so zooming never
     changes how many squares exist — only how much of them you can see */
  S.rowTop = -extra;
  S.rowBot = ROWS + extra;
  VX = {base:{s, ox:(r.width - GW*s)/2, oy:(r.height - GH*s)/2}, dpr,
        top:-slack, visH, s, ox:0, oy:0};
  applyView(r);
  keepInsideGrid();
  draw();
}
/* If the window shrinks, the grid loses rows — nudge the whole circuit back
   inside so nothing can end up clipped where the user cannot reach it. */
function keepInsideGrid(){
  if(!S.comps.length && !S.wires.length) return;
  const rows = S.comps.flatMap(c => termsOf(c).map(t => t.r))
        .concat(S.wires.flatMap(w => [w.r1, w.r2]));
  if(!rows.length) return;
  const lo = Math.min(...rows), hi = Math.max(...rows);
  let dy = 0;
  if(lo < S.rowTop) dy = S.rowTop - lo;
  else if(hi > S.rowBot) dy = S.rowBot - hi;
  if(dy && (hi + dy) <= S.rowBot && (lo + dy) >= S.rowTop) shiftRows(dy);
}
function shiftRows(dy){
  S.comps.forEach(c => c.r += dy);
  S.wires.forEach(w => { w.r1 += dy; w.r2 += dy; });
}
/* A freshly built circuit is anchored a few squares below the TOP of the
   visible grid, so it lands at comfortable eye level instead of drifting
   toward the bottom on a tall window. */
function anchorToTop(){
  /* Not flush against the top edge: take 3/4 of the slack, so a very tall
     window keeps a comfortable margin above the circuit instead of gluing
     it to the border, while a normal window is unaffected. */
  const dy = Math.round(S.rowTop * 0.75);
  if(dy) shiftRows(dy);
}

/* the whole drawable area, in logical px — used for clipping and pan clamping */
function contentBounds(){
  return {x0:0, x1:GW, y0:gy(S.rowTop) - OY, y1:gy(S.rowBot) + OY};
}
/* turns S.zoom / S.tx / S.ty into the concrete canvas transform, clamping the
   pan so the view can never wander off the grid */
function applyView(r){
  if(!VX.base) return;                  // called before the first resize()
  const b = VX.base, k = b.s * S.zoom;
  if(S.zoom === 1){ S.tx = b.ox; S.ty = b.oy; }
  else {
    const c = contentBounds();
    const cw = (c.x1 - c.x0)*k, ch = (c.y1 - c.y0)*k;
    S.tx = (cw <= r.width)  ? (r.width  - cw)/2 - c.x0*k
         : Math.min(-c.x0*k, Math.max(r.width  - c.x1*k, S.tx));
    S.ty = (ch <= r.height) ? (r.height - ch)/2 - c.y0*k
         : Math.min(-c.y0*k, Math.max(r.height - c.y1*k, S.ty));
  }
  VX.s = k; VX.ox = S.tx; VX.oy = S.ty;
  CV.style.cursor = S.zoom > 1 ? (S.panDrag ? 'grabbing' : 'grab') : 'default';
}
function setZoom(z, anchor, screenPt){
  const r = CV.getBoundingClientRect();
  if(!VX.base){ S.zoom = 1; return; }
  S.zoom = z;
  if(z !== 1 && anchor){                 // keep the double-clicked point still
    const k = VX.base.s * z;
    S.tx = screenPt.x - anchor.x*k;
    S.ty = screenPt.y - anchor.y*k;
  }
  applyView(r);
  const c = $('chipZoom');
  c.style.display = (S.zoom > 1 && S.mode !== 'rlab') ? 'block' : 'none';
  c.innerHTML = '🔍 <b>' + S.zoom + '×</b> — drag to pan · double-click to reset';
  draw();
}

function toLogical(ev){
  const r = CV.getBoundingClientRect();
  return {x:(ev.clientX - r.left - VX.ox)/VX.s, y:(ev.clientY - r.top - VX.oy)/VX.s};
}
function nearestNode(p){
  const c = Math.round((p.x - OX)/CELL), r = Math.round((p.y - OY)/CELL);
  if(c < 0 || c > COLS || r < S.rowTop || r > S.rowBot) return null;
  const d = Math.hypot(p.x - gx(c), p.y - gy(r));
  return {c, r, d};
}

/* ---------- undo ---------- */
function snapshot(){
  S.undo.push(JSON.stringify({c:S.comps, w:S.wires}));
  if(S.undo.length > 60) S.undo.shift();
}
function undo(){
  if(!S.undo.length) return;
  const st = JSON.parse(S.undo.pop());
  S.comps = st.c; S.wires = st.w; S.sel = -1; S.selWire = -1;
  clearGroup();
  recompute();
}

/* ---------- naming ---------- */
function autoName(type){
  const pre = CATALOG[type].prefix;
  let n = 1;
  while(S.comps.some(c => c.name === pre + n)) n++;
  return pre + n;
}
function makeComp(type, c, r, o){
  const d = CATALOG[type];
  const cp = {t:type, c, r, o, name:autoName(type)};
  if(d.kind === 'src') cp.V = d.V;
  else if(d.R != null) cp.R = d.R;
  if(d.kind === 'sw') cp.closed = true;
  return cp;
}

/* ---------- flow display ---------- */
const flowOn   = () => S.flow !== 'off';
/* Conventional current runs + → − in the external circuit, which is exactly the
   sign the solver produces (verified: the segment on a battery's + terminal
   carries current away from it).  Electron flow is the same paths reversed. */
const flowSign = () => (S.flow === 'electrons' ? -1 : 1);

/* Each distinct current magnitude in the circuit gets its own colour, so the
   main current and the smaller branch currents are told apart at a glance —
   and two branches carrying the SAME current deliberately share a colour. */
const I_FLOOR = 1e-6;          // 1 µA — below this the circuit is open, not "flowing"
const FLOW_KEY = (m, ref) => Math.round((m/ref)*1000)/1000;
function buildFlowColors(res){
  if(!res || !res.ok){ S.flowCols = null; return; }
  if(res.maxI < I_FLOOR){ S.flowCols = null; return; }   // open circuit
  const ref = Math.max(1e-12, res.maxI);
  const mags = [];
  Object.values(res.wire).forEach(seg => mags.push(Math.abs(seg.I)));
  res.comp.forEach(r => { if(r) mags.push(Math.abs(r.I)); });
  const keys = [...new Set(mags.filter(m => m > Math.max(ref*0.005, I_FLOOR))
                                .map(m => FLOW_KEY(m, ref)))]
                 .sort((a,b) => b - a);
  S.flowCols = {ref, map:new Map(keys.map((k,i) => [k,i])), n:keys.length};
}
function flowPalette(){
  return [PAL.flow, PAL.green, PAL.violet, PAL.orange, PAL.rose, PAL.amber];
}
function flowColor(I){
  if(!S.flowCols) return PAL.flow;
  const i = S.flowCols.map.get(FLOW_KEY(Math.abs(I), S.flowCols.ref));
  const pal = flowPalette();
  return i == null ? PAL.flow : pal[i % pal.length];
}

/* ---------- solve + repaint ---------- */
function recompute(){
  S.res = (S.mode === 'rlab') ? null : solveCircuit(S.comps, S.wires);
  buildFlowColors(S.res);
  updatePanel(); updateSummary(); draw();
}

/* ============================================================
   DRAW
   ============================================================ */
function draw(){
  readPalette();
  const r = CV.getBoundingClientRect();
  CX.setTransform(VX.dpr,0,0,VX.dpr,0,0);
  CX.clearRect(0,0,r.width,r.height);
  CX.fillStyle = PAL.graphbg; CX.fillRect(0,0,r.width,r.height);
  CX.save();
  CX.translate(VX.ox, VX.oy); CX.scale(VX.s, VX.s);
  const cb = contentBounds();
  CX.beginPath(); CX.rect(cb.x0, cb.y0, cb.x1-cb.x0, cb.y1-cb.y0); CX.clip();
  if(S.mode === 'rlab') drawRLab(); else drawSchematic();
  CX.restore();
}

function drawGrid(){
  if(!S.show.grid) return;
  CX.fillStyle = PAL.grid;
  for(let c=0;c<=COLS;c++) for(let r=S.rowTop;r<=S.rowBot;r++){
    CX.beginPath(); CX.arc(gx(c), gy(r), 1.3, 0, 7); CX.fill();
  }
}

function drawSchematic(){
  drawGrid();
  const res = S.res;

  /* --- wires --- */
  CX.lineCap='round'; CX.lineJoin='round';
  S.wires.forEach((w,i)=>{
    const inGrp = S.selWireSet.includes(i);
    CX.strokeStyle = (i === S.selWire || inGrp) ? PAL.accent : PAL.wire;
    CX.lineWidth = (i === S.selWire || inGrp) ? 4 : 2.6;
    CX.beginPath(); CX.moveTo(gx(w.c1), gy(w.r1)); CX.lineTo(gx(w.c2), gy(w.r2)); CX.stroke();
  });

  /* --- current-flow dots --- */
  /* An open circuit carries only numerical dust (~1e-11 A).  Without an
     ABSOLUTE floor the relative threshold would happily animate that dust,
     which is exactly what a student must not see on a broken circuit. */
  if(flowOn() && res && res.ok && !res.shorted && res.maxI >= I_FLOOR){
    const ref = Math.max(1e-9, res.maxI), fs = flowSign();
    const cut = Math.max(ref*0.005, I_FLOOR);
    Object.values(res.wire).forEach(seg=>{
      const I = seg.I; if(Math.abs(I) < cut) return;
      CX.fillStyle = flowColor(I);
      flowDots(gx(seg.p.c), gy(seg.p.r), gx(seg.q.c), gy(seg.q.r), I*fs, ref);
    });
    S.comps.forEach((cp,i)=>{
      const rr = res.comp[i]; if(!rr || Math.abs(rr.I) < cut) return;
      const g = compGeom(cp);
      const [t0] = termsOf(cp);
      const sgn = (t0.c === cp.c && t0.r === cp.r) ? 1 : -1;
      CX.fillStyle = flowColor(rr.I);
      flowDots(g.x1, g.y1, g.x2, g.y2, rr.I*sgn*fs, ref, true);
    });
  }

  /* --- junction dots --- */
  if(res && res.ok){
    CX.fillStyle = PAL.wire;
    res.nets.degree.forEach((deg, k)=>{
      if(deg < 3) return;
      const [c, r] = k.split(',').map(Number);
      CX.beginPath(); CX.arc(gx(c), gy(r), 4.2, 0, 7); CX.fill();
    });
  }

  /* --- components --- */
  S.comps.forEach((cp, i)=>{
    const g = compGeom(cp);
    const rr = res && res.ok ? idealise(cp, res.comp[i]) : null;
    const inGrp = S.selSet.includes(i);
    const sel = (i === S.sel) || inGrp;
    if(sel){
      CX.fillStyle = PAL.glow;
      CX.beginPath(); CX.roundRect(g.mx - (g.h?46:24), g.my - (g.h?24:46),
                                   g.h?92:48, g.h?48:92, 10); CX.fill();
      CX.strokeStyle = PAL.accent; CX.lineWidth = 1.4;
      CX.beginPath(); CX.roundRect(g.mx - (g.h?46:24), g.my - (g.h?24:46),
                                   g.h?92:48, g.h?48:92, 10); CX.stroke();
    }
    let glow = 0;
    if(cp.t === 'lamp' && rr) glow = Math.min(1, Math.abs(rr.P)/3);
    drawSymAt(symbolFor(cp.t), g.mx, g.my, g.rot,
      {stroke: sel ? PAL.accent : PAL.text, glow, closed: cp.closed !== false, rot:g.rot});
    if(cp.flip && CATALOG[cp.t].pol){
      CX.fillStyle = PAL.muted; CX.font = '600 9px JetBrains Mono';
      CX.textAlign = 'center';
      CX.fillText('◄', g.mx + (g.h?0:34), g.my + (g.h?34:0));
    }
    /* labels + live values, always in unrotated screen text */
    const ox = g.h ? 0 : 34, oy = g.h ? -26 : -34;
    CX.textAlign = 'center';
    if(S.show.labels){
      CX.fillStyle = sel ? PAL.accent : PAL.dim;
      CX.font = '600 12px JetBrains Mono';
      CX.fillText(cp.name + valueTag(cp), g.mx + ox, g.my + oy);
    }
    if(S.show.values && rr && res.ok && !res.shorted){
      CX.fillStyle = (flowOn() && res.maxI >= I_FLOOR &&
                      Math.abs(rr.I) > Math.max(res.maxI*0.005, I_FLOOR))
                     ? flowColor(rr.I) : PAL.blue;
      CX.font = '500 11px JetBrains Mono';
      const txt = readoutFor(cp, rr);
      if(txt) CX.fillText(txt, g.mx + (g.h?0:38), g.my + (g.h?26:22));
    }
  });

  /* --- switch hold-to-toggle countdown --- */
  if(S.swHover && S.comps[S.swHover.i]){
    const cp = S.comps[S.swHover.i], g = compGeom(cp);
    const el = (performance.now() - S.swHover.start)/1000;
    const prog = Math.max(0, Math.min(1, el/SW_HOLD));
    const left = Math.max(1, Math.ceil(SW_HOLD - el));
    CX.strokeStyle = PAL.border; CX.lineWidth = 3;
    CX.beginPath(); CX.arc(g.mx, g.my, 24, 0, Math.PI*2); CX.stroke();
    CX.strokeStyle = PAL.accent; CX.lineWidth = 3; CX.lineCap = 'round';
    CX.beginPath(); CX.arc(g.mx, g.my, 24, -Math.PI/2, -Math.PI/2 + prog*Math.PI*2); CX.stroke();
    CX.fillStyle = PAL.accent; CX.font = '800 15px JetBrains Mono';
    CX.textAlign = 'center'; CX.textBaseline = 'middle';
    CX.fillText(String(left), g.mx + 32, g.my - 20);
    CX.textBaseline = 'alphabetic';
  }

  /* --- group selection: bounding box + live marquee --- */
  if(hasGroup()){
    const bb = groupBBox();
    if(bb){
      CX.strokeStyle = PAL.accent; CX.lineWidth = 1.4; CX.setLineDash([7,5]);
      CX.strokeRect(bb.x0-14, bb.y0-14, bb.x1-bb.x0+28, bb.y1-bb.y0+28);
      CX.setLineDash([]);
      /* No caption here: component name labels already occupy the band just
         above a part, and the count + keys are shown in the side panel, the
         summary bar and the corner hint chip. */
    }
  }
  if(S.marquee){
    const m = S.marquee;
    const x = Math.min(m.x0,m.x1), y = Math.min(m.y0,m.y1);
    const w2 = Math.abs(m.x1-m.x0), h2 = Math.abs(m.y1-m.y0);
    CX.fillStyle = PAL.glow; CX.fillRect(x,y,w2,h2);
    CX.strokeStyle = PAL.accent; CX.lineWidth = 1.4; CX.setLineDash([6,4]);
    CX.strokeRect(x,y,w2,h2); CX.setLineDash([]);
  }

  /* --- wire being drawn --- */
  if(S.wireFrom && S.hoverNode){
    CX.strokeStyle = PAL.accent; CX.lineWidth = 2.2; CX.setLineDash([6,5]);
    const path = elbow(S.wireFrom, S.hoverNode);
    CX.beginPath(); CX.moveTo(gx(path[0].c), gy(path[0].r));
    path.slice(1).forEach(p=>CX.lineTo(gx(p.c), gy(p.r)));
    CX.stroke(); CX.setLineDash([]);
  }

  /* --- ghost of the component about to be placed --- */
  if(S.place && S.hoverNode){
    CX.globalAlpha = 0.45;
    const cp = {t:S.place, c:S.hoverNode.c, r:S.hoverNode.r, o:S.ghostO};
    const g = compGeom(cp);
    drawSymAt(symbolFor(S.place), g.mx, g.my, g.rot, {stroke:PAL.accent, rot:g.rot});
    CX.globalAlpha = 1;
  }

  /* --- node highlight --- */
  if(S.hoverNode && (S.tool === 'wire' || S.place)){
    CX.strokeStyle = PAL.accent; CX.lineWidth = 2;
    CX.beginPath(); CX.arc(gx(S.hoverNode.c), gy(S.hoverNode.r), 7, 0, 7); CX.stroke();
  }

  /* --- short-circuit warning --- */
  if(res && res.ok && res.shorted){
    const cb2 = contentBounds(), cy = GH/2;
    CX.fillStyle = 'rgba(220,50,50,0.14)';

    CX.fillText('⚠  SHORT CIRCUIT', GW/2, cy - 8);
    CX.font = '500 15px Inter'; CX.fillStyle = PAL.text;
    CX.fillText('a source is connected by a path with (almost) no resistance', GW/2, cy + 20);
  }
}

function symbolFor(t){
  return ({resistor:'res', varres:'varres', lamp:'lamp', heater:'heater', fuse:'fuse',
           motor:'motor', thermistor:'thermistor', ldr:'ldr', diode:'diode',
           ammeter:'ammeter', voltmeter:'voltmeter', switch:'switch',
           cell:'cell', battery:'battery', supply:'supply'})[t] || 'res';
}
function valueTag(cp){
  const d = CATALOG[cp.t];
  if(d.kind === 'src') return ' ' + fmt(cp.V, 'V');
  if(cp.R != null && d.kind !== 'diode') return ' ' + fmtR(cp.R);
  return '';
}
/* a closed switch really has R_SWON, but IGCSE treats it as a perfect
   conductor — report the idealised numbers so the table reads cleanly. */
function idealise(cp, rr){
  if(!rr) return rr;
  if(CATALOG[cp.t].kind === 'sw' && cp.closed !== false)
    return {V:0, I:rr.I, P:0, R:0, open:false, kind:'sw'};
  return rr;
}
function readoutFor(cp, rr){
  const k = CATALOG[cp.t].kind;
  if(k === 'meterA') return fmt(Math.abs(rr.I), 'A');
  if(k === 'meterV') return fmt(Math.abs(rr.V), 'V');
  if(k === 'sw')     return cp.closed === false ? 'open' : '';
  return fmt(Math.abs(rr.V),'V') + ' · ' + fmt(Math.abs(rr.I),'A');
}

/* moving charge dots along a straight run */
function flowDots(x1,y1,x2,y2,I,ref,thin){
  const L = Math.hypot(x2-x1, y2-y1); if(L < 1) return;
  const ux = (x2-x1)/L, uy = (y2-y1)/L;
  const dir = I >= 0 ? 1 : -1;
  const gap = 26;
  const v = 34 * (0.25 + 0.75*Math.min(1, Math.abs(I)/ref));
  const ph = ((S.t * v * S.speed) % gap + gap) % gap;
  const rr = thin ? 2.2 : 2.8;
  for(let d = ph; d < L; d += gap){
    const t = dir > 0 ? d : L - d;
    CX.beginPath(); CX.arc(x1 + ux*t, y1 + uy*t, rr, 0, 7); CX.fill();
  }
}

/* orthogonal path between two grid nodes (horizontal leg first) */
function elbow(a, b){
  if(a.c === b.c || a.r === b.r) return [a, b];
  return [a, {c:b.c, r:a.r}, b];
}

/* ============================================================
   GRAPH (panel)
   ============================================================ */
/* The graphs the syllabus asks for.  `sweep:'V'` means the supply is turned up
   across its range with the device setting held; `sweep:'P'` means the supply
   is held and the device's own quantity (temperature, illumination) is varied. */
const GKIND = {
  iv:{short:'I–V', title:'I–V GRAPH',                 xl:'V / volt', yl:'I / amp', sweep:'V',
      tip:'Current against p.d. — the standard characteristic curve.'},
  rv:{short:'R–V', title:'R–V GRAPH',                 xl:'V / volt', yl:'R / ohm', sweep:'V',
      tip:'Resistance R = V/I against p.d. Flat means ohmic.'},
  rt:{short:'R–θ', title:'R–TEMPERATURE GRAPH',       xl:'θ / °C',   yl:'R / ohm', sweep:'P',
      tip:'Resistance against temperature — the thermistor curve.'},
  re:{short:'R–E', title:'R–LIGHT INTENSITY GRAPH',   xl:'E / lux',  yl:'R / ohm', sweep:'P',
      tip:'Resistance against light intensity — the LDR curve.'}
};
/* Which graph is on screen.  Self-healing: switching to a device that has no
   R–V graph, say, silently drops back to that device's first graph. */
function rlabGraph(){
  const list = RLAB[S.rlab.dev].graphs || ['iv'];
  if(list.indexOf(S.rlab.graph) < 0) S.rlab.graph = list[0];
  return S.rlab.graph;
}
function sweepSeries(){
  if(S.mode === 'rlab'){
    const dev = RLAB[S.rlab.dev], k = rlabGraph(), g = GKIND[k];
    const cap = dev.rcap || Infinity;
    const keep = y => isFinite(y) && Math.abs(y) <= cap;
    const pts = [], N = 160;
    if(g.sweep === 'V'){
      for(let i=0;i<=N;i++){
        const V = dev.vmin + (dev.vmax - dev.vmin)*i/N;
        const o = dev.solve(V, S.rlab.p);
        const y = (k === 'iv') ? o.I : Math.abs(o.R);
        if(k === 'iv' ? isFinite(y) : keep(y)) pts.push({x:o.Vd, y});
      }
    }else{
      for(let i=0;i<=N;i++){
        const p = dev.pmin + (dev.pmax - dev.pmin)*i/N;
        const o = dev.solve(S.rlab.V, p);
        if(isFinite(o.R)) pts.push({x:p, y:Math.abs(o.R)});
      }
    }
    const rec = S.rlab.rows.map(r =>
        k === 'iv' ? {x:r.V, y:r.I}
      : g.sweep === 'V' ? {x:r.V, y:Math.abs(r.R)}
      : {x:r.p, y:Math.abs(r.R)})
      .filter(p => isFinite(p.x) && isFinite(p.y) && Math.abs(p.y) <= cap);
    return {pts, rec, xl:g.xl, yl:g.yl, title:g.title};
  }
  // Builder / Tester: sweep every source together, track the selected component
  const i = S.sel; if(i < 0 || !S.res || !S.res.ok) return null;
  const srcs = S.comps.map((c,k)=>({c,k})).filter(o => CATALOG[o.c.t].kind === 'src');
  if(!srcs.length) return null;
  const base = srcs.map(o => o.c.V);
  const pts = [];
  for(let n=0;n<=40;n++){
    const f = n/40;
    srcs.forEach((o,j)=>{ o.c.V = base[j]*f; });
    const r = solveCircuit(S.comps, S.wires);
    const rr = r.ok ? r.comp[i] : null;
    if(rr) pts.push({x:Math.abs(rr.V), y:Math.abs(rr.I)});
  }
  srcs.forEach((o,j)=>{ o.c.V = base[j]; });
  const now = S.res.comp[i];
  return {pts, rec:[{x:Math.abs(now.V), y:Math.abs(now.I)}],
          xl:'V / volt', yl:'I / amp', title:'I–V of ' + S.comps[i].name};
}

/* round tick step, so axes read 0 / 0.25 / 0.5 ... instead of 0 / 236m / 471m */
function niceAxis(lo, hi, n){
  if(!(hi > lo)) { hi = lo + 1; }
  const raw = (hi - lo)/n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw/mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10)*mag;
  return {lo: Math.floor(lo/step)*step, hi: Math.ceil(hi/step)*step, step};
}
function tickTxt(v, step){
  if(Math.abs(v) < step*1e-6) return '0';
  /* resistance axes run into the tens of kilohms — "40k" fits the margin,
     "40000" does not */
  if(Math.abs(v) >= 1000) return (v/1000).toFixed(step >= 1000 ? 0 : 1) + 'k';
  const dp = Math.max(0, -Math.floor(Math.log10(step)) + (step < 1 ? 0 : 0));
  return v.toFixed(Math.min(6, dp));
}

function drawGraph(){
  const box = GCV.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const w = Math.max(60, box.width - 2), h = 210;
  GCV.width = w*dpr; GCV.height = h*dpr;
  GCV.style.width = w+'px'; GCV.style.height = h+'px';
  GX.setTransform(dpr,0,0,dpr,0,0);
  GX.clearRect(0,0,w,h);
  GX.fillStyle = PAL.graphbg; GX.fillRect(0,0,w,h);

  const d = sweepSeries();
  const L=44, R=10, T=14, B=28;
  const px = x => L + (x - xmin)/(xmax - xmin || 1)*(w-L-R);
  const py = y => h-B - (y - ymin)/(ymax - ymin || 1)*(h-T-B);
  let xmin=0,xmax=1,ymin=0,ymax=1, ax={lo:0,hi:1,step:0.25}, ay={lo:0,hi:1,step:0.25};
  if(d && d.pts.length){
    const xs = d.pts.map(p=>p.x).concat(d.rec.map(p=>p.x));
    const ys = d.pts.map(p=>p.y).concat(d.rec.map(p=>p.y));
    ax = niceAxis(Math.min(0, ...xs), Math.max(...xs, 1e-12), 4);
    ay = niceAxis(Math.min(0, ...ys), Math.max(...ys, 1e-15), 4);
    xmin = ax.lo; xmax = ax.hi; ymin = ay.lo; ymax = ay.hi;
  }
  const nx = Math.round((ax.hi-ax.lo)/ax.step), ny = Math.round((ay.hi-ay.lo)/ay.step);
  GX.strokeStyle = PAL.grid; GX.lineWidth = 1;
  for(let i=0;i<=ny;i++){ const y = py(ay.lo + i*ay.step);
    GX.beginPath(); GX.moveTo(L,y); GX.lineTo(w-R,y); GX.stroke(); }
  for(let i=0;i<=nx;i++){ const x = px(ax.lo + i*ax.step);
    GX.beginPath(); GX.moveTo(x,T); GX.lineTo(x,h-B); GX.stroke(); }
  GX.strokeStyle = PAL.border; GX.lineWidth = 1.4;
  GX.beginPath(); GX.moveTo(L,T); GX.lineTo(L,h-B); GX.lineTo(w-R,h-B); GX.stroke();
  if(xmin < 0){ GX.strokeStyle = PAL.muted;
    GX.beginPath(); GX.moveTo(px(0),T); GX.lineTo(px(0),h-B); GX.stroke(); }
  if(ymin < 0){ GX.strokeStyle = PAL.muted;
    GX.beginPath(); GX.moveTo(L,py(0)); GX.lineTo(w-R,py(0)); GX.stroke(); }
  GX.fillStyle = PAL.muted; GX.font = '500 9px JetBrains Mono';
  GX.textAlign='right';
  for(let i=0;i<=ny;i++){ const v = ay.lo + i*ay.step;
    GX.fillText(tickTxt(v, ay.step), L-4, py(v)+3); }
  GX.textAlign='center';
  for(let i=0;i<=nx;i++){ const v = ax.lo + i*ax.step;
    GX.fillText(tickTxt(v, ax.step), px(v), h-B+14); }
  GX.fillStyle = PAL.dim; GX.font='600 10px Inter';
  GX.fillText((d && d.xl) || 'V / volt', (L+w-R)/2, h-4);
  GX.save(); GX.translate(11, (T+h-B)/2); GX.rotate(-Math.PI/2);
  GX.fillText((d && d.yl) || 'I / amp', 0, 0); GX.restore();

  if(!d || !d.pts.length){
    GX.fillStyle = PAL.muted; GX.font='500 11px Inter'; GX.textAlign='center';
    GX.fillText(S.mode==='rlab' ? 'no data yet' : 'select a component to plot it',
                (L+w-R)/2, (T+h-B)/2);
    return;
  }
  GX.strokeStyle = PAL.accent; GX.lineWidth = 2;
  GX.beginPath();
  d.pts.forEach((p,i)=> i? GX.lineTo(px(p.x),py(p.y)) : GX.moveTo(px(p.x),py(p.y)));
  GX.stroke();
  GX.fillStyle = PAL.blue;
  d.rec.forEach(p=>{ GX.beginPath(); GX.arc(px(p.x),py(p.y),3.4,0,7); GX.fill(); });
}

   PANEL
   ============================================================ */
function updatePanel(){
  const tab = S.panelTab;
  ['comp','meters','graph','data'].forEach(t=>{
    $('pane-'+t).style.display = (t===tab) ? 'block' : 'none';
    $('ptab-'+t).classList.toggle('active', t===tab);
  });
  if(tab==='comp')   paneComp();
  if(tab==='meters') paneMeters();
  if(tab==='graph'){ renderRlabControls(); renderGraphPick(); drawGraph();
                     $('graphNote').innerHTML = graphNote(); }
  if(tab==='data')   paneData();
}

/* Resistance Lab: the supply and the device setting live at the top of the
   Graph panel — supply on the first row, the device parameter on the second,
   the I–V graph underneath — so the apparatus and its curve are read together. */
function rlabRanges(){
  const d = RLAB[S.rlab.dev];
  return {
    d,
    V:{min:d.vmin, max:d.vmax, step:0.1,     base:d.vmax, unit:'V'},
    P:{min:d.pmin, max:d.pmax, step:d.pstep, base:d.pmax, unit:d.unit}
  };
}
function renderRlabControls(){
  const box = $('rlabCtl'); if(!box) return;
  if(S.mode !== 'rlab'){ box.style.display = 'none'; box.innerHTML = ''; return; }
  const R = rlabRanges();
  box.style.display = 'block';
  box.innerHTML = sectionTitle('🎚','APPARATUS — ' + R.d.label) +
    numSlider('rlSup', 'Supply voltage', S.rlab.V, R.V) +
    numSlider('rlPar', R.d.pfull || R.d.pname, S.rlab.p, R.P);
  bindNumSlider('rlSup', R.V, v => { S.rlab.V = v; });
  bindNumSlider('rlPar', R.P, v => { S.rlab.p = v; });
}

/* Only ONE graph is ever plotted, chosen here — the panel would be unreadable
   with four curves stacked in it.  Which graphs a device offers comes from the
   device itself, so the thermistor and the LDR never show an R–V button. */
function renderGraphPick(){
  const box = $('graphPick'), ttl = $('graphTitle');
  if(!box) return;
  if(S.mode !== 'rlab'){
    box.style.display = 'none'; box.innerHTML = '';
    if(ttl) ttl.textContent = 'I–V GRAPH';
    return;
  }
  const list = RLAB[S.rlab.dev].graphs || ['iv'], k = rlabGraph();
  box.style.display = 'flex';
  box.innerHTML = list.map(g =>
    '<button data-g="'+g+'" class="'+(g === k ? 'on' : '')+'" title="'+
    GKIND[g].tip+'">'+GKIND[g].short+' graph</button>').join('');
  if(ttl) ttl.textContent = GKIND[k].title;
  box.querySelectorAll('button').forEach(b => b.onclick = () => {
    S.rlab.graph = b.dataset.g; updatePanel();
  });
}

function graphNote(){
  if(S.mode === 'rlab'){
    const d = RLAB[S.rlab.dev], k = rlabGraph();
    const lead = 'Gold curve = the device model swept right across its range. ' +
                 'Blue dots = the readings you took with <b>● Point</b> or <b>⟲ Auto-Points</b>. ';
    if(k === 'iv') return lead + (d.ohmic
      ? 'A <b>straight line through the origin</b> means R is constant — the device is <b>ohmic</b>.'
      : 'The line is <b>curved</b>, so R = V/I changes with the operating point — the device is <b>non-ohmic</b>.');
    if(k === 'rv') return lead + (d.ohmic
      ? 'Here R = V/I is plotted against V. The line stays <b>flat</b> — the resistance does not depend on the p.d., which is exactly what <b>ohmic</b> means.'
      : 'Here R = V/I is plotted against V. The line is <b>not flat</b>, so the resistance depends on the operating point — the device is <b>non-ohmic</b>.' +
        (S.rlab.dev === 'lamp'
          ? ' The filament gets hotter as V rises, and a hotter metal has a <b>higher</b> resistance.'
          : ' Reverse-biased, almost no current flows, so R is enormous and runs off the top of the scale; forward-biased past about 0.6 V it drops sharply.'));
    if(k === 'rt') return lead + 'Resistance against temperature for an <b>NTC thermistor</b>: as θ rises, R <b>falls</b> — and it falls fastest at the cold end. This is what makes it useful in a temperature-sensing potential divider.';
    if(k === 're') return lead + 'Resistance against light intensity for an <b>LDR</b>: the brighter the light, the <b>lower</b> the resistance. In the dark it is hundreds of times larger, which is what makes it useful in a light-sensing potential divider.';
  }
  if(S.sel < 0) return 'Select a component on the canvas. The graph then re-solves the whole circuit while every source is turned up from 0 to its set value, and plots I against V for that component.';
  return 'Every source is swept from 0 up to its set value and the circuit re-solved at each step. The blue dot is the present operating point of <b>'+S.comps[S.sel].name+'</b>.';
}

/* ---------- worked solution (Circuit Tester only) ----------
   Rendered with KaTeX when it is available; every line also carries a
   plain-text twin, so an offline classroom sees readable maths rather
   than raw LaTeX. */
const sig = v => (!isFinite(v) ? '∞' : String(+(+v).toPrecision(3)));
function mathLine(tex, plain){
  if(typeof katex !== 'undefined'){
    try { return '<div class="mrow">' +
      katex.renderToString(tex, {throwOnError:false, displayMode:false}) + '</div>'; }
    catch(_){}
  }
  return '<div class="mrow plain">' + plain + '</div>';
}
function workingHTML(){
  const r = S.res;
  if(S.mode !== 'test' || !r || !r.ok || r.shorted) return '';
  const srcs  = S.comps.map((c,i)=>({c,i})).filter(o=>CATALOG[o.c.t].kind==='src');
  const loads = S.comps.map((c,i)=>({c,i}))
                  .filter(o=>CATALOG[o.c.t].kind==='res' || CATALOG[o.c.t].kind==='diode');
  if(!srcs.length || !loads.length) return '';
  const emf = srcs.reduce((a,o)=>a+Math.abs(o.c.V),0);
  const It  = Math.abs(r.comp[srcs[0].i].I);
  if(!(It > I_FLOOR)) return '';
  const Rt  = emf/It;                       // same value the panel shows

  const allSeries   = loads.every(o => Math.abs(Math.abs(r.comp[o.i].I) - It) < It*1e-3);
  const allParallel = loads.length > 1 &&
        loads.every(o => Math.abs(Math.abs(r.comp[o.i].V) - emf) < Math.max(1e-6, emf*1e-3));
  const sub = n => '\\mathrm{' + String(n).replace(/([A-Za-z]+)(\d*)/, '$1$2') + '}';

  let h = '<div class="ptitle sub"><span>&#129518;</span>WORKING</div>';

  /* ---- e.m.f. ---- */
  if(srcs.length > 1){
    h += mathLine(
      '\\mathcal{E} = ' + srcs.map(o=>'\\mathcal{E}_{'+sub(o.c.name)+'}').join(' + ') +
      ' = ' + srcs.map(o=>sig(Math.abs(o.c.V))).join(' + ') + ' = ' + sig(emf) + '\\ \\mathrm{V}',
      'E = ' + srcs.map(o=>'E('+o.c.name+')').join(' + ') + ' = ' +
      srcs.map(o=>sig(Math.abs(o.c.V))).join(' + ') + ' = ' + sig(emf) + ' V');
  } else {
    h += mathLine('\\mathcal{E} = ' + sig(emf) + '\\ \\mathrm{V}', 'E = ' + sig(emf) + ' V');
  }

  /* ---- total resistance: formula, then substitution, then result ---- */
  if(allSeries && loads.length > 1){
    h += mathLine(
      'R_{\\text{total}} = ' + loads.map(o=>'R_{'+sub(o.c.name)+'}').join(' + ') +
      ' = ' + loads.map(o=>sig(o.c.R)).join(' + ') + ' = ' + sig(Rt) + '\\ \\Omega',
      'R total = ' + loads.map(o=>'R('+o.c.name+')').join(' + ') + ' = ' +
      loads.map(o=>sig(o.c.R)).join(' + ') + ' = ' + sig(Rt) + ' Ω');
  } else if(allParallel){
    h += mathLine(
      '\\frac{1}{R_{\\text{total}}} = ' +
      loads.map(o=>'\\frac{1}{R_{'+sub(o.c.name)+'}}').join(' + ') + ' = ' +
      loads.map(o=>'\\frac{1}{'+sig(o.c.R)+'}').join(' + ') +
      ' \\;\\Rightarrow\\; R_{\\text{total}} = ' + sig(Rt) + '\\ \\Omega',
      '1/R total = ' + loads.map(o=>'1/R('+o.c.name+')').join(' + ') + ' = ' +
      loads.map(o=>'1/'+sig(o.c.R)).join(' + ') + '  =>  R total = ' + sig(Rt) + ' Ω');
  }

  /* ---- current, then the total resistance if it could not be built up ---- */
  if(allSeries || allParallel){
    h += mathLine(
      'I = \\frac{\\mathcal{E}}{R_{\\text{total}}} = \\frac{' + sig(emf) + '}{' + sig(Rt) +
      '} = ' + sig(It) + '\\ \\mathrm{A}',
      'I = E / R total = ' + sig(emf) + ' / ' + sig(Rt) + ' = ' + sig(It) + ' A');
  } else {
    h += mathLine('I = ' + sig(It) + '\\ \\mathrm{A}\\quad\\text{(from the circuit)}',
                  'I = ' + sig(It) + ' A  (from the circuit)');
    h += mathLine(
      'R_{\\text{total}} = \\frac{\\mathcal{E}}{I} = \\frac{' + sig(emf) + '}{' + sig(It) +
      '} = ' + sig(Rt) + '\\ \\Omega',
      'R total = E / I = ' + sig(emf) + ' / ' + sig(It) + ' = ' + sig(Rt) + ' Ω');
  }

  /* ---- exactly two resistors in SERIES = potential divider: the V rule ---- */
  if(allSeries && loads.length === 2){
    const [x, y] = loads, sum = x.c.R + y.c.R;
    [x, y].forEach(o => {
      h += mathLine(
        'V_{' + sub(o.c.name) + '} = \\mathcal{E}\\times\\frac{R_{' + sub(o.c.name) + '}}{R_{' +
        sub(x.c.name) + '}+R_{' + sub(y.c.name) + '}} = ' + sig(emf) + '\\times\\frac{' +
        sig(o.c.R) + '}{' + sig(sum) + '} = ' + sig(emf*o.c.R/sum) + '\\ \\mathrm{V}',
        'V(' + o.c.name + ') = E × R(' + o.c.name + ') / (R(' + x.c.name + ') + R(' + y.c.name +
        ')) = ' + sig(emf) + ' × ' + sig(o.c.R) + ' / ' + sig(sum) + ' = ' + sig(emf*o.c.R/sum) + ' V');
    });
  }
  /* ---- exactly two resistors in PARALLEL = current divider: the I rule ----
     each branch is weighted by the OTHER branch's resistance, so the larger
     resistor takes the smaller share of the current                          */
  if(allParallel && loads.length === 2){
    const [x, y] = loads, sum = x.c.R + y.c.R;
    [[x, y], [y, x]].forEach(([o, other]) => {
      h += mathLine(
        'I_{' + sub(o.c.name) + '} = I\\times\\frac{R_{' + sub(other.c.name) + '}}{R_{' +
        sub(x.c.name) + '}+R_{' + sub(y.c.name) + '}} = ' + sig(It) + '\\times\\frac{' +
        sig(other.c.R) + '}{' + sig(sum) + '} = ' + sig(It*other.c.R/sum) + '\\ \\mathrm{A}',
        'I(' + o.c.name + ') = I × R(' + other.c.name + ') / (R(' + x.c.name + ') + R(' + y.c.name +
        ')) = ' + sig(It) + ' × ' + sig(other.c.R) + ' / ' + sig(sum) + ' = ' + sig(It*other.c.R/sum) + ' A');
    });
  }

  /* ---- power ---- */
  h += mathLine(
    'P = \\mathcal{E} I = ' + sig(emf) + ' \\times ' + sig(It) + ' = ' + sig(emf*It) + '\\ \\mathrm{W}',
    'P = E I = ' + sig(emf) + ' × ' + sig(It) + ' = ' + sig(emf*It) + ' W');

  return '<div class="working" id="wcWork">' + h + '</div>';
}

function circuitTotals(){
  const r = S.res;
  if(!r || !r.ok) return '';
  const srcs = S.comps.map((c,i)=>({c,i})).filter(o=>CATALOG[o.c.t].kind==='src');
  if(!srcs.length) return '<div class="note">Add a cell, battery or supply to drive the circuit.</div>';
  const emf = srcs.reduce((a,o)=>a+Math.abs(o.c.V),0);
  const It  = Math.abs(r.comp[srcs[0].i].I);
  /* total resistance is TOTAL e.m.f. / current — dividing by one cell's p.d.
     under-reports it whenever several sources are stacked in series */
  const Rt  = It > 1e-9 ? emf/It : Infinity;
  return sectionTitle('Σ','WHOLE CIRCUIT') +
    '<div class="kv"><span>Total e.m.f.</span><b id="wcE">'+fmt(emf,'V')+'</b></div>' +
    '<div class="kv"><span>Current from source</span><b class="v-blue" id="wcI">'+fmt(It,'A')+'</b></div>' +
    '<div class="kv"><span>Total resistance</span><b class="v-violet" id="wcR">'+fmtR(Rt)+'</b></div>' +
    '<div class="kv"><span>Power delivered</span><b class="v-amber" id="wcP">'+fmt(emf*It,'W')+'</b></div>' +
    workingHTML();
}
