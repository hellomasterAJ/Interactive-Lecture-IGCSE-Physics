/* ═══════════════ shell ═══════════════ */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  height:100vh;overflow:hidden;padding:8px 12px;display:flex;flex-direction:column;
  align-items:center;transition:background .3s,color .3s}
.container{max-width:1920px;width:100%;height:100%;display:flex;flex-direction:column;min-height:0}
.top-bar{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:6px;flex-wrap:wrap;gap:8px;flex:0 0 auto}
.top-bar h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge-top{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 8px;
  border-radius:12px;background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent)}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode-tabs{display:flex;gap:4px;background:var(--card);border-radius:8px;padding:3px;border:1px solid var(--border)}
.mode-tab{padding:5px 12px;border-radius:6px;border:none;font-family:'JetBrains Mono',monospace;
  font-size:10px;cursor:pointer;transition:all .2s;background:transparent;color:var(--text-dim)}
.mode-tab:hover{color:var(--text)}
.mode-tab.active{background:var(--accent-glow);color:var(--accent)}
.theme-select{background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:4px 10px;border-radius:8px;cursor:pointer;font-family:'JetBrains Mono',monospace;
  font-size:11px;outline:none;min-width:110px}
.brand{background:#F4C01E;border-radius:10px;padding:7px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);
  display:flex;align-items:center}
.brand img{height:31px;width:auto;display:block}
@media(max-width:640px){.brand{display:none}}
/* ═══════════════ mode tabs + pills ═══════════════ */
.gtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:0 0 auto;margin-bottom:5px}
.tab{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--card);
  color:var(--text-dim);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .18s}
.tab:hover{color:var(--text);border-color:var(--text-muted)}
.tab.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:0 0 auto;margin-bottom:5px}
.sub{display:flex;gap:5px;flex-wrap:nowrap;justify-content:center;height:23px}
.pill{padding:0 9px;height:23px;border-radius:7px;border:1px solid var(--border);background:var(--card2);
  color:var(--text-dim);font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;
  display:inline-flex;align-items:center;justify-content:center;line-height:1}
.pill:hover{color:var(--text)}
.pill.active{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
@media(max-width:1340px){.pill{font-size:9.5px;padding:0 7px}}
@media(max-width:1180px){.pill{font-size:9px;padding:0 5px}}
/* ═══════════════ toolbar ═══════════════ */
.tools{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.trow{display:flex;gap:7px;align-items:center;flex-wrap:nowrap;overflow:hidden;height:31px}
.tgroup{display:flex;gap:4px;align-items:center;background:var(--card);border:1px solid var(--border);
  border-radius:9px;padding:0 7px;height:31px}
.tgroup label{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);
  font-weight:700;margin-right:2px;white-space:nowrap}
/* a fixed button height: an emoji glyph is taller than Latin text and would
   otherwise raise the whole toolbar row by 1px, moving the canvas          */
.btn{padding:0 9px;height:23px;border-radius:6px;border:1px solid var(--border);background:var(--card2);
  color:var(--text-dim);font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;
  display:inline-flex;align-items:center;justify-content:center;line-height:1}
.btn:hover{color:var(--text)}
.btn.on{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.btn.wide{display:inline-grid;align-items:center;justify-items:center}
.btn.wide>span{grid-area:1/1;visibility:hidden}
.btn.wide>span.on{visibility:visible}
input[type=range]{width:96px;height:23px;accent-color:var(--accent);cursor:pointer;margin:0}
.val{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);min-width:48px;text-align:right}
/* the slider and the typed box live in ONE fixed-width slot, so clicking the
   label to swap between them can never change the width of the toolbar      */
.sslot{width:148px;height:23px;display:flex;align-items:center;gap:4px;flex:0 0 148px}
.sslot input[type=range]{width:96px;flex:0 0 96px}
.sslot .val{flex:1 1 auto}
.sslot input.num{width:96px;flex:0 0 96px;height:23px;box-sizing:border-box;background:var(--card2);
  border:1px solid var(--accent);border-radius:6px;color:var(--accent);font-size:11px;
  font-family:'JetBrains Mono',monospace;text-align:right;padding:0 6px;outline:none;margin:0}
.sslot input.num::-webkit-outer-spin-button,.sslot input.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tgroup label.tap{cursor:pointer;border-bottom:1px dashed var(--text-muted);padding-bottom:1px}
.tgroup label.tap:hover{color:var(--accent);border-bottom-color:var(--accent)}
.tgroup label.tap.on{color:var(--accent);border-bottom-style:solid;border-bottom-color:var(--accent)}
.spacer{flex:1 1 auto}
/* ═══════════════ main split 70/30 ═══════════════ */
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:8px}
.cvwrap{position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
canvas#cv{width:100%;height:100%;display:block;cursor:default}
canvas#cv.zoomed{cursor:grab}
canvas#cv.grabbing{cursor:grabbing}
.hud{position:absolute;left:12px;bottom:10px;font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--accent);background:var(--card2);border:1px solid var(--accent);border-radius:7px;padding:3px 8px}
.hud.hide{display:none}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;
  flex-direction:column;min-height:0;overflow:hidden}
.ptabs{display:flex;gap:3px;padding:6px 6px 0;flex:0 0 auto}
.ptab{flex:1;padding:6px 4px;border-radius:7px 7px 0 0;border:none;background:transparent;
  color:var(--text-muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.ptab:hover{color:var(--text)}
.ptab.active{background:var(--card2);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.pbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px 16px}
.pbody::-webkit-scrollbar{width:8px}
.pbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
/* ═══════════════ panel content ═══════════════ */
.dt{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:11.5px}
.dt td{padding:4px 2px;border-bottom:1px solid var(--border)}
.dt td:last-child{text-align:right;color:var(--accent);font-weight:600}
.pg{width:100%;height:150px;display:block;margin-top:10px;border:1px solid var(--border);
  border-radius:8px;background:var(--graph-bg)}
.note{background:var(--card2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:7px 10px;margin:7px 0;font-size:11.5px;color:var(--text-dim);line-height:1.5}
ol.steps{margin:6px 0 6px 18px;font-size:11.5px;color:var(--text-dim);line-height:1.55}
ol.steps li{margin-bottom:6px}
.katex{font-size:1em!important}
.eq{background:var(--graph-bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  margin:8px 0;text-align:center;overflow-x:auto}
/* symbol key + equations in the Data tab */
.keyrow{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--border)}
.keyrow .ks{font-family:KaTeX_Math,'Times New Roman',serif;font-style:italic;font-size:14px;
  color:var(--accent);min-width:34px;font-weight:600}
.keyrow .kd{font-size:11px;color:var(--text-dim);line-height:1.45}
/* a section whose "symbols" are words, not letters: give the key column
   room so the two columns can never run into each other                  */
.keyrow.word .ks{font-family:Inter,sans-serif;font-style:normal;font-size:11px;font-weight:700;
  min-width:96px;flex:0 0 96px}
.eqbox{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:8px 10px 9px;margin-bottom:8px}
.eqbox .ek{overflow-x:auto;padding:3px 0 5px;text-align:center;color:var(--text)}
.eqbox .en{font-size:11px;font-weight:700;color:var(--text-dim)}
.eqbox .es{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--accent);margin-top:4px;word-break:break-word}
.eqbox .ew{font-size:10.5px;color:var(--text-muted);margin-top:3px;line-height:1.45}
h4.ph{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);margin:12px 0 5px}
.psec:first-child>h4.ph{margin-top:0}
.psec>h4.ph{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  padding:3px 4px;margin-left:-4px;margin-right:-4px;border-radius:6px}
.psec>h4.ph:hover{color:var(--accent);background:var(--card2)}
.psec>h4.ph .car{font-size:9px;line-height:1;opacity:.8;transition:transform .15s ease}
.psec.closed>h4.ph{color:var(--text-dim)}
.psec.closed>h4.ph .car{transform:rotate(-90deg)}
.psec.closed>.pbd{display:none}
/* practice + quiz */
.task{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.task .q{font-size:12.3px;color:var(--text);margin-bottom:7px;line-height:1.5}
.task.done{border-color:var(--green)}
.opt{display:block;width:100%;text-align:left;padding:6px 9px;margin:4px 0;border-radius:7px;
  border:1px solid var(--border);background:var(--card);color:var(--text-dim);font-size:11.5px;cursor:pointer}
.opt:hover{color:var(--text);border-color:var(--text-muted)}
.opt.right{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.08)}
.opt.wrong{border-color:var(--rose);color:var(--rose);background:rgba(251,113,133,.08)}
.why{font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.5}
.cbtn{padding:5px 11px;border-radius:7px;border:1px solid var(--accent);background:var(--accent-glow);
  color:var(--accent);font-size:11px;font-weight:600;cursor:pointer}
.stars{font-size:15px;color:var(--amber);letter-spacing:2px}
/* bottom bar */
.bottom{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
  margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);gap:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.dotk{width:9px;height:9px;border-radius:50%;display:inline-block}
</style>
</head>

<script>

/* ═════════════════════ Molecular Models — core ═════════════════════ */
'use strict';
function $(id) { return document.getElementById(id); }
var W = 1200, H = 675;                        /* the fixed logical canvas   */
var CV, CX, VT = { s: 1, ox: 0, oy: 0, dpr: 1 };
var C = {}, LIGHT = false;
var THEME_KEYS = ['bg', 'card', 'card2', 'border', 'text', 'text-dim', 'text-muted', 'accent',
  'accent-glow', 'grid', 'graph-bg', 'green', 'rose', 'violet', 'amber', 'blue', 'orange', 'red',
  'ink', 'sky', 'white-surf', 'black-surf', 'p-cold', 'p-warm', 'p-hot', 'bond', 'wall', 'piston',
  'metal', 'metal-dk', 'shiny', 'glass', 'glass-edge', 'ice', 'water', 'water-edge', 'steam',
  'flame', 'spark', 'ember', 'earth', 'air', 'fire', 'elem-edge', 'brass', 'lens', 'beam', 'dna',
  'tick', 'gauge', 'merc', 'scent'];
function readTheme() {
  var cs = getComputedStyle(document.documentElement);
  THEME_KEYS.forEach(function (k) { C[k] = cs.getPropertyValue('--' + k).trim(); });
  LIGHT = ['light', 'haus', 'clay'].indexOf(document.documentElement.getAttribute('data-theme') || 'dark') >= 0;
}
/* ---------- small maths / colour helpers ---------- */
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function fmt(v, d) { if (!isFinite(v)) return '—'; return v.toFixed(d == null ? 1 : d); }
function hash(i, j) { var x = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return x - Math.floor(x); }
function rgbOf(col) {
  col = (col || '#888').trim();
  if (col[0] === '#') {
    var h = col.slice(1);
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  var m = col.match(/[\d.]+/g);
  return m ? [+m[0], +m[1], +m[2]] : [136, 136, 136];
}
function withA(col, a) { var r = rgbOf(col); return 'rgba(' + r[0] + ',' + r[1] + ',' + r[2] + ',' + a + ')'; }
function mixCol(c1, c2, t) {
  var a = rgbOf(c1), b = rgbOf(c2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' +
    Math.round(a[2] + (b[2] - a[2]) * t) + ')';
}
/* the one particle-speed colour ramp: cold blue → warm yellow → hot red     */
function pcol(u, a) {
  u = clamp(u, 0, 1);
  var col = u < 1 / 3 ? mixCol(C['p-cold'], C.sky, u * 3)
    : u < 2 / 3 ? mixCol(C.sky, C['p-warm'], (u - 1 / 3) * 3)
      : mixCol(C['p-warm'], C['p-hot'], (u - 2 / 3) * 3);
  return a == null ? col : withA(col, a);
}
function pink(u) { return clamp(u, 0, 1) > .4 ? C['black-surf'] : C['white-surf']; }

/* ═════════════════════ state ═════════════════════ */
var S = {
  md: 1, ex: { 1: 'states', 2: 'motion', 3: 'press' }, view: 'sim',
  play: true, speed: 1, t: 0, ended: false,
  zoom: 1, panX: 0, panY: 0, panning: false, px: 0, py: 0,
  v: {}, probe: {}, cardPos: {}, tab: 'data', sec: {},
  prac: {}, quiz: {}, drag: null
};
window.S = S;
function cur() { return SCEN[S.md][S.ex[S.md]]; }
function V(key, sc) {
  sc = sc || cur(); var bag = S.v[sc.key];
  if (bag && bag[key] !== undefined) return bag[key];
  return ctlDef(sc, key);
}
function setV(key, val, sc) { sc = sc || cur(); if (!S.v[sc.key]) S.v[sc.key] = {}; S.v[sc.key][key] = val; }
function ctlDef(sc, key) {
  var c = sc.ctrl || [];
  for (var i = 0; i < c.length; i++) if (c[i].key === key) return c[i].def;
  return undefined;
}
function resetScene(sc) { sc = sc || cur(); delete S.v[sc.key]; S.probe[sc.key] = null; S.t = 0; S.ended = false; }
function PB(sc) { if (!S.probe[sc.key]) S.probe[sc.key] = {}; return S.probe[sc.key]; }
function sceneTick(sc, fn) { var pb = PB(sc); if (pb._dt > 0) fn(pb._dt); }

/* ═════════════════════ scene registry ═════════════════════ */
var SCEN = { 1: {}, 2: {}, 3: {} }, SCEN_ORDER = { 1: [], 2: [], 3: [] };
function scene(md, key, o) { o.key = md + ':' + key; o.md = md; SCEN[md][key] = o; SCEN_ORDER[md].push(key); }

/* ═════════════════════ canvas transform · zoom · pan ═════════════════════ */
function resize() {
  var r = $('cvwrap').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  CV.width = Math.round(r.width * dpr); CV.height = Math.round(r.height * dpr);
  VT.s = Math.min(r.width / W, r.height / H);
  VT.ox = (r.width - W * VT.s) / 2;
  /* the scene sits at the TOP of the box, not floating in the middle of it:
     keep at most ~33 logical px of blank above the title band              */
  VT.oy = Math.min((r.height - H * VT.s) / 2, 33 * VT.s);
  VT.dpr = dpr;
}
function applyVT() {
  CX.setTransform(VT.dpr, 0, 0, VT.dpr, 0, 0);
  CX.translate(VT.ox, VT.oy); CX.scale(VT.s, VT.s);
  CX.translate(S.panX, S.panY); CX.scale(S.zoom, S.zoom);
}
/* screen → logical, inverting letterbox THEN magnifier                      */
function toLogical(ev) {
  var r = CV.getBoundingClientRect();
  var x = (ev.clientX - r.left - VT.ox) / VT.s, y = (ev.clientY - r.top - VT.oy) / VT.s;
  return { x: (x - S.panX) / S.zoom, y: (y - S.panY) / S.zoom };
}
function clampPan() {
  var lo = W * (1 - S.zoom), lo2 = H * (1 - S.zoom);
  S.panX = clamp(S.panX, lo, 0); S.panY = clamp(S.panY, lo2, 0);
}
function setZoom(z, at) {
  if (z === S.zoom) return;
  if (z === 2 && at) { S.panX = S.panX + S.zoom * at.x - z * at.x; S.panY = S.panY + S.zoom * at.y - z * at.y; }
  else { S.panX = 0; S.panY = 0; }
  S.zoom = z; clampPan(); syncZoomUI();
}
function syncZoomUI() {
  $('hud').classList.toggle('hide', S.zoom === 1);
  CV.classList.toggle('zoomed', S.zoom === 2);
}

/* ═════════════════════ drawing helpers ═════════════════════ */
function rr(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  CX.beginPath(); CX.moveTo(x + r, y); CX.arcTo(x + w, y, x + w, y + h, r);
  CX.arcTo(x + w, y + h, x, y + h, r); CX.arcTo(x, y + h, x, y, r); CX.arcTo(x, y, x + w, y, r); CX.closePath();
}
function fillRR(x, y, w, h, r, col, edge, lw) {
  CX.save(); rr(x, y, w, h, r);
  if (col) { CX.fillStyle = col; CX.fill(); }
  if (edge) { CX.strokeStyle = edge; CX.lineWidth = lw || 1.4; CX.stroke(); }
  CX.restore();
}
/* MODE 2 is read at the back of a classroom more than the others, so every
   label it draws on the canvas is set one notch larger                     */
var FSC = 1;
function fs(size) { return Math.round(size * FSC * 10) / 10; }
function txt(str, x, y, size, col, align, weight, font) {
  size = fs(size);
  CX.save(); CX.font = (weight || 600) + ' ' + size + 'px ' + (font || 'Inter, sans-serif');
  CX.fillStyle = col || C.text; CX.textAlign = align || 'left'; CX.textBaseline = 'alphabetic';
  CX.fillText(str, x, y); CX.restore();
}
function mtxt(str, x, y, size, col, align, weight) {
  size = fs(size);
  CX.save(); CX.font = (weight || 500) + ' ' + size + 'px "JetBrains Mono", monospace';
  CX.fillStyle = col || C.text; CX.textAlign = align || 'left'; CX.textBaseline = 'alphabetic';
  CX.fillText(str, x, y); CX.restore();
}
function textW(str, size, weight, font) {
  size = fs(size);
  CX.save(); CX.font = (weight || 600) + ' ' + size + 'px ' + (font || 'Inter, sans-serif');
  var w = CX.measureText(str).width; CX.restore(); return w;
}
function line(x1, y1, x2, y2, col, w, dash) {
  CX.save(); CX.strokeStyle = col || C.text; CX.lineWidth = w || 1.4; CX.lineCap = 'round';
  if (dash) CX.setLineDash(dash);
  CX.beginPath(); CX.moveTo(x1, y1); CX.lineTo(x2, y2); CX.stroke(); CX.restore();
}
function dot(x, y, r, col, edge, lw) {
  CX.save(); CX.beginPath(); CX.arc(x, y, Math.max(0, r), 0, 7); CX.fillStyle = col; CX.fill();
  if (edge) { CX.strokeStyle = edge; CX.lineWidth = lw || 1.1; CX.stroke(); }
  CX.restore();
}

/* 1821 — hot junction in the furnace, cold junction in melting ice, and

/* 1871 — a platinum resistance probe, cut away ───────────────────────── */
function drawResistance(x, y, w, h, theta) {

}
/* 1960s — an infrared gun reading a glowing hotplate ─────────────────── */
function drawInfrared(x, y, w, h, theta) {

  CX.strokeStyle = C.wall; CX.lineWidth = 3; CX.stroke(); CX.restore();

/* Boyle's own J-tube: air trapped in the short sealed arm, mercury poured
   into the long open arm. One source of physics: p1V1 = p2V2.           */
var BOY = { P0: 100, V0: 20, mmHg: 1.333 };        /* kPa · arbitrary cm³ · kPa per cm Hg */
function boyleAt(hcm) {
  var P = BOY.P0 + hcm * BOY.mmHg;
  return { P: P, V: BOY.P0 * BOY.V0 / P, h: hcm };
}

  var sc = cur(), rows = sc.data ? sc.data() : [];
  return '<table class="dt"><tbody>' + rows.map(function (r) {
    return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
  }).join('') + '</tbody></table>';
}
function renderPanel() {
  var b = $('pBody'), sc = cur();
  [].forEach.call($('pTabs').children, function (t) {
    t.classList.toggle('active', t.dataset.tab === S.tab);
    t.style.opacity = S.view === 'sim' ? '1' : '.35';
    t.style.pointerEvents = S.view === 'sim' ? 'auto' : 'none';
  });
  if (S.view === 'prac') { b.innerHTML = practiceHTML(); return; }
  if (S.view === 'quiz') { b.innerHTML = quizHTML(); return; }
  if (S.tab === 'data') {
    b.innerHTML = symsHTML() + psec('live', 'Live values', '<div id="dataRows">' + dataRowsHTML() + '</div>') +
      (sc.dataGraph ? psec('graph', 'Graph', sc.dataGraph()) : '') + eqsHTML();
  } else if (S.tab === 'info') {
    b.innerHTML = psec('info', sc.title.replace(/^[^—]*—\s*/, ''), sc.info ? sc.info() : '');
  } else {
    b.innerHTML = psec('ans', 'Worked answer', sc.ans || '<div class="note">No worked answer for this example yet.</div>');
  }
}
var _live = 0;
function patchLive(force) {
  if (S.view !== 'sim') return;
  if (S.tab === 'data') {
    var d = $('dataRows'); if (d) d.innerHTML = dataRowsHTML();
    var e = $('eqRows'), sc2 = cur();
    if (e && sc2.eqs) e.innerHTML = eqRowsHTML(sc2.eqs());
    for (var id in GFN) if (GFN.hasOwnProperty(id)) redrawG(id);
  }
  if (force) renderPanel();
}
/* ── the canvas frame: title band, scene, hints ─────────────────────────── */
var ZHINT = ['🔍 double-click the canvas = zoom ×2 · again = back to 1×',
  '🖐️ at ×2, hold and drag anywhere to pan'];
function draw() {
  if (!CX) return;
  var sc = cur();
  FSC = sc.md === 2 ? 1.12 : 1;      /* mode 2 is set one notch larger */
  PLATES = []; DCARDS = [];
  CX.setTransform(1, 0, 0, 1, 0, 0);
  CX.clearRect(0, 0, CV.width, CV.height);
  applyVT();
  CX.save();
  txt(sc.title, 26, 32, 15.5, C.text, 'left', 800);
  txt(sc.sub, 30 + textW(sc.title, 15.5, 800), 32, 11.5, C['text-muted'], 'left', 500);
  try { sc.draw(); } catch (e) {
    txt('drawing error: ' + e.message, 26, 80, 13, C.rose, 'left', 700);
    if (window.console) console.error(e);
  }
  CX.restore();
  /* the hint chip, bottom-right, one idea per line                         */
  /* at most two scene hints, so the chip stays 4 lines and can never
     reach up into the lower draggable card                            */
  var parts = (sc.hint || '').split(' · ').slice(0, 2).concat(ZHINT);
  CX.save();
  var wmax = 0; parts.forEach(function (p) { wmax = Math.max(wmax, textW(p, 10.5, 500, '"JetBrains Mono", monospace')); });
  var hy = H - 12 - parts.length * 15;
  fillRR(W - wmax - 40, hy - 6, wmax + 28, parts.length * 15 + 14, 8, withA(C.card, .9), withA(C.border, .8), 1);
  parts.forEach(function (p, i) { mtxt(p, W - 26, hy + 10 + i * 15, 10, C['text-muted'], 'right', 500); });
  CX.restore();
}
/* ── events ────────────────────────────────────────────────────────────── */
function bind() {
  [].forEach.call($('gTabs').children, function (t) {
    t.onclick = function () {
      S.md = +t.dataset.md; S.t = 0;
      [].forEach.call($('gTabs').children, function (x) { x.classList.toggle('active', x === t); });
      buildPills(); buildRow1(); renderPanel();
    };
  });
  [].forEach.call($('viewTabs').children, function (t) {
    t.onclick = function () {
      S.view = t.dataset.view;
      [].forEach.call($('viewTabs').children, function (x) { x.classList.toggle('active', x === t); });
      renderPanel();
    };
  });
  [].forEach.call($('pTabs').children, function (t) {
    t.onclick = function () { S.tab = t.dataset.tab; renderPanel(); };
  });
  $('themeSel').onchange = function () {
    document.documentElement.setAttribute('data-theme', this.value);
    readTheme(); renderPanel();
  };
  $('bPlay').onclick = function () {
    S.play = !S.play;
    [].forEach.call($('bPlay').children, function (s) { s.classList.toggle('on', s.dataset.pp === (S.play ? 'pause' : 'play')); });
    $('bPlay').classList.toggle('on', S.play);
  };
  [].forEach.call(document.querySelectorAll('[data-sp]'), function (b) {
    b.onclick = function () {
      S.speed = +b.dataset.sp;
      [].forEach.call(document.querySelectorAll('[data-sp]'), function (x) { x.classList.toggle('on', x === b); });
    };
  });
  $('bReset').onclick = function () {
    var sc = cur(); resetScene(sc); S.cardPos = {}; buildRow1(); renderPanel();
  };
  var cv = $('cv');
  cv.addEventListener('pointerdown', function (e) {
    var p = toLogical(e), sc = cur();
    var d = dcardAt(p);
    if (d) { S.drag = { card: d, dx: p.x - d.x, dy: p.y - d.y }; cv.setPointerCapture(e.pointerId); return; }
    if (sc.click && sc.click(p)) { buildRow1(); renderPanel(); return; }
    if (S.zoom === 2) { S.panning = true; S.px = e.clientX; S.py = e.clientY; cv.classList.add('grabbing'); cv.setPointerCapture(e.pointerId); }
  });
  cv.addEventListener('pointermove', function (e) {
    if (S.drag && S.drag.card) {
      var p = toLogical(e), d = S.drag.card;
      S.cardPos[d.key] = { x: clamp(p.x - S.drag.dx, 0, W - d.w), y: clamp(p.y - S.drag.dy, 0, H - d.h) };
      return;
    }
    if (S.panning) {
      S.panX += (e.clientX - S.px) / VT.s; S.panY += (e.clientY - S.py) / VT.s;
      S.px = e.clientX; S.py = e.clientY; clampPan();
    }
  });
  function endDrag() { S.drag = null; S.panning = false; cv.classList.remove('grabbing'); }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('dblclick', function (e) {
    var p = toLogical(e), d = dcardAt(p);
    if (d) { delete S.cardPos[d.key]; return; }
    setZoom(S.zoom === 1 ? 2 : 1, p);
  });
  window.addEventListener('resize', function () { resize(); });
  window.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].indexOf(tag) >= 0) return;
    if (e.code === 'Space') { e.preventDefault(); $('bPlay').click(); }
  });
}
/* ── the bottom legend ─────────────────────────────────────────────────── */
function legend() {
  $('legend').innerHTML =
    '<span><span class="dotk" style="background:var(--p-cold)"></span>slow / cold</span>' +
    '<span><span class="dotk" style="background:var(--p-warm)"></span>warmer</span>' +
    '<span><span class="dotk" style="background:var(--p-hot)"></span>hottest</span>' +
    '<span><span class="dotk" style="background:var(--tick)"></span>wall collision</span>' +
    '<span><span class="dotk" style="background:var(--violet)"></span>change of state</span>';
}
/* ── main loop ─────────────────────────────────────────────────────────── */
var _last = 0;
function frame(now) {
  var dt = (now - _last) / 1000; _last = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  var d = S.play ? dt * S.speed : 0;
  S.t += d;
  PB(cur())._dt = d;
  draw();
  _live += dt;
  if (_live > .28) { _live = 0; patchLive(); }
  requestAnimationFrame(frame);
}
function boot() {
  CV = $('cv'); CX = CV.getContext('2d');
  readTheme(); resize(); legend(); buildPills(); buildRow1(); renderPanel(); bind(); syncZoomUI();
  requestAnimationFrame(function (t) { _last = t; requestAnimationFrame(frame); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
