/* ============================================================
   SECTION 2 — ELECTROMAGNETS
   Straight wire, flat coil, solenoid, and a relay that really works.
   ============================================================ */

const EL = {
  cy:322, benchY:H - 54,
  box:{x0:26, y0:66, x1:W-26, y1:H-94},
  wireX:600, wireY:300, wireR:16,          // straight wire, seen end-on, on the canvas midline
  coilX:520, coilY:308, coilR:78,          // flat coil, seen edge-on
  solX:520, solY:308, solR:66, solLen:250  // solenoid, seen from the side
};

/* --- the conductors on the bench, as the model sees them --- */
function elWires(){
  if(S.emode === 'wire')
    return [{x:EL.wireX, y:EL.wireY, I:S.eI, s:S.eDir}];
  if(S.emode === 'coil')
    return [{x:EL.coilX, y:EL.coilY - EL.coilR, I:S.eI, s: S.eDir},
            {x:EL.coilX, y:EL.coilY + EL.coilR, I:S.eI, s:-S.eDir}];
  if(S.emode === 'relay')
    return solenoidWires(relaySolenoid());
  return solenoidWires(elSolenoid());
}
const elSolenoid = () => ({x:EL.solX, y:EL.solY, len:EL.solLen, r:EL.solR,
                           turns:S.turns, I:S.eI, dir:S.eDir, core:S.core});
const RL = {coilX:318, coilY:250, coilR:40, coilLen:132,
            pivotX:432, pivotY:196, armLen:150, contactX:556, contactY:216};
const relaySolenoid = () => ({x:RL.coilX, y:RL.coilY, len:RL.coilLen, r:RL.coilR,
                              turns:7, I:S.relaySw ? S.relayI*6 : 0, dir:1, core:true});

function elField(x, y){ return wiresFieldAt(x, y, elWires()); }

/* ---------- field lines ---------- */
let E_CACHE = {sig:'', lines:[]};
function elSig(){
  return [S.emode, S.eshow, S.eDir, (S.eI*10)|0, S.turns, S.core?1:0,
          S.relaySw?1:0, (S.relayI*20)|0].join('~');
}
function elLines(){
  const F = (x, y) => elField(x, y), out = [];
  if(S.emode === 'wire'){
    /* the field of a long straight wire is EXACTLY a set of concentric
       circles, so they are drawn as circles rather than traced — no
       integration drift, and it is the picture the syllabus asks for */
    return [];
  }
  /* Each sub-mode gets its OWN trace box.  Given a whole-canvas box the
     outer return loops of a solenoid sprawl right across the picture and
     read as stray scribble rather than as field; boxing them keeps the
     loops around the apparatus they belong to. */
  const g = S.emode === 'relay' ? relaySolenoid()
          : S.emode === 'coil' ? {x:EL.coilX, y:EL.coilY, r:EL.coilR*0.72}
          : elSolenoid();
  const pad = S.emode === 'relay' ? 165 : 215;
  const box = {x0:Math.max(EL.box.x0, g.x - (g.len || 0)/2 - pad),
               x1:Math.min(EL.box.x1, g.x + (g.len || 0)/2 + pad),
               y0:Math.max(EL.box.y0, g.y - g.r - pad*0.80),
               y1:Math.min(EL.box.y1, g.y + g.r + pad*0.80)};
  const n = 7;
  for(let i = 0; i < n; i++){
    const y = g.y - g.r*0.80 + (i/(n-1))*g.r*1.60;
    out.push(traceField(F, g.x, y, +1, box, {step:6, maxN:900}));
  }
  return out;
}
function rebuildEl(){
  const sig = elSig();
  if(sig === E_CACHE.sig) return;
  E_CACHE.sig = sig;
  E_CACHE.lines = elLines();
}

function stepElectro(dt){
  rebuildEl();
  if(S.emode === 'relay'){
    const want = (S.relaySw && relayClosed(S.relayI)) ? 1 : 0;
    const before = S.relayArm;
    S.relayArm += (want - S.relayArm)*Math.min(1, 13*dt);
    if(before < 0.5 && S.relayArm >= 0.5) { clunk(); S.relayClick = 0.5; }
    if(before > 0.5 && S.relayArm <= 0.5) { thunk(); S.relayClick = 0.35; }
    S.relayClick = Math.max(0, S.relayClick - dt*2);
  }
  stepCompass(dt, elField);
}

/* ---------- draw ---------- */
function drawElectro(){
  rebuildEl();
  benchLine(EL.benchY);
  if(S.emode === 'wire')          drawStraightWire();
  else if(S.emode === 'coil')     drawFlatCoil();
  else if(S.emode === 'solenoid') drawSolenoid();
  else                            drawRelay();
  if(S.emode !== 'relay' && !(S.emode === 'wire' && S.wireView === 'side')) drawCompass();
}

/* ---------------- straight wire ---------------- */
function drawStraightWire(){
  if(S.wireView === 'side'){ drawWireSide(); return; }
  FILING_REF = Math.max(0.004, S.eI/90);
  const cx = EL.wireX, cy = EL.wireY, dir = S.eDir;

  /* the card the wire is pushed through, so the plane of the picture is real */
  CX.save(); CX.globalAlpha = .30; CX.fillStyle = PAL.card;
  rr(cx - 330, cy - 222, 660, 444, 10); CX.fill(); CX.restore();
  CX.strokeStyle = PAL.border; CX.lineWidth = 1.4;
  rr(cx - 330, cy - 222, 660, 444, 10); CX.stroke();
  if(S.show.labels)
    txt('card, seen face-on — the wire passes straight through it',
        cx, cy - 236, {size:11, col:PAL.muted, weight:600});

  if(S.eshow === 'filings'){
    drawFilings({x0:cx-326, y0:cy-218, x1:cx+326, y1:cy+218}, elField, 900, 12);
  }else{
    /* exact concentric circles, spaced so they crowd near the wire the way
       the real field does (B ∝ 1/r, so equal flux means r grows) */
    CX.strokeStyle = PAL.line; CX.lineWidth = 1.9;
    for(const r of wireRingRadii()){          // shared with the side view
      CX.beginPath(); CX.arc(cx, cy, r, 0, TAU); CX.stroke();
      /* arrowheads: anticlockwise for current out of the page */
      for(const a of [-Math.PI/2, 0, Math.PI/2, Math.PI]){
        const p = {x:cx + r*Math.cos(a), y:cy + r*Math.sin(a)};
        const da = dir > 0 ? -0.09 : 0.09;
        const q = {x:cx + r*Math.cos(a + da), y:cy + r*Math.sin(a + da)};
        headAt(p, q, PAL.line, 8);
      }
    }
  }

  /* eight plotting compasses laid round the wire — the classic experiment */
  for(let i = 0; i < 8; i++){
    const a = i*TAU/8, r = 138;
    const px = cx + r*Math.cos(a), py = cy + r*Math.sin(a);
    const b = elField(px, py);
    compassGlyph(px, py, 17, Math.atan2(b.y, b.x));
  }

  /* the wire itself */
  currentDot(cx, cy, EL.wireR, dir);
  /* the current label goes on a leader out to the empty bottom-left of the
     card, so it can never sit on the field circles or on the grip overlay */
  if(S.show.labels)
    leader(cx - 218, cy + 186, cx - 13, cy + 13,
           dir > 0 ? 'current OUT of the page' : 'current INTO the page', 'center');

  if(S.grip) drawGripWire(cx, cy, dir);

  if(S.show.labels)
    keyStrip(40, EL.benchY + 20, [
      {t:'conventional current', c:PAL.cur},
      {t:S.eshow === 'filings' ? 'iron filings' : 'magnetic field line',
       c:S.eshow === 'filings' ? PAL.filing : PAL.line},
      {t:'plotting compass', c:PAL.metal}
    ]);

  const B = wireB_SI(S.eI, 138);
  setChips(
    '⚡ Straight wire · <b>I = ' + S.eI.toFixed(1) + ' A</b>',
    'B at the compasses: <b>' + fmtB(B) + '</b>',
    '<b>Right-hand grip rule:</b> thumb along the conventional current, fingers curl the way the field goes.<br>' +
    'The circles are <b>closer together near the wire</b> — that is where the field is strongest.<br>' +
    'Reverse the current and every compass swings right round.',
    S.eI === 0 ? 'No current → no magnetic field at all' : '');
}
function drawGripWire(cx, cy, dir){
  const r = 82;
  CX.save();
  CX.globalAlpha = .95;
  CX.strokeStyle = PAL.green; CX.lineWidth = 5; CX.lineCap = 'round';
  const a0 = -1.15, a1 = a0 + (dir > 0 ? -3.9 : 3.9);
  CX.beginPath(); CX.arc(cx, cy, r, a0, a1, dir > 0); CX.stroke();
  const p = {x:cx + r*Math.cos(a1), y:cy + r*Math.sin(a1)};
  const q = {x:cx + r*Math.cos(a1 + (dir > 0 ? -0.14 : 0.14)),
             y:cy + r*Math.sin(a1 + (dir > 0 ? -0.14 : 0.14))};
  headAt(p, q, PAL.green, 15);
  CX.restore();
  txt('fingers curl → field', cx + 128, cy - 104, {size:12, col:PAL.green, weight:700, plate:true});
  arrow(cx + 186, cy + 122, cx + 26, cy + 26, {col:PAL.green, lw:2.4, head:10});
  txt('thumb → current', cx + 194, cy + 126,
      {size:12, col:PAL.green, weight:700, align:'left', plate:true});
}

/* ---------------- straight wire, SIDE view ----------------
   The end-on view shows the field lines face-on as concentric circles, which
   is the right picture for reading the grip rule off.  What it cannot show is
   WHERE those circles are: a student who has only ever seen them face-on
   often thinks the field runs along the wire.  This view puts the wire in the
   plane of the page and draws the SAME circles seen edge-on.

   Two things make it read as three-dimensional rather than as a pile of
   ovals.

   * ONE source of radii.  The rings here are the very same circles the
     end-on view draws — same count, same distances from the wire — so a
     student switching between the two views is looking at one object from
     two directions, not at two different diagrams.
   * DEPTH ORDER.  Each ring is cut in half: the half nearer the viewer is
     drawn OVER the wire and the half behind it is drawn UNDER, so the wire
     passes through every ring instead of sitting on top of all of them.
     Without that the drawing is flat however good the perspective is.
   ------------------------------------------------------------------ */
const SW = {x:600, yTop:112, yBot:548, planeY:342, ry:0.30};

/* the shared ring radii — read by BOTH views, so they cannot drift apart */
function wireRingRadii(){
  const out = [];
  for(let i = 1; i <= 6; i++){
    const r = 30*Math.pow(1.45, i - 1);
    if(r > 214) break;
    out.push(r);
  }
  return out;
}

function drawWireSide(){
  const dir = S.eDir;                       // +1 = current UP the page
  const cx = SW.x, cy = SW.planeY;
  const rings = wireRingRadii();

  /* one arrowhead, placed at a parametric angle on a ring.  For current UP
     the page the grip rule makes the field run anticlockwise seen from
     above, so the NEAR edge of every ring travels to the right. */
  const headOn = (rx, ry, t, col, sz) => {
    const px = cx + rx*Math.cos(t), py = cy + ry*Math.sin(t);
    const tx = dir*rx*Math.sin(t), ty = -dir*ry*Math.cos(t);
    const m = Math.hypot(tx, ty) || 1;
    headAt({x:px - tx/m*11, y:py - ty/m*11}, {x:px, y:py}, col, sz || 9);
  };
  const halfRing = (rx, ry, far) => {
    CX.strokeStyle = PAL.line;
    CX.lineWidth = far ? 1.6 : 2.2;
    CX.globalAlpha = far ? 0.55 : 1;
    CX.beginPath();
    CX.ellipse(cx, cy, rx, ry, 0, far ? Math.PI : 0, far ? TAU : Math.PI);
    CX.stroke();
    CX.globalAlpha = 1;
  };

  /* --- 1. every FAR half, behind the wire --- */
  rings.forEach((r, i) => {
    halfRing(r, r*SW.ry, true);
    if(i % 2 === 1){ CX.globalAlpha = 0.65; headOn(r, r*SW.ry, Math.PI*1.5, PAL.line); CX.globalAlpha = 1; }
  });

  /* --- 2. the wire --- */
  CX.strokeStyle = 'rgba(0,0,0,.6)'; CX.lineWidth = 11; CX.lineCap = 'butt';
  line(cx, SW.yTop, cx, SW.yBot);
  CX.strokeStyle = PAL.wire; CX.lineWidth = 3.4;
  line(cx - 3.5, SW.yTop, cx - 3.5, SW.yBot);
  line(cx + 3.5, SW.yTop, cx + 3.5, SW.yBot);

  /* --- 3. every NEAR half, in front of the wire --- */
  rings.forEach((r, i) => {
    halfRing(r, r*SW.ry, false);
    if(i % 2 === 1) headOn(r, r*SW.ry, Math.PI*0.5, PAL.line);
  });

  /* the current, drawn beside the wire and never on top of it */
  const ax = cx + 62;
  if(dir > 0) arrow(ax, SW.yTop + 116, ax, SW.yTop + 20, {col:PAL.cur, lw:4, head:15});
  else        arrow(ax, SW.yTop + 20, ax, SW.yTop + 116, {col:PAL.cur, lw:4, head:15});
  txt('I', ax + 24, SW.yTop + 62, {size:19, col:PAL.cur, weight:800});
  if(S.show.labels){
    txt('current', ax + 24, SW.yTop + 84, {size:11, col:PAL.cur, weight:600});
    txt('B', cx - rings[rings.length-1] - 34, cy - 26,
        {size:19, col:PAL.line, weight:800});
    txt('the same ' + rings.length + ' circles as the end-on view, seen edge-on —',
        cx, SW.yBot + 26, {size:12, col:PAL.dim, weight:600});
    txt('they lie in the plane at RIGHT ANGLES to the wire', cx, SW.yBot + 44,
        {size:12, col:PAL.dim, weight:600});
  }

  if(S.grip) drawGripSide(cx, cy, dir);

  if(S.show.labels)
    keyStrip(40, EL.benchY + 20, [
      {t:'conventional current', c:PAL.cur},
      {t:'magnetic field line', c:PAL.line},
      {t:'wire', c:PAL.wire}
    ]);

  const B = wireB_SI(S.eI, rings[rings.length-1]);
  setChips(
    '⚡ Straight wire · <b>side view</b> · I = ' + S.eI.toFixed(1) + ' A',
    'Current runs <b>' + (dir > 0 ? 'up' : 'down') + '</b> the wire',
    'Seen from the side, the circles are <b>edge-on</b> — so they look like flat ovals.<br>' +
    'The near half of each one passes <b>in front of</b> the wire and the far half ' +
    '<b>behind</b> it.<br>Switch to <b>⊙ End-on</b> to see the very same circles face-on.',
    S.eI === 0 ? 'No current → no magnetic field at all' : '');
}

/* ONE ring for the grip rule, with the same depth order as the field rings,
   and the hand named in full: the LEFT hand would give the opposite
   direction, so "grip rule" on its own is not enough to act on. */
function drawGripSide(cx, cy, dir){
  const rx = 248, ry = rx*SW.ry;
  const head = (t, sz) => {
    const px = cx + rx*Math.cos(t), py = cy + ry*Math.sin(t);
    const tx = dir*rx*Math.sin(t), ty = -dir*ry*Math.cos(t);
    const m = Math.hypot(tx, ty) || 1;
    headAt({x:px - tx/m*18, y:py - ty/m*18}, {x:px, y:py}, PAL.green, sz);
  };
  CX.strokeStyle = PAL.green; CX.lineCap = 'round';
  /* far half first, then the near half over the wire */
  CX.globalAlpha = .55; CX.lineWidth = 3.6;
  CX.beginPath(); CX.ellipse(cx, cy, rx, ry, 0, Math.PI, TAU); CX.stroke();
  CX.globalAlpha = 1; head(Math.PI*1.5, 15);
  CX.lineWidth = 5;
  CX.beginPath(); CX.ellipse(cx, cy, rx, ry, 0, 0, Math.PI); CX.stroke();
  head(Math.PI*0.5, 17);

  txt('RIGHT-hand grip rule', cx, cy + ry + 30,
      {size:14, col:PAL.green, weight:800, plate:true});
  txt('your LEFT hand would give the opposite way round', cx, cy + ry + 50,
      {size:10.5, col:PAL.muted, weight:600, plate:true});
  txt('fingers curl → field', cx + rx + 16, cy,
      {size:12, col:PAL.green, weight:700, align:'left', plate:true});
  const gy = dir > 0 ? SW.yTop + 150 : SW.yBot - 150;
  arrow(cx - 150, gy, cx - 18, gy + (dir > 0 ? -30 : 30),
        {col:PAL.green, lw:3, head:12});
  txt('thumb → current', cx - 158, gy,
      {size:12, col:PAL.green, weight:700, align:'right', plate:true});
}

/* ---------------- flat coil ---------------- */
function drawFlatCoil(){
  FILING_REF = Math.max(0.004, S.eI*0.032);
  const cx = EL.coilX, cy = EL.coilY, R = EL.coilR;

  if(S.eshow === 'filings') drawFilings(EL.box, elField, 780, 12);
  else paintLines(E_CACHE.lines, PAL.line, 4);

  /* the loop, seen edge-on: one wire cross-section at the top, one below */
  currentDot(cx, cy - R, 15, S.eDir);
  currentDot(cx, cy + R, 15, -S.eDir);
  /* the returning half of the loop, drawn faintly behind */
  CX.save(); CX.globalAlpha = .34;
  CX.strokeStyle = PAL.wire; CX.lineWidth = 7; CX.setLineDash([7, 6]);
  CX.beginPath(); CX.ellipse(cx, cy, 34, R, 0, 0, TAU); CX.stroke();
  CX.setLineDash([]); CX.restore();

  /* the field down the axis: the two halves ADD in the middle */
  const b = elField(cx, cy);
  arrow(cx - 46, cy, cx + 46, cy, {col:PAL.green, lw:3, head:12});
  if(S.show.labels){
    txt('the two sides add up here', cx, cy + 26, {size:11.5, col:PAL.green, weight:700, plate:true});
    leader(cx - 168, cy - R - 42, cx - 13, cy - R, 'current out of the page', 'center');
    leader(cx - 168, cy + R + 42, cx - 13, cy + R, 'current into the page', 'center');
    keyStrip(40, EL.benchY + 20, [
      {t:'conventional current', c:PAL.cur},
      {t:'magnetic field line', c:PAL.line},
      {t:'field through the centre', c:PAL.green}
    ]);
  }
  setChips(
    '⚡ Flat coil · <b>I = ' + S.eI.toFixed(1) + ' A</b>',
    'Field at the centre: <b>' + (S.eDir > 0 ? 'to the right' : 'to the left') + '</b>',
    'A single turn is just a wire <b>bent into a circle</b>. Its two sides carry current in ' +
    'opposite directions, so their circular fields <b>reinforce down the middle</b> and ' +
    'partly cancel outside.<br>Stack many such turns and you have a solenoid.',
    S.eI === 0 ? 'No current → no magnetic field at all' : '');
}

/* ---------------- solenoid ---------------- */
function drawSolenoid(){
  FILING_REF = Math.max(0.01, S.eI*0.14*(S.turns/9));
  const so = elSolenoid();
  const x0 = so.x - so.len/2, x1 = so.x + so.len/2;

  if(S.eshow === 'filings') drawFilings(EL.box, elField, 820, 12);
  else paintLines(E_CACHE.lines, PAL.line, 4);

  /* soft-iron core, drawn BEHIND the winding */
  if(S.core){
    CX.save();
    CX.shadowColor = 'rgba(0,0,0,.35)'; CX.shadowBlur = 8; CX.shadowOffsetY = 3;
    CX.fillStyle = metalGrad(x0 - 40, so.y - 26, so.len + 80, 52, PAL.iron);
    rr(x0 - 40, so.y - 26, so.len + 80, 52, 6); CX.fill();
    CX.restore();
    CX.strokeStyle = 'rgba(0,0,0,.4)'; CX.lineWidth = 1.4;
    rr(x0 - 40, so.y - 26, so.len + 80, 52, 6); CX.stroke();
    if(S.show.labels)
      leader(x0 - 128, so.y + 74, x0 - 30, so.y + 18, 'soft-iron core', 'center');
  }

  /* the winding: one ellipse per turn, the half nearer the viewer bright,
     the half behind it dim, so it reads as a coiled spring */
  const step = so.turns > 1 ? so.len/(so.turns - 1) : 0;
  for(let i = 0; i < so.turns; i++){
    const x = so.turns > 1 ? x0 + i*step : so.x;
    CX.save(); CX.globalAlpha = .30;
    CX.strokeStyle = PAL.wire; CX.lineWidth = 6.5; CX.lineCap = 'round';
    CX.beginPath(); CX.ellipse(x, so.y, 13, so.r, 0, -Math.PI/2, Math.PI/2, true); CX.stroke();
    CX.restore();
    CX.strokeStyle = 'rgba(0,0,0,.30)'; CX.lineWidth = 9.5; CX.lineCap = 'round';
    CX.beginPath(); CX.ellipse(x, so.y, 13, so.r, 0, -Math.PI/2, Math.PI/2, false); CX.stroke();
    CX.strokeStyle = PAL.wire; CX.lineWidth = 7.5;
    CX.beginPath(); CX.ellipse(x, so.y, 13, so.r, 0, -Math.PI/2, Math.PI/2, false); CX.stroke();
  }
  /* current direction markers on the top and bottom of the winding */
  for(let i = 0; i < so.turns; i += Math.max(1, Math.round(so.turns/5))){
    const x = so.turns > 1 ? x0 + i*step : so.x;
    currentDot(x, so.y - so.r, 9, so.dir);
    currentDot(x, so.y + so.r, 9, -so.dir);
  }

  /* supply */
  drawSupply(so.x, EL.benchY - 46, so.len, x0, x1, so.y + so.r + 6);

  /* the poles, straight from the grip rule */
  const nRight = solenoidNorthIsRight(so);
  if(S.eI > 0){
    const lbl = (x, s) => {
      txt(s, x, so.y - so.r - 44, {size:26, weight:800, plate:true,
                                   col:s === 'N' ? PAL.N : PAL.Sp});
      txt(s === 'N' ? 'north pole' : 'south pole', x, so.y - so.r - 20,
          {size:10.5, weight:600, col:PAL.muted, plate:true});
    };
    lbl(x1 + 54, nRight ? 'N' : 'S');
    lbl(x0 - 54, nRight ? 'S' : 'N');
  }

  if(S.grip) drawGripSolenoid(so, nRight);

  if(S.show.labels)
    keyStrip(40, EL.benchY + 20, [
      {t:'conventional current', c:PAL.cur},
      {t:S.eshow === 'filings' ? 'iron filings' : 'magnetic field line',
       c:S.eshow === 'filings' ? PAL.filing : PAL.line},
      {t:'north pole', c:PAL.N}, {t:'south pole', c:PAL.Sp}
    ]);

  const B = solenoidB_SI(so);
  setChips(
    '⚡ Solenoid · <b>' + so.turns + ' turns · ' + S.eI.toFixed(1) + ' A</b>' +
    (S.core ? ' · iron core' : ''),
    'B inside ≈ <b>' + fmtB(B) + '</b>',
    'The field inside is <b>strong and uniform</b>; outside it looks exactly like a bar magnet.<br>' +
    'Make it stronger with <b>more turns</b>, <b>more current</b>, or a <b>soft-iron core</b>.<br>' +
    'Reverse the current and the two poles swap over.',
    S.eI === 0 ? 'No current → no magnetic field at all' : '');
}
function drawSupply(cx, y, len, x0, x1, yTop){
  CX.strokeStyle = PAL.wire; CX.lineWidth = 4; CX.lineCap = 'round';
  CX.beginPath();
  CX.moveTo(x0, yTop); CX.lineTo(x0, y); CX.lineTo(cx - 34, y);
  CX.moveTo(cx + 34, y); CX.lineTo(x1, y); CX.lineTo(x1, yTop);
  CX.stroke();
  cellSym(cx, y, 26, S.eDir < 0);
  if(S.show.labels)
    txt('d.c. supply', cx, y + 26, {size:11, col:PAL.muted, weight:600});
}
/* A fixed reference card in the bottom-left corner rather than a badge
   floating beside the coil: it can never land on a field line, and it says
   in words which end of the solenoid it is describing. */
function drawGripSolenoid(so, nRight){
  const cx = 172, cy = 500, w = 268, h = 172, r = 40;
  CX.fillStyle = PAL.card; CX.strokeStyle = PAL.green; CX.lineWidth = 2;
  rr(cx - w/2, cy - h/2, w, h, 12); CX.fill(); CX.stroke();
  txt('Right-hand grip rule', cx, cy - h/2 + 18, {size:12.5, col:PAL.green, weight:800});
  const ex = cx - 62, ey = cy + 8;
  CX.strokeStyle = PAL.cur; CX.lineWidth = 5; CX.lineCap = 'round';
  CX.beginPath(); CX.arc(ex, ey, r, -0.5, -0.5 - 4.6, true); CX.stroke();
  const a1 = -0.5 - 4.6;
  headAt({x:ex + r*Math.cos(a1 + 0.16), y:ey + r*Math.sin(a1 + 0.16)},
         {x:ex + r*Math.cos(a1), y:ey + r*Math.sin(a1)}, PAL.cur, 13);
  txt('N', ex, ey, {size:24, weight:800, col:PAL.N});
  txt('Look at the', cx + 52, cy - 20, {size:11, col:PAL.dim, weight:600});
  txt((nRight ? 'RIGHT' : 'LEFT') + '-hand end:', cx + 52, cy - 5,
      {size:11.5, col:PAL.accent, weight:800});
  txt('the current runs', cx + 52, cy + 16, {size:11, col:PAL.dim, weight:600});
  txt('a N ticlockwise,', cx + 52, cy + 31, {size:11.5, col:PAL.green, weight:800});
  txt('so it is the N pole.', cx + 52, cy + 46, {size:11, col:PAL.dim, weight:600});
  txt('Clock S wise would be S.', cx, cy + h/2 - 14,
      {size:10.5, col:PAL.muted, weight:600});
}

/* ---------------- relay ---------------- */
function drawRelay(){
  FILING_REF = 0.4;
  const on = S.relayArm > 0.5;
  const armA = -0.30 + 0.30*S.relayArm;         // pivot angle, radians

  /* ---- input (control) circuit, drawn on the left ---- */
  const so = relaySolenoid();
  CX.save(); CX.globalAlpha = S.relaySw ? .95 : .25;
  if(S.relaySw && S.relayI > 0.02) paintLines(E_CACHE.lines, PAL.line, 3);
  CX.restore();

  /* core + winding */
  CX.fillStyle = metalGrad(so.x - so.len/2 - 16, so.y - 20, so.len + 32, 40, PAL.iron);
  rr(so.x - so.len/2 - 16, so.y - 20, so.len + 32, 40, 5); CX.fill();
  CX.strokeStyle = 'rgba(0,0,0,.4)'; CX.lineWidth = 1.3;
  rr(so.x - so.len/2 - 16, so.y - 20, so.len + 32, 40, 5); CX.stroke();
  const stp = so.len/(so.turns - 1);
  for(let i = 0; i < so.turns; i++){
    const x = so.x - so.len/2 + i*stp;
    CX.save(); CX.globalAlpha = .34; CX.strokeStyle = PAL.wire; CX.lineWidth = 6;
    CX.beginPath(); CX.ellipse(x, so.y, 9, so.r, 0, -Math.PI/2, Math.PI/2, true); CX.stroke();
    CX.restore();
    CX.strokeStyle = PAL.wire; CX.lineWidth = 7; CX.lineCap = 'round';
    CX.beginPath(); CX.ellipse(x, so.y, 9, so.r, 0, -Math.PI/2, Math.PI/2, false); CX.stroke();
  }
  if(S.show.labels) leader(so.x, so.y + so.r + 34, so.x, so.y + so.r, 'electromagnet', 'center');

  /* control circuit: cell and switch */
  const cy2 = EL.benchY - 40;
  CX.strokeStyle = PAL.wire; CX.lineWidth = 4; CX.lineCap = 'round';
  /* Each break in the rail is exactly the width of the part that fills it.
     A wire that stops 20 px short of a cell draws an open circuit, which is
     the opposite of what the picture is meant to say. */
  const CELL_HALF = 8;
  CX.beginPath();
  CX.moveTo(so.x - so.len/2 - 16, so.y); CX.lineTo(140, so.y); CX.lineTo(140, cy2);
  CX.lineTo(238 - CELL_HALF, cy2);
  CX.moveTo(238 + CELL_HALF, cy2); CX.lineTo(330, cy2);
  CX.moveTo(386, cy2); CX.lineTo(so.x + so.len/2 + 16, cy2); CX.lineTo(so.x + so.len/2 + 16, so.y);
  CX.stroke();
  cellSym(238, cy2, 24, false);
  /* the switch */
  CX.strokeStyle = PAL.text; CX.lineWidth = 3.4; CX.lineCap = 'round';
  CX.fillStyle = PAL.text;
  CX.beginPath(); CX.arc(330, cy2, 4, 0, TAU); CX.fill();
  CX.beginPath(); CX.arc(386, cy2, 4, 0, TAU); CX.fill();
  const sa = S.relaySw ? 0 : -0.62;
  line(330, cy2, 330 + 56*Math.cos(sa), cy2 + 56*Math.sin(sa));
  if(S.show.labels){
    txt(S.relaySw ? 'switch closed' : 'switch open', 358, cy2 + 26,
        {size:11, col:S.relaySw ? PAL.green : PAL.muted, weight:700});
    txt('control circuit — small current, safe voltage', 250, cy2 - 42,
        {size:11.5, col:PAL.dim, weight:600});
  }

  /* ---- the armature: an iron bar on a pivot, held back by a spring ---- */
  const px = RL.pivotX, py = RL.pivotY;
  CX.save();
  CX.translate(px, py); CX.rotate(armA);
  CX.fillStyle = metalGrad(0, -9, RL.armLen, 18, PAL.iron);
  rr(-14, -9, RL.armLen, 18, 4); CX.fill();
  CX.strokeStyle = 'rgba(0,0,0,.42)'; CX.lineWidth = 1.3;
  rr(-14, -9, RL.armLen, 18, 4); CX.stroke();
  CX.restore();
  CX.fillStyle = PAL.metalHi; CX.beginPath(); CX.arc(px, py, 7, 0, TAU); CX.fill();
  CX.strokeStyle = PAL.border; CX.lineWidth = 1.6; CX.stroke();
  /* each label gets its own band, well clear of the other two: pivot below
     and left, armature above and right, spring further left again */
  if(S.show.labels){
    leader(px - 82, py - 28, px - 7, py - 3, 'pivot', 'center');
    leader(px + 150, py - 58, px + 84, py - 6 + armA*84, 'iron armature', 'center');
  }
  /* the spring that pulls it back when the electromagnet is switched off */
  const sx0 = px + 30, sy0 = py - 10, sy1 = py - 62;
  CX.strokeStyle = PAL.metal; CX.lineWidth = 2.4; CX.lineCap = 'round';
  CX.beginPath();
  const coils = 7, spanY = sy0 - sy1 - armA*30;
  for(let i = 0; i <= coils*2; i++){
    const u = i/(coils*2);
    CX.lineTo(sx0 + (i%2 ? 9 : -9), sy1 + u*spanY);
  }
  CX.stroke();
  if(S.show.labels) leader(sx0 - 10, sy1 - 32, sx0 - 4, sy1 + 3, 'spring', 'center');

  /* ---- the contacts and the output circuit ---- */
  const cxc = RL.contactX, cyc = RL.contactY;
  const armTipY = py + Math.sin(armA)*(RL.armLen - 20);
  const gap = Math.max(0, 22 - 22*S.relayArm);
  CX.fillStyle = on ? PAL.green : PAL.metal;
  rr(cxc - 20, cyc - 6 - gap, 40, 9, 3); CX.fill();
  CX.fillStyle = PAL.metal; rr(cxc - 20, cyc + 6, 40, 9, 3); CX.fill();
  if(S.show.labels)
    leader(cxc + 74, cyc - 34, cxc + 20, cyc, on ? 'contacts closed' : 'contacts open', 'left');
  /* the armature pushes the upper contact down */
  CX.strokeStyle = PAL.metal; CX.lineWidth = 3;
  line(px + Math.cos(armA)*(RL.armLen - 20), armTipY, cxc, cyc - 6 - gap);

  const oy = EL.benchY - 40;
  CX.strokeStyle = PAL.wire; CX.lineWidth = 4;
  const LAMP_R = 20, CELL_H = 8;
  CX.beginPath();
  CX.moveTo(cxc - 20, cyc - 2 - gap); CX.lineTo(cxc - 60, cyc - 2 - gap);
  CX.lineTo(cxc - 60, 120); CX.lineTo(1090, 120); CX.lineTo(1090, oy);
  CX.lineTo(982 + CELL_H, oy);                       // up to the cell's + plate
  CX.moveTo(982 - CELL_H, oy); CX.lineTo(850 + LAMP_R, oy);   // cell to lamp
  CX.moveTo(850 - LAMP_R, oy); CX.lineTo(cxc + 20, oy); CX.lineTo(cxc + 20, cyc + 12);
  CX.stroke();
  cellSym(982, oy, 26, false);
  lampSym(850, oy, LAMP_R, on);
  if(S.show.labels){
    txt('output circuit — large current, high voltage', 900, oy + 36,
        {size:11.5, col:PAL.dim, weight:600});
    txt(on ? 'lamp ON' : 'lamp off', 850, oy - 36,
        {size:12, col:on ? PAL.amber : PAL.muted, weight:700});
  }

  if(S.show.labels)
    keyStrip(40, EL.benchY + 20, [
      {t:'wire', c:PAL.wire}, {t:'soft iron', c:PAL.iron},
      {t:'magnetic field line', c:PAL.line}, {t:'circuit made', c:PAL.green}
    ]);

  setChips(
    '⚡ Relay · <b>' + (S.relaySw ? 'switch closed' : 'switch open') + '</b>',
    on ? 'Contacts <b>closed</b> — lamp lit' : 'Contacts <b>open</b>',
    'A relay lets a <b>small, safe current</b> switch a <b>large, dangerous one</b>.<br>' +
    'Close the switch → the electromagnet pulls the iron armature down → the contacts ' +
    'meet → the output circuit is completed.<br>' +
    'Below about <b>' + Math.round(RELAY_PULL_IN*100) + '%</b> of full current the spring wins and it stays open.',
    (S.relaySw && !on) ? 'Current too small to pull the armature in' : '');
}
/* ===== part_js_motor.js ===== */
/* ============================================================
   SECTION 3 — THE MOTOR EFFECT
   Force on a current-carrying conductor, the catapult field,
   and a d.c. motor with a split-ring commutator.
   ============================================================ */

const MO = {
  cy:300, benchY:H - 54,
  box:{x0:26, y0:66, x1:W-26, y1:H-94},
  gapL:392, gapR:648,            // inner faces of the two magnadur slabs
  slabW:44, slabH:210,
  wireR:17,
  motorR:96                       // radius of the coil, end-on
};
const MOTOR_GAIN = 1500, MOTOR_DAMP = 3.0;

/* the uniform field between the poles, as a canvas vector.
   oDirB = +1 puts N on the LEFT, so the field points to the right. */
const uniformB = () => ({x:S.oDirB*(S.oB/1000), y:0});
const wireCentre = () => ({x:(MO.gapL + MO.gapR)/2, y:MO.cy});
const gapBox = () => { const g = poleGeom();
  return {x0:g.gapL, x1:g.gapR, y0:g.cy - g.slabH/2, y1:g.cy + g.slabH/2}; };
const inGap = (x, y) => { const g = gapBox();
  return x > g.x0 && x < g.x1 && y > g.y0 && y < g.y1; };

/* ONE source of pole geometry, scaled per sub-mode.  The catapult picture is
   all about the shape of the field in the gap, so it is drawn 25% larger;
   the d.c. motor shares the canvas with the commutator inset and stays as it
   was.  The plotting compass is NOT scaled — it is a real instrument of a
   fixed size, and blowing it up with the apparatus would quietly misrepresent
   how big the region it samples is. */
const POLE_K = () => (S.omode === 'catapult' ? 1.25 : 1);
function poleGeom(){
  const k = POLE_K();
  const cx = (MO.gapL + MO.gapR)/2, half = (MO.gapR - MO.gapL)/2*k;
  return {cx:cx, cy:MO.cy, gapL:cx - half, gapR:cx + half,
          slabW:MO.slabW*k, slabH:MO.slabH*k};
}

/* ------------------------------------------------------------------
   CATAPULT SCALE — a deliberate, documented exaggeration.
   Honestly, 3 A at 4 cm gives about 15 µT, while a magnadur pair gives
   about 60 mT: the wire's own field is some four THOUSAND times smaller,
   and drawn to scale the catapult picture is a set of perfectly straight
   lines that teaches nothing.  Every textbook diagram of this is schematic
   for the same reason.  So the wire's contribution is scaled up until it
   is comparable at a few centimetres — the DIRECTIONS and the sign are
   untouched, only the size — and the canvas says so in words.
   ------------------------------------------------------------------ */
/* Calibrated, not guessed: at the default 60 mT and 3 A this puts the
   neutral point about 50 logical px from the wire, where it is plainly
   visible, and both sliders still move it exactly as the physics says
   (more current pushes it out, a stronger field pulls it in). */
const CATAPULT_VIS = 5000;
function catapultWireB(x, y){
  const c = wireCentre();
  const w = wireFieldAt(x, y, {x:c.x, y:c.y, I:S.oI, s:S.oDirI});
  const k = CATAPULT_VIS*MU0/(2*Math.PI)/M_PER_PX;
  return {x:w.x*k, y:w.y*k};
}
/* the field a compass on the bench would actually see */
function motorField(x, y){
  const u = inGap(x, y) ? uniformB() : {x:0, y:0};
  if(S.omode !== 'catapult') return u;
  const w = catapultWireB(x, y);
  return {x:u.x + w.x, y:u.y + w.y};
}
const forceN = () => forceBIL(S.oB/1000, S.oI, S.oL/100);

function stepMotor(dt){
  S.oKick = Math.max(0, S.oKick - dt*1.6);
  if(S.omode === 'motor'){
    if(S.motorRun){
      /* The turning effect is proportional to B*I, so BOTH signs belong in
         it.  Leaving oDirB out made "Reverse field" flip the drawn force
         arrows while the coil carried on turning the same way — the arrows
         and the motion openly contradicted each other, and the reversing
         experiment the section exists to teach did not work. */
      const sA = coilCurrentSign();
      const tq = -2*sA*S.oDirB*Math.cos(S.coilTh);
      const K = (S.oB/1000)*S.oI*(S.oL/100);
      S.coilW += (K*MOTOR_GAIN*tq - MOTOR_DAMP*S.coilW)*dt;
    }else{
      S.coilW -= MOTOR_DAMP*2*S.coilW*dt;
    }
    S.coilTh += S.coilW*dt;
    while(S.coilTh >  Math.PI) S.coilTh -= TAU;
    while(S.coilTh < -Math.PI) S.coilTh += TAU;
  }
  stepCompass(dt, motorField);
}
/* WITH a commutator the current in a given side reverses every half turn, so
   the turning effect never changes sign.  WITHOUT one it is fixed, and the
   coil simply swings to the vertical and stops — which is the whole reason
   the split ring is there. */
function coilCurrentSign(){
  const base = S.oDirI;
  if(!S.comm) return base;
  return base * (Math.cos(S.coilTh) >= 0 ? 1 : -1);
}

/* ---------- draw ---------- */
function drawMotor(){
  benchLine(MO.benchY);
  if(S.omode === 'force')         drawForceOnWire();
  else if(S.omode === 'catapult') drawCatapult();
  else                            drawDCMotor();
}

/* ---------- the magnadur pair on a steel yoke ---------- */
function drawPoles(opt){
  opt = opt || {};
  const G = poleGeom();
  const yTop = G.cy - G.slabH/2;
  const nLeft = S.oDirB > 0;
  const slab = (x, isN) => {
    CX.save();
    CX.shadowColor = 'rgba(0,0,0,.35)'; CX.shadowBlur = 9; CX.shadowOffsetY = 3;
    CX.fillStyle = metalGrad(x, yTop, G.slabW, G.slabH,
                             isN ? PAL.N : PAL.Sp, isN ? '#ff9090' : '#8fb8ff');
    rr(x, yTop, G.slabW, G.slabH, 5); CX.fill();
    CX.restore();
    CX.strokeStyle = 'rgba(0,0,0,.4)'; CX.lineWidth = 1.5;
    rr(x, yTop, G.slabW, G.slabH, 5); CX.stroke();
    if(S.show.labels)
      txt(isN ? 'N' : 'S', x + G.slabW/2, G.cy,
          {size:28*POLE_K(), weight:800, col:'#fff'});
  };
  slab(G.gapL - G.slabW, nLeft);
  slab(G.gapR, !nLeft);
  /* the steel yoke that holds them */
  CX.fillStyle = PAL.steel;
  const yy = yTop + G.slabH + 6;
  rr(G.gapL - G.slabW - 16, yTop - 16, 16, G.slabH + 38, 4); CX.fill();
  rr(G.gapR + G.slabW, yTop - 16, 16, G.slabH + 38, 4); CX.fill();
  rr(G.gapL - G.slabW - 16, yy, (G.gapR + G.slabW + 16) - (G.gapL - G.slabW - 16), 16, 4);
  CX.fill();
}
/* the uniform field: evenly spaced parallel arrows, which is what "uniform"
   looks like and the only honest way to draw it */
function drawUniformField(y0, y1, n, alpha){
  const G = poleGeom(), dir = S.oDirB > 0 ? 1 : -1;
  CX.save(); CX.globalAlpha = alpha === undefined ? 1 : alpha;
  for(let i = 0; i < n; i++){
    const y = y0 + (i + 0.5)/n*(y1 - y0);
    if(dir > 0) arrow(G.gapL + 4, y, G.gapR - 4, y, {col:PAL.line, lw:2, head:9});
    else        arrow(G.gapR - 4, y, G.gapL + 4, y, {col:PAL.line, lw:2, head:9});
  }
  CX.restore();
}

/* ---------------- force on a wire: the pseudo-3D view ----------------
   WHY A DIFFERENT VIEW HERE.
   The end-on view — the wire drawn as a ⊗ — is the right picture for the
   catapult field, because that IS a picture of the plane at right angles to
   the wire, and the two fields can only be seen adding and cancelling in
   that plane.

   It is the wrong picture for the force.  The whole difficulty of the motor
   effect is that the field, the current and the force are mutually
   perpendicular, and in the end-on view the current is the one direction you
   cannot see: it points straight at you.  Students then cannot hold their
   left hand up against the diagram, which is exactly what the syllabus asks
   them to do.  So this sub-mode uses the axonometric view the IGCSE
   textbooks use, where all three directions are visible at once, and puts a
   drawn left hand beside it in the same orientation.
   ------------------------------------------------------------------ */
/* A STEEPER depth axis than the obvious 0.62/-0.46.  At the shallow angle the
   current direction on screen sat only 37 deg from the field direction, so on
   the drawn hand the first and second fingers nearly lay on top of one
   another and the right angle between them was impossible to read.  At this
   angle they are 51 deg apart and the hand is legible. */
const D3 = {x:0.50, y:-0.62};                 // one unit of depth, on screen
const P3 = (x, y, z) => ({x:x + D3.x*z, y:y + D3.y*z});
/* These numbers are not free.  The blocks recede up and to the right by
   0.62 px of screen-x per px of depth, so a DEEP block projects a long way
   sideways: at depth 250 the left block's silhouette reaches 155 px into the
   gap and swallows the wire, which then reads as a line drawn on top of a
   magnet rather than one passing between them.  The rule that keeps the wire
   visible along its whole length is
       cx + 0.62·wz0  >  ax1 + 0.62·dep      (clear of the left block)
       cx + 0.62·wz1  <  bx0                 (clear of the right block)
   so the blocks are kept shallow and the gap wide.  Both are asserted. */
const M3 = {
  ax0:436, ax1:490,          // left block, front face
  bx0:850, bx1:904,          // right block, front face
  yT:250, yB:398,            // front face, top and bottom
  dep:110,                   // how far the blocks run back
  wz0:-150, wz1:278,         // the wire, front end to back end
  wy:324,                    // the wire's height
  fz:55                      // the depth at which the field arrows are drawn
};
const M3cx = () => 670;   // inside the gap, and clear of both silhouettes
/* the current's direction ON SCREEN.  s = -1 means into the page, which in
   this view means running away from you, up and to the right. */
function currentScreenDir(){
  const m = Math.hypot(D3.x, D3.y);
  const k = (S.oDirI < 0 ? 1 : -1)/m;
  return {x:D3.x*k, y:D3.y*k};
}

function quad(a, b, c, d, fill, stroke){
  CX.beginPath();
  CX.moveTo(a.x, a.y); CX.lineTo(b.x, b.y); CX.lineTo(c.x, c.y); CX.lineTo(d.x, d.y);
  CX.closePath();
  if(fill){ CX.fillStyle = fill; CX.fill(); }
  if(stroke){ CX.strokeStyle = stroke; CX.lineWidth = 1.4; CX.stroke(); }
}
/* one magnadur block as a solid: the face nearest the gap, the top, the front */
function block3D(x0, x1, isN){
  const d = M3.dep, yT = M3.yT, yB = M3.yB;
  const base = isN ? PAL.N : PAL.Sp;
  const dark = isN ? 'rgba(150,30,30,.92)' : 'rgba(30,60,150,.92)';
  const mid  = isN ? 'rgba(205,60,60,.95)' : 'rgba(60,105,205,.95)';
  const edge = 'rgba(0,0,0,.45)';
  /* right-hand side face (the one the depth axis exposes) */
  quad(P3(x1, yT, 0), P3(x1, yB, 0), P3(x1, yB, d), P3(x1, yT, d), dark, edge);
  /* top face */
  quad(P3(x0, yT, 0), P3(x1, yT, 0), P3(x1, yT, d), P3(x0, yT, d), mid, edge);
  /* front face, drawn last so it sits in front */
  CX.save();
  CX.shadowColor = 'rgba(0,0,0,.4)'; CX.shadowBlur = 10; CX.shadowOffsetY = 4;
  CX.fillStyle = metalGrad(x0, yT, x1 - x0, yB - yT, base,
                           isN ? '#ff9090' : '#8fb8ff');
  rr(x0, yT, x1 - x0, yB - yT, 3); CX.fill();
  CX.restore();
  CX.strokeStyle = edge; CX.lineWidth = 1.5;
  rr(x0, yT, x1 - x0, yB - yT, 3); CX.stroke();
  if(S.show.labels)
    txt(isN ? 'N' : 'S', (x0 + x1)/2, (yT + yB)/2, {size:26, weight:800, col:'#fff'});
}

function drawForceOnWire(){
  const nLeft = S.oDirB > 0;                   // field runs left to right
  const F = motorForceDir(uniformB(), S.oDirI);
  const FN = forceN();
  const kick = S.oKick*22;
  const cx = M3cx();

  /* --- the region the field fills, as two faint parallelograms --- */
  CX.save(); CX.globalAlpha = .12;
  quad(P3(M3.ax1, M3.yT, 0), P3(M3.bx0, M3.yT, 0),
       P3(M3.bx0, M3.yT, M3.dep), P3(M3.ax1, M3.yT, M3.dep), PAL.line, null);
  quad(P3(M3.ax1, M3.yB, 0), P3(M3.bx0, M3.yB, 0),
       P3(M3.bx0, M3.yB, M3.dep), P3(M3.ax1, M3.yB, M3.dep), PAL.line, null);
  CX.restore();

  block3D(M3.ax0, M3.ax1, nLeft);
  block3D(M3.bx0, M3.bx1, !nLeft);

  /* --- the uniform field: parallel, evenly spaced arrows on one depth
         plane, which is what "uniform" looks like --- */
  const nA = 6;
  for(let i = 0; i < nA; i++){
    const y = M3.yT + 12 + (i/(nA-1))*(M3.yB - M3.yT - 24);
    const a = P3(M3.ax1 + 4, y, M3.fz), b = P3(M3.bx0 - 4, y, M3.fz);
    if(nLeft) arrow(a.x, a.y, b.x, b.y, {col:PAL.line, lw:2.2, head:10});
    else      arrow(b.x, b.y, a.x, a.y, {col:PAL.line, lw:2.2, head:10});
  }
  if(S.show.labels)
    txt('magnetic field, N → S', P3(cx, M3.yT - 18, M3.fz).x,
        P3(cx, M3.yT - 18, M3.fz).y, {size:11.5, col:PAL.line, weight:700, plate:true});

  /* --- the wire: a straight conductor running through the gap, visible as
         a LINE, so the current has a direction you can point at --- */
  const wy = M3.wy + F.y*kick;
  const p0 = P3(cx, wy, M3.wz0), p1 = P3(cx, wy, M3.wz1);
  copperWire(p0.x, p0.y, p1.x, p1.y, 8);
  /* current arrowheads along it */
  const u = currentScreenDir();
  for(const t of [0.30, 0.62, 0.88]){
    const q = {x:p0.x + (p1.x - p0.x)*t, y:p0.y + (p1.y - p0.y)*t};
    headAt({x:q.x - u.x*14, y:q.y - u.y*14}, q, PAL.cur, 12);
  }
  if(S.show.labels){
    const tip = S.oDirI < 0 ? p1 : p0;
    txt('current I ' + (S.oDirI < 0 ? '(away from you)' : '(towards you)'),
        tip.x + (S.oDirI < 0 ? 18 : -18), tip.y - 20,
        {size:12, col:PAL.cur, weight:700, plate:true,
         align:S.oDirI < 0 ? 'left' : 'right'});

  }

  /* --- the force, at right angles to both --- */
  if(FN > 0){
    const o = P3(cx, wy, M3.fz);
    const L = 40 + Math.min(96, FN*4200);
    arrow(o.x, o.y, o.x + F.x*L, o.y + F.y*L, {col:PAL.force, lw:4.4, head:16});
    txt('force F = ' + fmtF(FN), o.x + 74, o.y + F.y*L*0.60,
        {size:13, col:PAL.force, weight:800, align:'left', plate:true});
  }

  /* --- the leads and the circuit ---
     The rail is drawn as a list of BREAKS, each one exactly the width of the
     component that fills it, so a wire can never stop short of a cell and
     leave the circuit visibly open when it is meant to be closed. */
  const railY = MO.benchY - 34;
  const lead0 = P3(cx, M3.wy, M3.wz0), lead1 = P3(cx, M3.wy, M3.wz1);
  const cellX = 700, RH = {x0:846, x1:902};      // cell centre, rheostat body
  const CELL_HALF = 8;                            // the cell symbol's own width
  CX.strokeStyle = PAL.wire; CX.lineWidth = 4; CX.lineCap = 'round';
  CX.beginPath();
  /* down from the front end of the wire, along the rail, up to the back end */
  CX.moveTo(lead0.x, lead0.y + 5); CX.lineTo(lead0.x, railY);
  CX.lineTo(cellX - CELL_HALF, railY);
  CX.moveTo(cellX + CELL_HALF, railY); CX.lineTo(RH.x0, railY);
  CX.moveTo(RH.x1, railY); CX.lineTo(1030, railY);
  /* straight up, then straight across — a slanted return lead reads as part
     of the apparatus rather than as wiring */
  CX.lineTo(1030, 118); CX.lineTo(lead1.x, 118); CX.lineTo(lead1.x, lead1.y - 3);
  CX.stroke();
  cellSym(cellX, railY, 26, S.oDirI > 0);
  CX.strokeStyle = PAL.text; CX.lineWidth = 2.4; CX.fillStyle = PAL.card;
  rr(RH.x0, railY - 12, RH.x1 - RH.x0, 24, 3); CX.fill(); CX.stroke();
  arrow(RH.x0 - 6, railY + 20, RH.x1 + 6, railY - 20, {col:PAL.text, lw:2, head:8});
  if(S.show.labels){
    txt('d.c. supply', cellX, railY + 24, {size:11, col:PAL.muted, weight:600});
    txt('variable resistor', (RH.x0 + RH.x1)/2, railY + 24, {size:11, col:PAL.muted, weight:600});
  }

  /* --- the left hand, in the SAME orientation as the apparatus --- */
  /* level with the force arrow in the apparatus, and well clear of it */
  drawFlemingHand(196, P3(cx, M3.wy, M3.fz).y, {x:nLeft ? 1 : -1, y:0}, u, F, 1.0);

  if(S.show.labels)
    keyStrip(40, MO.benchY + 20, [
      {t:'north pole', c:PAL.N}, {t:'south pole', c:PAL.Sp},
      {t:'magnetic field', c:PAL.line}, {t:'conventional current', c:PAL.cur},
      {t:'force on the wire', c:PAL.force}
    ]);

  setChips(
    '🔄 Force on a wire · <b>B = ' + S.oB + ' mT · I = ' + S.oI.toFixed(1) +
    ' A · L = ' + S.oL.toFixed(1) + ' cm</b>',
    'F = BIL = <b>' + fmtF(FN) + '</b>',
    "Drawn in 3-D on purpose: the <b>field</b>, the <b>current</b> and the <b>force</b> are " +
    'all at right angles, so all three have to be visible at once.<br>' +
    'Hold your <b>left</b> hand up against the drawing — first finger, second finger, thumb.<br>' +
    'Reverse the current <i>or</i> the field and the force reverses; reverse <b>both</b> and it comes back.',
    (S.oI === 0 || S.oB === 0) ? 'No current or no field → no force' : '');
}

/* ---------------- the three directions, as a set of axes ----------------
   A drawn hand that does not look like a hand teaches nothing, so this is
   the standard 3-D axis figure instead: three arrows from one origin, with a
   short stub on the far side of each, exactly as a set of x-y-z axes is
   drawn in a textbook.

   The three arrows ARE the three physical vectors — the first finger's
   field, the second finger's current and the thumb's force are read straight
   off the same functions the apparatus uses, so the figure can never
   disagree with the diagram beside it.  Reverse anything on the toolbar and
   the whole triad turns with it. */
function drawFlemingHand(ox, oy, uB, uI, uF, sc){
  sc = sc || 1;
  const N = v => { const m = Math.hypot(v.x, v.y) || 1; return {x:v.x/m, y:v.y/m}; };
  const axes = [
    {d:N(uB), len:132, col:PAL.line,  name:'Field',   sub:'F irst finger'},
    {d:N(uI), len:118, col:PAL.cur,   name:'Current', sub:'se C ond finger'},
    {d:N(uF), len:112, col:PAL.force, name:'Motion',  sub:'thu M b'}
  ];
  let lowest = oy;

  for(const a of axes){
    const L = a.len*sc, tip = {x:ox + a.d.x*L, y:oy + a.d.y*L};
    /* the short stub on the far side, as on a drawn axis */
    CX.strokeStyle = a.col; CX.lineWidth = 2; CX.lineCap = 'round';
    CX.globalAlpha = .55;
    line(ox - a.d.x*26*sc, oy - a.d.y*26*sc, ox, oy);
    CX.globalAlpha = 1;
    arrow(ox, oy, tip.x, tip.y, {col:a.col, lw:2.6, head:13});
    /* the name at the tip, and the finger it belongs to just under it */
    const lx = tip.x + a.d.x*20*sc, ly = tip.y + a.d.y*20*sc;
    txt(a.name, lx, ly, {size:14, col:a.col, weight:800, plate:true});
    txt(a.sub, lx, ly + 17, {size:10.5, col:PAL.muted, weight:600, plate:true});
    lowest = Math.max(lowest, ly + 17);
  }
  /* the origin */
  CX.fillStyle = PAL.text;
  CX.beginPath(); CX.arc(ox, oy, 4.2*sc, 0, TAU); CX.fill();
  txt('O', ox - 14*sc, oy + 14*sc, {size:12, col:PAL.dim, weight:700});

  /* The caption goes below whatever the LOWEST arrow and label turned out to
     be, not at a fixed offset: the force arrow points up in half the
     combinations and down in the other half, and a fixed offset lands the
     caption straight on top of it. */
  const capY = lowest + 34;
  txt("Fleming's LEFT-hand rule", ox, capY,
      {size:13.5, col:PAL.green, weight:800, plate:true});
  txt('Hold all three at right angles on your LEFT hand', ox, capY + 19,
      {size:10.5, col:PAL.muted, weight:600, plate:true});
}

/* ---------------- catapult field ----------------

   EQUAL FLUX, NOT EQUAL SPACING.
   "Where the lines are closer together the field is stronger" is only true
   if every line carries the SAME amount of flux.  Seeding them at equal
   spacing along a line through the wire — which is the obvious thing to do —
   quietly breaks that: the picture then shows the same number of lines above
   and below the wire however lopsided the real field is, so the one thing
   the catapult diagram exists to show is exactly the thing it fails to show.

   Along the vertical line through the wire the field is purely horizontal
   (the wire's own contribution there is (k/dy, 0) and the magnets' is
   (B, 0)), so the flux through that line is just the integral of |Bx| dy.
   Walking down it and dropping a seed every time another equal slice of
   flux has accumulated puts many lines where B is large and few where it is
   small — which is the definition of field-line density, and makes the
   crowded and empty sides come out on their own rather than being asserted
   in a caption. */
const CAT_N = 15;                 // total field lines across the gap
function catapultSeeds(c, box){
  const rMin = MO.wireR*1.55;     // the wire has a finite radius; B -> inf at 0
  const y0 = box.y0 + 2, y1 = box.y1 - 2, M = 900;
  const dy = (y1 - y0)/M;
  const acc = [0];
  let total = 0;
  for(let i = 1; i <= M; i++){
    const y = y0 + (i - 0.5)*dy;
    const v = Math.abs(y - c.y) > rMin ? Math.abs(motorField(c.x, y).x) : 0;
    total += v*dy;
    acc.push(total);
  }
  if(!(total > 0)) return [];
  const q = total/CAT_N, out = [];
  let target = q*0.5;
  for(let i = 1; i <= M && out.length < CAT_N; i++){
    if(acc[i] >= target){
      const y = y0 + i*dy;
      if(Math.abs(y - c.y) > rMin) out.push(y);
      target += q;
    }
  }
  return out;
}
let CAT_CACHE = {sig:'', lines:[]};
function catapultLines(c, box){
  const sig = [S.oB, S.oI, S.oDirI, S.oDirB, (box.y1 - box.y0)|0].join('~');
  if(sig === CAT_CACHE.sig) return CAT_CACHE.lines;
  const tb = {x0:box.x0 - 2, y0:box.y0 - 2, x1:box.x1 + 2, y1:box.y1 + 2};
  const Bu = Math.abs(uniformB().x);
  const rNull = (Bu > 0 && S.oI > 0)
    ? CATAPULT_VIS*MU0*S.oI/(2*Math.PI*Bu)/M_PER_PX : Infinity;
  const out = [];
  for(const y of catapultSeeds(c, box)){
    /* inside the neutral radius the wire wins and the line closes on itself
       right round the conductor — the loop that gives the catapult its name */
    const closed = Math.abs(y - c.y) < rNull;
    const TR = {step:4, maxN:900, close:closed};
    const fwd  = traceField(motorField, c.x, y, +1, tb, TR);
    if(closed){ out.push(fwd); continue; }
    const back = traceField(motorField, c.x, y, -1, tb, TR);
    back.reverse(); back.pop();
    out.push(back.concat(fwd));
  }
  CAT_CACHE = {sig:sig, lines:out};
  return out;
}

/* ---------------- catapult field ---------------- */
function drawCatapult(){
  const c = wireCentre();
  const F = motorForceDir(uniformB(), S.oDirI);
  drawPoles({noYoke:true});

  /* the combined field, traced from the left-hand edge of the gap so the
     lines really are the sum of the two fields rather than a sketch */
  const G = poleGeom();
  const box = {x0:G.gapL, y0:G.cy - G.slabH/2 + 4, x1:G.gapR, y1:G.cy + G.slabH/2 - 4};
  const lines = catapultLines(c, box);
  paintLines(lines, PAL.line, 4);

  /* where the wire's own field exactly cancels the uniform one — computed
     from the same scaled field the lines are drawn with, so the ✕ always
     sits where the picture really does go blank */
  const Bu = Math.abs(uniformB().x);
  if(Bu > 0 && S.oI > 0){
    const rNull = CATAPULT_VIS*MU0*S.oI/(2*Math.PI*Bu)/M_PER_PX;     // px
    if(rNull > MO.wireR + 6 && rNull < poleGeom().slabH/2){
      /* The wire is flung FROM the crowded side TOWARDS the empty one, and
         the empty one is where the two fields cancel — so the neutral point
         lies along +F, not along -F.  Drawing it on the crowded side put the
         "no field here" marker exactly where the field is strongest. */
      const ny = c.y + F.y*rNull, nx = c.x + F.x*rNull;
      CX.strokeStyle = PAL.neutral; CX.lineWidth = 2.6; CX.lineCap = 'round';
      const s = 8;
      line(nx-s, ny-s, nx+s, ny+s); line(nx-s, ny+s, nx+s, ny-s);
      txt('neutral point', nx - 18, ny,
          {size:10.5, col:PAL.neutral, weight:700, plate:true, align:'right'});
    }
  }

  currentDot(c.x, c.y, MO.wireR*1.2, S.oDirI);

  /* the teaching point, in words, on the two sides of the wire.  The labels
     are pushed OUT of the pole gap so they never sit on the field lines
     they are describing. */
  if(S.show.labels && S.oI > 0){
    const g = gapBox();
    const sy = c.y - F.y*(G.slabH/2 + 44), wy = c.y + F.y*(G.slabH/2 + 44);
    txt('lines crowd together — field is STRONGER', (g.x0 + g.x1)/2, sy,
        {size:12, col:PAL.amber, weight:700, plate:true});
    txt('lines cancel out — field is WEAKER', (g.x0 + g.x1)/2, wy,
        {size:12, col:PAL.blue, weight:700, plate:true});
  }
  if(S.oI > 0){
    const L = 30 + Math.min(80, forceN()*4200);
    arrow(c.x + F.x*30, c.y + F.y*30, c.x + F.x*(30+L), c.y + F.y*(30+L),
          {col:PAL.force, lw:4, head:15});
    txt('the wire is flung this way', G.gapR + 74, c.y + F.y*84,
        {size:12.5, col:PAL.force, weight:800, align:'left', plate:true});
  }
  /* say plainly that the wire's own field is drawn bigger than life */
  txt("the wire's own field is drawn far larger than life (×" + CATAPULT_VIS +
      ") — to scale it would be far too small to bend these lines at all",
      W/2, MO.benchY - 16, {size:11, col:PAL.muted, weight:600});

  drawCompass();
  if(S.lhr) drawLeftHand(uniformB(), S.oDirI, F);

  if(S.show.labels)
    keyStrip(40, MO.benchY + 20, [
      {t:'combined field line', c:PAL.line}, {t:'conventional current', c:PAL.cur},
      {t:'resultant force', c:PAL.force}, {t:'neutral point', c:PAL.neutral}
    ]);

  setChips(
    '🔄 Catapult field · <b>I = ' + S.oI.toFixed(1) + ' A</b>',
    'Force: <b>' + fmtF(forceN()) + '</b>',
    'The wire\'s own <b>circular</b> field is added to the magnets\' <b>uniform</b> one.<br>' +
    'On one side they point the same way and <b>reinforce</b>; on the other they oppose and ' +
    '<b>cancel</b>.<br>The wire is pushed from the crowded side towards the empty side — like a ' +
    'stone in a catapult.',
    S.oI === 0 ? 'No current → the field is simply uniform again' : '');
}

/* ---------------- d.c. motor ---------------- */
function drawDCMotor(){
  const cx = (MO.gapL + MO.gapR)/2, cy = MO.cy, R = MO.motorR;
  const th = S.coilTh, sA = coilCurrentSign();
  drawPoles({noYoke:true});
  drawUniformField(cy - MO.slabH/2 + 16, cy + MO.slabH/2 - 16, 7, 0.45);

  /* the coil seen end-on: a line through the axis with a conductor at each end */
  const ax = cx + R*Math.cos(th), ay = cy + R*Math.sin(th);
  const bx = cx - R*Math.cos(th), by = cy - R*Math.sin(th);
  CX.strokeStyle = PAL.border; CX.lineWidth = 5; CX.lineCap = 'round';
  line(ax, ay, bx, by);
  CX.fillStyle = PAL.metalHi; CX.beginPath(); CX.arc(cx, cy, 8, 0, TAU); CX.fill();

  /* forces on the two sides — a couple, which is what makes it spin */
  const FA = motorForceDir(uniformB(), sA), FB = motorForceDir(uniformB(), -sA);
  const FN = forceN();
  if(FN > 0 && S.oB > 0){
    const L = 26 + Math.min(64, FN*3000);
    arrow(ax, ay, ax + FA.x*L, ay + FA.y*L, {col:PAL.force, lw:3.4, head:13});
    arrow(bx, by, bx + FB.x*L, by + FB.y*L, {col:PAL.force, lw:3.4, head:13});
  }
  currentDot(ax, ay, 15, sA);
  currentDot(bx, by, 15, -sA);
  if(S.show.labels){
    txt('coil, seen end-on', cx, cy - MO.slabH/2 - 22, {size:11.5, col:PAL.muted, weight:600});
    txt('axle', cx + 16, cy + 18, {size:10.5, col:PAL.muted, weight:600, align:'left'});
  }

  /* --- the commutator, drawn properly, off to the right --- */
  const kx = 900, ky = 300, kr = 66;
  CX.fillStyle = PAL.card; CX.strokeStyle = PAL.border; CX.lineWidth = 1.4;
  rr(kx - 150, ky - 118, 300, 260, 12); CX.fill(); CX.stroke();
  txt(S.comm ? 'split-ring commutator' : 'plain slip rings (commutator OFF)',
      kx, ky - 96, {size:12, col:S.comm ? PAL.accent : PAL.rose, weight:700});

  if(S.comm){
    /* two half-rings, rotating with the coil, with a gap between them */
    for(const half of [0, 1]){
      const a0 = th + half*Math.PI + 0.10, a1 = th + half*Math.PI + Math.PI - 0.10;
      CX.strokeStyle = half ? PAL.Sp : PAL.N;
      CX.lineWidth = 15; CX.lineCap = 'butt';
      CX.beginPath(); CX.arc(kx, ky, kr, a0, a1); CX.stroke();
    }
  }else{
    CX.strokeStyle = PAL.metal; CX.lineWidth = 15;
    CX.beginPath(); CX.arc(kx, ky, kr, 0, TAU); CX.stroke();
  }
  /* the brushes: fixed, always at the same two places */
  for(const s of [-1, 1]){
    CX.fillStyle = PAL.text;
    rr(kx + s*(kr + 9), ky - 13, 22*(s > 0 ? 1 : -1), 26, 3); CX.fill();
    CX.fillStyle = PAL.cur;
    CX.beginPath(); CX.arc(kx + s*(kr + 8), ky, 4, 0, TAU); CX.fill();
  }
  txt('brushes', kx, ky + kr + 30, {size:11, col:PAL.muted, weight:600});
  txt(S.comm ? 'Every half turn the two halves swap brushes,'
             : 'The current in each side never reverses,',
      kx, ky + kr + 54, {size:10.5, col:PAL.dim, weight:600});
  txt(S.comm ? 'so the current in each side reverses — it keeps spinning.'
             : 'so after a quarter turn the couple stops it dead.',
      kx, ky + kr + 70, {size:10.5, col:PAL.dim, weight:600});

  /* supply */
  CX.strokeStyle = PAL.wire; CX.lineWidth = 4;
  CX.beginPath();
  CX.moveTo(kx - kr - 26, ky); CX.lineTo(kx - kr - 60, ky);
  CX.lineTo(kx - kr - 60, MO.benchY - 30); CX.lineTo(kx - 34, MO.benchY - 30);
  CX.moveTo(kx + 34, MO.benchY - 30); CX.lineTo(kx + kr + 60, MO.benchY - 30);
  CX.lineTo(kx + kr + 60, ky); CX.lineTo(kx + kr + 26, ky);
  CX.stroke();
  cellSym(kx, MO.benchY - 30, 26, S.oDirI > 0);

  drawCompass();
  const rps = Math.abs(S.coilW)/TAU;
  if(S.show.labels)
    keyStrip(40, MO.benchY + 20, [
      {t:'north pole', c:PAL.N}, {t:'south pole', c:PAL.Sp},
      {t:'conventional current', c:PAL.cur}, {t:'force on each side', c:PAL.force}
    ]);
  setChips(
    '🔄 D.C. motor · <b>' + (S.motorRun ? 'running' : 'stopped') + '</b>' +
    (S.comm ? '' : ' · no commutator'),
    'Speed: <b>' + rps.toFixed(2) + ' rev s⁻¹</b>',
    'Each side of the coil carries current <b>across</b> the field, so each feels a force — ' +
    'one up, one down. That pair of forces is a <b>couple</b>, and it turns the coil.<br>' +
    'Speed it up with <b>more current</b>, a <b>stronger field</b> or <b>more turns</b>.<br>' +
    'Switch the commutator off and watch it stall after a quarter turn.',
    (!S.comm && Math.abs(S.coilW) < 0.4 && S.motorRun) ?
      'Stalled — without a commutator the couple reverses and holds it here' : '');
}

/* ---------------- Fleming's left-hand rule overlay ---------------- */
function drawLeftHand(B, s, F){
  const x = 156, y = 486, w = 250, h = 150;
  CX.fillStyle = PAL.card; CX.strokeStyle = PAL.green; CX.lineWidth = 2;
  rr(x - w/2, y - h/2, w, h, 11); CX.fill(); CX.stroke();
  txt("Fleming's LEFT hand", x, y - h/2 + 17, {size:12.5, col:PAL.green, weight:800});

  const bd = Math.atan2(B.y, B.x);
  const rows = [
    ['F', 'irst finger', 'Field',  PAL.line,  bd,               null],
    ['s', 'eCond finger', 'Current', PAL.cur, null,             s],
    ['t', 'huMb', 'Motion / force', PAL.force, Math.atan2(F.y, F.x), null]
  ];
  let yy = y - 22;
  for(const [a, b2, name, col, ang, cur] of rows){
    txt(a + b2, x - w/2 + 12, yy, {size:11.5, col:PAL.dim, align:'left', weight:600});
    txt(name, x + 24, yy, {size:11.5, col:col, align:'left', weight:700});
    const gx = x + w/2 - 26;
    if(cur !== null) currentDot(gx, yy, 9, cur, {col:col});
    else arrow(gx - 14*Math.cos(ang), yy - 14*Math.sin(ang),
               gx + 14*Math.cos(ang), yy + 14*Math.sin(ang), {col:col, lw:2.6, head:9});
    yy += 26;
  }
  txt('all three are at right angles', x, y + h/2 - 14,
      {size:10.5, col:PAL.muted, weight:600});
}

/* ============================================================
   SIDE PANEL — Data (controls + live readings) and Info (the physics)
   Numbers are rendered into <span id> placeholders and PATCHED from the
   animation loop, never rebuilt, so a slider the user is dragging is
   never replaced under their finger and no readout can go stale.

const cmOf = px => (px*M_PER_PX*100);
/* a compass bearing for the field direction, measured the way a student
   reads it off the canvas: 0° pointing right, positive clockwise */
function dirText(b){
  const m = Math.hypot(b.x, b.y);
  if(!(m > 0)) return '—';
  let a = Math.atan2(b.y, b.x)*180/Math.PI;
  if(a < 0) a += 360;
  const names = ['right','down-right','down','down-left','left','up-left','up','up-right'];
  return a.toFixed(0) + '° (' + names[Math.round(a/45)%8] + ')';
}
function sectionField(x, y){
  if(S.sec === 'magnets') return magField(x, y);
  if(S.sec === 'electro') return elField(x, y);
  return motorField(x, y);
}

/* ---------------- live patching ---------------- */
function setTxt(id, s, cls){
  const el = $(id); if(!el) return;
  el.innerHTML = s;
  if(cls !== undefined){
    el.className = el.className.replace(/\bv-[a-z]+\b/g, '').trim();
    if(cls) el.classList.add(cls);
  }
}
function patchPanel(){
  if(S.panelTab !== 'data' || S.mode !== 'sim') return;
  if(S.sec === 'magnets')      patchMagnets();
  else if(S.sec === 'electro') patchElectro();
  else                         patchMotor();
}
function patchMagnets(){
  const b = magField(S.compass.x, S.compass.y);
  const m = Math.hypot(b.x, b.y);
  setTxt('kPos', cmOf(S.compass.x).toFixed(1) + ', ' + cmOf(S.compass.y).toFixed(1));
  setTxt('kDir', dirText(b));
  setTxt('kStr', m > 0 ? (m/1.0e-4).toFixed(2) + ' × (1 cm from a pole)' : 'zero');
  setTxt('kNP', String(M_CACHE.np.length));
  if($('kFace')){
    const like = S.pair !== 'ns';
    setTxt('kFace', S.pair === 'ns' ? 'N and S — unlike' : S.pair === 'nn' ? 'N and N — like' : 'S and S — like');
    setTxt('kResult', like ? 'they REPEL' : 'they ATTRACT', like ? 'v-n' : 'v-force');
  }
  if($('kMat')){
    const mat = MAT[S.mat];
    setTxt('kMat', mat.name);
    setTxt('kAttr', mat.magnetic ? 'yes' : 'no', mat.magnetic ? 'v-force' : '');
    setTxt('kHard', mat.magnetic ? (mat.hard ? 'hard — it keeps it' : 'soft — it loses it') : '—');
    setTxt('kMag', Math.round(S.matMag*100) + ' %');
    setTxt('matNote', mat.note);
  }
}
function patchElectro(){
  if($('kCur')) setTxt('kCur', S.eI.toFixed(1));
  if($('kDirI')) setTxt('kDirI',
    (S.emode === 'wire' && S.wireView === 'side')
      ? (S.eDir > 0 ? 'up the wire' : 'down the wire')
      : (S.eDir > 0 ? 'out of the page' : 'into the page'));
  if($('kPos')) setTxt('kPos', cmOf(S.compass.x).toFixed(1) + ', ' + cmOf(S.compass.y).toFixed(1) + ' cm');
  if($('kDir')) setTxt('kDir', dirText(elField(S.compass.x, S.compass.y)));
  if(S.emode === 'wire' && $('kB')) setTxt('kB', fmtB(wireB_SI(S.eI, 122)));
  if(S.emode === 'solenoid'){
    const so = elSolenoid();
    setTxt('kTurns', String(so.turns));
    setTxt('kCore', so.core ? 'iron' : 'air');
    const n = so.turns/(so.len*M_PER_PX);
    setTxt('kn', n.toFixed(0) + ' turns m⁻¹');
    setTxt('kB', fmtB(solenoidB_SI(so)));
    setTxt('kNorth', so.I === 0 ? 'no current — no poles'
                                : (solenoidNorthIsRight(so) ? 'right-hand end' : 'left-hand end'));
    const w = $('wk');
    if(w) w.innerHTML =
      mathLine('B = \\mu_0\\,n\\,I' + (so.core ? '\\,\\mu_r' : ''),
               'B = mu0 x n x I' + (so.core ? ' x mu_r' : '')) +
      mathLine('n = \\dfrac{N}{L} = \\dfrac{' + so.turns + '}{' + (so.len*M_PER_PX).toFixed(2) +
               '\\,\\text{m}} = ' + n.toFixed(0) + '\\ \\text{m}^{-1}',
               'n = N/L = ' + so.turns + ' / ' + (so.len*M_PER_PX).toFixed(2) + ' m = ' + n.toFixed(0) + ' per m') +
      mathLine('B = ' + fmtB(solenoidB_SI(so)).replace('µ', '\\mu '),
               'B = ' + fmtB(solenoidB_SI(so)));
  }
  if(S.emode === 'relay'){
    const on = S.relayArm > 0.5;
    setTxt('kRelayI', S.relaySw ? (S.relayI*100).toFixed(0) + ' % of full' : 'none — switch open');
    setTxt('kArm', on ? 'pulled in' : 'held back by the spring');
    setTxt('kCon', on ? 'closed' : 'open', on ? 'v-force' : '');
    setTxt('kOut', on ? 'complete — lamp lit' : 'broken — lamp off', on ? 'v-force' : '');
  }
}
function patchMotor(){
  const FN = forceN(), F = motorForceDir(uniformB(), S.oDirI);
  setTxt('kB', String(S.oB)); setTxt('kI', S.oI.toFixed(1)); setTxt('kL', S.oL.toFixed(1));
  setTxt('kF', fmtF(FN));
  setTxt('kDirI', S.oDirI > 0 ? 'out of the page' : 'into the page');
  setTxt('kDirB', S.oDirB > 0 ? 'left to right (N on the left)' : 'right to left (N on the right)');
  setTxt('kDirF', FN > 0 ? dirText(F) : 'no force');
  if($('kComm')) setTxt('kComm', S.comm ? 'split ring — fitted' : 'OFF — slip rings only',
                        S.comm ? 'v-force' : 'v-n');
  if($('kRPS')) setTxt('kRPS', (Math.abs(S.coilW)/TAU).toFixed(2) + ' rev s⁻¹');
  const w = $('wk');
  if(w) w.innerHTML =
    mathLine('F = B\\,I\\,L', 'F = B x I x L') +
    mathLine('F = ' + (S.oB/1000).toFixed(3) + '\\,\\text{T} \\times ' + S.oI.toFixed(1) +
             '\\,\\text{A} \\times ' + (S.oL/100).toFixed(3) + '\\,\\text{m}',
             'F = ' + (S.oB/1000).toFixed(3) + ' T x ' + S.oI.toFixed(1) + ' A x ' +
             (S.oL/100).toFixed(3) + ' m') +
    mathLine('F = ' + fmtF(FN).replace('µ', '\\mu '), 'F = ' + fmtF(FN));
}

  $('pane-info').innerHTML = h;

}

/* ============================================================
   BOOT — physics step dispatch, event wiring, start
   ============================================================ */
function stepSim(dt){
  if(S.mode !== 'sim') return;
  if(S.sec === 'magnets')      stepMagnets(dt);
  else if(S.sec === 'electro') stepElectro(dt);
  else                         stepMotor(dt);
}

function bindPills(sel, attr, cb){
  document.querySelectorAll(sel).forEach(b => b.onclick = () => {
    b.parentElement.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    cb(b.dataset[attr], b);
    clickSnd();
  });
}
const setActive = (sel, val, attr) =>
  document.querySelectorAll(sel).forEach(b => b.classList.toggle('active', b.dataset[attr] === String(val)));

/* ---------- mode + section ---------- */
function setMode(m){
  S.mode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  /* the section-tab row is LOCKED, never removed: hiding it would shrink the
     chrome and move the canvas */
  $('secTabs').classList.toggle('locked', m !== 'sim');
  if(m !== 'sim') S.panelTab = 'answer';
  else if(S.panelTab === 'answer') S.panelTab = 'data';
  resetZoom(); updatePanel(); draw();
}
function setSection(sec){
  S.sec = sec;
  document.querySelectorAll('[data-sec]').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  ['magnets','electro','motor'].forEach(k => $('slot-' + k).classList.toggle('on', k === sec));
  /* park the compass somewhere useful for the section you have just opened */
  S.compass.x = sec === 'magnets' ? 600 : sec === 'electro' ? 830 : (S.omode === 'motor' ? 210 : 440);
  S.compass.y = sec === 'magnets' ? 520 : sec === 'electro' ? 560 : (S.omode === 'motor' ? 470 : 232);
  S.compass.w = 0;
  resetZoom(); syncGroups(); syncToolbar(); updatePanel(); draw();
}
/* toolbar groups that do not apply to the current sub-mode leave the row, so
   the groups after them close up.  The row height is fixed, so nothing below
   can move whichever combination is showing. */
function syncGroups(){
  const g = (id, on) => { const e = $(id); if(e) e.classList.toggle('hid', !on); };
  g('grp-mshow',  true);
  g('grp-mearth', S.mmode === 'pattern');
  g('grp-mpair',  S.mmode === 'pair');
  g('grp-mmat',   S.mmode === 'materials');

  g('grp-eshow',  S.emode !== 'relay');
  g('grp-eview',  S.emode === 'wire');
  g('grp-egrip',  S.emode === 'wire' || S.emode === 'solenoid');
  g('grp-erev',   S.emode !== 'relay');
  g('grp-ecore',  S.emode === 'solenoid');

  g('grp-orev',   true);
  /* the 3-D force view is a perspective diagram, not a field-mapping bench,
     so a draggable plotting compass has no meaning in it.  The pill is
     dimmed and made inert there rather than left silently doing nothing. */
  /* The plotting compass, and the filings/lines choice, only mean something
     in a view that shows the plane the field lies in.  In the 3-D force view
     and in the wire's side view they are dimmed and made inert rather than
     left silently doing nothing. */
  const flat = (S.sec === 'motor' && S.omode === 'force') ||
               (S.sec === 'electro' && S.emode === 'wire' && S.wireView === 'side');
  const cp = document.querySelector('[data-show="compass"]');
  if(cp) cp.classList.toggle('locked', flat);
  document.querySelectorAll('[data-eshow]').forEach(b =>
    b.classList.toggle('locked', S.emode === 'wire' && S.wireView === 'side'));
  g('grp-olhr',   S.omode !== 'motor');
  g('grp-omotor', S.omode === 'motor');
}
/* keep every toggle button's on/off look in step with the state it reflects */
function syncToolbar(){
  const on = (id, v) => { const e = $(id); if(e) e.classList.toggle('on', !!v); };
  on('earthBtn', S.earth);
  on('gripBtn', S.grip);
  on('coreBtn', S.core);
  on('lhrBtn', S.lhr);
  on('motorRun', S.motorRun);
  on('commBtn', S.comm);
  on('animBtn', S.anim);
  on('soundBtn', S.sound);
  $('animBtn').textContent = S.anim ? '▶ Animation' : '⏸ Animation';
  $('soundBtn').textContent = S.sound ? '🔊 Sound' : '🔇 Sound';
}

/* ---------- reset, scoped to the section on screen ---------- */
function resetSection(){
  resetZoom();
  if(S.sec === 'magnets'){
    S.mag = {x:600, y:MG.cy, len:290, h:62, m:1, flip:false};
    S.magA = {x:400, y:MG.cy, len:230, h:56, m:1, flip:false};
    S.magB = {x:800, y:MG.cy, len:230, h:56, m:1, flip:false};
    S.earth = false; S.matD = 210; S.matMag = 0; S.matAnim = 0;
    S.compass.x = 600; S.compass.y = 520;
    M_CACHE.sig = '';
  }else if(S.sec === 'electro'){
    S.eI = 4; S.eDir = 1; S.turns = 9; S.core = false; S.grip = false;
    S.wireView = 'end';
    setActive('[data-wview]', 'end', 'wview');
    S.relaySw = false; S.relayI = 0.75; S.relayArm = 0;
    S.compass.x = 830; S.compass.y = 560;
    E_CACHE.sig = '';
  }else{
    S.oB = 60; S.oI = 3; S.oL = 8; S.oDirI = -1; S.oDirB = 1;
    S.lhr = false; S.coilTh = 0.35; S.coilW = 0; S.motorRun = true; S.comm = true;
    S.compass.x = S.omode === 'motor' ? 210 : 440;
    S.compass.y = S.omode === 'motor' ? 470 : 232;
  }
  S.compass.w = 0;
  syncGroups(); syncToolbar(); updatePanel(); draw(); clickSnd();
}

/* ---------- toolbar wiring ---------- */
bindPills('[data-mode]', 'mode', v => setMode(v));
document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { setSection(b.dataset.sec); clickSnd(); });

bindPills('[data-mmode]', 'mmode', v => { S.mmode = v; M_CACHE.sig = ''; syncGroups(); updatePanel(); draw(); });
bindPills('[data-mshow]', 'mshow', v => { S.mshow = v; M_CACHE.sig = ''; draw(); });
bindPills('[data-pair]',  'pair',  v => { S.pair = v; syncPair(); M_CACHE.sig = ''; updatePanel(); draw(); });
bindPills('[data-emode]', 'emode', v => { S.emode = v; E_CACHE.sig = ''; syncGroups(); updatePanel(); draw(); });
bindPills('[data-eshow]', 'eshow', v => { S.eshow = v; draw(); });
bindPills('[data-wview]', 'wview', v => { S.wireView = v; syncGroups(); updatePanel(); draw(); });
bindPills('[data-omode]', 'omode', v => {
  S.omode = v; S.coilW = 0;
  /* park the compass where it can actually read something and is not buried
     under the apparatus: inside the pole gap for the two static sub-modes,
     out on the bench for the motor, whose coil sweeps the whole gap */
  S.compass.x = v === 'motor' ? 210 : 440;
  S.compass.y = v === 'motor' ? 470 : 232;
  S.compass.w = 0;
  syncGroups(); updatePanel(); draw();
});
bindPills('[data-speed]', 'speed', v => { S.speed = +v; });
/* the Show pills are independent toggles, not a radio group, so they get
   their own handler rather than bindPills' one-of-many behaviour */
document.querySelectorAll('[data-show]').forEach(b => b.onclick = () => {
  b.classList.toggle('active');
  S.show[b.dataset.show] = b.classList.contains('active');
  clickSnd(); updatePanel(); draw();
});

const tog = (id, get, set) => { const e = $(id); if(e) e.onclick = () => {
  set(!get()); syncToolbar(); updatePanel(); draw(); clickSnd(); }; };
tog('earthBtn', () => S.earth, v => { S.earth = v; M_CACHE.sig = ''; });
tog('gripBtn',  () => S.grip,  v => { S.grip = v; });
tog('coreBtn',  () => S.core,  v => { S.core = v; E_CACHE.sig = ''; });
tog('lhrBtn',   () => S.lhr,   v => { S.lhr = v; });
tog('motorRun', () => S.motorRun, v => { S.motorRun = v; });
tog('commBtn',  () => S.comm,  v => { S.comm = v; });
tog('animBtn',  () => S.anim,  v => { S.anim = v; });
tog('soundBtn', () => S.sound, v => { S.sound = v; });

$('eRevBtn').onclick = () => { S.eDir = -S.eDir; E_CACHE.sig = ''; updatePanel(); draw(); clickSnd(); };
$('oRevI').onclick  = () => { S.oDirI = -S.oDirI; S.oKick = 1; updatePanel(); draw(); clickSnd(); };
$('oRevB').onclick  = () => { S.oDirB = -S.oDirB; S.oKick = 1; updatePanel(); draw(); clickSnd(); };
$('resetBtn').onclick = resetSection;
$('themeSel').onchange = e => setTheme(e.target.value);

/* material selector */
{
  const sel = $('matSel');
  sel.innerHTML = MATERIALS.map(m => '<option value="' + m.id + '">' + m.name + '</option>').join('');
  sel.value = S.mat;
  sel.onchange = () => { S.mat = sel.value; S.matMag = 0; M_CACHE.sig = ''; updatePanel(); draw(); };
}
$('matTest').onclick = () => { S.matD = Math.max(8, S.matD*0.45); updatePanel(); draw(); clickSnd(); };
$('matStroke').onclick = doStroke;
$('matWipe').onclick = doWipe;
function doStroke(){
  const mat = MAT[S.mat];
  if(!mat.magnetic){ S.warn = 1; thunk(); return; }
  S.matStrokes++;
  S.matMag = Math.min(1, S.matMag + 0.34);
  M_CACHE.sig = ''; updatePanel(); draw(); beep(660, 0.09, 'triangle', 0.05);
}
function doWipe(){
  S.matMag = 0; S.matStrokes = 0; S.matAnim = 1;
  M_CACHE.sig = ''; updatePanel(); draw(); beep(180, 0.16, 'sawtooth', 0.06);
}

/* ---------- Data-tab controls, rebound every time the panel is rebuilt ---------- */
function bindDataControls(){
  const b = (id, fn) => { const e = $(id); if(e) e.onclick = () => { fn(); clickSnd(); }; };

  /* magnets */
  b('btnFlip',   () => { S.mag.flip = !S.mag.flip; M_CACHE.sig = ''; updatePanel(); draw(); });
  b('btnEarth2', () => { S.earth = !S.earth; M_CACHE.sig = ''; syncToolbar(); updatePanel(); draw(); });
  b('btnCentre', () => { S.mag.x = 600; S.mag.y = MG.cy; M_CACHE.sig = ''; draw(); });
  b('btnStroke2', doStroke);
  b('btnWipe2',   doWipe);
  bindSlider('mGap', {min:1, max:36, step:0.1, unit:'cm'}, v => {
    const gap = v/100/M_PER_PX;
    const mid = 600;
    S.magA.x = mid - gap/2 - S.magA.len/2;
    S.magB.x = mid + gap/2 + S.magB.len/2;
    M_CACHE.sig = '';
  });
  bindSlider('mDist', {min:0.4, max:34, step:0.1, unit:'cm'}, v => {
    S.matD = v/100/M_PER_PX; M_CACHE.sig = '';
  });

  /* electromagnets */
  bindSlider('eI', {min:0, max:10, step:0.1, unit:'A'}, v => { S.eI = v; E_CACHE.sig = ''; });
  bindSlider('eN', {min:3, max:22, step:1, unit:''},    v => { S.turns = Math.round(v); E_CACHE.sig = ''; });
  bindSlider('rI', {min:0, max:100, step:1, unit:'%'},  v => { S.relayI = v/100; E_CACHE.sig = ''; });
  b('btnCore2',  () => { S.core = !S.core; E_CACHE.sig = ''; syncToolbar(); updatePanel(); draw(); });
  b('btnERev2',  () => { S.eDir = -S.eDir; E_CACHE.sig = ''; updatePanel(); draw(); });
  b('btnGrip2',  () => { S.grip = !S.grip; syncToolbar(); updatePanel(); draw(); });
  b('btnRelaySw',() => { S.relaySw = !S.relaySw; E_CACHE.sig = ''; updatePanel(); draw(); });

  /* motor effect */
  bindSlider('oB', {min:0, max:200, step:1, unit:'mT'}, v => { S.oB = Math.round(v); });
  bindSlider('oI', {min:0, max:8, step:0.1, unit:'A'},  v => { S.oI = v; });
  bindSlider('oL', {min:2, max:12, step:0.1, unit:'cm'},v => { S.oL = v; });
  b('btnRevI2', () => { S.oDirI = -S.oDirI; S.oKick = 1; updatePanel(); draw(); });
  b('btnRevB2', () => { S.oDirB = -S.oDirB; S.oKick = 1; updatePanel(); draw(); });
  b('btnLhr2',  () => { S.lhr = !S.lhr; syncToolbar(); updatePanel(); draw(); });
  b('btnRun2',  () => { S.motorRun = !S.motorRun; syncToolbar(); updatePanel(); draw(); });
  b('btnComm2', () => { S.comm = !S.comm; syncToolbar(); updatePanel(); draw(); });
  b('btnKick',  () => { S.oKick = 1; });
}

/* ---------- panel tabs ---------- */
document.querySelectorAll('[data-ptab]').forEach(t => t.onclick = () => {
  S.panelTab = t.dataset.ptab; updatePanel(); clickSnd();
});

/* ---------- canvas pointer: drag the apparatus, the compass, zoom and pan ---------- */
let drag = null;
const near = (L, x, y, r) => Math.hypot(L.x - x, L.y - y) < r;

CV.addEventListener('pointerdown', e => {
  if(S.mode !== 'sim') return;
  try{ CV.setPointerCapture(e.pointerId); }catch(_){}
  const L = toLogical(e);
  if(S.zoom.k > 1){ S.zoom.panning = true; S.zoom.px = e.clientX; S.zoom.py = e.clientY; return; }

  /* the compass is small and sits on top of everything, so it is tested first */
  if(S.show.compass && near(L, S.compass.x, S.compass.y, 32)){
    drag = {kind:'compass', dx:L.x - S.compass.x, dy:L.y - S.compass.y};
    return;
  }
  if(S.sec === 'magnets'){
    if(S.mmode === 'pattern' && inMagnet(L, S.mag)){
      drag = {kind:'mag', o:S.mag, dx:L.x - S.mag.x, dy:L.y - S.mag.y}; return;
    }
    if(S.mmode === 'pair'){
      for(const m of [S.magA, S.magB])
        if(inMagnet(L, m)){ drag = {kind:'mag', o:m, dx:L.x - m.x, dy:L.y - m.y}; return; }
    }
    if(S.mmode === 'materials' && inMagnet(L, MAT_MAG)){
      drag = {kind:'testmag', dx:L.x - MAT_MAG.x}; return;
    }
  }
});
function inMagnet(L, m){
  return Math.abs(L.x - m.x) < m.len/2 + 8 && Math.abs(L.y - m.y) < m.h/2 + 8;
}
CV.addEventListener('pointermove', e => {
  if(S.zoom.panning){
    S.zoom.ox += (e.clientX - S.zoom.px)/VT.s;
    S.zoom.oy += (e.clientY - S.zoom.py)/VT.s;
    S.zoom.px = e.clientX; S.zoom.py = e.clientY;
    clampPan(); draw(); return;
  }
  if(!drag) return;
  const L = toLogical(e);
  if(drag.kind === 'compass'){
    S.compass.x = Math.max(40, Math.min(W-40, L.x - drag.dx));
    S.compass.y = Math.max(90, Math.min(H-40, L.y - drag.dy));
  }else if(drag.kind === 'mag'){
    const m = drag.o;
    m.x = Math.max(m.len/2 + 30, Math.min(W - m.len/2 - 30, L.x - drag.dx));
    m.y = Math.max(MG.box.y0 + m.h/2 + 6, Math.min(MG.box.y1 - m.h/2 - 6, L.y - drag.dy));
    if(S.mmode === 'pair'){
      /* the two magnets must not pass through one another */
      const lim = 8;
      if(m === S.magA) m.x = Math.min(m.x, S.magB.x - S.magB.len/2 - m.len/2 - lim);
      else             m.x = Math.max(m.x, S.magA.x + S.magA.len/2 + m.len/2 + lim);
      m.y = MG.cy;
    }
    M_CACHE.sig = '';
  }else if(drag.kind === 'testmag'){
    const g = sampleGeom();
    const wantX = L.x - drag.dx;
    S.matD = Math.max(4, Math.min(340, (g.x - g.w/2) - (wantX + MAT_MAG.len/2)));
    M_CACHE.sig = '';
  }
  patchPanel(); draw();
});
function endPointer(){
  if(drag) updatePanel();
  drag = null; S.zoom.panning = false;
  draw();
}
CV.addEventListener('pointerup', endPointer);
CV.addEventListener('pointercancel', endPointer);
CV.addEventListener('dblclick', e => {
  if(S.mode !== 'sim') return;
  if(drag) return;
  setZoom(S.zoom.k > 1 ? 1 : 2, toLogical(e));
});
CV.addEventListener('contextmenu', e => { e.preventDefault(); resetSection(); });
/* middle click cancels whatever is half-done, and never deletes anything */
CV.addEventListener('auxclick', e => {
  if(e.button !== 1) return;
  e.preventDefault();
  drag = null; S.zoom.panning = false; resetZoom(); draw();
});

/* keyboard: Space plays/pauses, arrows change section */
window.addEventListener('keydown', e => {
  const t = (e.target.tagName || '').toUpperCase();
  if(t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA' || t === 'BUTTON') return;
  if(e.code === 'Space'){ e.preventDefault(); $('animBtn').click(); }
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    const order = ['magnets','electro','motor'];
    let i = order.indexOf(S.sec) + (e.key === 'ArrowRight' ? 1 : -1);
    i = (i + order.length) % order.length;
    setSection(order[i]); clickSnd();
  }
  if(e.key === 'Escape') resetZoom();
});

/* ---------- start ---------- */
readPalette();
new ResizeObserver(() => resize()).observe(CV.parentElement);
window.addEventListener('resize', resize);
resize();
syncPair();
syncGroups();
syncToolbar();
updatePanel();
requestAnimationFrame(t => { last = t; tick(t); });
/* KaTeX is deferred; once it lands, re-render so the plain-text twins are
   replaced by typeset maths */
window.addEventListener('load', () => { if(typeof katex !== 'undefined') updatePanel(); });
</script>
