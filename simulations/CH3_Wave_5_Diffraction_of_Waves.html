<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diffraction of Waves — Ripple Tank &amp; Sound | HAUS Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f172a; --card:#1e293b; --border:#334155;
  --text:#e2e8f0; --text-dim:#94a3b8; --text-muted:#64748b;
  --accent:#e3b341; --accent-glow:rgba(227,179,65,0.12);
  --grid:#1e293b; --graph-bg:#0a0f1a;
  --green:#34d399; --rose:#fb7185; --violet:#a78bfa;
  --amber:#fbbf24; --blue:#38bdf8; --orange:#fb923c;
  --wave:#38bdf8; --barrier:#64748b; --water:#0d1b2e;
}
.theme-hausnight{
  --bg:#1a1c20; --card:#26282d; --border:#3a3c42;
  --text:#FFFFFF; --text-dim:#e0e2e8; --text-muted:#a8aab2;
  --accent:#F4C01E; --accent-glow:rgba(244,192,30,0.10);
  --grid:#2a2c32; --graph-bg:#121418;
  --green:#A6B36A; --rose:#D68B57; --violet:#CBAA6A;
  --amber:#F4C01E; --blue:#5FB0C4; --orange:#D68B57;
  --wave:#5FB0C4; --barrier:#6a6c74; --water:#151a20;
}
.theme-neon{
  --bg:#0d0f1a; --card:#1a1c2e; --border:#2a2d4a;
  --text:#e0e0f0; --text-dim:#8888b8; --text-muted:#5a5a8a;
  --accent:#00ffc8; --accent-glow:rgba(0,255,200,0.1);
  --grid:#1a1c2e; --graph-bg:#080a14;
  --green:#00ff88; --rose:#ff4499; --violet:#8844ff;
  --amber:#ffcc00; --blue:#4488ff; --orange:#ff6633;
  --wave:#00e5ff; --barrier:#4a4d6a; --water:#0b1020;
}
.theme-light{
  --bg:#ffffff; --card:#f3f4f6; --border:#d1d5db;
  --text:#111827; --text-dim:#4b5563; --text-muted:#9ca3af;
  --accent:#2563eb; --accent-glow:rgba(37,99,235,0.1);
  --grid:#e5e7eb; --graph-bg:#f9fafb;
  --green:#059669; --rose:#dc2626; --violet:#7c3aed;
  --amber:#d97706; --blue:#2563eb; --orange:#ea580c;
  --wave:#1d4ed8; --barrier:#6b7280; --water:#eef4fb;
}
.theme-haus{
  --bg:#F4EEE0; --card:#FFFFFF; --border:#E4DAC4;
  --text:#1A1712; --text-dim:#5B5344; --text-muted:#948A74;
  --accent:#A9820F; --accent-glow:rgba(169,130,15,0.12);
  --grid:#EBE3D0; --graph-bg:#FCFAF2;
  --green:#4E7A3F; --rose:#B5502E; --violet:#8A6D3B;
  --amber:#A9820F; --blue:#4A7AB8; --orange:#A87A4A;
  --wave:#3F6FA8; --barrier:#8A8070; --water:#F2F6FB;
}
.theme-clay{
  --bg:#d4c8be; --card:#e5d9d0; --border:#c2b5aa;
  --text:#2d2622; --text-dim:#6a5a4d; --text-muted:#928078;
  --accent:#a55a3a; --accent-glow:rgba(165,90,58,0.1);
  --grid:#ccbfb5; --graph-bg:#eee6de;
  --green:#5a7a4a; --rose:#a03a3a; --violet:#6a4d7a;
  --amber:#b07a2a; --blue:#3a5a7a; --orange:#b05a2a;
  --wave:#2f5570; --barrier:#7a6a5d; --water:#e6ecef;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  height:100vh; overflow:hidden; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ---------- top bar ---------- */
.top-bar{
  flex:0 0 auto; display:flex; align-items:center; gap:12px;
  padding:0 14px; box-shadow:inset 0 -1px 0 var(--border); background:var(--card);
}
.top-bar h1{font-size:18px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.top-bar h1 span.sub{font-size:11px;font-weight:500;color:var(--text-dim)}
.badge-top{
  font-family:'JetBrains Mono',monospace; font-size:9px;
  padding:2px 8px; border-radius:12px;
  background:var(--accent-glow); color:var(--accent); border:1px solid var(--accent);
}
.spacer{flex:1 1 auto}
.top-right{display:flex;align-items:center;gap:10px}
/* HEADER ZONE standard: no Practice / Quiz in this simulation, so the
   Simulate / Practice / Quiz panel is omitted entirely (never a lone tab). */
.theme-select{
  background:var(--card); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:4px 10px; cursor:pointer; outline:none;
  font-family:'JetBrains Mono',monospace; font-size:11px; min-width:110px;
}
.brand{
  background:#F4C01E; border-radius:10px; padding:7px 8px;
  box-shadow:0 2px 6px rgba(0,0,0,.25); display:flex; align-items:center;
}
@media(max-width:640px){ .brand{display:none;} }
.theme-haus .top-bar h1, .theme-haus .top-bar h1 span{color:#1A1712;}
.theme-haus .badge-top{background:#F4C01E;color:#1A1712;border-color:#1A1712;}
.theme-hausnight .top-bar h1, .theme-hausnight .top-bar h1 span{color:#FFFFFF;}

/* ---------- mode bar: equal columns filling the width ---------- */
.modebar{flex:0 0 auto; padding:8px 12px 0}
.tabs2{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.tabs2 .tab{
  width:100%; border-radius:12px; border:1px solid var(--border);
  background:var(--card); color:var(--text-dim);
  font-family:'Inter',sans-serif; font-size:14px; font-weight:700;
  padding:9px 0; cursor:pointer; transition:.15s;
}
.tabs2 .tab:hover{color:var(--text); border-color:var(--text-muted)}
.tabs2 .tab.active{background:var(--accent-glow); border-color:var(--accent); color:var(--accent)}

/* ---------- toolbar ---------- */
.toolbar{
  flex:0 0 auto; margin:9px 12px 0; padding:5px 12px;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:30px;padding:1px 0}
.tgroup{display:flex;align-items:center;gap:5px}
.tlabel{font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text-muted);margin-right:2px}
.tsep{width:1px;align-self:stretch;background:var(--border);margin:2px 3px}
.tbtn{
  background:var(--bg); color:var(--text-dim); border:1px solid var(--border);
  border-radius:7px; padding:4px 9px; font-size:11px; font-weight:600;
  font-family:'Inter',sans-serif; cursor:pointer; transition:.14s; white-space:nowrap;
}
.tbtn:hover{color:var(--text);border-color:var(--text-muted)}
.tbtn.on{background:var(--accent);color:#0b1020;border-color:var(--accent)}
.tbtn.primary{background:var(--blue);color:#04121c;border-color:var(--blue)}
.tbtn.primary:hover{filter:brightness(1.1)}
.pills{display:flex;gap:3px}
.pill{
  background:var(--bg); color:var(--text-dim); border:1px solid var(--border);
  border-radius:7px; padding:4px 9px; font-size:11px; font-weight:600;
  font-family:'Inter',sans-serif; cursor:pointer; transition:.14s; white-space:nowrap;
}
.pill:hover{color:var(--text)}
.pill.active{background:var(--amber);color:#1a1200;border-color:var(--amber)}
#speedPills .pill.active{background:var(--accent);color:#0b1020;border-color:var(--accent)}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
  background:var(--border);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px var(--accent-glow);
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border:none;border-radius:50%;background:var(--accent);cursor:pointer;
}
.slval{
  font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;
  color:var(--accent);min-width:64px;display:inline-block;
}

/* ---------- canvas ---------- */
.cvwrap{
  /* height depends ONLY on the window — switching section or toggling a panel
     must never move or resize the drawing area                                */
  flex:0 0 auto;
  height:clamp(220px, min(56vh, calc(100vh - 390px)), 780px);
  margin:9px 12px 0; border:1px solid var(--border); border-radius:14px;
  position:relative; background:var(--graph-bg); overflow:hidden;
}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#cv.dragging{cursor:grabbing}
.ovl{position:absolute;pointer-events:none;display:flex;gap:6px;flex-wrap:wrap}
.ovl.bl{bottom:8px;left:10px}
.ovl.br{bottom:8px;right:10px}
.chip{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;
  background:color-mix(in srgb,var(--card) 88%,transparent);
  border:1px solid var(--border);border-radius:7px;padding:3px 8px;color:var(--text-dim);
}
.chip.k{color:var(--accent);border-color:var(--accent)}
.chip.g{color:var(--green);border-color:var(--green)}
.chip.b{color:var(--blue);border-color:var(--blue)}
.chip.o{color:var(--orange);border-color:var(--orange)}
.chip.zoom{pointer-events:auto;cursor:pointer}

/* ---------- below panel ---------- */
.below{
  flex:1 1 auto; min-height:0; overflow-y:auto;
  background:var(--bg); padding:9px 12px 10px;
}
.below::-webkit-scrollbar{width:9px}
.below::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.ptitle{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted);margin:0 0 5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 9px}
.card .k{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted)}
.card .v{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--text);margin-top:1px}
.card .v.acc{color:var(--accent)}
.card .v.grn{color:var(--green)}
.card .v.blu{color:var(--blue)}
.card .v.ros{color:var(--rose)}
.eqbox{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:6px 11px;margin-bottom:6px;overflow-x:auto;
}
.eqbox .eqrow{display:flex;gap:22px;flex-wrap:wrap;align-items:center;color:var(--text);font-size:13px}
.note{
  background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:8px;padding:7px 11px;font-size:11.5px;line-height:1.5;color:var(--text-dim);
}
.note b{color:var(--text)}
.note .hl{color:var(--accent);font-weight:600}
.hidden{display:none !important}
</style>
</head>

<script>
/* ============================================================
   Diffraction of Waves v1.0.0 — HAUS Academy
   Single-file HTML + Canvas 2D · IGCSE Physics 0625
   ------------------------------------------------------------
   Water waves travel BOTTOM → TOP, so the Compare view can split
   the canvas left / right into two independent ripple tanks.
   ============================================================ */
"use strict";

/* ---------- fixed logical canvas, uniformly letterboxed ---------- */
const PX_PER_CM = 40;
const NX = 11, NY = 5;                 // grid squares each side of the origin
const W = 2*NX*PX_PER_CM;              // 880
const H = 2*NY*PX_PER_CM;              // 400
const CX = NX*PX_PER_CM;               // 440 — x = 0
const CY = NY*PX_PER_CM;               // 200 — y = 0

const BARRIER_Y = CY + PX_PER_CM;      // 240 — the barrier sits one square below centre
const BARRIER_T = 12;

/* water defaults */
const DEF_GAP = 160, DEF_GAP2 = 60, DEF_LAMBDA = 60, DEF_AMP = 20;

/* sound: 1 grid square = 1 metre here */
const PX_PER_M = 40, SOUND_SPEED = 340;
const DEF_FREQ = 150, FREQ_DRUM = 150, FREQ_GUITAR = 350, FREQ_FLUTE = 800;
const SRC   = { x:120, y:210 };                 // loudspeaker
const BLD   = { x0:520, y0:0, x1:660, y1:250 }; // building, top-down
const CORNER= { x:BLD.x0, y:BLD.y1 };           // the diffracting edge
const DEF_LISTENER = { x:752, y:126 };

/* ---------- state ---------- */
function mkS(){
  return {
    section:"water", theme:"dark",
    /* water */
    gap:DEF_GAP, gap2:DEF_GAP2, lambda:DEF_LAMBDA, lam2:DEF_LAMBDA*2, amp:DEF_AMP,
    compare:false, cmpBy:"gap",        // compare tanks by "gap" width or by "lam" wavelength
    /* sound */
    freq:DEF_FREQ, instrument:"drum", listener:null,
    /* show toggles */
    labels:true, calc:false, grid:true,
    /* animation */
    playing:true, phase:0, speed:0.5,
    /* view */
    zoom:false, zf:2.5, focus:{x:CX,y:CY}, pan:{x:0,y:0},
    drag:null
  };
}
let S = mkS();

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const fmt  = v => (Math.round(v*10)/10).toFixed(1);
const fmt2 = v => (Math.round(v*100)/100).toFixed(2);
const pxToCm = px => fmt(px/PX_PER_CM);
const pxToM  = px => fmt2(px/PX_PER_M);
const dist = (a,b) => Math.hypot(b.x-a.x, b.y-a.y);
const D2R = Math.PI/180, R2D = 180/Math.PI;

/* ---------- canvas plumbing ---------- */
const cv = $("cv");
const ctx = cv.getContext("2d");
let VS = {s:1, ox:0, oy:0, dpr:1};

function resize(){
  const r = $("cvwrap").getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.max(1, Math.round(r.width  * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  cv.style.width  = r.width  + "px";
  cv.style.height = r.height + "px";
  const s = Math.min(r.width / W, r.height / H);
  VS = { s, ox:(r.width - W*s)/2, oy:(r.height - H*s)/2, dpr };
  draw();
}
function evtPt(e){
  const r = cv.getBoundingClientRect();
  let x = (e.clientX - r.left - VS.ox)/VS.s;
  let y = (e.clientY - r.top  - VS.oy)/VS.s;
  if(S.zoom){
    const f=S.zf, fx=S.focus.x+S.pan.x, fy=S.focus.y+S.pan.y;
    x = (x - (W/2 - fx*f))/f;
    y = (y - (H/2 - fy*f))/f;
  }
  return {x,y};
}

const _colCache = {}; let _colTheme = "";
function col(name){
  if(_colTheme !== S.theme){ _colTheme = S.theme; for(const k in _colCache) delete _colCache[k]; }
  if(_colCache[name]) return _colCache[name];
  const v = getComputedStyle(document.body).getPropertyValue(name).trim() || "#888";
  _colCache[name] = v; return v;
}
function alpha(c, a){
  if(c[0] !== "#") return c;
  const n = parseInt(c.slice(1),16);
  const r = c.length===7 ? (n>>16)&255 : ((n>>8)&15)*17;
  const g = c.length===7 ? (n>>8)&255  : ((n>>4)&15)*17;
  const b = c.length===7 ? n&255       : (n&15)*17;
  return "rgba("+r+","+g+","+b+","+a+")";
}

/* ---------- drawing primitives ---------- */
function line(a,b,color,w,dash){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=w||1.5; ctx.lineCap="round";
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.restore();
}
function arrowHeadAt(p, ang, color, size){
  const s = size||9;
  ctx.save(); ctx.fillStyle=color;
  ctx.translate(p.x,p.y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-s,-s*0.42); ctx.lineTo(-s,s*0.42);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function dot(p,color,r){
  ctx.save(); ctx.fillStyle=color; ctx.beginPath();
  ctx.arc(p.x,p.y,r||3.2,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function label(txt,x,y,color,o){
  o=o||{};
  ctx.save();
  ctx.font = (o.bold===false?"":"700 ") + (o.size||11) + "px " +
             (o.mono===false ? "'Inter',sans-serif" : "'JetBrains Mono',monospace");
  ctx.textAlign = o.align||"center";
  ctx.textBaseline = o.baseline||"middle";
  if(o.bg){
    const m = ctx.measureText(txt);
    const pw = m.width+8, ph=(o.size||11)+7;
    const bx = x - (o.align==="right"?pw-4:(o.align==="left"?4:pw/2));
    const by = y - (o.baseline==="bottom"?ph-3:(o.baseline==="top"?3:ph/2));
    ctx.fillStyle = alpha(col("--graph-bg"),0.82);
    ctx.beginPath(); ctx.roundRect(bx,by,pw,ph,4); ctx.fill();
  }
  if(o.alphaV!=null) ctx.globalAlpha=o.alphaV;
  ctx.fillStyle=color; ctx.fillText(txt,x,y);
  ctx.restore();
}
/* double-headed measurement arrow with a label in the middle */
function measure(a, b, txt, color, o){
  o = o||{};
  const ang = Math.atan2(b.y-a.y, b.x-a.x);
  line(a, b, color, 1.3, null);
  arrowHeadAt(a, ang+Math.PI, color, 7);
  arrowHeadAt(b, ang, color, 7);
  /* small end ticks */
  const n = {x:-Math.sin(ang)*5, y:Math.cos(ang)*5};
  line({x:a.x-n.x,y:a.y-n.y},{x:a.x+n.x,y:a.y+n.y}, color, 1.1);
  line({x:b.x-n.x,y:b.y-n.y},{x:b.x+n.x,y:b.y+n.y}, color, 1.1);
  if(txt) label(txt, (a.x+b.x)/2 + (o.dx||0), (a.y+b.y)/2 + (o.dy||0), color, {size:o.size||10, bg:true});
}
/* arc between two absolute angles, shorter sweep */
function angleArc(c, a1, a2, r, color, txt){
  let d = a2-a1;
  while(d> Math.PI) d-=2*Math.PI;
  while(d<-Math.PI) d+=2*Math.PI;
  if(Math.abs(d) < 0.03) return;
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=1.4; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.arc(c.x,c.y,r,a1,a1+d,d<0); ctx.stroke(); ctx.restore();
  if(txt && S.labels){
    const m=a1+d/2;
    label(txt, c.x+(r+14)*Math.cos(m), c.y+(r+14)*Math.sin(m), color, {size:10, bg:true});
  }
}

/* ============================================================
   background: grid + cm labels
   ============================================================ */
function drawBg(){
  ctx.fillStyle = col("--graph-bg");
  ctx.fillRect(-2000,-2000, W+4000, H+4000);
  if(S.grid){
    ctx.save();
    ctx.strokeStyle = col("--grid"); ctx.lineWidth=1; ctx.globalAlpha=0.55;
    ctx.beginPath();
    for(let x=0;x<=W;x+=PX_PER_CM){ ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,H); }
    for(let y=0;y<=H;y+=PX_PER_CM){ ctx.moveTo(0,y+0.5); ctx.lineTo(W,y+0.5); }
    ctx.stroke(); ctx.restore();
    drawScaleLabels();
  }
}
function drawScaleLabels(){
  const unit = S.section === "sound" ? "m" : "cm";
  ctx.save();
  ctx.font="9px 'JetBrains Mono',monospace";
  ctx.textAlign="center"; ctx.textBaseline="bottom";
  const y = H-46;
  for(let k=-NX+1;k<=NX-1;k++){
    if(k%2!==0) continue;
    ctx.globalAlpha = (k===0)?0.95:0.5;
    ctx.fillStyle = (k===0)?col("--accent"):col("--text-muted");
    ctx.fillText(String(k), CX + k*PX_PER_CM, y);
  }
  ctx.globalAlpha=0.5; ctx.fillStyle=col("--text-muted"); ctx.textAlign="left";
  ctx.fillText(unit, CX + (NX-0.6)*PX_PER_CM, y);
  ctx.textAlign="left"; ctx.textBaseline="middle";
  for(let k=-NY+1;k<=NY-1;k++){
    if(k%2!==0 || k===0) continue;
    ctx.globalAlpha=0.45; ctx.fillStyle=col("--text-muted");
    ctx.fillText(String(-k), 5, CY + k*PX_PER_CM);
  }
  ctx.restore();
  label("1 square = 1 "+unit, W-12, 15, col("--text-muted"),
        {size:9, align:"right", baseline:"middle", alphaV:0.72});
}
/* ============================================================
   SECTION 1 — WATER WAVES (ripple tank)
   ------------------------------------------------------------
   Plane waves travel BOTTOM → TOP through a gap in a barrier.
   Beyond the gap each wavefront is the Huygens offset curve of the
   aperture: a straight crest the width of the gap, capped by arcs of
   radius p centred on the two gap edges, opened out to the spread
   half-angle θ given by  sin θ = λ / w   (θ = 90° once λ ≥ w).
   ONE geometry helper (tanks()) feeds the drawing, the labels and the
   hit-testing, so they can never drift apart.
   ============================================================ */

const TANK_TOP = 6;                       // keep the crests just inside the frame

function tanks(){
  if(!S.compare) return [ { cx:CX, halfW:428, gap:S.gap, lam:S.lambda, head:"" } ];
  const hw = 210, byGap = S.cmpBy === "gap";
  return [
    { cx:CX-215, halfW:hw, gap:S.gap, lam:S.lambda,
      head: byGap ? "Gap A = "+pxToCm(S.gap)+" cm" : "λ A = "+pxToCm(S.lambda)+" cm" },
    { cx:CX+215, halfW:hw, gap: byGap ? S.gap2 : S.gap, lam: byGap ? S.lambda : S.lam2,
      head: byGap ? "Gap B = "+pxToCm(S.gap2)+" cm" : "λ B = "+pxToCm(S.lam2)+" cm" }
  ];
}
/* spread half-angle of the diffracted beam */
const spreadAngle = (lam, gapW) => Math.asin(clamp(lam/gapW, 0, 1));
/* EFFECTIVE half-width of the source line in the gap.
   A gap many wavelengths wide behaves like a line of sources, so the crest keeps a
   straight portion the full width of the gap. As the gap narrows towards λ the gap
   behaves more and more like a SINGLE point source, so that straight portion must
   shrink to nothing — at w = λ the crest is a true semicircle centred on the gap. */
const effHalfGap = (lam, gapW) => (gapW/2) * Math.max(0, 1 - clamp(lam/gapW, 0, 1));

function drawTank(t){
  const WAVE = col("--wave");
  const L = t.cx - t.halfW, R = t.cx + t.halfW;
  const gh = t.gap/2, lam = t.lam;
  const ghE = effHalfGap(lam, t.gap);        // straight part of the crest
  const th = spreadAngle(lam, t.gap);
  const lw = 1.05 + S.amp*0.055;
  const bBot = BARRIER_Y + BARRIER_T;

  /* water */
  ctx.save();
  ctx.fillStyle = col("--water");
  ctx.fillRect(L, TANK_TOP, R-L, H-TANK_TOP-2);
  ctx.strokeStyle = alpha(col("--border"),0.9); ctx.lineWidth=1;
  ctx.strokeRect(L+0.5, TANK_TOP+0.5, R-L-1, H-TANK_TOP-3);
  ctx.restore();

  /* ---- wavefronts ---- */
  const pMin = -(H - bBot) - lam, pMax = Math.hypot(t.halfW, BARRIER_Y) + lam;
  const j0 = Math.floor(S.phase - pMax/lam) - 1;
  const j1 = Math.ceil (S.phase - pMin/lam) + 1;

  for(let j=j0; j<=j1; j++){
    const p = (S.phase - j) * lam;
    if(p < pMin || p > pMax) continue;

    if(p <= 0){
      /* ---- plane crest still approaching the barrier ---- */
      const y = bBot - p;                       // p ≤ 0 ⇒ below the barrier
      if(y > H-4 || y < bBot-1) continue;
      ctx.save();
      ctx.beginPath(); ctx.rect(L+1, bBot, R-L-2, H-bBot-2); ctx.clip();
      line({x:L,y}, {x:R,y}, alpha(WAVE,0.9), lw);
      ctx.restore();
    } else {
      /* ---- diffracted crest: offset curve of the aperture ---- */
      ctx.save();
      ctx.beginPath(); ctx.rect(L+1, TANK_TOP+1, R-L-2, BARRIER_Y-TANK_TOP-1); ctx.clip();
      const yTop = BARRIER_Y - p;
      /* straight portion — shrinks to nothing as the gap narrows towards λ */
      if(ghE > 0.5 && yTop < BARRIER_Y && yTop > TANK_TOP-lam){
        line({x:t.cx-ghE, y:yTop}, {x:t.cx+ghE, y:yTop}, alpha(WAVE,0.9), lw);
      }
      /* two edge arcs, fading as they open out */
      if(th > 0.02){
        const NSEG = 14;
        for(const sgn of [1,-1]){
          const c = { x:t.cx + sgn*ghE, y:BARRIER_Y };
          for(let k=0;k<NSEG;k++){
            const f0 = k/NSEG, f1 = (k+1)/NSEG;
            const a0 = -Math.PI/2 + sgn*th*f0, a1 = -Math.PI/2 + sgn*th*f1;
            const al = 0.9 * (1 - 0.62*((f0+f1)/2));      // intensity falls with angle
            ctx.save();
            ctx.strokeStyle = alpha(WAVE, al); ctx.lineWidth = lw; ctx.lineCap="round";
            ctx.beginPath(); ctx.arc(c.x, c.y, p, a0, a1, sgn<0); ctx.stroke();
            ctx.restore();
          }
        }
      }
      ctx.restore();
    }
  }

  /* ---- barrier ---- */
  ctx.save();
  ctx.fillStyle = col("--barrier");
  ctx.fillRect(L, BARRIER_Y, (t.cx-gh)-L, BARRIER_T);
  ctx.fillRect(t.cx+gh, BARRIER_Y, R-(t.cx+gh), BARRIER_T);
  ctx.fillStyle = alpha("#ffffff", 0.16);
  ctx.fillRect(L, BARRIER_Y, (t.cx-gh)-L, 3);
  ctx.fillRect(t.cx+gh, BARRIER_Y, R-(t.cx+gh), 3);
  ctx.restore();
  /* gap edge grips */
  dot({x:t.cx-gh, y:BARRIER_Y+BARRIER_T/2}, col("--accent"), 3.4);
  dot({x:t.cx+gh, y:BARRIER_Y+BARRIER_T/2}, col("--accent"), 3.4);

  /* ---- direction of travel ---- */
  ctx.save(); ctx.globalAlpha=0.75;
  for(const x of [L+26, R-26]){
    line({x, y:H-14}, {x, y:H-44}, col("--text-muted"), 1.6);
    arrowHeadAt({x, y:H-46}, -Math.PI/2, col("--text-muted"), 7);
  }
  ctx.restore();

  /* ---- labels ---- */
  if(S.labels){
    /* wavelength: between two adjacent approaching crests */
    /* the crests below the barrier sit at bBot + (n + 1 − frac(phase))·λ */
    const dNear = (1 - (S.phase % 1)) * lam;
    const y1 = bBot + dNear, y2 = y1 + lam;
    if(y2 < H-8 && lam > 22){
      measure({x:L+62, y:y1}, {x:L+62, y:y2}, "λ = "+pxToCm(lam)+" cm", col("--accent"), {dx:0});
    }
    /* gap width */
    measure({x:t.cx-gh, y:bBot+26}, {x:t.cx+gh, y:bBot+26},
            "w = "+pxToCm(t.gap)+" cm", col("--green"), {dy:-13});
    /* spread angle */
    if(th > 0.06){
      line({x:t.cx, y:BARRIER_Y}, {x:t.cx, y:BARRIER_Y-104}, col("--text-muted"), 1.1, [4,4]);
      const rr = 86;
      line({x:t.cx, y:BARRIER_Y},
           {x:t.cx + rr*Math.cos(-Math.PI/2+th), y:BARRIER_Y + rr*Math.sin(-Math.PI/2+th)},
           col("--orange"), 1.2, [5,4]);
      angleArc({x:t.cx,y:BARRIER_Y}, -Math.PI/2, -Math.PI/2+th, 58, col("--orange"),
               "θ = "+Math.round(th*R2D)+"°");
    }
    if(t.head) label(t.head, t.cx, TANK_TOP+16, col("--blue"), {size:11, bg:true});
  }
}

function renderWater(){
  const list = tanks();
  list.forEach(drawTank);
  if(S.compare){
    line({x:CX, y:TANK_TOP}, {x:CX, y:H-2}, col("--border"), 2);
  }

  /* ---- panel data (uses the first / wider-context tank) ---- */
  const th  = spreadAngle(S.lambda, S.gap);
  const ratio = S.lambda / S.gap;
  const strong = ratio >= 0.7;
  const level = ratio >= 1 ? "Maximum (semi-circular)"
              : ratio >= 0.5 ? "Strong"
              : ratio >= 0.2 ? "Moderate" : "Slight";
  const fWave = 1.0;                              // ripple-tank frequency is arbitrary; show λ only
  const chips = [
    {t:"Ripple tank · gap diffraction", cls:"b"},
    {t:"w = "+pxToCm(S.gap)+" cm · λ = "+pxToCm(S.lambda)+" cm", cls:"k"},
    {t:"spread θ = "+Math.round(th*R2D)+"°", cls:"o"}
  ];
  if(S.compare) chips.push({t: S.cmpBy==="gap" ? "comparing gap A vs gap B"
                                                : "comparing λ A vs λ B", cls:"g"});

  const tB  = list[list.length-1];
  const th2 = spreadAngle(tB.lam, tB.gap);
  return {
    chips,
    chars:[
      {k:"Diffraction type", v:"Gap (aperture) diffraction", cls:"blu"},
      {k:"Condition", v:"w ≈ λ for maximum spreading"},
      {k:"How much spreading", v:level, cls: strong?"grn":""},
      {k:"IGCSE rule", v:"Narrower gap ⇒ more spreading"}
    ],
    vals: S.compare ? [
      {k:"Gap A (w)", v: pxToCm(S.gap)+" cm", cls:"acc"},
      {k:"λ A", v: pxToCm(S.lambda)+" cm", cls:"blu"},
      {k:"λ/w  (A)", v: fmt2(S.lambda/S.gap)},
      {k:"Spread θ (A)", v: Math.round(th*R2D)+"°", cls:"grn"},
      {k:"Gap B (w)", v: pxToCm(tB.gap)+" cm", cls:"acc"},
      {k:"λ B", v: pxToCm(tB.lam)+" cm", cls:"blu"},
      {k:"λ/w  (B)", v: fmt2(tB.lam/tB.gap)},
      {k:"Spread θ (B)", v: Math.round(th2*R2D)+"°", cls:"grn"}
    ] : [
      {k:"Gap width (w)", v: pxToCm(S.gap)+" cm", cls:"acc"},
      {k:"Wavelength (λ)", v: pxToCm(S.lambda)+" cm", cls:"blu"},
      {k:"λ / w", v: fmt2(ratio)},
      {k:"Spread angle (θ)", v: Math.round(th*R2D)+"°", cls:"grn"},
      {k:"Amplitude", v: pxToCm(S.amp)+" cm"},
      {k:"Wave speed", v:"v = f λ  (unchanged by the gap)"}
    ],
    eq:["\\sin\\theta \\approx \\frac{\\lambda}{w}", "v = f\\lambda",
        "\\theta = "+Math.round(th*R2D)+"^\\circ \\text{ for } \\frac{\\lambda}{w}="+fmt2(Math.min(1,ratio))],
    note:"Straight (<b>plane</b>) water waves travel up the tank and meet a barrier with a gap in it. "+
         "Every point in the gap acts as a new source, so beyond the barrier the wavefronts <b>curve outwards</b> — this is "+
         "<span class='hl'>diffraction</span>. The crest is still straight across the width of the gap and only bends at the two edges, "+
         "which is why a <b>wide gap</b> barely spreads. As the gap is narrowed towards the wavelength the straight part shrinks until the "+
         "wavefronts are almost <b>semi-circular</b>: <span class='hl'>diffraction is greatest when the gap width is about one wavelength</span> "+
         "(w ≈ λ). Making the wavelength longer has the same effect as narrowing the gap — both increase λ/w. "+
         "Note that the <b>wavelength, frequency and speed never change</b> — only the shape of the wavefronts does."
  };
}

/* which tank (if any) is this point in, and is it on a gap edge? */
function gapEdgeHit(p){
  if(S.section !== "water") return null;
  if(p.y < BARRIER_Y-16 || p.y > BARRIER_Y+BARRIER_T+16) return null;
  const list = tanks();
  for(let i=0;i<list.length;i++){
    const t = list[i], gh = t.gap/2;
    if(Math.abs(Math.abs(p.x - t.cx) - gh) < 15) return { idx:i, cx:t.cx };
  }
  return null;
}
/* ============================================================
   SECTION 2 — SOUND WAVES round a building (top-down)
   ------------------------------------------------------------
   Circular wavefronts leave the loudspeaker. The building blocks the
   sector of directions that strike its left face; behind that face is
   the geometric SOUND SHADOW. The corner acts as a Huygens source, so
   fronts continue into the shadow as arcs centred on the corner, of
   radius (r − |source→corner|), out to a penetration angle
        sin θp = λ / (obstacle width)
   — long wavelength (low note) bends far round the corner, short
   wavelength (high note) barely bends at all.
   ============================================================ */

const BLD_W = BLD.x1 - BLD.x0;                    // 140 px = 3.5 m
const SC_LEN = Math.hypot(CORNER.x-SRC.x, CORNER.y-SRC.y);
const A_CORNER = Math.atan2(CORNER.y-SRC.y, CORNER.x-SRC.x);          // shadow boundary
const A_TOPLEFT = Math.atan2(BLD.y0-SRC.y, BLD.x0-SRC.x);             // top of the blocked sector

const lambdaM  = () => SOUND_SPEED / S.freq;                          // metres
const lambdaPx = () => lambdaM() * PX_PER_M;
const penetAngle = () => Math.asin(clamp(lambdaPx()/BLD_W, 0, 1));    // θp, radians
const listenerPt = () => S.listener || DEF_LISTENER;

/* how far into the shadow a point lies, measured at the corner (rad, <0 = lit) */
function shadowDepth(p){
  const a = Math.atan2(p.y-CORNER.y, p.x-CORNER.x);
  return A_CORNER - a;
}
const inBuilding = p => p.x>BLD.x0-4 && p.x<BLD.x1+4 && p.y>BLD.y0-4 && p.y<BLD.y1+4;

function drawSpeaker(p, c){
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.lineJoin="round";
  ctx.beginPath();                                   // box + cone
  ctx.roundRect(-20, -12, 14, 24, 3); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-6,-11); ctx.lineTo(8,-21); ctx.lineTo(8,21); ctx.lineTo(-6,11);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.75;                            // sound puffs
  for(let k=1;k<=3;k++){
    ctx.beginPath(); ctx.arc(9, 0, 6+k*6, -0.75, 0.75); ctx.stroke();
  }
  ctx.restore();
}
/* the listener — a boy's face drawn from a head radius `s`.
   He smiles when the sound reaches him and his mouth goes flat when it does not. */
const BOY_S = 19;
function drawListener(p, c, smiling){
  const s = BOY_S, X = u => p.x + u*s, Y = v => p.y + v*s;
  const lw = Math.max(1.4, s*0.078);
  const bg = alpha(col("--graph-bg"), 0.95);
  ctx.save();
  ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.strokeStyle = c; ctx.lineWidth = lw;

  /* ears */
  for(const sx of [-1,1]){
    ctx.beginPath();
    ctx.arc(X(sx*0.94), Y(0.06), 0.20*s, sx>0 ? -1.35 : Math.PI-1.35, sx>0 ? 1.35 : Math.PI+1.35);
    ctx.fillStyle = bg; ctx.fill(); ctx.stroke();
  }
  /* head */
  ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, Math.PI*2);
  ctx.fillStyle = bg; ctx.fill(); ctx.stroke();
  /* hair: over the crown, then a spiky fringe back across the forehead */
  ctx.beginPath();
  ctx.arc(p.x, p.y, s*1.01, 199*D2R, 351*D2R);
  [[0.62,-0.42],[0.68,-0.66],[0.30,-0.40],[0.36,-0.70],[-0.02,-0.42],
   [0.04,-0.72],[-0.36,-0.44],[-0.30,-0.70],[-0.68,-0.44]]
    .forEach(q => ctx.lineTo(X(q[0]), Y(q[1])));
  ctx.closePath();
  ctx.fillStyle = bg; ctx.fill(); ctx.stroke();
  /* the little tuft on top */
  ctx.beginPath();
  ctx.moveTo(X(0.36), Y(-0.94));
  ctx.quadraticCurveTo(X(0.64), Y(-1.32), X(0.66), Y(-0.90));
  ctx.stroke();
  /* eyes */
  ctx.fillStyle = c;
  for(const sx of [-1,1]){
    ctx.beginPath(); ctx.arc(X(sx*0.34), Y(0.04), 0.115*s, 0, Math.PI*2); ctx.fill();
  }
  /* mouth — smile when he can hear, flat when he cannot */
  ctx.beginPath();
  if(smiling){ ctx.moveTo(X(-0.27), Y(0.36)); ctx.quadraticCurveTo(X(0), Y(0.70), X(0.27), Y(0.36)); }
  else       { ctx.moveTo(X(-0.23), Y(0.48)); ctx.lineTo(X(0.23), Y(0.48)); }
  ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.stroke();
  ctx.restore();
}

function renderSound(){
  const WAVE = col("--wave");
  const lam = lambdaPx(), thP = penetAngle();
  const L = listenerPt();
  const depth = shadowDepth(L);
  const inShadow = depth > 0 && L.x > BLD.x0;
  const heard = !inShadow || depth <= thP;

  /* ---- sound shadow region ---- */
  const bEdgeY = CORNER.y + (W - CORNER.x)*Math.tan(A_CORNER);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(CORNER.x, CORNER.y); ctx.lineTo(W, bEdgeY); ctx.lineTo(W, 0);
  ctx.lineTo(BLD.x1, 0); ctx.lineTo(BLD.x1, BLD.y1); ctx.closePath();
  ctx.fillStyle = alpha(col("--text-muted"), 0.10); ctx.fill();
  ctx.restore();
  line(CORNER, {x:W, y:bEdgeY}, alpha(col("--text-muted"),0.85), 1.3, [6,5]);

  /* ---- wavefronts ---- */
  /* short wavelengths pack many fronts in, so draw them finer and fainter or the
     canvas turns into moiré hatching                                            */
  const lw = clamp(0.8 + lam*0.011, 0.95, 1.75);
  const aMain = clamp(0.34 + lam*0.006, 0.34, 0.85);
  const maxR = Math.min(900, 44*lam + 80);
  const j0 = Math.floor(S.phase - maxR/lam) - 1, j1 = Math.ceil(S.phase) + 1;
  for(let j=j0; j<=j1; j++){
    const r = (S.phase - j) * lam;
    if(r <= 1 || r > maxR) continue;

    /* direct (lit) part: the whole circle except the blocked sector */
    ctx.save();
    ctx.strokeStyle = alpha(WAVE, aMain); ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.arc(SRC.x, SRC.y, r, A_CORNER, A_TOPLEFT + 2*Math.PI);
    ctx.stroke();
    ctx.restore();

    /* diffracted part: arcs about the corner, fading with angle */
    const rho = r - SC_LEN;
    if(rho > 1 && thP > 0.02){
      ctx.save();
      ctx.beginPath();                                   // clip out the building
      ctx.rect(0,0,W,H);
      ctx.rect(BLD.x0, BLD.y0, BLD_W, BLD.y1-BLD.y0);
      ctx.clip("evenodd");
      const NSEG = 14;
      for(let k=0;k<NSEG;k++){
        const f0=k/NSEG, f1=(k+1)/NSEG;
        const a0 = A_CORNER - thP*f0, a1 = A_CORNER - thP*f1;
        const al = aMain * (1 - 0.72*((f0+f1)/2));
        ctx.strokeStyle = alpha(WAVE, al); ctx.lineWidth = lw; ctx.lineCap="round";
        ctx.beginPath(); ctx.arc(CORNER.x, CORNER.y, rho, a0, a1, true); ctx.stroke();
      }
      ctx.restore();
    }
  }

  /* ---- building ---- */
  ctx.save();
  ctx.fillStyle = col("--barrier");
  ctx.fillRect(BLD.x0, BLD.y0, BLD_W, BLD.y1-BLD.y0);
  ctx.fillStyle = alpha("#000000", 0.20);
  for(let y=BLD.y0+22; y<BLD.y1-10; y+=34){          // windows
    ctx.fillRect(BLD.x0+18, y, 34, 18);
    ctx.fillRect(BLD.x0+88, y, 34, 18);
  }
  ctx.strokeStyle = alpha("#ffffff",0.18); ctx.lineWidth=2;
  ctx.strokeRect(BLD.x0+1, BLD.y0, BLD_W-2, BLD.y1-BLD.y0-1);
  ctx.restore();
  dot(CORNER, col("--accent"), 4);

  drawSpeaker(SRC, col("--rose"));
  drawListener(L, heard ? col("--green") : col("--orange"), heard);

  /* ---- labels ---- */
  if(S.labels){
    label("loudspeaker", SRC.x+4, SRC.y+40, col("--rose"), {size:10, bg:true});
    label("building", (BLD.x0+BLD.x1)/2, BLD.y0+20, col("--text"), {size:10.5, bg:true});
    label("sound shadow", BLD.x1+96, 52, col("--text-muted"), {size:10.5, bg:true});
    /* Wavelength must be measured ALONG A RADIUS — the fronts are circles about the
       source, so along any other line the crests are further apart than λ. Run the
       measurement out at 30° below the horizontal (open water, well clear of the
       building) where crest n sits exactly at r = n·λ from the loudspeaker.        */
    const LA = 30*D2R, LD = {x:Math.cos(LA), y:Math.sin(LA)}, LMAX = 340;
    const off = (S.phase*lam) % lam;
    let r1 = off + Math.floor((LMAX - lam - off)/lam)*lam;   // last crest that still fits
    if(lam > 34 && r1 >= 46){
      measure({x:SRC.x+LD.x*r1,       y:SRC.y+LD.y*r1},
              {x:SRC.x+LD.x*(r1+lam), y:SRC.y+LD.y*(r1+lam)},
              "λ = "+fmt2(lambdaM())+" m", col("--accent"), {dy:-16});
    }
    /* penetration angle at the corner (label parked clear of the building) */
    if(thP > 0.05){
      const rr = 116;
      line(CORNER, {x:CORNER.x+rr*Math.cos(A_CORNER-thP), y:CORNER.y+rr*Math.sin(A_CORNER-thP)},
           col("--orange"), 1.2, [5,4]);
      angleArc(CORNER, A_CORNER, A_CORNER-thP, 72, col("--orange"), null);
      label("θ = "+Math.round(thP*R2D)+"°", CORNER.x+26, CORNER.y+30, col("--orange"),
            {size:10.5, align:"left", bg:true});
    }
    label(heard ? "✓ Heard" : "✗ Not heard", L.x, L.y-40,
          heard?col("--green"):col("--orange"), {size:11, bg:true});
    label("drag me", L.x, L.y+32, col("--text-muted"), {size:9, bg:true});
  }

  const NAME = { drum:"Drum (low note)", guitar:"Guitar (middle note)",
                 flute:"Flute (high note)", custom:"Custom note" };
  return {
    chips:[
      {t:NAME[S.instrument], cls:"b"},
      {t:"f = "+Math.round(S.freq)+" Hz · λ = "+fmt2(lambdaM())+" m", cls:"k"},
      {t:"bends "+Math.round(thP*R2D)+"° round the corner", cls:"o"},
      {t: heard ? "✓ listener hears it" : "✗ listener in the sound shadow", cls: heard?"g":"o"}
    ],
    chars:[
      {k:"Diffraction type", v:"Obstacle (edge) diffraction", cls:"blu"},
      {k:"Condition", v:"λ comparable with the obstacle"},
      {k:"At the listener", v: heard ? "Heard" : "Not heard", cls: heard?"grn":"ros"},
      {k:"IGCSE rule", v:"Lower frequency ⇒ more spreading"}
    ],
    vals:[
      {k:"Frequency (f)", v: Math.round(S.freq)+" Hz", cls:"acc"},
      {k:"Wavelength (λ)", v: fmt2(lambdaM())+" m", cls:"blu"},
      {k:"Speed of sound (v)", v: SOUND_SPEED+" m/s"},
      {k:"Building width", v: fmt(BLD_W/PX_PER_M)+" m"},
      {k:"λ / width", v: fmt2(lambdaPx()/BLD_W)},
      {k:"Bending angle (θ)", v: Math.round(thP*R2D)+"°", cls:"grn"},
      {k:"Listener is", v: (inShadow ? Math.round(depth*R2D)+"° inside the shadow" : "in direct sound")},
      {k:"Result", v: heard ? "✓ Heard" : "✗ Not heard", cls: heard?"grn":"ros"}
    ],
    eq:["\\lambda = \\frac{v}{f}", "v = f\\lambda",
        "\\lambda = \\frac{"+SOUND_SPEED+"}{"+Math.round(S.freq)+"} = "+fmt2(lambdaM())+"\\ \\text{m}"],
    note:"Sound from the loudspeaker spreads out as circular wavefronts. The building blocks the sound that would travel straight on, "+
         "leaving a <b>sound shadow</b> behind it — but the corner behaves like a new source, so some sound <b>bends round the corner</b> into "+
         "that shadow. How far it bends depends on the <span class='hl'>wavelength compared with the size of the obstacle</span>. "+
         "A <b>drum</b> (low frequency, λ ≈ "+fmt2(SOUND_SPEED/FREQ_DRUM)+" m) has a wavelength close to the width of the building, so it diffracts strongly and "+
         "you hear the bass round the corner. A <b>flute</b> (high frequency, λ ≈ "+fmt2(SOUND_SPEED/FREQ_FLUTE)+" m) has a wavelength much smaller than the "+
         "building, so it hardly bends at all and is lost in the shadow. That is why, standing behind a building at a concert, "+
         "<b>you hear the bass but not the treble</b>. Drag the listener to explore where each note can be heard."
  };
}
/* ============================================================
   DISPATCH · DRAW · UI
   ============================================================ */
let LAST = null;

function render(){ return S.section === "water" ? renderWater() : renderSound(); }

function draw(){
  const dpr = VS.dpr || (window.devicePixelRatio||1);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cv.width/dpr, cv.height/dpr);
  ctx.save();
  ctx.translate(VS.ox, VS.oy);
  ctx.scale(VS.s, VS.s);
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
  if(S.zoom){
    const f=S.zf, fx=S.focus.x+S.pan.x, fy=S.focus.y+S.pan.y;
    ctx.translate(W/2 - fx*f, H/2 - fy*f);
    ctx.scale(f,f);
  }
  drawBg();
  try { LAST = render(); }
  catch(err){ console.error(err); LAST = null; }
  ctx.restore();
}

/* ---------------- DOM ---------------- */
function chipHTML(c){ return '<span class="chip '+(c.cls||"")+'">'+c.t+'</span>'; }
function texFallback(t){
  t = t.replace(/\\text\{([^{}]*)\}/g, "$1").replace(/_\{([^{}]*)\}/g, "_$1");
  for(let i=0;i<4;i++) t = t.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "$1/$2");
  return t.replace(/\\lambda/g,"λ").replace(/\\theta/g,"θ").replace(/\\sin/g,"sin")
          .replace(/\\approx/g,"≈").replace(/\^\\circ/g,"°").replace(/\\ /g," ")
          .replace(/[{}\\]/g,"").replace(/\s+/g," ").trim();
}

function updateUI(){
  updateGroups();
  syncControls();
  draw();
  const R = LAST;
  if(!R) return;

  const chips = R.chips.slice();
  if(S.zoom) chips.push({t:"🔍 "+S.zf+"× — drag = pan · dbl-click / Esc = exit", cls:"zoom"});
  $("ovlBL").innerHTML = chips.map(chipHTML).join("");
  const zc = $("ovlBL").querySelector(".chip.zoom");
  if(zc) zc.onclick = () => { S.zoom=false; S.pan={x:0,y:0}; updateUI(); };
  $("hintChip").textContent = (S.section==="water")
      ? "drag a gap edge · dbl-click zoom · ← → gap width"
      : "drag the listener · dbl-click zoom · ← → frequency";

  $("charCards").innerHTML = R.chars.map(c =>
    '<div class="card"><div class="k">'+c.k+'</div><div class="v '+(c.cls||"")+'">'+c.v+'</div></div>').join("");

  if(S.calc){
    $("valCards").classList.remove("hidden");
    $("valCards").innerHTML = R.vals.map(c =>
      '<div class="card"><div class="k">'+c.k+'</div><div class="v '+(c.cls||"")+'">'+c.v+'</div></div>').join("");
    $("eqBox").classList.remove("hidden");
    const row = $("eqRow"); row.innerHTML = "";
    R.eq.forEach(tex => {
      const span = document.createElement("span");
      let ok = false;
      if(window.katex){ try { katex.render(tex, span, {throwOnError:false}); ok = true; } catch(e){ ok = false; } }
      if(!ok){ span.style.fontFamily = "'JetBrains Mono',monospace"; span.textContent = texFallback(tex); }
      row.appendChild(span);
    });
  } else {
    $("valCards").classList.add("hidden");
    $("eqBox").classList.add("hidden");
  }
  $("noteBox").innerHTML = R.note;
}

/* ---------------- toolbar visibility & sync ---------------- */
function updateGroups(){
  const isWater = S.section === "water";
  $("grpGap").classList.toggle("hidden", !isWater);
  $("grpGap2").classList.toggle("hidden", !(isWater && S.compare));
  $("grpLambda").classList.toggle("hidden", !isWater);
  $("grpAmp").classList.toggle("hidden", !isWater);
  $("grpFreq").classList.toggle("hidden", isWater);
  $("grpInstr").classList.toggle("hidden", isWater);
  $("grpCompare").classList.toggle("hidden", !isWater);
  $("sepCompare").classList.toggle("hidden", !isWater);
  $("btnCmpBy").classList.toggle("hidden", !(isWater && S.compare));
  const byGap = S.cmpBy === "gap";
  $("gapLab").textContent  = S.compare ? (byGap ? "Gap A" : "Gap") : "Gap width";
  $("gap2Lab").textContent = byGap ? "Gap B" : "λ B";
  $("btnCmpBy").textContent = byGap ? "⇄ by Gap" : "⇄ by λ";
  $("btnCompare").classList.toggle("on", S.compare);
  $("btnCmpBy").classList.toggle("on", true);
  $("scaleVal").textContent = isWater ? "1 square = 1 cm" : "1 square = 1 m · v = 340 m/s";
}
function syncControls(){
  const byGap = S.cmpBy === "gap";
  const sl2 = $("gap2Sl");
  sl2.min = byGap ? 20 : 10;  sl2.max = byGap ? 360 : 200;
  sl2.value = byGap ? S.gap2 : S.lam2;
  $("gap2Val").textContent = pxToCm(byGap ? S.gap2 : S.lam2)+" cm";
  $("gapSl").value  = S.gap;   $("gapVal").textContent  = pxToCm(S.gap)+" cm";
  $("lamSl").value  = S.lambda;$("lamVal").textContent  = pxToCm(S.lambda)+" cm";
  $("ampSl").value  = S.amp;   $("ampVal").textContent  = pxToCm(S.amp)+" cm";
  $("freqSl").value = S.freq;  $("freqVal").textContent = Math.round(S.freq)+" Hz";
  document.querySelectorAll("#instrPills .pill").forEach(p =>
    p.classList.toggle("active", p.dataset.i === S.instrument));
}

/* ---------------- sections ---------------- */
function setSection(sec){
  S.section = sec;
  S.zoom = false; S.pan = {x:0,y:0};
  S.listener = null;
  document.querySelectorAll("#tabs .tab").forEach(t => t.classList.toggle("active", t.dataset.sec===sec));
  updateUI();
}
document.querySelectorAll("#tabs .tab").forEach(t => t.onclick = () => setSection(t.dataset.sec));

/* ---------------- setters ---------------- */
const setGap  = v => { S.gap  = clamp(Math.round(v/2)*2, 20, 360); updateUI(); };
const setGap2 = v => { S.gap2 = clamp(Math.round(v/2)*2, 20, 360); updateUI(); };
const setLam2 = v => { S.lam2 = clamp(Math.round(v/2)*2, 10, 200); updateUI(); };
const setLam  = v => { S.lambda = clamp(Math.round(v/2)*2, 10, 200); updateUI(); };
const setAmp  = v => { S.amp = clamp(Math.round(v), 5, 40); updateUI(); };
function setFreq(v, keepPreset){
  S.freq = clamp(Math.round(v/10)*10, 50, 2000);
  if(!keepPreset){
    S.instrument = (S.freq===FREQ_DRUM)   ? "drum"
                 : (S.freq===FREQ_GUITAR) ? "guitar"
                 : (S.freq===FREQ_FLUTE)  ? "flute" : "custom";
  }
  updateUI();
}

/* ---------------- interaction ---------------- */
cv.addEventListener("pointerdown", e => {
  const p = evtPt(e);
  cv.setPointerCapture(e.pointerId);
  cv.classList.add("dragging");
  if(S.section === "water"){
    const g = gapEdgeHit(p);
    if(g){ S.drag = {mode:"gap", idx:g.idx, cx:g.cx}; return; }
  } else {
    const L = listenerPt();
    if(Math.abs(p.x-L.x) < 26 && Math.abs(p.y-L.y) < 30){
      S.drag = {mode:"listener", dx:p.x-L.x, dy:p.y-L.y}; return;
    }
  }
  if(S.zoom) S.drag = {mode:"pan", x0:p.x, y0:p.y, px:S.pan.x, py:S.pan.y};
});
cv.addEventListener("pointermove", e => {
  if(!S.drag) return;
  const p = evtPt(e);
  if(S.drag.mode === "gap"){
    const w = Math.abs(p.x - S.drag.cx) * 2;
    /* tank B only owns its own gap when the comparison is BY gap */
    if(S.drag.idx === 1 && S.cmpBy === "gap") setGap2(w); else setGap(w);
  } else if(S.drag.mode === "listener"){
    let x = clamp(p.x - S.drag.dx, 24, W-24), y = clamp(p.y - S.drag.dy, 24, H-24);
    if(inBuilding({x,y})) x = Math.max(x, BLD.x1 + 26);      // never inside the building
    S.listener = {x, y};
    updateUI();
  } else if(S.drag.mode === "pan"){
    S.pan.x = S.drag.px - (p.x - S.drag.x0);
    S.pan.y = S.drag.py - (p.y - S.drag.y0);
    draw();
  }
});
function endDrag(){ S.drag = null; cv.classList.remove("dragging"); }
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

cv.addEventListener("dblclick", e => {
  const p = evtPt(e);
  if(!S.zoom){ S.zoom = true; S.focus = {x:clamp(p.x,120,W-120), y:clamp(p.y,90,H-90)}; S.pan={x:0,y:0}; }
  else { S.zoom = false; S.pan={x:0,y:0}; }
  updateUI();
});

window.addEventListener("keydown", e => {
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag === "select" || (tag === "input" && e.target.type !== "range")) return;
  if(e.key === "Escape" && S.zoom){ S.zoom=false; S.pan={x:0,y:0}; updateUI(); return; }
  if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const s = (e.key === "ArrowRight") ? 1 : -1;
  const step = e.shiftKey ? 5 : 1;
  if(S.section === "water") setGap(S.gap + s*step*2);
  else setFreq(S.freq + s*step*10);
  e.preventDefault();
});

/* ---------------- toolbar wiring ---------------- */
[["btnLabels","labels"],["btnCalc","calc"],["btnGrid","grid"]].forEach(([id,key]) => {
  $(id).onclick = () => { S[key] = !S[key]; $(id).classList.toggle("on", S[key]); updateUI(); };
});
$("btnCompare").onclick = () => { S.compare = !S.compare; updateUI(); };
$("btnCmpBy").onclick   = () => { S.cmpBy = (S.cmpBy === "gap") ? "lam" : "gap"; updateUI(); };

$("gapSl").addEventListener("input",  e => setGap(+e.target.value));
$("gap2Sl").addEventListener("input", e => (S.cmpBy==="gap" ? setGap2 : setLam2)(+e.target.value));
$("lamSl").addEventListener("input",  e => setLam(+e.target.value));
$("ampSl").addEventListener("input",  e => setAmp(+e.target.value));
$("freqSl").addEventListener("input", e => setFreq(+e.target.value));
document.querySelectorAll("#instrPills .pill").forEach(p => {
  p.onclick = () => {
    S.instrument = p.dataset.i;
    if(S.instrument === "drum")   S.freq = FREQ_DRUM;
    if(S.instrument === "guitar") S.freq = FREQ_GUITAR;
    if(S.instrument === "flute")  S.freq = FREQ_FLUTE;
    updateUI();
  };
});

$("btnPlay").onclick = () => {
  S.playing = !S.playing;
  $("btnPlay").textContent = S.playing ? "⏸ Pause" : "▶ Play";
  draw();
};
document.querySelectorAll("#speedPills .pill").forEach(p => {
  p.onclick = () => {
    S.speed = +p.dataset.s;
    document.querySelectorAll("#speedPills .pill").forEach(q => q.classList.toggle("active", q===p));
  };
});

/* Reset — this section's defaults only; never changes mode or theme */
$("btnReset").onclick = () => {
  if(S.section === "water"){
    S.gap = DEF_GAP; S.gap2 = DEF_GAP2; S.lambda = DEF_LAMBDA; S.lam2 = DEF_LAMBDA*2;
    S.amp = DEF_AMP; S.compare = false; S.cmpBy = "gap";
  } else {
    S.freq = DEF_FREQ; S.instrument = "drum"; S.listener = null;
  }
  S.labels = true; S.calc = false; S.grid = true;
  S.playing = true; S.speed = 0.5; S.phase = 0;
  S.zoom = false; S.pan = {x:0,y:0}; S.drag = null;
  $("btnLabels").classList.add("on"); $("btnGrid").classList.add("on");
  $("btnCalc").classList.remove("on");
  $("btnPlay").textContent = "⏸ Pause";
  document.querySelectorAll("#speedPills .pill").forEach(p => p.classList.toggle("active", p.dataset.s==="0.5"));
  updateUI();
};

/* ---------------- theme ---------------- */
function setTheme(name){
  const cls = ["theme-hausnight","theme-neon","theme-light","theme-haus","theme-clay"];
  document.body.classList.remove.apply(document.body.classList, cls);
  if(name !== "dark") document.body.classList.add("theme-"+name);
  S.theme = name;
  $("themeSel").value = name;
  updateUI();
}
$("themeSel").onchange = e => setTheme(e.target.value);

/* ---------------- animation ---------------- */
let lastT = 0;
function loop(t){
  if(S.playing){
    const dt = Math.min(0.05, (t-lastT)/1000 || 0);
    S.phase += dt * 0.85 * S.speed;
    draw();
  }
  lastT = t;
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
window.addEventListener("resize", () => { resize(); updateUI(); });
if(window.ResizeObserver) new ResizeObserver(() => resize()).observe($("cvwrap"));
resize();
updateUI();
requestAnimationFrame(loop);

</script>
</body>
