.mid{width:92px;display:inline-flex;flex:0 0 92px}

.ptab{flex:1;padding:6px 2px;border-radius:8px 8px 0 0;border:1px solid var(--border);

<script>
'use strict';

   ══════════════════════════════════════════════════════════════════ */

/* standard form with real superscripts: 1.50 × 10¹¹                      */

  if (v === 0) return '0';
  sf = sf || 3;
  var e = Math.floor(Math.log10(Math.abs(v)) + 1e-12), m = v / Math.pow(10, e);
  m = Number(m.toPrecision(sf)); if (Math.abs(m) >= 10) { m /= 10; e++; }
  if (e === 0) return m.toFixed(sf - 1);
  return m.toFixed(sf - 1) + ' × 10' + supNum(e);

/* the same number written for KaTeX: 1.50 \times 10^{11}                */
function sciT(v, sf) {
  if (!isFinite(v)) return '\\text{—}';
  if (v === 0) return '0';
  sf = sf || 3;
  var e = Math.floor(Math.log10(Math.abs(v)) + 1e-12), m = v / Math.pow(10, e);
  m = Number(m.toPrecision(sf)); if (Math.abs(m) >= 10) { m /= 10; e++; }

  var m = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return m * pow;

  var a = Math.floor(lo / st + 1e-9) * st, b = Math.ceil(hi / st - 1e-9) * st;
  if (b - a < st * .5) b = a + st;
  return { lo: a, hi: b, step: st, n: Math.round((b - a) / st) };
}
function tickTxt(v, step) {
  var dp = 0; while (dp < 6 && Math.abs(step * Math.pow(10, dp) - Math.round(step * Math.pow(10, dp))) > 1e-9) dp++;
  return (Math.abs(v) < step * 1e-6 ? 0 : v).toFixed(dp);
}

/* ── state ─────────────────────────────────────────────────────────── */
var S = {
  md: 1, mode: 'sim', theme: 'dark', hoverK: null, mouseL: null, hovBig: null, hovLab: null,
  ex: { 1: 'now', 2: 'structure', 3: 'doppler', 4: 'vd' },
  play: true, speed: 1,
  t: 0,                    /* real seconds × speed (drives every animation) */
  zoom: 1, panX: 0, panY: 0, panning: false, px: 0, py: 0, moved: 0,
  show: { hints: true, labels: true, formula: false },
  v: {}, typed: {}, fold: {}, tab: 'data', cardPos: {}, fPos: null,
  era: 0,                  /* sub-mode 1: ONE era index for the pills AND the scrubber (0 Now … 3 2nd century, 4 summary) */
  dataset: 'simple',       /* sub-mode 4: 'simple' (6 points) | 'full' (8) — drives the graph and every H₀ readout */
  hsel: 3,                 /* sub-mode 4: the selected data point (index into HUB) */
  prac: { i: 0, done: {}, shown: {}, pick: {} },
  quiz: { i: 0, first: [], tries: [], picked: [], done: false },
  keypad: false, kpPos: null

window.S = S;

/* ── theme colours, read once per theme change ─────────────────────── */
var C = {};
var CKEYS = 'bg card card2 border ink text text-dim text-muted accent accent-glow green red amber violet blue gold plate chip-bg cvtext cvdim cvmuted orbit orbithi label cplate star grid trunk track-low track-high gravity pressure ir uv sky galaxy cmb redshift blueshift spectrum plot plot2 om dm de wrong milk space space2 star-core star-surface photosphere nebula giant supergiant wds sun-glow proton neutron positron neutrino gammaray helium hydrogen dust iron earth-sea earth-land earth-ice earth-desert bh el-gold el-silver el-uranium el-calcium pn-in pn-out'.split(' ');
function readTheme() {
  var cs = getComputedStyle(document.body);
  for (var i = 0; i < CKEYS.length; i++) C[CKEYS[i]] = cs.getPropertyValue('--' + CKEYS[i]).trim();

     so any accent darker than mid-grey is swapped for its bright counterpart */
  var BRIGHT = { gold: '#ffd56b', green: '#4ade80', red: '#ff6b6b', amber: '#fbbf24', violet: '#a78bfa', blue: '#60a5fa' };

    var h = (C[k] || '').replace('#', ''); if (h.length !== 6) return;
    var n = parseInt(h, 16), L = (.299 * (n >> 16 & 255) + .587 * (n >> 8 & 255) + .114 * (n & 255)) / 255;
    if (L < .5) C[k] = BRIGHT[k];
  });

  if (!col) return 'rgba(128,128,128,' + a + ')';
  if (col[0] === '#') {
    var h = col.slice(1);
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  if (col.indexOf('rgba') === 0) return col.replace(/[\d.]+\)$/, a + ')');
  if (col.indexOf('rgb') === 0) return col.replace('rgb(', 'rgba(').replace(')', ',' + a + ')');
  return col;
}
function rgbOf(col) {
  col = col || '#808080';
  if (col[0] !== '#') { var m = col.match(/[\d.]+/g); return m ? [+m[0], +m[1], +m[2]] : [128, 128, 128]; }   /* rgb(…) as well as #hex */
  var h = col.slice(1);
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(c1, c2, t) {
  var a = rgbOf(c1), b = rgbOf(c2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}
function setTheme(name) {
  S.theme = name; document.body.className = 't-' + name; document.body.setAttribute('data-theme', name);
  readTheme(); GLOBE.key = ''; if (typeof draw === 'function') draw();
}
window.setTheme = setTheme;

/* ── view transform: letterbox, then the ×2 magnifier, then (tour only)
   a camera — toLogical inverts the whole chain, so every hit-test agrees
   with what is drawn                                                    */
var VT = { s: 1, ox: 0, oy: 0 };
var CAM = { on: false, x: W / 2, y: H / 2, k: 1 };
function viewTransform() {
  var cw = CV.width / DPR, ch = CV.height / DPR;
  var s = Math.min(cw / W, ch / H);
  VT.s = s; VT.ox = (cw - W * s) / 2; VT.oy = Math.min((ch - H * s) / 2, 6);
  return VT;
}
function applyView() {
  CX.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX.translate(VT.ox, VT.oy); CX.scale(VT.s, VT.s);
  if (S.zoom > 1) { CX.translate(S.panX, S.panY); CX.scale(S.zoom, S.zoom); }
}
function toLogical(cx, cy) {
  var r = CV.getBoundingClientRect();
  var x = (cx - r.left - VT.ox) / VT.s, y = (cy - r.top - VT.oy) / VT.s;
  if (S.zoom > 1) { x = (x - S.panX) / S.zoom; y = (y - S.panY) / S.zoom; }
  return { x: x, y: y };
}
function clampPan() {
  S.panX = clamp(S.panX, W * (1 - S.zoom), 0);
  S.panY = clamp(S.panY, H * (1 - S.zoom), 0);
}
/* camera (tour): world point (CAM.x, CAM.y) drawn at the canvas centre ×k */
function camOn() { CX.save(); CX.translate(W / 2, H / 2); CX.scale(CAM.k, CAM.k); CX.translate(-CAM.x, -CAM.y); }
function camOff() { CX.restore(); }
function camToWorld(p) { return CAM.on ? { x: (p.x - W / 2) / CAM.k + CAM.x, y: (p.y - H / 2) / CAM.k + CAM.y } : p; }
var DPR = 1;

/* ── text & shape helpers (all sizes in logical px) ────────────────── */
var FONT_S = '"Inter","Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
var FONT_M = '"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace';
var FONT_T = '"Roboto Slab","Inter",Georgia,serif';

/* ── the night sky's Milky Way band: a soft glowing river of stars ──── */
function milkyBand(x0, y0, x1, y1, width, n, seed, k) {
  k = k === undefined ? 1 : k;
  var dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = -uy, ny = ux, i;
  CX.save(); CX.globalCompositeOperation = 'lighter';
  for (i = 0; i < 26; i++) {
    var t = i / 25, cx = x0 + dx * t, cy = y0 + dy * t, w2 = width * (.7 + .5 * Math.sin(t * 7 + seed));
    CX.fillStyle = rgrad(cx, cy, 0, cx, cy, w2, [[0, 'rgba(210,215,255,' + (.11 * k) + ')'], [1, 'rgba(160,170,255,0)']]);
    CX.beginPath(); CX.arc(cx, cy, w2, 0, TAU); CX.fill();
  }
  for (i = 0; i < n; i++) {
    var t2 = hash(i, seed), off = (hash(seed, i) + hash(i * 3, seed) - 1) * width * .9, px = x0 + dx * t2 + nx * off, py = y0 + dy * t2 + ny * off;
    dot(px, py, hash(i, seed + 5) > .95 ? 1.1 : .55, 'rgba(235,238,255,' + ((.3 + .5 * hash(i, seed + 7)) * k) + ')');
  }
  CX.restore();
  CX.save();                                  /* dark dust rifts down the middle */
  for (i = 0; i < 18; i++) {
    var t3 = .1 + .8 * hash(i, seed + 9), off3 = (hash(seed + 9, i) - .5) * width * .4, cx3 = x0 + dx * t3 + nx * off3, cy3 = y0 + dy * t3 + ny * off3;
    CX.fillStyle = rgrad(cx3, cy3, 0, cx3, cy3, width * .32, [[0, 'rgba(4,6,15,' + (.35 * k) + ')'], [1, 'rgba(4,6,15,0)']]);
    CX.beginPath(); CX.arc(cx3, cy3, width * .32, 0, TAU); CX.fill();
  }
  CX.restore();
}
/* a log-scaled distance ruler: marks = [[value, label, colour], …] */
function logRuler(x, y, w, lo, hi, marks, o) {
  o = o || {};
  var X = function (v) { return x + (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * w; };
  line(x, y, x + w, y, C.cvdim, 1.5);
  for (var e = Math.ceil(Math.log10(lo)); e <= Math.floor(Math.log10(hi)); e++) { var tx = X(Math.pow(10, e)); line(tx, y - 3, tx, y + 3, withA(C.cvdim, .7), 1); }
  marks.forEach(function (m, i) {
    var mx = X(m[0]), up = (o.alt ? i % 2 : 0) ? -1 : 1;

  });
  return X;
}

function opStart(it, j) {

var LAST = 0, FRAMES = 0, VISITED = {};
function loop(now) {

function bind() {

  window.addEventListener('resize', function () { resize(); placeSub(); });
  $('row1').onclick = function (e) {

    if (bb) { var cb = ctrlOf(bb.getAttribute('data-bk'), sc); if (cb && cb.act) cb.act(sc); refreshAll(); return; }
    var b = e.target.closest('[data-ck]'); if (!b) return;
    var c = ctrlOf(b.getAttribute('data-ck'), sc), v = b.getAttribute('data-cv');
    if (!c) return;

  };
  $('row1').onchange = function (e) {
    var s = e.target.closest('select[data-sk]'); if (!s) return;
    var sc = cur(), c = ctrlOf(s.getAttribute('data-sk'), sc); if (!c) return;

  };
  $('row2').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.getAttribute('data-sh')) { var k = b.getAttribute('data-sh'); S.show[k] = !S.show[k]; if (S.mode === 'sim' && k === 'labels') LABELS_SIM = S.show.labels; buildRow2(); updateFormula(); draw(); return; }
    if (b.getAttribute('data-sp')) { S.speed = parseFloat(b.getAttribute('data-sp')); buildRow2(); return; }

    if (b.id === 'btnReset') doReset();
  };
  $('mTabs').onclick = function (e) { var b = e.target.closest('.mode-tab'); if (b) setTopMode(b.getAttribute('data-mode')); };

  };

  CV.addEventListener('pointermove', function (e) {
    var p = toLogical(e.clientX, e.clientY);

    if (sceneDrag) { var sc = cur(); if (sc.drag && sc.drag(sc, p)) { syncCtrls(true); draw(); } return; }

      S.px = e.clientX; S.py = e.clientY; S.moved += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0); clampPan(); draw();
    }
  });
  CV.addEventListener('pointerup', function (e) {
    if (drag) { drag = null; try { CV.releasePointerCapture(e.pointerId); } catch (x) { } return; }
    if (sceneDrag) { sceneDrag = false; var sc = cur(); if (sc.release) sc.release(); renderPanel(true); try { CV.releasePointerCapture(e.pointerId); } catch (x) { } return; }
    if (S.panning) {
      S.panning = false; try { CV.releasePointerCapture(e.pointerId); } catch (x) { }

  });

}
function toggleZoom(p) {

function cancelSelection() { var sc = cur(); if (sc.cancel) sc.cancel(); draw(); renderPanel(true); }
function resize() {

/* ── boot ──────────────────────────────────────────────────────────── */
function boot() {
