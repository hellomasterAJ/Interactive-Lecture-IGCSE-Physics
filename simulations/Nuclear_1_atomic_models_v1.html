*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  padding:8px 12px; height:100vh; overflow:hidden;
  display:flex; flex-direction:column; align-items:center;
  background:var(--bg); color:var(--text);
  transition:background .3s,color .3s; -webkit-font-smoothing:antialiased;
}
.container{max-width:1420px;width:100%;height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------- HEADER ZONE (standard 45 px row) ---------- */
.top-bar{display:flex;justify-content:space-between;align-items:center;
         margin-bottom:6px;flex-wrap:wrap;gap:8px;flex:0 0 auto}
.top-bar h1{font-size:18px;font-weight:700;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:8px}
.top-bar h1 .ttl{color:var(--accent)}
.top-bar h1 .sub{font-size:11px;font-weight:500;color:var(--text-dim)}
.badge-top{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 8px;
           border-radius:12px;background:var(--accent-glow);color:var(--accent);
           border:1px solid var(--accent)}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.theme-select{background:var(--card);border:1px solid var(--border);color:var(--text);
              padding:4px 10px;border-radius:8px;cursor:pointer;
              font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;min-width:110px}
.brand{background:#F4C01E;border-radius:10px;padding:7px 8px;
       box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center}
.brand img{height:31px;width:auto;display:block}
@media(max-width:640px){.brand{display:none}}
.theme-haus .badge-top{background:#F4C01E;color:#1A1712;border-color:#1A1712}

/* ---------- era tabs ---------- */
.eratabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.eratab{background:var(--card);border:1px solid var(--border);border-radius:11px;
        padding:5px 8px;cursor:pointer;transition:.15s;color:var(--text-dim);
        display:flex;flex-direction:column;align-items:center;gap:1px;height:44px;justify-content:center}
.eratab:hover{color:var(--text);border-color:var(--text-muted)}
.eratab .nm{font-size:13px;font-weight:700;letter-spacing:.2px}
.eratab .yr{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted)}
.eratab.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.eratab.active .yr{color:var(--accent)}

/* ---------- toolbar: exactly 2 fixed rows ---------- */
.toolbar{flex:0 0 auto;padding:4px 12px;background:var(--card);
         border:1px solid var(--border);border-radius:14px}
.trow{display:flex;align-items:center;gap:8px;height:32px;flex-wrap:nowrap;overflow:hidden}
.tgroup{display:flex;align-items:center;gap:5px}
.tlabel{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
        color:var(--text-muted);margin-right:2px;white-space:nowrap}
.tsep{width:1px;height:20px;background:var(--border);margin:0 3px}
.tbtn{background:var(--bg);color:var(--text-dim);border:1px solid var(--border);
      border-radius:7px;padding:4px 9px;font-size:11px;font-weight:600;
      font-family:'Inter',sans-serif;cursor:pointer;transition:.14s;white-space:nowrap}
.tbtn:hover{color:var(--text);border-color:var(--text-muted)}
.tbtn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tbtn.primary{background:var(--blue);color:var(--bg);border-color:var(--blue)}
.tbtn.primary:hover{filter:brightness(1.12)}
.tbtn.fire{background:var(--orange);color:var(--bg);border-color:var(--orange)}
.pills{display:flex;gap:3px}
.pill{background:var(--bg);color:var(--text-dim);border:1px solid var(--border);
      border-radius:7px;padding:4px 9px;font-size:11px;font-weight:600;
      font-family:'JetBrains Mono',monospace;cursor:pointer;transition:.14s}
.pill:hover{color:var(--text)}
.pill.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.erabadge{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;
          font-weight:600;padding:4px 10px;border-radius:8px;
          background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent);
          white-space:nowrap}
.slot-hidden{visibility:hidden}
/* very narrow windows: drop the era badge rather than let the row clip */
@media(max-width:1250px){ .erabadge{display:none} }

/* ---------- canvas ---------- */
/* v1.2.2: canvas reduced 20 % in the vertical direction (logical 1200x416) */
.cvwrap{flex:0 0 auto;
        height:clamp(200px, min(48.5vh, calc(100vh - 420px)), 528px);
        margin-top:7px;border:1px solid var(--border);border-radius:14px;
        position:relative;overflow:hidden;background:var(--stage)}
#cv{display:block;width:100%;height:100%}
.chip{position:absolute;font-family:'JetBrains Mono',monospace;font-size:10px;
      line-height:1.45;padding:5px 9px;border-radius:9px;background:var(--card);
      border:1px solid var(--border);color:var(--text-dim);pointer-events:none;
      max-width:44%;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#chipInfo{top:8px;left:8px;color:var(--text);max-width:52%}
#chipInfo b{color:var(--accent)}
#chipStatus{top:8px;right:8px;text-align:right}
#chipWarn{top:8px;left:50%;transform:translateX(-50%);text-align:center;
         border-color:var(--orange);color:var(--orange);display:none}
#hintEl{bottom:8px;right:8px;text-align:right;font-size:9.5px;color:var(--text-muted)}

/* ---------- below-canvas panels (46 / 54) ---------- */
.below{flex:1 1 auto;min-height:0;overflow-y:auto;margin-top:7px;
       display:grid;grid-template-columns:46fr 54fr;gap:8px;padding-bottom:2px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 11px}
.phead{width:100%;display:flex;align-items:center;gap:6px;margin-bottom:6px;
       background:none;border:none;padding:0;cursor:pointer;text-align:left;
       font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
       letter-spacing:.4px;text-transform:uppercase;color:var(--accent)}
.phead:hover{filter:brightness(1.18)}
.phead:focus-visible{outline:1px solid var(--accent);outline-offset:3px;border-radius:4px}
.phead .chev{margin-left:auto;font-size:11px;color:var(--text-muted);
             transition:transform .18s}
.panel.collapsed .phead{margin-bottom:0}
.panel.collapsed .pbody{display:none}
.panel.collapsed .chev{transform:rotate(-90deg)}
table.feat{width:100%;border-collapse:collapse;font-size:11.5px}
table.feat th{text-align:left;font-size:9px;letter-spacing:.6px;text-transform:uppercase;
              color:var(--text-muted);padding:3px 6px;border-bottom:1px solid var(--border);font-weight:700}
table.feat td{padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text-dim)}
table.feat td:first-child{color:var(--text);font-weight:600;width:38%}
table.feat tr:last-child td{border-bottom:none}
.ptext{font-size:11.5px;line-height:1.55;color:var(--text-dim)}
.ptext b{color:var(--text)}
.why{border-left:3px solid var(--orange)}
.why .phead{color:var(--orange)}
.nextp{display:inline-block;margin-top:5px;font-family:'JetBrains Mono',monospace;
        font-size:10px;font-weight:600;padding:2px 8px;border-radius:7px;
        background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent)}
.info{border-left:3px solid var(--blue)}
.info .phead{color:var(--blue)}
.exam{margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--accent-glow);
       border:1px solid var(--accent);font-size:11px;line-height:1.5;color:var(--text)}
.exam ol{margin:4px 0 0 16px}
.exam li{margin-bottom:2px}
.exam .tag{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
           color:var(--accent);letter-spacing:.5px}
</style>
</head>

/* ---------- Rutherford geometry (logical 1200x416) ------------------------
   SINGLE SOURCE OF GEOMETRY. Everything on the beam line is derived from one
   number, RU.axisY, so the radium source, the lead collimator slit, the gold
   foil and the ZnS detector ring can never drift out of alignment. This
   matches the real Geiger-Marsden layout: source -> collimating aperture ->
   foil at the CENTRE of the circular fluorescent screen.
   -------------------------------------------------------------------------*/
const RU = (function(){
  const axisY = 208;                              // the one beam axis
  return {
    axisY:    axisY,
    src:      { x: 70, y: axisY - 52, w: 70, h: 104 },   // lead-shielded radium
    slotH:    20,                                  // emission slot in the source
    spawnX:   140,                                 // right face of the source
    colX:     332, colW: 26, colGap: 26,           // lead collimator + its aperture
    vx0:      300, vxr: 60,
    vyr:      60,                                  // wide emission cone; the
                                                   // collimator absorbs the rest
    foilX:    760, foilHalf: 160,
    screenR:  180,                                 // ZnS ring, centred ON the foil
    P_BOUNCE: 1 / 8000,
    P_DEFLECT: 1 / 60,
    CAP:      3000,                                // steady state ~1200
    RATE:     480,                                 // emitted/s; ~63 % survive
                                                   // the collimator -> ~300/s
                                                   // reach the foil, as specified
    BURST:    170                                  // ~120 survive the collimator
  };
})();
RU.foilY0 = RU.axisY - RU.foilHalf;
RU.foilY1 = RU.axisY + RU.foilHalf;
RU.screenCx = RU.foilX;
RU.screenCy = RU.axisY;

/* =====================================================================
   CANVAS SETUP — DPR aware, letterboxed, never moves
   ===================================================================== */
function setupCanvas(){
  const wrap = $('cvwrap');
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  scale = Math.min(cw / W, ch / H);
  offX = (cw - W * scale) / 2;
  offY = (ch - H * scale) / 2;
  CX.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
new ResizeObserver(setupCanvas).observe($('cvwrap'));
window.addEventListener('resize', setupCanvas);

function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim() || '#888'; }

/* =====================================================================
   SMALL DRAWING HELPERS
   ===================================================================== */
function sphere(x, y, r, col, hi){
  const g = CX.createRadialGradient(x - r * .35, y - r * .38, r * .08, x, y, r);
  g.addColorStop(0, hi || '#ffffff');
  g.addColorStop(.32, col);
  g.addColorStop(1, shade(col, -.45));
  CX.fillStyle = g;
  CX.beginPath(); CX.arc(x, y, r, 0, 6.2832); CX.fill();
  CX.strokeStyle = shade(col, -.55); CX.lineWidth = 1.1; CX.stroke();
}
function shade(hex, amt){
  hex = (hex || '#888888').replace('#','');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  let r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  if (isNaN(r)) { r = g = b = 136; }
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}
function label(txt, x, y, col, size, align, weight, noPlate){
  if (!S.showLabels) return;
  CX.save();
  CX.font = (weight || 600) + ' ' + (size || 13) + "px 'Inter',sans-serif";
  CX.textAlign = align || 'center';
  CX.textBaseline = 'middle';
  const w = CX.measureText(txt).width;
  const pad = 4;
  if (!noPlate){
    CX.globalAlpha = .74;
    CX.fillStyle = cssVar('--stage');
    const bx = align === 'left' ? x - pad : align === 'right' ? x - w - pad : x - w/2 - pad;
    CX.fillRect(bx, y - (size||13)*.72, w + pad*2, (size||13)*1.44);
    CX.globalAlpha = 1;
  }
  CX.fillStyle = col || cssVar('--text');
  CX.fillText(txt, x, y);
  CX.restore();
}
function arrow(x1, y1, x2, y2, col, lw, head){
  CX.strokeStyle = col; CX.lineWidth = lw || 2; CX.lineCap = 'round';
  CX.beginPath(); CX.moveTo(x1, y1); CX.lineTo(x2, y2); CX.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1), h = head || 9;
  CX.fillStyle = col;
  CX.beginPath();
  CX.moveTo(x2, y2);
  CX.lineTo(x2 - h * Math.cos(a - .4), y2 - h * Math.sin(a - .4));
  CX.lineTo(x2 - h * Math.cos(a + .4), y2 - h * Math.sin(a + .4));
  CX.closePath(); CX.fill();
}
function card(x, y, w, h, title){
  CX.save();
  CX.fillStyle = cssVar('--card'); CX.globalAlpha = .93;
  roundRect(x, y, w, h, 12); CX.fill();
  CX.globalAlpha = 1;
  CX.strokeStyle = cssVar('--border'); CX.lineWidth = 1; CX.stroke();
  CX.restore();
  if (title) label(title, x + w/2, y + 15, cssVar('--text-muted'), 11, 'center', 700);
}
function roundRect(x, y, w, h, r){
  CX.beginPath();
  CX.moveTo(x + r, y);
  CX.arcTo(x + w, y, x + w, y + h, r);
  CX.arcTo(x + w, y + h, x, y + h, r);
  CX.arcTo(x, y + h, x, y, r);
  CX.arcTo(x, y, x + w, y, r);
  CX.closePath();
}
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;

/* =====================================================================
   ERA 0 — DALTON 1803 : solid spheres combining in whole-number ratios
   Four compounds, one per element in the key (H, C, N, O). Shapes are the
   real molecular geometries: H2O bent 104.5 deg, CO2 linear, NH3 trigonal
   pyramidal, CH4 tetrahedral (tripod + one bond, near atom drawn larger).
   ===================================================================== */
const D_CY = 186, D_CYCLE = 4.5;
/* a = bond direction in canvas radians (y down); d = bond length;
   front = atom pointing toward the viewer -> drawn last, larger, bolder bond */
const MOLS = [
  { f:'H₂O', nm:'water',          ratio:'2 H : 1 O', shape:'bent 104.5°',
    cx:150, core:{ el:'O', r:32, c:'--sphereO', tc:'#ffffff' },
    atoms:[ { el:'H', r:19, c:'--sphereH', a: 0.659, d:58 },
            { el:'H', r:19, c:'--sphereH', a: 2.483, d:58 } ] },
  { f:'CO₂', nm:'carbon dioxide', ratio:'1 C : 2 O', shape:'linear 180°',
    cx:450, core:{ el:'C', r:30, c:'--neutron', tc:'#ffffff' },
    atoms:[ { el:'O', r:32, c:'--sphereO', a: 0,      d:64 },
            { el:'O', r:32, c:'--sphereO', a: 3.1416, d:64 } ] },
  { f:'NH₃', nm:'ammonia',        ratio:'3 H : 1 N', shape:'trigonal pyramidal',
    cx:750, core:{ el:'N', r:30, c:'--electron', tc:'#ffffff' },
    atoms:[ { el:'H', r:19, c:'--sphereH', a: 0.5236, d:58 },
            { el:'H', r:19, c:'--sphereH', a: 2.6180, d:58 },
            { el:'H', r:19, c:'--sphereH', a: 1.5708, d:44, front:true } ] },
  { f:'CH₄', nm:'methane',        ratio:'4 H : 1 C', shape:'tetrahedral',
    cx:1050, core:{ el:'C', r:30, c:'--neutron', tc:'#ffffff' },
    atoms:[ { el:'H', r:19, c:'--sphereH', a:-1.5708, d:58 },
            { el:'H', r:19, c:'--sphereH', a: 0.5236, d:58 },
            { el:'H', r:19, c:'--sphereH', a: 2.6180, d:58 },
            { el:'H', r:19, c:'--sphereH', a: 1.5708, d:44, front:true } ] }
];
/* which compound is assembling right now — used by draw() and by the chip */
function daltonIndex(){
  const n = MOLS.length;
  return ((Math.floor(Math.max(0, S.t[0]) / D_CYCLE) % n) + n) % n;
}

function drawMolecule(m, k, active){
  const cx = m.cx, cy = D_CY;
  /* k = 0 fully apart, 1 fully bonded */
  const parts = m.atoms.map(at => {
    const dist = at.d * k + (at.d + 96) * (1 - k);
    return { at: at,
             x: cx + Math.cos(at.a) * dist,
             y: cy + Math.sin(at.a) * dist };
  });
  /* bonds fade in only once the atoms have arrived */
  if (k > .82){
    CX.save();
    CX.globalAlpha = (k - .82) / .18;
    CX.strokeStyle = cssVar('--text-muted'); CX.lineCap = 'round';
    parts.forEach(p => {
      CX.lineWidth = p.at.front ? 9 : 6.5;
      CX.beginPath(); CX.moveTo(cx, cy); CX.lineTo(p.x, p.y); CX.stroke();
    });
    CX.restore();
  }
  if (S.showParticles){
    /* far atoms first, the near ("front") atom last and a little larger */
    const order = parts.slice().sort((a, b) => (a.at.front ? 1 : 0) - (b.at.front ? 1 : 0));
    order.filter(p => !p.at.front).forEach(p => {
      sphere(p.x, p.y, p.at.r, cssVar(p.at.c));
      label(p.at.el, p.x, p.y, '#1b2430', 13, 'center', 800, true);
    });
    sphere(cx, cy, m.core.r, cssVar(m.core.c));
    label(m.core.el, cx, cy, m.core.tc, 17, 'center', 800, true);
    order.filter(p => p.at.front).forEach(p => {
      sphere(p.x, p.y, p.at.r + 3, cssVar(p.at.c));
      label(p.at.el, p.x, p.y, '#1b2430', 13, 'center', 800, true);
    });
  }
  label(m.f, cx, 300, active ? cssVar('--accent') : cssVar('--text'), 16, 'center', 800);
  label(m.ratio, cx, 322, active ? cssVar('--accent') : cssVar('--text-dim'), 12, 'center', 700);
  label(m.nm + ' · ' + m.shape, cx, 342, cssVar('--text-muted'), 10);
}

function drawDalton(t){
  const idx = daltonIndex();
  const u = (Math.max(0, t) % D_CYCLE) / D_CYCLE;
  let k;                                     /* the ACTIVE compound assembles */
  if (u < .28)      k = ease(u / .28);
  else if (u < .80) k = 1;
  else              k = 1 - ease((u - .80) / .20);

  label('⚛️ Solid sphere · indivisible — atoms combine in whole-number ratios',
        600, 44, cssVar('--accent'), 15, 'center', 700);
  label('the same elements always join in the same fixed ratio — the law of constant proportions',
        600, 70, cssVar('--text-dim'), 12);

  /* highlight panel behind the compound currently being built */
  CX.save();
  CX.globalAlpha = .5;
  CX.fillStyle = cssVar('--accent-glow');
  roundRect(MOLS[idx].cx - 140, 92, 280, 264, 14); CX.fill();
  CX.globalAlpha = 1;
  CX.strokeStyle = cssVar('--accent'); CX.lineWidth = 1.2; CX.stroke();
  CX.restore();

  MOLS.forEach((m, i) => drawMolecule(m, i === idx ? k : 1, i === idx));

  /* compact element key, kept clear of the bottom-right hint chip */
  const key = [['H', '--sphereH'], ['C', '--neutron'], ['N', '--electron'], ['O', '--sphereO']];
  label('one element = one kind of sphere:', 62, 384, cssVar('--text-muted'), 11, 'left', 700);
  let kx = 268;
  key.forEach(e => {
    sphere(kx, 384, 10, cssVar(e[1]));
    label(e[0], kx + 15, 384, cssVar('--text-dim'), 12, 'left', 700);
    kx += 54;
  });
}

/* =====================================================================

const TH = {

  cath: 108, anode: 232,
  plX0: 330, plX1: 480, plTop: 152, plBot: 280,

  const prog = Math.min(1, (t % 6) / 3.4);       // beam grows, then holds

  /* --- glass tube --- */
  CX.save();

  label('the electron: about 1/1836 the mass of a hydrogen atom — the first sub-atomic particle',
        430, 388, cssVar('--text-muted'), 12);
}
function beamPath(){
  const T = TH, pts = [];
  pts.push({ x: T.cath + 7, y: T.beamY });
  pts.push({ x: T.plX0,     y: T.beamY });
  /* Deflection sized so the beam stays INSIDE the tube and lands on the
     fluorescent screen: parabola inside the plates, straight line after.
     Exit slope = 2*dropTot/plateLength, so dropTot is capped by geometry.   */
  const dropTot = 27;                                   // upward deflection
  const n = 16;
  for (let i = 1; i <= n; i++){
    const u = i / n;
    pts.push({ x: T.plX0 + (T.plX1 - T.plX0) * u, y: T.beamY - dropTot * u * u });
  }
  const yEnd = T.beamY - dropTot;
  const slope = 2 * dropTot / (T.plX1 - T.plX0);
  pts.push({ x: T.scrX + 5, y: yEnd - slope * (T.scrX + 5 - T.plX1) });
  return pts;
}

/* =====================================================================
   ERA 2 — RUTHERFORD 1911 : gold foil experiment
   Beam line: radium source -> collimator aperture -> gold foil -> ZnS ring.
   Every y-coordinate below is derived from RU.axisY (see the RU block).
   ===================================================================== */
function spawnAlpha(){
  if (S.alphas.length >= RU.CAP) S.alphas.shift();
  S.alphas.push({
    x: RU.spawnX,
    y: RU.axisY + (Math.random() - 0.5) * RU.slotH,     // inside the source slot
    vx: RU.vx0 + Math.random() * RU.vxr,
    vy: (Math.random() - 0.5) * RU.vyr,                 // emission cone
    col: false,                                          // has passed collimator
    hit: false,
    kind: 0                                             // 0 pass, 1 deflected, 2 bounced
  });
}
function fireBurst(){
  for (let i = 0; i < RU.BURST; i++) spawnAlpha();
  if (!S.playing){
    S.warn = '⚠️ Burst fired while paused —<br>press <b>▶ Play</b> to see it travel.';
    updateChips();
  }
}
function updateRutherford(dt){
  const sdt = dt * S.speed;
  if (S.playing){
    S.spawnAcc += RU.RATE * sdt;
    const n = Math.floor(S.spawnAcc);
    S.spawnAcc -= n;
    for (let i = 0; i < n; i++) spawnAlpha();
  }
  if (!S.playing) return;

  const colFace = RU.colX + RU.colW, colHalf = RU.colGap / 2;
  const arr = S.alphas, out = [];
  for (let i = 0; i < arr.length; i++){
    const p = arr[i];
    const px = p.x;
    p.x += p.vx * sdt;
    p.y += p.vy * sdt;

    /* --- lead collimator: absorbs everything off-axis (this is what makes
           the beam a narrow pencil, exactly as in the real apparatus) ---- */
    if (!p.col && px < colFace && p.x >= RU.colX){
      if (Math.abs(p.y - RU.axisY) > colHalf) continue;   // absorbed in the lead
      p.col = true;
    }

    /* --- crossing the foil — one interaction per particle --- */
    if (!p.hit && px < RU.foilX && p.x >= RU.foilX && p.y > RU.foilY0 && p.y < RU.foilY1){
      p.hit = true;
      const r = Math.random();
      if (r < RU.P_BOUNCE){
        p.vx *= -0.55;
        p.vy = (Math.random() < .5 ? -1 : 1) * 110;
        p.kind = 2; S.stats.bounced++;
        S.flashes.push({ x: RU.foilX, y: p.y, a: 1, big: true });
      } else if (r < RU.P_DEFLECT){
        p.vx *= 0.45;
        p.vy = (Math.random() < .5 ? -1 : 1) * 150;
        p.kind = 1; S.stats.deflected++;
        S.flashes.push({ x: RU.foilX, y: p.y, a: 1, big: false });
      } else {
        S.stats.passed++;
      }
    }

    /* --- ZnS ring: scintillation where a scattered alpha is detected --- */
    if (p.kind > 0 && p.hit){
      const dx = p.x - RU.screenCx, dy = p.y - RU.screenCy;
      if (dx * dx + dy * dy >= RU.screenR * RU.screenR){
        const L = Math.hypot(dx, dy) || 1;
        S.flashes.push({ x: RU.screenCx + dx / L * RU.screenR,
                         y: RU.screenCy + dy / L * RU.screenR,
                         a: 1, big: p.kind === 2, scint: true });
        continue;                                        // detected -> counted
      }
    }
    if (p.x > -40 && p.x < W + 40 && p.y > -40 && p.y < H + 40) out.push(p);
  }
  S.alphas = out;

  for (let i = S.flashes.length - 1; i >= 0; i--){
    S.flashes[i].a -= sdt * 1.7;
    if (S.flashes[i].a <= 0) S.flashes.splice(i, 1);
  }
}

/* =====================================================================
   ERA 3 — BOHR 1913 : energy levels, photon absorbed / emitted
   ===================================================================== */
/* Energy levels are drawn to SCALE from the Bohr formula E(n) = -13.6/n^2 eV,
   NOT evenly spaced: the gaps must shrink as n rises and crowd toward the
   ionisation limit. Physics wins over an evenly spaced ladder.              */
const BO = (function(){
  const lx = 880, lw = 200, yInf = 100, y1 = 346;
  const E = n => -13.6 / (n * n);
  const k = (y1 - yInf) / 13.6;                       // px per eV
  const yOf = n => yInf + k * (-E(n));
  return { cx: 470, cy: 212, r: [56, 102, 148], n: [2, 8, 8],
           lx: lx, lw: lw, yInf: yInf, E: E,
           ly: [yOf(1), yOf(2), yOf(3)] };
})();
function drawBohr(t){
  const cyc = 9, cycStart = Math.floor(Math.max(0, t) / cyc) * cyc;
  const p = (Math.max(0, t) % cyc) / cyc;
  const OMEGA = 0.47;                        // electron angular speed (rad/s)

  /* --- timeline -------------------------------------------------------
     .00-.16  photon travels IN from outside the atom (nothing moves yet)
     .16-.34  the photon has been absorbed -> electron jumps n=2 -> n=3
     .34-.56  hold at n=3
     .56-.74  electron falls n=3 -> n=2
     .58-.92  the emitted photon travels OUT past the outer shell
     A photon is only absorbed/emitted at the instant of the jump — the wave
     must therefore ARRIVE before the jump up, and LEAVE as it falls back. */
  let jump = 0, phAbs = -1, phEmit = -1;
  if      (p < .16){ jump = 0;                          phAbs  = p / .16; }
  else if (p < .34){ jump = ease((p - .16) / .18); }
  else if (p < .56){ jump = 1; }
  else if (p < .74){ jump = 1 - ease((p - .56) / .18);
                     if (p >= .58) phEmit = (p - .58) / .34; }
  else if (p < .92){ jump = 0;                          phEmit = (p - .58) / .34; }

  /* --- shells --- */
  CX.save();
  CX.setLineDash([4, 7]);
  BO.r.forEach((r, i) => {
    CX.strokeStyle = cssVar('--shell'); CX.lineWidth = i === 1 ? 1.9 : 1.3;
    CX.globalAlpha = .85;
    CX.beginPath(); CX.arc(BO.cx, BO.cy, r, 0, 6.2832); CX.stroke();
  });
  CX.restore();

  /* --- nucleus --- */
  const ng = CX.createRadialGradient(BO.cx - 5, BO.cy - 6, 2, BO.cx, BO.cy, 21);
  ng.addColorStop(0, shade(cssVar('--nucleus'), .5));
  ng.addColorStop(1, shade(cssVar('--nucleus'), -.35));
  CX.fillStyle = ng;
  CX.beginPath(); CX.arc(BO.cx, BO.cy, 21, 0, 6.2832); CX.fill();
  label('nucleus', BO.cx, BO.cy + 38, cssVar('--nucleus'), 11, 'center', 700);

  if (S.showParticles){
    /* --- the electrons that are not jumping --- */
    for (let s = 0; s < 3; s++){
      const cnt = BO.n[s], base = t * (0.62 - s * 0.15) + s * 0.7;
      for (let i = 0; i < cnt; i++){
        if (s === 1 && i === 0) continue;              // this one is jumping
        const a = base + i * 6.2832 / cnt;
        const x = BO.cx + Math.cos(a) * BO.r[s], y = BO.cy + Math.sin(a) * BO.r[s];
        CX.fillStyle = cssVar('--electron');
        CX.beginPath(); CX.arc(x, y, 6.5, 0, 6.2832); CX.fill();
      }
      label('n=' + (s + 1) + '  (' + cnt + ')', BO.cx, BO.cy - BO.r[s] - 12, cssVar('--text-muted'), 11, 'center', 700);
    }

    /* --- the jumping electron --- */
    const aj = t * OMEGA;
    const rj = BO.r[1] + (BO.r[2] - BO.r[1]) * jump;
    const jx = BO.cx + Math.cos(aj) * rj, jy = BO.cy + Math.sin(aj) * rj;

    /* --- ABSORPTION: a wave train comes in from OUTSIDE the atom ---------
       It is aimed at where the electron WILL be at the instant of arrival
       (p = .16), so the line is fixed for the whole cycle and the wave and
       the electron genuinely meet.                                       */
    if (phAbs >= 0){
      const aHit = (cycStart + .16 * cyc) * OMEGA;
      const tx = BO.cx + Math.cos(aHit) * BO.r[1];
      const ty = BO.cy + Math.sin(aHit) * BO.r[1];
      photonTrain(PH_SRC.x, PH_SRC.y, tx, ty, phAbs, cssVar('--photon'));
      label('photon absorbed → electron jumps UP', 236, 52, cssVar('--photon'), 13, 'center', 700);
    }
    /* --- EMISSION: a wave train leaves the electron and flies OUT -------
       Launched radially from where the electron is at p = .58, clipped so
       it always stops inside the canvas.                                 */
    if (phEmit >= 0 && phEmit <= 1){
      const aEm = (cycStart + .58 * cyc) * OMEGA;
      const ox = BO.cx + Math.cos(aEm) * BO.r[2];
      const oy = BO.cy + Math.sin(aEm) * BO.r[2];
      const dx = Math.cos(aEm), dy = Math.sin(aEm);
      const L = Math.min(260, raySegLimit(ox, oy, dx, dy, 16));
      photonTrain(ox, oy, ox + dx * L, oy + dy * L, phEmit, cssVar('--photon'));
      label('photon emitted → electron falls DOWN', 236, 52, cssVar('--photon'), 13, 'center', 700);
    }

    CX.save();
    CX.shadowColor = cssVar('--accent'); CX.shadowBlur = 14;
    CX.fillStyle = cssVar('--accent');
    CX.beginPath(); CX.arc(jx, jy, 8, 0, 6.2832); CX.fill();
    CX.restore();
  }

  /* --- energy level ladder, spaced to scale from E(n) = -13.6/n² eV --- */
  card(BO.lx - 52, 66, BO.lw + 96, 306, 'ENERGY LEVELS (to scale)');
  CX.save();
  CX.setLineDash([4, 5]); CX.strokeStyle = cssVar('--text-muted'); CX.lineWidth = 1.4;
  CX.beginPath(); CX.moveTo(BO.lx, BO.yInf); CX.lineTo(BO.lx + BO.lw, BO.yInf); CX.stroke();
  CX.restore();
  label('n=∞   0 eV', BO.lx - 10, BO.yInf, cssVar('--text-muted'), 10, 'right', 700);
  const lvl = ['n=1', 'n=2', 'n=3'];
  BO.ly.forEach((y, i) => {
    CX.strokeStyle = cssVar('--text-dim'); CX.lineWidth = 2.4;
    CX.beginPath(); CX.moveTo(BO.lx, y); CX.lineTo(BO.lx + BO.lw, y); CX.stroke();
    label(lvl[i] + '   ' + BO.E(i + 1).toFixed(2) + ' eV',
          BO.lx - 10, y, cssVar('--text-dim'), 10, 'right', 700);
  });
  const y2 = BO.ly[1], y3 = BO.ly[2], axx = BO.lx + BO.lw * .5;
  if (p >= .16 && p < .34)      arrow(axx, y2, axx, y2 + (y3 - y2) * jump, cssVar('--photon'), 3, 10);
  else if (p >= .56 && p < .74) arrow(axx, y3, axx, y3 + (y2 - y3) * (1 - jump), cssVar('--photon'), 3, 10);
  label('ΔE = photon energy', BO.lx + BO.lw * .5 + 70, (y2 + y3) / 2, cssVar('--photon'), 11);
  label('level gaps shrink as n rises', BO.lx + BO.lw / 2, 300, cssVar('--text-muted'), 10);
  const sy = 226, sx0 = BO.lx - 18, sw = BO.lw + 36;
  CX.fillStyle = cssVar('--stage');
  CX.fillRect(sx0, sy, sw, 18);
  CX.strokeStyle = cssVar('--border'); CX.lineWidth = 1; CX.strokeRect(sx0, sy, sw, 18);
  [[0.14, '#7c3aed'], [0.24, '#4488ff'], [0.40, '#22d3ee'], [0.80, '#ef4444']].forEach(l => {
    CX.fillStyle = l[1];
    CX.fillRect(sx0 + sw * l[0], sy + 2, 3, 14);
  });
  label('line spectrum', BO.lx + BO.lw / 2, sy - 13, cssVar('--text-muted'), 10);

  label('electrons in fixed shells: 2, 8, 8', BO.cx, 390, cssVar('--accent'), 14, 'center', 700);
}

/* Fixed point outside the atom that the incoming photon starts from. */
const PH_SRC = { x: 66, y: 92 };
const PH = { packet: 116, lambda: 24, amp: 9 };

/* Longest distance you can travel from (x,y) along (dx,dy) and stay on canvas. */
function raySegLimit(x, y, dx, dy, m){
  let tm = 1e9;
  if (dx >  1e-6) tm = Math.min(tm, (W - m - x) / dx);
  if (dx < -1e-6) tm = Math.min(tm, (m - x) / dx);
  if (dy >  1e-6) tm = Math.min(tm, (H - m - y) / dy);
  if (dy < -1e-6) tm = Math.min(tm, (m - y) / dy);
  return Math.max(0, tm);
}

/* A photon drawn as a travelling SINE WAVE TRAIN: a burst of sine cycles
   inside a smooth envelope, moving head-first along the path. `headFrac`
   0 -> 1 slides the packet from the start of the path to its end.        */
function photonTrain(x0, y0, x1, y1, headFrac, col){
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  if (L < 6) return;
  const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
  const pk = Math.min(PH.packet, L);
  /* the head runs from 0 to L + pk so the tail can clear the target too */
  const head = headFrac * (L + pk);
  const a = Math.max(0, head - pk), b = Math.min(L, head);
  if (b <= a) return;

  CX.save();
  CX.strokeStyle = col; CX.lineWidth = 2.6; CX.lineCap = 'round';
  CX.shadowColor = col; CX.shadowBlur = 9;
  CX.beginPath();
  let first = true, lx = 0, ly = 0;
  for (let d = a; d <= b; d += 1.6){
    const u = (d - (head - pk)) / pk;             // 0 at the tail, 1 at the head
    const env = Math.sin(Math.PI * u);            // smooth wave-packet envelope
    const w = PH.amp * env * Math.sin((d / PH.lambda) * 6.2832 - headFrac * 22);
    lx = x0 + ux * d + nx * w;
    ly = y0 + uy * d + ny * w;
    if (first){ CX.moveTo(lx, ly); first = false; } else CX.lineTo(lx, ly);
  }
  CX.stroke();
  /* faint straight guide showing where the photon is heading */
  CX.globalAlpha = .22; CX.shadowBlur = 0;
  CX.setLineDash([2, 7]); CX.lineWidth = 1;
  CX.beginPath(); CX.moveTo(x0, y0); CX.lineTo(x1, y1); CX.stroke();
  CX.restore();
  /* bright head marker so the direction of travel is unambiguous */
  CX.save();
  CX.globalAlpha = .9; CX.fillStyle = col;
  CX.shadowColor = col; CX.shadowBlur = 10;
  CX.beginPath(); CX.arc(x0 + ux * b, y0 + uy * b, 3.4, 0, 6.2832); CX.fill();
  CX.restore();
}

/* =====================================================================
   MAIN DRAW
   ===================================================================== */
function draw(){
  const wrap = $('cvwrap');
  CX.clearRect(0, 0, wrap.clientWidth, wrap.clientHeight);
  CX.save();
  CX.translate(offX, offY);
  CX.scale(scale, scale);
  CX.beginPath(); CX.rect(0, 0, W, H); CX.clip();

  CX.fillStyle = cssVar('--stage');
  CX.fillRect(0, 0, W, H);

  CX.textAlign = 'center'; CX.textBaseline = 'middle';
  const t = S.t[S.era];
  if      (S.era === 0) drawDalton(t);
  else if (S.era === 1) drawThomson(t);
  else if (S.era === 2) drawRutherford();
  else                  drawBohr(t);

  CX.restore();
}

/* =====================================================================
   LOOP
   ===================================================================== */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000; last = now;
  /* the first rAF timestamp can PRE-DATE the performance.now() captured at parse
     time, so dt must be clamped at both ends or every clock starts negative     */
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;

  if (S.playing) S.t[S.era] += dt * S.speed;
  if (S.era === 2) updateRutherford(dt);

  /* story auto-advance */
  if (S.story && S.playing){
    S.storyTimer += dt * S.speed;
    if (S.storyTimer >= STORY_DWELL){
      S.storyTimer = 0;
      if (S.era < 3){ setEra(S.era + 1, true); }
      else { S.story = false; syncStoryBtn(); updateChips(); }
    }
  }
  if (S.era === 0 || S.era === 2) updateChips();   /* live: compound / stats */
  draw();
  requestAnimationFrame(frame);
}

/* =====================================================================
   UI
   ===================================================================== */
function setEra(i, keepStory){
  if (!keepStory && S.story){ S.story = false; syncStoryBtn(); }
  S.era = i;
  resetEra();
  updatePanels();
}
function resetEra(){
  S.t[S.era] = 0;
  S.warn = '';
  if (S.era === 2){
    S.alphas = []; S.flashes = []; S.spawnAcc = 0;
    S.stats = { passed: 0, deflected: 0, bounced: 0 };
  }
  updateChips();
}
function syncStoryBtn(){
  const b = $('btnStory');
  b.textContent = S.story ? '⏸ Pause Story' : '▶ Story';
  b.classList.toggle('on', S.story);
}
function syncPlayBtn(){
  const b = $('btnPlay');
  b.textContent = S.playing ? '⏸ Pause' : '▶ Play';
  b.classList.toggle('on', !S.playing);
}

[].forEach.call(document.querySelectorAll('.eratab'), b => {
  b.addEventListener('click', () => setEra(+b.dataset.era, false));
});
$('btnParticles').addEventListener('click', function(){
  S.showParticles = !S.showParticles; this.classList.toggle('on', S.showParticles);
});
$('btnLabels').addEventListener('click', function(){
  S.showLabels = !S.showLabels; this.classList.toggle('on', S.showLabels);
});
$('btnAngles').addEventListener('click', function(){
  S.showAngles = !S.showAngles; this.classList.toggle('on', S.showAngles);
});
$('btnField').addEventListener('click', function(){
  S.showField = !S.showField; this.classList.toggle('on', S.showField);
});
$('btnStory').addEventListener('click', () => {
  if (S.story){ S.story = false; }
  else {
    S.story = true; S.storyTimer = 0;
    if (!S.playing){ S.playing = true; syncPlayBtn(); }
    setEra(0, true);
  }
  syncStoryBtn(); updateChips();
});
$('btnReset').addEventListener('click', () => { resetEra(); updateChips(); });
$('btnPlay').addEventListener('click', () => {
  S.playing = !S.playing;
  if (S.playing) S.warn = '';
  syncPlayBtn(); updateChips();
});
$('btnBurst').addEventListener('click', () => { if (S.era === 2) fireBurst(); });
[].forEach.call(document.querySelectorAll('#speedPills .pill'), p => {
  p.addEventListener('click', () => {
    S.speed = parseFloat(p.dataset.sp);
    [].forEach.call(document.querySelectorAll('#speedPills .pill'), q => q.classList.remove('active'));
    p.classList.add('active');
  });
});
$('themeSel').addEventListener('change', e => applyTheme(e.target.value));

function applyTheme(v){
  document.body.className = (v === 'dark') ? '' : 'theme-' + v;
  try { localStorage.setItem('atomicModelsTheme', v); } catch (err) {}
  $('themeSel').value = v;
}
/* ---------- collapsible below-canvas panels ----------------------------
   Folding a panel only changes the height of content inside the scrolling
   .below area — the canvas is sized from the window alone, so it cannot
   move. Fold Model Features and the Info panel rises into view.          */
function setPanelOpen(pn, open){
  pn.classList.toggle('collapsed', !open);
  pn.querySelector('.phead').setAttribute('aria-expanded', open ? 'true' : 'false');
  try { localStorage.setItem('atomicPanel_' + pn.id, open ? '1' : '0'); } catch (err) {}
}
[].forEach.call(document.querySelectorAll('.below .panel'), pn => {
  pn.querySelector('.phead').addEventListener('click', () => {
    setPanelOpen(pn, pn.classList.contains('collapsed'));
  });
});

document.addEventListener('keydown', e => {
  /* BUTTON is excluded so Space on a focused panel header (or toolbar
     button) activates that button instead of also toggling Play          */
  if (e.target && /INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;
  if (e.code === 'Space'){ e.preventDefault(); $('btnPlay').click(); }
  else if (e.code === 'ArrowRight'){ e.preventDefault(); setEra(Math.min(3, S.era + 1), false); }
  else if (e.code === 'ArrowLeft'){  e.preventDefault(); setEra(Math.max(0, S.era - 1), false); }
});

/* ---------- boot ---------- */
(function init(){
  let th = 'dark';
  try { th = localStorage.getItem('atomicModelsTheme') || 'dark'; } catch (err) {}
  applyTheme(th);
  [].forEach.call(document.querySelectorAll('.below .panel'), pn => {
    let v = '1';
    try { v = localStorage.getItem('atomicPanel_' + pn.id) || '1'; } catch (err) {}
    setPanelOpen(pn, v === '1');
  });
  syncPlayBtn(); syncStoryBtn();
  updatePanels();
  setupCanvas();
  requestAnimationFrame(frame);
})();

</script>
</body>
